      tags: [work-items]
      operationId: updateWorkItem
      summary: Changer les champs d'un ticket
      description: >-
        Les champs donnés remplacent les siens, `null` en retire un ; l'ensemble est validé par
        `metadata.inputs` du workflow épinglé. L'interpréteur l'apprend (`fields_changed`) : une date
        d'arrivée déplacée réarme l'action qui l'attend (S20-05).
