# Production : HA, images par digest (Kyverno l'exige), sandbox gVisor pour les runners.
global:
  domain: choregos.dev
  environment: prod
  fakes: false
  logLevel: INFO
  imagePullPolicy: IfNotPresent
choregos-api:
  replicaCount: 3
  autoscaling: { enabled: true, minReplicas: 3, maxReplicas: 12, targetCPUUtilizationPercentage: 70 }
  podDisruptionBudget: { enabled: true, minAvailable: 2 }
choregos-web:
  replicaCount: 3
choregos-orchestrator:
  runner:
    executor: tekton
  queues:
    - name: orchestrator
      replicas: 3
      resources: { requests: { cpu: 500m, memory: 1Gi }, limits: { cpu: "2", memory: 2Gi } }
    - name: executor
      replicas: 3
      resources: { requests: { cpu: 500m, memory: 1Gi }, limits: { cpu: "2", memory: 2Gi } }
    - name: tracker
      replicas: 2
      resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
    - name: memory
      replicas: 2
      resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
