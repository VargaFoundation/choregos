# Platform default values. Each environment overrides what concerns it
# in `choregos-infra/platform/overlays/<env>/values.yaml`.

global:
  domain: choregos.local
  # Overrides when the hosts do not follow `app.<domain>` / `api.<domain>` over HTTPS
  # (e.g. an internal HTTP ingress behind a VPN). Empty: derived from `domain`.
  publicUrl: ""
  apiUrl: ""
  imageRegistry: ghcr.io/vargafoundation
  imageTag: "0.21.0"
  imagePullPolicy: IfNotPresent
  # Images are referenced by digest in staging and prod (Kyverno policy).
  imageDigest: ""
  # Image pull secrets, for a private registry — an enterprise edition, a closed
  # Harbor mirror, a home-made image. Empty: all the images are public. The secret must
  # exist in the namespace; on a shared platform, it is usually the tenant's
  # base layer that sets it (for example from a secret store), not this chart.
  imagePullSecrets: []
  environment: dev
  # Edition announced by this deployment (ADR 0024). `community` is the default, and the most
  # restrictive: a single organization. `enterprise` requires enterprise edition images —
  # the API REFUSES to start if no enterprise plugin has declared itself, rather than looking
  # healthy and refusing the second organization weeks later.
  edition: community
  fakes: false
  # The cluster's Kubernetes version, as the API reads it to refuse a hosted agent's version below
  # 1.29, which cannot run its native sidecar (S41-16). Empty: the version Helm or Argo CD renders
  # for (`.Capabilities.KubeVersion`, the cluster's own on `helm install`). Set it when rendering
  # offline for an older cluster. The executor checks the API server itself at every start anyway.
  kubernetesVersion: ""
  # What runs agent stages (ADR 0072): one setting for the API and for the workers.
  # `agent_sandbox` (kubernetes-sigs/agent-sandbox) is the default of a real deployment; the
  # chart refuses to render without its operator. Every other executor is chosen here, by name:
  # `k8s_job` (a Job per stage), `tekton` (a PipelineRun per stage, only where Tekton runs),
  # `aca`, `local_docker`. Upgrading from <= 0.17, which defaulted to `tekton`: set `tekton`.
  runner:
    executor: agent_sandbox
    # NOT set by default, on purpose. The RuntimeClass (gVisor, Kata) of the `agent_sandbox` warm
    # pool's template and of the agent pods when the policy imposes none (`sandbox.runtime: gvisor`
    # takes precedence). Set here (`""` = the cluster's runtime), the API receives it too and tells
    # a project in `/readiness` that its policy asks for a runtime the pool does not run. Never set:
    # `choregos-orchestrator.runner.runtimeClass` still applies to the pool as before, but the API
    # treats the pool's class as unknown and judges nothing. Both set and different: refused.
    # runtimeClass: gvisor
    # What the API lets a project choose as its `runtime` connector. Empty: only `executor`.
    # Add `k8s_job` for the steps that name their own image.
    allowedExecutors: []
  # Secrets by reference (ADR 0034). A connector's `env:NAME` reference reads only the variables
  # matching `envPattern` (regular expression); empty: `^CONNECTOR_[A-Z0-9_]+$`. The platform's
  # own variables (`CHOREGOS_*`, `DATABASE_*`, `PG*`, `AWS_*`, `KUBERNETES_*`, `TEMPORAL_*`) are
  # refused whatever the pattern says. Given to the API and to each worker.
  secrets:
    envPattern: ""
  # Additional environment variables, given to the API, to each worker and to the migration Job
  # (through `choregos.commonEnv`). To enable a setting the chart does not know
  # yet — for example a plugin shipped inactive (`CHOREGOS_ESSAI_ONTOLOGIE: "1"`) — without forking the
  # chart. A variable already set by the chart is REFUSED at render time: two values for the same
  # name, Kubernetes keeps the last one without saying anything, and the chart's setting would be replaced
  # silently. Each entry has exactly one of `value` or `valueFrom` (refused otherwise); a secret is
  # mapped by `valueFrom.secretKeyRef`, never written as a plain `value` (S38-18).
  extraEnv: []
  #   - name: CHOREGOS_ESSAI_ONTOLOGIE
  #     value: "1"
  # OpenTelemetry GenAI traces (ADR 0018). The collector's OTLP/HTTP endpoint, given as
  # `OTEL_EXPORTER_OTLP_ENDPOINT` to the API, each worker, the migration Job and the embedded
  # gateway, whose callback puts each model call in its run's trace. Empty: tracing off, nothing
  # is exported. The bootstrap collector (`infra/bootstrap/otel-collector.yaml`) listens on
  # `http://otel-collector.monitoring.svc:4318`; `choregos-allow-platform` lets the platform's pods
  # reach port 4318 in the namespace the address names (`<service>.<namespace>.svc`, `monitoring`
  # when it names none; S40-20e). A Tempo that receives OTLP itself will do. The agent pods are not
  # given it: their only way out is the run's egress proxy.
  tracing:
    otlpEndpoint: ""
    # Tempo's query address (the bootstrap Tempo: `http://tempo.monitoring.svc:3200`). Set, it renders
    # the nightly ledger-vs-trace CronJob (`api.traceDrift`, ADR 0018 point 3) and opens that port,
    # in the namespace the address names, to the job's pods only. Empty: no job.
    tempoUrl: ""
  # Platform canary (S7-08). Disabled by default: it requires Argo Rollouts in the
  # cluster, and a chart that assumes an absent operator is a chart that does not install.
  # Environments that enable it do so in `values/staging.yaml` and `values/prod.yaml`.
  canary:
    enabled: false
    steps:
      - { weight: 10, pause: 5m }
      - { weight: 50, pause: 10m }
      - { weight: 100 }
    # `AnalysisTemplate` that decides to abort: without it, the canary just waits.
    analysis: ""
  # Playbooks brought by the DEPLOYMENT (a ConfigMap, one key per role: `<role>.md`),
  # mounted in the workers and read before those of the package. This is what allows using the
  # engine outside software — a `sourcing`, `instruction_dossier` role — or adapting an existing
  # role to a house, without touching the platform.
  playbooks:
    configMap: ""
    mountPath: /etc/choregos/playbooks
  # Tool catalog: third-party APIs that the PLATFORM calls for an agent, key
  # kept server-side. A ConfigMap (the catalog, readable in PRs) and a Secret (the
  # providers' keys, injected into the API). Empty = no tool, and that is the default.
  # A project then declares what it is allowed to call (`tools` in its configuration).
  # Workflow templates brought by the deployment, in addition to the package's three. A
  # deployment template takes precedence over the package's, as with playbooks; this is
  # how a trade brings its state sequences without rewriting the platform. Empty:
  # only the three shipped ones exist.
  workflowTemplates:
    configMap: ""
    mountPath: /etc/choregos/workflow-templates
  toolCatalog:
    configMap: ""
    mountPath: /etc/choregos/outils
    fileName: catalogue.yaml
    #: Secret whose ALL keys become environment variables of the API:
    #: this is where the providers' keys live, never in the catalog.
    credentialsSecret: ""
  # What THIS deployment can run: a new project inherits it when its request says
  # nothing (#245). Empty: the contract decides (`claude-code`, no model profile). A tenant that
  # serves opencode behind the platform's gateway says so here, without which the agents of a
  # template never reach their model.
  agents:
    defaultBackend: ""
    allowedBackends: []
    # profile → gateway model: `{ standard: platform/standard }`
    modelProfiles: {}
  # The images an operator names for job steps (`jobs`) and for agents written in code (`agents`),
  # as `name: reference` (ADR 0056, ADR 0063). A workflow or an agent version names an image, never
  # pulls one; each image is built FROM the runner image. `requireDigest` refuses, at start-up, a
  # reference that is not pinned by `@sha256:`; set it to false only on a bench.
  images:
    jobs: {}
    agents: {}
    requireDigest: true
    # Hosted agents (ADR 0080): the registry prefixes an agent version's image may come from, matched
    # by path segment (`ghcr.io/acme` covers `ghcr.io/acme/triager`, not `ghcr.io/acme-evil`). Empty:
    # no image source is accepted. Publication pins the tag to the digest the registry serves.
    hostedRegistries: []
    # Signatures of hosted images: off | warn (publish, log `hosted.signature_unverified`) | enforce.
    hostedCosign: "off"
    # Who may sign a hosted image (S41-14), one of: the name of a Secret of the release's namespace
    # holding the operator's public key under `cosign.pub` (mounted on the API, named to Kyverno), or
    # keyless, the certificate identity and its OIDC issuer as regular expressions, matched whole by
    # the API (`^https://github\.com/acme/.+$`). Under `enforce` with neither, every image is refused.
    hostedCosignKeySecret: ""
    hostedCosignIdentity: ""
    hostedCosignIssuer: ""
    # false: cosign does not check the transparency log, for a key whose signatures were never
    # uploaded to Rekor (an air-gapped registry).
    hostedCosignTlog: true
    # The signature format Kyverno's admission check reads (S41-25b): `bundle`, cosign 3's default (an
    # OCI referrer), or `legacy`, the `.sig` tag of `cosign sign --new-bundle-format=false`. Kyverno
    # reads one of them per policy, so an image signed only in the other format is refused at
    # admission. The API's own check (cosign 3) reads both.
    hostedCosignFormat: bundle
    # Renders the `choregos-hosted-images` Kyverno ClusterPolicy: in `proj-*` and `choregos-*`, a
    # container, init container or native sidecar whose image is under `hostedRegistries` runs only
    # pinned by `@sha256:` and, under `enforce`, signed by the signer above. Requires Kyverno.
    hostedCosignPolicy: false
    # With a key Secret, the policy has Kyverno read it at admission: this renders the Role and
    # RoleBinding (that one Secret, `get`) for Kyverno's admission controller (S41-25). false: the
    # platform team grants it; `hostedCosignKyverno` names the ServiceAccount if it is not this one.
    hostedCosignKyvernoGrant: true
    hostedCosignKyverno: { namespace: kyverno, serviceAccount: kyverno-admission-controller }
    # Hosted zips (ADR 0080 §9): the repository the platform pushes the images it builds to, as
    # `registry/path` (tagged `build-<key>`, run by digest). Empty: a zip version publishes, and its
    # build fails with the reason. The orchestrator's executor worker pushes there.
    buildRegistry: ""
    # buildkit (`buildctl` against a `buildkitd`) | local_docker (`docker build` + `push`, a laptop).
    # With `buildkit` and a `buildRegistry`, the chart deploys its own rootless `buildkitd`
    # (`global.buildkitd`, S41-13); `buildkitAddress` names another one instead, and the chart then
    # deploys none.
    hostedBuilder: buildkit
    buildkitAddress: ""
  # The `buildkitd` that builds hosted zips (S41-13, ADR 0080 §9), rendered only when
  # `images.hostedBuilder` is `buildkit`, `images.buildRegistry` is set and `images.buildkitAddress`
  # is empty. Rootless: uid 1000, no service account token, every capability dropped but SETUID and
  # SETGID; its user namespaces need seccomp and AppArmor `Unconfined` and privilege escalation (the
  # setuid `newuidmap`), which is why it runs in a pod of its own that takes traffic from the
  # orchestrator only and reaches the Internet, never the platform (docs/security.md).
  buildkitd:
    enabled: true
    # The image's `buildctl` is the one the worker image copies (docker/api.Dockerfile): bump both.
    image: moby/buildkit:v0.33.1-rootless@sha256:f8a833b2de9d68e27f0815e4a737abdfaf8a2e4c615650557df11025101557b4
    port: 1234
    # A `kubernetes.io/dockerconfigjson` Secret: the push credential of `buildRegistry`, the only
    # credential the builder holds. Empty: the registry takes anonymous pushes (a bench).
    pushSecret: ""
    # Mutual TLS between the worker and the daemon, from two `kubernetes.io/tls` Secrets that carry
    # `ca.crt` too (cert-manager writes them so): the daemon's, and the worker's client one. Without
    # them the gRPC is plain, and the NetworkPolicy alone keeps other pods off it.
    tls:
      serverSecret: ""
      clientSecret: ""
    # The Internet ports the builder may reach (`pip install`, base images), outside private ranges.
    egressPorts: [443, 80]
    # Private ranges the build registry lives in, when it is inside the cluster or the network.
    registryCidrs: []
    registryPorts: [443, 5000]
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits: { cpu: "2", memory: 4Gi, ephemeral-storage: 20Gi }
  # Network egress, one model (ADR 0066 and ADR 0070, amended): the organisation decides in the
  # console which hosts it OPENS (its egress allowlist) and the BOUNDS nothing may cross (its policy
  # ceiling's network section); this block is what only the operator sets. It lives under `global`
  # because the API and the orchestrator read it too.
  egress:
    # The organisation egress allowlist (S39-22, ADR 0066), as the platform's own outbound clients
    # (API, workers) enforce it: enforce | warn (log `egress.would_refuse` and pass) | off. The
    # organisation's network bounds (deny list, allowed set) are enforced in every mode.
    mode: enforce
    # What the cluster's network lets through, per pod family, as host patterns. An absent or empty
    # family is unknown: the ceiling is not checked and the organisation's list alone governs.
    #   ceiling:
    #     api: [api.github.com, github.com]
    #     workers: [api.github.com, "*.atlassian.net"]
    #     runners: [github.com, pypi.org]
    ceiling: {}
    # How the console renders "what the platform must still open" for a host the ceiling excludes
    # (or does not know). Choregos cannot change the cluster's network policy: it shows the change.
    #   platformChange:
    #     format: text            # cilium-fqdn | kubernetes-networkpolicy | text
    #     owner: "the platform team, #platform"
    #     template: "add {{hosts_csv}} to the {{family}} egress"   # mustache: see docs/deployment.md
    #     issueUrl: ""            # optional, same placeholders, URL-encoded
    #     entries: {}             # family -> the name of the platform's egress entry, as template data
    platformChange: {}
    # The per-run egress proxy `choregos-egress` (ADR 0070), in the release namespace, from the API
    # image. A runner presents its run id and token as proxy credentials; the proxy asks the API what
    # THAT run may reach (its effective network, the hosts the organisation opened for its runners
    # included) and lets a tunnel through or refuses. Off by default: nothing changes for an existing
    # install. When on, `choregos-orchestrator.runner.egressProxy` MUST name it (the chart refuses
    # otherwise) and the orchestrator tells runners to authenticate (`CHOREGOS_RUNNER_EGRESS_AUTH=run`).
    enabled: false
    # Rates are counted per replica: keep one replica unless a rate that is N times looser is fine.
    replicas: 1
    port: 3128
    healthPort: 8081
    # Destination ports a tunnel may open (CONNECT 443 and plain HTTP 80).
    ports: [443, 80]
    # Hosts no run may reach, for the whole deployment, whatever an organisation or a project says.
    # The API reads the same list (`CHOREGOS_NETWORK_INSTANCE_DENY`).
    denyDomains: []
    # How long a run's network is cached before the API is asked again.
    cacheSeconds: 60
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 500m, memory: 256Mi }
  logLevel: INFO
  # Anti-affinity between the replicas of a same component: `soft` (preferred), `hard`
  # (one replica per node, otherwise no pod) or `none`.
  antiAffinity: soft
  serviceAccount:
    annotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile: { type: RuntimeDefault }
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: { drop: ["ALL"] }
  database:
    # `true`: the chart deploys a single-instance PostgreSQL (bench, demo). `false`: it
    # consumes the one described below. Same logic for the next three dependencies.
    embedded: false
    host: choregos-pg-rw.choregos-data.svc
    port: 5432
    name: choregos
    # Administration role of the embedded PostgreSQL (POSTGRES_USER, superuser).
    user: choregos
    # Role the API and the orchestrator connect to the EMBEDDED PostgreSQL with: created
    # without SUPERUSER at initdb, because a superuser ignores RLS and
    # organization isolation then does not exist. The API refuses a superuser in
    # staging/prod. With an external database (`secretRef`, key `url`), the URL decides.
    appUser: choregos_app
    secretRef: choregos-db
    # Instead of `secretRef` (key `url`): the secret of an operator that carries only the
    # password (Zalando: `<user>.<cluster>.credentials.postgresql.acid.zalan.do`).
    passwordSecret: ""
    # Connection pool of EACH process (API replica, worker): at most
    # size + maxOverflow connections, a bounded wait beyond that. Size PostgreSQL's
    # `max_connections` accordingly: (API replicas + workers) × (size + maxOverflow).
    pool:
      size: 10
      maxOverflow: 5
      timeoutSeconds: 10
  temporal:
    embedded: false
    address: temporal-frontend.choregos-temporal.svc:7233
    namespace: default
  gateway:
    # The gateway adapter: `litellm` (default), `openai-compatible` (discovery only), `direct`.
    type: litellm
    embedded: false
    url: http://litellm.choregos-gateway.svc:4000
    # Gateway secret (key `master-key`). Empty with `embedded: true`: the chart
    # generates one, stable from one update to the next.
    secretRef: choregos-gateway-secrets
  memory:
    embedded: false
    url: http://ecphoria.choregos-memory.svc:8432
    # Secret (key `token`) of a memory that requires an API key. Empty: no header.
    tokenSecret: ""
  objectStore:
    url: s3://choregos
    # The S3 endpoint of an S3-compatible store (RustFS, MinIO, Ceph); empty means AWS (ADR 0049).
    endpoint: ""
    region: us-east-1
    # Secret with the keys `access-key` and `secret-key`. Only the API reads and writes the
    # store; a runner never receives these keys. Empty: no signature (an open or IAM-bound store).
    secretRef: ""
  oidc:
    issuer: https://keycloak.choregos.local/realms/choregos
    clientId: choregos
    secretRef: choregos-oidc
    # Organization to attach the NON-prefixed OIDC groups to (`developers`,
    # `org-admins`…). Empty: only `choregos:<org>:<group>` groups give a role.
    defaultOrg: ""
  # The MCP gateway as an OAuth resource server (ADR 0030, RFC 9728): the console's IdP issues the
  # tokens of Claude Code and claude.ai, with no token to paste. What the IdP must carry (scope
  # `choregos-mcp`, clients): docs/runbooks/keycloak-mcp.md.
  mcp:
    oauth:
      enabled: false
      # Empty: the console's issuer (`global.oidc.issuer`). Set only for ANOTHER IdP.
      issuer: ""
      # The required audience of the gateway's tokens.
      audience: choregos-mcp
      # The clients the IdP has registered, per client of the Integrations page — the page derives
      # the exact command from them. `callbackPort`: the port of the registered `http://localhost:PORT/callback`.
      #   claude-code: { clientId: choregos-claude-code, callbackPort: 33418 }
      #   claude-ai: { clientId: choregos-claude-ai }
      clients: {}
  # Bootstrap of a new installation: the organization created at first start if it
  # is missing, and the e-mails that receive org_admin there. Idempotent. Without this, no route
  # nor any screen can create the first organization.
  bootstrap:
    org: ""
    orgName: ""
    admins: ""
  # Plugins (ADR 0093, docs/deployment.md#plugins): where they come from, which ones every organisation
  # gets, and the directory of plugins baked into the image. Rendered into the ConfigMap
  # `choregos-plugins` (`CHOREGOS_PLUGINS_CONFIG`); an unusable configuration stops the API at start-up.
  plugins:
    # Each source: an index (`oci://…` or `https://…/index.yaml`) and a trust policy, a keyless cosign
    # identity and issuer (regular expressions, matched whole), or `key:` a public key file mounted in
    # the API (`api.extraVolumes`). Never unsigned. `egress`: hosts its fetches may reach beyond the
    # index's own. `varga` is where the platform's own agents are published (ADR 0093 §6): signed by
    # the publish workflow of VargaFoundation/choregos-agents on main, and nothing else.
    sources:
      - name: varga
        index: oci://ghcr.io/vargafoundation/choregos-agents/index:latest
        trust:
          identity: https://github\.com/VargaFoundation/choregos-agents/\.github/workflows/publish\.yml@refs/heads/main
          issuer: https://token\.actions\.githubusercontent\.com
    # Installed in every organisation at start-up and at its creation, idempotently. One the gate sends
    # to a second administrator (a server, a high-risk skill) waits for that approval, unless the entry
    # says `preapproved: true`: listing it here is then the operator's approval, taken through the
    # review of this deployment's values, and the audit trail records it as such
    # (`plugin.default.preapproved`). The API never offers that flag. The source `offline` is the
    # directory below; a default of another source is taken from it when it holds a version in range
    # (no network at start-up), and upgraded from its source later.
    # The built-in agents (S43-09): `software-delivery` brings the MADR 4 skill, which links to
    # adr.github.io and is rated high risk, hence `preapproved`. Set `defaultPlugins: []` to install none.
    defaultPlugins:
      - { source: varga, name: software-delivery, version: "^1.0", preapproved: true }
      - { source: varga, name: netops, version: "^1.0", preapproved: true }
      - { source: varga, name: authoring, version: "^1.0", preapproved: true }
      - { source: varga, name: mcp-clients, version: "^1.0", preapproved: true }
    # A directory of plugins inside the image (air-gapped installs, demos, CI); empty: none. The API
    # image ships the built-in agents' plugins there, pinned by its `plugins.lock`.
    offline: /opt/choregos/plugins
    # Plugin servers (ADR 0096): the MCP servers plugins bring, run by the API as a Deployment, a
    # Service, a NetworkPolicy and a Secret per organisation and server, in their own namespace. Off: a
    # plugin that brings a server is refused. On: the chart grants the API a Role in that namespace only.
    servers:
      enabled: false
      namespace:
        name: choregos-plugins
        # Render the Namespace too; false when the platform team lays it down.
        create: false
      # Where a server's image may come from, as registry or repository prefixes matched by path
      # segment (the rule of `global.images.hostedRegistries`). Empty: no server runs. Images are
      # pinned by digest (the plugin contract) and signed per `global.images.hostedCosign`.
      #   registries: [ghcr.io/vargafoundation/choregos-agents]
      registries: []
      # The RuntimeClass of the servers' pods; empty: `global.runner.runtimeClass`, else the cluster's.
      runtimeClass: ""
      # networkpolicy: egress to public addresses on the configured ports (Kubernetes cannot name a
      # host); cilium: a CiliumNetworkPolicy that names the exact hosts (`toFQDNs`).
      egress: networkpolicy
      resources:
        limits: { cpu: 500m, memory: 512Mi }
  # Development login (`/auth/login?as=<email>`), without an IdP. NEVER in production:
  # the API refuses it by itself in staging/prod. `adminEmails`: who receives ORG_ADMIN.
  devLogin:
    enabled: false
    adminEmails: ""
  # `false` for a tenant that has no right to any cluster-scoped resource (AppProject
  # `clusterResourceWhitelist: []`): the PipelineRun read ClusterRole is not rendered.
  rbac:
    clusterScoped: true
    # Role + RoleBinding (namespace) allowing the orchestrator to launch its agent Jobs.
    # On a shared platform, it is the platform that lays it down: leave `false`.
    jobRunner: false
  # The secret that carries the API's values: session secret, run-token signing
  # key, GitHub App. The orchestrator reads the SAME signing key there — it is the one
  # that issues the tokens, the API only verifies them.
  apiSecretRef: choregos-api-secrets
  # Local bench only: the chart itself writes the application secrets (see
  # templates/secrets-embarques.yaml). Never true in production.
  devSecrets: false
  # Connector secrets typed in the console are sealed in the database under a key the DEPLOYMENT
  # holds (ADR 0058): `CHOREGOS_SECRETS_KEKS="k2:<base64 of 32 bytes>,k1:<...>"`, the first key
  # seals, the others only open. Without it the API runs, references (`env:NAME`) keep working,
  # and typing a secret answers 409 naming the missing key. Generate one with
  # `python -c "import os,base64;print('k1:'+base64.b64encode(os.urandom(32)).decode())"`.
  secrets:
    # The Secret that carries the key; empty: `apiSecretRef` (the key is then one more entry of it).
    keksSecretRef: ""
    # Its entry. Optional in the pod spec: absent, the feature is off, the pod still starts.
    keksKey: secrets-keks
    # Also list the entry in the chart's ExternalSecret (`remoteRef` choregos/api). Off by default:
    # a missing remote property would make the whole ExternalSecret fail, so turn it on once the
    # key exists in the store.
    keksInExternalSecret: false
  externalSecrets:
    enabled: true
    storeRef: choregos-cluster-store
    refreshInterval: 1h

choregos-api:
  enabled: true
  # Ex. : [{ip: "172.16.3.2", hostnames: ["sso.shared.diametral.com"]}]
  hostAliases: []
  replicaCount: 2
  image:
    repository: choregos-api
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  migrations:
    enabled: true
    # `post-install,post-upgrade` when the database is embedded (it does not exist before).
    hook: pre-install,pre-upgrade
    # Wait for the database before migrating (init container).
    waitForDatabaseSeconds: 300
  ingress:
    enabled: true
    # `httproute` (Gateway API) or `ingress` (networking.k8s.io) when the cluster has no
    # Gateway API — `className` only serves `ingress`.
    kind: httproute
    className: ""
    hostnames: ["api.choregos.local", "hooks.choregos.local"]
    gateway: choregos-gateway

choregos-web:
  enabled: true
  replicaCount: 2
  image:
    repository: choregos-web
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  ingress:
    enabled: true
    kind: httproute
    className: ""
    hostnames: ["app.choregos.local"]
    gateway: choregos-gateway

choregos-orchestrator:
  enabled: true
  image:
    repository: choregos-orchestrator
  # After losing a node, a worker waits this delay before being evicted (Kubernetes default:
  # 300 s, i.e. ~6 minutes of immobility — see `tests/cluster/test_node_loss.py`).
  unreachableTolerationSeconds: 20
  # One deployment per task queue: slow external calls do not choke the decision loop.
  queues:
    - name: orchestrator
      replicas: 2
      resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
    - name: executor
      replicas: 2
      resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
    - name: tracker
      replicas: 2
      resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
    - name: memory
      replicas: 1
      resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
  runner:
    image: choregos-runner
    # Empty: the tag follows `global.imageTag`. DO NOT REMOVE this line — without it, the
    # sub-chart's default takes over again and the agents' image goes back to `1.0.0`, absent from every
    # installation. It happened on 2026-09-27: a slightly broad cut removing a
    # neighboring setting, and `helm-unittest` caught it on `global.imageTag: 9.9.9` → `…-runner:1.0.0`.
    tag: ""
    # Empty: follows the executor, the release namespace for `agent_sandbox` (its template
    # lives there), `proj-{slug}-runners` for the others. A value here always wins.
    namespacePattern: ""
    # Simultaneous runs per namespace. Beyond that, the Job waits WITHOUT a pod (`spec.suspend`),
    # in order of arrival: a spike of tickets no longer turns into a spike of
    # pods all pulling the same image. 0 = no ceiling.
    maxActive: 0
    # Leave empty: `global.runner.executor` decides. A different value is refused at render.
    executor: ""
    # Skip the render-time check that the agent-sandbox operator is installed, for an offline
    # rendering (CI, a preview). Never needed under Argo CD or `helm install`.
    skipOperatorCheck: false
    # `agent_sandbox` only (ADR 0072): the executor that runs a step naming its own image, since a
    # warm pool is made from one image. Add it to `global.runner.allowedExecutors` too. Empty: refused.
    customImageExecutor: k8s_job
    # What each agent pod receives in addition. `env` carries plain values (never a
    # secret); `envFromSecrets` lists the namespace's Secrets, mounted by reference —
    # this is how a backend token or git credentials get through.
    env: {}
    envFromSecrets: []
    # Ceiling of each runner pod (`k8s_job` executor). Keep it under the namespace's
    # LimitRange: beyond it, the pod is refused and the Job waits without a message.
    limits:
      cpu: "2"
      memory: 6Gi
    # The pool's RuntimeClass. Prefer `global.runner.runtimeClass`, which the API reads too (this
    # value alone leaves `/readiness` unable to judge a gVisor policy). Both set: they must agree.
    runtimeClass: ""
    # `executor: agent_sandbox` only (ADR 0016; needs the agent-sandbox operator and a
    # `namespacePattern` naming this namespace). `warmPool.size` sandboxes wait, made from the
    # template and never used, holding no credential; 0 = every run cold-starts from the
    # template. `runtimeClass` above is the template's: a policy asking for another one is
    # refused by the executor, never silently ignored.
    warmPool:
      size: 0
    sandbox:
      # The workspace volume a suspended sandbox keeps across a human question.
      storage: 10Gi
      storageClassName: ""
      # Where a warm runner listens for its one assignment (run id, token, environment).
      assignmentPort: 8765
      # How long a finished run's sandbox keeps its volume before the controller deletes it.
      # Each one counts against the namespace's quota until then: at 3600, one ticket's six
      # stages filled a 10-PVC, 50Gi tenant quota, and the next claim found no volume.
      ttlSecondsAfterFinished: 300
      # `choregos-runner-assignment`, the NetworkPolicy that lets only the `executor` workers
      # reach that port (ADR 0053). `false` only where the platform owns the namespace's
      # NetworkPolicies and refuses a tenant's (an Argo CD AppProject that blacklists them):
      # the platform then holds that promise itself, or nobody does.
      assignmentNetworkPolicy: true
    # Context reduction (ADR 0055): rtk filters shell output, headroom compresses tool results.
    # `enabled: false` refuses both to every run; `true` lets each project's policy decide, and a
    # policy without `context` reduces nothing.
    contextReduction:
      enabled: true
    # The egress proxy through which EACH agent pod gets out (`HTTP_PROXY`/`HTTPS_PROXY`),
    # `{namespace}` = the runners'. In per-project runner namespaces the provisioning deploys a Squid
    # there whose allowlist is `policy.sandbox.network.allow_domains` (project-level, host-level);
    # without an allowed domain, no proxy and no egress. With `global.egress.enabled` the per-run proxy
    # `choregos-egress` serves the RELEASE namespace (the `agent_sandbox` executor's), and this value
    # must name it: `http://choregos-egress.<release-namespace>.svc:3128`. Empty: no proxy (local bench).
    egressProxy: "http://choregos-egress.{namespace}.svc:3128"
    # Its image, to be pinned by digest where Kyverno requires it. Empty: the one from `gitops.py`.
    egressImage: ""
  # One budget per queue with more than one replica.
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

choregos-tools:
  enabled: true
  image:
    repository: choregos-tools
  # The sidecar image is published here; the Tekton Task references it in each project.
  publishTask: true

monitoring:
  # `prometheus` renders `monitoring.coreos.com` objects; `victoriametrics` renders
  # `operator.victoriametrics.com/v1beta1` ones. An operator that does not know the type does not see
  # it: on a VictoriaMetrics platform, a ServiceMonitor is an INERT object — the
  # deployment looks monitored and is not. Observed on a real tenant on 2026-09-26.
  flavour: prometheus
  serviceMonitor: true
  dashboards: true
  # Annotations set on each dashboard ConfigMap. The Grafana sidecar files a
  # dashboard in the folder named by its `folderAnnotation` (often `grafana_folder`);
  # without an annotation, it lands in `General`, mixed with the platform's own.
  # Ex. `{grafana_folder: choregos}`.
  dashboardAnnotations: {}
  alerts: true

# The HR scenario fakes served by a single process (S20-07): MCP for the fleet, the carrier,
# the badge readers and the supplier's agent, and a fake Microsoft Graph. A demonstration:
# refused in staging and prod. The organization's connectors designate them by
# `http://choregos-demo-fakes:<port>/{mdm,shipping,access_control,fournisseur}/mcp` and, for `entra`,
# `graph_url: …/graph/v1.0` and `login_url: …/login`.
demoFakes:
  enabled: false
  port: 8090
  # { name: <secret>, key: <key> }: the MCP servers' token and the fake Graph's secret.
  tokenSecret: null
  resources:
    requests: { cpu: 20m, memory: 96Mi }
    limits: { cpu: 200m, memory: 256Mi }

# Netops (ADR 0052): the read-only identity of the `cilium` connector — a service account allowed
# get/list/watch on CiliumNetworkPolicy and CiliumClusterwideNetworkPolicy, nothing else. Off by
# default. To use it, map its token into the API and workers and reference it from the connector:
#   global.extraEnv: [{name: CONNECTOR_CILIUM_READER_TOKEN, valueFrom: {secretKeyRef:
#     {name: choregos-netops-cilium-reader-token, key: token}}}]
#   connector `cilium`: secret_refs: {token: env:CONNECTOR_CILIUM_READER_TOKEN}
netops:
  ciliumReader:
    enabled: false
    name: choregos-netops-cilium-reader
    # create a `kubernetes.io/service-account-token` Secret for it
    tokenSecret: true

networkPolicies:
  enabled: true
