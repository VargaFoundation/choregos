# SPDX-License-Identifier: Apache-2.0
# Phase 0 trial, element 9: the trial's integrated stack, started by `docker compose up`.
#
# The Choregos core with the ontology extension (migrations, API, orchestrator), PostgreSQL,
# Temporal, and the lakehouse of element 7 (Lakekeeper, MinIO). The images are built by
# `run.sh`, which also generates the key pair of the run tokens. Development credentials
# only, never anywhere else.
name: trial-foundation

include:
  - ../lakehouse/compose.yaml

x-choregos: &choregos
  CHOREGOS_ENV: dev
  # The application role is NOT a superuser (initdb/): RLS applies to it.
  CHOREGOS_DATABASE_URL: postgresql+asyncpg://choregos_app:trial-dev-only@choregos-db:5432/choregos
  CHOREGOS_TEMPORAL_ADDRESS: temporal:7233
  CHOREGOS_DEV_LOGIN_ENABLED: "true"
  CHOREGOS_DEV_ADMIN_EMAILS: admin@varga.dev
  CHOREGOS_BOOTSTRAP_ORG: varga
  CHOREGOS_SESSION_SECRET: trial-dev-only-not-a-secret
  CHOREGOS_RUN_TOKEN_PRIVATE_KEY: ${CHOREGOS_RUN_TOKEN_PRIVATE_KEY:?generated by run.sh}
  CHOREGOS_RUN_TOKEN_PUBLIC_KEY: ${CHOREGOS_RUN_TOKEN_PUBLIC_KEY:?generated by run.sh}
  CHOREGOS_API_URL: http://localhost:${TRIAL_API_PORT:-18190}
  CHOREGOS_PUBLIC_URL: http://localhost:${TRIAL_API_PORT:-18190}
  # The extension has shipped INACTIVE since 0.13.0: the trial turns it on, in the API, the migration
  # Job and the orchestrator - which plays its effects since S20-08.
  CHOREGOS_ONTOLOGY_TRIAL: "1"

services:
  choregos-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: choregos
      POSTGRES_PASSWORD: trial-dev-only
      POSTGRES_DB: choregos
    volumes: ["./initdb:/docker-entrypoint-initdb.d:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U choregos -d choregos"]
      interval: 2s
      retries: 30

  temporal:
    image: temporalio/auto-setup:1.26.2
    depends_on:
      choregos-db: {condition: service_healthy}
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: choregos
      POSTGRES_PWD: trial-dev-only
      POSTGRES_SEEDS: choregos-db
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 3s
      retries: 60
      start_period: 10s

  choregos-migrate:
    image: choregos-api:trial
    command: ["python", "-m", "choregos_api.migrate"]
    environment: *choregos
    depends_on:
      choregos-db: {condition: service_healthy}

  api:
    image: choregos-api:trial
    environment: *choregos
    ports: ["127.0.0.1:${TRIAL_API_PORT:-18190}:8000"]
    depends_on:
      choregos-migrate: {condition: service_completed_successfully}
      temporal: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 2s
      retries: 60

  worker:
    image: choregos-orchestrator:trial
    environment: *choregos
    depends_on:
      choregos-migrate: {condition: service_completed_successfully}
      temporal: {condition: service_healthy}
