{{- if and .Values.enabled .Values.publishTask }}
# La Task est publiée ici pour référence ; elle est **copiée dans chaque namespace projet**
# par le provisioning (Kustomize), car Tekton ne partage plus les ClusterTask.
apiVersion: v1
kind: ConfigMap
metadata:
  name: choregos-agent-stage-task
  labels: {{- include "choregos.labels" . | nindent 4 }}
data:
  image: {{ include "choregos.image" (dict "global" .Values.global "image" .Values.image) }}
  task.yaml: |
    apiVersion: tekton.dev/v1
    kind: Task
    metadata:
      name: choregos-agent-stage
    spec:
      params:
        - { name: run-id, type: string }
        - { name: api-url, type: string }
        - { name: runner-image, type: string }
      workspaces: [{ name: source }]
      results: [{ name: result-url }, { name: status }]
      steps:
        - name: run
          image: $(params.runner-image)
          workingDir: $(workspaces.source.path)
          script: |
            choregos-runner run \
              --write-result-url "$(results.result-url.path)" \
              --write-status "$(results.status.path)"
      sidecars:
        - name: choregos-tools
          image: {{ include "choregos.image" (dict "global" .Values.global "image" .Values.image) }}
{{- end }}
