{{- $name := printf "%s-litellm" .Release.Name }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels: {{- include "choregos.labels" . | nindent 4 }}
data:
  config.yaml: |
    model_list:
    {{- range .Values.models }}
      - model_name: {{ .alias }}
        litellm_params:
          model: {{ .model }}
          {{- with $.Values.upstream.apiBase }}
          api_base: {{ . }}
          {{- end }}
          {{- if $.Values.upstream.apiKeySecret }}
          api_key: os.environ/UPSTREAM_API_KEY
          {{- end }}
        {{- with .mode }}
        model_info: { mode: {{ . }} }
        {{- end }}
    {{- end }}
    litellm_settings:
      # Retire d'un appel les paramètres que le fournisseur cible ne connaît pas, au lieu
      # d'échouer — les générations de modèles ne s'accordent pas sur `temperature`.
      drop_params: true
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
      store_model_in_db: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "choregos.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: choregos-litellm
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: choregos-litellm
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: gateway
      annotations:
        checksum/config: {{ toJson .Values.models | sha256sum }}
    spec:
      # La règle Kyverno `non-root` est stricte depuis le 2026-09-25 : le contexte du pod est
      # exigé. L'image tourne en uid 1000 (vérifié : `python -c "import litellm"` sous
      # `--user 1000`) ; le proxy en service n'a pas encore été vu sous ce contexte sur le
      # banc, faute de clé de fournisseur.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: litellm
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom: { secretKeyRef: { name: {{ include "choregos.gatewaySecret" . }}, key: master-key } }
            {{- with .Values.upstream.apiKeySecret }}
            - name: UPSTREAM_API_KEY
              valueFrom: { secretKeyRef: { name: {{ . }}, key: api-key } }
            {{- end }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "choregos.databasePasswordSecret" . }}
                  key: password
            # Base DÉDIÉE : les clés virtuelles et leur consommation n'ont rien à faire dans
            # le schéma de Choregos. `sslmode=prefer` chiffre quand le serveur sait le faire,
            # sans exiger un certificat que le PostgreSQL du banc n'a pas.
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.global.database.user }}:$(DATABASE_PASSWORD)@{{ include "choregos.databaseHost" . }}:{{ .Values.global.database.port }}/{{ .Values.database.name }}?sslmode=prefer"
          ports:
            - { name: http, containerPort: 4000 }
          readinessProbe:
            httpGet: { path: /health/readiness, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /etc/litellm }
      volumes:
        - name: config
          configMap: { name: {{ $name }} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "choregos.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: choregos-litellm
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - { name: http, port: 4000, targetPort: http }
