# TEMPORARY, removed before the merge of S62-07: the five CLI targets built and smoke-tested on this
# pull request, with the steps of `release.yml` minus the signatures. `release.yml` only runs on a
# tag, and its images wait for these binaries: a target that does not build would stop a whole
# release, so each one is proven here first.
name: cli-binaries-trial

on:
  pull_request:
    paths:
      - ".github/workflows/cli-binaries-trial.yml"
      - "tools/cli_binary/**"

permissions:
  contents: read

concurrency:
  group: cli-binaries-trial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-binaries:
    name: cli binary (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: choregos-linux-x86_64, runner: ubuntu-24.04, build: --manylinux, smoke: --container debian:bookworm-slim }
          - { name: choregos-linux-arm64, runner: ubuntu-24.04-arm, build: --manylinux, smoke: --container debian:bookworm-slim }
          - { name: choregos-macos-arm64, runner: macos-15, build: "", smoke: "" }
          - { name: choregos-macos-x86_64, runner: macos-15-intel, build: "", smoke: "" }
          - { name: choregos-windows-x86_64.exe, runner: windows-2022, build: "", smoke: "" }
    env:
      NUITKA_CACHE_DIR: ${{ github.workspace }}/build/cli-binary/cache/nuitka
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        id: python
        with: { python-version: "3.12" }
      - uses: actions/cache@v5
        with:
          path: build/cli-binary/cache
          key: cli-binary-${{ matrix.name }}-${{ hashFiles('uv.lock', 'tools/cli_binary/requirements.txt') }}
          restore-keys: cli-binary-${{ matrix.name }}-
      - name: ccache (macOS)
        if: runner.os == 'macOS'
        run: brew install ccache
      - name: build
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          if [ -n "${{ matrix.build }}" ]; then
            python3 tools/cli_binary/build.py ${{ matrix.build }}
          else
            "$PYTHON" tools/cli_binary/build.py --python "$PYTHON"
          fi
          test -f "dist/cli/${{ matrix.name }}"
      - name: smoke test, where no Python is available
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' packages/cli/pyproject.toml)"
          "$PYTHON" tools/cli_binary/smoke.py "dist/cli/${{ matrix.name }}" \
            --expect-version "$version" ${{ matrix.smoke }}
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.name }}
          path: dist/cli/${{ matrix.name }}
          if-no-files-found: error
          retention-days: 1

  api-image:
    # What `release.yml` does next, without publishing: the checksums and the manifest of the five
    # binaries, then the API image built with them, and the files checked inside it.
    name: the API image carries the five binaries
    needs: cli-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-choregos-*
          merge-multiple: true
          path: dist/cli
      - name: SHA256SUMS and manifest.json
        run: |
          chmod 0755 dist/cli/choregos-*
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' packages/cli/pyproject.toml)"
          python3 tools/cli_binary/release.py dist/cli --version "$version"
          cat dist/cli/manifest.json
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api.Dockerfile
          target: api
          build-contexts: cli=dist/cli
          load: true
          tags: choregos-api:cli-trial
          cache-from: type=gha,scope=api-amd64
      - name: the image serves what was built
        run: |
          docker run --rm --entrypoint sh choregos-api:cli-trial -c \
            'cd /opt/choregos/cli && ls -l && sha256sum -c SHA256SUMS && ./choregos-linux-x86_64 --version && id -u'
