# Backlog Choregos — v3 (2026-09-18)
# Champs : id, title, stream, sprint, priority (1 = d'abord), size (S ≈ ½ j, M ≈ 1–2 j, L ≈ 3–5 j agent), depends_on, acceptance (critères vérifiables), notes.
# Une story = une PR. Les stories d'un même sprint et d'un même flux sont séquentielles ; les flux sont parallèles.

version: 1
streams:
  S0: "Contrats & socle"
  S1: "Orchestrateur Temporal"
  S2: "Runner, agents ACP, Tekton"
  S3: "Connecteurs GitHub"
  S4: "Gateway & coûts"
  S5: "Front"
  S6: "API"
  S7: "Plateforme Kubernetes & GitOps"
  S8: "Templates & provisioning"
  S9: "Release train & CD"
  S10: "Findings & mémoire (Choregos)"
  S11: "Ecphoria (repo VargaFoundation/ecphoria)"
  S12: "Évals & conformité"
  S13: "Multi-backend & second écosystème"

stories:

  # ───────────────────────── S0 — Contrats & socle ─────────────────────────
  - id: S0-01
    title: "Squelette du monorepo (uv workspaces, pnpm, Makefile, pre-commit, CODEOWNERS, AGENTS.md)"
    stream: S0
    sprint: 0
    priority: 1
    size: M
    depends_on: []
    acceptance:
      - "`make ci` passe sur un dépôt vide de code métier"
      - "AGENTS.md et CLAUDE.md (symlink) présents ; template de PR ; labels GitHub créés"
      - "Layout conforme à docs/plan/01 §1.2"
  - id: S0-02
    title: "packages/contracts — JSON Schemas Workflow, Policy, Project, StageInput, StageResult, InboundEvent, CloudEvents types"
    stream: S0
    sprint: 0
    priority: 2
    size: L
    depends_on: [S0-01]
    acceptance:
      - "Schémas 2020-12 valides ; exemples dans schemas/examples/ validés en CI"
      - "Règles statiques du DSL (§1.4) implémentées en tests de schéma ou dans core (S0-04)"
  - id: S0-03
    title: "packages/contracts — OpenAPI 3.1 complet (§1.8) + génération types Python (pydantic) et TS ; mock Prism"
    stream: S0
    sprint: 0
    priority: 3
    size: L
    depends_on: [S0-02]
    acceptance:
      - "`make contracts` régénère sans diff ; spectral lint vert"
      - "`pnpm mock:api` sert l'API mockée depuis l'OpenAPI"
  - id: S0-04
    title: "packages/core — parseur/validateur DSL + templates full-auto/default-simple/advanced + CLI `choregos workflow validate`"
    stream: S0
    sprint: 0
    priority: 4
    size: L
    depends_on: [S0-02]
    acceptance:
      - "Les 3 templates valident ; 12 cas invalides produisent des erreurs localisées (ligne/colonne)"
      - "`select_transition(state, outcome)` déterministe et testé"
  - id: S0-05
    title: "packages/core — policy engine (presets solo/team, budgets, approvals, attempts, résolution par taille/risque) + résolution des profils de modèles"
    stream: S0
    sprint: 0
    priority: 5
    size: M
    depends_on: [S0-02]
    acceptance:
      - "`Policy.budget_for(role,size)`, `approval_for(kind,size,risk)`, `resolve_model(profile,size)` couverts à 100 %"
  - id: S0-06
    title: "packages/adapters — interfaces Protocol (§1.9) + implémentations Fake* en mémoire avec scénarios scriptables"
    stream: S0
    sprint: 0
    priority: 6
    size: M
    depends_on: [S0-02]
    acceptance:
      - "Fakes pour tracker, scm, ci, cd, executor, memory, gateway, notify ; `CHOREGOS_FAKES=1` les injecte"
      - "Un test d'exemple fait traverser un WorkItem factice"
  - id: S0-07
    title: "dev/ — kind + Helmfile/Argo léger + Tilt + Keycloak + seed"
    stream: S0
    sprint: 0
    priority: 7
    size: L
    depends_on: [S0-01]
    acceptance:
      - "`make dev-up` < 15 min sur un poste 16 Go ; `make dev-seed` crée org/projet/tickets"
      - "`make dev-down` nettoie"
  - id: S0-08
    title: "CI monorepo (ci.yml ciblé par chemins, release.yml, nightly.yml squelette) + images de base signées"
    stream: S0
    sprint: 0
    priority: 8
    size: M
    depends_on: [S0-01]
    acceptance:
      - "PR de test déclenche uniquement les jobs des chemins modifiés"
      - "Images `runner-base`, `python-base` construites multi-arch et signées cosign sur main"
  - id: S0-09
