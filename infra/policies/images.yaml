# Les images de la plateforme et des runners sont signées par la fondation et référencées
# par digest. Une image non signée ne démarre pas — c'est un mécanisme, pas une consigne.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: choregos-verify-images
  annotations:
    policies.kyverno.io/description: >-
      Vérifie la signature cosign des images Choregos et impose la référence par digest.
spec:
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 30
  rules:
    - name: verifier-signature
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["choregos-*", "proj-*"]
      verifyImages:
        - imageReferences: ["ghcr.io/vargafoundation/choregos-*"]
          attestors:
            - entries:
                - keyless:
                    subject: "https://github.com/VargaFoundation/choregos/.github/workflows/*"
                    issuer: "https://token.actions.githubusercontent.com"
          mutateDigest: true
          required: true
        # Ecphoria est de la fondation mais pas de ce dépôt : ses images sont signées par les
        # workflows de `VargaFoundation/ecphoria`. Avec le seul motif ci-dessus, le glob
        # `ghcr.io/vargafoundation/*` attrapait `ghcr.io/vargafoundation/ecphoria` et exigeait
        # une signature émise par un dépôt qui ne l'a jamais produite — la mémoire de la
        # plateforme n'aurait pas démarré, et le message aurait parlé de signature manquante.
        - imageReferences: ["ghcr.io/vargafoundation/ecphoria*"]
          attestors:
            - entries:
                - keyless:
                    subject: "https://github.com/VargaFoundation/ecphoria/.github/workflows/*"
                    issuer: "https://token.actions.githubusercontent.com"
          mutateDigest: true
          required: true
    # Refuses an image that resolves to `latest`: an explicit `:latest` AND an image with no tag
    # and no digest at all (`nginx`, `ghcr.io/org/img`, `registry:5000/img`), which the runtime
    # pulls as `latest`. A digest (`img@sha256:...`, even `img:latest@sha256:...`) or a tag
    # (`img:1.2`) passes. A simple `*:*` wildcard cannot tell the port of `registry:5000/img` from
    # a tag, so this is a `deny` on a regular expression over the last path segment.
    # Init containers (native sidecars included) pull images too: second `foreach`, and
    # an empty-list default so a pod without any still passes.
    # Ephemeral containers (`kubectl debug`) are OUT of this rule on purpose: an operator
    # debugging a pod picks a throwaway tool image (`busybox`) and must not be blocked from it
    # during an incident; the pod's own images, the ones that run the workload, are judged here.
    - name: interdire-latest
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["choregos-*", "proj-*"]
      validate:
        message: "images must be referenced by digest or by version: never `latest`, never without a tag"
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                all:
                  - key: "{{ regex_match('^(([^@]*/)?[^/@:]+|[^@]*:latest)$', '{{ element.image }}') }}"
                    operator: Equals
                    value: true
          - list: "request.object.spec.initContainers || `[]`"
            deny:
              conditions:
                all:
                  - key: "{{ regex_match('^(([^@]*/)?[^/@:]+|[^@]*:latest)$', '{{ element.image }}') }}"
                    operator: Equals
                    value: true
