        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeBasePatch" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeBase" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/knowledge/{slug}/documents:
