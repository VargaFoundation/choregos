# Sets up the projects, their workflows and their tickets, then starts each ticket.
# Replayable: what exists is updated, never duplicated.
apiVersion: batch/v1
kind: Job
metadata:
  name: demo-seed
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: local/choregos-api:demo
          imagePullPolicy: Never
          workingDir: /app
          command: ["python", "/demo/seed.py", "--demarrer"]
          env:
            - { name: CHOREGOS_ENV, value: dev }
            # `litellm` (default): the projects go through the embedded gateway, one key per
            # run, cost counted. `direct`: the agent brings its own credentials, nothing is
            # counted. `make demo-seed GATEWAY=direct` replaces the value.
            - { name: DEMO_GATEWAY, value: "__GATEWAY__" }
            # Suffix of the ticket keys (`DEMO-1b`, `RH-1b`): a ticket has only one
            # interpreter, replaying the demonstration takes new tickets.
            - { name: DEMO_SERIE, value: "__SERIE__" }
            - name: CHOREGOS_GATEWAY_MASTER_KEY
              valueFrom: { secretKeyRef: { name: choregos-gateway, key: master-key, optional: true } }
            - { name: CHOREGOS_GATEWAY_URL, value: "http://choregos-litellm:4000" }
            - { name: CHOREGOS_TEMPORAL_ADDRESS, value: "choregos-temporal:7233" }
            - name: CHOREGOS_DATABASE_PASSWORD
              valueFrom: { secretKeyRef: { name: choregos-postgresql, key: password } }
            - name: CHOREGOS_DATABASE_URL
              value: postgresql+asyncpg://choregos:$(CHOREGOS_DATABASE_PASSWORD)@choregos-postgresql:5432/choregos
          volumeMounts:
            - { name: demo, mountPath: /demo }
      volumes:
        - name: demo
          configMap: { name: demo-seed }
