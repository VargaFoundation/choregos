{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: choregos-api
  labels: {{- include "choregos.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    app.kubernetes.io/name: choregos-api
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: choregos-api
  labels: {{- include "choregos.labels" . | nindent 4 }}
  annotations: {{- toYaml .Values.global.serviceAccount.annotations | nindent 4 }}
automountServiceAccountToken: true
{{- if .Values.global.rbac.clusterScoped }}
---
# The API only reads the state of projects' PipelineRuns: it creates nothing in the cluster.
# A tenant without cluster-scoped rights (`global.rbac.clusterScoped: false`) does without it:
# run state then reaches it through the executor's events, not through the Tekton API.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: choregos-api-read-runs
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns", "taskruns"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: choregos-api-read-runs
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: choregos-api-read-runs }
subjects:
  - kind: ServiceAccount
    name: choregos-api
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
