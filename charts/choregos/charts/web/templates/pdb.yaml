{{- /*
A PodDisruptionBudget on ONE replica blocks every node drain while protecting nothing:
it is only rendered from two replicas up, whatever `enabled` says.
*/ -}}
{{- if and .Values.enabled .Values.podDisruptionBudget.enabled (gt (int .Values.replicaCount) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: choregos-web
  labels: {{- include "choregos.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: choregos-web
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
