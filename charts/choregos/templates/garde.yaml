{{- /*
The guard of serious environments. The embedded dependencies (a single-instance PostgreSQL
without backup, a Temporal on SQLite, a single-replica gateway), the
secrets written by the chart and the development login are made for a bench.
This file renders nothing; in `staging` and `prod`, it STOPS the rendering if one of these
values is on, and names which one. Before: nothing forbade it, and the API only refused
the development login.
*/ -}}
{{- $g := .Values.global }}
{{- /*
The enterprise edition is distributed through a PRIVATE registry: that is the whole access control
(ADR 0024, decision 5 — no license key in phase 1). Announcing it without a pull secret
gives an `ImagePullBackOff` that never names the cause, and an operator looks on the
network side. It is said here, where the value is written.
*/ -}}
{{- if and (eq ($g.edition | default "community") "enterprise") (not $g.imagePullSecrets) }}
{{- fail "global.edition=enterprise requires global.imagePullSecrets: the enterprise edition images are in a private registry. Without a pull secret, the pods stay in ImagePullBackOff without saying why." }}
{{- end }}
{{- if not (has ($g.edition | default "community") (list "community" "enterprise")) }}
{{- fail (printf "global.edition=%s unknown: `community` or `enterprise`." $g.edition) }}
{{- end }}
{{- if has $g.environment (list "staging" "prod") }}
{{- $fautes := list }}
{{- if $g.database.embedded }}{{ $fautes = append $fautes "global.database.embedded" }}{{ end }}
{{- if $g.temporal.embedded }}{{ $fautes = append $fautes "global.temporal.embedded" }}{{ end }}
{{- if $g.gateway.embedded }}{{ $fautes = append $fautes "global.gateway.embedded" }}{{ end }}
{{- if $g.memory.embedded }}{{ $fautes = append $fautes "global.memory.embedded" }}{{ end }}
{{- if $g.devSecrets }}{{ $fautes = append $fautes "global.devSecrets" }}{{ end }}
{{- if ($g.devLogin | default dict).enabled }}{{ $fautes = append $fautes "global.devLogin.enabled" }}{{ end }}
{{- if ($.Values.demoFakes | default dict).enabled }}{{ $fautes = append $fautes "demoFakes.enabled" }}{{ end }}
{{- if $fautes }}
{{- fail (printf "global.environment=%s refused: %s. These values are those of a bench (values/local.yaml); a serious environment brings its own dependencies and secrets." $g.environment (join ", " $fautes)) }}
{{- end }}
{{- end }}
{{- /*
The per-run egress proxy exists to be used: runners reach it through `runner.egressProxy`. Rendering
the proxy with an empty value would leave a Deployment nobody sends traffic to, and every run would
still get out (or not) by the old path — silently. Say which value is missing.
*/ -}}
{{- $eg := $g.egress | default dict }}
{{- if $eg.enabled }}
{{- $runner := (index .Values "choregos-orchestrator" | default dict).runner | default dict }}
{{- if not $runner.egressProxy }}
{{- fail "global.egress.enabled=true needs choregos-orchestrator.runner.egressProxy (e.g. http://choregos-egress.<release-namespace>.svc:3128): the proxy would exist and no runner would use it." }}
{{- end }}
{{- end }}
