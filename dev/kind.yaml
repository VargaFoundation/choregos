# Cluster de développement : un plan de contrôle, deux workers dont un « runners ».
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: choregos
networking:
  # kindnet n'applique pas les NetworkPolicy : sans CNI qui les fait respecter, le bac à
  # sable des runners est une intention. Calico est installé par `make cluster-up`.
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - { containerPort: 30080, hostPort: 8080, protocol: TCP }   # Gateway HTTP
      - { containerPort: 30300, hostPort: 3000, protocol: TCP }   # front
      - { containerPort: 30800, hostPort: 8000, protocol: TCP }   # API
      - { containerPort: 30808, hostPort: 8088, protocol: TCP }   # Temporal UI
  - role: worker
    labels: { role: platform }
  - role: worker
    labels: { role: runners }
