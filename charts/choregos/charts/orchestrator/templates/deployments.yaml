{{- if .Values.enabled }}
{{- $root := . }}
{{- range .Values.queues }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: choregos-orchestrator-{{ .name }}
  labels: {{- include "choregos.labels" $root | nindent 4 }}
    app.kubernetes.io/component: orchestrator
    choregos/queue: {{ .name }}
spec:
  replicas: {{ .replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: choregos-orchestrator
      choregos/queue: {{ .name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: choregos-orchestrator
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        choregos/queue: {{ .name }}
    spec:
      serviceAccountName: choregos-orchestrator
      {{- include "choregos.antiAffinity" (dict "global" $root.Values.global "labels" (dict "app.kubernetes.io/name" "choregos-orchestrator" "choregos/queue" .name)) | nindent 6 }}
      # Un nœud qui disparaît (éviction spot, panne matérielle) n'est remarqué qu'au bout d'une
      # cinquantaine de secondes, et le défaut de Kubernetes laisse ensuite la pod **cinq minutes**
      # accrochée à ce nœud mort avant de l'évincer. Mesuré sur cluster : 359 s d'immobilité avec
      # les défauts, 74 s avec ces tolérances (`tests/cluster/test_node_loss.py`).
      #
      # Un worker est remplaçable et son travail est repris par Temporal : rien ne justifie de
      # l'attendre cinq minutes. Réglable par `choregos-orchestrator.unreachableTolerationSeconds` ; mettre
      # `0` rend le comportement par défaut de Kubernetes.
      {{- if gt (int $root.Values.unreachableTolerationSeconds) 0 }}
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: {{ $root.Values.unreachableTolerationSeconds }}
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: {{ $root.Values.unreachableTolerationSeconds }}
      {{- end }}
      securityContext: {{- toYaml $root.Values.global.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "choregos.image" (dict "global" $root.Values.global "image" $root.Values.image) }}
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          securityContext: {{- toYaml $root.Values.global.securityContext | nindent 12 }}
          # La commande ENTIÈRE, pas seulement ses arguments : le point d'entrée de l'image
          # est `tini`, et son `CMD` porte déjà `python -m …`. N'envoyer que `--queues x`
          # remplaçait ce CMD, et tini tentait d'exécuter « --queues » — « exec --queues
          # failed: No such file or directory », un message qui n'accuse pas le chart.
          command: ["python", "-m", "choregos_orchestrator.worker"]
          args: ["--queues", {{ .name | quote }}]
          env:
            {{- include "choregos.commonEnv" $root | nindent 12 }}
            - name: CHOREGOS_RUNNER_IMAGE
              # Le tag du runner suit celui du déploiement quand on ne le fixe pas : figé,
              # il désignait `1.0.0` dans une installation 0.1.0 — une image absente, et un
              # pod d'agent en ErrImagePull que rien d'autre n'explique.
              value: {{ $root.Values.global.imageRegistry }}/{{ $root.Values.runner.image }}:{{ $root.Values.runner.tag | default $root.Values.global.imageTag }}
            - name: CHOREGOS_RUNNER_NAMESPACE_PATTERN
              value: {{ $root.Values.runner.namespacePattern | quote }}
            - name: CHOREGOS_EXECUTOR_KIND
              value: {{ $root.Values.runner.executor | quote }}
            {{- with $root.Values.global.playbooks.configMap }}
            - name: CHOREGOS_PLAYBOOKS_DIR
              value: {{ $root.Values.global.playbooks.mountPath | quote }}
            {{- end }}
            # La clé qui SIGNE les jetons de run. L'orchestrateur émet, l'API vérifie :
            # sans cette variable il signait avec une paire éphémère, et l'agent recevait
            # « Signature verification failed » — un message qui accuse le jeton.
            - name: CHOREGOS_RUN_TOKEN_PRIVATE_KEY
              valueFrom:
                secretKeyRef: { name: {{ $root.Values.global.apiSecretRef }}, key: run-token-private-key }
            # Le service interne de l'API : c'est ce que les agents rappellent, jamais
            # l'URL publique, qu'un pod ne sait pas résoudre.
            - name: CHOREGOS_INTERNAL_API_URL
              value: {{ $root.Values.global.internalApiUrl | default "http://choregos-api:8000" | quote }}
            - name: CHOREGOS_RUNNER_ENV
              value: {{ toJson $root.Values.runner.env | quote }}
            - name: CHOREGOS_RUNNER_ENV_SECRETS
              value: {{ join "," $root.Values.runner.envFromSecrets | quote }}
            - name: CHOREGOS_RUNNER_CPU_LIMIT
              value: {{ $root.Values.runner.limits.cpu | quote }}
            - name: CHOREGOS_RUNNER_MEMORY_LIMIT
              value: {{ $root.Values.runner.limits.memory | quote }}
            # Runs simultanés dans le namespace. Au-delà, le Job est créé SUSPENDU : il
            # n'a pas de pod, ne tire pas l'image et ne prend pas de place dans le quota.
            # 0 = sans plafond, le comportement d'avant.
            - name: CHOREGOS_RUNNER_MAX_ACTIVE
              value: {{ $root.Values.runner.maxActive | default 0 | quote }}
            # Le proxy par lequel un pod d'agent sort : celui que le provisioning déploie
            # dans le namespace des runners, avec l'allowlist de la politique du projet.
            # Vide sur un banc dont le namespace n'a ni NetworkPolicy ni proxy.
            - name: CHOREGOS_RUNNER_EGRESS_PROXY
              value: {{ $root.Values.runner.egressProxy | default "" | quote }}
            - name: CHOREGOS_EGRESS_IMAGE
              value: {{ $root.Values.runner.egressImage | default "" | quote }}
            - name: CHOREGOS_GATEWAY_MASTER_KEY
              valueFrom: { secretKeyRef: { name: {{ include "choregos.gatewaySecret" $root }}, key: master-key } }
          resources: {{- toYaml .resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- with $root.Values.global.playbooks.configMap }}
            - { name: playbooks, mountPath: {{ $root.Values.global.playbooks.mountPath }}, readOnly: true }
            {{- end }}
      volumes:
        - { name: tmp, emptyDir: {} }
        {{- with $root.Values.global.playbooks.configMap }}
        - name: playbooks
          configMap: { name: {{ . }} }
        {{- end }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: choregos-orchestrator
  labels: {{- include "choregos.labels" . | nindent 4 }}
  annotations: {{- toYaml .Values.global.serviceAccount.annotations | nindent 4 }}
{{- if eq .Values.runner.executor "k8s_job" }}
---
# L'exécuteur `k8s_job` lance les runners dans CE namespace sous ce compte : sans lui,
# la création du pod échoue. Aucun droit, aucun jeton monté — un agent n'a rien à
# demander à l'API Kubernetes. (Avec Tekton, le provisioning le crée par projet.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: choregos-runner
  labels: {{- include "choregos.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
