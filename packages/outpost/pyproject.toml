[project]
name = "choregos-outpost"
version = "0.27.2"
description = "The daemon an outpost's operator installs: it only dials out, and makes the calls its own policy allows"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    # The door's contract: its messages, its bounds, the policy file's schema.
    "choregos-contracts",
    # The egress matcher the MCP client's transport consults, and the masking of known secrets.
    "choregos-core",
    # The MCP client and the sealing, used as they are (ADR 0148 §5, ADR 0149).
    "choregos-adapters",
    "httpx>=0.27",
    "pydantic>=2.9",
    "structlog>=24.4",
    "PyYAML>=6.0",
    "cryptography>=43.0",
    "PyJWT>=2.9",
    "jsonschema>=4.23",
    "typer>=0.15",
]

[project.scripts]
choregos-outpost = "choregos_outpost.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/choregos_outpost"]
