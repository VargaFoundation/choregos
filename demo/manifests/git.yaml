# A git server INSIDE the cluster: the demo borrows no credentials from outside.
#
# `git http-backend` behind a nginx-less lighttpd would be lighter, but the `alpine/git`
# image is enough: a bare repository, served over HTTP by the git daemon (port 9418 → here
# 8080 via `git daemon`). The git daemon allows anonymous PUSH when asked to — which is
# unacceptable on a network, and perfectly suited to a disposable bench whose namespace is
# closed by default.
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-depot
data:
  # The project the agents will work on: tiny, but real — it has tests, and that is what
  # the verification will read.
  init.sh: |
    set -eu
    # `alpine/git` does not ship the daemon: it lives in a separate package.
    command -v git-daemon >/dev/null 2>&1 || apk add --no-cache git-daemon >/dev/null
    mkdir -p /srv/git && cd /srv/git
    if [ ! -d app.git ]; then
      mkdir -p /tmp/app && cd /tmp/app
      git init -q -b main
      git config user.email "demo@choregos.local"
      git config user.name "Choregos Demo"
      mkdir -p src tests
      cat > README.md <<'EOT'
    # panier — the demonstration project

    A tiny library: a cart, items, a total. The demonstration's tickets are about it.
    EOT
      cat > src/panier.py <<'EOT'
    """A minimal shopping cart."""

    from dataclasses import dataclass, field


    @dataclass
    class Article:
        libelle: str
        prix_ht: float
        quantite: int = 1


    @dataclass
    class Panier:
        articles: list[Article] = field(default_factory=list)

        def ajouter(self, article: Article) -> None:
            self.articles.append(article)

        def total_ht(self) -> float:
            return sum(a.prix_ht * a.quantite for a in self.articles)
    EOT
      cat > tests/test_panier.py <<'EOT'
    from src.panier import Article, Panier


    def test_total_ht_somme_les_articles():
        panier = Panier()
        panier.ajouter(Article("stylo", 1.5, 2))
        panier.ajouter(Article("cahier", 3.0))
        assert panier.total_ht() == 6.0
    EOT
      printf 'pytest\n' > requirements-dev.txt
      git add -A && git commit -q -m "chore: the demonstration project"
      cd /srv/git && git clone -q --bare /tmp/app app.git
      cd app.git && git config http.receivepack true && git config daemon.receivepack true
    fi
    exec git daemon --verbose --export-all --enable=receive-pack --base-path=/srv/git --reuseaddr /srv/git
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: demo-git
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-git
  labels: { app.kubernetes.io/name: demo-git }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: demo-git } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: demo-git }
    spec:
      containers:
        - name: git
          image: alpine/git:latest
          command: ["sh", "/init/init.sh"]
          ports: [{ name: git, containerPort: 9418 }]
          readinessProbe:
            tcpSocket: { port: git }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - { name: init, mountPath: /init }
            - { name: data, mountPath: /srv/git }
      volumes:
        - name: init
          configMap: { name: demo-depot }
        - name: data
          persistentVolumeClaim: { claimName: demo-git }
---
apiVersion: v1
kind: Service
metadata:
  name: demo-git
spec:
  selector: { app.kubernetes.io/name: demo-git }
  ports: [{ name: git, port: 9418, targetPort: git }]
