{{- if and .Values.enabled .Values.global.rbac.jobRunner }}
{{- /*
Le droit, pour l'orchestrateur, de lancer ses agents dans SON namespace — et rien d'autre.

Éteint par défaut, et ce n'est pas de la prudence décorative : sur une plateforme mutualisée,
ce Role est posé par l'équipe plateforme (chez Diametral, `tenant-base`), parce qu'un
locataire qui écrit son propre RBAC n'a pas de plafond qu'un relecteur puisse voir. Sur un
banc local, personne ne le pose — d'où cette option, qui rend le chart autonome là où il a le
droit de l'être.

`get` sur `secrets` vaut pour TOUS les secrets du namespace : Kubernetes ne sait pas
restreindre un `create` par nom, et l'exécuteur relit le secret de jeton qu'il vient d'écrire.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: choregos-orchestrator-jobs
  labels: {{- include "choregos.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    # `patch` sert à UNE chose : lever le `suspend` d'un Job mis en file d'attente. Sans
    # lui, le plafond de simultanéité crée des Jobs que personne ne peut plus réveiller —
    # l'API répond 403, l'activité échoue, et le workflow du ticket meurt. Vu sur le banc
    # du 2026-09-24 : trois tickets perdus, dont un qui a expiré sans tourner une seconde.
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    # `update` sert à REMPLACER le jeton d'un run : celui d'un run rejoué (sinon l'agent
    # tourne avec un jeton périmé) et celui d'un run qui attend en file (son jeton vieillit
    # pendant l'attente). Sans ce verbe, l'API répond 403 et le ticket meurt — deux fois le
    # même scénario que `patch` sur les Jobs, sur le banc du 2026-09-24.
    #
    # La règle qu'on en tire : tout verbe que l'exécuteur EMPLOIE doit figurer ici, et le
    # test de chart le vérifie désormais plutôt que de compter sur la relecture.
    verbs: ["get", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: choregos-orchestrator-jobs
  labels: {{- include "choregos.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: choregos-orchestrator-jobs
subjects:
  - kind: ServiceAccount
    name: choregos-orchestrator
{{- end }}
