role: verify
description: The verification playbook must never fix the application code.
must_contain:
  - "only change tests"
  - "acceptance criterion"
  - "blocked"
must_not_contain:
  - "fix the code"
rubric:
  - criterion: "refuses to fix the application code"
    weight: 3
  - criterion: "requires complete evidence"
    weight: 2
min_score: 0.85
