{{- if and .Values.enabled (eq (include "choregos.executorKind" .) "agent_sandbox") }}
{{- /*
The `agent_sandbox` executor (ADR 0016, ADR 0053): a SandboxTemplate that describes the runner
pod, and a SandboxWarmPool of sandboxes made from it that have NEVER run anything.

A warm sandbox holds no credential. Its pod runs `choregos-runner await-assignment`, which
listens on one port for exactly one assignment — the run id, its token and its environment —
pushed by the executor once a SandboxClaim has bound that sandbox to a run. Before that push
the pod has no run token, no git identity, no backend key, and no service account token:
everything a run needs reaches it after it has been chosen for that run, never before.

The template lives in the release namespace, and so do the runs: the executor creates its
claims in `runner.namespacePattern`, which must therefore name this namespace. Per-project
runner namespaces (`proj-{slug}-runners`) would need the provisioning to write a template and a
pool per project; it does not yet, and rendering one here that no claim can reach would be a
pool that warms for nothing.

Requires the agent-sandbox operator (`infra/bootstrap/agent-sandbox.yaml`): its CRDs are
cluster-scoped, so a tenant of a shared cluster asks its platform team.
*/ -}}
{{- $pattern := include "choregos.runnerNamespacePattern" . }}
{{- if contains "{slug}" $pattern }}
{{- fail (printf "runner.executor=agent_sandbox needs runner.namespacePattern to name the release namespace (%s), not a per-project pattern (%s): the SandboxTemplate and its warm pool are rendered in the release namespace only. Leave namespacePattern empty." .Release.Namespace $pattern) }}
{{- end }}
{{- /*
The operator is checked here, at render, not at the first run: without its CRDs the SandboxTemplate
below is refused by the API server, or Argo CD syncs everything but it and the first run dies.
Argo CD hands the cluster's API versions to `helm template`. Offline renderings (CI, previews)
pass `--api-versions extensions.agents.x-k8s.io/v1beta1/SandboxTemplate` or set
`runner.skipOperatorCheck: true`.
*/ -}}
{{- if not (or .Values.runner.skipOperatorCheck (.Capabilities.APIVersions.Has "extensions.agents.x-k8s.io/v1beta1/SandboxTemplate")) }}
{{- fail "runner.executor=agent_sandbox (the default) needs the kubernetes-sigs/agent-sandbox operator: its CRD extensions.agents.x-k8s.io/v1beta1 SandboxTemplate is not installed on this cluster. Ask your platform team to install it (docs/deployment.md, \"The agent_sandbox executor\"), or run agents as Jobs with `global.runner.executor: k8s_job`." }}
{{- end }}
{{- $sandbox := .Values.runner.sandbox | default dict }}
{{- $port := int ($sandbox.assignmentPort | default 8765) }}
{{- $isolation := $sandbox.agentIsolation | default "process" }}
{{- if not (has $isolation (list "process" "container")) }}
{{- fail (printf "runner.sandbox.agentIsolation=%q: expected process or container (ADR 0146)" $isolation) }}
{{- end }}
{{- $launcherPort := int ($sandbox.launcherPort | default 8766) }}
{{- $agentUid := int ($sandbox.agentUid | default 1001) }}
{{- $separate := eq $isolation "container" }}
{{- $gate := .Values.runner.egressGate | default dict }}
{{- $gated := ne (toString $gate.enabled) "false" }}
{{- $image := printf "%s/%s:%s" .Values.global.imageRegistry .Values.runner.image (.Values.runner.tag | default .Values.global.imageTag) }}
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: choregos-runner
  labels: {{- include "choregos.labels" . | nindent 4 }}
spec:
  # The claim never injects environment variables: they would force a cold start, and a token
  # passed that way would be written, by value, in the claim's spec.
  envVarsInjectionPolicy: Disallowed
  volumeClaimTemplatesPolicy: Disallowed
  # The controller's default policy lets a sandbox reach the public internet only, which cuts
  # the runner off from the internal API it reports to. The runner pods carry the labels the
  # platform's own NetworkPolicies select (`app.kubernetes.io/name: choregos-runner`), so those
  # apply, as they do to `k8s_job` pods.
  networkPolicyManagement: Unmanaged
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: choregos-runner
        app.kubernetes.io/component: runner
        # The label `choregos-runner-assignment` below selects. NOT `app.kubernetes.io/part-of:
        # choregos`: `choregos-allow-ingress` admits every pod of the namespace to the pods that
        # carry it, and NetworkPolicies add up — it would reopen the assignment port to all.
        choregos/sandbox: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: choregos-runner
      automountServiceAccountToken: false
      {{- include "choregos.imagePullSecrets" $ | nindent 6 }}
      {{- with (include "choregos.runtimeClass" .) }}
      runtimeClassName: {{ . | quote }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      {{- if or $gated $separate }}
      initContainers:
      {{- end }}
      {{- if $gated }}
        # The egress gate (S80-07f), FIRST: nothing else of the pod starts, the agent's container
        # below included, until a direct connection out is refused three times in a row. k3s's
        # kube-router applies a new pod's egress policy seconds after it starts (#1854). Still open
        # after `deadlineSeconds`: exit 115, the pod fails, the warm pool replaces it. The same
        # container `k8s_job` builds (`choregos_adapters.executor.egress_gate`).
        - name: egress-gate
          image: {{ $image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - /app/.venv/bin/python
            - -m
            - choregos_core.egress_gate
            - --target
            - {{ $gate.target | default "1.1.1.1:443" | quote }}
            - --deadline
            - {{ $gate.deadlineSeconds | default 30 | quote }}
            - --closed-streak
            - "3"
            - --timeout
            - "1"
            - --interval
            - "0.25"
            - --report
            - /egress-gate/report.json
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: egress-gate, mountPath: /egress-gate }
      {{- end }}
      {{- if $separate }}
        # ADR 0146: the agent is a native sidecar (an init container that keeps running, Kubernetes
        # >= 1.29), so it is Ready before the runner is. It has NO secret, no envFrom and no
        # environment but what the runner sends per process: the runner's run token, git token and
        # egress report key stay in the `runner` container, which it cannot read (own PID and
        # mount namespaces, another uid). The two share /workspace and /exchange only.
        - name: agent
          image: {{ $image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          restartPolicy: Always
          args: ["launcher", "--port", {{ $launcherPort | quote }}]
          env:
            - { name: TMPDIR, value: /exchange }
            - { name: HOME, value: /exchange }
          startupProbe:
            # An exec probe: the kubelet's TCP probe connects from the node, where the launcher's
            # loopback (the pod's own) is not reachable.
            exec:
              command: [python, -c, "import socket; socket.create_connection(('127.0.0.1', {{ $launcherPort }}), 1)"]
            periodSeconds: 1
            failureThreshold: 60
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: {{ .Values.runner.limits.cpu | quote }}, memory: {{ .Values.runner.limits.memory | quote }} }
          securityContext:
            runAsNonRoot: true
            # Not the runner's uid: a process of this container cannot signal, ptrace or read the
            # /proc entries of the runner's. The pod's fsGroup (1000) gives it the shared volumes.
            runAsUser: {{ $agentUid }}
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: workspace, mountPath: /workspace }
            - { name: exchange, mountPath: /exchange }
            - { name: agent-tmp, mountPath: /tmp }
      {{- end }}
      containers:
        - name: runner
          image: {{ $image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["await-assignment", "--port", {{ $port | quote }}]
          ports:
            - { name: assignment, containerPort: {{ $port }} }
          # Ready = listening for its assignment. The controller only hands out a Ready sandbox.
          readinessProbe:
            httpGet: { path: /healthz, port: assignment }
            periodSeconds: 2
          {{- if or .Values.runner.env $separate $gated }}
          # Plain values for every run of the deployment, never a secret. What is per run, the
          # token included, is pushed with the assignment.
          env:
            {{- range $name, $value := .Values.runner.env }}
            - { name: {{ $name | quote }}, value: {{ $value | quote }} }
            {{- end }}
            {{- if $separate }}
            # ADR 0146: the agent runs in the `agent` container, reached over the pod's loopback.
            - { name: CHOREGOS_RUNNER_AGENT_ISOLATION, value: container }
            - { name: CHOREGOS_RUNNER_LAUNCHER_PORT, value: {{ $launcherPort | quote }} }
            # Every temporary file of the runner (the agent's `$HOME`, tool scripts) lands on the
            # surface both containers see.
            - { name: TMPDIR, value: /exchange }
            {{- end }}
            {{- if $gated }}
            # What the egress gate measured, which the runner journals (`egress.gate`).
            - { name: CHOREGOS_EGRESS_GATE_REPORT, value: /egress-gate/report.json }
            {{- end }}
          {{- end }}
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: {{ .Values.runner.limits.cpu | quote }}, memory: {{ .Values.runner.limits.memory | quote }} }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: workspace, mountPath: /workspace }
            {{- if $separate }}
            - { name: exchange, mountPath: /exchange }
            {{- end }}
            {{- if $gated }}
            - { name: egress-gate, mountPath: /egress-gate, readOnly: true }
            {{- end }}
  {{- if or $separate $gated }}
      volumes:
        {{- if $separate }}
        - { name: exchange, emptyDir: {} }
        - { name: agent-tmp, emptyDir: {} }
        {{- end }}
        {{- if $gated }}
        - { name: egress-gate, emptyDir: { sizeLimit: 1Mi } }
        {{- end }}
  {{- end }}
  # A volume, not an emptyDir: a suspended sandbox loses its pod and keeps this (ADR 0016).
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $sandbox.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests: { storage: {{ $sandbox.storage | default "10Gi" | quote }} }
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: choregos-runner
  labels: {{- include "choregos.labels" . | nindent 4 }}
spec:
  # 0 is a valid size: every claim then cold-starts from the template, still clean.
  replicas: {{ int (.Values.runner.warmPool.size | default 0) }}
  sandboxTemplateRef:
    name: choregos-runner
  # A warm sandbox made from an older template is deleted at once, not handed to the next claim.
  # The operator's default (`OnReplenish`) keeps it until it is claimed: after an upgrade, the
  # first run of the new version ran in the previous version's runner (dev, 0.18.1 → 0.18.3).
  updateStrategy:
    type: Recreate
{{- if ne $sandbox.assignmentNetworkPolicy false }}
---
# Who may push an assignment to a warm sandbox: the orchestrator's `executor` workers, and no one
# else (ADR 0053). The assignment is sealed to the pod's key, so another pod could not READ a run
# token; without this policy it could still push first, with a token of its own, and occupy the
# sandbox until the real run fails on 409. Rendered with the template, whatever
# `networkPolicies.enabled` says: it is part of how this executor holds its promise. Only
# `runner.sandbox.assignmentNetworkPolicy: false` leaves it out, where the platform lays the
# namespace's NetworkPolicies and refuses a tenant's: the platform then holds the promise.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: choregos-runner-assignment
  labels: {{- include "choregos.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      choregos/sandbox: "true"
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: choregos-orchestrator
              choregos/queue: executor
      ports:
        - { protocol: TCP, port: {{ $port }} }
{{- end }}
{{- end }}
