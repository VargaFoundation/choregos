role: refine
description: >-
  The refinement playbook must ask for a verifiable specification, a minimal scope
  and a stop when a product decision is in doubt.
must_contain:
  - "Given / When / Then"
  - "allowed_paths"
  - "Out of scope"
  - "rollback"
  - "ask_human"
must_not_contain:
  - "write code"
rubric:
  - criterion: "asks for testable acceptance criteria"
    weight: 2
  - criterion: "demands a minimal, justified scope"
    weight: 2
  - criterion: "covers the case where a product decision is missing"
    weight: 1
min_score: 0.8
