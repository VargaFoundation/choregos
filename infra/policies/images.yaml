# Les images de la plateforme et des runners sont signées par la fondation et référencées
# par digest. Une image non signée ne démarre pas — c'est un mécanisme, pas une consigne.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: choregos-verify-images
  annotations:
    policies.kyverno.io/description: >-
      Vérifie la signature cosign des images Choregos et impose la référence par digest.
spec:
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 30
  rules:
    - name: verifier-signature
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["choregos-*", "proj-*"]
      verifyImages:
        - imageReferences: ["ghcr.io/vargafoundation/choregos-*"]
          attestors:
            - entries:
                - keyless:
                    subject: "https://github.com/VargaFoundation/choregos/.github/workflows/*"
                    issuer: "https://token.actions.githubusercontent.com"
          mutateDigest: true
          required: true
        # Ecphoria est de la fondation mais pas de ce dépôt : ses images sont signées par les
        # workflows de `VargaFoundation/ecphoria`. Avec le seul motif ci-dessus, le glob
        # `ghcr.io/vargafoundation/*` attrapait `ghcr.io/vargafoundation/ecphoria` et exigeait
        # une signature émise par un dépôt qui ne l'a jamais produite — la mémoire de la
        # plateforme n'aurait pas démarré, et le message aurait parlé de signature manquante.
        - imageReferences: ["ghcr.io/vargafoundation/ecphoria*"]
          attestors:
            - entries:
                - keyless:
                    subject: "https://github.com/VargaFoundation/ecphoria/.github/workflows/*"
                    issuer: "https://token.actions.githubusercontent.com"
          mutateDigest: true
          required: true
    - name: interdire-latest
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["choregos-*", "proj-*"]
      validate:
        message: "les images doivent être référencées par digest ou par version, jamais par `latest`"
        pattern:
          spec:
            containers:
              - image: "!*:latest"
