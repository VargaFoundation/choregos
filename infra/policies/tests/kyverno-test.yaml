# The Kyverno engine itself (RE2 regular expressions, anchors) judges these pods: a Python
# reading of the policies cannot tell what Kyverno would admit. `choregos-verify-images`
# (signatures) needs the registry and Sigstore, so it is not judged here.
# One entry per pod, so a wrong verdict names its pod.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: choregos-policies
policies:
- ../image-tags.yaml
- ../pod-security.yaml
resources:
- resources.yaml
exceptions:
- exception.yaml
