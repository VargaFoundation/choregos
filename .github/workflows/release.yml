# Release: a semver tag produces the signed images, the OCI chart and the changelog.
#
# Never run before v0.1.0, and it could not pass: the matrix looked for a
# `docker/orchestrator.Dockerfile` that does not exist (the orchestrator is the `worker` target
# of `api.Dockerfile`), the API was built without its target, arm64 went through QEMU — the
# path that made the runner image endless — and the chart shipped with `imageTag:
# "1.0.0"` hard-coded, whatever version was published. The scheme below is Ecphoria v0.2.5's,
# proven: one architecture per native runner, pushed by digest, then
# a manifest list per image.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # The `choregos` CLI as native binaries (S62-07): one per target, each built on a runner of its own
  # OS and architecture (Nuitka does not cross-compile), each smoke-tested there where no Python is
  # available. The file names are a shared contract (S62-08 serves them): never rename one.
  cli-binaries:
    name: cli binary (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds in the manylinux_2_28 image (glibc 2.28: RHEL 8, Debian 10, Ubuntu 18.10 on),
          # and the smoke test runs it again in `debian:bookworm-slim`, which has no Python.
          - { name: choregos-linux-x86_64, runner: ubuntu-24.04, build: --manylinux, smoke: --container debian:bookworm-slim }
          - { name: choregos-linux-arm64, runner: ubuntu-24.04-arm, build: --manylinux, smoke: --container debian:bookworm-slim }
          - { name: choregos-macos-arm64, runner: macos-15, build: "", smoke: "" }
          - { name: choregos-macos-x86_64, runner: macos-15-intel, build: "", smoke: "" }
          - { name: choregos-windows-x86_64.exe, runner: windows-2022, build: "", smoke: "" }
    env:
      # Whether a signing secret exists, never its value: the steps that sign read the secrets
      # themselves, and are skipped without them (docs/plan/BLOCKERS.md, the certificates).
      HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 != '' }}
      HAS_MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }}
      HAS_MACOS_NOTARY: ${{ secrets.MACOS_NOTARY_APPLE_ID != '' }}
      NUITKA_CACHE_DIR: ${{ github.workspace }}/build/cli-binary/cache/nuitka
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # macOS and Windows build with the python.org-style interpreter of setup-python; Linux with
      # the manylinux image's own.
      - uses: actions/setup-python@v6
        id: python
        with: { python-version: "3.12" }
      - uses: actions/cache@v5
        with:
          path: build/cli-binary/cache
          key: cli-binary-${{ matrix.name }}-${{ hashFiles('uv.lock', 'tools/cli_binary/requirements.txt') }}
          restore-keys: cli-binary-${{ matrix.name }}-
      - name: ccache (macOS)
        if: runner.os == 'macOS'
        run: brew install ccache
      - name: import the signing certificate (macOS, when the secret exists)
        if: runner.os == 'macOS' && env.HAS_MACOS_CERTIFICATE == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          # Nuitka signs the onefile binary with it (build.py, `--macos-sign-identity`).
          echo "CHOREGOS_MACOS_SIGN_IDENTITY=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"
      - name: build
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          if [ -n "${{ matrix.build }}" ]; then
            python3 tools/cli_binary/build.py ${{ matrix.build }}
          else
            "$PYTHON" tools/cli_binary/build.py --python "$PYTHON"
          fi
          test -f "dist/cli/${{ matrix.name }}"
      - name: Authenticode signature (Windows, when the secret exists)
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERTIFICATE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "certificate.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "dist\cli\${{ matrix.name }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $signtool.FullName verify /pa "dist\cli\${{ matrix.name }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item $pfx
      - name: notarization (macOS, when the secrets exist)
        if: runner.os == 'macOS' && env.HAS_MACOS_CERTIFICATE == 'true' && env.HAS_MACOS_NOTARY == 'true'
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          # A bare executable cannot be stapled: Gatekeeper checks the ticket online, on first run.
          codesign --verify --strict --verbose=2 "dist/cli/${{ matrix.name }}"
          ditto -c -k "dist/cli/${{ matrix.name }}" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --wait \
            --apple-id "$MACOS_NOTARY_APPLE_ID" --team-id "$MACOS_NOTARY_TEAM_ID" --password "$MACOS_NOTARY_PASSWORD"
      - name: smoke test, where no Python is available
        # The release stops here when the binary does not start, does not validate a workflow, or
        # cannot read a door's card; or when it is over its size or start-up budget.
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          "$PYTHON" tools/cli_binary/smoke.py "dist/cli/${{ matrix.name }}" \
            --expect-version "${GITHUB_REF_NAME#v}" ${{ matrix.smoke }}
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.name }}
          path: dist/cli/${{ matrix.name }}
          if-no-files-found: error
          retention-days: 1

  cli-release:
    # The five binaries together: their checksums, the manifest, and a keyless cosign signature of
    # each file, as the images have (the bundle beside each file holds the certificate and the
    # transparency log entry). Then one artefact the image and the GitHub release both take.
    name: cli binaries, manifest and signatures
    needs: cli-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless cosign (GitHub OIDC)
    steps:
      - uses: actions/checkout@v7
      - uses: sigstore/cosign-installer@v3
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-choregos-*
          merge-multiple: true
          path: dist/cli
      - name: SHA256SUMS and manifest.json
        run: |
          chmod 0755 dist/cli/choregos-*
          python3 tools/cli_binary/release.py dist/cli --version "${GITHUB_REF_NAME#v}"
          cat dist/cli/manifest.json
      - name: sign every file (cosign, keyless)
        working-directory: dist/cli
        run: |
          for file in choregos-* SHA256SUMS manifest.json; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done
          # What a user runs to check one: the identity is this workflow, on this tag.
          cosign verify-blob --bundle manifest.json.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com manifest.json
      - uses: actions/upload-artifact@v7
        with:
          name: cli-dist
          path: dist/cli/*
          if-no-files-found: error
          retention-days: 1

  images:
    name: ${{ matrix.image }} (${{ matrix.platform }})
    # After the CLI binaries: the API image carries them in /opt/choregos/cli/ (S62-07, S62-08).
    needs: cli-release
    runs-on: ${{ matrix.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # `image` carries its own keys through `include`; `platform` is a dimension. Two
        # `include`s that add the same key to every combination would overlap.
        image: [api, orchestrator, tools, web, runner, laya]
        platform: [amd64, arm64]
        include:
          - { image: api, file: docker/api.Dockerfile, target: api }
          - { image: orchestrator, file: docker/api.Dockerfile, target: worker }
          - { image: tools, file: docker/tools.Dockerfile, target: "" }
          - { image: web, file: docker/web.Dockerfile, target: "" }
          - { image: runner, file: docker/runner.Dockerfile, target: "" }
          - { image: laya, file: docker/laya.Dockerfile, target: "" }
    env:
      IMAGE: ghcr.io/vargafoundation/choregos-${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
      # The signed CLI binaries, for the API image only: the `cli` build context replaces the empty
      # stage of the same name in `api.Dockerfile`, which copies them to /opt/choregos/cli/.
      - uses: actions/download-artifact@v8
        if: matrix.image == 'api'
        with:
          name: cli-dist
          path: dist/cli
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-contexts: ${{ matrix.image == 'api' && 'cli=dist/cli' || '' }}
          platforms: linux/${{ matrix.platform }}
          # The About panel shows which commit the image was built from (S42-12, `GET /edition`).
          build-args: REVISION=${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform }}
      - name: the API image carries the CLI binaries, intact
        if: matrix.image == 'api'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker run --rm --entrypoint /bin/sh "${IMAGE}@${DIGEST}" -c '
            set -e
            cd /opt/choregos/cli
            sha256sum -c SHA256SUMS
            ./choregos-linux-$(uname -m | sed s/aarch64/arm64/) --version'
      - name: store the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image }}-${{ matrix.platform }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    name: manifest and signature (${{ matrix.image }})
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign (GitHub OIDC)
    strategy:
      fail-fast: false
      matrix:
        image: [api, orchestrator, tools, web, runner, laya]
    env:
      IMAGE: ghcr.io/vargafoundation/choregos-${{ matrix.image }}
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: assemble the manifest list
        working-directory: /tmp/digests
        run: |
          # The word splitting is intended: one `-t` option per tag, one reference per digest.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
      # The secret scanner's configuration and its one exception (ADR 0095), as on `main`.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            trivy-secret.yaml
            .trivyignore
          sparse-checkout-cone-mode: false
      - name: Trivy scan of the published image (no CRITICAL tolerated)
        # The images of `main` were scanned, those of a release — the ones that go to
        # production — never were (status review of 2026-09-24).
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_SECRET_CONFIG: trivy-secret.yaml
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true
      - name: sign the manifest
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)
          cosign sign --yes "${IMAGE}@${digest}"

  chart:
    # After the images: a published chart must never point at a missing image.
    needs: manifest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - uses: astral-sh/setup-uv@v7
      - name: the tagged version is the repository's
        # No more `sed` at build time: versions are set BEFORE the tag, with
        # `tools/bump_version.py`, and the repository always tells the truth. A tag that does not
        # match the files stops the release here.
        run: uv run python tools/bump_version.py "${GITHUB_REF_NAME#v}" --check
      - name: publish the chart as OCI
        env:
          HELM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.repository_owner }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package charts/choregos --version "$version" --app-version "$version"
          echo "$HELM_TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          helm push "choregos-$version.tgz" oci://ghcr.io/vargafoundation/charts

  pypi:
    # `choregos-agent-sdk` and the `choregos-contracts` it depends on (ADR 0063). OFF until the two
    # projects exist on pypi.org with this repository, this workflow and the `pypi` environment as
    # their trusted publisher: set the repository variable PUBLISH_TO_PYPI=true to turn it on.
    if: vars.PUBLISH_TO_PYPI == 'true'
    needs: chart
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build --package choregos-contracts --package choregos-agent-sdk --out-dir dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: dist }

  changelog:
    needs: [chart, cli-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v7
      - name: build the Python packages
        # An Apache 2.0 repository none of whose nine packages was distributable: the wheels
        # ship with the release (no PyPI until the names are reserved).
        run: uv build --all-packages --out-dir dist
      # The CLI binaries, their SHA256SUMS, manifest.json and cosign bundles, under the same names.
      - uses: actions/download-artifact@v8
        with:
          name: cli-dist
          path: dist/cli
      - uses: orhun/git-cliff-action@v4
        with: { args: --latest --strip header }
        id: cliff
      - uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.cliff.outputs.content }}
          generate_release_notes: true
          files: |
            dist/*
            dist/cli/*
