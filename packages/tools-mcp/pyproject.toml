[project]
name = "choregos-tools-mcp"
version = "0.1.0"
description = "Sidecar MCP choregos-tools"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = ["choregos-core", "httpx>=0.27", "pydantic>=2.9", "structlog>=24.4", "typer>=0.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/choregos_tools_mcp"]
