{{- /*
Plugin servers (ADR 0094): the API runs them in their own namespace, and nowhere else. A Role there
(the objects of a server: its Deployment, Service, NetworkPolicy, Secret; CiliumNetworkPolicy with
`egress: cilium`), bound to the API's ServiceAccount. The namespace itself only with `create: true`.
*/ -}}
{{- $servers := ((.Values.global.plugins | default dict).servers | default dict) }}
{{- if $servers.enabled }}
{{- $ns := ($servers.namespace | default dict).name | default "choregos-plugins" }}
{{- if eq $ns .Release.Namespace }}
{{- fail "global.plugins.servers.namespace.name: a namespace of its own, not the release's (its NetworkPolicies and Role are the servers' only)" }}
{{- end }}
{{- if not (has ($servers.egress | default "networkpolicy") (list "networkpolicy" "cilium")) }}
{{- fail "global.plugins.servers.egress: networkpolicy or cilium" }}
{{- end }}
{{- if ($servers.namespace | default dict).create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    {{- include "choregos.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: restricted
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: choregos-api-plugin-servers
  namespace: {{ $ns }}
  labels: {{- include "choregos.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets, services]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, create, update, patch, delete]
  {{- if eq ($servers.egress | default "networkpolicy") "cilium" }}
  - apiGroups: [cilium.io]
    resources: [ciliumnetworkpolicies]
    verbs: [get, list, create, update, patch, delete]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: choregos-api-plugin-servers
  namespace: {{ $ns }}
  labels: {{- include "choregos.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: choregos-api-plugin-servers
subjects:
  - kind: ServiceAccount
    name: choregos-api
    namespace: {{ .Release.Namespace }}
{{- end }}
