      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [text], properties: { text: { type: string }, options: { type: array, items: { type: string } } } } } }
      responses: { "202": { description: Question passed on; the run must end in needs_human } }
  /internal/runs/{id}/context:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [internal]
      security: [{ runToken: [] }]
      operationId: getRunContext
      responses:
        "200": { description: Context pack, content: { application/json: { schema: { $ref: "#/components/schemas/ContextPack" } } } }
  /internal/runs/{id}/knowledge:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [internal]
      security: [{ runToken: [] }]
      operationId: getRunKnowledge
      description: The converted documents of the `files` knowledge bases the run's StageInput pins (ADR 0051); the runner recomputes their digest before laying them read-only.
      responses:
        "200":
          description: One entry per knowledge base
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [slug, digest, documents]
                  properties:
                    slug: { type: string }
                    name: { type: string }
                    digest: { type: string }
                    documents:
                      type: array
                      items:
                        type: object
                        required: [path, title, markdown]
                        properties:
                          path: { type: string, description: "relative to `.choregos/knowledge/<slug>/`" }
                          title: { type: string }
                          filename: { type: string }
                          markdown: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
  /internal/runs/{id}/knowledge/search:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [internal]
      security: [{ runToken: [] }]
      operationId: searchRunKnowledge
      description: The sidecar's `knowledge_search` (ADR 0051) — the `index` bases the run's StageInput names, while they are served to its project.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeSearchRequest" } } }
      responses:
        "200": { description: Citations, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeSearchResult" } } } }
  /internal/runs/{id}/ticket:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [internal]
      security: [{ runToken: [] }]
      operationId: getRunTicket
      responses:
        "200": { description: Ticket and linked documents, content: { application/json: { schema: { $ref: "#/components/schemas/RunTicket" } } } }
  /internal/runs/{id}/skills:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [internal]
      security: [{ runToken: [] }]
      operationId: getRunSkills
      description: The files of the skills the run's StageInput names (ADR 0033); the runner recomputes their digest before writing them.
      responses:
        "200":
          description: One entry per skill
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [slug, version, digest, files]
                  properties:
                    slug: { type: string }
                    version: { type: integer }
                    digest: { type: string }
                    files: { type: object, additionalProperties: { type: string } }
  /internal/runs/{id}/inputs:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [internal]
      security: [{ runToken: [] }]
      operationId: getRunInputs
      description: >-
        The declared inputs of the run that an earlier step produced, latest revision of each (ADR 0049).
        The runner mounts them as files in `.choregos/inputs/`.
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/RunInputFile" } } } } }
  /internal/runs/{id}/inputs/{name}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [internal]
      security: [{ runToken: [] }]
      operationId: getRunInputContent
      description: >-
        The bytes of a declared input, digest checked; the read leaves a hand-off receipt (S25-04). An
        input the run's transition does not declare is not served.
      responses:
        "200": { description: The content, content: { "*/*": { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /internal/runs/{id}/outputs/{name}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: name, in: path, required: true, schema: { type: string } }
    put:
      tags: [internal]
      security: [{ runToken: [] }]
      operationId: putRunOutput
      description: >-
        A deliverable the agent wrote in `.choregos/outputs/` (ADR 0049). The API hashes the bytes,
        refuses them unless they match `X-Choregos-Digest`, stores them in the object store and records
        a typed artifact revision with its produced receipt. Same bytes, same version. Closed once the
        run's result is posted.
      parameters:
        - { name: type, in: query, required: true, description: "a type of the artifact vocabulary", schema: { type: string } }
        - { name: X-Choregos-Digest, in: header, required: true, description: "sha256:<hex> of the body", schema: { type: string } }
      requestBody:
        required: true
        content: { application/octet-stream: { schema: { type: string, format: binary } } }
      responses:
        "200": { description: Stored, content: { application/json: { schema: { $ref: "#/components/schemas/Artifact" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { description: Larger than CHOREGOS_ARTIFACT_MAX_BYTES, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { description: Object store unavailable, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /internal/runs/{id}/ci-logs:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [internal]
      security: [{ runToken: [] }]
      operationId: getRunCiLogs
      parameters: [{ name: tail, in: query, schema: { type: integer, default: 500, maximum: 5000 } }]
      responses:
        "200": { description: Logs, content: { application/json: { schema: { type: object, properties: { logs: { type: string }, ref: { type: string } } } } } }
  /internal/runs/{id}/git-token:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [internal]
      security: [{ runToken: [] }]
      operationId: postRunGitToken
      description: >-
        A git token for THIS run: an installation token of the platform's GitHub App, scoped to the
        run's repository alone, with `contents: write`, valid one hour. `token` is null when the
        repository is not on GitHub or when no App is configured: the run then clones without one.
      responses:
        "200": { description: The token, or null, content: { application/json: { schema: { $ref: "#/components/schemas/GitToken" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /integrations:
    get:
      tags: [session]
      operationId: getIntegrations
      summary: Where to connect an MCP client (Claude Code, Cursor…) to this platform (ADR 0030)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Integrations" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /healthz:
    get: { tags: [session], security: [], operationId: healthz, responses: { "200": { description: OK } } }
  /edition:
    get:
      tags: [session]
      security: []
      operationId: edition
      summary: Which edition is running, and what it allows itself (ADR 0024)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [edition, features, version]
                properties:
                  edition: { type: string, enum: [community, enterprise] }
                  features: { type: array, items: { type: string } }
                  version: { type: string }
  /readyz:
    get: { tags: [session], security: [], operationId: readyz, responses: { "200": { description: OK }, "503": { description: Not ready } } }
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: choregos_session }
    bearer: { type: http, scheme: bearer, bearerFormat: choregos-api-token }
    runToken: { type: http, scheme: bearer, bearerFormat: JWT, description: "Run JWT signed with ES256, aud=internal" }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string } }
    Org: { name: org, in: path, required: true, schema: { type: string } }
    Env: { name: env, in: path, required: true, schema: { type: string } }
    ConnectorKind:
      name: kind
      in: path
      required: true
      description: a capability; the registry says which ones exist (`GET /connectors/types`, ADR 0034)
      schema: { type: string, pattern: "^[a-z][a-z0-9_]{1,31}$" }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
  responses:
    Unauthorized:
      description: Not authenticated
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Forbidden:
      description: Forbidden (RBAC)
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    NotFound:
      description: Not found
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Conflict:
      description: State conflict
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    ValidationError:
      description: Unprocessable entity
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
  schemas:
    Problem:
      type: object
      description: RFC 9457
      required: [type, title, status]
      properties:
        type: { type: string, default: about:blank }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              loc: { type: array, items: { type: string } }
              msg: { type: string }
              code: { type: string, description: Machine code of a workflow or policy issue }
              deprecated_code:
                type: string
                deprecated: true
                description: Former spelling of a code renamed to English, emitted for one release (ADR 0046)
              line: { type: integer }
              column: { type: integer }
        retry_after: { type: integer }
    PageMeta:
      type: object
      required: [has_more]
      properties:
        next_cursor: { type: [string, "null"] }
        has_more: { type: boolean }
    Role:
      type: string
      enum: [org_admin, project_owner, developer, release_captain, viewer]
    Size: { type: string, enum: [S, M, L, XL] }
    Risk: { type: string, enum: [low, medium, high] }
    Me:
      type: object
      required: [id, email, display_name, memberships]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        display_name: { type: string }
        oidc_sub: { type: string }
        last_login_at: { type: [string, "null"], format: date-time }
        memberships: { type: array, items: { $ref: "#/components/schemas/Membership" } }
    Membership:
      type: object
      required: [org, role]
      properties:
        user_id: { type: string }
        email: { type: string }
        org: { type: string }
        project_slug: { type: [string, "null"] }
        role: { $ref: "#/components/schemas/Role" }
    MembershipUpsert:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        project_slug: { type: [string, "null"] }
    Project:
      type: object
      required: [id, slug, org, name, status, config]
      properties:
        id: { type: string }
        slug: { type: string }
        org: { type: string }
        name: { type: string }
        template_ref: { type: [string, "null"] }
        status: { type: string, enum: [draft, provisioning, active, suspended, archived] }
        config: { $ref: "./schemas/project.schema.json" }
        workflow_name: { type: [string, "null"] }
        policy_name: { type: [string, "null"] }
        has_release_train: { type: boolean, default: false, description: "An active workflow of the project has a `via: release_train` transition: only then does the project have trains." }
        stats: { $ref: "#/components/schemas/ProjectStats" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProjectStats:
      type: object
      properties:
        active_work_items: { type: integer }
        cost_month_eur: { type: number }
        budget_month_eur: { type: [number, "null"] }
        trains_pending: { type: integer }
        first_pass_merge_rate: { type: [number, "null"] }
        cycle_time_p50_hours: { type: [number, "null"] }
    ProjectPage:
      type: object
      required: [items, meta]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Project" } }
        meta: { $ref: "#/components/schemas/PageMeta" }
    ProjectCreate:
      type: object
      required: [slug, name, config]
      properties:
        slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        name: { type: string }
        template_ref: { type: [string, "null"] }
        config: { $ref: "./schemas/project.schema.json" }
        inputs: { type: object, additionalProperties: true }
    ProjectUpdate:
      type: object
      properties:
        name: { type: string }
        config: { $ref: "./schemas/project.schema.json" }
    ProvisionRequest:
      type: object
      properties:
        inputs: { type: object, additionalProperties: true }
        dry_run: { type: boolean, default: false }
        resume: { type: boolean, default: true }
    ProvisionStatus:
      type: object
      required: [project_id, status, steps]
      properties:
        project_id: { type: string }
        workflow_id: { type: [string, "null"] }
        status: { type: string, enum: [pending, running, succeeded, failed] }
        current_step: { type: [string, "null"] }
        steps:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name: { type: string }
              status: { type: string, enum: [pending, running, succeeded, failed, skipped] }
              message: { type: [string, "null"] }
              remediation: { type: [string, "null"] }
              started_at: { type: [string, "null"], format: date-time }
              ended_at: { type: [string, "null"], format: date-time }
    Connector:
      type: object
      required: [kind, type, status]
      properties:
        id: { type: string }
        kind: { type: string, description: "a capability (ADR 0034): tracker, scm, ci, cd, runtime, memory, notify, gateway — or one a plugin type declares (identity, mcp…)" }
        type: { type: string }
        config: { type: object, additionalProperties: true }
        secret_ref: { type: [string, "null"] }
        secret_refs: { type: object, additionalProperties: { type: string }, description: "the secrets, field by field, as references (`env:NAME`) — never their value (ADR 0034)" }
        status: { type: string, enum: [unknown, ok, degraded, error] }
        last_check_at: { type: [string, "null"], format: date-time }
        last_error: { type: [string, "null"] }
    ConnectorUpsert:
      type: object
      required: [type, config]
      properties:
        type: { type: string }
        config: { type: object, additionalProperties: true, description: "no secret field: a plaintext secret gets 422" }
        secret_ref: { type: [string, "null"] }
        secret_refs: { type: object, additionalProperties: { type: string } }
    ConnectorTestResult:
      type: object
      required: [ok, checks]
      properties:
        ok: { type: boolean }
        checks:
          type: array
          items:
            type: object
            required: [name, ok]
            properties:
              name: { type: string }
              ok: { type: boolean }
              detail: { type: [string, "null"] }
    ConnectorType:
      type: object
      required: [kind, type, display, config_schema]
      properties:
        kind: { type: string }
        type: { type: string }
        display: { type: string }
        available: { type: boolean, default: true }
        config_schema: { type: object, additionalProperties: true }
        capabilities: { type: array, items: { type: string }, description: "what the type can do: tracker, scm, identity, mcp…" }
        secret_fields: { type: array, items: { type: string }, description: the configuration keys that are secrets }
    ConnectorOperation:
      type: object
      required: [name, access, policy]
      properties:
        name: { type: string }
        access: { type: string, enum: [read, write] }
        policy: { type: string, enum: [allowed, approval, forbidden] }
        groups: { type: array, items: { type: string }, description: "the project groups entitled to it; none: all of them" }
        price_usd: { type: [number, "null"] }
        schema_digest: { type: [string, "null"] }
        input_schema: { type: [object, "null"], additionalProperties: true, description: "the input schema the broker announces to the agent and checks before the call" }
        description: { type: [string, "null"] }
        approver_group: { type: [string, "null"], description: "the identity-provider group whose members approve the actions this operation proposes; none: the project's owners" }
    ConnectorDiscovery:
      type: object
      properties:
        added: { type: array, items: { type: string } }
        changed: { type: array, items: { type: string } }
        removed: { type: array, items: { type: string } }
        unchanged: { type: integer }
    OrgConnector:
      type: object
      required: [name, kind, type, status]
      properties:
        name: { type: string }
        kind: { type: string }
        type: { type: string }
        config: { type: object, additionalProperties: true }
        secret_refs: { type: object, additionalProperties: { type: string } }
        status: { type: string }
        last_check_at: { type: [string, "null"], format: date-time }
        last_error: { type: [string, "null"] }
        created_by: { type: [string, "null"] }
        operations: { type: array, items: { $ref: "#/components/schemas/ConnectorOperation" } }
    OrgConnectorCreate:
      type: object
      required: [name, type]
      properties:
        name: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$" }
        type: { type: string }
        kind: { type: [string, "null"] }
        config: { type: object, additionalProperties: true }
        secret_refs: { type: object, additionalProperties: { type: string } }
    OperationPatch:
      type: object
      properties:
        policy: { type: [string, "null"], enum: [allowed, approval, forbidden, null] }
        groups: { type: [array, "null"], items: { type: string } }
        price_usd: { type: [number, "null"], minimum: 0 }
        approver_group: { type: [string, "null"], description: "an identity-provider group; null clears it" }
    ProjectOperation:
      type: object
      required: [connector, operation, access, org_policy, effective_policy]
      properties:
        connector: { type: string }
        operation: { type: string }
        access: { type: string }
        org_policy: { type: string }
        project_policy: { type: [string, "null"] }
        effective_policy: { type: string }
        description: { type: [string, "null"] }
    ProjectOperationPut:
      type: object
      required: [policy]
      properties:
        policy: { type: string, enum: [allowed, approval, forbidden] }
    ActionEffectSpec:
      type: object
      required: [effect]
      properties:
        effect: { type: string, description: "a declared effect: connector.call, or a plugin's" }
        with: { type: object, additionalProperties: true, description: "its parameters, rendered in sandboxed Jinja with `params` and `effects`" }
        compensate: { type: [object, "null"], additionalProperties: true, description: "{effect, with}: what undoes it if a later effect fails (`result` quotes its response there)" }
    ActionApproval:
      type: object
      properties:
        approvers:
          type: array
          items:
            type: object
            properties:
              role: { type: string, enum: [developer, release_captain, project_owner, org_admin] }
              group: { type: [string, "null"], description: "an identity-provider group the approver must also belong to (ADR 0052)" }
              min: { type: integer, minimum: 1, maximum: 5 }
        step_up_minutes: { type: integer, minimum: 1, maximum: 120, default: 10 }
        separation_of_duties: { type: boolean, default: true }
    ActionCreate:
      type: object
      required: [kind, title, effects]
      properties:
        kind: { type: string }
        title: { type: string }
        justification: { type: [string, "null"] }
        params: { type: object, additionalProperties: true }
        effects: { type: array, minItems: 1, items: { $ref: "#/components/schemas/ActionEffectSpec" } }
        approval: { $ref: "#/components/schemas/ActionApproval" }
        work_item_id: { type: [string, "null"] }
    ActionDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
        reason: { type: [string, "null"] }
    ActionEffect:
      type: object
      required: [position, key, effect, status]
      description: An effect under its key (`<action>:<n>`) — recorded before it is attempted, confirmed after.
      properties:
        position: { type: integer }
        key: { type: string }
        effect: { type: string }
        status: { type: string, enum: [started, done, compensated, compensation_failed] }
        attempts: { type: integer }
        result: { type: [object, "null"], additionalProperties: true }
        error: { type: [string, "null"] }
        finished_at: { type: [string, "null"], format: date-time }
    Action:
      type: object
      required: [id, origin, kind, title, status]
      description: A governed action (ADR 0035) and the log of its effects.
      properties:
        id: { type: string }
        origin: { type: string, enum: [ontology, tool, transition] }
        kind: { type: string }
        title: { type: string }
        justification: { type: [string, "null"] }
        params: { type: object, additionalProperties: true }
        effects: { type: array, items: { type: object, additionalProperties: true } }
        proposed_by: { type: object, additionalProperties: true }
        approval: { type: object, additionalProperties: true }
        decisions: { type: array, items: { type: object, additionalProperties: true } }
        status: { type: string, enum: [pending_approval, rejected, approved, running, awaiting_evidence, succeeded, failed] }
        result: { type: [object, "null"], additionalProperties: true }
        error: { type: [string, "null"] }
        temporal_wf_id: { type: [string, "null"] }
        work_item_id: { type: [string, "null"] }
        run_id: { type: [string, "null"] }
        project_slug: { type: [string, "null"] }
        created_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        journal: { type: array, items: { $ref: "#/components/schemas/ActionEffect" } }
    ProjectRequirement:
      type: object
      required: [capability, reasons]
      description: A capability the project's workflows require, and why (ADR 0034).
      properties:
        capability: { type: string }
        reasons: { type: array, items: { type: string } }
        connector: { oneOf: [{ $ref: "#/components/schemas/Connector" }, { type: "null" }] }
        default_type: { type: [string, "null"], description: "the type the platform uses when no connector covers it" }
    WorkflowDef:
      type: object
      required: [name, version, source, yaml, checksum, is_active]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: integer }
        source: { type: string, enum: [repo, platform, template] }
        yaml: { type: string }
        json: { $ref: "./schemas/workflow.schema.json" }
        checksum: { type: string }
        is_active: { type: boolean }
        is_default: { type: boolean }
        created_by: { type: [string, "null"] }
        created_at: { type: [string, "null"], format: date-time }
    WorkflowPut:
      type: object
      required: [yaml]
      properties:
        yaml: { type: string }
        source: { type: string, enum: [repo, platform, template], default: platform }
        activate: { type: boolean, default: true }
        base_version: { type: [integer, "null"], description: "The active version the editor read: stale → 409." }
        create_only: { type: boolean, default: false, description: "Create a new workflow: a workflow of that name already exists (active or not) → 409, nothing is published." }
    WorkflowSummary:
      type: object
      required: [name, version, is_default, open_items]
      properties:
        name: { type: string }
        version: { type: integer }
        description: { type: [string, "null"] }
        is_default: { type: boolean }
        open_items: { type: integer, description: "Open tickets pinned to one of its versions." }
        created_by: { type: [string, "null"] }
        updated_at: { type: [string, "null"], format: date-time }
    WorkflowRouting:
      type: object
      required: [default, rules]
      properties:
        default: { type: string }
        rules:
          type: array
          items:
            type: object
            required: [when, workflow]
            properties:
              workflow: { type: string }
              when:
                type: object
                properties:
                  labels_any: { type: array, items: { type: string } }
                  labels_all: { type: array, items: { type: string } }
                  item_type: { type: [string, "null"] }
    WorkflowValidateRequest:
      type: object
      properties:
        yaml: { type: string }
        json: { type: object, additionalProperties: true }
    WorkflowValidation:
      type: object
      required: [valid, errors, warnings]
      properties:
        valid: { type: boolean }
        errors: { type: array, items: { $ref: "#/components/schemas/WorkflowIssue" } }
        warnings: { type: array, items: { $ref: "#/components/schemas/WorkflowIssue" } }
        graph: { $ref: "#/components/schemas/WorkflowGraph" }
        process: { type: array, items: { $ref: "#/components/schemas/ProcessStep" } }
    ProcessStep:
      type: object
      description: A transition in plain words — the process view (ADR 0031).
      required: [id, from, to, actor, actor_type, who, sentence]
      properties:
        id: { type: string }
        from: { type: string }
        from_display: { type: string }
        to: { type: string }
        to_display: { type: string }
        actor: { type: string }
        actor_type: { type: string, enum: [agent, human, system, release_train] }
        who: { type: string }
        outputs: { type: array, items: { type: string } }
        gates: { type: array, items: { type: object, properties: { name: { type: string }, summary: { type: string } } } }
        on_fail: { type: [string, "null"] }
        on_reject: { type: [string, "null"] }
        timeout_hours: { type: [integer, "null"] }
        sentence: { type: string }
    WorkflowOperation:
      type: object
      required: [op]
      description: >-
        A typed operation. `op` says which one; the other fields depend on it (`name`, `spec`,
        `from`, `to`, `id`, `transition`, `field`, `value`, `raw`, `unset`, `gate`, `text`,
        `index`).
      properties:
        op:
          type: string
          enum: [add_state, remove_state, rename_state, set_state, add_transition, remove_transition,
                 set_transition, add_gate, remove_gate, add_actor, remove_actor, set_actor]
      additionalProperties: true
    WorkflowEditRequest:
      type: object
      required: [yaml, operations]
      additionalProperties: false
      properties:
        yaml: { type: string }
        operations: { type: array, minItems: 1, items: { $ref: "#/components/schemas/WorkflowOperation" } }
    WorkflowEditResult:
      allOf:
        - $ref: "#/components/schemas/WorkflowValidation"
        - type: object
          required: [yaml, diff, inverse, notices]
          properties:
            yaml: { type: string }
            diff: { type: string, description: unified diff from the original text to the edited text }
            inverse: { type: array, items: { $ref: "#/components/schemas/WorkflowOperation" } }
            notices: { type: array, items: { type: string }, description: "what an operation changes beyond the text (a state with effects renamed…)" }
    AgentLimits:
      type: object
      properties:
        max_turns: { type: [integer, "null"], minimum: 1, maximum: 1000 }
        max_minutes: { type: [integer, "null"], minimum: 1, maximum: 480 }
    AgentBudget:
      type: object
      properties:
        run_usd: { type: [number, "null"], exclusiveMinimum: 0 }
        daily_usd: { type: [number, "null"], exclusiveMinimum: 0 }
        monthly_usd: { type: [number, "null"], exclusiveMinimum: 0 }
    AgentSpec:
      type: object
      description: What an agent version is; it never changes (ADR 0033).
      properties:
        instructions: { type: string, maxLength: 65536 }
        model: { type: [string, "null"] }
        backend: { type: [string, "null"] }
        limits: { $ref: "#/components/schemas/AgentLimits" }
        budget: { $ref: "#/components/schemas/AgentBudget" }
        skills: { type: array, items: { type: object, required: [slug], properties: { slug: { type: string }, version: { type: [integer, "null"] } } } }
        mcp_servers: { type: array, items: { type: object, required: [connector], properties: { connector: { type: string }, tools: { type: array, items: { type: string } } } } }
        knowledge: { type: array, description: "the knowledge bases the agent reads (ADR 0051); each must be served to the run's project", items: { type: object, required: [slug], properties: { slug: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$" } } } }
        evals: { type: array, items: { $ref: "#/components/schemas/AgentEvalCase" }, description: "The agent's eval suite (S32-03): every case of the published version and of the new one must pass before the new one is published" }
        memory: { type: string, enum: [none, project, agent], default: project, description: "whose memory a run reads and writes (S32-02): the project's shared memory, the agent's own within the project, or none" }
    AgentEvalCase:
      type: object
      description: A deterministic case (ADR 0020, level 1) — the instructions rendered on its sample input contain what they must, and nothing they must not.
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        input: { $ref: "#/components/schemas/AgentSampleInput" }
        must_contain: { type: array, items: { type: string } }
        must_not_contain: { type: array, items: { type: string } }
    AgentSampleInput:
      type: object
      description: A sample work item an agent is tried or evaluated on.
      properties:
        title: { type: string, maxLength: 500 }
        body: { type: string, maxLength: 20000 }
    AgentEvalResult:
      type: object
      required: [name, passed]
      properties:
        name: { type: string }
        passed: { type: boolean }
        missing: { type: array, items: { type: string } }
        forbidden: { type: array, items: { type: string } }
        error: { type: [string, "null"], description: "the instructions do not render on this input" }
    AgentTrialCreate:
      type: object
      description: Try a draft version on a sample input, in one project, under a capped budget (S32-03).
      required: [project, spec, input]
      properties:
        project: { type: string, description: "the project's slug: its model profiles, backend and tools apply" }
        spec: { $ref: "#/components/schemas/AgentSpec" }
        input: { $ref: "#/components/schemas/AgentSampleInput" }
        budget_usd: { type: [number, "null"], exclusiveMinimum: 0, description: "capped at 0.50 $, at the version's budget per run and at the project's budget per work item" }
        agent: { type: [string, "null"], description: "the agent the draft would become a version of: its published suite is run too" }
    AgentTrial:
      type: object
      required: [run_id, work_item_id, project, budget_usd, status]
      properties:
        run_id: { type: string, description: "read it at `GET /runs/{id}`" }
        work_item_id: { type: string }
        project: { type: string }
        budget_usd: { type: number }
        status: { type: string }
        evals: { type: array, items: { $ref: "#/components/schemas/AgentEvalResult" } }
    AgentCreate:
      type: object
      required: [slug, display_name]
      properties:
        slug: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$" }
        kind: { type: string, enum: [internal, external], default: internal }
        display_name: { type: string }
        description: { type: [string, "null"] }
        spec: { $ref: "#/components/schemas/AgentSpec" }
        lifecycle: { type: string, enum: [draft, active], default: active, description: a draft is neither pinned nor run until it is activated }
    AgentCatalogueEntry:
      type: object
      description: An agent the platform's catalogue offers (ADR 0040), and its state in the organisation.
      required: [slug, kind, display_name, role, summary, version, installed]
      properties:
        slug: { type: string }
        kind: { type: string, enum: [internal, external] }
        display_name: { type: string }
        description: { type: [string, "null"] }
        role: { type: string, description: "the package role it plays (`implement`, `review`…), or `external` for a client" }
        summary: { type: string }
        version: { type: integer, description: the catalogue's version of the entry }
        skills: { type: array, items: { type: string } }
        client: { type: [string, "null"], description: "an external client's id on the AI clients page" }
        reach: { type: [string, "null"], enum: [always, cloud, null], description: "`cloud`: it calls from its vendor's cloud" }
        installed: { type: boolean }
        installed_version: { type: [integer, "null"] }
        own_agent: { type: boolean, description: "an agent of the organisation has this name and does not come from the catalogue" }
        update_available: { type: boolean }
        offered: { type: boolean, description: "false for a client the door does not accept yet (OAuth, registered client, https)" }
        unavailable_reason: { type: [string, "null"] }
    AgentCatalogueConnect:
      type: object
      properties:
        read_only: { type: boolean, default: false, description: "a `mcp:read` token instead of `mcp:write`" }
        expires_in_days: { type: [integer, "null"], default: 30, minimum: 1, maximum: 365 }
    AgentCatalogueConnection:
      type: object
      required: [agent]
      properties:
        agent: { $ref: "#/components/schemas/Agent" }
        token: { oneOf: [{ $ref: "#/components/schemas/ApiTokenCreated" }, { type: "null" }], description: "returned once; none for a client that signs in with OAuth" }
        oauth_client_id: { type: [string, "null"] }
    AgentCatalogueInstall:
      type: object
      properties:
        upgrade: { type: boolean, default: false, description: "already installed: publish the catalogue's version as the next one" }
    AgentPatch:
      type: object
      properties:
        display_name: { type: [string, "null"] }
        description: { type: [string, "null"] }
        status: { type: [string, "null"], enum: [active, suspended, revoked, null] }
        expires_at: { type: [string, "null"], format: date-time }
    AgentVersion:
      type: object
      required: [version, spec, checksum]
      properties:
        version: { type: integer }
        spec: { $ref: "#/components/schemas/AgentSpec" }
        checksum: { type: string }
        created_by: { type: [string, "null"] }
        created_at: { type: [string, "null"], format: date-time }
    Agent:
      type: object
      required: [slug, kind, display_name, status, latest_version]
      properties:
        slug: { type: string }
        kind: { type: string, enum: [internal, external] }
        display_name: { type: string }
        description: { type: [string, "null"] }
        status: { type: string }
        owner: { type: [string, "null"] }
        expires_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        latest_version: { type: integer }
        created_at: { type: [string, "null"], format: date-time }
        versions: { type: [array, "null"], items: { $ref: "#/components/schemas/AgentVersion" } }
        lifecycle: { type: string, enum: [draft, active, deprecated, retired], default: active, description: "where the agent is in its life (S32-04); apart from the operational status" }
        retired_at: { type: [string, "null"], format: date-time }
        last_run_at: { type: [string, "null"], format: date-time }
        unused: { type: boolean, description: no run for 60 days (since its creation if it never ran) }
    AgentLifecycleChange:
      type: object
      required: [to]
      properties:
        to: { type: string, enum: [active, deprecated, retired] }
        force: { type: boolean, default: false, description: retire although runs of the agent are in flight }
        reason: { type: [string, "null"], maxLength: 500 }
    AgentLifecycleResult:
      type: object
      required: [agent]
      properties:
        agent: { $ref: "#/components/schemas/Agent" }
        revoked_credentials: { type: integer }
        unpinned_projects: { type: array, items: { type: string } }
        running_work_items: { type: array, items: { type: string } }
        forced: { type: boolean }
    AgentOwnerChange:
      type: object
      required: [email]
      properties:
        email: { type: string }
    AgentMetrics:
      type: object
      required: [agent, days, runs, succeeded, failed]
      properties:
        agent: { type: string }
        days: { type: integer }
        runs: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        success_rate: { type: [number, "null"] }
        cost_usd: { type: number }
        cost_by_kind: { type: object, additionalProperties: { type: number } }
        by_project: { type: array, items: { type: object, required: [project, runs, cost_usd], properties: { project: { type: string }, runs: { type: integer }, cost_usd: { type: number } } } }
        spent_today_usd: { type: number }
        daily_budget_usd: { type: [number, "null"] }
    AgentMetricsSummary:
      type: object
      description: An agent's line in the registry over a period.
      required: [agent, days, runs]
      properties:
        agent: { type: string }
        days: { type: integer }
        runs: { type: integer }
        success_rate: { type: [number, "null"] }
        cost_usd: { type: number }
    ImplicitAgent:
      type: object
      description: A workflow actor that runs as an agent without naming one of the registry.
      required: [workflow, actor]
      properties:
        workflow: { type: string }
        actor: { type: string }
        role: { type: [string, "null"] }
        model: { type: [string, "null"] }
        backend: { type: [string, "null"] }
        max_turns: { type: [integer, "null"] }
        max_minutes: { type: [integer, "null"] }
    AgentCredentialCreate:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [token, oauth_client] }
        token_id: { type: [string, "null"] }
        client_id: { type: [string, "null"] }
    AgentCredential:
      type: object
      required: [id, kind]
      properties:
        id: { type: string }
        kind: { type: string }
        token_id: { type: [string, "null"] }
        client_id: { type: [string, "null"] }
        created_by: { type: [string, "null"] }
        created_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        token_name: { type: [string, "null"], description: the name of the attached token }
        last_used_at: { type: [string, "null"], format: date-time, description: "the token's last call to the MCP door: the console shows it as connected" }
        last_client: { type: [string, "null"], description: "the client of that last call (`User-Agent`, truncated)" }
        agent: { type: [string, "null"], description: "the slug of the agent the client is attached to" }
    AgentOverrides:
      type: object
      description: What a project changes in a version — tightening only.
      properties:
        limits: { $ref: "#/components/schemas/AgentLimits" }
        budget: { $ref: "#/components/schemas/AgentBudget" }
        tools: { type: [array, "null"], items: { type: string } }
    ProjectAgentPut:
      type: object
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
        overrides: { $ref: "#/components/schemas/AgentOverrides" }
    ProjectAgent:
      type: object
      required: [agent, version, overrides, effective]
      properties:
        agent: { type: string }
        version: { type: integer }
        overrides: { $ref: "#/components/schemas/AgentOverrides" }
        effective: { $ref: "#/components/schemas/AgentSpec" }
        warning: { type: [string, "null"], description: said when the agent is deprecated }
    SkillFiles:
      type: object
      required: [files]
      properties:
        files: { type: object, additionalProperties: { type: string }, description: relative path → text }
    SkillSource:
      type: object
      description: Where a version imported from git comes from (ADR 0050).
      required: [repo, sha, path]
      properties:
        repo: { type: string }
        sha: { type: string, description: the full commit SHA the version is pinned to }
        path: { type: string, description: "the skill's folder in the repository; empty is the root" }
        licence: { type: [string, "null"], description: "an SPDX identifier, LicenseRef-proprietary, LicenseRef-unknown, or null when none was found" }
    SkillVersion:
      type: object
      required: [version, digest]
      properties:
        version: { type: integer }
        digest: { type: string }
        created_by: { type: [string, "null"] }
        created_at: { type: [string, "null"], format: date-time }
        files: { type: [object, "null"], additionalProperties: { type: string } }
        source: { oneOf: [{ $ref: "#/components/schemas/SkillSource" }, { type: "null" }] }
        risk: { type: [string, "null"], enum: [low, medium, high, null], description: "the gate's tier; null before the gate existed" }
        review_status: { type: string, enum: [approved, pending_review], description: "a high-risk version waits for an administrator who is not its importer; until then no agent pins it and no run receives it" }
        findings: { type: array, items: { $ref: "#/components/schemas/SkillFinding" } }
        reviewed_by: { type: [string, "null"] }
        reviewed_at: { type: [string, "null"], format: date-time }
    SkillFinding:
      type: object
      description: What the gate found in a version (ADR 0050).
      required: [code, severity, detail]
      properties:
        code: { type: string, description: "script, executable, outbound_url, credential, mcp_reference, prompt_injection, hidden_unicode, obfuscated, pipe_to_shell, licence_missing, licence_not_open" }
        severity: { type: string, enum: [info, warning, critical] }
        detail: { type: string }
        file: { type: [string, "null"] }
        line: { type: [integer, "null"] }
    SkillSources:
      type: object
      required: [sources]
      properties:
        sources: { type: array, items: { type: string }, maxItems: 100 }
        default: { type: boolean, description: true when the organisation has not written its own list }
    SkillGitPreviewRequest:
      type: object
      required: [repo_url, ref]
      properties:
        repo_url: { type: string, description: "https://github.com/<owner>/<repo> or https://gitlab.com/<group>/…/<project>" }
        path: { type: string, default: "", description: a folder holding one skill, or several skill folders }
        ref: { type: string, description: a branch, a tag or a commit }
    SkillGitImport:
      type: object
      required: [repo_url, sha, skills]
      properties:
        repo_url: { type: string }
        path: { type: string, default: "" }
        sha: { type: string, description: a full commit SHA; a branch or a tag is refused }
        skills: { type: array, items: { type: string }, minItems: 1, maxItems: 100 }
    SkillCandidate:
      type: object
      required: [path, files, bytes]
      properties:
        path: { type: string }
        name: { type: [string, "null"] }
        description: { type: [string, "null"] }
        files: { type: integer }
        bytes: { type: integer }
        licence: { type: [string, "null"] }
        problem: { type: [string, "null"], description: why it cannot be imported }
        existing_version: { type: [integer, "null"], description: the latest version of the library's skill of that name }
        risk: { type: [string, "null"], enum: [low, medium, high, null], description: "the gate's tier; null before the gate existed" }
        findings: { type: array, items: { $ref: "#/components/schemas/SkillFinding" } }
    SkillGitPreview:
      type: object
      required: [repo, ref, sha, path, allowed, skills]
      properties:
        repo: { type: string }
        ref: { type: string }
        sha: { type: string }
        path: { type: string }
        allowed: { type: boolean, description: whether the repository is in the organisation's allowlist }
        skills: { type: array, items: { $ref: "#/components/schemas/SkillCandidate" } }
    SkillUpdate:
      type: object
      required: [slug, version, source, ref, sha, up_to_date]
      properties:
        slug: { type: string }
        version: { type: integer }
        source: { $ref: "#/components/schemas/SkillSource" }
        ref: { type: string }
        sha: { type: string }
        up_to_date: { type: boolean }
        digest: { type: [string, "null"] }
        added: { type: array, items: { type: string } }
        removed: { type: array, items: { type: string } }
        modified: { type: array, items: { type: string } }
        problem: { type: [string, "null"] }
    Skill:
      type: object
      required: [slug, status, latest_version]
      properties:
        slug: { type: string }
        description: { type: [string, "null"] }
        status: { type: string }
        latest_version: { type: integer }
        used_by: { type: array, items: { type: string } }
        versions: { type: [array, "null"], items: { $ref: "#/components/schemas/SkillVersion" } }
        risk: { type: [string, "null"], enum: [low, medium, high, null], description: "the gate's tier of the latest version; null before the gate existed" }
        review_status: { type: string, enum: [approved, pending_review] }
    KnowledgeBaseCreate:
      type: object
      required: [slug, name]
      additionalProperties: false
      properties:
        slug: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$" }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 2000 }
        scope: { type: string, enum: [org, projects, groups], default: org, description: "`org`: every project; `projects`: the listed ones; `groups`: humans of the listed IdP groups (never a run)" }
        projects: { type: array, items: { type: string }, maxItems: 200 }
        groups: { type: array, items: { type: string }, maxItems: 200 }
        serving_mode: { type: string, enum: [files, index], default: files, description: "`files`: the converted corpus mounted read-only in the workspace; `index`: hybrid search" }
    KnowledgeBasePatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: [string, "null"], minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 2000 }
        scope: { type: [string, "null"], enum: [org, projects, groups, null] }
        projects: { type: [array, "null"], items: { type: string }, maxItems: 200 }
        groups: { type: [array, "null"], items: { type: string }, maxItems: 200 }
        serving_mode: { type: [string, "null"], enum: [files, index, null] }
        status: { type: [string, "null"], enum: [active, archived, null] }
    KnowledgeDocument:
      type: object
      required: [id, filename, title, mime, size_bytes, digest, source, status]
      properties:
        id: { type: string }
        filename: { type: string }
        title: { type: string, description: "the format's own title, else the first heading, else the file name" }
        mime: { type: string }
        size_bytes: { type: integer }
        digest: { type: string, description: sha256 of the uploaded bytes }
        source: { type: string, description: "`upload`" }
        status: { type: string, enum: [pending, converting, ready, failed] }
        error: { type: [string, "null"] }
        created_by: { type: [string, "null"] }
        created_at: { type: [string, "null"], format: date-time }
        converted_at: { type: [string, "null"], format: date-time }
        markdown: { type: [string, "null"], description: returned by the reading of one document }
        source_id: { type: [string, "null"], description: the source it was synced from; none for an upload }
        source_url: { type: [string, "null"], description: where to open the original }
    KnowledgeBase:
      type: object
      required: [slug, name, scope, serving_mode, status]
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        scope: { type: string, enum: [org, projects, groups] }
        projects: { type: array, items: { type: string } }
        groups: { type: array, items: { type: string } }
        serving_mode: { type: string, enum: [files, index] }
        status: { type: string }
        document_count: { type: integer }
        documents_by_status: { type: object, additionalProperties: { type: integer } }
        created_by: { type: [string, "null"] }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
        documents: { type: [array, "null"], items: { $ref: "#/components/schemas/KnowledgeDocument" } }
        index:
          type: [object, "null"]
          description: "`index` mode: chunks, documents indexed, and the search mode (`hybrid`, `full-text` without pgvector or embedder, `in-process` on SQLite)"
          properties:
            chunks: { type: integer }
            documents: { type: integer }
            mode: { type: string }
        eval_set: { type: array, items: { $ref: "#/components/schemas/KnowledgeEvalCase" } }
        sources: { type: [array, "null"], items: { $ref: "#/components/schemas/KnowledgeSource" }, description: returned by the reading of one base }
        distillation:
          type: [object, "null"]
          description: "the last distillation: `status` (running, pending_review, failed), `skill`, `version`, `principles`, `dropped` (principles citing nothing of the base), `error`, `at`"
        eval_result:
          type: [object, "null"]
          description: the last run of the eval set
          properties:
            k: { type: integer }
            recall: { type: [number, "null"], description: "expected documents found in the top k / expected documents" }
            mode: { type: string }
            ran_at: { type: string }
            cases:
              type: array
              items:
                type: object
                properties:
                  question: { type: string }
                  expected: { type: array, items: { type: string } }
                  found: { type: array, items: { type: string } }
                  returned: { type: array, items: { type: string } }
    KnowledgeSourceCreate:
      type: object
      required: [kind, name]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [sharepoint, web, git] }
        name: { type: string, minLength: 1, maxLength: 200 }
        connector: { type: [string, "null"], description: "`sharepoint`: the organisation connector of capability `documents`" }
        config:
          type: object
          description: "`sharepoint`: `site_id` or `drive_id`, optional `folder`; `web`: `url` (https), `max_depth` (≤ 5), `max_pages` (≤ 500); `git`: `url` (https), `ref`, `paths` (globs, default `*.md`)"
        interval_minutes: { type: integer, minimum: 5, maximum: 10080, default: 60 }
        refresh_mode: { type: string, enum: [interval, cron, manual], default: interval, description: "`interval`: every `interval_minutes`; `cron`: `refresh_cron` in `refresh_timezone`; `manual`: only on demand (S39-19)" }
        refresh_cron: { type: [string, "null"], maxLength: 100, description: "five fields (minute hour day month weekday); at least 5 minutes between two fires" }
        refresh_timezone: { type: string, maxLength: 64, default: UTC, description: IANA name, for example `Europe/Paris` }
    KnowledgeSourcePatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: [string, "null"], minLength: 1, maxLength: 200 }
        config: { type: [object, "null"] }
        interval_minutes: { type: [integer, "null"], minimum: 5, maximum: 10080 }
        refresh_mode: { type: [string, "null"], enum: [interval, cron, manual, null] }
        refresh_cron: { type: [string, "null"], maxLength: 100 }
        refresh_timezone: { type: [string, "null"], maxLength: 64 }
    KnowledgeSource:
      type: object
      required: [id, kind, name, interval_minutes, status]
      properties:
        id: { type: string }
        kind: { type: string, enum: [sharepoint, web, git] }
        name: { type: string }
        connector: { type: [string, "null"] }
        config: { type: object }
        interval_minutes: { type: integer }
        refresh_mode: { type: string, enum: [interval, cron, manual] }
        refresh_cron: { type: [string, "null"] }
        refresh_timezone: { type: string }
        next_sync_at: { type: [string, "null"], format: date-time, description: an estimate (the worker may be down); null in manual mode or when due }
        sync_requested_at: { type: [string, "null"], format: date-time }
        status: { type: string, enum: [idle, syncing, failed] }
        last_synced_at: { type: [string, "null"], format: date-time }
        last_error: { type: [string, "null"] }
        last_summary:
          type: [object, "null"]
          description: what the last sync did
          properties:
            added: { type: integer }
            updated: { type: integer }
            deleted: { type: integer }
            unchanged: { type: integer }
            skipped: { type: integer }
            skipped_reasons: { type: array, items: { type: string } }
        document_count: { type: integer }
    KnowledgeEvalCase:
      type: object
      required: [question, expected]
      additionalProperties: false
      properties:
        question: { type: string, minLength: 1, maxLength: 2000 }
        expected: { type: array, minItems: 1, maxItems: 20, items: { type: string }, description: file names or titles }
    KnowledgeEvalSet:
      type: object
      additionalProperties: false
      properties:
        cases: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/KnowledgeEvalCase" } }
    KnowledgeSearchRequest:
      type: object
      required: [query]
      additionalProperties: false
      properties:
        query: { type: string, minLength: 1, maxLength: 2000 }
        k: { type: integer, minimum: 1, maximum: 20, default: 5 }
        knowledge_base: { type: [string, "null"], description: "internal search: one base of the run; absent, all of them" }
    KnowledgeCitation:
      type: object
      required: [knowledge_base, document_id, document, filename, heading_path, excerpt, score]
      properties:
        knowledge_base: { type: string }
        document_id: { type: string }
        document: { type: string, description: the document's title }
        filename: { type: string }
        heading_path: { type: array, items: { type: string } }
        excerpt: { type: string }
        score: { type: number, description: reciprocal rank fusion score }
    KnowledgeSearchResult:
      type: object
      required: [mode, hits]
      properties:
        mode: { type: string, enum: [hybrid, full-text, in-process] }
        hits: { type: array, items: { $ref: "#/components/schemas/KnowledgeCitation" } }
    WorkflowIssue:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        path: { type: [string, "null"] }
        line: { type: [integer, "null"] }
        column: { type: [integer, "null"] }
        deprecated_code:
          type: [string, "null"]
          deprecated: true
          description: >-
            Former spelling of a code renamed to English (`gate.sans_matiere` is now
            `gate.nothing_to_check`, `workflow.effet_implicite` is now `workflow.implicit_effect`),
            emitted for one release (ADR 0046)
    WorkflowGraph:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items:
            type: object
            required: [id, display, kind]
            properties:
              id: { type: string }
              display: { type: string }
              kind: { type: string }
              terminal: { type: boolean }
              lane: { type: string }
              tracker_status: { type: [string, "null"], description: "The tracker column the state maps to; the console groups the path into stages by it." }
        edges:
          type: array
          items:
            type: object
            required: [from, to]
            properties:
              id: { type: [string, "null"] }
              from: { type: string }
              to: { type: string }
              kind:
                type: string
                description: "`nominal` for a transition of the YAML; `reject`, `resume`, `escalate`, `default`… for the secondary edges (drawn dashed)."
              label: { type: string }
              wildcard: { type: boolean }
              actor: { type: [string, "null"] }
              actor_type: { type: [string, "null"] }
              role: { type: [string, "null"] }
              gates: { type: array, items: { type: string } }
              via: { type: [string, "null"] }
              timeout_hours: { type: [integer, "null"] }
    WorkflowTemplate:
      type: object
      required: [name, version, display, yaml]
      properties:
        name: { type: string }
        version: { type: integer }
        display: { type: string }
        description: { type: string }
        yaml: { type: string }
    PolicyDef:
      type: object
      required: [name, version, yaml, is_active]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: integer }
        yaml: { type: string }
        json: { $ref: "./schemas/policy.schema.json" }
        is_active: { type: boolean }
        clamps:
          type: array
          items: { type: string }
          description: what the organisation's ceiling brings down in this policy; the policy that runs is the clamped one
    PolicyCeiling:
      type: object
      additionalProperties: false
      description: "Caps a project policy may only tighten (S27-05). A per-role table's `default` caps every role it does not name; a cap left out leaves the project free."
      properties:
        budgets:
          type: object
          additionalProperties: false
          properties:
            ticket_usd: { type: object, additionalProperties: { type: number } }
            stage_usd: { type: object, additionalProperties: { type: object, additionalProperties: { type: number } } }
            max_turns: { type: object, additionalProperties: { type: integer } }
            max_minutes: { type: object, additionalProperties: { type: integer } }
            tool_calls_per_run: { type: [integer, "null"], minimum: 1 }
            daily_project_usd: { type: [number, "null"], exclusiveMinimum: 0 }
        attempts:
          type: object
          additionalProperties: false
          properties:
            default_max: { type: [integer, "null"], minimum: 1 }
            by_role: { type: object, additionalProperties: { type: integer } }
            dod_iterations: { type: [integer, "null"], minimum: 0 }
        scope:
          type: object
          additionalProperties: false
          properties:
            auto_grant_max_files: { type: [integer, "null"], minimum: 0 }
            max_diff_files: { type: [integer, "null"], minimum: 1 }
            max_diff_lines: { type: [integer, "null"], minimum: 1 }
        findings:
          type: object
          additionalProperties: false
          properties:
            max_per_run: { type: [integer, "null"], minimum: 0 }
    PolicyCeilingState:
      type: object
      properties:
        ceiling: { oneOf: [{ $ref: "#/components/schemas/PolicyCeiling" }, { type: "null" }] }
        updated_by: { type: [string, "null"] }
        updated_at: { type: [string, "null"] }
    PolicyCeilingPut:
      type: object
      required: [ceiling]
      properties:
        ceiling: { oneOf: [{ $ref: "#/components/schemas/PolicyCeiling" }, { type: "null" }] }
    PolicyPut:
      type: object
      required: [yaml]
      properties:
        yaml: { type: string }
        activate: { type: boolean, default: true }
    GatewayModel:
      type: object
      required: [model_name, litellm_model]
      properties:
        model_name: { type: string }
        litellm_model: { type: string }
        provider: { type: string }
        input_cost_per_1k: { type: [number, "null"] }
        output_cost_per_1k: { type: [number, "null"] }
        max_input_tokens: { type: [integer, "null"] }
        supports_tool_calling: { type: boolean, default: true }
        supports_vision: { type: boolean, default: false }
        internal_price: { type: boolean, default: false }
    ProjectModels:
      type: object
      required: [profiles]
      properties:
        profiles:
          type: object
          additionalProperties:
            type: object
            required: [litellm_model]
            properties:
              litellm_model: { type: string }
              params: { type: object, additionalProperties: true }
              max_turns_factor: { type: number, default: 1 }
        allow_unvalidated: { type: boolean, default: false }
        inherited: { type: object, additionalProperties: { type: string } }
    ModelMatrix:
      type: object
      required: [entries]
      properties:
        generated_at: { type: [string, "null"], format: date-time }
        entries:
          type: array
          items:
            type: object
            required: [backend, model, validated]
            properties:
              backend: { type: string }
              model: { type: string }
              validated: { type: boolean }
              success_rate: { type: [number, "null"] }
              median_cost_usd: { type: [number, "null"] }
              median_duration_s: { type: [number, "null"] }
              with_memory: { type: [boolean, "null"] }
              report_url: { type: [string, "null"] }
    Org:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }
        role: { oneOf: [{ $ref: "#/components/schemas/Role" }, { type: "null" }] }
        currency: { type: string, enum: [EUR, USD], default: EUR, description: "the currency the console shows spend in (S29-03); an organisation setting" }
    OrgCreate:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        name: { type: string, minLength: 1, maxLength: 200 }
    OrgUpdate:
      type: object
      description: What changes in an organisation; the slug is in every URL and every MCP address.
      properties:
        slug: { type: [string, "null"], pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        name: { type: [string, "null"], minLength: 1, maxLength: 200 }
        currency: { type: [string, "null"], enum: [EUR, USD, null], description: "the currency spend is shown in; org_admin" }
    WorkItemCreate:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        body: { type: string, default: "" }
        size: { type: [string, "null"], enum: [S, M, L, XL, null] }
        risk: { type: [string, "null"], enum: [low, medium, high, null] }
        start: { type: boolean, default: true }
        workflow: { type: [string, "null"], description: "The workflow the ticket starts in; otherwise the routing, otherwise the default one (ADR 0031)." }
        labels: { type: array, items: { type: string }, description: "Read by the routing rules." }
        fields: { type: object, additionalProperties: true, description: "The ticket's fields, validated by its workflow's `metadata.inputs`." }
        budget_usd: { type: [number, "null"], exclusiveMinimum: 0, description: "The most this work item may spend, in USD. Only tightens the workflow's `budget.ticket_usd` and the policy's ticket budget; wider is 422 (ADR 0047)." }
    WorkItemUpdate:
      type: object
      required: [fields]
      additionalProperties: false
      properties:
        fields: { type: object, additionalProperties: true, description: "The fields that change; `null` removes one." }
    Integrations:
      type: object
      required: [mcp_url, protocol_versions, oauth, version]
      properties:
        mcp_url: { type: string, description: "The MCP door's URL; a project's adds `/projects/{org}:{slug}` to it." }
        protocol_versions: { type: array, items: { type: string } }
        oauth:
          type: object
          required: [enabled]
          properties:
            enabled: { type: boolean, description: "False as long as the door accepts only scoped tokens." }
            authorization_server: { type: [string, "null"] }
            clients:
              type: object
              description: >-
                The clients the IdP registered for the door, by client of the Integrations page
                (`claude-code`, `claude-ai`…): the page derives the exact command from them.
              additionalProperties:
                type: object
                required: [client_id]
                properties:
                  client_id: { type: string }
                  callback_port:
                    type: [integer, "null"]
                    description: "The port of the local redirect `http://localhost:PORT/callback` registered with the IdP."
        version: { type: string }
    TokenScope:
      type: string
      enum: ["*", "mcp:read", "mcp:write"]
      description: >-
        `*`: the REST API and the CLI. `mcp:read`, `mcp:write`: the MCP door only (ADR 0030) — such
        a token is refused by the REST API, and the door refuses `*`.
    ApiTokenCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        expires_in_days: { type: [integer, "null"], minimum: 1, maximum: 3650, default: 90 }
        scopes:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/TokenScope" }
          default: ["*"]
        project: { type: [string, "null"], description: "`org:slug`: bounds an MCP token to a single project." }
    ApiToken:
      type: object
      required: [id, name, created_at, scopes]
      properties:
        id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        scopes: { type: array, items: { $ref: "#/components/schemas/TokenScope" } }
        project: { type: [string, "null"], description: "`org:slug` of the linked project, if there is one." }
        last_client: { type: [string, "null"], description: "The client of the last call (`User-Agent`, truncated)." }
    ApiTokenCreated:
      allOf:
        - $ref: "#/components/schemas/ApiToken"
        - type: object
          required: [token]
          properties:
            token: { type: string, description: "The plaintext token, returned only once." }
    WorkflowFailure:
      type: object
      description: Why a ticket's interpreter died. The ticket will not move again without a restart.
      required: [message]
      properties:
        message: { type: string }
        activity: { type: [string, "null"] }
        state: { type: [string, "null"] }
        at: { type: [string, "null"], format: date-time }
    WorkItem:
      type: object
      required: [id, project_slug, tracker_key, title, state, totals]
      properties:
        fields: { type: object, additionalProperties: true, description: "The ticket's fields (ADR 0031)." }
        id: { type: string }
        project_slug: { type: string }
        tracker_key: { type: string }
        title: { type: string }
        body_snapshot: { type: [string, "null"] }
        url: { type: [string, "null"] }
        size: { oneOf: [{ $ref: "#/components/schemas/Size" }, { type: "null" }] }
        risk: { oneOf: [{ $ref: "#/components/schemas/Risk" }, { type: "null" }] }
        state: { type: string }
        state_display: { type: [string, "null"] }
        workflow_name: { type: [string, "null"] }
        workflow_version: { type: [integer, "null"] }
        temporal_wf_id: { type: [string, "null"] }
        workflow_status:
          type: [string, "null"]
          description: The workflow's Temporal status, when requested and known. FAILED, TERMINATED or TIMED_OUT = the ticket is dead.
        failure:
          oneOf: [{ $ref: "#/components/schemas/WorkflowFailure" }, { type: "null" }]
        paused: { type: boolean, default: false }
        current_run: { oneOf: [{ $ref: "#/components/schemas/RunSummary" }, { type: "null" }] }
        pending_request: { oneOf: [{ $ref: "#/components/schemas/HumanRequest" }, { type: "null" }] }
        pr_url: { type: [string, "null"] }
        totals: { $ref: "#/components/schemas/Totals" }
        budget_usd: { type: [number, "null"], description: "The budget given at launch or by the workflow (ADR 0047); the policy's applies otherwise." }
        estimate: { oneOf: [{ $ref: "#/components/schemas/CostEstimate" }, { type: "null" }] }
        created_at: { type: string, format: date-time }
        closed_at: { type: [string, "null"], format: date-time }
    Totals:
      type: object
      properties:
        tokens_in: { type: integer, default: 0 }
        tokens_out: { type: integer, default: 0 }
        tokens_cached: { type: integer, default: 0 }
        cost_usd: { type: number, default: 0 }
        cost_eur: { type: number, default: 0 }
        duration_s: { type: number, default: 0 }
        runs: { type: integer, default: 0 }
    CostEstimate:
      type: object
      properties:
        median_usd: { type: [number, "null"] }
        p80_usd: { type: [number, "null"] }
        sample_size: { type: integer, default: 0 }
        over_p80: { type: boolean, default: false }
    WorkItemPage:
      type: object
      required: [items, meta]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/WorkItem" } }
        meta: { $ref: "#/components/schemas/PageMeta" }
    HandOff:
      type: object
      description: An output of a step and its receipts, in order (S25-04).
      required: [output, events]
      properties:
        output: { type: string, description: "spec_markdown, plan_markdown, or an output a transition declares" }
        current_digest: { type: [string, "null"], description: "The digest of what the output is worth today; null when it is gone." }
        events: { type: array, items: { $ref: "#/components/schemas/HandOffEvent" } }
    HandOffEvent:
      type: object
      description: A run produced or read an output, under this digest; a receipt never changes.
      required: [kind, digest, run_id, at]
      properties:
        kind: { type: string, enum: [produced, read] }
        digest: { type: string, description: "sha256:<hex> of the value's canonical JSON" }
        run_id: { type: string }
        stage: { type: [string, "null"] }
        attempt: { type: [integer, "null"] }
        at: { type: string, format: date-time }
    TimelineEntry:
      type: object
      required: [ts, kind, title]
      properties:
        ts: { type: string, format: date-time }
        kind: { type: string, enum: [state_change, run, decision, finding, release, comment, error] }
        title: { type: string }
        detail: { type: [string, "null"] }
        actor: { type: [string, "null"] }
        actor_kind: { type: string, enum: [user, agent, system], default: system }
        ref_id: { type: [string, "null"] }
        cost_usd: { type: [number, "null"] }
    GitToken:
      type: object
      required: [token]
      properties:
        token: { type: [string, "null"] }
        expires_at: { type: [string, "null"], format: date-time }
        repository: { type: [string, "null"], description: "`owner/name`: the only repository the token opens." }
    WorkItemJourney:
      type: object
      description: >-
        A work item's path through its workflow (S22-01). `graph` and `process` describe the version
        the item is pinned to, not the project's current one; `moves` and `steps` are in time order.
      required: [work_item_id, state, graph, process, moves, steps]
      properties:
        work_item_id: { type: string }
        tracker_key: { type: [string, "null"] }
        workflow_name: { type: [string, "null"] }
        workflow_version: { type: [integer, "null"] }
        initial: { type: [string, "null"], description: The workflow's initial state. }
        state: { type: string, description: The state the item is in now. }
        closed: { type: boolean, default: false }
        graph: { $ref: "#/components/schemas/WorkflowGraph" }
        process: { type: array, items: { $ref: "#/components/schemas/ProcessStep" } }
        moves: { type: array, items: { $ref: "#/components/schemas/JourneyMove" } }
        steps: { type: array, items: { $ref: "#/components/schemas/JourneyStep" } }
    JourneyMove:
      type: object
      description: >-
        The item left `from` for `to`. `transition_id` and `kind` say which edge of the graph carried
        it — `nominal` (the transition itself), `reject`, `changes_requested`, `retry` (a failure sent
        it back), `escalate`, `default` (from any agent state), `resume`, `start`, `migrated`, or
        `other` when the graph has no such edge. A retry that keeps the item in its state is not a
        move: it shows as a second step on the same transition.
      required: [at, to, kind]
      properties:
        at: { type: string, format: date-time }
        from: { type: [string, "null"] }
        to: { type: string }
        kind: { type: string, enum: [start, nominal, reject, changes_requested, retry, escalate, default, resume, migrated, other] }
        transition_id: { type: [string, "null"] }
        reason: { type: [string, "null"] }
    JourneyStep:
      type: object
      description: >-
        One thing an actor did for the item, on one transition: an agent run, a request to a person,
        or a governed action. `status` is the run's, the request's (`waiting`, `approved`, `rejected`,
        `answered`, `completed`, `scope_change`) or the action's.
      required: [id, kind, status, attempt]
      properties:
        id: { type: string, description: "The run, request or action id: the one its own page reads." }
        kind: { type: string, enum: [agent, human, action] }
        transition_id: { type: [string, "null"] }
        actor: { type: [string, "null"] }
        role: { type: [string, "null"] }
        attempt: { type: integer, minimum: 1 }
        status: { type: string }
        started_at: { type: [string, "null"], format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        summary: { type: [string, "null"] }
        verdict: { type: [string, "null"], description: "The `verdict` output of a review, when the step wrote one." }
        cost_usd: { type: number, default: 0 }
        model: { type: [string, "null"] }
        decided_by: { type: [string, "null"] }
        due_at: { type: [string, "null"], format: date-time }
        evidence: { type: object, additionalProperties: true, description: "The evidence of an agent run (tests, lint, coverage, business facts…): what the platform measured, which `measured` lists, and what the agent declared, which it does not (ADR 0045)." }
    DecisionRequest:
      type: object
      required: [kind]
      properties:
        request_id: { type: [string, "null"] }
        kind: { type: string, enum: [approve, reject, answer, scope_change, complete] }
        answer: { type: [string, "null"] }
        reason: { type: [string, "null"] }
        granted_paths: { type: array, items: { type: string } }
        values: { type: object, additionalProperties: true, description: "`complete`: the values of the task's form, written into the ticket's fields." }
        attested: { type: boolean, default: false, description: "`complete`: the person attests the task's statement." }
    HumanRequest:
      type: object
      required: [id, kind, requested_at]
      properties:
        id: { type: string }
        work_item_id: { type: string }
        transition_id: { type: [string, "null"] }
        kind: { type: string, enum: [approval, question, scope_change, task] }
        payload: { type: object, additionalProperties: true }
        requested_at: { type: string, format: date-time }
        due_at: { type: [string, "null"], format: date-time }
        decided_by: { type: [string, "null"] }
        decided_at: { type: [string, "null"], format: date-time }
        decision: { type: [object, "null"], additionalProperties: true }
    WorkItemAction:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [pause, resume, stop, migrate, rerun_stage, mark_agent_ready] }
        workflow_def_id: { type: [string, "null"] }
        state_mapping: { type: object, additionalProperties: { type: string } }
        run_id: { type: [string, "null"] }
        reason: { type: [string, "null"] }
        top_up_usd:
          type: [number, "null"]
          exclusiveMinimum: 0
          description: >-
            `rerun_stage`: USD granted on top of the work item's budget, recorded in the audit log.
            Required when the budget is spent — otherwise 409 (ADR 0047).
    RunSummary:
      type: object
      required: [id, status, stage_role]
      properties:
        id: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled, timed_out] }
        stage_role: { type: string }
        attempt: { type: integer }
        backend: { type: [string, "null"] }
        model: { type: [string, "null"] }
        cost_usd: { type: number, default: 0 }
        started_at: { type: [string, "null"], format: date-time }
    Run:
      allOf:
        - $ref: "#/components/schemas/RunSummary"
        - type: object
          properties:
            work_item_id: { type: string }
            project_slug: { type: string }
            transition_id: { type: [string, "null"] }
            actor: { type: [string, "null"] }
            executor_kind: { type: [string, "null"] }
            executor_ref: { type: [string, "null"] }
            ended_at: { type: [string, "null"], format: date-time }
            tokens: { $ref: "#/components/schemas/Totals" }
            gateway_key_id: { type: [string, "null"] }
            result: { oneOf: [{ $ref: "./schemas/stage-result.schema.json" }, { type: "null" }] }
            transcript_url: { type: [string, "null"] }
            context_pack_url: { type: [string, "null"] }
            playbook_checksum: { type: [string, "null"] }
            allowed_paths: { type: array, items: { type: string } }
    RunEvent:
      type: object
      required: [seq, type, ts]
      properties:
        seq: { type: integer }
        type: { type: string }
        ts: { type: string, format: date-time }
        payload: { type: object, additionalProperties: true }
    RunEventIn:
      type: object
      required: [seq, type]
      properties:
        seq: { type: integer, minimum: 0 }
        type: { type: string }
        ts: { type: [string, "null"], format: date-time }
        payload: { type: object, additionalProperties: true }
    ArtifactRef:
      type: object
      required: [url]
      properties:
        url: { type: string }
        content_type: { type: string }
        size_bytes: { type: [integer, "null"] }
        inline: { type: [string, "null"] }
    RunLogs:
      type: object
      description: >
        The runner pod's log tail (last 200 lines, each redacted) and its termination. `live` is a
        snapshot the orchestrator refreshes at each poll while the pod runs; `archive` is written
        once when the run ends; `none` when nothing was captured.
      required: [source, state]
      properties:
        source: { type: string, enum: [live, archive, none] }
        state: { type: string }
        exit_code: { type: [integer, "null"] }
        reason: { type: [string, "null"], description: "The runtime's word: OOMKilled, Error, ErrImagePull, ImagePullBackOff…" }
        message: { type: string }
        lines: { type: array, items: { type: string } }
        truncated: { type: boolean }
        error: { type: [string, "null"], description: Why the logs could not be read }
        captured_at: { type: [string, "null"], format: date-time }
    DiffSummary:
      type: object
      required: [files, additions, deletions]
      properties:
        base: { type: [string, "null"] }
        head: { type: [string, "null"] }
        files:
          type: array
          items:
            type: object
            required: [path, status, additions, deletions]
            properties:
              path: { type: string }
              status: { type: string, enum: [added, modified, removed, renamed] }
              additions: { type: integer }
              deletions: { type: integer }
              patch: { type: [string, "null"] }
              in_scope: { type: boolean, default: true }
        additions: { type: integer }
        deletions: { type: integer }
    Release:
      type: object
      required: [id, project_slug, env, batch_no, status, items]
      properties:
        id: { type: string }
        project_slug: { type: string }
        env: { type: string }
        batch_no: { type: integer }
        status:
          type: string
          enum: [collecting, departing, staging, awaiting_approval, promoting, verifying, done, rolled_back, frozen]
        items:
          type: array
          items:
            type: object
            required: [work_item_key, sha]
            properties:
              work_item_key: { type: string }
              title: { type: [string, "null"] }
              sha: { type: string }
              pr_url: { type: [string, "null"] }
              risk: { oneOf: [{ $ref: "#/components/schemas/Risk" }, { type: "null" }] }
              labels: { type: array, items: { type: string } }
        started_at: { type: [string, "null"], format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        approved_by: { type: [string, "null"] }
        verdict: { type: [object, "null"], additionalProperties: true }
        notes: { type: [string, "null"] }
        promotion_url: { type: [string, "null"] }
    ReleasePage:
      type: object
      required: [items, meta]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Release" } }
        meta: { $ref: "#/components/schemas/PageMeta" }
    TrainStatus:
      type: object
      required: [env, status, batch_size, frozen]
      properties:
        env: { type: string }
        status: { type: string }
        batch_size: { type: integer }
        pending_items: { type: array, items: { type: string } }
        next_departure: { type: [string, "null"], format: date-time }
        frozen: { type: boolean }
        freeze_reason: { type: [string, "null"] }
        current_release: { oneOf: [{ $ref: "#/components/schemas/Release" }, { type: "null" }] }
        window_open: { type: boolean, default: true }
    FindingRecord:
      type: object
      required: [id, project_slug, title, type, severity, status]
      properties:
        id: { type: string }
        project_slug: { type: string }
        origin_work_item_key: { type: [string, "null"] }
        origin_run_id: { type: [string, "null"] }
        title: { type: string }
        type: { type: string }
        severity: { type: string, enum: [low, medium, high, critical] }
        evidence: { type: string }
        suggested_fix: { type: [string, "null"] }
        estimate: { type: [string, "null"] }
        status: { type: string, enum: [pending, created, duplicate, dismissed] }
        created_work_item_key: { type: [string, "null"] }
        duplicate_of: { type: [string, "null"] }
        occurrences: { type: integer, default: 1 }
        relevant: { type: [boolean, "null"] }
        created_at: { type: string, format: date-time }
    FindingPage:
      type: object
      required: [items, meta]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/FindingRecord" } }
        meta: { $ref: "#/components/schemas/PageMeta" }
    FindingAction:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [create_ticket, mark_duplicate, dismiss, agent_ready, mark_relevant, mark_false_positive] }
        duplicate_of: { type: [string, "null"] }
        reason: { type: [string, "null"] }
    FindingAck:
      type: object
      required: [accepted]
      properties:
        accepted: { type: boolean }
        finding_id: { type: [string, "null"] }
        remaining: { type: integer, default: 0 }
    ScopeChangeDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [granted, pending, denied] }
        allowed_paths: { type: array, items: { type: string } }
        reason: { type: [string, "null"] }
    Memory:
      type: object
      required: [kind, subject, content]
      properties:
        id: { type: string }
        kind: { type: string }
        subject: { type: string }
        content: { type: string }
        score: { type: [number, "null"] }
        status: { type: string, enum: [active, pending, superseded, rejected], default: active }
        valid_from: { type: [string, "null"], format: date-time }
        valid_to: { type: [string, "null"], format: date-time }
        provenance: { type: object, additionalProperties: true }
        proposed_by: { type: [string, "null"] }
    MemoryDecision:
      type: object
      required: [id, action]
      properties:
        id: { type: string }
        action: { type: string, enum: [accept, reject] }
        reason: { type: [string, "null"] }
    BudgetAlert:
      type: object
      required: [id, scope, subject, period, period_key, threshold, spent_usd, budget_usd, status]
      properties:
        id: { type: string }
        scope: { type: string, enum: [project, agent] }
        subject: { type: string, description: the project's or the agent's slug }
        period: { type: string, description: day }
        period_key: { type: string, description: the day, YYYY-MM-DD }
        threshold: { type: integer, description: "the share of the budget crossed, in percent" }
        spent_usd: { type: number }
        budget_usd: { type: number }
        status: { type: string, enum: [open, acknowledged] }
        created_at: { type: [string, "null"], format: date-time }
        acknowledged_by: { type: [string, "null"] }
        acknowledged_at: { type: [string, "null"], format: date-time }
    CostReport:
      type: object
      required: [group_by, rows, total]
      properties:
        group_by: { type: string }
        currency: { type: string, default: EUR }
        rows:
          type: array
          items:
            type: object
            required: [key, cost_usd, cost_eur]
            properties:
              key: { type: string }
              cost_usd: { type: number }
              cost_eur: { type: number }
              tokens_in: { type: integer, default: 0 }
              tokens_out: { type: integer, default: 0 }
              tokens_cached: { type: integer, default: 0 }
              runs: { type: integer, default: 0 }
        total:
          type: object
          properties:
            cost_usd: { type: number }
            cost_eur: { type: number }
            budget_usd: { type: [number, "null"] }
    MemoryAbGroup:
      type: object
      properties:
        projects: { type: array, items: { type: string } }
        tickets: { type: integer, default: 0 }
        first_pass_merge_rate: { type: number, nullable: true }
        cost_per_ticket_usd: { type: number, nullable: true }
    MemoryAbReport:
      type: object
      required: [org, verdict]
      properties:
        org: { type: string }
        weeks: { type: integer, default: 4 }
        since: { type: string, format: date-time, nullable: true }
        with_memory: { $ref: "#/components/schemas/MemoryAbGroup" }
        without_memory: { $ref: "#/components/schemas/MemoryAbGroup" }
        verdict: { type: string }
        detail: { type: string, default: "" }
    CrossBackendArm:
      type: object
      properties:
        reviews: { type: integer, default: 0 }
        caught: { type: integer, default: 0 }
        catch_rate: { type: number, nullable: true }
        backends: { type: array, items: { type: string } }
    CrossBackendReport:
      type: object
      required: [since, verdict]
      properties:
        since: { type: string, format: date-time }
        cross_backend_required: { type: boolean, default: false }
        same_backend: { $ref: "#/components/schemas/CrossBackendArm" }
        other_backend: { $ref: "#/components/schemas/CrossBackendArm" }
        verdict: { type: string }
        detail: { type: string, default: "" }
    DoraMetric:
      type: object
      required: [unit]
      properties:
        value: { type: number, nullable: true }
        unit: { type: string }
        level: { type: string, enum: [elite, high, medium, low, unknown], default: unknown }
        sample: { type: integer, default: 0 }
    DoraReport:
      type: object
      required: [since, until, deployment_frequency, lead_time, change_failure_rate, time_to_restore]
      properties:
        env: { type: string, default: prod }
        since: { type: string, format: date-time }
        until: { type: string, format: date-time }
        deployments: { type: integer, default: 0 }
        deployment_frequency: { $ref: "#/components/schemas/DoraMetric" }
        lead_time: { $ref: "#/components/schemas/DoraMetric" }
        change_failure_rate: { $ref: "#/components/schemas/DoraMetric" }
        time_to_restore: { $ref: "#/components/schemas/DoraMetric" }
    TemplateSummary:
      type: object
      required: [name, version, display, is_published]
      properties:
        name: { type: string }
        version: { type: string }
        display: { type: string }
        description: { type: [string, "null"] }
        repo_url: { type: [string, "null"] }
        is_published: { type: boolean }
    TemplateDetail:
      allOf:
        - $ref: "#/components/schemas/TemplateSummary"
        - type: object
          required: [manifest]
          properties:
            manifest: { $ref: "./schemas/template.schema.json" }
    TemplateUpsert:
      type: object
      required: [manifest]
      properties:
        manifest: { $ref: "./schemas/template.schema.json" }
        repo_url: { type: [string, "null"] }
        is_published: { type: boolean, default: false }
    AgentBackendInfo:
      type: object
      required: [name, enabled, capabilities]
      properties:
        name: { type: string }
        enabled: { type: boolean }
        version: { type: [string, "null"] }
        capabilities: { type: array, items: { type: string } }
        conformance:
          type: object
          properties:
            last_run_at: { type: [string, "null"], format: date-time }
            passed: { type: [integer, "null"] }
            total: { type: [integer, "null"] }
            report_url: { type: [string, "null"] }
            failures: { type: array, items: { type: string } }
        disabled_reason: { type: [string, "null"] }
    AgentBackendUpdate:
      type: object
      required: [name, enabled]
      properties:
        name: { type: string }
        enabled: { type: boolean }
        disabled_reason: { type: [string, "null"] }
    ExecutorInfo:
      type: object
      required: [kind, enabled]
      properties:
        kind: { type: string, enum: [tekton, k8s_job, local_docker, aca, agent_sandbox] }
        enabled: { type: boolean }
        cluster: { type: [string, "null"] }
        namespace_pattern: { type: [string, "null"] }
        runner_image: { type: [string, "null"] }
        default_timeout_minutes: { type: integer, default: 120 }
    GatewayKeyInfo:
      type: object
      required: [key_id, created_at]
      properties:
        key_id: { type: string }
        run_id: { type: [string, "null"] }
        project_slug: { type: [string, "null"] }
        budget_usd: { type: [number, "null"] }
        spend_usd: { type: number, default: 0 }
        expires_at: { type: [string, "null"], format: date-time }
        revoked: { type: boolean, default: false }
        created_at: { type: string, format: date-time }
    AuditEntry:
      type: object
      required: [id, actor_kind, action, ts]
      properties:
        id: { type: string }
        actor_id: { type: [string, "null"] }
        actor_kind: { type: string, enum: [user, agent, system] }
        action: { type: string }
        target_type: { type: [string, "null"] }
        target_id: { type: [string, "null"] }
        payload: { type: object, additionalProperties: true }
        ts: { type: string, format: date-time }
    AuditPage:
      type: object
      required: [items, meta]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
        meta: { $ref: "#/components/schemas/PageMeta" }
    WebhookAck:
      type: object
      required: [accepted]
      properties:
        accepted: { type: boolean }
        duplicate: { type: boolean, default: false }
        events: { type: integer, default: 0 }
    RunTicket:
      type: object
      required: [key, title]
      properties:
        key: { type: string }
        title: { type: string }
        body: { type: string }
        fields: { type: object, additionalProperties: true, description: "The ticket's fields (ADR 0031)." }
        url: { type: [string, "null"] }
        spec_markdown: { type: [string, "null"] }
        plan_markdown: { type: [string, "null"] }
        comments:
          type: array
          items:
            type: object
            properties:
              author: { type: string }
              body: { type: string }
              ts: { type: string, format: date-time }
    StageInput: { $ref: "./schemas/stage-input.schema.json" }
    StageResult: { $ref: "./schemas/stage-result.schema.json" }
    Artifact: { $ref: "./schemas/artifact.schema.json" }
    RunInputFile:
      type: object
      description: A declared input of a run, as the runner mounts it in `.choregos/inputs/` (ADR 0049).
      required: [name, version, filename, type, media_type, digest, size]
      properties:
        name: { type: string }
        version: { type: integer }
        filename: { type: string, description: "The name with its type's extension: `deck.pptx`." }
        type: { type: string }
        media_type: { type: string }
        digest: { type: string, description: "sha256 of the bytes" }
        size: { type: integer }
    ContextPack: { $ref: "./schemas/context-pack.schema.json" }
    Finding: { $ref: "./schemas/finding.schema.json" }
    InboundEvent: { $ref: "./schemas/inbound-event.schema.json" }
    ChoregosEvent: { $ref: "./schemas/event.schema.json" }
    HumanDecision: { $ref: "./schemas/human-decision.schema.json" }
