{{- $name := printf "%s-temporal" .Release.Name }}
{{- /*
`server start-dev`: a single process, SQLite, no migration to run. This is the Temporal
of Choregos' cluster bench (tests/cluster) — enough to run real workflows,
not for production, where Temporal is deployed with its own database and its four services.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "choregos.labels" . | nindent 4 }}
spec:
  replicas: 1
  # A single writer on the SQLite file: never two pods at the same time.
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/name: choregos-temporal
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: choregos-temporal
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: temporal
    spec:
      {{- include "choregos.imagePullSecrets" $ | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: temporal
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          args:
            - server
            - start-dev
            - --ip
            - 0.0.0.0
            - --namespace
            - {{ .Values.global.temporal.namespace | quote }}
            - --db-filename
            - /data/temporal.db
            {{- if .Values.ui.enabled }}
            - --ui-port
            - "8233"
            {{- else }}
            - --headless
            {{- end }}
          ports:
            - { name: grpc, containerPort: 7233 }
            {{- if .Values.ui.enabled }}
            - { name: ui, containerPort: 8233 }
            {{- end }}
          readinessProbe:
            tcpSocket: { port: grpc }
            periodSeconds: 5
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim: { claimName: {{ $name }} }
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "choregos.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: choregos-temporal
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - { name: grpc, port: 7233, targetPort: grpc }
    {{- if .Values.ui.enabled }}
    - { name: ui, port: 8233, targetPort: ui }
    {{- end }}
{{- if .Values.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  labels: {{- include "choregos.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.persistence.size }} } }
{{- end }}
