# La politique du gabarit `github-software-delivery` (S21-23).
#
# Aucune approbation de production ici : ce sont les WORKFLOWS qui en exigent une (ADR 0041) —
# `dev-simple` part seul, `dev-complex` attend le capitaine. Les `approvals` restent à `never` : ils ne
# sont lus par personne, et les écrire autrement ferait croire à une garde qui n'existe pas.
apiVersion: choregos/v1
kind: Policy
metadata:
  name: software-delivery
  version: 1
  description: "Software delivery on GitHub: small fixes ship on their own, features wait for the people their workflow names."
budgets:
  ticket_usd: { S: 10, M: 30, L: 80, XL: 160 }
  stage_usd:
    default: { S: 3, M: 8, L: 18, XL: 30 }
    triage: { S: 0.5, M: 0.5, L: 1, XL: 1 }
    refine: { S: 2, M: 4, L: 8, XL: 12 }
    implement: { S: 5, M: 12, L: 25, XL: 45 }
    review: { S: 3, M: 6, L: 10, XL: 15 }
  max_turns: { default: 80, triage: 10, refine: 30, implement: 120, verify: 60 }
  max_minutes: { default: 60, triage: 5, refine: 20, implement: 90, verify: 40 }
  daily_project_usd: 150
  alert_at_ratio: 0.8
approvals:
  spec: { required: never }
  merge: { required: never }
  prod: { required: never }
attempts:
  default_max: 2
  by_role: { implement: 3, fix_ci: 3 }
  dod_iterations: 3
scope:
  auto_grant_max_files: 3
  deny_paths: [".choregos/**", ".github/workflows/**", "deploy/**"]
  max_diff_files: 60
  max_diff_lines: 3000
sandbox:
  runtime: default
  deny_commands: [kubectl, terraform apply, git push --force, sudo]
  network:
    allow_domains: [github.com, pypi.org, files.pythonhosted.org, registry.npmjs.org]
    deny_by_default: true
  llm_security_analyzer: false
findings:
  max_per_run: 5
  dedupe_threshold: 0.86
  auto_agent_ready_sizes: []
  notify_severities: [critical]
  false_positive_alert_ratio: 0.3
memory:
  enabled: true
  context_budget_tokens: { refine: 4000, implement: 4000, review: 3000, default: 2000 }
  auto_accept_after_runs: 2
  read_timeout_ms: 300
review:
  cross_backend: false
  require_human_for_risk: []
release_train:
  staging:
    mode: train
    schedule: "*/15 8-19 * * 1-5"
    timezone: Europe/Paris
    batch_max: 10
    soak_minutes: 5
  prod:
    mode: train
    schedule: "0,30 9-17 * * 1-5"
    timezone: Europe/Paris
    windows: ["Mon-Fri 09:00-18:00"]
    batch_min: 1
    batch_max: 8
    soak_minutes: 10
    approval: { required: false, group: release-captains, timeout_hours: 8 }
    canary: { steps: [100], step_minutes: [0] }
    freeze: false
    auto_rollback: true
    freeze_on_rollback: true
