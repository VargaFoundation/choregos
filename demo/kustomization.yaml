# Everything the demonstration puts in the namespace, outside the chart: the cluster's git
# repository and the three ConfigMaps that the chart and the seed Job expect BY NAME — hence
# `disableNameSuffixHash`: `demo-playbooks` and `demo-outils` are cited in values-demo.yaml.
#
#   kubectl -n choregos apply -k demo
#
# The seed Job is not here: a Job cannot be re-applied, `make demo-seed` recreates it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - manifests/git.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: demo-seed
    files:
      - seed.py=seed.py
      - demo-code.yaml=workflows/demo-code.yaml
      - staffing.yaml=workflows/staffing.yaml
  - name: demo-playbooks
    files:
      - sourcing.md=playbooks/sourcing.md
      - qualification.md=playbooks/qualification.md
  - name: demo-outils
    files:
      - catalogue.yaml=outils/catalogue.yaml
