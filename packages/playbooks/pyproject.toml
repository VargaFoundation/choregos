[project]
name = "choregos-playbooks"
version = "0.4.0"
description = "Playbooks Choregos : prompts par rôle et évals"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = ["jinja2>=3.1", "pydantic>=2.9", "PyYAML>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/choregos_playbooks"]

[tool.hatch.build.targets.wheel.force-include]
"src/choregos_playbooks/roles" = "choregos_playbooks/roles"
