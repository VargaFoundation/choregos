# An incident postmortem (S59-02): blameless, read-only. The researcher rebuilds the timeline from the work
# item, the code, the decisions and memory, and finds the root causes and the actions that prevent a
# recurrence; a reviewer critiques it; the maintainers accept it. The actions become work items of their
# own (a `dev-fix`, a `dev-feature`), created by people from the accepted postmortem.
apiVersion: choregos/v1
kind: Workflow
metadata:
  name: incident-postmortem
  version: 1
  catalogue:
    title: Incident postmortem
    summary: "A blameless postmortem after an incident: timeline, impact, root causes and the actions that prevent a recurrence, each with evidence, critiqued by a reviewer and accepted by the maintainers. Changes no file."
    tags: [software, operations, incident]
  description: "Incident postmortem: timeline, root causes and actions with evidence, critique, acceptance by the maintainers. Read-only."
initial: inbox
actors:
  investigator: { type: agent, role: research, agent: researcher, model: "profile:standard" }
  critic: { type: agent, role: review, agent: reviewer, model: "profile:standard", fresh_context: true }
  maintainers: { type: human, group: maintainers, sla_hours: 72 }
states:
  inbox: { display: To investigate, kind: wait, tracker: { status: Todo } }
  investigated: { display: Investigated, tracker: { status: In progress } }
  awaiting_acceptance: { display: Postmortem to accept, kind: wait, tracker: { status: Needs review } }
  accepted: { display: Postmortem accepted, terminal: true, tracker: { status: Done } }
  needs_human: { display: Needs a human, kind: wait, tracker: { status: Blocked } }
  abandoned: { display: Abandoned, terminal: true, tracker: { status: Cancelled } }
transitions:
  - id: t-investigate
    from: inbox
    to: investigated
    by: investigator
    inputs: [review_markdown, human_feedback]
    outputs: [research_markdown]
    gates: [outputs_present, { name: diff_size_max, params: { files: 0 } }]
    on_fail: { to: inbox, max_attempts: 2, escalate_to: needs_human }
  - id: t-critique
    from: investigated
    to: awaiting_acceptance
    by: critic
    inputs: [research_markdown]
    outputs: [review_markdown, verdict]
    gates: [{ name: outputs_in, params: { values: { verdict: [approve] } } }, { name: diff_size_max, params: { files: 0 } }]
    on_changes_requested: { to: inbox, max_attempts: 2, escalate_to: needs_human }
  - id: t-accept
    from: awaiting_acceptance
    to: accepted
    by: maintainers
    on_reject: inbox
  - id: t-abandon
    from: needs_human
    to: abandoned
    by: maintainers
    timeout_hours: 168
# What *About this ticket* shows besides the ticket's size and risk (ADR 0129).
artifacts:
  verdict: { show: facts, title: Verdict }
  diff: { show: facts, title: Changes }
defaults:
  from_any_agent_state:
    on_question: needs_human
    on_budget_exceeded: needs_human
    on_timeout: needs_human
  needs_human:
    on_answer: resume
    on_abandon: abandoned
