{{- if .Values.enabled }}
{{- $canary := .Values.global.canary | default dict }}
{{- if $canary.enabled }}
# Platform canary: Argo Rollouts replaces the Deployment. The pod is the same — it is the
# way of getting there that changes. Without Rollouts installed, leave `global.canary.enabled: false`.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
{{- else }}
apiVersion: apps/v1
kind: Deployment
{{- end }}
metadata:
  name: choregos-api
  labels: {{- include "choregos.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- if $canary.enabled }}
  strategy:
    canary:
      # The steps and their duration come from the values: a cautious environment lengthens the
      # pause, it does not rewrite the chart.
      steps:
        {{- range $canary.steps }}
        - setWeight: {{ .weight }}
        {{- if .pause }}
        - pause: { duration: {{ .pause }} }
        {{- else }}
        - pause: {}
        {{- end }}
        {{- end }}
      {{- with $canary.analysis }}
      analysis:
        templates:
          - templateName: {{ . }}
        startingStep: 1
      {{- end }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: choregos-api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: choregos-api
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
      annotations:
        # A secret rotation redeploys the pods: otherwise the key rotates to no effect.
        checksum/config: {{ toJson .Values | sha256sum }}
    spec:
      serviceAccountName: choregos-api
      {{- include "choregos.imagePullSecrets" $ | nindent 6 }}
      {{- include "choregos.antiAffinity" (dict "global" .Values.global "labels" (dict "app.kubernetes.io/name" "choregos-api" "app.kubernetes.io/instance" .Release.Name)) | nindent 6 }}
      {{- with .Values.hostAliases }}
      # An OIDC provider whose name does not resolve from inside the cluster (split-horizon):
      # pinned here rather than resolved — a network policy by FQDN would never see
      # this traffic, it only sees what goes through DNS.
      hostAliases: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.global.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "choregos.image" (dict "global" .Values.global "image" .Values.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext: {{- toYaml .Values.global.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          {{- with .Values.global.toolCatalog.credentialsSecret }}
          # The catalog providers' keys. As a block and BY REFERENCE: a key
          # copied into the deployment spec would be readable by whoever can read a pod.
          envFrom:
            - secretRef: { name: {{ . }} }
          {{- end }}
          env:
            {{- with .Values.global.toolCatalog.configMap }}
            - name: CHOREGOS_TOOL_CATALOG
              value: {{ printf "%s/%s" $.Values.global.toolCatalog.mountPath $.Values.global.toolCatalog.fileName | quote }}
            {{- end }}
            {{- with .Values.global.workflowTemplates.configMap }}
            - name: CHOREGOS_WORKFLOW_TEMPLATES_DIR
              value: {{ $.Values.global.workflowTemplates.mountPath | quote }}
            {{- end }}
            {{- with .Values.global.playbooks.configMap }}
            # The API validates a workflow, so it must see the playbooks: without them it
            # warns `role.playbook_introuvable` about roles the deployment does provide,
            # and the warning teaches people to ignore warnings.
            - name: CHOREGOS_PLAYBOOKS_DIR
              value: {{ $.Values.global.playbooks.mountPath | quote }}
            {{- end }}
            {{- with .Values.proceduresExtra }}
            # Site notes and extra setup procedures, one Markdown file each (ADR 0067).
            - name: CHOREGOS_PROCEDURES_EXTRA
              value: /etc/choregos/procedures
            {{- end }}
            {{- with .Values.global.agents }}
            {{- if .defaultBackend }}
            # The backend and the profiles a new project inherits (#245).
            - name: CHOREGOS_DEFAULT_AGENT_BACKEND
              value: {{ .defaultBackend | quote }}
            {{- end }}
            {{- with .allowedBackends }}
            - name: CHOREGOS_ALLOWED_AGENT_BACKENDS
              value: {{ toJson . | quote }}
            {{- end }}
            {{- with .modelProfiles }}
            - name: CHOREGOS_DEFAULT_MODEL_PROFILES
              value: {{ toJson . | quote }}
            {{- end }}
            {{- end }}
            {{- with (dig "mcp" "oauth" dict .Values.global) }}
            {{- if .enabled }}
            {{- range ($.Values.global.extraEnv | default list) }}
            {{- if hasPrefix "CHOREGOS_MCP_OAUTH_" .name }}
            {{- fail (printf "global.extraEnv: %s is set by global.mcp.oauth; two values for the same name, Kubernetes would keep the last one without saying anything" .name) }}
            {{- end }}
            {{- end }}
            # The MCP gateway accepts the IdP's tokens (ADR 0030): Claude connects to it through
            # single sign-on; the Integrations page says with which client.
            - name: CHOREGOS_MCP_OAUTH_ENABLED
              value: "true"
            {{- with .issuer }}
            - name: CHOREGOS_MCP_OAUTH_ISSUER
              value: {{ . | quote }}
            {{- end }}
            {{- with .audience }}
            - name: CHOREGOS_MCP_OAUTH_AUDIENCE
              value: {{ . | quote }}
            {{- end }}
            {{- with .clients }}
            {{- $clients := dict }}
            {{- range $nom, $client := . }}
            {{- $_ := set $clients $nom (dict "client_id" $client.clientId "callback_port" $client.callbackPort) }}
            {{- end }}
            - name: CHOREGOS_MCP_OAUTH_CLIENTS
              value: {{ toJson $clients | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- include "choregos.commonEnv" . | nindent 12 }}
            - name: CHOREGOS_OIDC_ISSUER
              value: {{ .Values.global.oidc.issuer | quote }}
            - name: CHOREGOS_OIDC_CLIENT_ID
              value: {{ .Values.global.oidc.clientId | quote }}
            - name: CHOREGOS_OIDC_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.global.oidc.secretRef }}, key: client-secret } }
            - name: CHOREGOS_OIDC_DEFAULT_ORG
              value: {{ .Values.global.oidc.defaultOrg | default "" | quote }}
            # Always set, even to `false`: a missing value would leave the code's default
            # to decide, and that is precisely what left the API open in production.
            - name: CHOREGOS_BOOTSTRAP_ORG
              value: {{ .Values.global.bootstrap.org | default "" | quote }}
            - name: CHOREGOS_BOOTSTRAP_ORG_NAME
              value: {{ .Values.global.bootstrap.orgName | default "" | quote }}
            - name: CHOREGOS_BOOTSTRAP_ADMINS
              value: {{ .Values.global.bootstrap.admins | default "" | quote }}
            - name: CHOREGOS_DEV_LOGIN_ENABLED
              value: {{ .Values.global.devLogin.enabled | default false | quote }}
            - name: CHOREGOS_DEV_ADMIN_EMAILS
              value: {{ .Values.global.devLogin.adminEmails | default "" | quote }}
            # STRUCTURAL, never optional: an API that starts without a session
            # secret signs cookies with an empty value, and a missing run-token key
            # sends every process back to an ephemeral pair — the agent then receives
            # "Signature verification failed", a message that blames the token.
            # The other keys of this secret are optional: their absence is a
            # feature switched off, not a broken deployment. The dev tenant paid for it on
            # 2026-09-26: `generic-webhook-secret` missing from the InfisicalSecret template, and
            # the WHOLE API in CreateContainerConfigError.
            - name: CHOREGOS_SESSION_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.global.apiSecretRef }}, key: session-secret } }
            - name: CHOREGOS_RUN_TOKEN_PRIVATE_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.global.apiSecretRef }}, key: run-token-private-key } }
            - name: CHOREGOS_RUN_TOKEN_PUBLIC_KEY
              # Optional: it is DERIVED from the private one (`public_from_private`).
              valueFrom: { secretKeyRef: { name: {{ .Values.global.apiSecretRef }}, key: run-token-public-key, optional: true } }
            - name: CHOREGOS_GITHUB_WEBHOOK_SECRET
              # Optional: no GitHub, no secret — and when empty, the API refuses in staging/prod.
              valueFrom: { secretKeyRef: { name: {{ .Values.global.apiSecretRef }}, key: github-webhook-secret, optional: true } }
            - name: CHOREGOS_GENERIC_WEBHOOK_SECRET
              # Optional: when empty, `verify_shared_secret` returns False: Jira, GitLab and the generic webhook refuse.
              valueFrom: { secretKeyRef: { name: {{ .Values.global.apiSecretRef }}, key: generic-webhook-secret, optional: true } }
            - name: CHOREGOS_GITHUB_APP_ID
              # Optional: a tenant without a GitHub App has none.
              valueFrom: { secretKeyRef: { name: {{ .Values.global.apiSecretRef }}, key: github-app-id, optional: true } }
            - name: CHOREGOS_GITHUB_APP_PRIVATE_KEY
              # Optional: a tenant without a GitHub App has none.
              valueFrom: { secretKeyRef: { name: {{ .Values.global.apiSecretRef }}, key: github-app-private-key, optional: true } }
            # The key that seals the connector secrets typed in the console (ADR 0058). Optional: a
            # deployment without it keeps `env:` references and answers 409 when a value is typed.
            - name: CHOREGOS_SECRETS_KEKS
              valueFrom: { secretKeyRef: { name: {{ .Values.global.secrets.keksSecretRef | default .Values.global.apiSecretRef }}, key: {{ .Values.global.secrets.keksKey | default "secrets-keks" }}, optional: true } }
            - name: CHOREGOS_GATEWAY_MASTER_KEY
              valueFrom: { secretKeyRef: { name: {{ include "choregos.gatewaySecret" . }}, key: master-key } }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with .Values.global.toolCatalog.configMap }}
            - { name: catalogue, mountPath: {{ $.Values.global.toolCatalog.mountPath }}, readOnly: true }
            {{- end }}
            {{- with .Values.global.workflowTemplates.configMap }}
            - { name: workflow-templates, mountPath: {{ $.Values.global.workflowTemplates.mountPath }}, readOnly: true }
            {{- end }}
            {{- with .Values.global.playbooks.configMap }}
            - { name: playbooks, mountPath: {{ $.Values.global.playbooks.mountPath }}, readOnly: true }
            {{- end }}
            {{- with .Values.proceduresExtra }}
            - { name: procedures-extra, mountPath: /etc/choregos/procedures, readOnly: true }
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- with .Values.global.toolCatalog.configMap }}
        - name: catalogue
          configMap: { name: {{ . }} }
        {{- end }}
        {{- with .Values.global.workflowTemplates.configMap }}
        - name: workflow-templates
          configMap: { name: {{ . }} }
        {{- end }}
        {{- with .Values.global.playbooks.configMap }}
        - name: playbooks
          configMap: { name: {{ . }} }
        {{- end }}
        {{- with .Values.proceduresExtra }}
        - name: procedures-extra
          configMap: { name: {{ . }} }
        {{- end }}
        {{- /* Volumes the chart owns: a name of `extraVolumes` that collides with one of them would
             give an invalid pod, or worse, silently replace a mount. */}}
        {{- $owned := list "tmp" "catalogue" "workflow-templates" "playbooks" "procedures-extra" }}
        {{- range (.Values.extraVolumes | default list) }}
        {{- if has .name $owned }}
        {{- fail (printf "extraVolumes: %q is a volume of the chart; pick another name" .name) }}
        {{- end }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: choregos-api
{{- end }}
