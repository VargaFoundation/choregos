apiVersion: choregos.dev/v1alpha1
kind: ObjectType
metadata: {name: account, displayName: Account, description: "The directory account opened for a person, and its groups.", owner: it}
spec:
  datasource: accounts
  primaryKey: upn
  titleProperty: upn
  properties:
    upn: {type: string, required: true}
    employee_id: {type: string, required: true}
    active: {type: boolean, required: true}
    groups: {type: "array<string>"}
    opened_at: {type: timestamp}
    closed_at: {type: timestamp}
