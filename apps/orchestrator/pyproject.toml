[project]
name = "tranibor-orchestrator"
version = "0.27.17"
description = "Orchestrateur Tranibor : workers et workflows Temporal"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    # Spans (ADR 0018): `tranibor_core.telemetry` needs the extra.
    "tranibor-core[telemetry]",
    # The Temporal connection every client and worker shares (ADR 0183).
    "tranibor-core[temporal]",
    "tranibor-adapters",
    "tranibor-api",
    "temporalio>=1.8",
    "structlog>=24.4",
    "pydantic-settings>=2.6",
    "prometheus-client>=0.21",
]

[project.scripts]
choregos-orchestrator = "tranibor_orchestrator.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tranibor_orchestrator"]
