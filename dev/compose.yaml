# Tout ce dont la plateforme a besoin, sans Kubernetes : `docker compose -f dev/compose.yaml up -d`.
name: choregos

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: choregos
      POSTGRES_PASSWORD: choregos
      POSTGRES_DB: choregos
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U choregos"]
      interval: 5s
      retries: 10
    volumes: ["pgdata:/var/lib/postgresql/data"]

  temporal:
    image: temporalio/auto-setup:1.26.2
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: choregos
      POSTGRES_PWD: choregos
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports: ["7233:7233"]

  temporal-ui:
    image: temporalio/ui:2.32.0
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports: ["8088:8080"]

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: sk-choregos-dev
      DATABASE_URL: postgresql://choregos:choregos@postgres:5432/choregos
    volumes: ["./litellm.yaml:/app/config.yaml:ro"]
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["4000:4000"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes: ["./keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro"]
    ports: ["8080:8080"]

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: choregos
      MINIO_ROOT_PASSWORD: choregos123
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  ecphoria:
    # `:memory` n'existe pas — le tag de l'édition mémoire est suffixé, pas nommé :
    # `0.2.5-memory`, `0.2-memory`, `latest-memory`. Épinglé plutôt que `latest-memory`,
    # pour que la pile de développement soit la même d'une machine à l'autre.
    image: ghcr.io/vargafoundation/ecphoria:0.2.5-memory
    environment:
      ECPHORIA_EMBEDDING__PROVIDER: openai_compatible
      ECPHORIA_EMBEDDING__BASE_URL: http://litellm:4000/v1
      ECPHORIA_EMBEDDING__MODEL: platform/embed
    ports: ["8432:8432"]
    profiles: ["memory"]

volumes:
  pgdata:
  miniodata:
