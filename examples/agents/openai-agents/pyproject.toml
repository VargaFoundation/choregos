[project]
name = "choregos-agent-example-openai-agents"
version = "0.20.3"
description = "Example: the ticket triager on the OpenAI Agents SDK and the choregos-agent-sdk"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
# Not a member of the repository's workspace: the framework stays out of its lock file.
dependencies = [
  "choregos-agent-sdk",
  "openai-agents==0.22.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openai_agents_triager"]
