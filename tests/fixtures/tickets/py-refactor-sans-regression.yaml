# Ticket de référence : refactor à comportement constant. Le filet, ce sont les tests existants.
id: py-refactor-sans-regression
title: "Extraire le taux de TVA dans une fonction paramétrable"
repo: python-toy
role: implement
prompt: |
  Extrais le calcul TTC dans `appliquer_tva(montant_cents, taux)` pour préparer les
  taux réduits. Le comportement de `total_ttc` ne change pas : les tests existants
  doivent passer sans être modifiés.
allowed_paths:
  - "src/panier/**"
  - "tests/**"
expected_cost_usd: 0.4
expected_duration_s: 150
assertions:
  - { kind: file_matches, path: src/panier/panier.py, pattern: "def appliquer_tva", absent: false }
  - { kind: file_unchanged, path: tests/test_panier.py }
  - { kind: command, run: "python -m pytest -q" }
scripted:
  with_memory:
    files:
      src/panier/panier.py: |
        """Modèle de panier : des lignes, un total en centimes."""

        from __future__ import annotations

        from dataclasses import dataclass, field
        from decimal import Decimal

        TVA = Decimal("0.20")


        @dataclass(frozen=True)
        class Ligne:
            """Une ligne de panier. Les prix sont en centimes : pas de flottants."""

            libelle: str
            prix_unitaire_cents: int
            quantite: int = 1

            def total_cents(self) -> int:
                return self.prix_unitaire_cents * self.quantite


        @dataclass
        class Panier:
            lignes: list[Ligne] = field(default_factory=list)

            def ajouter(self, ligne: Ligne) -> None:
                self.lignes.append(ligne)

            def sous_total_cents(self) -> int:
                return sum(ligne.total_cents() for ligne in self.lignes)


        def appliquer_tva(montant_cents: int, taux: Decimal = TVA) -> int:
            """Applique un taux de TVA au montant donné, en centimes."""
            return int(Decimal(montant_cents) * (Decimal(1) + taux))


        def total_ttc(panier: Panier) -> int:
            """Total TTC en centimes."""
            return appliquer_tva(panier.sous_total_cents())
