[project]
name = "choregos-quant"
version = "0.18.2"
description = "Deterministic backtest engine (standard library only): the measured half of a quant screening workflow"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
# No dependency on purpose: determinism, no supply chain, and it runs with the runner image's Python.
dependencies = []

[project.scripts]
choregos-quant = "choregos_quant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/choregos_quant"]
