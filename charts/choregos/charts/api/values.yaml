enabled: true
replicaCount: 2
image:
  repository: choregos-api
  tag: ""
  digest: ""
service:
  port: 8000
resources:
  requests: { cpu: 200m, memory: 512Mi }
  limits: { cpu: "1", memory: 1Gi }
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
migrations:
  enabled: true
ingress:
  enabled: true
  # Annotations de l'Ingress (`kind: ingress`). Pour un contrôleur qui refuse deux Ingress sur un même
  # hôte — NGINX Inc. : « All hosts are taken by other resources » — l'API et la console sur un seul
  # hôte se déclarent en minions d'un Ingress maître : `nginx.org/mergeable-ingress-type: minion`.
  annotations: {}
  hostnames: ["api.choregos.local"]
  gateway: choregos-gateway
  gatewayNamespace: gateway
podDisruptionBudget:
  enabled: true
  minAvailable: 1
