# HR workflow — the SAME machine, without a line of software.
#
# This file exists to show one thing: states, transitions, actors, budgets, guarantees,
# memory and recovery after a crash do not talk about code. What, in the platform, did talk
# about code — the playbooks, the `evidence_present` guarantee, the typed outputs — is
# replaced here by its business equivalent:
#   · the playbooks come from the deployment (`CHOREGOS_PLAYBOOKS_DIR`), not the package;
#   · the guarantee is `outputs_present`: the step produced what the transition declares;
#   · the outputs carry business names (`profils`, `evaluation`);
#   · the ROLES too: `sourcing`, `qualification`. Before 2026-09-24 one had to write
#     `role: custom` + `playbook: sourcing`, and the board showed "custom" everywhere
#     (ADR 0012, limit no. 4).
apiVersion: choregos/v1
kind: Workflow
metadata:
  name: staffing
  version: 1
  description: Staffing need → sourcing → qualification → human approval → proposal.
actors:
  sourceur: { type: agent, role: sourcing, model: "profile:standard", max_turns: 20, max_minutes: 10 }
  evaluateur: { type: agent, role: qualification, model: "profile:standard", max_turns: 20, max_minutes: 10 }
  manager: { type: human, group: staffing-managers, sla_hours: 48 }
states:
  demande: { display: Need received, kind: wait }
  sourcing: { display: Sourcing }
  qualification: { display: Qualification }
  a_valider: { display: To approve, kind: wait }
  proposee: { display: Proposal sent, terminal: true }
  needs_human: { display: Needs a human, kind: wait }
  abandonnee: { display: Abandoned, terminal: true }
transitions:
  - id: t-sourcing
    from: demande
    to: sourcing
    by: sourceur
    outputs: [profils]
    gates:
      - name: outputs_present
      # An output is what the agent TELLS. `evidence_facts` checks what it COUNTED, and
      # `min` refuses the polite zero: finding nobody is said by failing the step.
      - name: evidence_facts
        params: { keys: [profils_retenus, lieu_verifie], min: { profils_retenus: 1 } }
      # `lieu_verifie: true` is what the agent TELLS. What the platform COUNTED is the call
      # to the catalogue: on the 2026-09-24 bench, ten listings, zero calls, and the fact
      # recorded all the same. A tool announced in a playbook is not a tool used.
      - name: tool_called
        params: { tools: [verifier_adresse] }
    on_fail: { to: demande, max_attempts: 2, escalate_to: needs_human }  # lang: fr-ok (state id `demande`)
  - id: t-qualification
    from: sourcing
    to: qualification
    by: evaluateur
    inputs: [profils]
    outputs: [evaluation, recommandation]
    gates:
      - name: outputs_present
      - name: evidence_facts
        params: { keys: [profils_evalues], min: { profils_evalues: 1 }, must_be_true: [recommandation_tenue] }
    on_fail: { to: sourcing, max_attempts: 2, escalate_to: needs_human }
  - id: t-revue
    from: qualification
    to: a_valider
    by: evaluateur
    outputs: [evaluation]
    gates: [outputs_present]
    on_fail: { to: qualification, max_attempts: 1, escalate_to: needs_human }
  - id: t-valider
    from: a_valider
    to: proposee
    by: manager
    on_reject: sourcing
    timeout_hours: 72
  - id: t-abandon
    from: needs_human
    to: abandonnee
    by: manager
    timeout_hours: 168
defaults:
  from_any_agent_state:
    on_question: needs_human
    on_budget_exceeded: needs_human
    on_timeout: needs_human
  needs_human:
    on_answer: resume
    on_abandon: abandonnee
