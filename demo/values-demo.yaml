# The demonstration: the local bench, plus what is specific to it.
#   helm upgrade --install choregos charts/choregos -n choregos \
#     -f charts/choregos/values/local.yaml -f demo/values-demo.yaml
#
# This file is ADDED to `values/local.yaml` (everything embedded): it only restates what changes.
global:
  imageRegistry: local
  imageTag: demo
  imagePullPolicy: Never
  # The business playbooks (sourcing, qualification) come from the deployment.
  playbooks:
    configMap: demo-playbooks
  # The tool catalogue (ADR 0014). Without this line, the API has NO catalogue and the
  # agents have no tool — which is exactly the state the 2026-09-24 bench ran in without
  # anyone noticing. The ConfigMap comes from `demo/manifests`.
  toolCatalog:
    configMap: demo-outils
  # The LLM gateway stays EMBEDDED (inherited from local.yaml): it is what mints a key per
  # run, caps the spend and counts it. Without it, the cost ledger stays at zero — 12 runs
  # at 0 EUR on the 2026-09-24 bench, presented as a cap that held.
  # It needs a provider key, set by hand (see demo/README.md):
  #   kubectl -n choregos create secret generic platform-llm-key --from-literal=api-key=sk-ant-…
  # Without a provider key: `--set global.gateway.embedded=false` and DEMO_GATEWAY=direct
  # in the seed Job — and we stop talking about cost.
  memory:
    embedded: true

choregos-litellm:
  upstream:
    apiKeySecret: platform-llm-key
  # The aliases the projects ask for (`profile:standard` → `platform/standard`) and the real
  # model behind them. The `claude-code` backend requires a Claude model: the resolver
  # checks it on `provider_model`, read here.
  models:
    - alias: platform/standard
      model: anthropic/claude-sonnet-5
    - alias: platform/strong
      model: anthropic/claude-sonnet-5
    - alias: platform/cheap
      model: anthropic/claude-haiku-4-5-20251001
    - alias: platform/aux
      model: anthropic/claude-haiku-4-5-20251001

choregos-ecphoria:
  embedding:
    # Anthropic does not serve embeddings: memory keeps the facts, semantic search falls
    # back to lexical. A provider that has them → `provider: gateway`.
    provider: none

choregos-orchestrator:
  runner:
    # A single node: three agents starting together means three 2-CPU containers and an
    # image of several gigabytes pulled three times. Beyond two, the Job waits WITHOUT a
    # pod, in order of arrival (ADR 0013).
    maxActive: 2
    env:
      # The agents talk to the cluster's repository in the clear: nothing secret here.
      GIT_TERMINAL_PROMPT: "0"
    envFromSecrets:
      # Optional, and only in direct mode (DEMO_GATEWAY=direct): the `agent-creds` secret
      # then carries CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY. With the gateway, the
      # agent receives a PER-RUN key and needs nothing else.
      - agent-creds
