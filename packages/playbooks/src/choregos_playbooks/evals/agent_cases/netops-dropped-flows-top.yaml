agent: netops
description: >
  E2 of the tool-script matrix (S57-09): which namespace pairs drop the most flows, and which policy drops
  them. A loop (one `get_flows` per namespace, each answer under the platform's 64 KiB bound) and an
  aggregation: the model needs the top five, not the flows. A flow is listed under both its namespaces;
  it is counted once, at its source.
output: netops_report_markdown
task: >
  Over the last hour, in the namespaces shop, payments, auth, catalog, search, orders, inventory, shipping,
  notifications, analytics, monitoring and ingress, which source → destination pairs (namespace/app, and
  the destination port) had the most dropped flows? For the top five, name the policy that drops them, and
  propose a fix for the first.
tools_cells: [mcp, scripts]
connectors:
  cilium: { kind: network_policy, scene: dropped-flows }
