# PR CI: targeted by path, so a front-end PR does not wait for the Python tests.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    # `dorny/paths-filter` asks the API for the list of the PR's files. The `GITHUB_TOKEN`
    # of a Dependabot PR is read-only and carries only what the workflow declares:
    # without `pull-requests: read`, the action exits on "Resource not accessible by integration"
    # and no filter is computed.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      web: ${{ steps.filter.outputs.web }}
      charts: ${{ steps.filter.outputs.charts }}
      contracts: ${{ steps.filter.outputs.contracts }}
      docker: ${{ steps.filter.outputs.docker }}
      local-install: ${{ steps.filter.outputs.local-install }}
      hosted-build: ${{ steps.filter.outputs.hosted-build }}
      hosted-cosign: ${{ steps.filter.outputs.hosted-cosign }}
      hosted-gvisor: ${{ steps.filter.outputs.hosted-gvisor }}
      hosted-foundry: ${{ steps.filter.outputs.hosted-foundry }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            python:
              - 'packages/**'
              - 'apps/api/**'
              - 'apps/orchestrator/**'
              - 'tools/**'
              - 'tests/**'
              - 'examples/**'
              - 'pyproject.toml'
              - 'uv.lock'
            web:
              - 'apps/web/**'
              - 'packages/contracts/ts/**'
            charts:
              - 'charts/**'
              - 'infra/**'
            contracts:
              - 'packages/contracts/**'
            docker:
              - 'docker/**'
            # What `docker compose up` at the root is made of (S28-04). The platform's code is
            # proven by the other jobs; this job proves the install, and runs on `main` and in
            # the merge queue whatever changed, so that nothing merges past a broken compose.
            local-install:
              - 'compose.yaml'
              - '.env.example'
              - '.dockerignore'
              - 'dev/local/**'
              - 'docker/**'
              - 'tools/local_install_check.py'
              - '.github/workflows/ci.yml'
              - 'apps/api/src/choregos_api/local_demo.py'
              - 'apps/api/src/choregos_api/migrations/**'
              - 'apps/web/src/app/login/**'
              - 'apps/web/package.json'
              - 'apps/web/next.config.mjs'
              - 'pyproject.toml'
              - 'uv.lock'
            # What a hosted zip becomes an image through (S41-13): the builder, the template, the
            # reference agent it builds, and the suite the built image goes through.
            hosted-build:
              - 'packages/adapters/src/choregos_adapters/oci/**'
              - 'apps/api/src/choregos_api/services/hosted_sources.py'
              - 'examples/hosted/reference/**'
              - 'tests/build/**'
              - 'tests/conformance/hosted/**'
              - 'charts/choregos/templates/buildkitd.yaml'
              - '.github/workflows/ci.yml'
              - 'pyproject.toml'
              - 'uv.lock'
            # The real `cosign` against a real registry (S41-14): what verifies a hosted image's
            # signature, the release the API image carries, and this job.
            hosted-cosign:
              - 'packages/adapters/src/choregos_adapters/oci/**'
              - 'packages/adapters/tests/test_cosign*.py'
              - 'charts/choregos/templates/hosted-images-policy.yaml'
              - 'tests/charts/test_hosted_images_policy.py'
              - 'docker/api.Dockerfile'
              - '.github/workflows/ci.yml'
            # A hosted agent inside gVisor (S41-17): the suite, the examples it runs, the policy that
            # asks for the RuntimeClass, the pinned release, and this job.
            hosted-gvisor:
              - 'tests/conformance/hosted/**'
              - 'examples/hosted/reference/**'
              - 'examples/hosted/reference-node/**'
              - 'packages/runner/src/choregos_runner/hosted.py'
              - 'packages/runner/src/choregos_runner/loopback/**'
              - 'packages/adapters/src/choregos_adapters/executor/k8s_job.py'
              - 'apps/orchestrator/src/choregos_orchestrator/gitops.py'
              - 'apps/orchestrator/tests/test_gvisor_policy.py'
              - 'dev/scripts/gvisor.sh'
              - '.github/workflows/ci.yml'
              - 'pyproject.toml'
              - 'uv.lock'
            # An agent written for Foundry, run unchanged (S41-19): its example, the suite, the
            # loopback model that serves the Foundry project and the managed identity, and the
            # variables that point the SDKs at it.
            hosted-foundry:
              - 'examples/hosted/agent-framework-foundry/**'
              - 'tests/conformance/hosted/**'
              - 'packages/runner/src/choregos_runner/hosted.py'
              - 'packages/runner/src/choregos_runner/loopback/**'
              - 'packages/core/src/choregos_core/hosted.py'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    # A real PostgreSQL: RLS does not exist on SQLite, and it was "tested" for a
    # week without ever running (status review of 2026-09-24). `test_rls_postgres.py` only
    # runs if CHOREGOS_TEST_DATABASE_URL is set.
    services:
      postgres:
        # PostgreSQL 16 with pgvector: the knowledge index's hybrid ranking runs in CI (ADR 0051).
        image: pgvector/pgvector:0.8.1-pg16
        env: { POSTGRES_USER: choregos, POSTGRES_PASSWORD: choregos, POSTGRES_DB: choregos_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U choregos" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CHOREGOS_TEST_DATABASE_URL: postgresql+asyncpg://choregos:choregos@localhost:5432/choregos_test
      # The image carries pgvector: the knowledge index test then requires the hybrid ranking.
      CHOREGOS_TEST_EXPECT_PGVECTOR: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv sync --frozen
      - name: lint
        run: uv run ruff check packages apps/api apps/orchestrator tools tests && uv run ruff format --check packages apps/api apps/orchestrator tools tests
      - name: typing
        run: uv run mypy packages/*/src apps/api/src apps/orchestrator/src tools
      - name: tests and coverage
        run: uv run pytest --cov --cov-report=xml -q
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: coverage, path: coverage.xml, if-no-files-found: ignore }
      # The WHOLE API suite, a second time, on PostgreSQL under RLS (migrated schema, non-
      # superuser role). The first run plays it on SQLite, where RLS does not exist: three defects
      # only showed up there — webhooks that routed nothing, `POST /orgs` returning 500, and a
      # project role that became an organisation role (2026-09-29).
      - name: API suite on PostgreSQL
        run: uv run pytest apps/api/tests -q
        env:
          CHOREGOS_TEST_SUITE_SUR_POSTGRES: "1"

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: generated types are up to date
        run: uv run python tools/gen_contracts.py --check
      - name: examples valid against the schemas and the models
        run: uv run pytest packages/contracts -q

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/web }
    steps:
      - uses: actions/checkout@v7
      # No `version`: the action reads `packageManager` in `apps/web/package.json`. A
      # version written here too ends up diverging — that is what left CI on pnpm 9
      # while the repository had moved to 12.
      - uses: pnpm/action-setup@v6
        with: { package_json_file: apps/web/package.json }
      # The image's Node (`docker/web.Dockerfile`): the console is tested on what it runs on.
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The bundle budget is read off the build: a dependency bundled by mistake shows up here.
      - run: pnpm bundle:check
      # The Playwright journeys and the axe pass run against the build in demo mode:
      # an inaccessible screen or a broken journey shows up here, not at a user's.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env: { CI: "true" }
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-report, path: apps/web/playwright-report, retention-days: 7 }

  charts:
    needs: changes
    if: needs.changes.outputs.charts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with: { version: v3.22.0 }
      # The default executor (agent_sandbox, ADR 0072) refuses to render without its operator in the
      # cluster's API versions: an offline rendering skips that check, nothing else.
      - run: helm lint charts/choregos --set choregos-orchestrator.runner.skipOperatorCheck=true
      - name: render the four environments (local = the bundled dependencies)
        run: |
          for env in local dev staging prod; do
            helm template choregos charts/choregos -f charts/choregos/values/$env.yaml --set choregos-orchestrator.runner.skipOperatorCheck=true > /tmp/$env.yaml
          done
      - name: kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz
          ./kubeconform -strict -ignore-missing-schemas -summary /tmp/prod.yaml
      - name: helm unittest
        run: |
          # Pinned version: the plugin tracks Helm closely — `platformHooks` in its
          # plugin.yaml requires Helm >= 3.18, and on an older version the installation
          # fails. The earlier `|| true` swallowed that failure and turned it into
          # "unknown command "unittest"" two lines further down.
          helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.1.2
          helm unittest charts/choregos
      - name: kyverno test (the engine judges infra/policies against infra/policies/tests)
        run: |
          # Pinned and checksummed: 1.13.4 counted "want fail, got pass" as a pass.
          curl -sSfLo kyverno.tar.gz https://github.com/kyverno/kyverno/releases/download/v1.19.1/kyverno-cli_v1.19.1_linux_x86_64.tar.gz
          echo "b38228f367fc0fdc2b08f4c83ea50ac5f16c60ff8d62d76a66157c33c47b70ae  kyverno.tar.gz" | sha256sum -c -
          tar xzf kyverno.tar.gz kyverno
          ./kyverno test infra/policies/tests

  conformance-backends:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: conformance of the default backend and of the plain code agent (the others run at night)
        run: uv run pytest tests/conformance/backends -m conformance -q -k "default or protocol or code_agent"
      - name: conformance of the templates (connectors, stages, scaffold)
        run: uv run pytest tests/conformance/templates -m conformance -q

  images:
    needs: changes
    if: needs.changes.outputs.docker == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      # Without this, the first failing image cancels the other four and we cannot tell whether
      # they would have passed — which is exactly what happened on the first run.
      fail-fast: false
      matrix:
        include:
          # `api` and `orchestrator` come out of the same Dockerfile, two targets apart: same
          # dependencies, same code, same commit. See docker/api.Dockerfile.
          - image: api
            file: docker/api.Dockerfile
            target: api
          - image: orchestrator
            file: docker/api.Dockerfile
            target: worker
          - image: tools
            file: docker/tools.Dockerfile
          - image: web
            file: docker/web.Dockerfile
          - image: runner
            file: docker/runner.Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          # The identity that pushes does not depend on who triggered the workflow.
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: ${{ github.ref == 'refs/heads/main' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/vargafoundation/choregos-${{ matrix.image }}:${{ github.sha }}
          build-args: REVISION=${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          # SBOM and SLSA provenance attached to the image (BuildKit attestations). SECURITY.md
          # promised them from the start; none existed (status review of 2026-09-24).
          sbom: ${{ github.ref == 'refs/heads/main' }}
          provenance: ${{ github.ref == 'refs/heads/main' && 'mode=max' || 'false' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy scan (no CRITICAL tolerated)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/vargafoundation/choregos-${{ matrix.image }}:${{ github.sha }}
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true
        if: github.ref == 'refs/heads/main'
      - uses: sigstore/cosign-installer@v3
        if: github.ref == 'refs/heads/main'
      - name: keyless signature
        if: github.ref == 'refs/heads/main'
        run: cosign sign --yes ghcr.io/vargafoundation/choregos-${{ matrix.image }}@${{ steps.build.outputs.digest }}

  local-install:
    # `docker compose up` on a clean runner, then one work item through it in fakes mode (S28-04):
    # console 200, development sign-in, the seeded demo work item, a new one through its agent
    # stage, an approval, the terminal state. "It works locally" is this job, not a claim.
    needs: changes
    if: >-
      needs.changes.outputs.local-install == 'true'
      || github.ref == 'refs/heads/main'
      || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: build the images
        run: docker compose build
      - name: docker compose up
        run: |
          start=$(date +%s)
          docker compose up -d --wait --wait-timeout 600
          echo "healthy after $(( $(date +%s) - start )) s (images already built)"
      - name: one work item through the install, in fakes mode
        run: python3 tools/local_install_check.py --console-timeout 120 --stage-timeout 180
      - name: logs of the install
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: tear down
        if: always()
        run: docker compose down -v --remove-orphans

  hosted-build:
    # A real rootless BuildKit builds the reference zip with the platform's template (S41-13,
    # ADR 0080 §9): pushed to a real registry, found again under its key, rebuilt from an empty
    # cache to the same digest, then run through the hosted conformance suite. The unit tests prove
    # the argv; this proves the argv builds an image that works, twice the same.
    needs: changes
    if: needs.changes.outputs.hosted-build == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUILDKIT_IMAGE: moby/buildkit:v0.33.1-rootless@sha256:f8a833b2de9d68e27f0815e4a737abdfaf8a2e4c615650557df11025101557b4
      BUILDKIT_VERSION: v0.33.1
      BUILDKIT_SHA256: 4e044bcd62a0c0bbe6a8c94d73989de2bfe4c04dbc0f9d6021cf96b72cd1d965
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: a registry on localhost:5000
        run: docker run -d --name registry -p 5000:5000 registry:2
      - name: buildkitd, with the chart's profile
        run: |
          # Ubuntu 24.04 refuses user namespaces to unconfined processes; a node of that distribution
          # that runs the builder needs the same setting (docs/security.md, "The builder").
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          printf '[registry."localhost:5000"]\n  http = true\n  insecure = true\n' > "$RUNNER_TEMP/buildkitd.toml"
          # The profile of charts/choregos/templates/buildkitd.yaml: uid 1000, every capability
          # dropped but SETUID/SETGID, seccomp and AppArmor unconfined, a read-only root.
          docker run -d --name buildkitd --network host \
            --user 1000:1000 --cap-drop ALL --cap-add SETUID --cap-add SETGID \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            --read-only \
            --tmpfs /home/user/.local/share/buildkit:exec,mode=1777 \
            --tmpfs /run/user/1000:exec,mode=1777 \
            --tmpfs /tmp:exec,mode=1777 \
            --tmpfs /home/user/.local/tmp:exec,mode=1777 \
            -v "$RUNNER_TEMP/buildkitd.toml:/etc/buildkit/buildkitd.toml:ro" \
            "$BUILDKIT_IMAGE" \
            --config /etc/buildkit/buildkitd.toml \
            --addr tcp://127.0.0.1:1234 --oci-worker-no-process-sandbox
      - name: buildctl, checked
        run: |
          curl -sSLo buildkit.tgz "https://github.com/moby/buildkit/releases/download/$BUILDKIT_VERSION/buildkit-$BUILDKIT_VERSION.linux-amd64.tar.gz"
          echo "$BUILDKIT_SHA256  buildkit.tgz" | sha256sum -c -
          tar xzf buildkit.tgz bin/buildctl
          for i in $(seq 30); do bin/buildctl --addr tcp://127.0.0.1:1234 debug workers && break; sleep 2; done
          bin/buildctl --addr tcp://127.0.0.1:1234 debug workers || { docker logs buildkitd; exit 1; }
      - name: the reference zip, built, found, rebuilt from nothing to the same digest
        env:
          CHOREGOS_TEST_BUILDKIT_ADDRESS: tcp://127.0.0.1:1234
          CHOREGOS_TEST_BUILD_REPOSITORY: localhost:5000/choregos-builds/reference
          CHOREGOS_TEST_BUILDCTL: ${{ github.workspace }}/bin/buildctl
          CHOREGOS_TEST_BUILT_IMAGE_FILE: ${{ runner.temp }}/built-image
        run: uv run pytest tests/build -m buildkit -q -rs
      - name: the built image through the hosted conformance suite
        run: make conformance-hosted IMAGE="$(cat "$RUNNER_TEMP/built-image")"
      - name: logs of the builder
        if: failure()
        run: docker logs --tail 200 buildkitd
  hosted-cosign:
    # `CosignVerifier` and the chart's Kyverno policy against the real binaries and a real registry
    # (S41-14): key pairs generated by the tests, tiny images pushed with crane, one signed, one not,
    # a signature copied onto other bytes, a signed and an unsigned native sidecar. The unit tests
    # script cosign; this job is the proof the script tells the truth.
    needs: changes
    if: needs.changes.outputs.hosted-cosign == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      registry:
        image: registry:2.8.3
        ports: ["5000:5000"]
    env:
      CHOREGOS_COSIGN_REAL_REGISTRY: localhost:5000
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv sync --frozen
      # v2: the signing flags v3 changed; the release docker/api.Dockerfile copies.
      - uses: sigstore/cosign-installer@v3
        with: { cosign-release: v2.6.5 }
      - uses: imjasonh/setup-crane@v0.4
        with: { version: v0.20.7 }
      - name: kyverno CLI
        run: |
          curl -sSLo kyverno.tar.gz https://github.com/kyverno/kyverno/releases/download/v1.15.2/kyverno-cli_v1.15.2_linux_x86_64.tar.gz
          echo "c90520ba24fb8b8df003ec22d6d2621e4a3d3c7497665fdcf84e9eab4ff1dfe0  kyverno.tar.gz" | sha256sum -c
          tar xzf kyverno.tar.gz kyverno && sudo mv kyverno /usr/local/bin/kyverno
      - uses: azure/setup-helm@v5
        with: { version: v3.22.0 }
      - name: cosign and the chart's Kyverno policy against the registry
        shell: bash
        run: |
          uv run pytest packages/adapters/tests/test_cosign_real.py tests/charts/test_hosted_images_policy.py -rs | tee pytest.out
          # A skip proves nothing: cosign, crane, kyverno or the registry went missing, and the job says so.
          ! grep -qi skipped pytest.out

  hosted-gvisor:
    # The hosted conformance suite with the agent inside a gVisor sandbox, and the project policy
    # that refuses a hosted Job without the RuntimeClass, judged by the real Kyverno CLI (S41-17).
    # The release is the one dev/scripts/gvisor.sh pins for kind; the script fetches and checks it.
    needs: changes
    if: needs.changes.outputs.hosted-gvisor == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv sync --frozen
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - name: gVisor, the pinned release
        run: |
          dev/scripts/gvisor.sh fetch "$RUNNER_TEMP/gvisor"
          # Ubuntu 24.04 forbids unprivileged user namespaces to unconfined programs; rootless runsc needs one.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: kyverno CLI
        run: |
          curl -sSLo kyverno.tar.gz https://github.com/kyverno/kyverno/releases/download/v1.15.2/kyverno-cli_v1.15.2_linux_x86_64.tar.gz
          echo "c90520ba24fb8b8df003ec22d6d2621e4a3d3c7497665fdcf84e9eab4ff1dfe0  kyverno.tar.gz" | sha256sum -c
          tar xzf kyverno.tar.gz kyverno && sudo mv kyverno /usr/local/bin/kyverno
      - name: the hosted suite under gVisor, and the policy that asks for it
        shell: bash
        env:
          CHOREGOS_TEST_RUNSC: ${{ runner.temp }}/gvisor/runsc
        run: |
          uv run pytest tests/conformance/hosted/test_hosted_under_gvisor.py -m gvisor -rs | tee pytest.out
          uv run pytest apps/orchestrator/tests/test_gvisor_policy.py -rs | tee -a pytest.out
          # A skip proves nothing: runsc, node or kyverno went missing, and the job says so.
          ! grep -qi skipped pytest.out

  hosted-foundry:
    # The Foundry variant of the triager (Agent Framework's `FoundryChatClient`, azure-identity's
    # `DefaultAzureCredential`, Foundry's `ResponsesHostServer`), unchanged, through the eight checks
    # (S41-19). Its pinned requirements live in a venv of their own: they stay out of the lock file.
    needs: changes
    if: needs.changes.outputs.hosted-foundry == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv sync --frozen
      - name: the example's requirements
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/foundry"
          uv pip install --python "$RUNNER_TEMP/foundry/bin/python" -r examples/hosted/agent-framework-foundry/requirements.txt
      - name: conformance of the Foundry agent
        shell: bash
        run: |
          make conformance-hosted AGENT=agent-framework-foundry PYTHON="$RUNNER_TEMP/foundry/bin/python" | tee pytest.out
          # A skip proves nothing: the suite found no agent to run.
          ! grep -qi skipped pytest.out

  secrets:
    # A committed secret cannot be taken back: it is already in the history. Two files
    # had a `noqa S105` and two SQLite databases were tracked by git — without any scan
    # seeing it (status review of 2026-09-24).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 \
            detect --source /repo --config /repo/.gitleaks.toml --redact --exit-code 1 --no-banner

  dco:
    # Every commit certifies the Developer Certificate of Origin (`DCO` file) with a
    # `Signed-off-by` line. This job exists because a certificate nobody checks is
    # decoration: asking for it in CONTRIBUTING without enforcing it would have produced exactly what
    # this repository hunts down — a rule that merely looks like a rule.
    #
    # Two entities publish from this code (ADR 0024). The provenance of every line must be
    # verifiable by anyone, themselves included.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: every commit carries a Signed-off-by
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          tip='${{ github.event.pull_request.head.sha }}'
          missing=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            if ! git show -s --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::commit without Signed-off-by: $sha $(git show -s --format=%s "$sha")"
              missing=$((missing + 1))
            fi
          done <<< "$(git rev-list "$base..$tip")"
          if [ "$missing" -gt 0 ]; then
            echo "$missing unsigned commit(s). `git commit --amend -s` on the last one," \
                 "or `git rebase --signoff $base` for the whole branch. See DCO and" \
                 "docs/CONTRIBUTING.md."
            exit 1
          fi
          echo "all commits carry their Signed-off-by"

  english:
    # ADR 0046: everything new is in English. The guard reads only the lines the pull request adds
    # (and its commit messages), so it runs on every pull request — a docs-only change included,
    # which the `python` job's path filter would skip. It diffs against the base: full history.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v7
      - name: no French in new or modified lines
        run: >-
          uv run --no-project --python 3.12 tools/check_english.py
          --range '${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}'

  ci-ok:
    # Single target for branch protection and the merge queue.
    #
    # `images` is part of it: without it, the gate was green while none of the platform's five
    # images was building — which is exactly what happened on the first run of this CI.
    # Three minutes of waiting against a `main` branch from which nothing can be deployed;
    # the sum is quickly done.
    #
    # `changes` is part of it too: when the filter computation fails, every job that depends on
    # it is *skipped*, and a gate that only looks at skipped jobs is green. A Dependabot PR
    # went through like that, without a single line having been tested.
    #
    # The gate accepts only `success` and `skipped`. It used to reject `failure` and `cancelled`: on
    # 2026-10-05, the hosted runners stopped acquiring jobs, `python` came back
    # `abandoned`, and a PR's gate was green without a single Python test having run. Whatever
    # GitHub invents tomorrow will close the gate too: we enumerate what passes, not what breaks.
    needs: [changes, python, contracts, web, charts, conformance-backends, images, local-install, hosted-build, hosted-cosign, hosted-gvisor, hosted-foundry, secrets, dco, english]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: check that every required job succeeded or was skipped
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          if echo "$results" | grep -o '"result": "[a-z_]*"' | grep -qvE '"result": "(success|skipped)"'; then
            exit 1
          fi
          exit 0
