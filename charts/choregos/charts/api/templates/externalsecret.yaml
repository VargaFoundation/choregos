{{- if and .Values.enabled .Values.global.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: choregos-api-secrets
  labels: {{- include "choregos.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.global.externalSecrets.refreshInterval }}
  secretStoreRef: { name: {{ .Values.global.externalSecrets.storeRef }}, kind: ClusterSecretStore }
  target: { name: choregos-api-secrets, creationPolicy: Owner }
  data:
    {{- range $key := list "session-secret" "run-token-private-key" "run-token-public-key" "github-webhook-secret" "github-app-id" "github-app-private-key" }}
    - secretKey: {{ $key }}
      remoteRef: { key: choregos/api, property: {{ $key }} }
    {{- end }}
{{- end }}
