# Release : un tag semver produit les images signées, le chart OCI et le changelog.
#
# Jamais exécuté avant v0.1.0, et il ne pouvait pas passer : la matrice cherchait un
# `docker/orchestrator.Dockerfile` qui n'existe pas (l'orchestrateur est la cible `worker`
# de `api.Dockerfile`), l'API se construisait sans sa cible, arm64 passait par QEMU — le
# chemin qui rendait l'image runner interminable — et le chart partait avec `imageTag:
# "1.0.0"` écrit en dur, quelle que soit la version publiée. Le schéma ci-dessous est celui
# d'Ecphoria v0.2.5, éprouvé : une architecture par runner natif, poussée par digest, puis
# une liste de manifestes par image.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  images:
    name: ${{ matrix.image }} (${{ matrix.platform }})
    runs-on: ${{ matrix.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # `image` porte ses propres clés par `include` ; `platform` est une dimension. Deux
        # `include` qui ajoutent la même clé à toutes les combinaisons se recouvriraient.
        image: [api, orchestrator, tools, web, runner]
        platform: [amd64, arm64]
        include:
          - { image: api, file: docker/api.Dockerfile, target: api }
          - { image: orchestrator, file: docker/api.Dockerfile, target: worker }
          - { image: tools, file: docker/tools.Dockerfile, target: "" }
          - { image: web, file: docker/web.Dockerfile, target: "" }
          - { image: runner, file: docker/runner.Dockerfile, target: "" }
    env:
      IMAGE: ghcr.io/vargafoundation/choregos-${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform }}
      - name: déposer le digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image }}-${{ matrix.platform }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    name: manifeste et signature (${{ matrix.image }})
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign sans clé (OIDC GitHub)
    strategy:
      fail-fast: false
      matrix:
        image: [api, orchestrator, tools, web, runner]
    env:
      IMAGE: ghcr.io/vargafoundation/choregos-${{ matrix.image }}
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: assembler la liste de manifestes
        working-directory: /tmp/digests
        run: |
          # Le découpage en mots est voulu : une option `-t` par tag, une référence par digest.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
      - name: scan Trivy de l'image publiée (aucun CRITICAL toléré)
        # Les images de `main` étaient scannées, celles d'une release — celles qui partent en
        # production — jamais (état des lieux du 2026-09-24).
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true
      - name: signer le manifeste
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)
          cosign sign --yes "${IMAGE}@${digest}"

  chart:
    # Après les images : un chart publié ne doit jamais désigner une image absente.
    needs: manifest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - uses: astral-sh/setup-uv@v7
      - name: la version taguée est celle du dépôt
        # Plus de `sed` au moment du build : les versions se posent AVANT le tag, avec
        # `tools/bump_version.py`, et le dépôt dit toujours la vérité. Un tag qui ne
        # correspond pas aux fichiers arrête la release ici.
        run: uv run python tools/bump_version.py "${GITHUB_REF_NAME#v}" --check
      - name: publier le chart en OCI
        env:
          HELM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.repository_owner }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package charts/choregos --version "$version" --app-version "$version"
          echo "$HELM_TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          helm push "choregos-$version.tgz" oci://ghcr.io/vargafoundation/charts

  changelog:
    needs: chart
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v7
      - name: construire les paquets Python
        # Un dépôt Apache 2.0 dont aucun des neuf paquets n'était distribuable : les wheels
        # partent avec la release (pas de PyPI tant que les noms ne sont pas réservés).
        run: uv build --all-packages --out-dir dist
      - uses: orhun/git-cliff-action@v4
        with: { args: --latest --strip header }
        id: cliff
      - uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.cliff.outputs.content }}
          generate_release_notes: true
          files: dist/*
