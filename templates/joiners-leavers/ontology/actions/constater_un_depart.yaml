apiVersion: choregos.dev/v1alpha1
kind: ActionType
metadata:
  name: constater_un_depart
  displayName: Constater un départ
  description: "Déclare la personne partie et ferme au registre ce que le workflow de départ a coupé : son compte, son badge, et son poste repris."
spec:
  target: {objectType: collaborateur, cardinality: one}
  parameters:
    date_depart: {type: date, required: true}
    upn: {type: string, required: true}
    badge: {type: string, required: true, description: "L'UID du badge coupé."}
    numero_de_serie: {type: string, required: true, description: "Le poste repris."}
  preconditions:
    - {name: pas_deja_parti, expr: "target.statut != 'parti'", message: "Cette personne est déjà partie."}
  permissions:
    propose: [agent:coordinateur-offboarding, role:contributor]
    approve: policy:rh
  risk: medium
  reversibility: reversible  # une mise à jour du registre, qu'une autre défait
  effects:
    - type: object.update
      with: {objectType: account, id: "${params.upn}", properties: {actif: false, ferme_le: "${now}"}}
    - type: object.update
      with: {objectType: badge, id: "${params.badge}", properties: {actif: false, coupe_le: "${now}"}}
    - type: object.update
      with: {objectType: materiel, id: "${params.numero_de_serie}", properties: {statut: repris}}
    - type: object.update
      with:
        objectType: collaborateur
        id: "${target.matricule}"
        properties: {statut: parti, date_depart: "${params.date_depart}"}
  evidence:
    - name: depart_au_registre
      collect: {type: object.reread, with: {}}
      expect: "result.statut == 'parti'"
  idempotencyKey: "${target.matricule + ':depart'}"
