# Pose les projets, leurs workflows et leurs tickets, puis démarre chaque ticket.
# Rejouable : ce qui existe est mis à jour, jamais dupliqué.
apiVersion: batch/v1
kind: Job
metadata:
  name: demo-seed
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: local/choregos-api:demo
          imagePullPolicy: Never
          workingDir: /app
          command: ["python", "/demo/seed.py", "--demarrer"]
          env:
            - { name: CHOREGOS_ENV, value: dev }
            # `litellm` (défaut) : les projets passent par la passerelle embarquée, une clé
            # par run, coût compté. `direct` : l'agent apporte ses identifiants, rien n'est
            # compté. `make demo-seed GATEWAY=direct` remplace la valeur.
            - { name: DEMO_GATEWAY, value: "__GATEWAY__" }
            # Suffixe des clés de tickets (`DEMO-1b`, `RH-1b`) : un ticket n'a qu'un
            # interpréteur, rejouer la démonstration demande de nouveaux tickets.
            - { name: DEMO_SERIE, value: "__SERIE__" }
            - name: CHOREGOS_GATEWAY_MASTER_KEY
              valueFrom: { secretKeyRef: { name: choregos-gateway, key: master-key, optional: true } }
            - { name: CHOREGOS_GATEWAY_URL, value: "http://choregos-litellm:4000" }
            - { name: CHOREGOS_TEMPORAL_ADDRESS, value: "choregos-temporal:7233" }
            - name: CHOREGOS_DATABASE_PASSWORD
              valueFrom: { secretKeyRef: { name: choregos-postgresql, key: password } }
            - name: CHOREGOS_DATABASE_URL
              value: postgresql+asyncpg://choregos:$(CHOREGOS_DATABASE_PASSWORD)@choregos-postgresql:5432/choregos
          volumeMounts:
            - { name: demo, mountPath: /demo }
      volumes:
        - name: demo
          configMap: { name: demo-seed }
