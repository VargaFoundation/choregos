{{- if and .Values.enabled .Values.ingress.enabled }}
{{- if eq (.Values.ingress.kind | default "httproute") "ingress" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: choregos-api
  labels: {{- include "choregos.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hostnames }}
    - host: {{ . | quote }}
      http:
        paths:
          {{- /* `/mcp` : la porte des clients MCP externes (ADR 0030), servie par l'API, et ses
               métadonnées OAuth (RFC 9728) que claude.ai lit avant de se connecter. */}}
          {{- range list "/api" "/mcp" "/healthz" "/readyz" "/.well-known/oauth-protected-resource" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service: { name: choregos-api, port: { number: {{ $.Values.service.port }} } }
          {{- end }}
    {{- end }}
{{- else }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: choregos-api
  labels: {{- include "choregos.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.ingress.gateway }}
      namespace: {{ .Values.ingress.gatewayNamespace | default "gateway" }}
  hostnames:
    {{- range .Values.ingress.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api }
        - path: { type: PathPrefix, value: /mcp }
        - path: { type: PathPrefix, value: /healthz }
        - path: { type: PathPrefix, value: /readyz }
        - path: { type: PathPrefix, value: /.well-known/oauth-protected-resource }
      backendRefs:
        - name: choregos-api
          port: {{ .Values.service.port }}
{{- end }}
{{- end }}
