scripted_script:
  name: research.py
  text: |
    import contextlib
    import io
    from urllib.parse import urlsplit

    from choregos_tools import Withheld, platform

    found = platform.web_search(query="open source feature flag self-hosted licence", max_results=10)
    read, refused = [], []
    for hit in found["results"]:
        host = urlsplit(hit["url"]).hostname
        said = io.StringIO()
        try:
            with contextlib.redirect_stderr(said):  # the client writes the guard's flags there
                page = platform.web_fetch(url=hit["url"])
        except Withheld:
            refused.append(f"The platform withheld `{host}` as a suspected injection: it is not a source.")
            continue
        if "suspected injection" in said.getvalue():
            refused.append(f"The platform flagged `{host}` as a suspected injection: its content is not used.")
            continue
        read.append(f"- {hit['url'].split('://', 1)[1]}: {page['text']}")
    print("## Options\n")
    print("\n".join(read))
    print("\n## Constraints and unknowns\n")
    print("\n".join(refused))
  answer:
    research_markdown: |
      <<stdout>>
      Switchyard's self-hosting requirements are not documented on the pages read.
