apiVersion: choregos.dev/v1alpha1
kind: ObjectType
metadata: {name: badge, displayName: Badge, description: "The NFC badge handed over in person, active until the person leaves.", owner: facilities}
spec:
  datasource: badges
  primaryKey: uid
  titleProperty: uid
  properties:
    uid: {type: string, required: true}
    employee_id: {type: string, required: true}
    active: {type: boolean, required: true}
    handed_over_at: {type: timestamp}
    cut_at: {type: timestamp}
