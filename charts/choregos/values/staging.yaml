# Staging: synthetic data, automatic promotion from `main`.
global:
  domain: staging.choregos.dev
  environment: staging
  fakes: false
  logLevel: INFO
choregos-api:
  # The run's API on the public hostnames (ADR 0144): `enforce` answers 404 there (S80-03b). Runs call
  # the in-cluster Service (`global.internalApiUrl`'s default) and are not concerned; runs that call
  # back through a public hostname need a run door first, or `warn` (docs/deployment.md, "The run's
  # API and the run door").
  internalApiGuard: enforce
  replicaCount: 2
choregos-web:
  replicaCount: 2
