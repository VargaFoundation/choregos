[project]
name = "choregos-core"
version = "0.27.13"
description = "Deprecated name of tranibor-core: an empty wheel that depends on it and ships the `choregos_core` import alias (ADR 0176, R2)"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = ["tranibor-core==0.27.13", "tranibor-contracts==0.27.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/choregos_core"]
