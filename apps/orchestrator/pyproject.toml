[project]
name = "choregos-orchestrator"
version = "0.27.2"
description = "Orchestrateur Choregos : workers et workflows Temporal"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    # Spans (ADR 0018): `choregos_core.telemetry` needs the extra.
    "choregos-core[telemetry]",
    "choregos-adapters",
    "choregos-api",
    "temporalio>=1.8",
    "structlog>=24.4",
    "pydantic-settings>=2.6",
    "prometheus-client>=0.21",
]

[project.scripts]
choregos-orchestrator = "choregos_orchestrator.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/choregos_orchestrator"]
