# La démonstration : le banc local, plus ce qui lui est propre.
#   helm upgrade --install choregos charts/choregos -n choregos \
#     -f charts/choregos/values/local.yaml -f demo/values-demo.yaml
#
# Ce fichier S'AJOUTE à `values/local.yaml` (tout embarqué) : il ne redit que ce qui change.
global:
  imageRegistry: local
  imageTag: demo
  imagePullPolicy: Never
  # Les playbooks métier (sourcing, qualification) viennent du déploiement.
  playbooks:
    configMap: demo-playbooks
  # Le catalogue d'outils (ADR 0014). Sans cette ligne, l'API n'a AUCUN catalogue et les
  # agents n'ont aucun outil — c'est exactement l'état dans lequel le banc du 2026-09-24
  # a tourné sans que personne s'en aperçoive. La ConfigMap vient de `demo/manifests`.
  toolCatalog:
    configMap: demo-outils
  # La passerelle LLM reste EMBARQUÉE (héritée de local.yaml) : c'est elle qui frappe une
  # clé par run, plafonne la dépense et la compte. Sans elle, le registre de coûts reste à
  # zéro — 12 runs à 0 € sur le banc du 2026-09-24, présentés comme un plafond tenu.
  # Elle a besoin d'une clé de fournisseur, posée à la main (voir demo/README.md) :
  #   kubectl -n choregos create secret generic platform-llm-key --from-literal=api-key=sk-ant-…
  # Sans clé de fournisseur : `--set global.gateway.embedded=false` et DEMO_GATEWAY=direct
  # dans le Job de seed — et on ne parle plus de coût.
  memory:
    embedded: true

choregos-litellm:
  upstream:
    apiKeySecret: platform-llm-key
  # Les alias que les projets demandent (`profile:standard` → `platform/standard`) et le
  # modèle réel derrière. Le backend `claude-code` exige un modèle Claude : le resolver le
  # vérifie sur `provider_model`, lu ici.
  models:
    - alias: platform/standard
      model: anthropic/claude-sonnet-5
    - alias: platform/strong
      model: anthropic/claude-sonnet-5
    - alias: platform/cheap
      model: anthropic/claude-haiku-4-5-20251001
    - alias: platform/aux
      model: anthropic/claude-haiku-4-5-20251001

choregos-ecphoria:
  embedding:
    # Anthropic ne sert pas d'embeddings : la mémoire garde les faits, la recherche
    # sémantique retombe sur du lexical. Un fournisseur qui en a → `provider: gateway`.
    provider: none

choregos-orchestrator:
  runner:
    # Un seul nœud : trois agents qui démarrent ensemble, c'est trois conteneurs de 2 CPU
    # et une image de plusieurs gigaoctets tirée trois fois. Au-delà de deux, le Job
    # attend SANS pod, dans l'ordre d'arrivée (ADR 0013).
    maxActive: 2
    env:
      # Les agents parlent au dépôt du cluster, en clair : rien de secret ici.
      GIT_TERMINAL_PROMPT: "0"
    envFromSecrets:
      # Facultatif, et seulement en mode direct (DEMO_GATEWAY=direct) : le secret
      # `agent-creds` porte alors CLAUDE_CODE_OAUTH_TOKEN ou ANTHROPIC_API_KEY. Avec la
      # passerelle, l'agent reçoit une clé DE RUN et n'a besoin de rien d'autre.
      - agent-creds
