{{- /*
Deux saveurs d'observabilité, parce que « rendre un ServiceMonitor » n'est pas « être collecté ».

Le 2026-09-26, le locataire dev de Diametral tournait depuis une heure avec un ServiceMonitor et
une PrometheusRule bien présents dans son namespace — et pas une série collectée, pas une alerte
évaluée : la plateforme tourne sur VictoriaMetrics, dont l'opérateur ne regarde pas les types
`monitoring.coreos.com`. Un objet inerte ne dit rien, et c'est pire qu'un objet absent : il donne
la sensation d'être surveillé.

`monitoring.flavour` tranche. Les règles PromQL sont écrites UNE fois et servies aux deux.

Côté VictoriaMetrics : UN seul `VMRule`. Deux dans la même portée de vmalert font boucler
l'opérateur, ce que l'exploitant de la plateforme a déjà payé une fois.
*/ -}}
{{- $saveur := .Values.monitoring.flavour | default "prometheus" }}
{{- if not (has $saveur (list "prometheus" "victoriametrics")) }}
{{- fail (printf "monitoring.flavour=%s inconnu : `prometheus` ou `victoriametrics`." $saveur) }}
{{- end }}
{{- $vm := eq $saveur "victoriametrics" }}
{{- if .Values.monitoring.serviceMonitor }}
apiVersion: {{ if $vm }}operator.victoriametrics.com/v1beta1{{ else }}monitoring.coreos.com/v1{{ end }}
kind: {{ if $vm }}VMServiceScrape{{ else }}ServiceMonitor{{ end }}
metadata:
  name: choregos
  labels: {{- include "choregos.labels" . | nindent 4 }}
spec:
  # L'API seule : c'est elle qui calcule les séries depuis la base (`metriques.py`). Le
  # front, scruté aussi avant, répondait 404 toutes les trente secondes.
  selector:
    matchLabels:
      app.kubernetes.io/part-of: choregos
      app.kubernetes.io/component: api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
{{- end }}
{{- if .Values.monitoring.alerts }}
---
apiVersion: {{ if $vm }}operator.victoriametrics.com/v1beta1{{ else }}monitoring.coreos.com/v1{{ end }}
kind: {{ if $vm }}VMRule{{ else }}PrometheusRule{{ end }}
metadata:
  name: choregos
  labels: {{- include "choregos.labels" . | nindent 4 }}
spec:
  groups:
    - name: choregos.plateforme
      rules:
{{ include "choregos.reglesDAlerte" . | indent 8 }}
{{- end }}
