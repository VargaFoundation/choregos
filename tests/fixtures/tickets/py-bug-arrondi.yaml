# Ticket de référence : corriger un bug d'arrondi signalé par un test qui échoue.
id: py-bug-arrondi
title: "Le total TTC arrondit 0,5 centime vers le bas"
repo: python-toy
role: implement
prompt: |
  `total_ttc` doit arrondir au centime le plus proche, moitié vers le haut.
  Ajoute un test de régression pour un panier dont le TTC tombe pile sur un
  demi-centime, et corrige `total_ttc` si nécessaire.
allowed_paths:
  - "src/panier/**"
  - "tests/**"
expected_cost_usd: 0.35
expected_duration_s: 140
assertions:
  - { kind: file_exists, path: tests/test_arrondi.py }
  - { kind: file_matches, path: src/panier/panier.py, pattern: "ROUND_HALF_UP", absent: false }
  - { kind: command, run: "python -m pytest -q" }
scripted:
  with_memory:
    files:
      src/panier/panier.py: |
        """Modèle de panier : des lignes, un total en centimes."""

        from __future__ import annotations

        from dataclasses import dataclass, field
        from decimal import ROUND_HALF_UP, Decimal

        TVA = Decimal("0.20")


        @dataclass(frozen=True)
        class Ligne:
            """Une ligne de panier. Les prix sont en centimes : pas de flottants."""

            libelle: str
            prix_unitaire_cents: int
            quantite: int = 1

            def total_cents(self) -> int:
                return self.prix_unitaire_cents * self.quantite


        @dataclass
        class Panier:
            lignes: list[Ligne] = field(default_factory=list)

            def ajouter(self, ligne: Ligne) -> None:
                self.lignes.append(ligne)

            def sous_total_cents(self) -> int:
                return sum(ligne.total_cents() for ligne in self.lignes)


        def total_ttc(panier: Panier) -> int:
            """Total TTC en centimes, arrondi au centime le plus proche (moitié vers le haut)."""
            ht = Decimal(panier.sous_total_cents())
            ttc = ht * (Decimal(1) + TVA)
            return int(ttc.quantize(Decimal("1"), rounding=ROUND_HALF_UP))
      tests/test_arrondi.py: |
        """Régression : un demi-centime s'arrondit vers le haut."""

        from __future__ import annotations

        import sys
        from pathlib import Path

        sys.path.insert(0, str(Path(__file__).resolve().parents[1] / "src"))

        from panier import Ligne, Panier, total_ttc  # noqa: E402


        def test_fraction_arrondie_vers_le_haut() -> None:
            panier = Panier()
            panier.ajouter(Ligne("bonbon", 3))  # 3 × 1,20 = 3,6 → 4, pas 3
            assert total_ttc(panier) == 4


        def test_fraction_arrondie_vers_le_bas() -> None:
            panier = Panier()
            panier.ajouter(Ligne("bonbon", 2))  # 2 × 1,20 = 2,4 → 2
            assert total_ttc(panier) == 2
