role: review
description: The review playbook must produce a structured verdict and located remarks.
must_contain:
  - "Security"
  - "Performance"
  - "verdict"
  - "file:line"
must_not_contain:
  - "congratulate"
rubric:
  - criterion: "classifies remarks by severity"
    weight: 2
  - criterion: "asks for located remarks (file, line)"
    weight: 2
min_score: 0.8
