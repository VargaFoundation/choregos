openapi: 3.1.0
info:
  title: Choregos API
  version: 0.21.0
  description: |
    The Choregos platform API. The console and the CLI use this API and nothing else.
    Auth: an OIDC session (cookie) or `Authorization: Bearer <api_token>`.
    The `/internal/runs/*` routes are reserved for runners and authenticated by a run JWT (ES256); the
    `/internal/orgs/*` routes are reserved for the outbound-proxy relay and authenticated by a relay JWT (ADR 0091).
    Errors: RFC 9457 (`application/problem+json`). Cursor pagination (`cursor`, `limit`).
  license: { name: Apache-2.0, url: https://www.apache.org/licenses/LICENSE-2.0 }
servers:
  - url: /api/v1
    description: API base
security:
  - session: []
  - bearer: []
tags:
  - { name: session }
  - { name: projects }
  - { name: connectors }
  - { name: workflows }
  - { name: models }
  - { name: work-items }
  - { name: runs }
  - { name: trains }
  - { name: findings }
  - { name: memory }
  - { name: costs }
  - { name: templates }
  - { name: admin }
  - { name: agents }
  - { name: knowledge }
  - { name: ui }
  - { name: webhooks }
  - { name: internal }
paths:
  /me:
    get:
      tags: [session]
      operationId: getMe
      summary: The current user, their organisations and roles
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/tokens:
    get:
      tags: [session]
      operationId: listMyTokens
      summary: The caller's API tokens (never their value)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ApiToken" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [session]
      operationId: createMyToken
      summary: Issue a bearer token; its plaintext is returned only once
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ApiTokenCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ApiTokenCreated" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /me/tokens/{id}:
    delete:
      tags: [session]
      operationId: revokeMyToken
      summary: Revoke one of the caller's tokens
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /auth/login:
    get:
      tags: [session]
      operationId: authLogin
      security: []
      summary: Redirect to the OIDC IdP
      parameters:
        - { name: redirect_to, in: query, schema: { type: string } }
      responses:
        "307": { description: Redirect to the IdP }
  /auth/callback:
    get:
      tags: [session]
      operationId: authCallback
      security: []
      summary: OIDC callback (code → session)
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        "307": { description: Redirect to the application }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/logout:
    post:
      tags: [session]
      operationId: authLogout
      responses: { "204": { description: Session closed } }
  /orgs:
    get:
      tags: [projects]
      operationId: listOrgs
      summary: The caller's organisations, with their role
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Org" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [projects]
      operationId: createOrg
      summary: Create an organisation; the caller becomes its administrator
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OrgCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Org" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /orgs/{org}:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    patch:
      tags: [projects]
      operationId: updateOrg
      summary: Rename an organisation — its name by its administrator, its slug by the platform administrator
      description: >-
        A new slug leaves the old one as an alias (`Org.aliases`): old URLs, MCP and A2A addresses,
        qualified ids and IdP group names keep resolving to the organisation (ADR 0090). 409 when the
        slug is another organisation's slug or alias.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OrgUpdate" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Org" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/aliases/{alias}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: alias, in: path, required: true, schema: { type: string } }
    delete:
      tags: [projects]
      operationId: releaseOrgAlias
      summary: Release a former slug of an organisation, so another organisation may take it (platform administrator)
      description: Old addresses and IdP group names that name the alias stop resolving. Audited as `org.alias.release`.
      responses:
        "204": { description: Released }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /orgs/{org}/projects:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [projects]
      operationId: listProjects
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectPage" } } } }
    post:
      tags: [projects]
      operationId: createProject
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /projects/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [projects]
      operationId: getProject
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [projects]
      operationId: updateProject
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectUpdate" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "409": { description: "`code` is `stale_base`: `base_revision` is no longer the project's `config_revision`, nothing was written, and the problem carries `latest_revision`", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [projects]
      operationId: deleteProject
      responses: { "204": { description: Archived }, "409": { $ref: "#/components/responses/Conflict" } }
  /projects/{id}/provision:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [projects]
      operationId: provisionProject
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/ProvisionRequest" } } }
      responses:
        "202": { description: Provisioning started, content: { application/json: { schema: { $ref: "#/components/schemas/ProvisionStatus" } } } }
    get:
      tags: [projects]
      operationId: getProvisionStatus
      summary: Provisioning status (SSE when Accept is text/event-stream)
      responses:
        "200":
          description: OK
          content:
            application/json: { schema: { $ref: "#/components/schemas/ProvisionStatus" } }
            text/event-stream: { schema: { type: string } }
  /projects/{id}/suspend:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [projects]
      operationId: suspendProject
      responses: { "200": { description: Suspended, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } } }
  /projects/{id}/readiness:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [projects]
      operationId: getProjectReadiness
      description: |
        What the project still lacks to run, computed by the API from stored state (provisioning, workflow,
        each required capability, secrets, the GitHub installation, repository and measured checks, backend,
        model profiles, budgets, people and human groups, notifications, a first request), each item saying who
        can fix it. It reads the last connector tests and makes no network call, so a read is fast. The settings
        page, the overview, the CLI and the MCP door all show this one list. Needs `project:read`.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectReadiness" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/connectors:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [connectors]
      operationId: listConnectors
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Connector" } } } } }
  /projects/{id}/connectors/{kind}:
    parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/ConnectorKind" }]
    put:
      tags: [connectors]
      operationId: putConnector
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ConnectorUpsert" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Connector" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /projects/{id}/connectors/{kind}/secrets/{field}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { $ref: "#/components/parameters/ConnectorKind" }
      - { name: field, in: path, required: true, description: "a secret field of the type, or a slot of a field the type pools (`api_key.2` … `api_key.10`, ADR 0089)", schema: { type: string, pattern: "^[a-z][a-z0-9_]{0,63}(\\.([2-9]|10))?$" } }
    put:
      tags: [connectors]
      operationId: setConnectorSecret
      description: Type a secret once, or replace it. Sealed in the database (AES-256-GCM envelope, key from the deployment) and never returned; the connector keeps a derived `store:` reference. Needs `connector:write`. 409 when the deployment has no secrets key (ADR 0058).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SecretValue" } } }
      responses:
        "200": { description: Set; the connector with its secret states, content: { application/json: { schema: { $ref: "#/components/schemas/Connector" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [connectors]
      operationId: clearConnectorSecret
      description: Remove the secret field's value or reference from the connector; a sealed value is deleted.
      responses:
        "200": { description: Cleared, content: { application/json: { schema: { $ref: "#/components/schemas/Connector" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/connectors/{kind}/test:
    parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/ConnectorKind" }]
    post:
      tags: [connectors]
      operationId: testConnector
      responses:
        "200": { description: Test result, content: { application/json: { schema: { $ref: "#/components/schemas/ConnectorTestResult" } } } }
  /connectors/types:
    get:
      tags: [connectors]
      operationId: listConnectorTypes
      description: The types the registry knows — the core's and the plugins' — with their capabilities, their configuration schema and their secret fields (ADR 0034).
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ConnectorType" } } } } }
  /projects/{id}/requirements:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [connectors]
      operationId: listProjectRequirements
      description: What the project's active workflows require of its connectors, and why; the connector that covers each capability, otherwise the platform's default type (ADR 0034).
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProjectRequirement" } } } } }
  /orgs/{org}/github:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [connectors]
      operationId: getGitHubAppStatus
      description: |
        The Choregos GitHub App as this organisation sees it (ADR 0073): whether the deployment has an App,
        the link that installs it, and the installations this organisation has claimed. An installation
        another organisation claimed is never listed. Nobody types an installation id: it is discovered.
        Needs `connector:write` on a project of the organisation, or the organisation's administrator.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/GitHubAppStatus" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /orgs/{org}/github/refresh:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    post:
      tags: [connectors]
      operationId: refreshGitHubInstallations
      description: Resync the App's installations from GitHub (`GET /app/installations`), then answer the status. Same permission as the status.
      responses:
        "200": { description: Resynced, content: { application/json: { schema: { $ref: "#/components/schemas/GitHubAppStatus" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { description: "GitHub did not answer, or refused the App's credentials" }
  /orgs/{org}/github/repositories:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: q, in: query, description: "Substring of the repository's full name", schema: { type: string } }
      - { name: installation, in: query, description: "Restrict to one installation id", schema: { type: integer } }
      - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    get:
      tags: [connectors]
      operationId: listGitHubRepositories
      description: The repositories the organisation's claimed installations can see. It feeds the repository picker of a connector form. Same permission as the status.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/GitHubRepositoryPage" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /orgs/{org}/github/install-link:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    post:
      tags: [connectors]
      operationId: createGitHubInstallLink
      description: |
        The URL that installs the App on a GitHub account. It carries a short-lived signed `state`
        (organisation, project, user, `return_to`) that GitHub hands back to the Setup URL
        (`GET /github/setup`). Same permission as the status. 409 when the deployment has no App.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/GitHubInstallLinkRequest" } } }
      responses:
        "200": { description: The link, content: { application/json: { schema: { $ref: "#/components/schemas/GitHubInstallLink" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /github/setup:
    get:
      tags: [connectors]
      operationId: githubAppSetup
      description: |
        The GitHub App's Setup URL: a browser redirect after an installation. GitHub sends
        `installation_id`, `setup_action`, our `state` and, when the App requests user authorization,
        `code`. The API checks the state (signature, expiry, the session's user), upserts the
        installation, claims it for the organisation in the state (ADR 0073), and redirects to the
        state's `return_to`. Not a JSON endpoint. A browser without a console session is redirected
        to sign in (`/auth/login?redirect_to=` this URL, same query) instead of a 401 (S42-16). Without
        `state` the installation was started on github.com: nothing is claimed, and the browser goes
        to the console (`/?github=installed`), where the next sync discovers it.
      security:
        - session: []
        - {}
      parameters:
        - { name: installation_id, in: query, required: true, schema: { type: integer } }
        - { name: setup_action, in: query, schema: { type: string, enum: [install, update, request] } }
        - { name: state, in: query, description: "absent when the installation was started on github.com rather than from the console", schema: { type: string } }
        - { name: code, in: query, description: "OAuth code, present when the App requests user authorization during installation", schema: { type: string } }
      responses:
        "302": { description: "Redirect to the state's `return_to` (the claim's outcome is carried in the `github` query parameter), to sign-in without a session, or to the console without a state" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/connectors:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [connectors]
      operationId: listOrgConnectors
      description: The organisation's connectors and their operations (ADR 0034); its members can read them.
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/OrgConnector" } } } } }
    post:
      tags: [connectors]
      operationId: createOrgConnector
      description: An instance starts with the operations its type declares — a read allowed, a write subject to approval. The organisation's administrator only.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OrgConnectorCreate" } } }
      responses:
        "201": { description: Declared, content: { application/json: { schema: { $ref: "#/components/schemas/OrgConnector" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/EgressRequired" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/connectors/{name}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [connectors]
      operationId: getOrgConnector
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/OrgConnector" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [connectors]
      operationId: updateOrgConnector
      description: Edit the configuration and the secrets of a declared connector. `secret_refs` and `secret_values` merge into the connector's; the operations are not touched. The organisation's administrator only.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OrgConnectorUpdate" } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/OrgConnector" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/EgressRequired" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [connectors]
      operationId: deleteOrgConnector
      responses:
        "204": { description: "Removed, with its operations" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /orgs/{org}/connectors/{name}/secrets/{field}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: name, in: path, required: true, schema: { type: string } }
      - { name: field, in: path, required: true, description: "a secret field of the type, or a slot of a field the type pools (`api_key.2` … `api_key.10`, ADR 0089)", schema: { type: string, pattern: "^[a-z][a-z0-9_]{0,63}(\\.([2-9]|10))?$" } }
    put:
      tags: [connectors]
      operationId: setOrgConnectorSecret
      description: Type a secret once, or replace it. Sealed (AES-256-GCM envelope, key from the deployment), never returned; the connector keeps a derived `store:` reference. The organisation's administrator only. 409 when the deployment has no secrets key (ADR 0058).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SecretValue" } } }
      responses:
        "200": { description: Set; the connector with its secret states, content: { application/json: { schema: { $ref: "#/components/schemas/OrgConnector" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [connectors]
      operationId: clearOrgConnectorSecret
      description: Remove the secret field's value or reference from the connector; a sealed value is deleted.
      responses:
        "200": { description: Cleared, content: { application/json: { schema: { $ref: "#/components/schemas/OrgConnector" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /orgs/{org}/connectors/{name}/discover:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: name, in: path, required: true, schema: { type: string } }
    post:
      tags: [connectors]
      operationId: discoverConnectorOperations
      description: Ask the MCP server for its tools and derive the diff — a new tool starts closed (forbidden), a drifting schema closes the operation again, a removed tool disappears (ADR 0034).
      responses:
        "200": { description: The diff, content: { application/json: { schema: { $ref: "#/components/schemas/ConnectorDiscovery" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502": { description: "The server did not answer, or refused the connector's key" }
  /orgs/{org}/mcp-catalogue:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [connectors]
      operationId: listMcpCatalogue
      description: The catalogue of well-known MCP servers shipped with the platform (ADR 0065) and, for each, what it means in this organisation — available, installed (the connectors that carry it) or updatable. Listing enables nothing. Any member of the organisation can read it (an organisation role or only a project role); each entry says what the caller may do (ADR 0074).
      parameters:
        - { name: q, in: query, required: false, schema: { type: string }, description: "free text over the id, the title, the publisher and the description" }
        - { name: category, in: query, required: false, schema: { type: string } }
        - { name: install, in: query, required: false, schema: { type: string, enum: [installable, needs_oauth, needs_hosting] } }
        - { name: official, in: query, required: false, schema: { type: boolean }, description: "only the entries the vendor itself publishes" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/McpCatalogue" } } } }
  /orgs/{org}/mcp-catalogue/{entry_id}/install:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: entry_id, in: path, required: true, schema: { type: string } }
    post:
      tags: [connectors]
      operationId: installMcpCatalogueEntry
      description: Declares an `mcp` connector from the entry — an ordinary org connector, its tools born closed, its secret given by reference. Refused with 422 for an entry that needs OAuth or hosting. The organisation's administrator only.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/McpCatalogueInstall" } } }
      responses:
        "201": { description: Declared, content: { application/json: { schema: { $ref: "#/components/schemas/OrgConnector" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/EgressRequired" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/connector-catalogue:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [connectors]
      operationId: listConnectorCatalogue
      description: The connector types the platform knows (the adapter registry, platform plumbing and test fakes left out), by family, with where each is installed or configured in this organisation and what the caller may do with it (ADR 0074). Any member of the organisation can read it; it holds no secret.
      parameters:
        - { name: q, in: query, required: false, schema: { type: string }, description: "free text over the kind, the type, the display name and the family" }
        - { name: family, in: query, required: false, schema: { type: string } }
        - { name: scope, in: query, required: false, schema: { type: string, enum: [organisation, project] } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ConnectorCatalogue" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /projects/{id}/org-connectors:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [connectors]
      operationId: listProjectOrgConnectors
      description: The organisation's connectors and whether each is on for this project, with what the caller may switch (ADR 0074). The project's members can read it.
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProjectOrgConnector" } } } } }
  /projects/{id}/org-connectors/{connector}/enablement:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: connector, in: path, required: true, schema: { type: string } }
    put:
      tags: [connectors]
      operationId: enableOrgConnector
      description: Turns an organisation connector on for this project (idempotent). Only for a connector whose availability is `selected_projects` (409 otherwise). The project's owner or the organisation's administrator (ADR 0074).
      responses:
        "200": { description: On, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectOrgConnector" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [connectors]
      operationId: disableOrgConnector
      description: Turns it off for this project; turning off one that is not on changes nothing (204). 409 when the connector is available to every project.
      responses:
        "204": { description: Off }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /orgs/{org}/connectors/{name}/operations/{operation}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: name, in: path, required: true, schema: { type: string } }
      - { name: operation, in: path, required: true, schema: { type: string } }
    patch:
      tags: [connectors]
      operationId: updateConnectorOperation
      description: An operation's policy, project groups and price — the decision of the organisation's administrator (the second lock of ADR 0014).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OperationPatch" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ConnectorOperation" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/operations:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [connectors]
      operationId: listProjectOperations
      description: The operations open to the project (their groups intersect its own), with the organisation's policy, the project's and the effective one.
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProjectOperation" } } } } }
  /projects/{id}/operations/{connector}/{operation}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: connector, in: path, required: true, schema: { type: string } }
      - { name: operation, in: path, required: true, schema: { type: string } }
    put:
      tags: [connectors]
      operationId: tightenProjectOperation
      description: A project tightens an operation; it never widens it (422).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectOperationPut" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectOperation" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [connectors]
      operationId: relaxProjectOperation
      description: Remove what the project tightened; the operation falls back to the organisation's policy.
      responses:
        "204": { description: Removed }
  /projects/{id}/actions:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [actions]
      operationId: listActions
      parameters:
        - { name: status, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: The project's actions and the log of their effects, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Action" } } } } }
    post:
      tags: [actions]
      operationId: proposeAction
      description: A governed action awaiting a decision (ADR 0035). Its effects must be declared (`declarer_un_effet`); nothing runs before the approval.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ActionCreate" } } }
      responses:
        "201": { description: Proposed, content: { application/json: { schema: { $ref: "#/components/schemas/Action" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/actions:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [actions]
      operationId: listOrgActions
      description: The decision inbox — the actions of the organisation's projects that the caller can see; `status=pending_approval` for what is waiting for someone.
      parameters:
        - { name: status, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Action" } } } } }
  /projects/{id}/actions/{action_id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: action_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [actions]
      operationId: getAction
      responses:
        "200": { description: The action and its log, content: { application/json: { schema: { $ref: "#/components/schemas/Action" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/actions/{action_id}/decision:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: action_id, in: path, required: true, schema: { type: string } }
    post:
      tags: [actions]
      operationId: decideAction
      description: Approve (a recent human session — 401 `step_up_required` otherwise) or reject (with a reason). Whoever proposes does not decide; of two simultaneous approvals only one starts `action-<id>` in Temporal, and nothing runs within this request.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ActionDecision" } } }
      responses:
        "200": { description: Decided, content: { application/json: { schema: { $ref: "#/components/schemas/Action" } } } }
        "401": { description: "Authentication too old: `errors[0].error` is `step_up_required`" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /projects/{id}/workflow:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [workflows]
      operationId: getWorkflow
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowDef" } } } }
    put:
      tags: [workflows]
      operationId: putWorkflow
      description: "A workflow that names a personal agent or another project's agent is refused with 422 naming the agent, its scope and the fix (ADR 0061)."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowPut" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowDef" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /projects/{id}/workflows:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [workflows]
      operationId: listWorkflows
      summary: The project's workflows — one active per name, the default one marked (ADR 0031)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/WorkflowSummary" } } } } }
  /projects/{id}/workflows/{name}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [workflows]
      operationId: getNamedWorkflow
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowDef" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [workflows]
      operationId: putNamedWorkflow
      description: "A workflow that names a personal agent or another project's agent is refused with 422 (ADR 0061)."
      summary: Publish the next version of THIS workflow; a stale `base_version`, or `create_only` on an existing name → 409
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowPut" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowDef" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /projects/{id}/workflows/{name}/deactivate:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: name, in: path, required: true, schema: { type: string } }
    post:
      tags: [workflows]
      operationId: deactivateWorkflow
      summary: Deactivate a workflow; refused for the default one or a routing target. Pinned tickets finish on their version
      responses:
        "204": { description: Deactivated }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{id}/workflows/{name}/activity:
    parameters: [{ $ref: "#/components/parameters/Id" }, { name: name, in: path, required: true, schema: { type: string } }]
    get:
      tags: [workflows]
      operationId: getWorkflowActivity
      description: >-
        Where a workflow's open work items wait, by state, and what each transition's runs did over the
        last `days` days (count, outcome, cost, median duration). Every version of the workflow counts.
        Read only (S47-39).
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 365, default: 30 } }
      responses:
        "200": { description: The workflow's activity, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowActivity" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/workflows/{name}/versions:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [workflows]
      operationId: listWorkflowVersions
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/WorkflowDef" } } } } }
  /projects/{id}/workflows/{name}/versions/{version}/restore:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: name, in: path, required: true, schema: { type: string } }
      - { name: version, in: path, required: true, schema: { type: integer } }
    post:
      tags: [workflows]
      operationId: restoreWorkflowVersion
      summary: Republish an old version as the next one — nothing is overwritten
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowDef" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/workflow-routing:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [workflows]
      operationId: getWorkflowRouting
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowRouting" } } } }
    put:
      tags: [workflows]
      operationId: putWorkflowRouting
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowRouting" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowRouting" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /workflows/validate:
    post:
      tags: [workflows]
      operationId: validateWorkflow
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowValidateRequest" } } }
      responses:
        "200": { description: Validation report, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowValidation" } } } }
  /projects/{id}/workflows/validate:
    post:
      tags: [workflows]
      operationId: validateProjectWorkflow
      description: >-
        The same validation, in the context of a project: it also warns (`actor.group_unknown`) about a
        human actor whose group nobody in the project's organisation carries.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowValidateRequest" } } }
      responses:
        "200": { description: Validation report, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowValidation" } } } }
  /workflows/edit:
    post:
      tags: [workflows]
      operationId: editWorkflow
      description: >-
        Apply typed operations to a workflow YAML, grafted into the text: the rest of the document,
        comments and style included, does not move. Nothing is saved; `inverse` undoes the
        operations, in the order in which to apply it (ADR 0031).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowEditRequest" } } }
      responses:
        "200": { description: "The edited text, validated, and its inverse", content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowEditResult" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /ui/admin-sections:
    get:
      tags: [ui]
      operationId: listAdminSections
      description: >-
        The administration sections the plugins declare (ADR 0032), filtered by the caller's
        permission and scope; `org` restricts the organisation sections to that one.
      parameters:
        - { name: org, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: The visible sections, content: { application/json: { schema: { type: array, items: { $ref: "./schemas/ui-manifest.schema.json" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /workflows/templates:
    get:
      tags: [workflows]
      operationId: listWorkflowTemplates
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/WorkflowTemplate" } } } } }
  /projects/{id}/policy:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [workflows]
      operationId: getPolicy
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PolicyDef" } } } }
    put:
      tags: [workflows]
      operationId: putPolicy
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PolicyPut" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PolicyDef" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /projects/{id}/network:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [workflows]
      operationId: getProjectNetwork
      description: >-
        What the project's runs may reach (ADR 0070): the project's own `sandbox.network`, the organisation's network
        ceiling, and the effective allow and deny lists (the repository host is implied) after the ceiling is applied.
        `clamps` lists what the ceiling brought down.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectNetwork" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /platform/models:
    get:
      tags: [models]
      operationId: listPlatformModels
      deprecated: true
      description: The deployment gateway's models, unfiltered. Use `GET /orgs/{org}/models/usable`.
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/GatewayModel" } } } } }
  /orgs/{org}/models:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [models]
      operationId: getModelCatalogue
      description: >-
        The organisation's model catalogue (ADR 0060): its mode, the gateway that backs it and what
        that gateway can do, the model behind each tier, and the entries. Every member may read it.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ModelCatalogue" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [models]
      operationId: addModelCatalogueEntry
      description: Add a model the gateway routes but does not list; `model:catalogue:manage` (org_admin).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ModelCatalogueEntryCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ModelCatalogueEntry" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /orgs/{org}/models/settings:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    put:
      tags: [models]
      operationId: putModelCatalogueSettings
      description: Set the mode (`open` or `curated`) and the model behind each tier; `model:catalogue:manage`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ModelCatalogueSettings" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ModelCatalogueSettings" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/models/sync:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    post:
      tags: [models]
      operationId: syncModelCatalogue
      description: >-
        Read the gateway's models into the catalogue. A new model arrives enabled in `open` mode and
        disabled in `curated` mode; a model the gateway no longer lists is marked, never deleted.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ModelSyncResult" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /orgs/{org}/models/curate-preview:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [models]
      operationId: previewModelCuration
      description: What switching to `curated` would refuse today (agents and project profiles naming a model that is not enabled).
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ModelCuratePreview" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /orgs/{org}/models/usable:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [models]
      operationId: listUsableModels
      description: The models an agent may be given for a stage role and a usage; every member may read it.
      parameters:
        - { name: role, in: query, required: false, schema: { type: string } }
        - { name: usage, in: query, required: false, schema: { type: string, enum: [agent, embed, distill, eval], default: agent } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/UsableModel" } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /orgs/{org}/models/{entry_id}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: entry_id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [models]
      operationId: updateModelCatalogueEntry
      description: Enable or disable a model, set its roles, usages, name, notes, price override or the most a voice session of it may spend per minute; `model:catalogue:manage`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ModelCataloguePatch" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ModelCatalogueEntry" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [models]
      operationId: deleteModelCatalogueEntry
      description: Delete a manual entry. An entry the gateway lists is disabled, not deleted (409).
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{id}/models:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [models]
      operationId: getProjectModels
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectModels" } } } }
    put:
      tags: [models]
      operationId: putProjectModels
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectModels" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectModels" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /projects/{id}/models/matrix:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [models]
      operationId: getModelMatrix
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ModelMatrix" } } } }
  /projects/{id}/work-items:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [work-items]
      operationId: listWorkItems
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: state, in: query, schema: { type: string } }
        - { name: size, in: query, schema: { type: string, enum: [S, M, L, XL] } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WorkItemPage" } } } }
    post:
      tags: [work-items]
      operationId: createWorkItem
      summary: File a work item, in Choregos and in the project's tracker when it is external
      description: >-
        With an internal tracker (or none) the platform mints the key. With an external tracker
        (GitHub, Jira, GitLab) it first creates the issue there, labelled `source:choregos` plus the
        request's labels and never `agent-ready`, and records the work item under the issue's key.
        Fields, workflow and budget are validated before the issue is created, so a 422 leaves
        nothing behind. If the tracker refuses or does not answer, nothing is created (502).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkItemCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/WorkItem" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { description: Unknown workflow, invalid fields or a budget wider than allowed }
        "502": { description: The project's tracker refused or did not answer; nothing was created }
  /work-items/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [work-items]
      operationId: getWorkItem
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WorkItem" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [work-items]
      operationId: updateWorkItem
      summary: Change a ticket's fields
      description: >-
        The given fields replace the ticket's own, `null` removes one; the whole is validated by the
        pinned workflow's `metadata.inputs`. The interpreter is told (`fields_changed`): a moved
        start date re-arms the action waiting for it (S20-05).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkItemUpdate" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WorkItem" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /work-items/{id}/timeline:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [work-items]
      operationId: getWorkItemTimeline
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TimelineEntry" } } } } }
  /work-items/{id}/hand-offs:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [work-items]
      operationId: getWorkItemHandOffs
      description: >-
        The hand-off receipts of a work item (S25-04), output by output: every run that produced it
        and every run that read it, under the SHA-256 digest of the revision it produced or read, and
        the digest of what the output is worth today — an output modified after it was produced no
        longer has the digest of its last receipt.
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/HandOff" } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /work-items/{id}/artifacts:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [work-items]
      operationId: listWorkItemArtifacts
      description: >-
        Every revision of every artifact of the work item (ADR 0049), by name then version: its type,
        media type, size, sha256 digest and the run that produced it.
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Artifact" } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /work-items/{id}/artifacts/{ref}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: ref, in: path, required: true, description: "`name` for the latest revision, `name@version` for a given one", schema: { type: string } }
    get:
      tags: [work-items]
      operationId: getWorkItemArtifact
      description: One revision of an artifact, without its content.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Artifact" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /work-items/{id}/artifacts/{ref}/content:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: ref, in: path, required: true, description: "`name` for the latest revision, `name@version` for a given one", schema: { type: string } }
    get:
      tags: [work-items]
      operationId: getWorkItemArtifactContent
      description: >-
        The bytes of a revision, with its media type, once their sha256 has been checked again. Content
        that no longer matches its digest is refused (409), never served. Served sandboxed (CSP) so an
        HTML or SVG artifact cannot run as the console.
      parameters:
        - { name: download, in: query, description: "attachment rather than inline", schema: { type: boolean, default: false } }
      responses:
        "200":
          description: The content; `X-Choregos-Digest` and `ETag` carry the digest.
          content: { "*/*": { schema: { type: string, format: binary } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /work-items/{id}/journey:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [work-items]
      operationId: getWorkItemJourney
      description: >-
        The work item's path through its workflow, in one read: the map of the version it is pinned
        to, every move from state to state with the transition that carried it, and every step an
        actor took — agent runs, human requests, governed actions. The console animates it.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WorkItemJourney" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /work-items/{id}/decisions:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [work-items]
      operationId: postDecision
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DecisionRequest" } } }
      responses:
        "202": { description: Decision passed on to the workflow, content: { application/json: { schema: { $ref: "#/components/schemas/HumanRequest" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /work-items/{id}/actions:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [work-items]
      operationId: postWorkItemAction
      description: >-
        `migrate` requires `workflow_def_id`, a definition of the project; the ticket's current
        state must exist in it, or be mapped by `state_mapping` — otherwise 422, and nothing is
        passed on.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkItemAction" } } }
      responses:
        "202": { description: Action passed on }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /work-items/{id}/runs:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [runs]
      operationId: listRuns
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Run" } } } } }
  /runs/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [runs]
      operationId: getRun
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /runs/{id}/events:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [runs]
      operationId: getRunEvents
      summary: The run's ACP log (SSE when Accept is text/event-stream)
      parameters:
        - { name: after_seq, in: query, schema: { type: integer } }
        - { name: Last-Event-ID, in: header, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json: { schema: { type: array, items: { $ref: "#/components/schemas/RunEvent" } } }
            text/event-stream: { schema: { type: string } }
  /runs/{id}/access:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [runs]
      operationId: getRunAccess
      summary: What the agent touched — files, commands, network, tools — and the denials.
      responses:
        "200":
          description: The run's access report
          content:
            application/json:
              schema:
                type: object
                required: [evenements, refusals, acces]
                properties:
                  evenements: { type: integer, description: Log events scanned }
                  deduites:
                    type: integer
                    description: >-
                      Permission decisions whose kind was inferred because the agent did not state it
                      (emitted since #27, declared by S34-03)
                  refusals: { type: integer, description: Total number of denied requests }
                  refus:
                    type: integer
                    deprecated: true
                    description: Former name of `refusals`, still emitted for one release (ADR 0046)
                  tool_cost_eur: { type: number, description: "What the catalogue tools called by the run cost, in euros" }
                  cout_outils_eur:
                    type: number
                    deprecated: true
                    description: Former name of `tool_cost_eur`, still emitted for one release (ADR 0046)
                  chain:
                    type: object
                    description: >-
                      Who started the work item and which earlier runs produced what this run read
                      (ADR 0077 §2). Recorded at stage start by the orchestrator, never sent by the
                      agent. Absent for a run started before it was recorded.
                    required: [initiated_by, runs]
                    properties:
                      initiated_by:
                        type: [string, "null"]
                        description: >-
                          `<kind>:<subject>` — `person:<email>`, `mcp:<email>`, `a2a:<client>`,
                          `schedule:<name>`, `work_item:<key>`, `tracker:<kind>`, `finding:<id>`, `eval`,
                          `demo`, `trial:<email>`; null when the work item predates the record
                      runs:
                        type: array
                        description: The runs of the chain, earliest first; the last one is this run
                        items:
                          type: object
                          required: [run_id, stage, inputs_from]
                          properties:
                            run_id: { type: string }
                            stage: { type: [string, "null"] }
                            agent_slug: { type: [string, "null"] }
                            agent_version: { type: [integer, "null"] }
                            inputs_from:
                              type: array
                              items: { type: string }
                              description: The run ids whose outputs this run read as declared inputs
                  acces:
                    type: array
                    items:
                      type: object
                      required: [nature, target, requests, refusals]
                      properties:
                        nature: { type: string, enum: [read, write, execute, network, tool, autre] }
                        target: { type: string, description: "The file, command, address or tool asked for" }
                        cible:
                          type: string
                          deprecated: true
                          description: Former name of `target`, still emitted for one release (ADR 0046)
                        requests: { type: integer, description: How many times the agent asked for it }
                        demandes:
                          type: integer
                          deprecated: true
                          description: Former name of `requests`, still emitted for one release (ADR 0046)
                        refusals: { type: integer, description: How many of those requests were denied }
                        refus:
                          type: integer
                          deprecated: true
                          description: Former name of `refusals`, still emitted for one release (ADR 0046)
                        motifs: { type: array, items: { type: string } }
  /runs/{id}/transcript:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [runs]
      operationId: getRunTranscript
      responses:
        "200": { description: Signed URL or JSONL content, content: { application/json: { schema: { $ref: "#/components/schemas/ArtifactRef" } } } }
  /runs/{id}/logs:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [runs]
      operationId: getRunLogs
      summary: The runner pod's log tail and how the pod ended, redacted — live while it runs, archived after
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RunLogs" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /runs/{id}/diff:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [runs]
      operationId: getRunDiff
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DiffSummary" } } } }
  /projects/{id}/releases:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [trains]
      operationId: listReleases
      parameters:
        - { name: env, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ReleasePage" } } } }
  /releases/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [trains]
      operationId: getRelease
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Release" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/trains/{env}:
    parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/Env" }]
    get:
      tags: [trains]
      operationId: getTrainStatus
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TrainStatus" } } } }
  /projects/{id}/trains/{env}/depart:
    parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/Env" }]
    post:
      tags: [trains]
      operationId: departTrain
      responses: { "202": { description: Departure requested }, "409": { $ref: "#/components/responses/Conflict" } }
  /projects/{id}/trains/{env}/freeze:
    parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/Env" }]
    post:
      tags: [trains]
      operationId: freezeTrain
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 3 } } } } }
      responses: { "202": { description: Freeze requested } }
  /projects/{id}/trains/{env}/unfreeze:
    parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/Env" }]
    post:
      tags: [trains]
      operationId: unfreezeTrain
      responses: { "202": { description: Unfreeze requested } }
  /releases/{id}/approve:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [trains]
      operationId: approveRelease
      requestBody:
        content: { application/json: { schema: { type: object, properties: { note: { type: string } } } } }
      responses: { "202": { description: Approval passed on }, "403": { $ref: "#/components/responses/Forbidden" } }
  /releases/{id}/abort:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [trains]
      operationId: abortRelease
      requestBody:
        content: { application/json: { schema: { type: object, properties: { reason: { type: string } } } } }
      responses: { "202": { description: Abort passed on } }
  /projects/{id}/findings:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [findings]
      operationId: listFindings
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, created, duplicate, dismissed] } }
        - { name: severity, in: query, schema: { type: string, enum: [low, medium, high, critical] } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/FindingPage" } } } }
  /findings/{id}/actions:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [findings]
      operationId: postFindingAction
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FindingAction" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/FindingRecord" } } } }
  /projects/{id}/memory/search:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [memory]
      operationId: searchMemory
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: k, in: query, schema: { type: integer, default: 10, maximum: 100 } }
        - { name: kinds, in: query, schema: { type: array, items: { type: string } }, style: form, explode: false }
        - { name: memory, in: query, schema: { type: string }, description: "which memory of the project (S40-11): `shared` (the default), `own` with `agent`, or a named memory of the project" }
        - { name: agent, in: query, schema: { type: string }, description: "with `memory=own`: whose own memory" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Memory" } } } } }
  /projects/{id}/memory/pending:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [memory]
      operationId: listPendingMemory
      parameters:
        - { name: memory, in: query, schema: { type: string }, description: "which memory of the project (S40-11): `shared` (the default), `own` with `agent`, or a named memory of the project" }
        - { name: agent, in: query, schema: { type: string }, description: "with `memory=own`: whose own memory" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Memory" } } } } }
    post:
      tags: [memory]
      operationId: decidePendingMemory
      parameters:
        - { name: memory, in: query, schema: { type: string }, description: "which memory of the project (S40-11): `shared` (the default), `own` with `agent`, or a named memory of the project" }
        - { name: agent, in: query, schema: { type: string }, description: "with `memory=own`: whose own memory" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MemoryDecision" } } }
      responses: { "200": { description: OK } }
  /projects/{id}/memory/reimport:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [memory]
      operationId: reimportMemory
      requestBody:
        content: { application/json: { schema: { type: object, properties: { sources: { type: array, items: { type: string } } } } } }
      responses: { "202": { description: Import scheduled } }
  /orgs/{org}/memory/ab-report:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [memory]
      operationId: getMemoryAbReport
      summary: Projects with and without memory, compared on first pass and cost
      parameters:
        - { name: weeks, in: query, schema: { type: integer, minimum: 1, maximum: 52, default: 4 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MemoryAbReport" } } } }
  /orgs/{org}/memories:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [memory]
      operationId: listMemories
      description: "The named memories the caller sees (S40-11, ADR 0075): global ones with their reach, project ones of their projects. `used_by` lists the agents whose latest version binds each."
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [global, project] } }
        - { name: project, in: query, schema: { type: string }, description: only the memories of this project (a project memory) or reaching it }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/MemoryStore" } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [memory]
      operationId: createGlobalMemory
      description: A global memory, curated by an organisation administrator (`agent:manage`), with a reach. `shared` and `own` are reserved.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MemoryStoreCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/MemoryStore" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/memories/{slug}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      tags: [memory]
      operationId: getMemory
      description: A global memory. One the caller may not see is 404.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MemoryStore" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [memory]
      operationId: updateMemory
      description: Renames it, changes its reach, archives it. `agent:manage`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MemoryStorePatch" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MemoryStore" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/memories/{slug}/search:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      tags: [memory]
      operationId: searchGlobalMemory
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: k, in: query, schema: { type: integer, default: 10, maximum: 100 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Memory" } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /orgs/{org}/memories/{slug}/pending:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      tags: [memory]
      operationId: listGlobalPendingMemory
      description: What agents proposed to this global memory, waiting for an administrator (`agent:manage`). A global memory only ever receives proposals.
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Memory" } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [memory]
      operationId: decideGlobalPendingMemory
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MemoryDecision" } } }
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/memories:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [memory]
      operationId: listProjectMemories
      description: "What a run of this project may bind (S40-11): the implicit `shared` and `own` (`implicit: true`), the project's named memories, and the global ones that reach it."
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/MemoryStore" } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [memory]
      operationId: createProjectMemory
      description: A named memory of this project, read by its runs only. `project:write`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectMemoryCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/MemoryStore" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /projects/{id}/memories/{slug}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: slug, in: path, required: true, schema: { type: string } }
    patch:
      tags: [memory]
      operationId: updateProjectMemory
      description: Renames or archives a named memory of this project (`project:write`). It has no reach to change.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MemoryStorePatch" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MemoryStore" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /projects/{id}/costs:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [costs]
      operationId: getProjectCosts
      parameters:
        - { name: group_by, in: query, schema: { type: string, enum: [day, stage, model, backend, size, kind, agent, workflow, work_item, project], default: day } }
        - { name: since, in: query, schema: { type: string, format: date } }
        - { name: until, in: query, schema: { type: string, format: date } }
        - { name: kind, in: query, schema: { type: string, enum: [model, tool, distill] }, description: "only what models cost, only what tools cost (S29-03), or only what knowledge-base distillations cost (S42-10d)" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CostReport" } } } }
  /projects/{id}/costs.csv:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [costs]
      operationId: exportProjectCostsCsv
      summary: The cost report as CSV (`;` separator, UTF-8 BOM)
      parameters:
        - { name: group_by, in: query, schema: { type: string, enum: [day, stage, model, backend, size, kind, agent, workflow, work_item, project], default: day } }
        - { name: since, in: query, schema: { type: string, format: date } }
        - { name: until, in: query, schema: { type: string, format: date } }
        - { name: kind, in: query, schema: { type: string, enum: [model, tool, distill] }, description: "only what models cost, only what tools cost (S29-03), or only what knowledge-base distillations cost (S42-10d)" }
      responses:
        "200": { description: Cost report as CSV, content: { text/csv: { schema: { type: string } } } }
  /projects/{id}/metrics/cross-backend:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [costs]
      operationId: getProjectCrossBackend
      summary: Reviews by another backend versus reviews by the same one
      parameters:
        - { name: since, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CrossBackendReport" } } } }
  /projects/{id}/metrics/dora:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [costs]
      operationId: getProjectDora
      summary: The four DORA metrics, derived from the recorded deployments
      parameters:
        - { name: env, in: query, schema: { type: string, default: prod } }
        - { name: since, in: query, schema: { type: string, format: date } }
        - { name: until, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DoraReport" } } } }
  /orgs/{org}/costs:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [costs]
      operationId: getOrgCosts
      parameters:
        - { name: group_by, in: query, schema: { type: string, enum: [day, stage, model, backend, size, kind, agent, workflow, work_item, project], default: day }, description: "agent, workflow and work_item come from the ledger's own columns (S29-01); a project is named by its slug, a work item by its tracker key" }
        - { name: since, in: query, schema: { type: string, format: date } }
        - { name: until, in: query, schema: { type: string, format: date } }
        - { name: kind, in: query, schema: { type: string, enum: [model, tool, distill] }, description: "only what models cost, only what tools cost (S29-03), or only what knowledge-base distillations cost (S42-10d)" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CostReport" } } } }
  /orgs/{org}/costs.csv:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [costs]
      operationId: exportOrgCostsCsv
      summary: The organisation's cost report as CSV, in any grouping
      parameters:
        - { name: group_by, in: query, schema: { type: string, enum: [day, stage, model, backend, size, kind, agent, workflow, work_item, project], default: day } }
        - { name: since, in: query, schema: { type: string, format: date } }
        - { name: until, in: query, schema: { type: string, format: date } }
        - { name: kind, in: query, schema: { type: string, enum: [model, tool, distill] }, description: "only what models cost, only what tools cost (S29-03), or only what knowledge-base distillations cost (S42-10d)" }
      responses:
        "200": { description: Cost report as CSV, content: { text/csv: { schema: { type: string } } } }
  /orgs/{org}/egress:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [egress]
      operationId: getOrgEgress
      description: The organisation's egress allowlist (S39-22, ADR 0066) — rules live and decided, the requests waiting for a decision — with the deployment's ceiling per pod family and the enforcement mode. Its members can read it.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EgressOverview" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /orgs/{org}/egress/check:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    post:
      tags: [egress]
      operationId: checkOrgEgress
      description: Where each host stands, in this organisation's list and against the deployment's ceiling, with who can allow it and what the platform must still open. The hosts come from `targets`, or are derived by the server from an `origin`, so the console never asks a person for one. Writes nothing.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EgressCheck" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EgressCheckResult" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/egress/rules:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    post:
      tags: [egress]
      operationId: createOrgEgressRule
      description: Open a host to the platform's outbound calls for this organisation. `tools:grant` (the organisation's administrator). Audited (`egress.rule.create`).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EgressRuleCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/EgressRule" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/egress/rules/{rule_id}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: rule_id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [egress]
      operationId: revokeOrgEgressRule
      description: Close an allowed host; the platform's clients refuse it from the next call. `tools:grant`. Audited (`egress.rule.revoke`).
      responses:
        "200": { description: Revoked, content: { application/json: { schema: { $ref: "#/components/schemas/EgressRule" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /orgs/{org}/egress/requests:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    post:
      tags: [egress]
      operationId: requestOrgEgress
      description: A member asks an administrator to open a host. It waits in the inbox of those who can decide; asking again for the same host answers with the request already waiting. At most 20 open requests per person. Audited (`egress.request.create`).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EgressRequestCreate" } } }
      responses:
        "201": { description: Requested, content: { application/json: { schema: { $ref: "#/components/schemas/EgressRule" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { description: Too many requests waiting }
  /orgs/{org}/egress/requests/{rule_id}/approve:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: rule_id, in: path, required: true, schema: { type: string } }
    post:
      tags: [egress]
      operationId: approveOrgEgressRequest
      description: Allow a requested host. `tools:grant`. Audited (`egress.request.approve`).
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/EgressDecision" } } }
      responses:
        "200": { description: Allowed, content: { application/json: { schema: { $ref: "#/components/schemas/EgressRule" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /orgs/{org}/egress/requests/{rule_id}/refuse:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: rule_id, in: path, required: true, schema: { type: string } }
    post:
      tags: [egress]
      operationId: refuseOrgEgressRequest
      description: Refuse a requested host. `tools:grant`. Audited (`egress.request.refuse`).
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/EgressDecision" } } }
      responses:
        "200": { description: Refused, content: { application/json: { schema: { $ref: "#/components/schemas/EgressRule" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /orgs/{org}/budget-alerts:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [costs]
      operationId: listBudgetAlerts
      description: The budgets that crossed a threshold — a project's or an agent's daily budget at 80 % (the policy's `alert_at_ratio`) or 100 % — newest first. One alert per budget, day and threshold; the open ones are the inbox's.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, acknowledged, all], default: open } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/BudgetAlert" } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /orgs/{org}/budget-alerts/{alert_id}/acknowledge:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: alert_id, in: path, required: true, schema: { type: string } }
    post:
      tags: [costs]
      operationId: acknowledgeBudgetAlert
      description: Someone has seen it; it leaves the inbox. `item:decide` (developer and above). Audited.
      responses:
        "200": { description: Acknowledged, content: { application/json: { schema: { $ref: "#/components/schemas/BudgetAlert" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /templates:
    get:
      tags: [templates]
      operationId: listTemplates
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TemplateSummary" } } } } }
    post:
      tags: [templates]
      operationId: createTemplate
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TemplateUpsert" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/TemplateSummary" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /templates/{name}:
    parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
    get:
      tags: [templates]
      operationId: getTemplate
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TemplateDetail" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [templates]
      operationId: updateTemplate
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TemplateUpsert" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TemplateSummary" } } } }
  /platform/secrets/rewrap:
    post:
      tags: [admin]
      operationId: rewrapSecrets
      description: After a key rotation (the new key first in `CHOREGOS_SECRETS_KEKS`), re-wrap the data key of every sealed secret under the active key. The values are never read out nor changed (ADR 0058). The platform administrator only.
      responses:
        "200": { description: Re-wrapped, content: { application/json: { schema: { $ref: "#/components/schemas/SecretsRewrap" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /platform/backends:
    get:
      tags: [admin]
      operationId: listBackends
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AgentBackendInfo" } } } } }
    put:
      tags: [admin]
      operationId: putBackend
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentBackendUpdate" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AgentBackendInfo" } } } }
  /platform/agent-images:
    get:
      tags: [admin]
      operationId: listAgentImages
      summary: The images an operator named for agents written in code (names only, ADR 0063)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AgentImageInfo" } } } } }
  /platform/executors:
    get:
      tags: [admin]
      operationId: listExecutors
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ExecutorInfo" } } } } }
  /platform/identity:
    get:
      tags: [admin]
      operationId: getPlatformIdentity
      summary: How people sign in to this instance (read-only)
      description: The instance-level sign-in configuration, as the deployment set it (OIDC issuer and client, redirect URI, MCP door OAuth, session lifetime, bootstrap). Secrets are never returned, only whether they are set. The platform administrator only.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PlatformIdentity" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /platform/gateway/keys:
    get:
      tags: [admin]
      operationId: listGatewayKeys
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/GatewayKeyInfo" } } } } }
  /orgs/{org}/policy-ceiling:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [projects]
      operationId: getPolicyCeiling
      description: The caps every project policy of the organisation stays under (S27-05).
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PolicyCeilingState" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [projects]
      operationId: putPolicyCeiling
      description: >-
        Sets the ceiling (`org_admin`); `null` removes it. A project policy PUT above it is refused (422, each widened
        field named). A project policy already above it is not refused: the policy that runs is clamped to it, and
        `GET /projects/{id}/policy` lists what was clamped.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PolicyCeilingPut" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PolicyCeilingState" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/outbound-proxy:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [admin]
      operationId: getOutboundProxy
      description: >-
        The organisation's outbound proxy for its web search and web reading traffic (ADR 0087), or `proxy: null`
        when none is set. The password is never returned, only `password_set`. `org_admin`.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/OutboundProxyState" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [admin]
      operationId: putOutboundProxy
      description: >-
        Sets the organisation's one outbound proxy (`org_admin`, audited as `outbound_proxy.update`, the password
        never in the audit row). `password` is sealed (ADR 0058) and never returned; absent, the stored one is kept;
        required on the first write (422 otherwise). 409 when the deployment has no secrets key.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OutboundProxyPut" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/OutboundProxyState" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [admin]
      operationId: deleteOutboundProxy
      description: Removes the setting and its sealed password (`org_admin`, audited as `outbound_proxy.delete`). Idempotent.
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Forbidden" }
  /orgs/{org}/outbound-proxy/test:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    post:
      tags: [admin]
      operationId: testOutboundProxy
      description: >-
        Fetches `https://ipinfo.io/json` through the stored proxy and reports the exit address and country (ADR 0087
        section 4). A proxy that fails is a 200 with `ok: false` and `error`, not an HTTP error. `org_admin`, audited
        as `outbound_proxy.test`. 404 when no proxy is set.
      responses:
        "200": { description: The result of the test, content: { application/json: { schema: { $ref: "#/components/schemas/OutboundProxyTest" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /orgs/{org}/network-activity:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [admin]
      operationId: getNetworkActivity
      description: >-
        Which hosts the organisation's runs reached or were refused (ADR 0070), grouped by host, layer, decision and
        reason. `org_admin` or `audit:read`.
      parameters:
        - { name: since, in: query, schema: { type: string, format: date-time }, description: "defaults to the last 24 hours" }
        - { name: decision, in: query, schema: { type: string, enum: [allowed, denied, rate_limited, unreachable] } }
        - { name: project, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/NetworkActivity" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /orgs/{org}/members:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [admin]
      operationId: listMembers
      description: The organisation's memberships — to its members only; with `project`, that project's memberships, to the project's members (S30-06).
      parameters:
        - { name: project, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Membership" } } } } }
    post:
      tags: [admin]
      operationId: addMember
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MembershipUpsert" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Membership" } } } }
        "422": { description: "`org_admin` is a role of the organisation, not of a project (S30-06)" }
  /orgs/{org}/members/{user_id}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: user_id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [admin]
      operationId: removeMember
      description: >-
        Remove a person's membership of the organisation — or of the single project named by
        `project`. The organisation's last administrator cannot be removed (409).
      parameters:
        - { name: project, in: query, required: false, schema: { type: string } }
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /orgs/{org}/agents:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [agents]
      operationId: listAgents
      description: The agents the caller may see (ADR 0033, ADR 0061) — a personal agent only to its owner and an org_admin, a project's agent to the members of that project.
      parameters:
        - { name: scope, in: query, required: false, schema: { type: string, enum: [platform, org, project, personal] } }
        - { name: project, in: query, required: false, schema: { type: string }, description: "a project's slug: only the agents that project owns" }
        - { name: tag, in: query, required: false, style: form, explode: true, schema: { type: array, items: { type: string } }, description: "repeatable: only the agents carrying every tag given (AND, S40-10); applied after visibility, so a tag never reveals an agent the caller cannot see" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Agent" } } } } }
    post:
      tags: [agents]
      operationId: createAgent
      parameters:
        - { name: allow_egress, in: query, schema: { type: boolean, default: false }, description: "open a remote agent's card host in the organisation's egress allowlist in the same call (S39-22); needs `tools:grant`. Without it a missing host is a 409 `egress_required`" }
      description: "Create an agent and its version 1, in the scope asked (ADR 0061): an `org` agent needs `agent:manage` (org_admin), a `project` agent the project's owner (`agent:project_manage`), a `personal` agent `agent:create_personal` (developer and above). The 403 carries the reason."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Agent" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/EgressRequired" }
  /orgs/{org}/agent-drafts:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    post:
      tags: [agents]
      operationId: draftAgent
      description: >-
        One capped model call (2,500 output tokens, 60 s) proposes an agent from its description (S39-05). The
        instructions are those of the catalogue's `agent-drafter`, or of the organisation's installed version. The
        answer holds only skills, knowledge bases and connectors the organisation has and may use; what was dropped
        or clamped is said in `notes`. Nothing is saved: a person creates the agent from the draft. Ten drafts a
        minute per person. `agent:manage`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentDraftRequest" } } }
      responses:
        "200": { description: The proposal, not saved, content: { application/json: { schema: { $ref: "#/components/schemas/AgentDraft" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { description: More than ten drafts in a minute (`Retry-After`), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "502": { description: The gateway did not answer, or its answer holds no JSON object, or no gateway key is configured }
  /orgs/{org}/agents/discover:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    post:
      tags: [agents]
      operationId: discoverRemoteAgent
      parameters:
        - { name: allow_egress, in: query, schema: { type: boolean, default: false }, description: "open the card's host in the organisation's egress allowlist in the same call (S39-22); needs `tools:grant`. Without it a missing host is a 409 `egress_required`" }
      description: Reads an A2A Agent Card (https only, no redirect to another host) and suggests the registry entry; creates nothing. `agent:manage`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RemoteAgentDiscover" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RemoteAgentDiscovery" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/EgressRequired" }
        "422": { description: The card cannot be used, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /orgs/{org}/remote-credentials:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [agents]
      operationId: listRemoteCredentials
      description: The organisation's credentials for remote agents (ADR 0062). `agent:manage`.
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/RemoteCredential" } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [agents]
      operationId: createRemoteCredential
      description: "OAuth: registers the platform at the card's DCR endpoint (the credential is `pending` until authorised). Bearer: seals the token. `agent:manage`."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RemoteCredentialCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/RemoteCredential" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { description: The card or the request cannot be used, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /orgs/{org}/remote-credentials/{name}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: name, in: path, required: true, schema: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$" } }
    delete:
      tags: [agents]
      operationId: revokeRemoteCredential
      description: Revokes the credential and deletes its sealed values. `agent:manage`.
      responses:
        "204": { description: Revoked }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /orgs/{org}/remote-credentials/{name}/authorize:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: name, in: path, required: true, schema: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$" } }
    post:
      tags: [agents]
      operationId: authorizeRemoteCredential
      description: Starts the OAuth authorization-code flow with PKCE; sets a signed handshake cookie. `agent:manage`.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RemoteCredentialAuthorization" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: Not an OAuth credential, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /remote-credentials/oauth/callback:
    get:
      tags: [agents]
      operationId: remoteCredentialCallback
      summary: The provider's redirect after the administrator authorised the credential
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        "303": { description: Redirect to the administration page }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { description: The provider refused the exchange, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /orgs/{org}/hosted-sources:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    post:
      tags: [agents]
      operationId: uploadHostedSource
      description: "A hosted agent's source zip (ADR 0080 §9), stored under its sha256, which a zip version's `source.sha256` names. Flat (the files at the root, not under one folder), at most 64 MiB and 2,000 files; a symbolic link, an absolute, `\\` or `..` path, an encrypted entry or a name twice refuses it. Asks the right to create an agent somewhere in the organisation; the same bytes twice are one source."
      requestBody:
        required: true
        content: { application/zip: { schema: { type: string, format: binary } } }
      responses:
        "201": { description: Stored, content: { application/json: { schema: { $ref: "#/components/schemas/HostedSource" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502": { description: The object store refused, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /orgs/{org}/hosted-sources/{sha256}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: sha256, in: path, required: true, schema: { type: string, pattern: "^sha256:[0-9a-f]{64}$" } }
    get:
      tags: [agents]
      operationId: getHostedSource
      description: An uploaded source, read back from the object store and checked again.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/HostedSource" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /orgs/{org}/agents/{slug}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      tags: [agents]
      operationId: getAgent
      responses:
        "200": { description: The agent and its versions, content: { application/json: { schema: { $ref: "#/components/schemas/Agent" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [agents]
      operationId: updateAgent
      description: Name, description, expiry, status; `revoked` is final.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentPatch" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Agent" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /orgs/{org}/agents/{slug}/responses:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
    post:
      tags: [agents]
      operationId: createAgentResponse
      description: "One turn of a direct conversation with a prompt agent (ADR 0080 §10), in the Responses API's shape: a new session without `session_id`, its next turn with it. Needs `item.control` in the project. With `stream`, server-sent events `response.created`, `response.output_text.delta`, `response.completed` or `response.failed`."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentResponseCreate" } } }
      responses:
        "200":
          description: The response; `status` is `failed` with an `error` when the model or the budget stopped it
          content:
            application/json: { schema: { $ref: "#/components/schemas/AgentResponse" } }
            text/event-stream: { schema: { type: string } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/agent-sessions/{session_id}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: session_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [agents]
      operationId: getAgentSession
      description: "A session and its transcript (text only, never audio). Only its opener sees it."
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AgentSession" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [agents]
      operationId: closeAgentSession
      description: "Closes the session: its spend is booked, its gateway key revoked. Idempotent."
      responses:
        "204": { description: Closed }
        "404": { $ref: "#/components/responses/NotFound" }
  /orgs/{org}/agents/{slug}/metrics:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      tags: [agents]
      operationId: getAgentMetrics
      description: The agent's runs over the period, their outcome and their cost — models and tools — by project; what it spent today.
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 365, default: 30 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AgentMetrics" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /orgs/{org}/agent-trials:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    post:
      tags: [agents]
      operationId: startAgentTrial
      description: Run a draft version once on a sample input, without publishing it, under a budget capped at 0.50 $ (S32-03). The run is read at `GET /runs/{id}`; its work item is a trial, left out of the board.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentTrialCreate" } } }
      responses:
        "201": { description: Started, content: { application/json: { schema: { $ref: "#/components/schemas/AgentTrial" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/agent-credentials:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [agents]
      operationId: listOrgAgentCredentials
      description: Every client attached to an external agent of the organisation, with the agent's slug — one request for the AI clients' page, not one per agent (S30-04).
      responses:
        "200": { description: The organisation's agent clients, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AgentCredential" } } } } }
  /orgs/{org}/agent-metrics:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [agents]
      operationId: listAgentMetrics
      description: For each agent of the registry, its runs over the period, its success rate and its cost — the registry's columns in one request (S30-04).
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 365, default: 30 } }
      responses:
        "200": { description: One line per agent, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AgentMetricsSummary" } } } } }
  /orgs/{org}/agents/{slug}/runs:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      tags: [agents]
      operationId: listAgentRuns
      description: The agent's latest runs across the projects the caller may read, newest first (S30-05).
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200": { description: The runs, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Run" } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /orgs/{org}/agents/{slug}/credentials:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      tags: [agents]
      operationId: listAgentCredentials
      responses:
        "200": { description: The external agent's clients, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AgentCredential" } } } } }
    post:
      tags: [agents]
      operationId: attachAgentCredential
      description: Attach a `mcp:*` token or an OAuth client to an `external` agent; its rights become the human's, intersected with those of the agent's version (ADR 0033).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentCredentialCreate" } } }
      responses:
        "201": { description: Attached, content: { application/json: { schema: { $ref: "#/components/schemas/AgentCredential" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/agents/{slug}/credentials/{credential_id}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: credential_id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [agents]
      operationId: detachAgentCredential
      responses:
        "204": { description: Detached }
        "404": { $ref: "#/components/responses/NotFound" }
  /orgs/{org}/agents/{slug}/lifecycle:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
    post:
      tags: [agents]
      operationId: changeAgentLifecycle
      description: "draft → active → deprecated → retired (S32-04); a deprecated agent may be reactivated, `retired` is final. Retiring revokes the agent's credentials, removes its project pins and refuses new runs; refused (409) while one of its runs is in flight unless `force`. Audited (`agent.lifecycle`, `agent.retire`). `agent:manage`."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentLifecycleChange" } } }
      responses:
        "200": { description: The new state and the checklist executed, content: { application/json: { schema: { $ref: "#/components/schemas/AgentLifecycleResult" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /orgs/{org}/agents/{slug}/fork:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
    post:
      tags: [agents]
      operationId: forkAgent
      description: A new agent, in the scope asked, whose version 1 is a byte-for-byte copy of one of the source's versions (its latest by default; same checksum). It records `forked_from` and inherits nothing else. Needs to see the source AND to create in that scope (a developer forks into `personal`, a project owner into their project, an org_admin anywhere). A source the caller may not see is a 404. Audited (`agent.fork`).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentFork" } } }
      responses:
        "201": { description: The fork, content: { application/json: { schema: { $ref: "#/components/schemas/Agent" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/agents/{slug}/scope:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
    post:
      tags: [agents]
      operationId: changeAgentScope
      description: Promote an agent (ADR 0061). A personal agent goes to a project (its owner AND that project's owner, or an org_admin) or to the organisation (org_admin); a project's agent to the organisation (org_admin); an organisation agent into one project (org_admin; 409 while another project pins or names it). A common agent never moves. Audited (`agent.scope`).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentScopeChange" } } }
      responses:
        "200": { description: The agent in its new scope, content: { application/json: { schema: { $ref: "#/components/schemas/Agent" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/agents/{slug}/owner:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
    post:
      tags: [agents]
      operationId: transferAgentOwnership
      description: A new owner, member of the organisation; the agent keeps its credentials. Audited (`agent.transfer`). `agent:manage`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentOwnerChange" } } }
      responses:
        "200": { description: Transferred, content: { application/json: { schema: { $ref: "#/components/schemas/Agent" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/agents/{slug}/versions:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
    post:
      tags: [agents]
      operationId: publishAgentVersion
      parameters:
        - { name: allow_egress, in: query, schema: { type: boolean, default: false }, description: "open a remote agent's card host in the organisation's egress allowlist in the same call (S39-22); needs `tools:grant`. Without it a missing host is a 409 `egress_required`" }
      description: "Superseded by `publishAgentVersionWithMessage` (a message, a base version); kept as is for the clients written before, which publish with no message. Publish the next version; none is ever rewritten."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentSpec" } } }
      responses:
        "201": { description: Published, content: { application/json: { schema: { $ref: "#/components/schemas/AgentVersion" } } } }
        "409": { description: "A case of the agent's eval suite fails (S32-03): `errors` names each failing case; or, for a remote agent, `code: egress_required` when its card host is not yet allowed", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /orgs/{org}/agents/{slug}/versions/publish:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
    post:
      tags: [agents]
      operationId: publishAgentVersionWithMessage
      parameters:
        - { name: allow_egress, in: query, schema: { type: boolean, default: false }, description: "open a remote agent's card host in the organisation's egress allowlist in the same call (S39-22); needs `tools:grant`. Without it a missing host is a 409 `egress_required`" }
      description: "Publish the next version with the author's message, from the version they read (`base_version`). 409 `stale_base` when the latest is no longer that version (the problem carries `latest_version` and `latest_author`); 409 `no_change` when the spec's checksum equals the latest's; 409 `eval_failed` when a case of the eval suite fails. Same rights and checks as `publishAgentVersion`. Audited (`agent.publish`)."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentVersionPublish" } } }
      responses:
        "201": { description: Published, content: { application/json: { schema: { $ref: "#/components/schemas/AgentVersion" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`code` is `stale_base`, `no_change`, `eval_failed` or, for a remote agent whose card host is not yet allowed, `egress_required`", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/agents/{slug}/versions/{version}/restore:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: version, in: path, required: true, schema: { type: integer } }
    post:
      tags: [agents]
      operationId: restoreAgentVersion
      description: "Copy version N byte for byte (same spec, same checksum) as the next version, with `restored_from` = N and a default message `Restore vN`. Nothing is rewritten or deleted: a restore appends. Same 409s and eval gate as a publication; restoring the current spec is `no_change`. An unknown version is a 404. Audited (`agent.publish` with `restored_from`)."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentVersionRestore" } } }
      responses:
        "201": { description: The new version, content: { application/json: { schema: { $ref: "#/components/schemas/AgentVersion" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`code` is `stale_base`, `no_change` or `eval_failed`", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/agents/{slug}/versions/{version}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: version, in: path, required: true, schema: { type: integer } }
    get:
      tags: [agents]
      operationId: getAgentVersion
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AgentVersion" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /orgs/{org}/agents/{slug}/releases:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      tags: [agents]
      operationId: listAgentReleases
      description: Every move of the agent's channels, newest first — the release history (ADR 0071).
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200": { description: The history, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AgentRelease" } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [agents]
      operationId: releaseAgentVersion
      description: >-
        Point a channel at a revision (ADR 0071). `candidate` sends it to testing, with a canary share;
        `version: null` withdraws the candidate. `stable` releases to production: it checks the eval suite
        again, the candidate's record against the agent's gates, needs a person (human session) with a
        sign-in younger than the policy's `step_up_minutes` (not for a personal agent), and the plugin
        gesture `agent.release`. Rolling back to a revision that was in production skips the gates. 409
        lists the failing checks in `errors` (`type: release_check_failed`); 401 `step_up_required` asks
        for a fresh sign-in. With `release_policy.stable.approvals` above 0, a promotion (not a rollback)
        is stored as `pending_approval` and production does not move until enough people approve
        (`409` if one already waits). Audited (`agent.release`, or `agent.release.request`). Needs the
        right to release the agent.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentReleaseCreate" } } }
      responses:
        "201": { description: The move, as recorded, content: { application/json: { schema: { $ref: "#/components/schemas/AgentRelease" } } } }
        "401": { description: A fresh authentication is needed (`step_up_required`), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /orgs/{org}/agents/{slug}/releases/{release_id}/decision:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: release_id, in: path, required: true, schema: { type: string } }
    post:
      tags: [agents]
      operationId: decideAgentRelease
      description: >-
        Approve, reject or cancel a release that waits for approval (ADR 0071). Needs the right to release
        the agent and a human session. Approving also needs a sign-in younger than `step_up_minutes` and,
        with `separation_of_duties`, being neither the requester nor the revision's author (`422`); a
        person approves once (`409`). The last approval re-checks the revision and moves production from
        the revision the request saw: production moved meanwhile gives `409` and the request becomes
        `superseded`. A rejection needs a reason; the requester or an org_admin cancels. Audited
        (`agent.release.decide`, then `agent.release`).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentReleaseDecision" } } }
      responses:
        "200": { description: The release after the decision, content: { application/json: { schema: { $ref: "#/components/schemas/AgentRelease" } } } }
        "401": { description: A fresh authentication is needed (`step_up_required`), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/agent-releases:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [agents]
      operationId: listOrgAgentReleases
      description: Releases of the agents the caller may see, newest first; `status=pending_approval` is the approver's inbox.
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [done, pending_approval, rejected, cancelled, superseded] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        "200": { description: The releases, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AgentRelease" } } } } }
  /orgs/{org}/agents/{slug}/versions/{version}/readiness:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: version, in: path, required: true, schema: { type: integer } }
    get:
      tags: [agents]
      operationId: getAgentReleaseReadiness
      description: What releasing this revision to a channel would check, without doing it — the checklist the console shows before "Promote".
      parameters:
        - { name: channel, in: query, required: false, schema: { type: string, enum: [stable, candidate], default: stable } }
      responses:
        "200": { description: The checks, content: { application/json: { schema: { $ref: "#/components/schemas/AgentReleaseReadiness" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /orgs/{org}/agents/{slug}/versions/{version}/evaluations:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: version, in: path, required: true, schema: { type: integer } }
    post:
      tags: [agents]
      operationId: startAgentEvaluation
      description: >-
        Run the revision's `live` eval cases as capped trials in a project (ADR 0071, live evaluation).
        Needs the right to try the agent in that project. Each trial is capped at the case's
        `max_cost_usd` (0.25 $ by default, 0.50 $ at most); `409` when the cases together could spend
        more than the policy's `max_eval_usd`, when the revision has no live case, or more than 10.
        Without a model to call (no gateway key) the evaluation is `not_run`. Audited
        (`agent.evaluation.start`).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentEvaluationCreate" } } }
      responses:
        "201": { description: The evaluation, started, content: { application/json: { schema: { $ref: "#/components/schemas/AgentEvaluation" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      tags: [agents]
      operationId: listAgentEvaluations
      description: The live evaluations of the revision, newest first, each judged from its runs as they stand.
      responses:
        "200": { description: The evaluations, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AgentEvaluation" } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /orgs/{org}/agents/{slug}/release-policy:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
    put:
      tags: [agents]
      operationId: setAgentReleasePolicy
      description: What saving a revision does (`on_publish`) and the gates of production. Loosening the policy needs a person with a fresh sign-in. Audited (`agent.release_policy`).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentReleasePolicy" } } }
      responses:
        "200": { description: The agent, content: { application/json: { schema: { $ref: "#/components/schemas/Agent" } } } }
        "401": { description: A fresh authentication is needed (`step_up_required`), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/agents/{slug}/exposure:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      tags: [agents]
      operationId: getAgentExposure
      description: Production, testing and the projects (among those the caller may read) that chose their own revision.
      responses:
        "200": { description: Who is served what, content: { application/json: { schema: { $ref: "#/components/schemas/AgentExposure" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /orgs/{org}/agent-catalogue:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [agents]
      operationId: listAgentCatalogue
      description: The agents the platform ships (ADR 0040), and their state in the organisation — installed, in which version, an update available, or an agent of the organisation with the same name.
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AgentCatalogueEntry" } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /orgs/{org}/agent-catalogue/{slug}/install:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
    post:
      tags: [agents]
      operationId: installCatalogueAgent
      description: Installs the agent as version 1 of an agent of the organisation (201), its skills first. Already installed, `upgrade` publishes the next version when the catalogue changed (200). An agent of the organisation with the same name that does not come from the catalogue is never touched (409). `agent:manage`.
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentCatalogueInstall" } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Agent" } } } }
        "201": { description: Installed, content: { application/json: { schema: { $ref: "#/components/schemas/Agent" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /orgs/{org}/agent-catalogue/{slug}/connect:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
    post:
      tags: [agents]
      operationId: connectCatalogueClient
      description: Connects an AI client of the catalogue in one click (ADR 0040). Its external agent is created by an administrator the first time and joined by any member afterwards; a `mcp:write` (or `mcp:read`) token is minted for the caller, attached to the agent and returned once. A client that calls from its vendor's cloud gets no token — the OAuth client the identity provider registered is attached — and is refused (409) when the door does not accept it.
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentCatalogueConnect" } } }
      responses:
        "201": { description: Connected, content: { application/json: { schema: { $ref: "#/components/schemas/AgentCatalogueConnection" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /orgs/{org}/skills:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [agents]
      operationId: listSkills
      description: The organisation's skill library (ADR 0033).
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Skill" } } } } }
    post:
      tags: [agents]
      operationId: createSkill
      description: A new skill, version 1, named by its SKILL.md; no declared permission (`allowed-tools` is refused).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SkillFiles" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Skill" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/skills/import:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    post:
      tags: [agents]
      operationId: importSkill
      description: A zip archive; zip-slip, symbolic links, more than 256 files or 5 MiB are refused; a file is UTF-8 text or an inert binary (png, jpg, jpeg, gif, webp, ico, ttf, otf, woff, woff2, at most 512 KiB, magic bytes checked, stored as base64), any other binary refuses the skill; the gate assesses each version (ADR 0050). From a repository, see `importSkillsFromGit`.
      requestBody:
        required: true
        content: { application/zip: { schema: { type: string, format: binary } } }
      responses:
        "201": { description: Published, content: { application/json: { schema: { $ref: "#/components/schemas/Skill" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/skill-sources:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [agents]
      operationId: getSkillSources
      description: The repositories a project owner may import skills from (ADR 0050); by default `github.com/anthropics/skills` and the GitHub owners of the organisation's connected repositories.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SkillSources" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [agents]
      operationId: putSkillSources
      description: Replaces the allowlist; `agent:manage`. Each entry is `github.com/<owner>[/<repo>]` or `gitlab.com/<group>[/…]`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SkillSources" } } }
      responses:
        "200": { description: Written, content: { application/json: { schema: { $ref: "#/components/schemas/SkillSources" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/skills/import-git/preview:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    post:
      tags: [agents]
      operationId: previewSkillsFromGit
      description: Resolves a branch, a tag or a commit of a github.com or gitlab.com repository to its commit SHA and lists the skill folders under `path`, each checked; nothing is written. `skill:import` for an allowlisted repository, `agent:manage` otherwise.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SkillGitPreviewRequest" } } }
      responses:
        "200": { description: The commit and its skills, content: { application/json: { schema: { $ref: "#/components/schemas/SkillGitPreview" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/EgressRequired" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502": { description: "The repository's host did not answer, or not usefully" }
  /orgs/{org}/skills/import-git:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    post:
      tags: [agents]
      operationId: importSkillsFromGit
      description: Imports the named skills at a commit SHA (40 hex characters; a branch or a tag is refused). Each becomes a skill, or its next version, recording its repository, SHA, folder and licence. A project owner may create skills from an allowlisted repository; another source, or a new version of an existing skill, needs `agent:manage`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SkillGitImport" } } }
      responses:
        "201": { description: Published, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Skill" } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/EgressRequired" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502": { description: "The repository's host did not answer, or not usefully" }
  /orgs/{org}/plugins:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [agents]
      operationId: listPlugins
      description: >-
        The plugins installed in the organisation (ADR 0093): version, source, content digest, what each brought, and
        the newest version its source offers. Any member of the organisation.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PluginList" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /orgs/{org}/plugin-sources:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [agents]
      operationId: listPluginSources
      description: >-
        The plugin sources this deployment declares (chart `plugins.sources`, and the offline directory as the source
        `offline`), each with its trust policy and the plugins and versions its index offers. Sources are set by the
        operator, not through the API. A source whose index cannot be read is listed with `error`. Any member.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PluginSources" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /orgs/{org}/plugins/install:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    post:
      tags: [agents]
      operationId: installPlugin
      description: >-
        Installs a plugin from a declared source (ADR 0093). The supply-chain gate (ADR 0050) runs first: the fetched
        content's digest must equal the index's, the signature must verify against the source's trust policy, and every
        file is validated; any failure is a 422 naming the check, and nothing is written. `version` is an exact version
        or a range; the newest matching version whose `core` range admits this core is chosen. A plugin that brings a
        server needs a second person's approval: the answer is then a 202 and nothing is installed until it is given.
        Rights per ADR 0074; audited as `plugin.install`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PluginInstall" } } }
      responses:
        "201": { description: Installed, content: { application/json: { schema: { $ref: "#/components/schemas/InstalledPlugin" } } } }
        "202": { description: Waiting for a second approval, content: { application/json: { schema: { $ref: "#/components/schemas/PluginInstallPending" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/plugins/{name}/upgrade:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { $ref: "#/components/parameters/PluginName" }
    post:
      tags: [agents]
      operationId: upgradePlugin
      description: >-
        Moves an installed plugin to another version of its source, through the same gate as an install. The catalogue
        rules of ADR 0040 hold: an agent the organisation changed is offered the new version, never overwritten
        (`offered`), and project pins do not move. Without `version`, the newest admissible one. Audited as
        `plugin.upgrade`.
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/PluginUpgrade" } } }
      responses:
        "200": { description: Upgraded, content: { application/json: { schema: { $ref: "#/components/schemas/PluginUpgradeResult" } } } }
        "202": { description: Waiting for a second approval, content: { application/json: { schema: { $ref: "#/components/schemas/PluginInstallPending" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/plugins/{name}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { $ref: "#/components/parameters/PluginName" }
    delete:
      tags: [agents]
      operationId: uninstallPlugin
      description: >-
        Uninstalls a plugin: what it brought and nobody changed is retired, what an organisation changed or a project
        pins is kept and loses its plugin provenance, and its servers stop. The answer lists what was removed and what
        was kept as the organisation's own (contract-change S43-05: was a 204 without a body, so the person
        uninstalling did not learn what stayed). Requests still waiting for a second approval of this plugin are
        dropped. 409 when another installed plugin requires it. Audited as `plugin.uninstall`.
      responses:
        "200": { description: Uninstalled, content: { application/json: { schema: { $ref: "#/components/schemas/PluginUninstallResult" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /orgs/{org}/plugin-approvals:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [agents]
      operationId: listPluginApprovals
      description: >-
        The plugin installs and upgrades that waited, or still wait, for a second approval (ADR 0050, ADR 0093 §4):
        a plugin that brings a server, at the exact version and content digest that was checked. A default plugin
        the start-up reconcile could not install on its own is here with `default: true` and no `requested_by`.
        Newest first, at most 200. Any member of the organisation (contract-change S43-05).
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PluginApprovalList" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /orgs/{org}/plugin-approvals/{approval_id}/approve:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: approval_id, in: path, required: true, schema: { type: string } }
    post:
      tags: [agents]
      operationId: approvePluginInstall
      description: >-
        A second administrator approves a waiting install or upgrade: the plugin is obtained again at the recorded
        version, through every check of the gate, and installed only if its content digest is the one that was
        checked (409 otherwise). The administrator who asked cannot approve (403); a request of the platform (a
        default plugin) is approved by any administrator. Rights per ADR 0074; audited as `plugin.approve`
        (contract-change S43-05).
      responses:
        "200": { description: Approved and installed, content: { application/json: { schema: { $ref: "#/components/schemas/PluginApproval" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/skill-catalogue:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [agents]
      operationId: listSkillCatalogue
      description: The catalogue of default skills shipped with the platform (ADR 0065) and, for each, what it means in this organisation — available, installed, updatable, waiting for a second reviewer, or blocked and why. Listing installs nothing. Its members can read it.
      parameters:
        - { name: q, in: query, required: false, schema: { type: string }, description: "free text over the id, the title, the publisher and the description" }
        - { name: category, in: query, required: false, schema: { type: string } }
        - { name: delivery, in: query, required: false, schema: { type: string, enum: [bundled, git] } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SkillCatalogue" } } } }
  /orgs/{org}/skill-catalogue/{entry_id}/install:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: entry_id, in: path, required: true, schema: { type: string } }
    post:
      tags: [agents]
      operationId: installSkillCatalogueEntry
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/SkillCatalogueInstall" } } }
      description: Publishes the entry as a skill, or its next version when the catalogue pins a newer one. A bundled entry is read from the image and checked against its provenance; a git entry is fetched at its pinned commit. Both go through the supply-chain gate again (ADR 0050) — a high-risk version waits for a second administrator. `agent:manage` may install any entry; `skill:import` an entry whose repository is in the organisation's allowlist, as a new skill only.
      responses:
        "201": { description: Published, content: { application/json: { schema: { $ref: "#/components/schemas/Skill" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/EgressRequired" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502": { description: "The repository did not answer, or the image's bundled skill does not match its provenance" }
  /orgs/{org}/skills/{slug}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      tags: [agents]
      operationId: getSkill
      responses:
        "200": { description: The skill and its versions, content: { application/json: { schema: { $ref: "#/components/schemas/Skill" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /orgs/{org}/skills/{slug}/versions:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
    post:
      tags: [agents]
      operationId: publishSkillVersion
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SkillFiles" } } }
      responses:
        "201": { description: Published, content: { application/json: { schema: { $ref: "#/components/schemas/SkillVersion" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/skills/{slug}/versions/{version}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: version, in: path, required: true, schema: { type: integer } }
    get:
      tags: [agents]
      operationId: getSkillVersion
      responses:
        "200": { description: The version and its files, content: { application/json: { schema: { $ref: "#/components/schemas/SkillVersion" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /orgs/{org}/knowledge:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [knowledge]
      operationId: listKnowledgeBases
      description: The organisation's knowledge bases the caller may read (ADR 0051), without their documents.
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/KnowledgeBase" } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [knowledge]
      operationId: createKnowledgeBase
      description: A curated corpus of reference documents, read-only for agents. `agent:manage`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeBaseCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeBase" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /projects/{id}/knowledge:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [knowledge]
      operationId: createProjectKnowledgeBase
      description: "A knowledge base owned by this project (S39-14, ADR 0051): scope `projects` naming it, `owner_project` set, so its owners curate it and an organisation administrator alone widens it. `project:write`."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectKnowledgeBaseCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeBase" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/knowledge/{slug}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      tags: [knowledge]
      operationId: getKnowledgeBase
      description: The knowledge base and its documents with their conversion status. A base outside the caller's scope is 404.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeBase" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [knowledge]
      operationId: updateKnowledgeBase
      description: Renames it, changes its serving mode, archives it (`agent:manage`, or `project:write` on the owning project). Changing its scope, projects or groups is `agent:manage` only, and clears `owner_project`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeBasePatch" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeBase" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/knowledge/{slug}/grants:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      tags: [knowledge]
      operationId: listKnowledgeGrants
      description: >-
        The roles granted on this base to people, groups and projects (S42-11, ADR 0081). Who holds a role is
        shown to a caller who may change it (`can.share`) only; another reader of the base is 403, and a
        base the caller may not read is 404.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeGrants" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [knowledge]
      operationId: putKnowledgeGrants
      description: >-
        Replaces the whole list, so repeating a call changes nothing. `agent:manage`, or a caller whose
        role on the base is owner (`can.share`). A user is named by member id or by email (an email with no
        member yet is kept and resolves when that person signs in); a project must exist; a group is a free
        IdP group name. A grant gives people a role on the base and never serves a run. Audited as
        `knowledge.grant.set`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeGrantsPut" } } }
      responses:
        "200": { description: The list as stored, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeGrants" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/knowledge/{slug}/documents:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
    post:
      tags: [knowledge]
      operationId: uploadKnowledgeDocument
      description: >-
        One document (docx, pptx, xlsx, pdf, md, html, txt), converted to markdown in the background:
        answered 202 `pending`, then `ready` or `failed` with its reason. The same bytes twice answer the
        existing document (200). `agent:manage`, or `project:write` on the owning project (`owner_project`).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200": { description: Already there, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeDocument" } } } }
        "202": { description: Accepted for conversion, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeDocument" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { description: Larger than the deployment's cap, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/knowledge/{slug}/documents/{document_id}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: document_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [knowledge]
      operationId: getKnowledgeDocument
      description: The document and, once converted, its markdown.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeDocument" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [knowledge]
      operationId: deleteKnowledgeDocument
      description: "`agent:manage`, or `project:write` on the owning project (`owner_project`)."
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /orgs/{org}/knowledge/{slug}/documents/{document_id}/convert:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: document_id, in: path, required: true, schema: { type: string } }
    post:
      tags: [knowledge]
      operationId: convertKnowledgeDocument
      description: Converts the document again (after a failure, or a converter upgrade). `agent:manage`, or `project:write` on the owning project (`owner_project`).
      responses:
        "202": { description: Accepted for conversion, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeDocument" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /orgs/{org}/skills/{slug}/versions/{version}/approve:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: version, in: path, required: true, schema: { type: integer } }
    post:
      tags: [agents]
      operationId: approveSkillVersion
      description: Approves a high-risk version waiting for review (ADR 0050); `agent:manage`, and not by the person who imported it (403). Audited as `skill.approve`.
      responses:
        "200": { description: Approved, content: { application/json: { schema: { $ref: "#/components/schemas/SkillVersion" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /orgs/{org}/skills/{slug}/update:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: ref, in: query, required: false, schema: { type: string, default: HEAD }, description: "A branch, a tag or a commit; the default branch by default" }
    get:
      tags: [agents]
      operationId: checkSkillUpdate
      description: What the repository of a skill imported from git holds at `ref`, against its latest version — the commit SHA and the files added, removed and modified. A proposal, never applied; importing that SHA publishes it.
      responses:
        "200": { description: The proposal, content: { application/json: { schema: { $ref: "#/components/schemas/SkillUpdate" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502": { description: "The repository's host did not answer, or not usefully" }
  /orgs/{org}/knowledge/{slug}/search:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
    post:
      tags: [knowledge]
      operationId: searchKnowledgeBase
      description: Hybrid search of an `index` base (full-text and, with pgvector, embeddings, fused by reciprocal rank); citations, and the `mode` the database allowed. 409 for a `files` base.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeSearchRequest" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeSearchResult" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /orgs/{org}/knowledge/{slug}/reindex:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
    post:
      tags: [knowledge]
      operationId: reindexKnowledgeBase
      description: Cuts and embeds every ready document again, in the background. `agent:manage`, or `project:write` on the owning project (`owner_project`).
      responses:
        "202": { description: Reindexing, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeBase" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /orgs/{org}/knowledge/{slug}/sync:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
    post:
      tags: [knowledge]
      operationId: syncKnowledgeBase
      description: Syncs every source of the base now, rather than at their next scheduled time (S39-19). `agent:manage`.
      responses:
        "202": { description: Sync requested for every source, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeBase" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /orgs/{org}/knowledge/{slug}/distill:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
    post:
      tags: [knowledge]
      operationId: distillKnowledgeBase
      description: >-
        The `knowledge-distiller` agent compiles the base into a principles skill (`<slug>-principles`), each principle
        citing its source documents, in the background. The version is published `pending_review` whatever its risk:
        a person approves it before any agent carries it (S32-06). The outcome lands in `distillation`. `agent:manage`, or `project:write` on the owning project (`owner_project`).
        A base too large for one model call is read in passes (S42-10): `exclude` leaves documents out, `max_usd` caps the spend.
        The body is optional; without it nothing is excluded and the platform's budget applies. A second start while one runs answers 409; so does
        a distillation whose estimate exceeds `max_usd` (`distill_over_budget`).
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeDistillRequest" } } }
      responses:
        "202": { description: Distilling, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeBase" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/knowledge/{slug}/distill/stop:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
    post:
      tags: [knowledge]
      operationId: stopKnowledgeDistillation
      description: >-
        Stops the distillation that is running on the base (S42-10d). The model calls already made stay stored by digest
        and booked in the cost ledger, nothing is published, and `distillation` becomes `status: stopped` with
        `code: cancelled`, `stopped_by`, the parts done and the spend so far. A relaunch reuses the stored parts.
        Same rights as `distill`. 409 when no distillation is running (`distill_not_running`).
      responses:
        "202": { description: Stop requested; the base carries the stopped record, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeBase" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /orgs/{org}/knowledge/{slug}/distill/relaunch:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
    post:
      tags: [knowledge]
      operationId: relaunchKnowledgeDistillation
      description: >-
        Starts again the last distillation of the base, whatever its outcome (failed, stopped or finished) (S42-10d).
        Without a body it keeps the last run's `exclude` and `max_usd`; a body replaces them. Parts already stored for
        the same digest are not called again, so only what changed or never finished is paid for. Same rights as
        `distill`. 409 when one is running, when there is no previous distillation (`distill_nothing_to_relaunch`),
        or when the estimate exceeds `max_usd` (`distill_over_budget`).
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeDistillRequest" } } }
      responses:
        "202": { description: Distilling again, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeBase" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/knowledge/{slug}/distill/estimate:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: exclude, in: query, required: false, description: "filename globs left out of the estimate, repeated (at most 20)", schema: { type: array, items: { type: string }, maxItems: 20 }, style: form, explode: true }
    get:
      tags: [knowledge]
      operationId: estimateKnowledgeDistillation
      description: >-
        What distilling the base would read and cost, without calling a model (S42-10): characters, an approximate token
        count (characters / 4), the parts the corpus is cut into, the model calls, and the price when the model is priced
        (`priced_by`: `gateway`, `override` or `none`). `refused_reason` says why a distillation would not start
        (`too_large`, `no_document`); `biggest` names the documents that weigh most, the ones to `exclude`. Same rights as `distill`.
      responses:
        "200": { description: The estimate, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeDistillEstimate" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /orgs/{org}/knowledge/{slug}/eval:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
    put:
      tags: [knowledge]
      operationId: putKnowledgeEvalSet
      description: The base's eval set — questions and the documents (file name or title) expected to answer them. `agent:manage`, or `project:write` on the owning project (`owner_project`).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeEvalSet" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeBase" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/knowledge/{slug}/eval/run:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
    post:
      tags: [knowledge]
      operationId: runKnowledgeEval
      description: Runs the eval set against the index and records recall@5 (`eval_result`). `agent:manage`, or `project:write` on the owning project (`owner_project`).
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeBase" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/knowledge/{slug}/sources:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
    post:
      tags: [knowledge]
      operationId: createKnowledgeSource
      description: >-
        Where the base's documents are synced from (S33-04): `sharepoint` (a site or drive through an
        organisation connector of capability `documents`, Graph `Sites.Selected`, delta sync), `confluence` (a Confluence Cloud space, or a page and its descendants, through a `documents` connector holding an API token; S39-20), `web` (one
        https site, same host, robots.txt obeyed) or `git` (an https repository). Synced at once, then every
        `interval_minutes`; a document deleted at the source leaves the base and its index. `agent:manage`, or `project:write` on the owning project (`owner_project`).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeSourceCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeSource" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/EgressRequired" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/knowledge/{slug}/sources/{source_id}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: source_id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [knowledge]
      operationId: updateKnowledgeSource
      description: Renames it, changes its interval or configuration (a new configuration syncs from scratch). `agent:manage`, or `project:write` on the owning project (`owner_project`).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeSourcePatch" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeSource" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/EgressRequired" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [knowledge]
      operationId: deleteKnowledgeSource
      description: The source and the documents it brought leave the base. `agent:manage`, or `project:write` on the owning project (`owner_project`).
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /orgs/{org}/knowledge/{slug}/sources/{source_id}/sync:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: source_id, in: path, required: true, schema: { type: string } }
    post:
      tags: [knowledge]
      operationId: syncKnowledgeSource
      description: Syncs now rather than at the end of the interval. `agent:manage`, or `project:write` on the owning project (`owner_project`).
      responses:
        "202": { description: Sync requested, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeSource" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/agents:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [agents]
      operationId: listProjectAgents
      responses:
        "200": { description: The pinned versions, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProjectAgent" } } } } }
  /projects/{id}/implicit-agents:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [agents]
      operationId: listImplicitAgents
      description: The `agent` actors of the project's active workflows that name no agent of the registry — computed by the API, not by one read per workflow (S30-04).
      responses:
        "200": { description: The implicit agents, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ImplicitAgent" } } } } }
  /projects/{id}/builtin-agent:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [agents]
      operationId: describeBuiltinAgent
      description: >-
        What an `agent` actor that names no registry agent runs in this project: the role's playbook
        (the prompt as a run receives it, with what only a run knows as `<placeholders>`), the model
        each work item size resolves to through the runtime's resolver, the backend, the limits, the
        memory and the MCP servers. The console passes a step's own fields, so a draft is described too.
        Read only.
      parameters:
        - { name: role, in: query, required: true, schema: { type: string, pattern: "^[a-z][a-z0-9_]{0,62}$" } }
        - { name: playbook, in: query, schema: { type: [string, "null"], pattern: "^[a-z][a-z0-9_]{0,62}$" } }
        - { name: model, in: query, schema: { type: string, minLength: 1, maxLength: 200, default: "profile:by_size" } }
        - { name: backend, in: query, schema: { type: [string, "null"], maxLength: 64 } }
        - { name: max_turns, in: query, schema: { type: [integer, "null"], minimum: 1, maximum: 1000 } }
        - { name: max_minutes, in: query, schema: { type: [integer, "null"], minimum: 1, maximum: 480 } }
      responses:
        "200": { description: The built-in agent, content: { application/json: { schema: { $ref: "#/components/schemas/BuiltinAgent" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/groups/{group}/members:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: group, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
    get:
      tags: [agents]
      operationId: listGroupMembers
      description: >-
        Who a person step addressed to `group` waits for: the organisation's members carrying that
        identity-provider group (as of their last sign-in), and whether each may answer in this project
        (`item:decide`, ADR 0044). Empty means the step waits for an organisation administrator. Needs
        `member:read` on the project.
      responses:
        "200": { description: The group's members, content: { application/json: { schema: { $ref: "#/components/schemas/GroupMembers" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/workflow-agents:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [agents]
      operationId: listWorkflowAgents
      description: Every `agent` actor of the project's active workflows, the registry agent it names or none, so the console lists the agents a project runs in one table (S47-39).
      responses:
        "200": { description: The workflows' agents, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/WorkflowAgent" } } } } }
  /projects/{id}/agent-resolution:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [agents]
      operationId: resolveProjectAgents
      description: >-
        Which agent version a run would load for each reference (`slug` or `slug@N`), through the
        runtime's own resolver: an explicit `@N`, else the project's fixed pin, else its pin on a channel,
        else the project's "follow testing" switch, else production (ADR 0071; a canary share depends on
        the work item, so it is reported in `candidate_percent`, not applied). Read only. The console builds the list from the `agent` of the process steps,
        so it works on a draft too (S39-13).
      parameters:
        - name: ref
          in: query
          required: true
          schema:
            type: array
            minItems: 1
            maxItems: 64
            items: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}(@[1-9][0-9]*)?$" }
      responses:
        "200": { description: One answer per reference, in the order asked, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AgentResolution" } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /projects/{id}/agent-channel:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [agents]
      operationId: getProjectAgentChannel
      description: Which channel of the agents the project runs when it pins nothing (ADR 0071).
      responses:
        "200": { description: The channel, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectAgentChannel" } } } }
    put:
      tags: [agents]
      operationId: setProjectAgentChannel
      description: Make the project run the agents' testing revisions (`candidate`) or their production (`stable`). `project:write`. Audited (`project.agent_channel`).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectAgentChannel" } } }
      responses:
        "200": { description: The channel, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectAgentChannel" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /projects/{id}/agents/{slug}:
