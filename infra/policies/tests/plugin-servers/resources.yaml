# Pods of the plugins namespace judged by `choregos-plugin-server-images` (ADR 0094).
apiVersion: v1
kind: Pod
metadata:
  name: server-allowed
  namespace: choregos-plugins
spec:
  containers:
  - name: server
    image: ghcr.io/vargafoundation/choregos-agents/servicenow-mcp@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: RuntimeDefault
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  automountServiceAccountToken: false
---
apiVersion: v1
kind: Pod
metadata:
