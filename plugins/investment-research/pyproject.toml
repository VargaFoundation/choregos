[project]
name = "tranibor-investment-research"
version = "0.27.15"
description = "The extension of the investment-research plugin: the marketdata connector family (ADR 0181)"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = ["tranibor-adapters", "httpx>=0.27"]

# The plugin's code half (ADR 0181 point 4): the API and the worker load it at start-up.
[project.entry-points."choregos.plugins"]
investment-research = "tranibor_investment_research.extension:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tranibor_investment_research"]
