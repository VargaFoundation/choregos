  namespace: proj-demo-runners
  labels:
    choregos/project: demo
spec:
  containers:
  - name: main
    image: ghcr.io/example/api:1
    securityContext: &id001
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: RuntimeDefault
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  initContainers:
  - name: sidecar
    image: ghcr.io/example/side:1
    restartPolicy: Always
    securityContext: *id001
---
