apiVersion: choregos/v1
kind: Template
metadata:
  name: joiners-leavers
  version: 2.0.0
  display: Joiners and leavers (HR)
  description: >-
    Two workflows with no repository and no CI. Onboarding: the access plan prepared by an agent and
    approved by HR, the account and its group ten days before the start date, the sensitive group on
    a re-authenticated approval, the laptop ordered from the supplier's agent then enrolled in the
    fleet and shipped seven days before, the badge handed over in person — a task, with its proof —,
    a check the day after. Offboarding: on the last day the account is disabled, its sessions revoked
    and the badge cut; the laptop is collected, received and wiped. Every write to the directory, the
    fleet, the carrier or the badge readers is a governed action.
requires:
  # The project: its tickets live in Choregos.
  connectors:
    tracker: internal
  # The organisation: the connectors the workflows call, by NAME, and their capability.
  org_connectors:
    directory: identity
    devices: mdm
    carrier: shipping
    badge-readers: access_control
    supplier: mcp
defaults:
  workflows: [./workflows/onboarding.yaml, ./workflows/offboarding.yaml]
  default_workflow: onboarding
  routing:
    - when: { labels_any: [offboarding, leaver] }
      workflow: offboarding
  policy: preset:solo
  # Installed in the organisation when a project is born from the template — never rewritten if
  # they are already there.
  skills: [./skills/onboarding-procedure, ./skills/access-profiles]
  agents: [./agents/onboarding-coordinator.yaml, ./agents/offboarding-coordinator.yaml]
  # Installed in the PROJECT by the ontology plugin, when it is active: the registry of what a
  # joiner opens and what a leaver closes. Without it the project is born without one (the audit
  # log says so).
  extensions:
    ontology: ./ontology
inputs: []
steps: []
