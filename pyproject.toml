[project]
name = "choregos-workspace"
version = "0.21.2"
description = "Choregos — plateforme de delivery agentique (Varga Foundation)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
  "choregos-contracts",
  "choregos-core",
  "choregos-ontology",
  "choregos-adapters",
  "choregos-runner",
  "choregos-quant",
  "choregos-tools-mcp",
  "choregos-playbooks",
  "choregos-cli",
  "choregos-api",
  "choregos-orchestrator",
  "choregos-agent-sdk",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "mypy>=1.13",
  "ruff>=0.8",
  "respx>=0.21",
  "httpx>=0.27",
  "types-PyYAML>=6.0",
  "datamodel-code-generator>=0.26",
  "freezegun>=1.5",
  "alembic>=1.20.0",
  "types-jsonschema>=4.26.0.20260518",
  "mcp>=1.20",
  "python-docx>=1.1",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.workspace]
members = ["packages/*", "apps/api", "apps/orchestrator"]
exclude = ["packages/contracts/ts", "apps/web"]

[tool.uv.sources]
choregos-contracts = { workspace = true }
choregos-core = { workspace = true }
choregos-ontology = { workspace = true }
choregos-adapters = { workspace = true }
choregos-runner = { workspace = true }
choregos-quant = { workspace = true }
choregos-tools-mcp = { workspace = true }
choregos-playbooks = { workspace = true }
choregos-cli = { workspace = true }
choregos-api = { workspace = true }
choregos-orchestrator = { workspace = true }
choregos-agent-sdk = { workspace = true }

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [
  ".venv",
  "packages/contracts/ts",
  "apps/web",
  "**/generated/**",
  "apps/api/src/choregos_api/migrations/versions",
  # Dépôts jouets des évals : ils imitent du code de client, pas notre style maison.
  "tests/fixtures/repos",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "S", "RET", "PL", "RUF"]
# PLC0415 : les imports paresseux sont assumés (rupture de cycles, coût de démarrage).
# PLR0911 (retours) et PLR0917 (positionnels) restent ignorés ; les autres règles de
# complexité sont actives avec des seuils réalistes (ci-dessous) — l'état des lieux du
# 2026-09-24 les trouvait toutes ignorées, et trois fonctions dépassaient largement.
ignore = ["S101", "PLR2004", "RUF001", "RUF002", "RUF003", "B008", "PLR0911", "SIM108", "PLC0415", "PLR0917"]
extend-select = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-branches = 20
max-args = 8
max-statements = 80

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "PLR", "ASYNC"]
"tests/**" = ["S", "PLR", "ASYNC"]
"**/fakes/**" = ["S"]
# Valeurs par défaut de développement, jamais des secrets réels.
"apps/api/src/choregos_api/config.py" = ["S105"]
"apps/api/src/choregos_api/security.py" = ["S105"]
"apps/api/src/choregos_api/migrations/**" = ["E501", "W291", "I001"]
# Singletons de moteur/session et de bus : un seul par processus, assumé.
"apps/api/src/choregos_api/db/session.py" = ["PLW0603"]
"apps/api/src/choregos_api/temporal.py" = ["PLW0603"]
"apps/orchestrator/src/choregos_orchestrator/activities/base.py" = ["PLW0603"]
"apps/orchestrator/src/choregos_orchestrator/train_client.py" = ["PLW0603"]
# Lecture de fixtures locales dans une activité : I/O disque court et assumé.
"apps/orchestrator/src/choregos_orchestrator/activities/evals.py" = ["ASYNC240"]
"apps/orchestrator/src/choregos_orchestrator/activities/provisioning.py" = ["ASYNC240"]
# Build-time probe: loopback URLs and a fixed headroom command line, no untrusted input.
"docker/headroom/relays_budget_refusal.py" = ["S310", "S603", "S607"]
# Le `timeout` explicite fait partie du contrat de ces fonctions (RPC, sous-processus).
"packages/runner/src/choregos_runner/**" = ["ASYNC109"]
"packages/adapters/src/choregos_adapters/**" = ["ASYNC109"]
# Données de démonstration : le hasard n'a rien de cryptographique, et c'est voulu.
"dev/scripts/seed.py" = ["S311", "E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
exclude = ["(^|/)(\\.venv|node_modules|generated)/", "^apps/web/"]
namespace_packages = true
explicit_package_bases = true
mypy_path = "packages/contracts/src:packages/core/src:packages/ontology/src:packages/adapters/src:packages/runner/src:packages/quant/src:packages/tools-mcp/src:packages/playbooks/src:packages/cli/src:packages/agent-sdk/src:examples/agents/plain/src:apps/api/src:apps/orchestrator/src"

[[tool.mypy.overrides]]
module = ["celpy.*", "temporalio.*", "mcp.*", "kubernetes_asyncio.*", "slack_sdk.*", "authlib.*", "jsonschema_rs.*", "prometheus_client.*", "structlog.*", "asyncpg.*", "openpyxl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "*.tests.*"]
strict = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages", "apps", "tests"]
# Les dépôts jouets des évals ont leurs propres tests : ils sont joués par la matrice
# d'évals dans une copie jetable, pas par la suite de la plateforme.
norecursedirs = [
  "apps/web",
  "tests/live",
  "tests/cluster",
  "node_modules",
  ".venv",
  "tests/e2e",
  "tests/fixtures/repos",
]
addopts = "-q --strict-markers --import-mode=importlib"
markers = [
  "integration: nécessite des services externes (kind, docker)",
  "e2e: scénario bout en bout",
  "conformance: suite de conformité backends/templates",
  "slow: test long",
  "live: nécessite des identifiants réels (Jira, GitLab, Azure) — ignoré sans eux",
  "cluster: nécessite un vrai cluster Kubernetes (CNI appliquant les NetworkPolicy)",
  "capability(executor, name): this cluster test proves that capability of that executor (S35-04)",
  "buildkit: needs a real buildkitd and a registry (S41-13, the `hosted-build` CI job)",
  "cosign_real: runs the real cosign against a registry (CHOREGOS_COSIGN_REAL_REGISTRY); skipped without them",
  "hosted_docker: builds and runs hosted agents with a real Docker daemon (S41-23, the `hosted-images` CI job); skipped without one",
  "gvisor: runs the agent inside a gVisor sandbox (CHOREGOS_TEST_RUNSC, S41-17, the `hosted-gvisor` CI job)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["packages/core/src", "packages/runner/src", "packages/agent-sdk/src", "packages/adapters/src", "apps/api/src", "apps/orchestrator/src"]
omit = ["*/generated/*", "*/tests/*"]

[tool.coverage.report]
# 80 % était mesuré sur core, runner et orchestrateur seulement : toute la surface HTTP et
# tous les appels sortants (apps/api, packages/adapters) échappaient au seuil. Avec eux,
# la couverture mesurée le 2026-09-24 est de 72 %. Le seuil suit la mesure — il monte
# avec P1-3 (matrice RBAC, adaptateurs nus, jetons), pas avant.
fail_under = 80
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
