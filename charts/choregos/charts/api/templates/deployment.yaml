{{- if .Values.enabled }}
{{- $canary := .Values.global.canary | default dict }}
{{- if $canary.enabled }}
# Canary de la plateforme : Argo Rollouts remplace le Deployment. Le pod est le même — c'est la
# façon d'y arriver qui change. Sans Rollouts installé, laisser `global.canary.enabled: false`.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
{{- else }}
apiVersion: apps/v1
kind: Deployment
{{- end }}
metadata:
  name: choregos-api
  labels: {{- include "choregos.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- if $canary.enabled }}
  strategy:
    canary:
      # Les paliers et leur durée viennent des valeurs : un environnement prudent allonge la
      # pause, il ne réécrit pas le chart.
      steps:
        {{- range $canary.steps }}
        - setWeight: {{ .weight }}
        {{- if .pause }}
        - pause: { duration: {{ .pause }} }
        {{- else }}
        - pause: {}
        {{- end }}
        {{- end }}
      {{- with $canary.analysis }}
      analysis:
        templates:
          - templateName: {{ . }}
        startingStep: 1
      {{- end }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: choregos-api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: choregos-api
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
      annotations:
        # Une rotation de secret redéploie les pods : sinon la clé tourne sans effet.
        checksum/config: {{ toJson .Values | sha256sum }}
    spec:
      serviceAccountName: choregos-api
      {{- include "choregos.imagePullSecrets" $ | nindent 6 }}
      {{- include "choregos.antiAffinity" (dict "global" .Values.global "labels" (dict "app.kubernetes.io/name" "choregos-api" "app.kubernetes.io/instance" .Release.Name)) | nindent 6 }}
      {{- with .Values.hostAliases }}
      # Un fournisseur OIDC dont le nom ne résout pas depuis le cluster (split-horizon) :
      # épinglé ici plutôt que résolu — une politique réseau par FQDN ne verrait jamais
      # ce trafic, elle ne voit que ce qui passe par le DNS.
      hostAliases: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.global.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "choregos.image" (dict "global" .Values.global "image" .Values.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext: {{- toYaml .Values.global.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          {{- with .Values.global.toolCatalog.credentialsSecret }}
          # Les clés des fournisseurs du catalogue. En bloc et PAR RÉFÉRENCE : une clé
          # recopiée dans la spec du déploiement serait lisible par qui peut lire un pod.
          envFrom:
            - secretRef: { name: {{ . }} }
          {{- end }}
          env:
            {{- with .Values.global.toolCatalog.configMap }}
            - name: CHOREGOS_TOOL_CATALOG
              value: {{ printf "%s/%s" $.Values.global.toolCatalog.mountPath $.Values.global.toolCatalog.fileName | quote }}
            {{- end }}
            {{- with .Values.global.workflowTemplates.configMap }}
            - name: CHOREGOS_WORKFLOW_TEMPLATES_DIR
              value: {{ $.Values.global.workflowTemplates.mountPath | quote }}
            {{- end }}
            {{- include "choregos.commonEnv" . | nindent 12 }}
            - name: CHOREGOS_OIDC_ISSUER
              value: {{ .Values.global.oidc.issuer | quote }}
            - name: CHOREGOS_OIDC_CLIENT_ID
              value: {{ .Values.global.oidc.clientId | quote }}
            - name: CHOREGOS_OIDC_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.global.oidc.secretRef }}, key: client-secret } }
            - name: CHOREGOS_OIDC_DEFAULT_ORG
              value: {{ .Values.global.oidc.defaultOrg | default "" | quote }}
            # Toujours posée, même à `false` : une valeur absente laisserait le défaut du
            # code décider, et c'est précisément ce qui a ouvert l'API en production.
            - name: CHOREGOS_BOOTSTRAP_ORG
              value: {{ .Values.global.bootstrap.org | default "" | quote }}
            - name: CHOREGOS_BOOTSTRAP_ORG_NAME
              value: {{ .Values.global.bootstrap.orgName | default "" | quote }}
            - name: CHOREGOS_BOOTSTRAP_ADMINS
              value: {{ .Values.global.bootstrap.admins | default "" | quote }}
            - name: CHOREGOS_DEV_LOGIN_ENABLED
              value: {{ .Values.global.devLogin.enabled | default false | quote }}
            - name: CHOREGOS_DEV_ADMIN_EMAILS
              value: {{ .Values.global.devLogin.adminEmails | default "" | quote }}
            # STRUCTURELLES, jamais optionnelles : une API qui démarre sans secret de
            # session signe des cookies avec une valeur vide, et une clé de jeton de run
            # absente fait repartir chaque processus sur une paire éphémère — l'agent reçoit
            # alors « Signature verification failed », un message qui accuse le jeton.
            # Les autres clés de ce secret sont optionnelles : leur absence est une
            # fonctionnalité éteinte, pas un déploiement cassé. Le locataire dev l'a payé le
            # 2026-09-26 : `generic-webhook-secret` absent du modèle InfisicalSecret, et
            # TOUTE l'API en CreateContainerConfigError.
            - name: CHOREGOS_SESSION_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.global.apiSecretRef }}, key: session-secret } }
            - name: CHOREGOS_RUN_TOKEN_PRIVATE_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.global.apiSecretRef }}, key: run-token-private-key } }
            - name: CHOREGOS_RUN_TOKEN_PUBLIC_KEY
              # Optionnelle : elle se DÉDUIT de la privée (`public_from_private`).
              valueFrom: { secretKeyRef: { name: {{ .Values.global.apiSecretRef }}, key: run-token-public-key, optional: true } }
            - name: CHOREGOS_GITHUB_WEBHOOK_SECRET
              # Optionnelle : pas de GitHub, pas de secret — et vide, l'API refuse en staging/prod.
              valueFrom: { secretKeyRef: { name: {{ .Values.global.apiSecretRef }}, key: github-webhook-secret, optional: true } }
            - name: CHOREGOS_GENERIC_WEBHOOK_SECRET
              # Optionnelle : vide, `verify_shared_secret` rend False : Jira, GitLab et le webhook générique refusent.
              valueFrom: { secretKeyRef: { name: {{ .Values.global.apiSecretRef }}, key: generic-webhook-secret, optional: true } }
            - name: CHOREGOS_GITHUB_APP_ID
              # Optionnelle : un locataire sans App GitHub n'en a pas.
              valueFrom: { secretKeyRef: { name: {{ .Values.global.apiSecretRef }}, key: github-app-id, optional: true } }
            - name: CHOREGOS_GITHUB_APP_PRIVATE_KEY
              # Optionnelle : un locataire sans App GitHub n'en a pas.
              valueFrom: { secretKeyRef: { name: {{ .Values.global.apiSecretRef }}, key: github-app-private-key, optional: true } }
            - name: CHOREGOS_GATEWAY_MASTER_KEY
              valueFrom: { secretKeyRef: { name: {{ include "choregos.gatewaySecret" . }}, key: master-key } }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with .Values.global.toolCatalog.configMap }}
            - { name: catalogue, mountPath: {{ $.Values.global.toolCatalog.mountPath }}, readOnly: true }
            {{- end }}
            {{- with .Values.global.workflowTemplates.configMap }}
            - { name: workflow-templates, mountPath: {{ $.Values.global.workflowTemplates.mountPath }}, readOnly: true }
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- with .Values.global.toolCatalog.configMap }}
        - name: catalogue
          configMap: { name: {{ . }} }
        {{- end }}
        {{- with .Values.global.workflowTemplates.configMap }}
        - name: workflow-templates
          configMap: { name: {{ . }} }
        {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: choregos-api
{{- end }}
