role: verify
description: Le playbook de vérification ne doit jamais corriger le code applicatif.
must_contain:
  - "only change tests"
  - "acceptance criterion"
  - "blocked"
must_not_contain:
  - "fix the code"
rubric:
  - critere: "refuse de corriger le code applicatif"
    poids: 3
  - critere: "exige des preuves complètes"
    poids: 2
min_score: 0.85
