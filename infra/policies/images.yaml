# The platform's and the runners' images are signed by the publisher and referenced by
# digest. An unsigned image does not start — it is a mechanism, not a guideline.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: choregos-verify-images
  annotations:
    policies.kyverno.io/description: >-
      Verifies the cosign signature of the Choregos images and requires the reference by digest.
spec:
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-signature
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["choregos", "choregos-*", "proj-*"]
      verifyImages:
        - imageReferences: ["ghcr.io/graalsystems/choregos-*"]
          attestors:
            - entries:
                - keyless:
                    subject: "https://github.com/graalsystems/tranibor/.github/workflows/*"
                    issuer: "https://token.actions.githubusercontent.com"
                    # Kyverno 1.12 refuses a keyless attestor that names no transparency log.
                    rekor: { url: "https://rekor.sigstore.dev" }
          mutateDigest: true
          required: true
        # The same images under the core's name (ADR 0176 R3): a release pushes one digest under both
        # names, each signed by its workflow. Each component is named: the glob `tranibor-*` would
        # catch `ghcr.io/graalsystems/tranibor-agents/<server>`, the plugin servers, which another
        # repository signs (`plugin-servers.yaml`), and refuse them for a signature they never carry.
        - imageReferences:
            - "ghcr.io/graalsystems/tranibor-api*"
            - "ghcr.io/graalsystems/tranibor-orchestrator*"
            - "ghcr.io/graalsystems/tranibor-tools*"
            - "ghcr.io/graalsystems/tranibor-web*"
            - "ghcr.io/graalsystems/tranibor-runner*"
            - "ghcr.io/graalsystems/tranibor-laya*"
            - "ghcr.io/graalsystems/tranibor-outpost*"
          attestors:
            - entries:
                - keyless:
                    subject: "https://github.com/graalsystems/tranibor/.github/workflows/*"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor: { url: "https://rekor.sigstore.dev" }
          mutateDigest: true
          required: true
        # The images published before the publication moved (0.27.10 and older) stay in the frozen
        # namespace and keep their signatures, issued by the repositories as they were then named:
        # `VargaFoundation/choregos` and `VargaFoundation/ecphoria` (cosign, #1861). These two subjects
        # are history, not the publishing identity: a move of the publication never rewrites them
        # (`tests/charts/test_frozen_image_signers.py`).
        - imageReferences: ["ghcr.io/vargafoundation/choregos-*"]
          attestors:
            - entries:
                - keyless:
                    subject: "https://github.com/VargaFoundation/choregos/.github/workflows/*"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor: { url: "https://rekor.sigstore.dev" }
          mutateDigest: true
          required: true
        - imageReferences: ["ghcr.io/vargafoundation/ecphoria*"]
          attestors:
            - entries:
                - keyless:
                    subject: "https://github.com/VargaFoundation/ecphoria/.github/workflows/*"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor: { url: "https://rekor.sigstore.dev" }
          mutateDigest: true
          required: true
        # Ecphoria belongs to the publisher but not to this repository: its images are signed by
        # the workflows of `graalsystems/ecphoria`. With the pattern above alone, the glob
        # `ghcr.io/graalsystems/*` caught `ghcr.io/graalsystems/ecphoria` and demanded a
        # signature issued by a repository that never produced it — the platform's memory would
        # not have started, and the message would have talked about a missing signature.
        - imageReferences: ["ghcr.io/graalsystems/ecphoria*"]
          attestors:
            - entries:
                - keyless:
                    subject: "https://github.com/graalsystems/ecphoria/.github/workflows/*"
                    issuer: "https://token.actions.githubusercontent.com"
                    # Kyverno 1.12 refuses a keyless attestor that names no transparency log.
                    rekor: { url: "https://rekor.sigstore.dev" }
          mutateDigest: true
          required: true
