{{- if .Values.enabled }}
# The orchestrator's rights on the `proj-*-runners` namespaces are **generated by the
# provisioning** (one Role + RoleBinding per project, written to `choregos-infra/projects/<slug>/`).
# Here, no cluster-wide right is granted: this is deliberate.
apiVersion: v1
kind: ConfigMap
metadata:
  name: choregos-orchestrator-rbac-note
  labels: {{- include "choregos.labels" . | nindent 4 }}
data:
  README: |
    The orchestrator has no ClusterRole. Each provisioned project creates, in its
    runners namespace, a Role allowing the creation of PipelineRun, Secret and
    ConfigMap, bound to the `choregos-orchestrator` ServiceAccount of the platform namespace.
{{- end }}
