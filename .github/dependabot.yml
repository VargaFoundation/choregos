# The plan asks for Dependabot or Renovate from the day the repository is created
# (`docs/plan/07-delivery-parallelisation-conventions.md` §Bootstrap).
#
# Everything is grouped. The experience next door, on `graalsystems/ecphoria`, is clear: without
# groups, nineteen open PRs in a month, several impossible to merge on their own —
# three RustCrypto bumps that were a single change, five actions that were only
# one runtime migration. An upgrade that touches four packages at once is **one**
# decision, not four.
version: 2
updates:
  # Third-party CI actions: supply-chain hygiene. Every `uses:` is pinned to a commit SHA with its
  # version in a trailing comment (S80-04, `tests/architecture/test_supply_chain_pinned.py`):
  # Dependabot reads the comment and moves the SHA and the comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # Python: the uv workspace at the root (packages/*, apps/api, apps/orchestrator, tools).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      # Temporal, its SDK and the activities built on it move together.
      temporal:
        patterns: ["temporalio*"]
      # The HTTP and validation stack: httpx, pydantic and fastapi share types.
      web-stack:
        patterns: ["fastapi*", "starlette*", "uvicorn*", "httpx*", "pydantic*"]
      # The rest, minor and patch only. Majors stay on their own, so they get read.
      python-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Front Next.js (pnpm).
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    groups:
      next:
        patterns: ["next", "react", "react-dom", "@types/react*", "eslint-config-next"]
      web-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The editor extension (pnpm, ADR 0155). `@types/vscode` is pinned to the oldest editor the manifest
  # accepts (`engines.vscode`): a newer one would type APIs that editor does not have.
  - package-ecosystem: npm
    directory: /apps/vscode
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "@types/vscode"
    groups:
      vscode-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The phone app (Gradle, ADR 0193). AGP, Kotlin and Compose move together, so they are one group; the
  # wrapper is pinned by checksum and bumped by hand (docs/android.md).
  - package-ecosystem: gradle
    directory: /apps/android
    schedule:
      interval: weekly
    groups:
      android-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Base images of the Dockerfiles. A single PR: most share `python:3.12-slim`, the
  # console starts from `node:24`, and moving them out of step with each other makes no sense. An upgrade to
  # a Node version that is not LTS gets closed: the rule is in `docker/README.md`.
  # Every `FROM` is pinned to `tag@sha256:<digest>` (S80-04): Dependabot bumps the digest of a tag
  # that was rebuilt, and the tag and the digest together on a version bump.
  - package-ecosystem: docker
    directories: ["/docker", "/examples/agents/*", "/tests/cluster/assets"]
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
    # The bases follow the LTS lines (`docker/README.md`). `python` follows `requires-python`
    # (3.12 only) and `uv.lock`: a newer interpreter in the image breaks `uv sync --frozen`, so the
    # move is a workspace change, not a tag bump. `node` stays on 24: 25 is Current, never LTS, and
    # dropped corepack, which `web.Dockerfile` uses for pnpm; 26 needs pnpm installed another way.
    ignore:
      - dependency-name: "python"
        versions: [">=3.13"]
      - dependency-name: "node"
        versions: [">=25"]

  # The third-party images of the compose files (the local install, the dev stack, the live tests),
  # pinned by digest like the Dockerfiles (S80-04). One PR: they are one stack.
  - package-ecosystem: docker-compose
    directories: ["/", "/dev", "/tests/live/*"]
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ["*"]
