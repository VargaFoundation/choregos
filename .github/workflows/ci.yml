# CI des PR : ciblée par chemins, pour qu'une PR front n'attende pas les tests Python.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    # `dorny/paths-filter` demande à l'API la liste des fichiers de la PR. Le `GITHUB_TOKEN`
    # d'une PR Dependabot est en lecture seule et ne porte que ce que le workflow déclare :
    # sans `pull-requests: read`, l'action sort sur « Resource not accessible by integration »
    # et aucun filtre n'est calculé.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      web: ${{ steps.filter.outputs.web }}
      charts: ${{ steps.filter.outputs.charts }}
      contracts: ${{ steps.filter.outputs.contracts }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            python:
              - 'packages/**'
              - 'apps/api/**'
              - 'apps/orchestrator/**'
              - 'tools/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
            web:
              - 'apps/web/**'
              - 'packages/contracts/ts/**'
            charts:
              - 'charts/**'
              - 'infra/**'
            contracts:
              - 'packages/contracts/**'
            docker:
              - 'docker/**'

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    # Un vrai PostgreSQL : la RLS n'existe pas sur SQLite, et elle a été « testée » pendant une
    # semaine sans jamais tourner (état des lieux du 2026-09-24). `test_rls_postgres.py` ne
    # s'exécute que si CHOREGOS_TEST_DATABASE_URL est posée.
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: choregos, POSTGRES_PASSWORD: choregos, POSTGRES_DB: choregos_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U choregos" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CHOREGOS_TEST_DATABASE_URL: postgresql+asyncpg://choregos:choregos@localhost:5432/choregos_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv sync --frozen
      - name: lint
        run: uv run ruff check packages apps/api apps/orchestrator tools tests && uv run ruff format --check packages apps/api apps/orchestrator tools tests
      - name: typage
        run: uv run mypy packages/*/src apps/api/src apps/orchestrator/src tools
      - name: tests et couverture
        run: uv run pytest --cov --cov-report=xml -q
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: coverage, path: coverage.xml, if-no-files-found: ignore }

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: les types générés sont à jour
        run: uv run python tools/gen_contracts.py --check
      - name: exemples valides contre les schémas et les modèles
        run: uv run pytest packages/contracts -q

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/web }
    steps:
      - uses: actions/checkout@v7
      # Sans `version` : l'action lit `packageManager` dans `apps/web/package.json`. Une
      # version écrite ici aussi finit par diverger — c'est ce qui laissait la CI en pnpm 9
      # alors que le dépôt était passé à 12.
      - uses: pnpm/action-setup@v6
        with: { package_json_file: apps/web/package.json }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Les parcours Playwright et le passage d'axe tournent contre le build en mode démo :
      # un écran inaccessible ou un parcours cassé se voit ici, pas chez un utilisateur.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env: { CI: "true" }
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-report, path: apps/web/playwright-report, retention-days: 7 }

  charts:
    needs: changes
    if: needs.changes.outputs.charts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with: { version: v3.22.0 }
      - run: helm lint charts/choregos
      - name: rendu des quatre environnements (local = les dépendances embarquées)
        run: |
          for env in local dev staging prod; do
            helm template choregos charts/choregos -f charts/choregos/values/$env.yaml > /tmp/$env.yaml
          done
      - name: kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz
          ./kubeconform -strict -ignore-missing-schemas -summary /tmp/prod.yaml
      - name: helm unittest
        run: |
          # Version épinglée : le plugin suit Helm de près — `platformHooks` dans son
          # plugin.yaml exige Helm ≥ 3.18, et sur une version plus ancienne l'installation
          # échoue. Le `|| true` d'avant avalait cet échec et le transformait en
          # « unknown command "unittest" » deux lignes plus bas.
          helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.1.2
          helm unittest charts/choregos

  conformance-backends:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: conformité du backend par défaut (les autres tournent la nuit)
        run: uv run pytest tests/conformance/backends -m conformance -q -k "default or protocol"
      - name: conformité des templates (connecteurs, étapes, scaffold)
        run: uv run pytest tests/conformance/templates -m conformance -q

  images:
    needs: changes
    if: needs.changes.outputs.docker == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      # Sans ceci, la première image en échec annule les quatre autres et on ne sait pas si
      # elles allaient passer — c'est exactement ce qui s'est produit au premier passage.
      fail-fast: false
      matrix:
        include:
          # `api` et `orchestrator` sortent du même Dockerfile, à deux cibles près : même
          # dépendances, même code, même commit. Voir docker/api.Dockerfile.
          - image: api
            file: docker/api.Dockerfile
            target: api
          - image: orchestrator
            file: docker/api.Dockerfile
            target: worker
          - image: tools
            file: docker/tools.Dockerfile
          - image: web
            file: docker/web.Dockerfile
          - image: runner
            file: docker/runner.Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          # L'identité qui pousse ne dépend pas de qui a déclenché le workflow.
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: ${{ github.ref == 'refs/heads/main' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/vargafoundation/choregos-${{ matrix.image }}:${{ github.sha }}
          # SBOM et provenance SLSA attachés à l'image (attestations BuildKit). SECURITY.md
          # les promettait depuis le début ; aucun n'existait (état des lieux du 2026-09-24).
          sbom: ${{ github.ref == 'refs/heads/main' }}
          provenance: ${{ github.ref == 'refs/heads/main' && 'mode=max' || 'false' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: scan Trivy (aucun CRITICAL toléré)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/vargafoundation/choregos-${{ matrix.image }}:${{ github.sha }}
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true
        if: github.ref == 'refs/heads/main'
      - uses: sigstore/cosign-installer@v3
        if: github.ref == 'refs/heads/main'
      - name: signature keyless
        if: github.ref == 'refs/heads/main'
        run: cosign sign --yes ghcr.io/vargafoundation/choregos-${{ matrix.image }}@${{ steps.build.outputs.digest }}

  secrets:
    # Un secret commité ne se rattrape pas : il est déjà dans l'historique. Deux fichiers
    # avaient un `noqa S105` et deux bases SQLite étaient suivies par git — sans qu'un scan
    # le voie (état des lieux du 2026-09-24).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 \
            detect --source /repo --config /repo/.gitleaks.toml --redact --exit-code 1 --no-banner

  ci-ok:
    # Cible unique pour la protection de branche et la merge queue.
    #
    # `images` en fait partie : sans lui, la porte était verte alors qu'aucune des cinq images
    # de la plateforme ne se construisait — c'est exactement ce qui s'est passé au premier
    # passage de cette CI. Trois minutes d'attente contre une branche `main` dont on ne peut
    # rien déployer, le compte est vite fait.
    #
    # `changes` en fait partie aussi : quand le calcul des filtres échoue, tous les jobs qui en
    # dépendent sont *sautés*, et une porte qui ne regarde que des jobs sautés est verte. Une PR
    # Dependabot est passée comme ça, sans qu'une seule ligne n'ait été testée.
    needs: [changes, python, contracts, web, charts, conformance-backends, images, secrets]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: vérifier qu'aucun job requis n'a échoué
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          echo "$results" | grep -q '"result": "failure"' && exit 1
          echo "$results" | grep -q '"result": "cancelled"' && exit 1
          exit 0
