# The trial's workflow on the dev tenant: the agent investigates a finding and proposes a PR; the
# proposal waits for the decision of a re-authenticated human, outside the workflow (the action
# engine of the extension). The work item closes when a human accepts it.
apiVersion: choregos/v1
kind: Workflow
metadata: { name: essai-it4it, version: 1 }  # lang: fr-ok
actors:
  analyst: { type: agent, role: infra_analysis, model: "profile:standard", max_turns: 30, max_minutes: 20 }
  operator: { type: human, group: maintainers, sla_hours: 24 }
states:
  inbox: { display: To investigate, kind: wait }
  propose: { display: PR proposed }
  done: { display: Closed, terminal: true }
  needs_human: { display: To pick up, kind: wait }
transitions:
  - id: t-investigate
    from: inbox
    to: propose
    by: analyst
    outputs: [proposal, finding]
    gates: [outputs_present]
    on_fail: { to: inbox, max_attempts: 2, escalate_to: needs_human }
  - id: t-close
    from: propose
    to: done
    by: operator
    timeout_hours: 72
defaults:
  from_any_agent_state:
    on_question: needs_human
    on_budget_exceeded: needs_human
    on_timeout: needs_human
