# Versions of the ACP agents installed in the `choregos-runner` image.
# Renovate proposes the upgrades; each bump goes through the conformance suite (S2-11).
#
# A line annotated `# renovate: datasource=… depName=…` is tracked automatically.
# The others are pinned by hand until their upstream source is confirmed:
# better a missing tracking than an invented repository on which Renovate would open false
# PRs.
#
# The image installs three of these agents (`claude-agent-acp`, `gemini-cli`, `opencode`) and
# calls each one at build time. The other lines describe supported backends whose
# binary the image does not carry.
# OpenHands was removed on 2026-09-21 (docs/adr/0011-openhands-removed.md).
# npm `@agentclientprotocol/claude-agent-acp`, binary `claude-agent-acp` (#436); it replaces the
# deprecated `@zed-industries/claude-code-acp`.
claude-agent-acp=0.85.1
codex-acp=0.4.2
# renovate: datasource=github-releases depName=google-gemini/gemini-cli
gemini-cli=0.60.0
# renovate: datasource=github-releases depName=block/goose
goose=1.9.0
# renovate: datasource=github-releases depName=sst/opencode
# 0.8.3 never existed on npm: the 0.8 line of `opencode-ai` stops at 0.8.0. The first
# image build in a CI said so (`npm error notarget`); nobody had heard it
# because the installation was followed by `|| echo`. 0.8.0 carries CVE-2026-22813, fixed
# in 1.1.10, hence 1.x and not the nearest neighbour of the original pin.
opencode=1.18.31
# S40-25b: `@opencode-ai/plugin`, which opencode installs from npm into every config directory at
# start. The image bakes it into opencode's config root, so a run asks the registry for nothing.
# Same release train as `opencode`: bump both together (a test refuses a mismatch).
opencode-plugin=1.18.31
copilot-cli=0.3.0
# rtk (ADR 0055): not an agent, a shell-output filter the image carries for every backend.
# Each digest is checked at build time, and a wrong one fails the build. When Renovate bumps
# the version alone, the old digests fail it too, so a bump never ships an unverified binary.
# amd64 installs the static musl release binary. arm64 builds the release's source, because
# upstream's aarch64 binary needs glibc 2.39 and bookworm has 2.36. `cargo --locked` then checks
# every crate against the lock file of that source.
# renovate: datasource=github-releases depName=rtk-ai/rtk
rtk=0.50.0
rtk-sha256-x86_64-unknown-linux-musl=bc2b8902b0d9c796c82ef45f16ae2307e17757afeca5ee156235a3dc7bda5f89
rtk-sha256-source=428702395b6593268df073e7724a548fdc98be4a3cdf61656a6678e304a690a8
