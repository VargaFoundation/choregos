# Optionnel, désactivé par défaut (voir README.md de ce dossier).
name: claude-mention
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  respond:
    if: ${{ false }} # activez en remplaçant par contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Répondre à la mention
        run: echo "Activez ce workflow en connaissance de cause (voir README.md)."
