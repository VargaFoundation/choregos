  - { tool: cilium__get_flows, kind: network_policy, operation: get_flows, arguments: { namespace: shipping, verdict: DROPPED, last: 2000 } }
  - { tool: cilium__get_flows, kind: network_policy, operation: get_flows, arguments: { namespace: notifications, verdict: DROPPED, last: 2000 } }
  - { tool: cilium__get_flows, kind: network_policy, operation: get_flows, arguments: { namespace: analytics, verdict: DROPPED, last: 2000 } }
  - { tool: cilium__get_flows, kind: network_policy, operation: get_flows, arguments: { namespace: monitoring, verdict: DROPPED, last: 2000 } }
  - { tool: cilium__get_flows, kind: network_policy, operation: get_flows, arguments: { namespace: ingress, verdict: DROPPED, last: 2000 } }
