apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: choregos-quotas-et-runtime
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: quota-present
      match:
        any:
          - resources:
              kinds: [Namespace]
              names: ["proj-*"]
      validate:
        message: "un namespace de projet doit avoir une ResourceQuota (générée par le provisioning)"
        deny:
          conditions:
            all:
              - key: "{{ request.object.metadata.labels.\"choregos/project\" || '' }}"
                operator: Equals
                value: ""
    # gVisor is enforced per project by the `require-gvisor` Policy that provisioning writes
    # (gitops.render_project_manifests). A cluster-wide rule here keyed on a pod label that
    # nothing sets never applied to anything (finding #790).
