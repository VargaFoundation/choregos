[project]
name = "choregos-adapters"
version = "0.6.0"
description = "Adaptateurs Choregos : tracker, scm, ci, cd, executor, memory, gateway, notify"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = ["choregos-core", "httpx>=0.27", "pydantic>=2.9", "structlog>=24.4", "PyYAML>=6.0", "cryptography>=43.0", "PyJWT>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/choregos_adapters"]
