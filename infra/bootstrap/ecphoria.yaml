# Ecphoria — la mémoire de la plateforme, vague 2 (après les opérateurs, avant les workloads).
#
# Le chart vit dans `VargaFoundation/ecphoria` (`deploy/helm/ecphoria`) : un StatefulSet à trois
# réplicas Raft, un service headless pour la découverte des pairs, un PDB. Il a été rendu et
# accepté par un serveur d'API réel — voir `docs/plan/STATUS.md`, S7-06.
#
# Sans Ecphoria, la plateforme fonctionne : `memory.pgvector` implémente la même interface et le
# context pack se dégrade en pack vide (docs/plan/04). C'est pourquoi cette Application peut être
# retirée sans rien casser d'autre.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecphoria
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '2'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/VargaFoundation/ecphoria.git
    # Un tag, pas `main` : toutes les autres applications de ce répertoire pointent une
    # version (`0.23.0`, `3.3.4`, …), et la ClusterPolicy `choregos-verify-images` refuse
    # par ailleurs les références d'images mouvantes. Suivre `main` faisait exactement ce
    # qu'on interdit ailleurs — un déploiement qui change sans qu'on ait rien décidé.
    # Le chart prend l'image de son `appVersion`, donc ce tag fixe les deux.
    targetRevision: v0.2.3
    path: deploy/helm/ecphoria
    helm:
      values: |
        replicaCount: 3
        config:
          memory:
            cognition:
              # Le banc au profil Choregos (20 000 faits, 200 000 événements, 50 lectures/s)
              # mesure 540 ms p95 au défaut de 2048, et 24 ms à 512 — sans coût de rappel
              # mesurable à cette taille de corpus (kb_eval : R@5 86,1 % contre 84,7 %).
              # Le défaut amont est dimensionné pour un corpus dix fois plus gros : à remesurer
              # avec `kb_eval` si le nôtre dépasse ~50 000 mémoires.
              # Voir docs/benchmarks-choregos.md dans VargaFoundation/ecphoria.
              retrievalScanCap: 512
            governance:
              tenants:
                # `warn` d'abord : les écritures de Choregos portent déjà
                # `provenance.source` et un `kind` typé, mais une seule contre-preuve suffit à
                # bloquer un run. On regarde `ecphoria_fact_validation_failures_total` une
                # semaine, puis on passe à `strict` et `requireProvenance: true`.
                choregos:
                  factValidation: warn
          gateway:
            authEnabled: true
            # Les clés viennent du coffre via External Secrets. Le chart accepte des entrées
            # hachées (`sha256:<hex>@tenant:role`) : rien de déchiffrable ne transite par Argo.
            apiKeys: []
          embedding:
            # La passerelle de la plateforme sert aussi les embeddings : un seul endroit où le
            # coût est mesuré et où le débit est limité (docs/plan/04 §4.2).
            provider: openai_compatible
            openaiBaseUrl: http://litellm.choregos-gateway:4000/v1
            model: platform/embed
            dimension: 1536
  destination:
    server: https://kubernetes.default.svc
    namespace: choregos-memory
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
