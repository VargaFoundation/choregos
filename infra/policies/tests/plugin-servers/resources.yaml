  namespace: choregos-plugins
spec:
  containers:
  - name: server
    image: ghcr.io/vargafoundation/choregos-agents/servicenow-mcp@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    securityContext: &id001
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: RuntimeDefault
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  automountServiceAccountToken: false
  initContainers:
  - name: setup
    image: busybox:1.36
    securityContext: *id001
