# Platform default values. Each environment overrides what concerns it
# in `choregos-infra/platform/overlays/<env>/values.yaml`.

global:
  domain: choregos.local
  # Overrides when the hosts do not follow `app.<domain>` / `api.<domain>` over HTTPS
  # (e.g. an internal HTTP ingress behind a VPN). Empty: derived from `domain`.
  publicUrl: ""
  apiUrl: ""
  imageRegistry: ghcr.io/vargafoundation
  imageTag: "0.17.15"
  imagePullPolicy: IfNotPresent
  # Images are referenced by digest in staging and prod (Kyverno policy).
  imageDigest: ""
  # Image pull secrets, for a private registry — an enterprise edition, a closed
  # Harbor mirror, a home-made image. Empty: all the images are public. The secret must
  # exist in the namespace; on a shared platform, it is usually the tenant's
  # base layer that sets it (for example from a secret store), not this chart.
  imagePullSecrets: []
  environment: dev
  # Edition announced by this deployment (ADR 0024). `community` is the default, and the most
  # restrictive: a single organization. `enterprise` requires enterprise edition images —
  # the API REFUSES to start if no enterprise plugin has declared itself, rather than looking
  # healthy and refusing the second organization weeks later.
  edition: community
  fakes: false
  # Secrets by reference (ADR 0034). A connector's `env:NAME` reference reads only the variables
  # matching `envPattern` (regular expression); empty: `^CONNECTOR_[A-Z0-9_]+$`. The platform's
  # own variables (`CHOREGOS_*`, `DATABASE_*`, `PG*`, `AWS_*`, `KUBERNETES_*`, `TEMPORAL_*`) are
  # refused whatever the pattern says. Given to the API and to each worker.
  secrets:
    envPattern: ""
  # Additional environment variables, given to the API, to each worker and to the migration Job
  # (through `choregos.commonEnv`). To enable a setting the chart does not know
  # yet — for example a plugin shipped inactive (`CHOREGOS_ESSAI_ONTOLOGIE: "1"`) — without forking the
  # chart. A variable already set by the chart is REFUSED at render time: two values for the same
  # name, Kubernetes keeps the last one without saying anything, and the chart's setting would be replaced
  # silently. Plain values only: a secret goes through a `Secret`, never through here.
  extraEnv: []
  #   - name: CHOREGOS_ESSAI_ONTOLOGIE
  #     value: "1"
  # Platform canary (S7-08). Disabled by default: it requires Argo Rollouts in the
  # cluster, and a chart that assumes an absent operator is a chart that does not install.
  # Environments that enable it do so in `values/staging.yaml` and `values/prod.yaml`.
  canary:
    enabled: false
    steps:
      - { weight: 10, pause: 5m }
      - { weight: 50, pause: 10m }
      - { weight: 100 }
    # `AnalysisTemplate` that decides to abort: without it, the canary just waits.
    analysis: ""
  # Playbooks brought by the DEPLOYMENT (a ConfigMap, one key per role: `<role>.md`),
  # mounted in the workers and read before those of the package. This is what allows using the
  # engine outside software — a `sourcing`, `instruction_dossier` role — or adapting an existing
  # role to a house, without touching the platform.
  playbooks:
    configMap: ""
    mountPath: /etc/choregos/playbooks
  # Tool catalog: third-party APIs that the PLATFORM calls for an agent, key
  # kept server-side. A ConfigMap (the catalog, readable in PRs) and a Secret (the
  # providers' keys, injected into the API). Empty = no tool, and that is the default.
  # A project then declares what it is allowed to call (`tools` in its configuration).
  # Workflow templates brought by the deployment, in addition to the package's three. A
  # deployment template takes precedence over the package's, as with playbooks; this is
  # how a trade brings its state sequences without rewriting the platform. Empty:
  # only the three shipped ones exist.
  workflowTemplates:
    configMap: ""
    mountPath: /etc/choregos/workflow-templates
  toolCatalog:
    configMap: ""
    mountPath: /etc/choregos/outils
    fileName: catalogue.yaml
    #: Secret whose ALL keys become environment variables of the API:
    #: this is where the providers' keys live, never in the catalog.
    credentialsSecret: ""
  # What THIS deployment can run: a new project inherits it when its request says
  # nothing (#245). Empty: the contract decides (`claude-code`, no model profile). A tenant that
  # serves opencode behind the platform's gateway says so here, without which the agents of a
  # template never reach their model.
  agents:
    defaultBackend: ""
    allowedBackends: []
    # profile → gateway model: `{ standard: platform/standard }`
    modelProfiles: {}
  logLevel: INFO
  # Anti-affinity between the replicas of a same component: `soft` (preferred), `hard`
  # (one replica per node, otherwise no pod) or `none`.
  antiAffinity: soft
  serviceAccount:
    annotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile: { type: RuntimeDefault }
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: { drop: ["ALL"] }
  database:
    # `true`: the chart deploys a single-instance PostgreSQL (bench, demo). `false`: it
    # consumes the one described below. Same logic for the next three dependencies.
    embedded: false
    host: choregos-pg-rw.choregos-data.svc
    port: 5432
    name: choregos
    # Administration role of the embedded PostgreSQL (POSTGRES_USER, superuser).
    user: choregos
    # Role the API and the orchestrator connect to the EMBEDDED PostgreSQL with: created
    # without SUPERUSER at initdb, because a superuser ignores RLS and
    # organization isolation then does not exist. The API refuses a superuser in
    # staging/prod. With an external database (`secretRef`, key `url`), the URL decides.
    appUser: choregos_app
    secretRef: choregos-db
    # Instead of `secretRef` (key `url`): the secret of an operator that carries only the
    # password (Zalando: `<user>.<cluster>.credentials.postgresql.acid.zalan.do`).
    passwordSecret: ""
    # Connection pool of EACH process (API replica, worker): at most
    # size + maxOverflow connections, a bounded wait beyond that. Size PostgreSQL's
    # `max_connections` accordingly: (API replicas + workers) × (size + maxOverflow).
    pool:
      size: 10
      maxOverflow: 5
      timeoutSeconds: 10
  temporal:
    embedded: false
    address: temporal-frontend.choregos-temporal.svc:7233
    namespace: default
  gateway:
    # The gateway adapter: `litellm` (default), `openai-compatible` (discovery only), `direct`.
    type: litellm
    embedded: false
    url: http://litellm.choregos-gateway.svc:4000
    # Gateway secret (key `master-key`). Empty with `embedded: true`: the chart
    # generates one, stable from one update to the next.
    secretRef: choregos-gateway-secrets
  memory:
    embedded: false
    url: http://ecphoria.choregos-memory.svc:8432
    # Secret (key `token`) of a memory that requires an API key. Empty: no header.
    tokenSecret: ""
  objectStore:
    url: s3://choregos
    # The S3 endpoint of an S3-compatible store (RustFS, MinIO, Ceph); empty means AWS (ADR 0049).
    endpoint: ""
    region: us-east-1
    # Secret with the keys `access-key` and `secret-key`. Only the API reads and writes the
    # store; a runner never receives these keys. Empty: no signature (an open or IAM-bound store).
    secretRef: ""
  oidc:
    issuer: https://keycloak.choregos.local/realms/choregos
    clientId: choregos
    secretRef: choregos-oidc
    # Organization to attach the NON-prefixed OIDC groups to (`developers`,
    # `org-admins`…). Empty: only `choregos:<org>:<group>` groups give a role.
    defaultOrg: ""
  # The MCP gateway as an OAuth resource server (ADR 0030, RFC 9728): the console's IdP issues the
  # tokens of Claude Code and claude.ai, with no token to paste. What the IdP must carry (scope
  # `choregos-mcp`, clients): docs/runbooks/keycloak-mcp.md.
  mcp:
    oauth:
      enabled: false
      # Empty: the console's issuer (`global.oidc.issuer`). Set only for ANOTHER IdP.
      issuer: ""
      # The required audience of the gateway's tokens.
      audience: choregos-mcp
      # The clients the IdP has registered, per client of the Integrations page — the page derives
      # the exact command from them. `callbackPort`: the port of the registered `http://localhost:PORT/callback`.
      #   claude-code: { clientId: choregos-claude-code, callbackPort: 33418 }
      #   claude-ai: { clientId: choregos-claude-ai }
      clients: {}
  # Bootstrap of a new installation: the organization created at first start if it
  # is missing, and the e-mails that receive org_admin there. Idempotent. Without this, no route
  # nor any screen can create the first organization.
  bootstrap:
    org: ""
    orgName: ""
    admins: ""
  # Development login (`/auth/login?as=<email>`), without an IdP. NEVER in production:
  # the API refuses it by itself in staging/prod. `adminEmails`: who receives ORG_ADMIN.
  devLogin:
    enabled: false
    adminEmails: ""
  # `false` for a tenant that has no right to any cluster-scoped resource (AppProject
  # `clusterResourceWhitelist: []`): the PipelineRun read ClusterRole is not rendered.
  rbac:
    clusterScoped: true
    # Role + RoleBinding (namespace) allowing the orchestrator to launch its agent Jobs.
    # On a shared platform, it is the platform that lays it down: leave `false`.
    jobRunner: false
  # The secret that carries the API's values: session secret, run-token signing
  # key, GitHub App. The orchestrator reads the SAME signing key there — it is the one
  # that issues the tokens, the API only verifies them.
  apiSecretRef: choregos-api-secrets
  # Local bench only: the chart itself writes the application secrets (see
  # templates/secrets-embarques.yaml). Never true in production.
  devSecrets: false
  # Connector secrets typed in the console are sealed in the database under a key the DEPLOYMENT
  # holds (ADR 0058): `CHOREGOS_SECRETS_KEKS="k2:<base64 of 32 bytes>,k1:<...>"`, the first key
  # seals, the others only open. Without it the API runs, references (`env:NAME`) keep working,
  # and typing a secret answers 409 naming the missing key. Generate one with
  # `python -c "import os,base64;print('k1:'+base64.b64encode(os.urandom(32)).decode())"`.
  secrets:
    # The Secret that carries the key; empty: `apiSecretRef` (the key is then one more entry of it).
    keksSecretRef: ""
    # Its entry. Optional in the pod spec: absent, the feature is off, the pod still starts.
    keksKey: secrets-keks
    # Also list the entry in the chart's ExternalSecret (`remoteRef` choregos/api). Off by default:
    # a missing remote property would make the whole ExternalSecret fail, so turn it on once the
    # key exists in the store.
    keksInExternalSecret: false
  externalSecrets:
    enabled: true
    storeRef: choregos-cluster-store
    refreshInterval: 1h

choregos-api:
  enabled: true
  # Ex. : [{ip: "172.16.3.2", hostnames: ["sso.shared.diametral.com"]}]
  hostAliases: []
  replicaCount: 2
  image:
    repository: choregos-api
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  migrations:
    enabled: true
    # `post-install,post-upgrade` when the database is embedded (it does not exist before).
    hook: pre-install,pre-upgrade
    # Wait for the database before migrating (init container).
    waitForDatabaseSeconds: 300
  ingress:
    enabled: true
    # `httproute` (Gateway API) or `ingress` (networking.k8s.io) when the cluster has no
    # Gateway API — `className` only serves `ingress`.
    kind: httproute
    className: ""
    hostnames: ["api.choregos.local", "hooks.choregos.local"]
    gateway: choregos-gateway

choregos-web:
  enabled: true
  replicaCount: 2
  image:
    repository: choregos-web
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  ingress:
    enabled: true
    kind: httproute
    className: ""
    hostnames: ["app.choregos.local"]
    gateway: choregos-gateway

choregos-orchestrator:
  enabled: true
  image:
    repository: choregos-orchestrator
  # After losing a node, a worker waits this delay before being evicted (Kubernetes default:
  # 300 s, i.e. ~6 minutes of immobility — see `tests/cluster/test_node_loss.py`).
  unreachableTolerationSeconds: 20
  # One deployment per task queue: slow external calls do not choke the decision loop.
  queues:
    - name: orchestrator
      replicas: 2
      resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
    - name: executor
      replicas: 2
      resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
    - name: tracker
      replicas: 2
      resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
    - name: memory
      replicas: 1
      resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
  runner:
    image: choregos-runner
    # Empty: the tag follows `global.imageTag`. DO NOT REMOVE this line — without it, the
    # sub-chart's default takes over again and the agents' image goes back to `1.0.0`, absent from every
    # installation. It happened on 2026-09-27: a slightly broad cut removing a
    # neighboring setting, and `helm-unittest` caught it on `global.imageTag: 9.9.9` → `…-runner:1.0.0`.
    tag: ""
    namespacePattern: "proj-{slug}-runners"
    # Simultaneous runs per namespace. Beyond that, the Job waits WITHOUT a pod (`spec.suspend`),
    # in order of arrival: a spike of tickets no longer turns into a spike of
    # pods all pulling the same image. 0 = no ceiling.
    maxActive: 0
    executor: tekton
    # What each agent pod receives in addition. `env` carries plain values (never a
    # secret); `envFromSecrets` lists the namespace's Secrets, mounted by reference —
    # this is how a backend token or git credentials get through.
    env: {}
    envFromSecrets: []
    # Ceiling of each runner pod (`k8s_job` executor). Keep it under the namespace's
    # LimitRange: beyond it, the pod is refused and the Job waits without a message.
    limits:
      cpu: "2"
      memory: 6Gi
    # The RuntimeClass (gVisor, Kata) of each agent pod when the project's policy
    # imposes none (`sandbox.runtime: gvisor` takes precedence). Empty: the cluster's runtime.
    runtimeClass: ""
    # `executor: agent_sandbox` only (ADR 0016; needs the agent-sandbox operator and a
    # `namespacePattern` naming this namespace). `warmPool.size` sandboxes wait, made from the
    # template and never used, holding no credential; 0 = every run cold-starts from the
    # template. `runtimeClass` above is the template's: a policy asking for another one is
    # refused by the executor, never silently ignored.
    warmPool:
      size: 0
    sandbox:
      # The workspace volume a suspended sandbox keeps across a human question.
      storage: 10Gi
      storageClassName: ""
      # Where a warm runner listens for its one assignment (run id, token, environment).
      assignmentPort: 8765
    # Context reduction (ADR 0055): rtk filters shell output, headroom compresses tool results.
    # `enabled: false` refuses both to every run; `true` lets each project's policy decide, and a
    # policy without `context` reduces nothing.
    contextReduction:
      enabled: true
    # The egress proxy through which EACH agent pod gets out (`HTTP_PROXY`/`HTTPS_PROXY`),
    # `{namespace}` = the runners'. The provisioning deploys a Squid there whose
    # allowlist is `policy.sandbox.network.allow_domains`; without an allowed domain,
    # no proxy and no egress. Empty: no proxy (local bench).
    egressProxy: "http://choregos-egress.{namespace}.svc:3128"
    # Its image, to be pinned by digest where Kyverno requires it. Empty: the one from `gitops.py`.
    egressImage: ""
  # One budget per queue with more than one replica.
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

choregos-tools:
  enabled: true
  image:
    repository: choregos-tools
  # The sidecar image is published here; the Tekton Task references it in each project.
  publishTask: true

monitoring:
  # `prometheus` renders `monitoring.coreos.com` objects; `victoriametrics` renders
  # `operator.victoriametrics.com/v1beta1` ones. An operator that does not know the type does not see
  # it: on a VictoriaMetrics platform, a ServiceMonitor is an INERT object — the
  # deployment looks monitored and is not. Observed on a real tenant on 2026-09-26.
  flavour: prometheus
  serviceMonitor: true
  dashboards: true
  # Annotations set on each dashboard ConfigMap. The Grafana sidecar files a
  # dashboard in the folder named by its `folderAnnotation` (often `grafana_folder`);
  # without an annotation, it lands in `General`, mixed with the platform's own.
  # Ex. `{grafana_folder: choregos}`.
  dashboardAnnotations: {}
  alerts: true

# The HR scenario fakes served by a single process (S20-07): MCP for the fleet, the carrier,
# the badge readers and the supplier's agent, and a fake Microsoft Graph. A demonstration:
# refused in staging and prod. The organization's connectors designate them by
# `http://choregos-demo-fakes:<port>/{mdm,shipping,access_control,fournisseur}/mcp` and, for `entra`,
# `graph_url: …/graph/v1.0` and `login_url: …/login`.
demoFakes:
  enabled: false
  port: 8090
  # { name: <secret>, key: <key> }: the MCP servers' token and the fake Graph's secret.
  tokenSecret: null
  resources:
    requests: { cpu: 20m, memory: 96Mi }
    limits: { cpu: 200m, memory: 256Mi }

# Netops (ADR 0052): the read-only identity of the `cilium` connector — a service account allowed
# get/list/watch on CiliumNetworkPolicy and CiliumClusterwideNetworkPolicy, nothing else. Off by
# default. To use it, map its token into the API and workers and reference it from the connector:
#   global.extraEnv: [{name: CONNECTOR_CILIUM_READER_TOKEN, valueFrom: {secretKeyRef:
#     {name: choregos-netops-cilium-reader-token, key: token}}}]
#   connector `cilium`: secret_refs: {token: env:CONNECTOR_CILIUM_READER_TOKEN}
netops:
  ciliumReader:
    enabled: false
    name: choregos-netops-cilium-reader
    # create a `kubernetes.io/service-account-token` Secret for it
    tokenSecret: true

networkPolicies:
  enabled: true
