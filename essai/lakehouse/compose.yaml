# Essai de la phase 0, élément 7 : un catalogue Iceberg REST (Lakekeeper) sur un stockage S3 (MinIO),
# écrit par PyIceberg et lu par DuckDB. Identifiants de développement seulement, jamais ailleurs.
name: essai-lakehouse
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lakekeeper
      POSTGRES_PASSWORD: essai-dev-only
      POSTGRES_DB: lakekeeper
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakekeeper"]
      interval: 2s
      retries: 30
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: essai
      MINIO_ROOT_PASSWORD: essai-dev-only
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      retries: 30
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["sh", "-c", "mc alias set m http://minio:9000 essai essai-dev-only && mc mb -p m/warehouse"]
  migrate:
    image: quay.io/lakekeeper/catalog:latest
    command: ["migrate"]
    environment: &lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://lakekeeper:essai-dev-only@postgres:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://lakekeeper:essai-dev-only@postgres:5432/lakekeeper
      LAKEKEEPER__PG_ENCRYPTION_KEY: essai-dev-only-not-a-secret
    depends_on:
      postgres: {condition: service_healthy}
  lakekeeper:
    image: quay.io/lakekeeper/catalog:latest
    command: ["serve"]
    environment: *lakekeeper
    ports: ["58181:8181"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      minio-init: {condition: service_completed_successfully}
