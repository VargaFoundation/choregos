{{- $name := printf "%s-litellm" .Release.Name }}
{{- $guard := .Files.Get "files/choregos_guardrail.py" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels: {{- include "choregos.labels" . | nindent 4 }}
data:
  config.yaml: |
    model_list:
    {{- range .Values.models }}
      - model_name: {{ .alias }}
        litellm_params:
          model: {{ .model }}
          {{- with $.Values.upstream.apiBase }}
          api_base: {{ . }}
          {{- end }}
          {{- if $.Values.upstream.apiKeySecret }}
          api_key: os.environ/UPSTREAM_API_KEY
          {{- end }}
        {{- with .mode }}
        model_info: { mode: {{ . }} }
        {{- end }}
    {{- end }}
    litellm_settings:
      # Drops from a call the parameters the target provider does not know, instead of
      # failing — model generations do not agree on `temperature`.
      drop_params: true
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
      store_model_in_db: false
    # ADR 0084: secrets masked before the provider call. On for every request, it acts only for a
    # key whose metadata the platform marked (`sandbox.llm_security_analyzer`). Fails closed.
    guardrails:
      - guardrail_name: choregos-secrets
        litellm_params:
          guardrail: choregos_guardrail.ChoregosGuardrail
          mode: pre_call
          default_on: true
  choregos_guardrail.py: |
{{ $guard | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "choregos.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: choregos-litellm
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: choregos-litellm
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: gateway
      annotations:
        checksum/config: {{ print (toJson .Values.models) (toJson .Values.upstream) $guard | sha256sum }}
    spec:
      {{- include "choregos.imagePullSecrets" $ | nindent 6 }}
      # The Kyverno `non-root` rule has been strict since 2026-09-25: the pod context is
      # required. The image runs as uid 1000 (verified: `python -c "import litellm"` under
      # `--user 1000`). v1.105.3 was run under this context on the dev cluster (2026-10-23,
      # throwaway namespace, S40-16g): Prisma migrations applied, ready, the guard loaded.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: litellm
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom: { secretKeyRef: { name: {{ include "choregos.gatewaySecret" . }}, key: master-key } }
            {{- with .Values.upstream.apiKeySecret }}
            - name: UPSTREAM_API_KEY
              valueFrom: { secretKeyRef: { name: {{ . }}, key: api-key } }
            {{- end }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "choregos.databasePasswordSecret" . }}
                  key: password
            # DEDICATED database: virtual keys and their consumption have no business in
            # Choregos' schema. `sslmode=prefer` encrypts when the server can,
            # without requiring a certificate the bench's PostgreSQL does not have.
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.global.database.user }}:$(DATABASE_PASSWORD)@{{ include "choregos.databaseHost" . }}:{{ .Values.global.database.port }}/{{ .Values.database.name }}?sslmode=prefer"
          ports:
            - { name: http, containerPort: 4000 }
          readinessProbe:
            httpGet: { path: /health/readiness, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /etc/litellm }
      volumes:
        - name: config
          configMap: { name: {{ $name }} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "choregos.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: choregos-litellm
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - { name: http, port: 4000, targetPort: http }
