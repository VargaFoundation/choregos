{{- if and .Values.enabled .Values.migrations.enabled }}
# The hook's OWN service account, created by the SAME hook with a lower weight.
#
# The Job ran under `choregos-api`, which is an ORDINARY resource of the release. In
# `pre-install` (Helm) as in PreSync (Argo CD, which translates the Helm hook), the Job is created
# before it: the controller answers "error looking up service account
# choregos/choregos-api: serviceaccount not found", no pod is born, and the sync waits for
# a hook that cannot start. The comment below already described this trap for Helm
# and it was "fixed" by switching the kind tenant to `post-install` — so the defect
# stayed broken, and the dev tenant paid for it on 2026-09-26: seven hours, zero pods, the Sync
# blocked behind a Job with no pod.
#
# An account of its own breaks the dependency for good, in both engines and in both
# modes: the migrations never call the Kubernetes API, they only talk to the database.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: choregos-migrations
  labels: {{- include "choregos.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": {{ .Values.migrations.hook }}
    # Lighter than the Job (-5): so it exists before it.
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- with .Values.global.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
# Nothing to call in the cluster, so no token mounted. The annotations, however, are
# kept: it is through them that a database authenticates by workload identity.
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: choregos-migrations-{{ .Release.Revision }}
  labels: {{- include "choregos.labels" . | nindent 4 }}
  annotations:
    # The migrations run **before** the new pods (expand/contract, N-1 compatible).
    #
    # `post-install` exists for one specific case: when the chart itself ships the database and
    # its secrets. A `pre-install` hook runs before ANY ordinary resource of the
    # release — so before the chart's secrets and before the embedded PostgreSQL; the Job
    # then waits for a database and values that will never arrive, and the installation times out on
    # a "timed out waiting for the condition" that blames nothing. When the database and
    # secrets come from elsewhere (PostgreSQL operator, secrets operator), `pre-install`
    # is the right choice: the hook's service account is now created by the hook.
    "helm.sh/hook": {{ .Values.migrations.hook }}
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {{- include "choregos.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: choregos-migrations
      {{- include "choregos.imagePullSecrets" $ | nindent 6 }}
      securityContext: {{- toYaml .Values.global.podSecurityContext | nindent 8 }}
      initContainers:
        # The database may not be there yet — it starts in the same release when the
        # chart embeds it, and an image takes as long as it takes to pull. Without
        # this wait, the Job exhausts its `backoffLimit` on a "connection refused" and
        # the installation fails blaming the migrations.
        - name: attendre-la-base
          image: {{ include "choregos.image" (dict "global" .Values.global "image" .Values.image) }}
          command:
            - python
            - -c
            - |
              import socket, sys, time
              host, port = "{{ include "choregos.databaseHost" . }}", {{ .Values.global.database.port }}
              deadline = time.time() + {{ .Values.migrations.waitForDatabaseSeconds }}
              while time.time() < deadline:
                  try:
                      socket.create_connection((host, port), timeout=3).close()
                      sys.exit(0)
                  except OSError as exc:
                      print(f"database unavailable ({exc}) — retrying", flush=True)
                      time.sleep(3)
              sys.exit(f"database {host}:{port} still unreachable")
          securityContext: {{- toYaml .Values.global.securityContext | nindent 12 }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
      containers:
        - name: migrations
          image: {{ include "choregos.image" (dict "global" .Values.global "image" .Values.image) }}
          # `migrer` finds the migrations INSIDE the package, wherever it is launched from, and also runs the
          # branches declared by plugins (`choregos.migrations`): `upgrade heads`, not
          # `head`. The former `alembic -c alembic.ini upgrade head` required `/app/apps/api` as the
          # working directory, and only saw the core.
          command: ["python", "-m", "choregos_api.migrer"]
          env: {{- include "choregos.commonEnv" . | nindent 12 }}
          securityContext: {{- toYaml .Values.global.securityContext | nindent 12 }}
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
{{- end }}
