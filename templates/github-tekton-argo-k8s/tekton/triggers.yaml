# Déclencheurs GitHub → PipelineRun de CI. Le secret du webhook est monté depuis
# External Secrets ; Choregos ne le voit jamais en clair.
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: choregos-github-binding
spec:
  params:
    - { name: repo-url, value: $(body.repository.clone_url) }
    - { name: revision, value: $(body.pull_request.head.sha) }
    - { name: pr-number, value: $(body.pull_request.number) }
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: choregos-ci-template
spec:
  params:
    - { name: repo-url }
    - { name: revision }
    - { name: pr-number }
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: ci-
        labels:
          choregos/sha: $(tt.params.revision)
          tekton.dev/pipeline: choregos-ci
      spec:
        pipelineRef: { name: choregos-ci }
        params:
          - { name: repo-url, value: $(tt.params.repo-url) }
          - { name: revision, value: $(tt.params.revision) }
          - { name: image, value: "ghcr.io/varga/app:$(tt.params.revision)" }
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                resources: { requests: { storage: 5Gi } }
