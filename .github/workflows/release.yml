# Release: a semver tag produces the signed images, the OCI chart and the changelog.
#
# Never run before v0.1.0, and it could not pass: the matrix looked for a
# `docker/orchestrator.Dockerfile` that does not exist (the orchestrator is the `worker` target
# of `api.Dockerfile`), the API was built without its target, arm64 went through QEMU — the
# path that made the runner image endless — and the chart shipped with `imageTag:
# "1.0.0"` hard-coded, whatever version was published. The scheme below is Ecphoria v0.2.5's,
# proven: one architecture per native runner, pushed by digest, then
# a manifest list per image.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  images:
    name: ${{ matrix.image }} (${{ matrix.platform }})
    runs-on: ${{ matrix.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # `image` carries its own keys through `include`; `platform` is a dimension. Two
        # `include`s that add the same key to every combination would overlap.
        image: [api, orchestrator, tools, web, runner]
        platform: [amd64, arm64]
        include:
          - { image: api, file: docker/api.Dockerfile, target: api }
          - { image: orchestrator, file: docker/api.Dockerfile, target: worker }
          - { image: tools, file: docker/tools.Dockerfile, target: "" }
          - { image: web, file: docker/web.Dockerfile, target: "" }
          - { image: runner, file: docker/runner.Dockerfile, target: "" }
    env:
      IMAGE: ghcr.io/vargafoundation/choregos-${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.platform }}
          # The About panel shows which commit the image was built from (S42-12, `GET /edition`).
          build-args: REVISION=${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform }}
      - name: store the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image }}-${{ matrix.platform }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    name: manifest and signature (${{ matrix.image }})
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign (GitHub OIDC)
    strategy:
      fail-fast: false
      matrix:
        image: [api, orchestrator, tools, web, runner]
    env:
      IMAGE: ghcr.io/vargafoundation/choregos-${{ matrix.image }}
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: assemble the manifest list
        working-directory: /tmp/digests
        run: |
          # The word splitting is intended: one `-t` option per tag, one reference per digest.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
      - name: Trivy scan of the published image (no CRITICAL tolerated)
        # The images of `main` were scanned, those of a release — the ones that go to
        # production — never were (status review of 2026-09-24).
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true
      - name: sign the manifest
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)
          cosign sign --yes "${IMAGE}@${digest}"

  chart:
    # After the images: a published chart must never point at a missing image.
    needs: manifest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - uses: astral-sh/setup-uv@v7
      - name: the tagged version is the repository's
        # No more `sed` at build time: versions are set BEFORE the tag, with
        # `tools/bump_version.py`, and the repository always tells the truth. A tag that does not
        # match the files stops the release here.
        run: uv run python tools/bump_version.py "${GITHUB_REF_NAME#v}" --check
      - name: publish the chart as OCI
        env:
          HELM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.repository_owner }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package charts/choregos --version "$version" --app-version "$version"
          echo "$HELM_TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          helm push "choregos-$version.tgz" oci://ghcr.io/vargafoundation/charts

  pypi:
    # `choregos-agent-sdk` and the `choregos-contracts` it depends on (ADR 0063). OFF until the two
    # projects exist on pypi.org with this repository, this workflow and the `pypi` environment as
    # their trusted publisher: set the repository variable PUBLISH_TO_PYPI=true to turn it on.
    if: vars.PUBLISH_TO_PYPI == 'true'
    needs: chart
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build --package choregos-contracts --package choregos-agent-sdk --out-dir dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: dist }

  changelog:
    needs: chart
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v7
      - name: build the Python packages
        # An Apache 2.0 repository none of whose nine packages was distributable: the wheels
        # ship with the release (no PyPI until the names are reserved).
        run: uv build --all-packages --out-dir dist
      - uses: orhun/git-cliff-action@v4
        with: { args: --latest --strip header }
        id: cliff
      - uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.cliff.outputs.content }}
          generate_release_notes: true
          files: dist/*
