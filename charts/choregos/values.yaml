# Valeurs par défaut de la plateforme. Chaque environnement surcharge ce qui le concerne
# dans `choregos-infra/platform/overlays/<env>/values.yaml`.

global:
  domain: choregos.local
  # Surcharges quand les hôtes ne suivent pas `app.<domain>` / `api.<domain>` en HTTPS
  # (ex. un ingress HTTP interne derrière un VPN). Vides : dérivés de `domain`.
  publicUrl: ""
  apiUrl: ""
  imageRegistry: ghcr.io/vargafoundation
  imageTag: "0.17.2"
  imagePullPolicy: IfNotPresent
  # Les images sont référencées par digest en staging et en prod (politique Kyverno).
  imageDigest: ""
  # Secrets de tirage d'image, pour un registre privé — une édition entreprise, un miroir
  # Harbor fermé, une image maison. Vide : toutes les images sont publiques. Le secret doit
  # exister dans le namespace ; sur une plateforme mutualisée, c'est en général le socle du
  # locataire qui le pose (par exemple depuis un magasin de secrets), pas ce chart.
  imagePullSecrets: []
  environment: dev
  # Édition annoncée par ce déploiement (ADR 0024). `community` est le défaut, et le plus
  # restrictif : une seule organisation. `enterprise` exige des images de l'édition entreprise —
  # l'API REFUSE de démarrer si aucun greffon entreprise ne s'est déclaré, plutôt que de paraître
  # saine et de refuser la seconde organisation des semaines plus tard.
  edition: community
  fakes: false
  # Variables d'environnement supplémentaires, données à l'API, à chaque worker et au Job de
  # migration (par `choregos.commonEnv`). Pour activer un réglage que le chart ne connaît pas
  # encore — par exemple un greffon livré inactif (`CHOREGOS_ESSAI_ONTOLOGIE: "1"`) — sans fork du
  # chart. Une variable déjà posée par le chart est REFUSÉE au rendu : deux valeurs pour un même
  # nom, Kubernetes garde la dernière sans rien dire, et le réglage du chart serait remplacé en
  # silence. Valeurs en clair seulement : un secret passe par un `Secret`, jamais par ici.
  extraEnv: []
  #   - name: CHOREGOS_ESSAI_ONTOLOGIE
  #     value: "1"
  # Canary de la plateforme (S7-08). Désactivé par défaut : il exige Argo Rollouts dans le
  # cluster, et un chart qui suppose un opérateur absent est un chart qui ne s'installe pas.
  # Les environnements qui l'activent le font dans `values/staging.yaml` et `values/prod.yaml`.
  canary:
    enabled: false
    steps:
      - { weight: 10, pause: 5m }
      - { weight: 50, pause: 10m }
      - { weight: 100 }
    # `AnalysisTemplate` qui décide d'abandonner : sans lui, le canary ne fait qu'attendre.
    analysis: ""
  # Playbooks apportés par le DÉPLOIEMENT (un ConfigMap, une clé par rôle : `<rôle>.md`),
  # montés dans les workers et lus avant ceux du paquet. C'est ce qui permet d'employer le
  # moteur hors logiciel — un rôle `sourcing`, `instruction_dossier` — ou d'adapter un rôle
  # existant à une maison, sans toucher à la plateforme.
  playbooks:
    configMap: ""
    mountPath: /etc/choregos/playbooks
  # Catalogue d'outils : des API tierces que la PLATEFORME appelle pour un agent, clé
  # côté serveur. Un ConfigMap (le catalogue, lisible en PR) et un Secret (les clés des
  # fournisseurs, injecté dans l'API). Vide = aucun outil, et c'est le défaut.
  # Un projet déclare ensuite ce qu'il a le droit d'appeler (`tools` de sa configuration).
  # Templates de workflow apportés par le déploiement, en plus des trois du paquet. Un
  # template du déploiement l'emporte sur celui du paquet, comme pour les playbooks ; c'est
  # ainsi qu'un métier apporte ses enchaînements d'états sans réécrire la plateforme. Vide :
  # seuls les trois livrés existent.
  workflowTemplates:
    configMap: ""
    mountPath: /etc/choregos/workflow-templates
  toolCatalog:
    configMap: ""
    mountPath: /etc/choregos/outils
    fileName: catalogue.yaml
    #: Secret dont TOUTES les clés deviennent des variables d'environnement de l'API :
    #: c'est là que vivent les clés des fournisseurs, jamais dans le catalogue.
    credentialsSecret: ""
  # Ce que CE déploiement sait faire tourner : un projet neuf en hérite quand sa demande n'en dit
  # rien (#245). Vide : le contrat décide (`claude-code`, aucun profil de modèle). Un locataire qui
  # sert opencode derrière la passerelle de la plateforme le dit ici, sans quoi les agents d'un
  # gabarit n'y atteignent jamais leur modèle.
  agents:
    defaultBackend: ""
    allowedBackends: []
    # profil → modèle de la passerelle : `{ standard: platform/standard }`
    modelProfiles: {}
  logLevel: INFO
  # Anti-affinité entre les répliques d'un même composant : `soft` (préférée), `hard`
  # (une réplique par nœud, sinon pas de pod) ou `none`.
  antiAffinity: soft
  serviceAccount:
    annotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile: { type: RuntimeDefault }
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: { drop: ["ALL"] }
  database:
    # `true` : le chart déploie un PostgreSQL à une instance (banc, démo). `false` : il
    # consomme celui décrit ci-dessous. Même logique pour les trois dépendances suivantes.
    embedded: false
    host: choregos-pg-rw.choregos-data.svc
    port: 5432
    name: choregos
    # Rôle d'administration du PostgreSQL embarqué (POSTGRES_USER, superutilisateur).
    user: choregos
    # Rôle avec lequel l'API et l'orchestrateur se connectent au PostgreSQL EMBARQUÉ : créé
    # sans SUPERUSER à l'initdb, parce qu'un superutilisateur ignore la RLS et que
    # l'isolation des organisations n'existe alors pas. L'API refuse un superutilisateur en
    # staging/prod. Avec une base externe (`secretRef`, clé `url`), c'est l'URL qui décide.
    appUser: choregos_app
    secretRef: choregos-db
    # À la place de `secretRef` (clé `url`) : le secret d'un opérateur qui ne porte que le
    # mot de passe (Zalando : `<user>.<cluster>.credentials.postgresql.acid.zalan.do`).
    passwordSecret: ""
    # Pool de connexions de CHAQUE processus (réplique d'API, worker) : au plus
    # size + maxOverflow connexions, une attente bornée au-delà. Dimensionner
    # `max_connections` de PostgreSQL en conséquence : (répliques API + workers) × (size + maxOverflow).
    pool:
      size: 10
      maxOverflow: 5
      timeoutSeconds: 10
  temporal:
    embedded: false
    address: temporal-frontend.choregos-temporal.svc:7233
    namespace: default
  gateway:
    embedded: false
    url: http://litellm.choregos-gateway.svc:4000
    # Secret (clé `master-key`) de la passerelle. Vide avec `embedded: true` : le chart en
    # génère un, stable d'une mise à jour à l'autre.
    secretRef: choregos-gateway-secrets
  memory:
    embedded: false
    url: http://ecphoria.choregos-memory.svc:8432
    # Secret (clé `token`) d'une mémoire qui exige une clé d'API. Vide : aucun en-tête.
    tokenSecret: ""
  objectStore:
    url: s3://choregos
  oidc:
    issuer: https://keycloak.choregos.local/realms/choregos
    clientId: choregos
    secretRef: choregos-oidc
    # Organisation à laquelle rattacher les groupes OIDC NON préfixés (`developers`,
    # `org-admins`…). Vide : seuls les groupes `choregos:<org>:<groupe>` donnent un rôle.
    defaultOrg: ""
  # La porte MCP en serveur de ressources OAuth (ADR 0030, RFC 9728) : l'IdP de la console émet les
  # jetons de Claude Code et de claude.ai, sans jeton à coller. Ce que l'IdP doit porter (portée
  # `choregos-mcp`, clients) : docs/runbooks/keycloak-mcp.md.
  mcp:
    oauth:
      enabled: false
      # Vide : l'émetteur de la console (`global.oidc.issuer`). À poser pour un AUTRE IdP seulement.
      issuer: ""
      # L'audience obligatoire des jetons de la porte.
      audience: choregos-mcp
      # Les clients que l'IdP a enregistrés, par client de la page Integrations — la page en tire
      # la commande exacte. `callbackPort` : le port de `http://localhost:PORT/callback` enregistré.
      #   claude-code: { clientId: choregos-claude-code, callbackPort: 33418 }
      #   claude-ai: { clientId: choregos-claude-ai }
      clients: {}
  # Amorçage d'une installation neuve : l'organisation créée au premier démarrage si elle
  # manque, et les e-mails qui y reçoivent org_admin. Idempotent. Sans cela, aucune route
  # ni aucun écran ne peut créer la première organisation.
  bootstrap:
    org: ""
    orgName: ""
    admins: ""
  # Connexion de développement (`/auth/login?as=<email>`), sans IdP. JAMAIS en production :
  # l'API la refuse d'elle-même en staging/prod. `adminEmails` : qui reçoit ORG_ADMIN.
  devLogin:
    enabled: false
    adminEmails: ""
  # `false` pour un locataire qui n'a droit à aucune ressource cluster-scoped (AppProject
  # `clusterResourceWhitelist: []`) : le ClusterRole de lecture des PipelineRun n'est pas rendu.
  rbac:
    clusterScoped: true
    # Role + RoleBinding (namespace) autorisant l'orchestrateur à lancer ses Jobs d'agent.
    # Sur une plateforme mutualisée, c'est la plateforme qui le pose : laisser `false`.
    jobRunner: false
  # Le secret qui porte les valeurs de l'API : secret de session, clé de signature des
  # jetons de run, App GitHub. L'orchestrateur y lit la MÊME clé de signature — c'est lui
  # qui émet les jetons, l'API ne fait que les vérifier.
  apiSecretRef: choregos-api-secrets
  # Banc local seulement : le chart écrit lui-même les secrets applicatifs (voir
  # templates/secrets-embarques.yaml). Jamais vrai en production.
  devSecrets: false
  externalSecrets:
    enabled: true
    storeRef: choregos-cluster-store
    refreshInterval: 1h

choregos-api:
  enabled: true
  # Ex. : [{ip: "172.16.3.2", hostnames: ["sso.shared.diametral.com"]}]
  hostAliases: []
  replicaCount: 2
  image:
    repository: choregos-api
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  migrations:
    enabled: true
    # `post-install,post-upgrade` quand la base est embarquée (elle n'existe pas avant).
    hook: pre-install,pre-upgrade
    # Attente de la base avant de migrer (init container).
    waitForDatabaseSeconds: 300
  ingress:
    enabled: true
    # `httproute` (Gateway API) ou `ingress` (networking.k8s.io) quand le cluster n'a pas
    # de Gateway API — `className` ne sert qu'à `ingress`.
    kind: httproute
    className: ""
    hostnames: ["api.choregos.local", "hooks.choregos.local"]
    gateway: choregos-gateway

choregos-web:
  enabled: true
  replicaCount: 2
  image:
    repository: choregos-web
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  ingress:
    enabled: true
    kind: httproute
    className: ""
    hostnames: ["app.choregos.local"]
    gateway: choregos-gateway

choregos-orchestrator:
  enabled: true
  image:
    repository: choregos-orchestrator
  # Après la perte d'un nœud, un worker attend ce délai avant d'être évincé (défaut Kubernetes :
  # 300 s, soit ~6 minutes d'immobilité — voir `tests/cluster/test_node_loss.py`).
  unreachableTolerationSeconds: 20
  # Un déploiement par task queue : les appels externes lents n'étouffent pas la boucle de décision.
  queues:
    - name: orchestrator
      replicas: 2
      resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
    - name: executor
      replicas: 2
      resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
    - name: tracker
      replicas: 2
      resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
    - name: memory
      replicas: 1
      resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
  runner:
    image: choregos-runner
    # Vide : le tag suit `global.imageTag`. NE PAS RETIRER cette ligne — sans elle, le défaut du
    # sous-chart reprend la main et l'image des agents repart sur `1.0.0`, absente de toute
    # installation. C'est arrivé le 2026-09-27 : une coupe un peu large en retirant un réglage
    # voisin, et `helm-unittest` l'a attrapé sur `global.imageTag: 9.9.9` → `…-runner:1.0.0`.
    tag: ""
    namespacePattern: "proj-{slug}-runners"
    # Runs simultanés par namespace. Au-delà, le Job attend SANS pod (`spec.suspend`),
    # dans l'ordre d'arrivée : une pointe de tickets ne se transforme plus en pointe de
    # pods qui tirent tous la même image. 0 = sans plafond.
    maxActive: 0
    executor: tekton
    # Ce que chaque pod d'agent reçoit en plus. `env` porte des valeurs en clair (jamais un
    # secret) ; `envFromSecrets` liste des Secrets du namespace, montés par référence —
    # c'est par là que passent un jeton de backend ou des identifiants git.
    env: {}
    envFromSecrets: []
    # Plafond de chaque pod runner (exécuteur `k8s_job`). À garder sous le LimitRange du
    # namespace : au-delà, le pod est refusé et le Job attend sans message.
    limits:
      cpu: "2"
      memory: 6Gi
    # La RuntimeClass (gVisor, Kata) de chaque pod d'agent quand la politique du projet
    # n'en impose pas (`sandbox.runtime: gvisor` l'emporte). Vide : la runtime du cluster.
    runtimeClass: ""
    # Le proxy d'egress par lequel CHAQUE pod d'agent sort (`HTTP_PROXY`/`HTTPS_PROXY`),
    # `{namespace}` = celui des runners. Le provisioning y déploie un Squid dont
    # l'allowlist est `policy.sandbox.network.allow_domains` ; sans domaine autorisé,
    # pas de proxy et pas de sortie. Vide : aucun proxy (banc local).
    egressProxy: "http://choregos-egress.{namespace}.svc:3128"
    # Son image, à épingler par digest là où Kyverno l'exige. Vide : celle de `gitops.py`.
    egressImage: ""
  # Un budget par file d'attente comptant plus d'une réplique.
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

choregos-tools:
  enabled: true
  image:
    repository: choregos-tools
  # L'image du sidecar est publiée ici ; la Task Tekton la référence dans chaque projet.
  publishTask: true

monitoring:
  # `prometheus` rend des objets `monitoring.coreos.com` ; `victoriametrics` rend des
  # `operator.victoriametrics.com/v1beta1`. Un opérateur qui ne connaît pas le type ne le voit
  # pas : sur une plateforme VictoriaMetrics, un ServiceMonitor est un objet INERTE — le
  # déploiement paraît surveillé et ne l'est pas. Constaté sur un locataire réel le 2026-09-26.
  flavour: prometheus
  serviceMonitor: true
  dashboards: true
  # Annotations posées sur chaque ConfigMap de dashboard. Le sidecar Grafana range un
  # dashboard dans le dossier que nomme son `folderAnnotation` (souvent `grafana_folder`) ;
  # sans annotation, il atterrit dans `General`, mêlé à ceux de la plateforme.
  # Ex. `{grafana_folder: choregos}`.
  dashboardAnnotations: {}
  alerts: true

# Les faux du scénario RH servis par un seul processus (S20-07) : MCP pour le parc, le transporteur,
# les lecteurs de badges et l'agent du fournisseur, et un faux Microsoft Graph. Une démonstration :
# refusé en staging et en prod. Les connecteurs de l'organisation les désignent par
# `http://choregos-demo-fakes:<port>/{mdm,shipping,access_control,fournisseur}/mcp` et, pour `entra`,
# `graph_url: …/graph/v1.0` et `login_url: …/login`.
demoFakes:
  enabled: false
  port: 8090
  # { name: <secret>, key: <clé> } : le jeton des serveurs MCP et le secret du faux Graph.
  tokenSecret: null
  resources:
    requests: { cpu: 20m, memory: 96Mi }
    limits: { cpu: 200m, memory: 256Mi }

networkPolicies:
  enabled: true
