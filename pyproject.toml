[project]
name = "choregos-workspace"
version = "0.27.17"
description = "Choregos — plateforme de delivery agentique (GRAAL.SYSTEMS SAS)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
  "tranibor-contracts",
  "tranibor-core",
  "tranibor-adapters",
  "tranibor-runner",
  "tranibor-tools-mcp",
  "tranibor-playbooks",
  "tranibor-cli",
  "tranibor-api",
  "tranibor-orchestrator",
  "tranibor-agent-sdk",
  "tranibor-outpost",
  # The extension of the `investment-research` plugin (ADR 0181 O4-4): its own distribution.
  "tranibor-investment-research",
  # The Vault transit key wrapper (ADR 0103, S80-19): an extension, inert until `TRANIBOR_VAULT_ADDR` is set.
  "tranibor-vault-transit",
  # The former names (ADR 0176 R2): empty wheels that ship the `choregos_*` import aliases.
  "choregos-contracts", # compat-ok
  "choregos-core", # compat-ok
  "choregos-adapters", # compat-ok
  "choregos-runner", # compat-ok
  "choregos-tools-mcp", # compat-ok
  "choregos-playbooks", # compat-ok
  "choregos-cli", # compat-ok
  "choregos-api", # compat-ok
  "choregos-orchestrator", # compat-ok
  "choregos-agent-sdk", # compat-ok
  "choregos-outpost", # compat-ok
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "pytest-xdist>=3.6",
  "mypy>=1.13",
  "ruff>=0.8",
  "respx>=0.21",
  "httpx>=0.27",
  "types-PyYAML>=6.0",
  "datamodel-code-generator>=0.26",
  "freezegun>=1.5",
  "alembic>=1.20.0",
  "types-jsonschema>=4.26.0.20260518",
  "mcp>=1.20",
  "python-docx>=1.1",
  "pytest-textual-snapshot>=1.0.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.workspace]
members = ["packages/*", "apps/api", "apps/orchestrator", "compat/*", "plugins/investment-research", "plugins/vault-transit"]
exclude = ["packages/contracts/ts", "apps/web"]

[tool.uv.sources]
tranibor-contracts = { workspace = true }
tranibor-core = { workspace = true }
tranibor-adapters = { workspace = true }
tranibor-runner = { workspace = true }
tranibor-tools-mcp = { workspace = true }
tranibor-playbooks = { workspace = true }
tranibor-cli = { workspace = true }
tranibor-api = { workspace = true }
tranibor-orchestrator = { workspace = true }
tranibor-agent-sdk = { workspace = true }
tranibor-outpost = { workspace = true }
tranibor-investment-research = { workspace = true }
tranibor-vault-transit = { workspace = true }
choregos-contracts = { workspace = true } # compat-ok
choregos-core = { workspace = true } # compat-ok
choregos-adapters = { workspace = true } # compat-ok
choregos-runner = { workspace = true } # compat-ok
choregos-tools-mcp = { workspace = true } # compat-ok
choregos-playbooks = { workspace = true } # compat-ok
choregos-cli = { workspace = true } # compat-ok
choregos-api = { workspace = true } # compat-ok
choregos-orchestrator = { workspace = true } # compat-ok
choregos-agent-sdk = { workspace = true } # compat-ok
choregos-outpost = { workspace = true } # compat-ok

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [
  ".venv",
  "packages/contracts/ts",
  "apps/web",
  "**/generated/**",
  "apps/api/src/tranibor_api/migrations/versions",
  # The evals' toy repositories: they imitate customer code, not our house style.
  "tests/fixtures/repos",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "S", "RET", "PL", "RUF"]
# PLC0415: lazy imports are deliberate (breaking cycles, start-up cost).
# PLR0911 (returns) and PLR0917 (positionals) stay ignored; the other complexity rules are
# active with realistic thresholds (below) — the 2026-09-24 stocktake found them all ignored,
# and three functions exceeded them by far.
ignore = ["S101", "PLR2004", "RUF001", "RUF002", "RUF003", "B008", "PLR0911", "SIM108", "PLC0415", "PLR0917"]
extend-select = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-branches = 20
max-args = 8
max-statements = 80

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "PLR", "ASYNC"]
"tests/**" = ["S", "PLR", "ASYNC"]
"**/fakes/**" = ["S"]
# A plugin extension's fake (ADR 0005), named after its family rather than kept under `fakes/`.
"plugins/*/src/**/fake.py" = ["S"]
# Development defaults, never real secrets.
"apps/api/src/tranibor_api/config.py" = ["S105"]
"apps/api/src/tranibor_api/security.py" = ["S105"]
"apps/api/src/tranibor_api/migrations/**" = ["E501", "W291", "I001"]
# Engine/session and bus singletons: one per process, deliberately.
"apps/api/src/tranibor_api/db/session.py" = ["PLW0603"]
"apps/api/src/tranibor_api/temporal.py" = ["PLW0603"]
"apps/orchestrator/src/tranibor_orchestrator/activities/base.py" = ["PLW0603"]
"apps/orchestrator/src/tranibor_orchestrator/train_client.py" = ["PLW0603"]
# Reading local fixtures in an activity: short disk I/O, deliberately.
"apps/orchestrator/src/tranibor_orchestrator/activities/evals.py" = ["ASYNC240"]
"apps/orchestrator/src/tranibor_orchestrator/activities/provisioning.py" = ["ASYNC240"]
# Build-time probe: loopback URLs and a fixed headroom command line, no untrusted input.
"docker/headroom/relays_budget_refusal.py" = ["S310", "S603", "S607"]
# The explicit `timeout` is part of these functions' contract (RPC, subprocesses).
"packages/runner/src/tranibor_runner/**" = ["ASYNC109"]
"packages/adapters/src/tranibor_adapters/**" = ["ASYNC109"]
# Demonstration data: the randomness is not cryptographic, on purpose.
"dev/scripts/seed.py" = ["S311", "E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
exclude = ["(^|/)(\\.venv|node_modules|generated)/", "^apps/web/"]
namespace_packages = true
explicit_package_bases = true
mypy_path = "packages/contracts/src:packages/core/src:packages/adapters/src:packages/runner/src:packages/tools-mcp/src:packages/playbooks/src:packages/cli/src:packages/agent-sdk/src:packages/outpost/src:plugins/investment-research/src:plugins/vault-transit/src:examples/agents/plain/src:apps/api/src:apps/orchestrator/src"

[[tool.mypy.overrides]]
module = ["temporalio.*", "mcp.*", "kubernetes_asyncio.*", "slack_sdk.*", "authlib.*", "jsonschema_rs.*", "prometheus_client.*", "structlog.*", "asyncpg.*", "openpyxl.*", "lxml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "*.tests.*"]
strict = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages", "apps", "plugins", "tests"]
# The evals' toy repositories have their own tests: the evals matrix runs them in a throwaway
# copy, not the platform's suite.
norecursedirs = [
  "apps/web",
  "tests/live",
  "tests/cluster",
  "node_modules",
  ".venv",
  "tests/e2e",
  "tests/fixtures/repos",
]
addopts = "-q --strict-markers --import-mode=importlib"
markers = [
  "integration: needs external services (kind, docker)",
  "e2e: end-to-end scenario",
  "conformance: backends/templates conformance suite",
  "slow: long test",
  "live: needs real credentials (Jira, GitLab, Azure) — skipped without them",
  "cluster: needs a real Kubernetes cluster (a CNI that enforces NetworkPolicies)",
  "capability(executor, name): this cluster test proves that capability of that executor (S35-04)",
  "buildkit: needs a real buildkitd and a registry (S41-13, the `hosted-build` CI job)",
  "cosign_real: runs the real cosign against a registry (TRANIBOR_COSIGN_REAL_REGISTRY); skipped without them",
  "hosted_docker: builds and runs hosted agents with a real Docker daemon (S41-23, the `hosted-images` CI job); skipped without one",
  "gvisor: runs the agent inside a gVisor sandbox (TRANIBOR_TEST_RUNSC, S41-17, the `hosted-gvisor` CI job)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["packages/core/src", "packages/runner/src", "packages/agent-sdk/src", "packages/adapters/src", "apps/api/src", "apps/orchestrator/src", "packages/cli/src", "packages/contracts/src", "packages/playbooks/src", "packages/tools-mcp/src", "packages/outpost/src", "plugins/investment-research/src", "plugins/vault-transit/src"]
omit = ["*/generated/*", "*/tests/*"]

[tool.coverage.report]
# Scope: every Python package (packages/*/src, apps/api/src, apps/orchestrator/src); the generated
# TypeScript under packages/contracts/ts is not Python and is not measured. Measured on 2026-10-30
# over `pytest --cov -m "not slow"`: 84 %. The threshold is kept at 80 % (the rule is to never set
# it above the measured value), and it only rises: raise it when the measure rises, never lower it.
fail_under = 80
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
