# helm unittest: what the chart must guarantee, whatever happens.
#
# The paths point to the sub-chart's **name** (`charts/choregos-api/...`), not its
# directory (`charts/api/...`): the plugin indexes templates by chart name. With the
# directory, it answers "template not exists or not selected in test suite" — a message
# that looks like a missing file when the file is there.
#
# The suite lives in the parent chart and not in the sub-chart: the `api` templates
# call `choregos.labels`, a parent helper, and do not render on their own.
suite: API Choregos
templates:
  - charts/choregos-api/templates/deployment.yaml
  - charts/choregos-api/templates/migrations-job.yaml
# Offline rendering: the default executor (agent_sandbox, ADR 0072) refuses to render without its
# operator among the cluster's API versions, which a unit test does not have.
set:
  choregos-orchestrator.runner.skipOperatorCheck: true
tests:
  - it: sets a non-root security context
    template: charts/choregos-api/templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

  - it: exposes liveness and readiness probes
    template: charts/choregos-api/templates/deployment.yaml
    asserts:
      - isNotNull:
          path: spec.template.spec.containers[0].readinessProbe
      - isNotNull:
          path: spec.template.spec.containers[0].livenessProbe

  - it: never puts a secret in clear text in the environment
    template: charts/choregos-api/templates/deployment.yaml
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="CHOREGOS_SESSION_SECRET")].value
          pattern: ".+"

  - it: runs the migrations before the pods are updated
    template: charts/choregos-api/templates/migrations-job.yaml
    # The template has rendered two documents since 2026-09-26: the HOOK's service account
    # (index 0) then the Job (index 1). The full guard is in
    # `tests/charts/test_hook_de_migration.py`, which renders the chart for real.
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade

  - it: mounts the tool catalog only if the deployment declares one
    template: charts/choregos-api/templates/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content: { name: catalogue }
      - notExists:
          path: spec.template.spec.containers[0].envFrom

  - it: mounts the catalog and its keys when it is declared
    template: charts/choregos-api/templates/deployment.yaml
    set:
      global.toolCatalog.configMap: outils
      global.toolCatalog.credentialsSecret: cles-fournisseurs
    asserts:
      # The catalog is readable (a ConfigMap, reviewed in PRs); the providers' keys
      # are not — they arrive by reference to a Secret, never in the spec.
      - contains:
          path: spec.template.spec.volumes
          content:
            name: catalogue
            configMap: { name: outils }
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef: { name: cles-fournisseurs }
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHOREGOS_TOOL_CATALOG
            value: /etc/choregos/outils/catalogue.yaml

  - it: never enables the development login by default
    template: charts/choregos-api/templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHOREGOS_DEV_LOGIN_ENABLED
            value: "false"

  - it: enables the development login only when asked
    template: charts/choregos-api/templates/deployment.yaml
    set:
      global.devLogin.enabled: true
      global.devLogin.adminEmails: "admin@varga.dev"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHOREGOS_DEV_LOGIN_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHOREGOS_DEV_ADMIN_EMAILS
            value: "admin@varga.dev"
