# The reviewed list behind the skills catalogue (ADR 0065). A line names a skill by its SKILL.md
# `name` (and a `path` when a repository holds two of that name); `make catalogues` resolves it at
# the commit `ref` points to, records that commit, and applies the publisher allowlist, the licence
# rule and the gate. `delivery: bundled` is a request: the skill is vendored in the image only when
# its licence is permissive and the gate calls it low or medium risk; otherwise it is `git`, fetched
# at its pinned commit when installed. Default: `git`.
#
# Left out on purpose: Anthropic's docx, pdf, pptx and xlsx (proprietary), skills without a licence
# file, and repositories that are not on the publisher list. They stay importable by hand through
# the git import, where a person decides.
#
# Categories: engineering, review, testing, security, documentation, product, design, data, finance,
# legal, hr, sales, marketing, operations, support, cloud, research.

- repo: obra/superpowers
  ref: main
  skills:
    - { name: writing-plans, categories: [engineering], delivery: bundled }
    - { name: verification-before-completion, categories: [engineering, review], delivery: bundled }
    - { name: requesting-code-review, categories: [review], delivery: bundled }
    - { name: receiving-code-review, categories: [review], delivery: bundled }
    - { name: finishing-a-development-branch, categories: [engineering], delivery: bundled }
    - { name: systematic-debugging, categories: [engineering] }
    - { name: brainstorming, categories: [product, engineering] }
    - { name: executing-plans, categories: [engineering], delivery: bundled }
    - { name: subagent-driven-development, categories: [engineering] }
    # `test-driven-development` exists here and in addyosmani/agent-skills: the catalogue keeps one.

