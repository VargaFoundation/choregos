{{- /*
One instance, one volume, a password drawn at random on the first installation and
**re-read** on later ones (`lookup`): without that lookup, every `helm upgrade` would produce a
new password, which PostgreSQL would ignore — the database keeps the one from its initdb — and
the application would lose its connection without any resource appearing to fail.
*/}}
{{- $secretName := printf "%s-postgresql" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $password := "" }}
{{- if $existing }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels: {{- include "choregos.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.global.database.user | quote }}
  password: {{ $password | quote }}
  database: {{ .Values.global.database.name | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $secretName }}-init
  labels: {{- include "choregos.labels" . | nindent 4 }}
data:
  # Run ONCE ONLY, at the volume's initdb. The LiteLLM gateway keeps its virtual
  # keys and their consumption in its own database: Choregos' schema
  # contains only what Choregos writes.
  # The role the API connects with: WITHOUT SUPERUSER. A superuser ignores
  # RLS, and organization isolation then does not exist, whatever the policies say;
  # the API detects it at startup and refuses in staging/prod. `POSTGRES_USER` remains the
  # container's administration role. Same password: a single secret on a bench.
  00-app-role.sh: |
    #!/bin/sh
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
      CREATE ROLE {{ .Values.global.database.appUser }} LOGIN PASSWORD '$POSTGRES_PASSWORD' NOSUPERUSER;
      ALTER DATABASE "$POSTGRES_DB" OWNER TO {{ .Values.global.database.appUser }};
      ALTER SCHEMA public OWNER TO {{ .Values.global.database.appUser }};
    EOSQL
  01-litellm.sql: |
    CREATE DATABASE litellm OWNER {{ .Values.global.database.user }};
  # pgvector is not a trusted extension: created here, as the administration role, for the knowledge
  # index (ADR 0051). An image without it keeps working: the index then serves full-text only.
  02-pgvector.sh: |
    #!/bin/sh
    psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" -c "CREATE EXTENSION IF NOT EXISTS vector" \
      || echo "pgvector unavailable: the knowledge index will serve full-text only"
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $secretName }}
  labels: {{- include "choregos.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: choregos-postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $secretName }}
  labels: {{- include "choregos.labels" . | nindent 4 }}
spec:
  serviceName: {{ $secretName }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: choregos-postgresql
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: choregos-postgresql
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: database
    spec:
      {{- include "choregos.imagePullSecrets" $ | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: {{ $secretName }}, key: username } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $secretName }}, key: password } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: {{ $secretName }}, key: database } }
            # The volume is mounted on /var/lib/postgresql/data: initdb refuses a non-empty
            # directory (`lost+found`), hence the subdirectory.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "{{ .Values.global.database.user }}"] }
            periodSeconds: 5
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
      volumes:
        - name: init
          configMap: { name: {{ $secretName }}-init }
      {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.persistence.size }} } }
  {{- end }}
