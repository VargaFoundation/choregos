[project]
name = "choregos-runner"
version = "0.1.0"
description = "Runner Choregos : client ACP headless, guardrails, boucle DoD"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = ["choregos-core", "choregos-adapters", "httpx>=0.27", "typer>=0.15", "structlog>=24.4", "PyYAML>=6.0"]

[project.scripts]
choregos-runner = "choregos_runner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/choregos_runner"]

[tool.hatch.build.targets.wheel.force-include]
"src/choregos_runner/backends/versions.lock" = "choregos_runner/backends/versions.lock"
