    notes: "What the 2026-11-07 live matrix (opencode, platform/claude-opus, ten repetitions) showed: all of its 13 failures were right answers that named a decoy as what it is (E1 wan#3 serving 2222, wan#30 the default deny after wan#17; E2 the sixth pair below the top five, a fix using no fromEntities). E1 asks for an Exposed: line and forbids a decoy on it; E2 asks for the top five numbered and forbids the sixth pair ranked 1 to 5, a fromEntities: key and a kubectl apply command line. Re-judged with these rules, the matrix's 80 runs all pass."
