# pnpm 12 blocks the install scripts of dependencies by default: each one must be allowed by
# name, here, where the review sees it go by.
allowBuilds:
  # Downloads and verifies the platform's native binary; vite and vitest depend on it.
  esbuild: true
  # Native resolver of `eslint-plugin-import` (via `eslint-config-next`): without its binary,
  # lint fails on import resolution.
  unrs-resolver: true
