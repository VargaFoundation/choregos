{{- if .Values.demoFakes.enabled }}
{{- /*
Les faux du scénario RH servis par UN processus (S20-07). L'API (deux répliques) et
l'orchestrateur sont des processus distincts : un faux en mémoire leur montrerait autant de
parcs, d'annuaires et de lecteurs de badges qu'il y a de processus. Une seule réplique, c'est tout
l'objet. Pour une démonstration : `garde.yaml` le refuse en staging et en prod.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: choregos-demo-fakes
  labels:
    app.kubernetes.io/name: choregos-demo-fakes
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: choregos
    app.kubernetes.io/component: demo-fakes
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/name: choregos-demo-fakes
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: choregos-demo-fakes
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: choregos
        app.kubernetes.io/component: demo-fakes
    spec:
      {{- include "choregos.imagePullSecrets" $ | nindent 6 }}
      automountServiceAccountToken: false
      securityContext: {{- toYaml .Values.global.podSecurityContext | nindent 8 }}
      containers:
        - name: demo-fakes
          # L'image de l'API porte les faux et `uvicorn` : rien de plus à construire.
          image: {{ include "choregos.image" (dict "global" .Values.global "image" (index .Values "choregos-api" "image")) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext: {{- toYaml .Values.global.securityContext | nindent 12 }}
          command: ["python", "-m", "choregos_adapters.fakes.serveur"]
          ports:
            - name: http
              containerPort: {{ .Values.demoFakes.port }}
          env:
            - name: CHOREGOS_DEMO_PORT
              value: {{ .Values.demoFakes.port | quote }}
            {{- with .Values.demoFakes.tokenSecret }}
            # Le jeton des serveurs MCP, et le secret d'application du faux Graph : par
            # référence, comme tout secret ; sans lui, la politique réseau est la seule porte.
            - name: CHOREGOS_DEMO_JETON
              valueFrom: { secretKeyRef: { name: {{ .name }}, key: {{ .key }} } }
            {{- end }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          resources: {{- toYaml .Values.demoFakes.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: choregos-demo-fakes
  labels:
    app.kubernetes.io/name: choregos-demo-fakes
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: choregos
    app.kubernetes.io/component: demo-fakes
spec:
  selector:
    app.kubernetes.io/name: choregos-demo-fakes
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.demoFakes.port }}
      targetPort: http
{{- end }}
