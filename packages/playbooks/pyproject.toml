[project]
name = "choregos-playbooks"
version = "0.4.0"
description = "Playbooks Choregos : prompts par rôle et évals"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = ["jinja2>=3.1", "pydantic>=2.9", "PyYAML>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `packages` embarque TOUT l'arbre, y compris les gabarits `roles/*.md` et les évals : un
# `force-include` sur `roles/` les ajoutait une seconde fois au même chemin, et hatchling
# refuse — « A second file is being added to the wheel archive at the same path ». Le job
# de release échouait donc sur ce seul paquet depuis qu'il construit des wheels (v0.4.0).
# Le test `tests/docs` vérifie que les gabarits sont bien dans le wheel, pas seulement que
# la construction passe.
packages = ["src/choregos_playbooks"]
