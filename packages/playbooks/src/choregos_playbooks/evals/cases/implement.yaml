role: implement
description: >-
  The implementation playbook must forbid widening the scope, require real evidence,
  and remind the agent that the platform checks it again.
must_contain:
  - "within the allowed paths"
  - "report_finding"
  - "result.json"
  - "evidence"
  - "Conventional commits"
must_not_contain:
  - "ignore the tests"
rubric:
  - criterion: "forbids writing outside the scope"
    weight: 3
  - criterion: "requires verifiable evidence"
    weight: 3
  - criterion: "distinguishes fixing within the scope from reporting out of scope"
    weight: 2
min_score: 0.85
