enabled: true
replicaCount: 2
image:
  # Empty: `global.imageRegistry`. Another registry — the `-ee` images of the enterprise edition,
  # served by a private project — is set here, component by component.
  registry: ""
  repository: choregos-api
  tag: ""
  digest: ""
# Verbatim pod volumes and container mounts for the API, so that a deployment can hand files to a
# plugin (a theme, a licence, a CA bundle) without forking the chart. A volume named like one the
# chart owns (tmp, catalogue, workflow-templates, playbooks) fails at render.
extraVolumes: []
extraVolumeMounts: []
service:
  port: 8000
resources:
  requests: { cpu: 200m, memory: 512Mi }
  limits: { cpu: "1", memory: 1Gi }
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
migrations:
  enabled: true
ingress:
  enabled: true
  # Ingress annotations (`kind: ingress`). For a controller that refuses two Ingresses on the same
  # host — NGINX Inc.: "All hosts are taken by other resources" — the API and the console on a single
  # host are declared as minions of a master Ingress: `nginx.org/mergeable-ingress-type: minion`.
  annotations: {}
  hostnames: ["api.choregos.local"]
  gateway: choregos-gateway
  gatewayNamespace: gateway
podDisruptionBudget:
  enabled: true
  minAvailable: 1
# The MCP server catalogue (ADR 0065).
# `egressHosts`: the hosts the API pod may reach, as the deployment's network policy lets it, with
# `*.` wildcards. It restricts nothing (the network policy does): the catalogue uses it to tell an
# administrator, before a silent timeout, that a server's host is not declared. Empty: unknown.
egressHosts: []
# `mcpCatalogueExtra`: the name of a ConfigMap whose `catalogue.yaml` lists the operator's own MCP
# servers (`entries: [...]`, same fields as the shipped catalogue), merged after it. Empty: none.
mcpCatalogueExtra: ""
