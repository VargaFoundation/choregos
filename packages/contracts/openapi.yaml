  /internal/agent-sessions/{id}/input:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [internal]
      security: [{ runToken: [] }]
      operationId: getAgentSessionInput
      description: >-
        A hosted session's stage input (S41-11, ADR 0080 §10), as its pod's workflow wrote it: no gateway key, no
        token in it. Read by the pod's runner with the token minted for `session-{id}`; any other token is refused.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/StageInput" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /internal/agent-sessions/{id}/turns/next:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [internal]
      security: [{ runToken: [] }]
      operationId: nextAgentSessionTurn
      description: >-
        The oldest response the session's person asked for that the pod has not answered. With `wait`, up to that many
        seconds for one to come; no turn is 204, a session that ended is 410 and the runner stops.
      parameters:
        - { name: wait, in: query, required: false, schema: { type: number, minimum: 0, maximum: 30, default: 0 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AgentSessionTurn" } } } }
        "204": { description: No turn waits }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { description: The session ended, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /internal/agent-sessions/{id}/turns/{turn_id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: turn_id, in: path, required: true, schema: { type: string } }
    post:
      tags: [internal]
      security: [{ runToken: [] }]
      operationId: postAgentSessionTurnResult
      description: >-
        How the session's container answered a turn. Journaled once: a second post of the same turn changes nothing.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentSessionTurnResult" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [status, turn_id], properties: { status: { type: string, enum: [recorded, already_recorded] }, turn_id: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { description: The session ended, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /internal/agent-sessions/{id}/socket/next:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [internal]
      security: [{ runToken: [] }]
      operationId: nextAgentSessionSocketFrames
      description: >-
        What the caller did on a hosted session's socket (S41-21) after the journal's `after`: open the container's
        `/invocations_ws`, a text frame for it, close it. With `wait`, up to that many seconds for one; `out_n` is the
        last of the container's frames journaled, which the pod numbers the next one after. A session that ended is
        410 and the runner stops.
      parameters:
        - { name: after, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: wait, in: query, required: false, schema: { type: number, minimum: 0, maximum: 30, default: 0 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AgentSessionSocketNext" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { description: The session ended, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /internal/agent-sessions/{id}/socket/out:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [internal]
      security: [{ runToken: [] }]
      operationId: postAgentSessionSocketFrames
      description: >-
        What the container sent on its `/invocations_ws`, numbered by the pod from 1, and whether it closed it. Each
        number is journaled once: a batch posted again changes nothing; a number that leaves a hole is 409.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentSessionSocketOut" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AgentSessionSocketRecorded" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: A frame out of order, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "410": { description: The session ended, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /internal/agent-sessions/{id}/tools:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [internal]
      security: [{ runToken: [] }]
      operationId: listAgentSessionTools
      description: >-
        The read tools the agent's `mcp_servers` grant in the session's project, as MCP's `tools/list` announces them.
        The runner serves them to the container on its loopback MCP listener.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AgentSessionTools" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /internal/agent-sessions/{id}/tools/{name}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: name, in: path, required: true, schema: { type: string } }
    post:
      tags: [internal]
      security: [{ runToken: [] }]
      operationId: callAgentSessionTool
      description: >-
        One of the container's tool calls, through the courtier, the injection guard and the ledger, as a prompt
        session's. A tool the session is not granted is 404.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentSessionToolCall" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AgentSessionToolAnswer" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { description: The session ended, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /internal/runs/{id}/network:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [internal]
      security: [{ runToken: [] }]
      operationId: getRunNetwork
      description: >-
        The network THIS run may use (ADR 0070): the agent's hosts narrowed by the project's and the organisation's,
        plus the repository host. Read by the egress proxy with the run's own token; a token of another run is refused.
        A hosted session's pod (S41-11) reads it as `session-{id}`: its agent version's network.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RunNetwork" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /internal/runs/{id}/network/decisions:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [internal]
      security: [{ runToken: [] }]
      operationId: postRunNetworkDecisions
      description: >-
        What the egress proxy or the runner let through or refused for this run. Counters are CUMULATIVE per
        (layer, host, decision, reason): a replayed batch replaces the totals and never adds twice. The first
        `denied` of a host for the run is journaled as `choregos.network.denied`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NetworkDecisionBatch" } } }
      responses:
        "202": { description: Accepted, content: { application/json: { schema: { type: object, required: [accepted], properties: { accepted: { type: integer } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /internal/orgs/{org}/outbound-proxy/{kind}:
    parameters:
      - $ref: "#/components/parameters/Org"
      - { name: kind, in: path, required: true, schema: { type: string, enum: [web_fetch, web_search, knowledge_web, search_engines] } }
    get:
      tags: [internal]
      security: [{ relayToken: [] }]
      operationId: getRelayOutboundProxy
      summary: The outbound proxy a kind of the organisation's traffic must go through, for the relay.
      description: |
        Asked by the in-cluster outbound-proxy relay (ADR 0091, S40-26d), never by a person or a run. The
        relay's credential is a JWT for ONE organisation (`sub` = its slug, `aud` = `choregos-relay`): a run
        token, a user session or an API token is refused, and a relay token for another organisation is a 403.
        `proxy: null` means no proxy applies (none set, disabled, or `kind` outside `applies_to`): the relay
        goes direct. Otherwise `proxy` carries the password in clear: the one place it leaves the sealed
        store, which is why the route is this narrow. The answer is `Cache-Control: no-store` and is not
        audited (the relay asks at most once per kind and half a minute). 503 when a proxy applies but
        cannot be built (the password is lost, the deployment has no secrets key): the relay then refuses
        the traffic, it never goes direct.
      responses:
        "200":
          description: The proxy to use, or `null`
          content: { application/json: { schema: { $ref: "#/components/schemas/RelayOutboundProxy" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { description: "A proxy applies but cannot be built", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /internal/runs/{id}/inputs:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [internal]
      security: [{ runToken: [] }]
      operationId: getRunInputs
      description: >-
        The declared inputs of the run that an earlier step produced, latest revision of each (ADR 0049).
        The runner mounts them as files in `.choregos/inputs/`.
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/RunInputFile" } } } } }
  /internal/runs/{id}/inputs/{name}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [internal]
      security: [{ runToken: [] }]
      operationId: getRunInputContent
      description: >-
        The bytes of a declared input, digest checked; the read leaves a hand-off receipt (S25-04). An
        input the run's transition does not declare is not served.
      responses:
        "200": { description: The content, content: { "*/*": { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /internal/runs/{id}/outputs/{name}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: name, in: path, required: true, schema: { type: string } }
    put:
      tags: [internal]
      security: [{ runToken: [] }]
      operationId: putRunOutput
      description: >-
        A deliverable the agent wrote in `.choregos/outputs/` (ADR 0049). The API hashes the bytes,
        refuses them unless they match `X-Choregos-Digest`, stores them in the object store and records
        a typed artifact revision with its produced receipt. Same bytes, same version. Closed once the
        run's result is posted.
      parameters:
        - { name: type, in: query, required: true, description: "a type of the artifact vocabulary", schema: { type: string } }
        - { name: X-Choregos-Digest, in: header, required: true, description: "sha256:<hex> of the body", schema: { type: string } }
      requestBody:
        required: true
        content: { application/octet-stream: { schema: { type: string, format: binary } } }
      responses:
        "200": { description: Stored, content: { application/json: { schema: { $ref: "#/components/schemas/Artifact" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { description: Larger than CHOREGOS_ARTIFACT_MAX_BYTES, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { description: Object store unavailable, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /internal/runs/{id}/ci-logs:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [internal]
      security: [{ runToken: [] }]
      operationId: getRunCiLogs
      parameters: [{ name: tail, in: query, schema: { type: integer, default: 500, maximum: 5000 } }]
      responses:
        "200": { description: Logs, content: { application/json: { schema: { type: object, properties: { logs: { type: string }, ref: { type: string } } } } } }
  /internal/runs/{id}/git-token:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [internal]
      security: [{ runToken: [] }]
      operationId: postRunGitToken
      description: >-
        A git token for THIS run: an installation token of the platform's GitHub App, scoped to the
        run's repository alone, with `contents: write`, valid one hour. `token` is null when the
        repository is not on GitHub or when no App is configured: the run then clones without one.
      responses:
        "200": { description: The token, or null, content: { application/json: { schema: { $ref: "#/components/schemas/GitToken" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /integrations:
    get:
      tags: [session]
      operationId: getIntegrations
      summary: Where to connect an MCP client (Claude Code, Cursor…) to this platform (ADR 0030)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Integrations" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /procedures:
    get:
      tags: [session]
      operationId: listProcedures
      summary: The setup procedures (one per connector type, source kind, MCP client and external agent kind), or the best one for a target (ADR 0067)
      parameters:
        - name: for
          in: query
          required: false
          description: >-
            `connector:documents/sharepoint`, `source:web`, `agent:remote.a2a` or `door_client:cursor`.
            Answers the one best procedure for it, or an empty list.
          schema: { type: string }
        - name: card_host
          in: query
          required: false
          description: The host of an agent card; selects a preset (`a2a.atlassian.com`).
          schema: { type: string }
        - name: preset
          in: query
          required: false
          description: A catalogue preset, e.g. `atlassian-rovo`.
          schema: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProcedureSummary" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /procedures/{procedure_id}:
    get:
      tags: [session]
      operationId: getProcedure
      summary: One setup procedure, with this deployment's webhook and callback URLs filled in
      parameters:
        - { name: procedure_id, in: path, required: true, schema: { type: string } }
        - name: org
          in: query
          required: false
          description: Fills `{{org}}`; by default the caller's only organisation.
          schema: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Procedure" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /healthz:
    get: { tags: [session], security: [], operationId: healthz, responses: { "200": { description: OK } } }
  /edition:
    get:
      tags: [session]
      security: []
      operationId: edition
      summary: Which edition is running, and what it allows itself (ADR 0024)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [edition, features, version]
                properties:
                  edition: { type: string, enum: [community, enterprise] }
                  features: { type: array, items: { type: string } }
                  version: { type: string, description: "the core's version" }
                  publisher:
                    type: [string, "null"]
                    maxLength: 80
                    description: who publishes the running edition, as announced by its plugin; null in the community edition
                  edition_version:
                    type: [string, "null"]
                    description: the version of the edition plugin; null in the community edition
                  licence:
                    type: string
                    maxLength: 80
                    description: the licence the core is distributed under (an SPDX identifier)
                  edition_licence:
                    type: [string, "null"]
                    maxLength: 80
                    description: the licence of the edition plugin, as announced by it; null in the community edition or when the plugin announces none
                  build:
                    type: object
                    required: [revision]
                    description: what built the running image. Public, like the rest of this response.
                    properties:
                      revision:
                        type: [string, "null"]
                        pattern: "^[0-9a-f]{7,40}$"
                        description: the source revision the image was built from; null when the build did not record it
  /theme:
    get:
      tags: [session]
      security: []
      operationId: theme
      summary: The look of the console, as data (ADR 0064)
      description: >
        Public: the sign-in page needs it. The community edition serves its default theme; a plugin
        may provide another through `declare_theme_provider`. A theme that fails validation (schema,
        or the console's contrast budget) is never served: the response is then the default theme
        with `X-Choregos-Theme: fallback`.
      parameters:
        - name: org
          in: query
          required: false
          description: The organisation whose theme is wanted; absent = the instance theme.
          schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
      responses:
        "200":
          description: OK
          headers:
            X-Choregos-Theme:
              description: "`default` (no provider, or nothing to provide), `provided`, or `fallback` (the provider failed or returned an invalid theme)"
              schema: { type: string, enum: [default, provided, fallback] }
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Theme" }
        "304": { description: Not modified }
  /readyz:
    get: { tags: [session], security: [], operationId: readyz, responses: { "200": { description: OK }, "503": { description: Not ready } } }
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: choregos_session }
    bearer: { type: http, scheme: bearer, bearerFormat: choregos-api-token }
    runToken: { type: http, scheme: bearer, bearerFormat: JWT, description: "Run JWT signed with ES256, aud=internal" }
    relayToken: { type: http, scheme: bearer, bearerFormat: JWT, description: "Relay JWT signed with ES256, aud=choregos-relay, sub=the organisation's slug, expiring (ADR 0091)" }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string } }
    Org: { name: org, in: path, required: true, schema: { type: string } }
    Env: { name: env, in: path, required: true, schema: { type: string } }
    ConnectorKind:
      name: kind
      in: path
      required: true
      description: a capability; the registry says which ones exist (`GET /connectors/types`, ADR 0034)
      schema: { type: string, pattern: "^[a-z][a-z0-9_]{1,31}$" }
    PluginName: { name: name, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
  responses:
    Unauthorized:
      description: Not authenticated
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Forbidden:
      description: Forbidden (RBAC)
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    NotFound:
      description: Not found
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Conflict:
      description: State conflict
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    EgressRequired:
      description: "State conflict. When `code` is `egress_required`, a host the call needs is not yet in the organisation's egress allowlist: `verdicts` says where each stands, and the console opens its network-access modal (S39-22)."
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/EgressRequired" } } }
    ValidationError:
      description: Unprocessable entity
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
  schemas:
    ThemeColour: { type: string, pattern: "^#[0-9a-fA-F]{6}$", description: "#rrggbb only: no var(), no name, no alpha, so it is safe to emit as CSS and measurable for contrast" }
    ThemeTokens:
      type: object
      description: >
        Sparse overrides of the console's colour roles (the names are the `--choregos-*` custom
        properties of `theme.css` without the prefix). A role left out keeps the console default.
      additionalProperties: false
      properties:
        accent: { $ref: "#/components/schemas/ThemeColour" }
        accent-hover: { $ref: "#/components/schemas/ThemeColour" }
        accent-ink: { $ref: "#/components/schemas/ThemeColour" }
        accent-line: { $ref: "#/components/schemas/ThemeColour" }
        accent-soft: { $ref: "#/components/schemas/ThemeColour" }
        accent-strong: { $ref: "#/components/schemas/ThemeColour" }
        agent-ink: { $ref: "#/components/schemas/ThemeColour" }
        agent-line: { $ref: "#/components/schemas/ThemeColour" }
        agent-soft: { $ref: "#/components/schemas/ThemeColour" }
        agent-solid: { $ref: "#/components/schemas/ThemeColour" }
        danger: { $ref: "#/components/schemas/ThemeColour" }
        failed-ink: { $ref: "#/components/schemas/ThemeColour" }
        failed-line: { $ref: "#/components/schemas/ThemeColour" }
        failed-soft: { $ref: "#/components/schemas/ThemeColour" }
        failed-solid: { $ref: "#/components/schemas/ThemeColour" }
        focus: { $ref: "#/components/schemas/ThemeColour" }
        ink: { $ref: "#/components/schemas/ThemeColour" }
        ink-muted: { $ref: "#/components/schemas/ThemeColour" }
        ink-placeholder: { $ref: "#/components/schemas/ThemeColour" }
        ink-subtle: { $ref: "#/components/schemas/ThemeColour" }
        inverse: { $ref: "#/components/schemas/ThemeColour" }
        inverse-hover: { $ref: "#/components/schemas/ThemeColour" }
        inverse-ink: { $ref: "#/components/schemas/ThemeColour" }
        line: { $ref: "#/components/schemas/ThemeColour" }
        line-strong: { $ref: "#/components/schemas/ThemeColour" }
        neutral-ink: { $ref: "#/components/schemas/ThemeColour" }
        neutral-line: { $ref: "#/components/schemas/ThemeColour" }
        neutral-soft: { $ref: "#/components/schemas/ThemeColour" }
        neutral-solid: { $ref: "#/components/schemas/ThemeColour" }
        ok: { $ref: "#/components/schemas/ThemeColour" }
        raised: { $ref: "#/components/schemas/ThemeColour" }
        retrying-ink: { $ref: "#/components/schemas/ThemeColour" }
        retrying-line: { $ref: "#/components/schemas/ThemeColour" }
        retrying-soft: { $ref: "#/components/schemas/ThemeColour" }
        retrying-solid: { $ref: "#/components/schemas/ThemeColour" }
        running-ink: { $ref: "#/components/schemas/ThemeColour" }
        running-line: { $ref: "#/components/schemas/ThemeColour" }
        running-soft: { $ref: "#/components/schemas/ThemeColour" }
        running-solid: { $ref: "#/components/schemas/ThemeColour" }
        sidebar: { $ref: "#/components/schemas/ThemeColour" }
        succeeded-ink: { $ref: "#/components/schemas/ThemeColour" }
        succeeded-line: { $ref: "#/components/schemas/ThemeColour" }
        succeeded-soft: { $ref: "#/components/schemas/ThemeColour" }
        succeeded-solid: { $ref: "#/components/schemas/ThemeColour" }
        surface: { $ref: "#/components/schemas/ThemeColour" }
        surface-muted: { $ref: "#/components/schemas/ThemeColour" }
        surface-sunken: { $ref: "#/components/schemas/ThemeColour" }
        waiting-ink: { $ref: "#/components/schemas/ThemeColour" }
        waiting-line: { $ref: "#/components/schemas/ThemeColour" }
        waiting-soft: { $ref: "#/components/schemas/ThemeColour" }
        waiting-solid: { $ref: "#/components/schemas/ThemeColour" }
        warn: { $ref: "#/components/schemas/ThemeColour" }
    ThemeAsset:
      type: string
      pattern: "^/api/v1/[A-Za-z0-9/_.-]{1,200}$"
      description: "A file served by the API under /api/v1 (same origin: the console's CSP allows font-src and img-src 'self' only)"
    ThemeFace:
      type: object
      required: [src, weight, style]
      additionalProperties: false
      properties:
        src: { $ref: "#/components/schemas/ThemeAsset" }
        weight: { type: integer, minimum: 100, maximum: 900 }
        style: { type: string, enum: [normal, italic] }
    ThemeFont:
      type: object
      required: [family, weight, faces]
      additionalProperties: false
      properties:
        family: { type: string, pattern: "^[A-Za-z0-9 _-]{1,40}$" }
        weight: { type: integer, minimum: 100, maximum: 900, description: "The weight titles are set in" }
        faces: { type: array, maxItems: 8, items: { $ref: "#/components/schemas/ThemeFace" } }
    Theme:
      type: object
      required: [id, product_name, default_mode, tokens]
      additionalProperties: false
      properties:
        id: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,63}$", description: "`default` in the community edition" }
        product_name: { type: string, minLength: 1, maxLength: 40, description: "The wordmark text and the document-title suffix" }
        default_mode: { type: string, enum: [dark, light], description: "The mode used when the person has no preference" }
        tokens:
          type: object
          required: [dark, light]
          additionalProperties: false
          properties:
            dark: { $ref: "#/components/schemas/ThemeTokens" }
            light: { $ref: "#/components/schemas/ThemeTokens" }
        radius:
          type: object
          additionalProperties: false
          properties:
            control: { type: integer, minimum: 0, maximum: 8, description: "px; absent = the console default" }
            surface: { type: integer, minimum: 0, maximum: 12, description: "px; absent = the console default" }
        fonts:
          type: object
          description: The mono font stays Geist Mono
          additionalProperties: false
          properties:
            title: { $ref: "#/components/schemas/ThemeFont" }
            sans: { $ref: "#/components/schemas/ThemeFont" }
        logo: { $ref: "#/components/schemas/ThemeAsset" }
        logo_dark: { $ref: "#/components/schemas/ThemeAsset" }
        favicon: { $ref: "#/components/schemas/ThemeAsset" }
        footer:
          type: object
          required: [text]
          additionalProperties: false
          properties:
            text: { type: string, maxLength: 200 }
    Problem:
      type: object
      description: RFC 9457
      required: [type, title, status]
      properties:
        type: { type: string, default: about:blank }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              loc: { type: array, items: { type: string } }
              msg: { type: string }
              code: { type: string, description: Machine code of a workflow or policy issue }
              deprecated_code:
                type: string
                deprecated: true
                description: Former spelling of a code renamed to English, emitted for one release (ADR 0046)
              line: { type: integer }
              column: { type: integer }
        retry_after: { type: integer }
        code: { type: string, description: "A machine code on some 409s: `stale_base` (from an agent publication, or from `updateProject`), `no_change`, `eval_failed` (S40-12)" }
        latest_version: { type: integer, description: "On `stale_base` and `no_change`: the agent's latest version" }
        latest_revision: { type: string, description: "On `stale_base` from `updateProject`: the project's current `config_revision`" }
        latest_author: { type: [string, "null"], description: "On `stale_base`: who published the latest version" }
    PageMeta:
      type: object
      required: [has_more]
      properties:
        next_cursor: { type: [string, "null"] }
        has_more: { type: boolean }
    Role:
      type: string
      enum: [org_admin, project_owner, developer, release_captain, viewer]
    Size: { type: string, enum: [S, M, L, XL] }
    Risk: { type: string, enum: [low, medium, high] }
    Me:
      type: object
      required: [id, email, display_name, memberships]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        display_name: { type: string }
        oidc_sub: { type: string }
        last_login_at: { type: [string, "null"], format: date-time }
        memberships: { type: array, items: { $ref: "#/components/schemas/Membership" } }
    Membership:
      type: object
      required: [org, role]
      properties:
        user_id: { type: string }
        email: { type: string }
        org: { type: string }
        project_slug: { type: [string, "null"] }
        role: { $ref: "#/components/schemas/Role" }
    MembershipUpsert:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        project_slug: { type: [string, "null"] }
    Project:
      type: object
      required: [id, slug, org, name, status, config]
      properties:
        id: { type: string }
        slug: { type: string }
        org: { type: string }
        name: { type: string }
        template_ref: { type: [string, "null"] }
        status: { type: string, enum: [draft, provisioning, active, suspended, archived] }
        config: { $ref: "./schemas/project.schema.json" }
        config_revision: { type: string, description: "An opaque digest of the name and configuration, to send back as `base_revision`" }
        workflow_name: { type: [string, "null"] }
        policy_name: { type: [string, "null"] }
        has_release_train: { type: boolean, default: false, description: "An active workflow of the project has a `via: release_train` transition: only then does the project have trains." }
        stats: { $ref: "#/components/schemas/ProjectStats" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProjectStats:
      type: object
      properties:
        active_work_items: { type: integer }
        cost_month_eur: { type: number }
        budget_month_eur: { type: [number, "null"] }
        trains_pending: { type: integer }
        first_pass_merge_rate: { type: [number, "null"] }
        cycle_time_p50_hours: { type: [number, "null"] }
    ProjectPage:
      type: object
      required: [items, meta]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Project" } }
        meta: { $ref: "#/components/schemas/PageMeta" }
    ProjectCreate:
      type: object
      required: [slug, name, config]
      properties:
        slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        name: { type: string }
        template_ref: { type: [string, "null"] }
        config: { $ref: "./schemas/project.schema.json" }
        inputs: { type: object, additionalProperties: true }
    ProjectUpdate:
      type: object
      properties:
        name: { type: string }
        config: { $ref: "./schemas/project.schema.json" }
        base_revision: { type: [string, "null"], description: "The `config_revision` the client read; when it is no longer current, the PATCH answers 409 `stale_base` and writes nothing; absent, the last write wins" }
    ProvisionRequest:
      type: object
      properties:
        inputs: { type: object, additionalProperties: true }
        dry_run: { type: boolean, default: false }
        resume: { type: boolean, default: true }
    ProvisionStatus:
      type: object
      required: [project_id, status, steps]
      properties:
        project_id: { type: string }
        workflow_id: { type: [string, "null"] }
        status: { type: string, enum: [pending, running, succeeded, failed] }
        current_step: { type: [string, "null"] }
        steps:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name: { type: string }
              status: { type: string, enum: [pending, running, succeeded, failed, skipped] }
              message: { type: [string, "null"] }
              remediation: { type: [string, "null"] }
              started_at: { type: [string, "null"], format: date-time }
              ended_at: { type: [string, "null"], format: date-time }
    Connector:
      type: object
      required: [kind, type, status]
      properties:
        id: { type: string }
        kind: { type: string, description: "a capability (ADR 0034): tracker, scm, ci, cd, runtime, memory, notify, gateway — or one a plugin type declares (identity, mcp…)" }
        type: { type: string }
        config: { type: object, additionalProperties: true }
        secret_ref: { type: [string, "null"] }
        secret_refs: { type: object, additionalProperties: { type: string }, description: "the secrets, field by field, as references (`env:NAME`, or `store:...` for a sealed value) — never their value (ADR 0034, ADR 0058)" }
        secrets: { type: array, items: { $ref: "#/components/schemas/ConnectorSecretState" }, description: "one state per configured secret field: where it comes from and when it was last set" }
        status: { type: string, enum: [unknown, ok, degraded, error] }
        last_check_at: { type: [string, "null"], format: date-time }
        last_error: { type: [string, "null"] }
    ConnectorSecretState:
      type: object
      required: [field, source]
      description: What the console may know of one secret field. Never its value (ADR 0058).
      properties:
        field: { type: string }
        source: { type: string, enum: [store, reference] }
        reference: { type: [string, "null"], description: "only for source=reference: the reference itself (`env:NAME`)" }
        version: { type: [integer, "null"], description: "only for source=store: +1 at every set; null when the sealed value is gone" }
        rotated_at: { type: [string, "null"], format: date-time }
        rotated_by: { type: [string, "null"] }
    SecretValue:
      type: object
      required: [value]
      properties:
        value: { type: string, minLength: 1, maxLength: 16384, writeOnly: true }
    SecretsRewrap:
      type: object
      required: [rewrapped]
      properties:
        rewrapped: { type: integer }
    ConnectorUpsert:
      type: object
      required: [type, config]
      properties:
        type: { type: string }
        config: { type: object, additionalProperties: true, description: "no secret field: a plaintext secret gets 422" }
        secret_ref: { type: [string, "null"] }
        secret_refs: { type: object, additionalProperties: { type: string } }
        secret_values: { type: object, additionalProperties: { type: string }, writeOnly: true, description: "secret values typed in the console, field -> value: sealed, replaced by a derived `store:` reference, never returned. A stored secret the body does not name is kept (ADR 0058). A key may be a slot of a pooled field (`api_key.2`, ADR 0089)." }
    ConnectorTestResult:
      type: object
      required: [ok, checks]
      properties:
        ok: { type: boolean }
        checks:
          type: array
          items:
            type: object
            required: [name, ok]
            properties:
              name: { type: string }
              ok: { type: boolean }
              detail: { type: [string, "null"] }
    GitHubInstallation:
      type: object
      required: [id, account_login, account_type, repository_selection, suspended, claimed, settings_url]
      properties:
        id: { type: integer, description: "GitHub's installation id; discovered, never typed" }
        account_login: { type: string }
        account_type: { type: string, enum: [Organization, User] }
        repository_selection: { type: string, enum: [all, selected] }
        suspended: { type: boolean }
        claimed: { type: boolean, description: "Claimed by the organisation asking" }
        settings_url: { type: string, description: "Where to change the installation's repositories on github.com" }
    GitHubAppStatus:
      type: object
      required: [configured, multi_org_claim, installations]
      properties:
        configured: { type: boolean, description: "The deployment has a GitHub App (`CHOREGOS_GITHUB_APP_ID` and key)" }
        app_slug: { type: [string, "null"], description: "Read from GitHub (`GET /app`), never configured" }
        app_name: { type: [string, "null"] }
        install_url: { type: [string, "null"], description: "Installs the App on a GitHub account, without a state; use install-link to come back to the console" }
        multi_org_claim:
          type: string
          enum: [implicit, oauth, unavailable]
          description: "How an installation is claimed: implicit (a single-organisation instance), oauth (several organisations, proof by GitHub user authorization), unavailable (several organisations and no OAuth client secret)"
        installations:
          type: array
          items: { $ref: "#/components/schemas/GitHubInstallation" }
    GitHubRepository:
      type: object
      required: [full_name, private, default_branch, installation_id]
      properties:
        full_name: { type: string, description: "owner/repo" }
        private: { type: boolean }
        default_branch: { type: string }
        installation_id: { type: integer }
    GitHubRepositoryPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GitHubRepository" }
        meta: { $ref: "#/components/schemas/PageMeta" }
    GitHubInstallLinkRequest:
      type: object
      required: [return_to]
      additionalProperties: false
      properties:
        project: { type: [string, "null"], description: "Project slug the person came from" }
        return_to: { type: string, description: "A path of the console (starts with `/`), where the setup callback sends the person back" }
    GitHubInstallLink:
      type: object
      required: [url]
      properties:
        url: { type: string }
    ConnectorType:
      type: object
      required: [kind, type, display, config_schema]
      properties:
        kind: { type: string }
        type: { type: string }
        display: { type: string }
        available: { type: boolean, default: true }
        config_schema: { type: object, additionalProperties: true }
        capabilities: { type: array, items: { type: string }, description: "what the type can do: tracker, scm, identity, mcp…" }
        secret_fields: { type: array, items: { type: string }, description: the configuration keys that are secrets }
        pooled_fields: { type: array, items: { type: string }, default: [], description: "the secret fields that take several keys, one per slot (`api_key.2` … `api_key.10`, ADR 0089)" }
    ConnectorOperation:
      type: object
      required: [name, access, policy]
      properties:
        name: { type: string }
        access: { type: string, enum: [read, write] }
        policy: { type: string, enum: [allowed, approval, forbidden] }
        groups: { type: array, items: { type: string }, description: "the project groups entitled to it; none: all of them" }
        price_usd: { type: [number, "null"] }
        schema_digest: { type: [string, "null"] }
        input_schema: { type: [object, "null"], additionalProperties: true, description: "the input schema the broker announces to the agent and checks before the call" }
        description: { type: [string, "null"] }
        approver_group: { type: [string, "null"], description: "the identity-provider group whose members approve the actions this operation proposes; none: the project's owners" }
        result_max_bytes: { type: [integer, "null"], minimum: 1024, description: "the most one result of this operation may weigh, as JSON bytes, when it reaches the agent; none: the platform's default. Never above the platform's ceiling" }
    ConnectorDiscovery:
      type: object
      properties:
        added: { type: array, items: { type: string } }
        changed: { type: array, items: { type: string } }
        removed: { type: array, items: { type: string } }
        unchanged: { type: integer }
    OrgConnector:
      type: object
      required: [name, kind, type, status]
      properties:
        name: { type: string }
        kind: { type: string }
        type: { type: string }
        config: { type: object, additionalProperties: true }
        secret_refs: { type: object, additionalProperties: { type: string } }
        secrets: { type: array, items: { $ref: "#/components/schemas/ConnectorSecretState" } }
        status: { type: string }
        last_check_at: { type: [string, "null"], format: date-time }
        last_error: { type: [string, "null"] }
        created_by: { type: [string, "null"] }
        catalogue_entry: { type: [string, "null"], description: "`<id>@<catalogue_version>` when it was installed from the MCP catalogue (ADR 0065)" }
        operations: { type: array, items: { $ref: "#/components/schemas/ConnectorOperation" } }
        availability: { $ref: "#/components/schemas/ConnectorAvailability" }
        enabled_projects: { type: array, items: { type: string }, description: "the projects it is on for, among those the caller sees; empty with all_projects (ADR 0074)" }
        server:
          description: "the plugin server this connector runs (ADR 0096): its configuration is the server's `config_schema` and `secret_fields`, not the `mcp` type's; null for any other connector (contract-change S43-08)"
          oneOf:
            - $ref: "#/components/schemas/OrgConnectorServer"
            - { type: "null" }
    OrgConnectorServer:
      type: object
      additionalProperties: false
      description: What the console needs to configure a plugin's server, read from its declaration (ADR 0096).
      required: [plugin, version, server, config_schema, secret_fields]
      properties:
        plugin: { type: string }
        version: { type: string }
        server: { type: string }
        config_schema: { type: object, additionalProperties: true, description: "a JSON Schema" }
        secret_fields: { type: array, items: { type: string } }
    ConnectorAvailability:
      type: string
      enum: [all_projects, selected_projects]
      description: "`all_projects`: every project whose groups match reaches it (the default). `selected_projects`: only the projects it is enabled for (ADR 0074)."
    CataloguePermissions:
      type: object
      description: What the caller may do with a catalogue entry, decided by the server (ADR 0074). The console never derives it from a role.
      required: [install, configure_projects, enable_projects]
      properties:
        install: { type: boolean, description: "declare it in the organisation" }
        configure_projects: { type: array, items: { type: string }, description: "project-scope types: the projects whose settings the caller may set" }
        enable_projects: { type: array, items: { type: string }, description: "the projects where the caller may turn an installed organisation connector on or off" }
    ConnectorEnablement:
      type: object
      required: [connector, availability, enabled_projects]
      properties:
        connector: { type: string }
        availability: { $ref: "#/components/schemas/ConnectorAvailability" }
        enabled_projects: { type: array, items: { type: string }, description: "among the projects the caller sees; empty with all_projects" }
    ConnectorCatalogueEntry:
      type: object
      required: [kind, type, display, family, scope, capabilities, secret_fields, operations, installed_as, configured_in, enablement, can]
      properties:
        kind: { type: string }
        type: { type: string }
        display: { type: string }
        family: { type: string, description: "Source code, Work trackers, CI, Deployment, Documents, Directory, Network operations, Notifications, MCP servers, or Other" }
        scope: { type: string, enum: [organisation, project], description: "an organisation connector is installed by the administrator; a project connector is configured in the project's settings" }
        capabilities: { type: array, items: { type: string } }
        secret_fields: { type: array, items: { type: string }, description: "field names only, never values" }
        pooled_fields: { type: array, items: { type: string }, default: [], description: "the secret fields that take several keys, one per slot (ADR 0089)" }
        operations: { type: integer, description: "operations the type declares; an MCP server discovers its own (0)" }
        installed_as: { type: array, items: { type: string }, description: "names of the organisation connectors of this type" }
        configured_in: { type: array, items: { type: string }, description: "slugs of the projects, among those the caller sees, that configure this type" }
        enablement: { type: array, items: { $ref: "#/components/schemas/ConnectorEnablement" } }
        can: { $ref: "#/components/schemas/CataloguePermissions" }
        cannot_reason: { type: [string, "null"], description: "the server's sentence when the caller may do nothing here" }
    ConnectorCatalogue:
      type: object
      required: [entries]
      properties:
        entries: { type: array, items: { $ref: "#/components/schemas/ConnectorCatalogueEntry" } }
    ProjectOrgConnector:
      type: object
      required: [name, kind, type, availability, enabled, can_toggle]
      properties:
        name: { type: string }
        kind: { type: string }
        type: { type: string }
        availability: { $ref: "#/components/schemas/ConnectorAvailability" }
        enabled: { type: boolean }
        can_toggle: { type: boolean, description: "the caller may turn it on or off here: availability is selected_projects and the caller owns the project or administers the organisation" }
        cannot_reason: { type: [string, "null"] }
    CatalogueMeta:
      type: object
      description: Provenance shared by the platform's catalogues (ADR 0065) — which file, built when, from what.
      required: [catalogue_version, generated_at]
      properties:
        catalogue_version: { type: string, description: "CalVer, e.g. 2026.10.0" }
        generated_at: { type: string, format: date-time }
        sources: { type: object, additionalProperties: { type: string }, description: "each source the generator read, with its snapshot date" }
    McpCatalogue:
      type: object
      required: [meta, entries]
      properties:
        meta: { $ref: "#/components/schemas/CatalogueMeta" }
        entries: { type: array, items: { $ref: "#/components/schemas/McpCatalogueEntry" } }
    McpCatalogueRemote:
      type: object
      required: [url, protocol]
      properties:
        url: { type: string }
        protocol: { type: string, enum: [streamable-http, sse] }
    McpCatalogueEntry:
      type: object
      required: [id, title, description, publisher, official, reference, transport, auth, install, categories, state, egress, can]
      properties:
        id: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$" }
        title: { type: string }
        description: { type: string, maxLength: 300 }
        publisher: { type: string }
        official: { type: boolean, description: "the registry namespace or the repository owner is the vendor's own" }
        reference: { type: boolean, description: "one of the modelcontextprotocol reference servers" }
        origin: { type: string, enum: [catalogue, site], description: "the shipped catalogue, or the operator's own file (CHOREGOS_MCP_CATALOGUE_EXTRA)" }
        registry_name: { type: [string, "null"] }
        registry_version: { type: [string, "null"] }
        repo: { type: [string, "null"] }
        licence: { type: [string, "null"], description: "SPDX; null for a hosted service" }
        terms_url: { type: [string, "null"] }
        transport: { type: string, enum: [remote, stdio] }
        remote: { oneOf: [{ $ref: "#/components/schemas/McpCatalogueRemote" }, { type: "null" }] }
        auth: { type: string, description: "none, bearer, oauth or header:<Name>" }
        egress_hosts: { type: array, items: { type: string } }
        categories: { type: array, items: { type: string } }
        stars: { type: [integer, "null"] }
        stars_as_of: { type: [string, "null"], format: date }
        install: { type: string, enum: [installable, needs_oauth, needs_hosting], description: "computed from what this release can do, never stored in the file" }
        hosting: { type: [object, "null"], additionalProperties: true, description: "for a stdio server, what an operator needs to host it" }
        state: { type: string, enum: [available, installed, update] }
        installed_as: { type: array, items: { type: string }, description: "names of the org connectors created from this entry" }
        egress: { type: string, enum: [open, undeclared, unknown], description: "whether the deployment declares the host reachable from the API" }
        can: { $ref: "#/components/schemas/CataloguePermissions" }
        cannot_reason: { type: [string, "null"], description: "why the entry cannot be installed by the caller: the server's sentence" }
        enablement: { type: array, items: { $ref: "#/components/schemas/ConnectorEnablement" }, description: "one per installed instance of this entry" }
        procedure: { type: [string, "null"], description: "the setup procedure its install shows (`GET /procedures/{id}`): its own, else the generic MCP one (ADR 0067)" }
    McpCatalogueInstall:
      type: object
      properties:
        name: { type: [string, "null"], pattern: "^[a-z][a-z0-9-]{1,62}$", description: "defaults to the entry id" }
        secret_refs: { type: object, additionalProperties: { type: string }, description: "by reference; a literal is refused" }
        secret_values: { type: object, additionalProperties: { type: string }, description: "the credential typed once, sealed at rest and never returned (ADR 0058); give this or `secret_refs.token`" }
        auth_header: { type: [string, "null"], description: "for an entry whose auth is header:<Name>, the header's name; defaults to the entry's" }
        availability: { $ref: "#/components/schemas/ConnectorAvailability", description: "defaults to all_projects through the API; the console proposes selected_projects (ADR 0074)" }
        allow_egress: { type: boolean, default: false, description: "open the hosts this needs in the organisation's egress allowlist, in the same call (S39-22); needs `tools:grant`. Without it a missing host is a 409 `egress_required`" }
    SkillCatalogueInstall:
      type: object
      properties:
        allow_egress: { type: boolean, default: false, description: "open the hosts this needs in the organisation's egress allowlist, in the same call (S39-22); needs `tools:grant`. Without it a missing host is a 409 `egress_required`" }
    SkillCatalogueSignals:
      type: object
      required: [stars, stars_as_of]
      properties:
        stars: { type: [integer, "null"] }
        stars_as_of: { type: [string, "null"], format: date }
    SkillCatalogueEntry:
      type: object
      required: [id, title, description, publisher, repo, sha, path, licence, licence_class, files, bytes, digest, risk, findings_count, categories, signals, delivery, state, egress]
      properties:
        id: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$", description: "the skill's name, as its SKILL.md says it" }
        title: { type: string }
        description: { type: string, maxLength: 300 }
        publisher: { type: string }
        repo: { type: string }
        sha: { type: string, pattern: "^[0-9a-f]{40}$", description: "the pinned commit" }
        path: { type: string }
        licence: { type: string, description: "SPDX" }
        licence_class: { type: string, enum: [permissive, copyleft] }
        files: { type: integer }
        bytes: { type: integer }
        digest: { type: string, description: "sha256 of the files, as the runner recomputes it" }
        risk: { type: string, enum: [low, medium, high], description: "the gate's answer when the catalogue was generated; the gate runs again at install" }
        findings_count: { type: integer }
        categories: { type: array, items: { type: string } }
        signals: { $ref: "#/components/schemas/SkillCatalogueSignals" }
        delivery: { type: string, enum: [bundled, git], description: "vendored in the image, or fetched at its pinned commit" }
        state: { type: string, enum: [available, installed, update, pending_review, blocked] }
        installed_version: { type: [integer, "null"], description: "the version of the organisation's skill, when there is one" }
        blocked_reason: { type: [string, "null"] }
        egress: { type: string, enum: [open, undeclared, unknown], description: "for a git entry, whether the deployment declares codeload.github.com reachable from the API" }
    SkillCatalogue:
      type: object
      required: [meta, entries]
      properties:
        meta: { $ref: "#/components/schemas/CatalogueMeta" }
        entries: { type: array, items: { $ref: "#/components/schemas/SkillCatalogueEntry" } }
    OrgConnectorCreate:
      type: object
      required: [name, type]
      properties:
        name: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$" }
        type: { type: string }
        kind: { type: [string, "null"] }
        config: { type: object, additionalProperties: true }
        secret_refs: { type: object, additionalProperties: { type: string } }
        secret_values: { type: object, additionalProperties: { type: string }, writeOnly: true, description: "secret values typed in the console, field -> value: sealed, never returned (ADR 0058). A key may be a slot of a pooled field (`api_key.2`, ADR 0089)." }
        availability: { $ref: "#/components/schemas/ConnectorAvailability" }
        allow_egress: { type: boolean, default: false, description: "open the hosts this needs in the organisation's egress allowlist, in the same call (S39-22); needs `tools:grant`. Without it a missing host is a 409 `egress_required`" }
    OrgConnectorUpdate:
      type: object
      description: Absent fields are unchanged; `secret_refs` and `secret_values` merge into the connector's.
      properties:
        config: { type: [object, "null"], additionalProperties: true }
        secret_refs: { type: [object, "null"], additionalProperties: { type: string } }
        secret_values: { type: [object, "null"], additionalProperties: { type: string }, writeOnly: true }
        availability: { oneOf: [{ $ref: "#/components/schemas/ConnectorAvailability" }, { type: "null" }], description: "the organisation's administrator only; switching to selected_projects turns it on for no project (ADR 0074)" }
        allow_egress: { type: boolean, default: false, description: "open the hosts this needs in the organisation's egress allowlist, in the same call (S39-22); needs `tools:grant`. Without it a missing host is a 409 `egress_required`" }
    OperationPatch:
      type: object
      properties:
        policy: { type: [string, "null"], enum: [allowed, approval, forbidden, null] }
        groups: { type: [array, "null"], items: { type: string } }
        price_usd: { type: [number, "null"], minimum: 0 }
        approver_group: { type: [string, "null"], description: "an identity-provider group; null clears it" }
        result_max_bytes: { type: [integer, "null"], minimum: 1024, description: "the most one result may weigh, as JSON bytes; above the platform's ceiling is refused (422); null clears it" }
    ProjectOperation:
      type: object
      required: [connector, operation, access, org_policy, effective_policy]
      properties:
        connector: { type: string }
        operation: { type: string }
        access: { type: string }
        org_policy: { type: string }
        project_policy: { type: [string, "null"] }
        effective_policy: { type: string }
        description: { type: [string, "null"] }
    ProjectOperationPut:
      type: object
      required: [policy]
      properties:
        policy: { type: string, enum: [allowed, approval, forbidden] }
    ActionEffectSpec:
      type: object
      required: [effect]
      properties:
        effect: { type: string, description: "a declared effect: connector.call, or a plugin's" }
        with: { type: object, additionalProperties: true, description: "its parameters, rendered in sandboxed Jinja with `params` and `effects`" }
        compensate: { type: [object, "null"], additionalProperties: true, description: "{effect, with}: what undoes it if a later effect fails (`result` quotes its response there)" }
    ActionApproval:
      type: object
      properties:
        approvers:
          type: array
          items:
            type: object
            properties:
              role: { type: string, enum: [developer, release_captain, project_owner, org_admin] }
              group: { type: [string, "null"], description: "an identity-provider group the approver must also belong to (ADR 0052)" }
              min: { type: integer, minimum: 1, maximum: 5 }
        step_up_minutes: { type: integer, minimum: 1, maximum: 120, default: 10 }
        separation_of_duties: { type: boolean, default: true }
    ActionCreate:
      type: object
      required: [kind, title, effects]
      properties:
        kind: { type: string }
        title: { type: string }
        justification: { type: [string, "null"] }
        params: { type: object, additionalProperties: true }
        effects: { type: array, minItems: 1, items: { $ref: "#/components/schemas/ActionEffectSpec" } }
        approval: { $ref: "#/components/schemas/ActionApproval" }
        work_item_id: { type: [string, "null"] }
    ActionDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
        reason: { type: [string, "null"] }
    ActionEffect:
      type: object
      required: [position, key, effect, status]
      description: An effect under its key (`<action>:<n>`) — recorded before it is attempted, confirmed after.
      properties:
        position: { type: integer }
        key: { type: string }
        effect: { type: string }
        status: { type: string, enum: [started, done, compensated, compensation_failed] }
        attempts: { type: integer }
        result: { type: [object, "null"], additionalProperties: true }
        error: { type: [string, "null"] }
        finished_at: { type: [string, "null"], format: date-time }
    Action:
      type: object
      required: [id, origin, kind, title, status]
      description: A governed action (ADR 0035) and the log of its effects.
      properties:
        id: { type: string }
        origin: { type: string, enum: [ontology, tool, transition] }
        kind: { type: string }
        title: { type: string }
        justification: { type: [string, "null"] }
        params: { type: object, additionalProperties: true }
        effects: { type: array, items: { type: object, additionalProperties: true } }
        proposed_by: { type: object, additionalProperties: true }
        approval: { type: object, additionalProperties: true }
        decisions: { type: array, items: { type: object, additionalProperties: true } }
        status: { type: string, enum: [pending_approval, rejected, approved, running, awaiting_evidence, succeeded, failed] }
        result: { type: [object, "null"], additionalProperties: true }
        error: { type: [string, "null"] }
        temporal_wf_id: { type: [string, "null"] }
        work_item_id: { type: [string, "null"] }
        run_id: { type: [string, "null"] }
        project_slug: { type: [string, "null"] }
        created_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        journal: { type: array, items: { $ref: "#/components/schemas/ActionEffect" } }
    ReadinessFix:
      type: object
      required: [by]
      properties:
        href: { type: [string, "null"], description: "Where it is fixed: a console path, with an `#anchor` to the field" }
        by:
          type: string
          enum: [project_owner, org_admin, platform_operator, external]
          description: "Who can do it: the project's owner, the organisation's administrator, the platform's operator, or someone outside Choregos (an identity provider, a vendor)"
    ReadinessItem:
      type: object
      required: [id, section, title, state, detail, fix]
      properties:
        id: { type: string, description: "Stable, e.g. `provisioned`, `connector-cd`, `connector-cd-secrets`, `people-release-captain`, `notifications`" }
        section: { type: string, enum: [general, connections, agents, guardrails, people, notifications, tools] }
        title: { type: string }
        state:
          type: string
          enum: [done, check, todo, not_needed]
          description: "done: nothing to do. check: works but deserves a look (a demo stand-in, a stale test, an unmeasured check). todo: the project cannot run as intended. not_needed: its workflows do not need it"
        detail: { type: string, description: "Why, in a sentence" }
        fix: { $ref: "#/components/schemas/ReadinessFix" }
    ReadinessSummary:
      type: object
      required: [done, check, todo]
      properties:
        done: { type: integer, minimum: 0 }
        check: { type: integer, minimum: 0 }
        todo: { type: integer, minimum: 0 }
    ProjectReadiness:
      type: object
      required: [ready, summary, items]
      properties:
        ready: { type: boolean, description: "No item is `todo`" }
        summary: { $ref: "#/components/schemas/ReadinessSummary" }
        items:
          type: array
          items: { $ref: "#/components/schemas/ReadinessItem" }
    ProjectRequirement:
      type: object
      required: [capability, reasons]
      description: A capability the project's workflows require, and why (ADR 0034).
      properties:
        capability: { type: string }
        reasons: { type: array, items: { type: string } }
        connector: { oneOf: [{ $ref: "#/components/schemas/Connector" }, { type: "null" }] }
        default_type: { type: [string, "null"], description: "the type the platform uses when no connector covers it" }
    WorkflowDef:
      type: object
      required: [name, version, source, yaml, checksum, is_active]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: integer }
        source: { type: string, enum: [repo, platform, template] }
        yaml: { type: string }
        json: { $ref: "./schemas/workflow.schema.json" }
        checksum: { type: string }
        is_active: { type: boolean }
        is_default: { type: boolean }
        created_by: { type: [string, "null"] }
        created_at: { type: [string, "null"], format: date-time }
    WorkflowPut:
      type: object
      required: [yaml]
      properties:
        yaml: { type: string }
        source: { type: string, enum: [repo, platform, template], default: platform }
        activate: { type: boolean, default: true }
        base_version: { type: [integer, "null"], description: "The active version the editor read: stale → 409." }
        create_only: { type: boolean, default: false, description: "Create a new workflow: a workflow of that name already exists (active or not) → 409, nothing is published." }
    WorkflowSummary:
      type: object
      required: [name, version, is_default, open_items]
      properties:
        name: { type: string }
        version: { type: integer }
        description: { type: [string, "null"] }
        is_default: { type: boolean }
        open_items: { type: integer, description: "Open tickets pinned to one of its versions." }
        created_by: { type: [string, "null"] }
        updated_at: { type: [string, "null"], format: date-time }
    WorkflowRouting:
      type: object
      required: [default, rules]
      properties:
        default: { type: string }
        rules:
          type: array
          items:
            type: object
            required: [when, workflow]
            properties:
              workflow: { type: string }
              when:
                type: object
                properties:
                  labels_any: { type: array, items: { type: string } }
                  labels_all: { type: array, items: { type: string } }
                  item_type: { type: [string, "null"] }
    WorkflowValidateRequest:
      type: object
      properties:
        yaml: { type: string }
        json: { type: object, additionalProperties: true }
    WorkflowValidation:
      type: object
      required: [valid, errors, warnings]
      properties:
        valid: { type: boolean }
        errors: { type: array, items: { $ref: "#/components/schemas/WorkflowIssue" } }
        warnings: { type: array, items: { $ref: "#/components/schemas/WorkflowIssue" } }
        graph: { $ref: "#/components/schemas/WorkflowGraph" }
        process: { type: array, items: { $ref: "#/components/schemas/ProcessStep" } }
    ProcessStep:
      type: object
      description: A transition in plain words — the process view (ADR 0031).
      required: [id, from, to, actor, actor_type, who, sentence]
      properties:
        id: { type: string }
        from: { type: string }
        from_display: { type: string }
        to: { type: string }
        to_display: { type: string }
        actor: { type: string }
        actor_type: { type: string, enum: [agent, human, system, job, release_train] }
        who: { type: string }
        outputs: { type: array, items: { type: string } }
        gates:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              summary: { type: string }
              detail: { type: [string, "null"], description: "The thresholds the guarantee applies (the platform's defaults when the workflow sets none), and how long an asynchronous one waits." }
              asynchronous: { type: boolean, description: "True for a guarantee that waits for an outside event (CI, review, scans) up to the transition's `timeout_hours`." }
        on_fail: { type: [string, "null"] }
        on_reject: { type: [string, "null"] }
        timeout_hours: { type: [integer, "null"] }
        action: { type: [string, "null"], description: The governed action the transition proposes, in plain words. }
        task: { type: [string, "null"], description: The task a person does, in plain words. }
        sentence: { type: string }
        agent: { type: [string, "null"], description: "The registry agent the actor names, `slug` or `slug@N` (ADR 0033); null for an implicit playbook actor and for any actor that is not an agent." }
        role: { type: [string, "null"], description: The role of an agent or job actor. }
        model: { type: [string, "null"], description: "The model or profile of an agent actor, as written (`profile:standard`)." }
        group: { type: [string, "null"], description: The group of a human actor. }
        sla_hours: { type: [integer, "null"], description: The SLA of a human actor. }
        command: { type: [array, "null"], items: { type: string }, description: The argv of a job actor. }
        image: { type: [string, "null"], description: The image name of a job actor. }
        inputs: { type: array, items: { type: string }, description: The documents the step reads (`inputs:` of the transition). }
        output_types: { type: object, additionalProperties: { type: string }, description: "The declared file type of an output (ADR 0049); an output not listed is inline, markdown or JSON." }
        writes_branch: { type: boolean, description: "True for an agent or job step whose transition carries a gate that reads the diff: it changes the work item's branch." }
    WorkflowOperation:
      type: object
      required: [op]
      description: >-
        A typed operation. `op` says which one; the other fields depend on it (`name`, `spec`,
        `from`, `to`, `id`, `transition`, `field`, `value`, `raw`, `unset`, `gate`, `text`,
        `index`).
      properties:
        op:
          type: string
          enum: [add_state, remove_state, rename_state, set_state, add_transition, remove_transition,
                 set_transition, add_gate, remove_gate, add_actor, remove_actor, set_actor]
      additionalProperties: true
    WorkflowEditRequest:
      type: object
      required: [yaml, operations]
      additionalProperties: false
      properties:
        yaml: { type: string }
        operations: { type: array, minItems: 1, items: { $ref: "#/components/schemas/WorkflowOperation" } }
    WorkflowEditResult:
      allOf:
        - $ref: "#/components/schemas/WorkflowValidation"
        - type: object
          required: [yaml, diff, inverse, notices]
          properties:
            yaml: { type: string }
            diff: { type: string, description: unified diff from the original text to the edited text }
            inverse: { type: array, items: { $ref: "#/components/schemas/WorkflowOperation" } }
            notices: { type: array, items: { type: string }, description: "what an operation changes beyond the text (a state with effects renamed…)" }
    AgentLimits:
      type: object
      properties:
        max_turns: { type: [integer, "null"], minimum: 1, maximum: 1000 }
        max_minutes: { type: [integer, "null"], minimum: 1, maximum: 480 }
    AgentBudget:
      type: object
      properties:
        run_usd: { type: [number, "null"], exclusiveMinimum: 0 }
        daily_usd: { type: [number, "null"], exclusiveMinimum: 0 }
        monthly_usd: { type: [number, "null"], exclusiveMinimum: 0 }
    AgentSpec:
      type: object
      description: What an agent version is; it never changes (ADR 0033).
      properties:
        instructions: { type: string, maxLength: 65536 }
        model: { type: [string, "null"] }
        backend: { type: [string, "null"], description: "the ACP coding agent that carries the version; set only with an `acp` runtime (or none)" }
        runtime:
          description: "How the version runs (ADR 0063). Absent means an `acp` runtime, the coding agent named by `backend`. `a2a` is a remote agent (ADR 0062). `prompt`, `voice` and `hosted` are ADR 0080's: instructions and tools with no code, the same spoken, and the agent's own container serving Foundry's hosted contract."
          oneOf:
            - { $ref: "#/components/schemas/AcpRuntime" }
            - { $ref: "#/components/schemas/CodeRuntime" }
            - { $ref: "#/components/schemas/A2aRuntime" }
            - { $ref: "#/components/schemas/PromptRuntime" }
            - { $ref: "#/components/schemas/VoiceRuntime" }
            - { $ref: "#/components/schemas/HostedRuntime" }
          discriminator:
            propertyName: kind
            mapping: { acp: "#/components/schemas/AcpRuntime", code: "#/components/schemas/CodeRuntime", a2a: "#/components/schemas/A2aRuntime", prompt: "#/components/schemas/PromptRuntime", voice: "#/components/schemas/VoiceRuntime", hosted: "#/components/schemas/HostedRuntime" }
        limits: { $ref: "#/components/schemas/AgentLimits" }
        budget: { $ref: "#/components/schemas/AgentBudget" }
        skills: { type: array, items: { type: object, required: [slug], properties: { slug: { type: string }, version: { type: [integer, "null"] } } } }
        mcp_servers: { type: array, items: { type: object, required: [connector], properties: { connector: { type: string }, tools: { type: array, items: { type: string } } } } }
        knowledge: { type: array, description: "the knowledge bases the agent reads (ADR 0051); each must be served to the run's project", items: { type: object, required: [slug], properties: { slug: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$" } } } }
        evals: { type: array, items: { $ref: "#/components/schemas/AgentEvalCase" }, description: "The agent's eval suite (S32-03): every case of the published version and of the new one must pass before the new one is published" }
        memory: { type: string, enum: [none, project, agent], default: project, description: "SUPERSEDED by `memories` (S40-11): read only when `memories` is absent. Whose memory a run reads and writes (S32-02): the project's shared memory, the agent's own within the project, or none" }
        memories:
          oneOf:
            - { type: array, maxItems: 8, items: { $ref: "#/components/schemas/AgentMemoryBinding" } }
            - { type: "null" }
          description: "The memories a run reads and writes (S40-11, ADR 0075), in precedence order (earlier wins). At most 8, no duplicates, at most one `write` (the target of the run's lessons, findings and proposals; a global target only ever receives proposals). Absent means: derive from `memory`. Sent together with a non-default `memory` it is a 422."
        network: { $ref: "#/components/schemas/AgentNetwork" }
    AcpRuntime:
      type: object
      description: A coding agent that speaks ACP (ADR 0002), one of the backends the runner ships.
      required: [kind]
      properties:
        kind: { type: string, enum: [acp] }
        backend: { type: [string, "null"] }
    CodeRuntime:
      type: object
      description: An agent written in code (ADR 0063) - an ACP agent in an image the operator named, built from the runner image.
      required: [kind, image, command]
      properties:
        kind: { type: string, enum: [code] }
        image: { type: string, pattern: "^[a-z][a-z0-9-]{0,62}$", description: "the NAME of an image of the operator's `CHOREGOS_AGENT_IMAGES` map, never an image reference" }
        command: { type: array, minItems: 1, maxItems: 64, items: { type: string, minLength: 1, maxLength: 1024 }, description: "the argv the runner starts in the image; it speaks ACP on stdio" }
        api_format: { type: string, enum: [openai, anthropic], default: openai, description: "the model API the code calls through the gateway" }
    A2aRuntime:
      type: object
      description: "An agent that runs elsewhere and is reached over A2A (ADR 0062), e.g. Atlassian's Rovo. The step runs in the runner pod. `model` and `backend` of the spec must be empty, and so must skills, knowledge and MCP servers."
      required: [kind, card_url]
      properties:
        kind: { type: string, enum: [a2a] }
        card_url: { type: string, pattern: "^https://", maxLength: 2048 }
        skill: { type: [string, "null"], description: "one skill of the card the step asks for" }
        credential: { type: [string, "null"], pattern: "^[a-z][a-z0-9-]{1,62}$", description: "the organisation's remote credential; absent only for a card that asks for none" }
        timeout_minutes: { type: integer, minimum: 1, maximum: 480, default: 30 }
        declared_cost: { $ref: "#/components/schemas/A2aDeclaredCost" }
        input: { type: string, enum: [text, text+files], default: text }
        pinned_card: { oneOf: [{ $ref: "#/components/schemas/A2aPinnedCard" }, { type: "null" }], description: "filled by the API at publication: the card as it was read; the runner refuses a card that changed" }
    PromptRuntime:
      type: object
      description: "A prompt agent (ADR 0080): the spec's instructions, model, MCP servers and knowledge, run as a tool loop by the platform - no coding agent, no container code. `backend` must be empty."
      required: [kind]
      properties:
        kind: { type: string, enum: [prompt] }
        max_output_tokens: { type: [integer, "null"], minimum: 1, maximum: 128000 }
        tool_choice: { type: string, enum: [auto, required, none], default: auto }
        response_format: { type: string, enum: [text, json_object], default: text, description: "`json_object` asks the model for a JSON object, read as the step's outputs" }
    VoiceRuntime:
      type: object
      description: "A voice-based prompt agent (ADR 0080): a realtime model spoken to over `GET /agents/{slug}/realtime`. `model` must be a catalogue model marked `realtime`; `backend` and `skills` must be empty. It runs only as a session, never as a workflow step."
      required: [kind]
      properties:
        kind: { type: string, enum: [voice] }
        voice: { type: string, minLength: 1, maxLength: 64, pattern: "^[A-Za-z0-9._-]+$", default: alloy }
        audio: { $ref: "#/components/schemas/VoiceAudio" }
        greeting: { type: [string, "null"], maxLength: 2000, description: "what the agent says first, before the caller speaks" }
        turn_detection: { type: string, enum: [server_vad, none], default: server_vad }
        max_session_minutes: { type: integer, minimum: 1, maximum: 120, default: 30 }
    VoiceAudio:
      type: object
      properties:
        format: { type: string, enum: [pcm16], default: pcm16 }
        sample_rate: { type: integer, enum: [16000, 24000], default: 24000 }
        channels: { type: integer, enum: [1], default: 1 }
    HostedRuntime:
      type: object
      description: "A hosted agent (ADR 0080): the agent's own container, from an image or built from a source zip, serving Foundry's hosted contract (`GET /readiness`, `POST /responses` and/or `POST /invocations`, optionally `GET /invocations_ws`) on `port`, beside the runner in the run's pod. It holds no credential: the model, the MCP servers and the internet are reached through the runner's loopback listeners. `backend` and `skills` must be empty."
      required: [kind, source]
      properties:
        kind: { type: string, enum: [hosted] }
        source:
          oneOf:
            - { $ref: "#/components/schemas/HostedImageSource" }
            - { $ref: "#/components/schemas/HostedZipSource" }
          discriminator:
            propertyName: type
            mapping: { image: "#/components/schemas/HostedImageSource", zip: "#/components/schemas/HostedZipSource" }
        protocols: { type: array, minItems: 1, maxItems: 3, uniqueItems: true, items: { type: string, enum: [responses, invocations, invocations_ws] }, default: [responses] }
        port: { type: integer, minimum: 1024, maximum: 65535, default: 8088, description: "the port the container listens on; 4001-4003 are the runner's loopback listeners and are refused" }
        readiness_timeout_s: { type: integer, minimum: 1, maximum: 900, default: 120 }
        termination_grace_s: { type: integer, minimum: 1, maximum: 300, default: 30 }
        workspace: { type: string, enum: [none, read, write], default: none, description: "`none`: the repository is not mounted; `read`: read-only; `write`: the container changes it and the runner commits and pushes" }
        env: { type: object, maxProperties: 64, additionalProperties: { type: string, maxLength: 4096 }, description: "non-secret variables; names are upper-case and the `CHOREGOS_`, `FOUNDRY_`, `OPENAI_`, `ANTHROPIC_` prefixes and the proxy variables are refused" }
        build: { oneOf: [{ $ref: "#/components/schemas/HostedBuild" }, { type: "null" }], description: "filled by the platform for a zip source, never by the caller" }
    HostedImageSource:
      type: object
      required: [type, ref]
      properties:
        type: { type: string, enum: [image] }
        ref: { type: string, minLength: 1, maxLength: 512, description: "an image reference under a prefix of the operator's `CHOREGOS_HOSTED_REGISTRIES`" }
        digest: { type: [string, "null"], pattern: "^sha256:[0-9a-f]{64}$", description: "filled by the API at publication: what `ref` resolved to; runs pull `ref@digest`" }
    HostedZipSource:
      type: object
      required: [type, sha256, runtime, entry_point]
      properties:
        type: { type: string, enum: [zip] }
        sha256: { type: string, pattern: "^sha256:[0-9a-f]{64}$", description: "the uploaded source (`POST /orgs/{org}/hosted-sources`)" }
        runtime: { type: string, enum: [python_3_12, python_3_13, python_3_14, node_22, dotnet_10] }
        entry_point: { type: array, minItems: 1, maxItems: 64, items: { type: string, minLength: 1, maxLength: 1024 }, description: "the argv started in the built image, e.g. [python, main.py]" }
        dependency_resolution: { type: string, enum: [remote_build, bundled], default: remote_build, description: "`remote_build` installs the declared dependencies at build time; `bundled`: the zip carries them" }
    HostedSource:
      type: object
      description: "An uploaded source zip (ADR 0080 §9)."
      required: [sha256, size_bytes, files]
      properties:
        sha256: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        size_bytes: { type: integer, minimum: 1 }
        files: { type: array, maxItems: 2000, items: { type: string } }
        dependencies: { type: [string, "null"], pattern: "^(requirements\\.txt|pyproject\\.toml|package-lock\\.json|[^/]+\\.csproj)$", description: "the file at the root that declares the dependencies `remote_build` installs: `requirements.txt` or `pyproject.toml` (Python), `package-lock.json` beside its `package.json` (Node), the one `*.csproj` (.NET); null when there is none" }
    HostedBuild:
      type: object
      description: "The build of a zip source (ADR 0080), at publication, keyed by its inputs: the same inputs never build twice."
      required: [status, key]
      properties:
        status: { type: string, enum: [pending, building, ready, failed] }
        key: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        image: { type: [string, "null"], description: "the built image, `ref@sha256:...`, once ready" }
        error: { type: [string, "null"] }
        provenance: { type: object, additionalProperties: { type: string } }
    AgentResponseCreate:
      type: object
      description: "One turn of a direct conversation (ADR 0080 §10). The agent's spec decides the model, the instructions and the tools."
      required: [project, input]
      additionalProperties: false
      properties:
        project: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$", description: "the project the session works in: its budget pays, its grants bound the tools" }
        input:
          oneOf:
            - { type: string, minLength: 1 }
            - { type: array, minItems: 1, items: { $ref: "#/components/schemas/AgentInputMessage" } }
        session_id: { type: [string, "null"] }
        stream: { type: boolean, default: false }
        max_usd: { type: [number, "null"], exclusiveMinimum: 0, maximum: 100, description: "the caller's cap on the whole session, when it opens; the project's budgets still bind" }
    AgentInputMessage:
      type: object
      required: [content]
      additionalProperties: false
      properties:
        role: { type: string, enum: [user], default: user }
        content: { type: string, minLength: 1, maxLength: 65536 }
    AgentOutputText:
      type: object
      required: [text]
      properties:
        type: { type: string, enum: [output_text], default: output_text }
        text: { type: string }
    AgentOutputMessage:
      type: object
      required: [content]
      properties:
        type: { type: string, enum: [message], default: message }
        role: { type: string, enum: [assistant], default: assistant }
        content: { type: array, items: { $ref: "#/components/schemas/AgentOutputText" } }
    AgentResponseError:
      type: object
      required: [code, message]
      properties:
        code: { type: string, description: "`budget_exceeded`, `model_error`, `max_turns`" }
        message: { type: string }
    AgentResponseUsage:
      type: object
      properties:
        input_tokens: { type: integer, default: 0 }
        output_tokens: { type: integer, default: 0 }
        turns: { type: integer, default: 0 }
        tool_calls: { type: integer, default: 0 }
    AgentResponse:
      type: object
      description: "The part of the Responses API's shape a client reads."
      required: [id, session_id, status]
      properties:
        id: { type: string }
        object: { type: string, enum: [response], default: response }
        session_id: { type: string }
        status: { type: string, enum: [completed, failed] }
        output: { type: array, items: { $ref: "#/components/schemas/AgentOutputMessage" } }
        output_text: { type: string, default: "" }
        usage: { $ref: "#/components/schemas/AgentResponseUsage" }
        error: { oneOf: [{ $ref: "#/components/schemas/AgentResponseError" }, { type: "null" }] }
    AgentDelta:
      type: object
      description: "A `response.output_text.delta` event."
      required: [response_id, delta]
      properties:
        type: { type: string, enum: [response.output_text.delta], default: response.output_text.delta }
        response_id: { type: string }
        delta: { type: string }
    AgentSessionEvent:
      type: object
      required: [seq, type, ts]
      properties:
        seq: { type: integer }
        type: { type: string }
        ts: { type: string, format: date-time }
        payload: { type: object, additionalProperties: true }
    AgentSession:
      type: object
      description: "A direct conversation with an agent (ADR 0080 §10), next to runs: its key, its spend and its transcript."
      required: [id, agent, agent_version, project, status, model, responses, tool_calls, cost_usd, created_at, expires_at]
      properties:
        id: { type: string }
        agent: { type: string }
        agent_version: { type: integer }
        project: { type: string }
        status: { type: string, enum: [open, closed, failed] }
        reason: { type: [string, "null"] }
        model: { type: string }
        responses: { type: integer }
        tool_calls: { type: integer }
        cost_usd: { type: number }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        closed_at: { type: [string, "null"], format: date-time }
        events: { type: array, items: { $ref: "#/components/schemas/AgentSessionEvent" } }
    AgentSessionTurn:
      type: object
      description: "A response a hosted session's person asked for, waiting for the session's pod (S41-11)."
      required: [turn_id, input, protocol]
      properties:
        turn_id: { type: string }
        input: { type: string }
        protocol: { type: string, enum: [responses, invocations] }
    AgentSessionPodEvent:
      type: object
      required: [type]
      properties:
        type: { type: string, minLength: 1, maxLength: 64 }
        payload: { type: object, additionalProperties: true }
    AgentSessionTurnResult:
      type: object
      description: "How the session's container answered a turn."
      required: [status]
      properties:
        status: { type: string, enum: [answered, failed, not_ready, timeout, max_turns, budget_exceeded] }
        text: { type: string, maxLength: 200000, default: "" }
        error: { type: [string, "null"], maxLength: 4000 }
        response_id: { type: [string, "null"], maxLength: 200 }
        turns: { type: integer, minimum: 0, default: 0 }
        tool_calls: { type: integer, minimum: 0, default: 0 }
        events: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/AgentSessionPodEvent" } }
    AgentSessionSocketFrame:
      type: object
      description: "What a hosted session's caller did on its socket (S41-21): `open`, a text frame `in`, `close`."
      required: [seq, kind]
      properties:
        seq: { type: integer, minimum: 1 }
        kind: { type: string, enum: [open, in, close] }
        text: { type: string, maxLength: 1048576, default: "" }
        code: { type: [integer, "null"] }
    AgentSessionSocketNext:
      type: object
      required: [cursor, out_n]
      properties:
        frames: { type: array, items: { $ref: "#/components/schemas/AgentSessionSocketFrame" } }
        cursor: { type: integer, minimum: 0, description: "The journal's `seq` the pod reads after next time." }
        out_n: { type: integer, minimum: 0, description: "The last of the container's frames journaled." }
    AgentSessionSocketOutFrame:
      type: object
      required: [n, text]
      properties:
        n: { type: integer, minimum: 1 }
        text: { type: string, maxLength: 1048576 }
    AgentSessionSocketClosed:
      type: object
      required: [code]
      properties:
        code: { type: integer, minimum: 1000, maximum: 4999 }
        reason: { type: string, maxLength: 123, default: "" }
    AgentSessionSocketOut:
      type: object
      description: "What the container sent on its `/invocations_ws`, and whether it closed it."
      properties:
        frames: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/AgentSessionSocketOutFrame" } }
        closed: { oneOf: [{ $ref: "#/components/schemas/AgentSessionSocketClosed" }, { type: "null" }] }
        events: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/AgentSessionPodEvent" } }
    AgentSessionSocketRecorded:
      type: object
      required: [out_n]
      properties:
        out_n: { type: integer, minimum: 0 }
    AgentSessionTools:
      type: object
      properties:
        tools: { type: array, items: { type: object, additionalProperties: true } }
    AgentSessionToolCall:
      type: object
      properties:
        arguments: { type: object, additionalProperties: true }
    AgentSessionToolAnswer:
      type: object
      required: [text]
      properties:
        text: { type: string }
    A2aDeclaredCost:
      type: object
      description: What a remote agent costs, as the organisation declares it - A2A reports no figure; booked in the ledger as `external`.
      properties:
        per_task_usd: { type: [number, "null"], minimum: 0 }
        per_minute_usd: { type: [number, "null"], minimum: 0 }
    A2aPinnedCard:
      type: object
      required: [url, protocol_version, digest]
      properties:
        url: { type: string }
        protocol_version: { type: string }
        digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        skills: { type: array, items: { type: string } }
    RemoteCredential:
      type: object
      description: What the organisation holds to call remote agents. No secret is ever returned - the refresh token lives sealed in the secret store.
      required: [name, type, status]
      properties:
        name: { type: string }
        type: { type: string, enum: [oauth2_authorization_code, bearer, none] }
        status: { type: string, enum: [pending, connected, error, revoked] }
        authorised_as: { type: [string, "null"], description: "whose permissions a remote agent acts with: the person who authorised it" }
        scopes: { type: array, items: { type: string } }
        card_url: { type: [string, "null"] }
        host: { type: [string, "null"] }
        created_by: { type: [string, "null"] }
        created_at: { type: [string, "null"], format: date-time }
        last_refresh_at: { type: [string, "null"], format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        last_error: { type: [string, "null"] }
    RemoteCredentialCreate:
      type: object
      required: [name, type]
      properties:
        name: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$" }
        type: { type: string, enum: [oauth2_authorization_code, bearer, none] }
        card_url: { type: [string, "null"], pattern: "^https://", description: "OAuth: the card whose Dynamic Client Registration endpoint the platform registers itself at" }
        token: { type: [string, "null"], writeOnly: true, description: "bearer: the token, write-only, sealed in the secret store" }
    RemoteCredentialAuthorization:
      type: object
      required: [redirect_url]
      properties:
        redirect_url: { type: string, description: "where to send the administrator's browser (authorization code + PKCE)" }
    RemoteAgentDiscover:
      type: object
      required: [card_url]
      properties:
        card_url: { type: string, pattern: "^https://" }
    RemoteSkillInfo:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
    RemoteCardSummary:
      type: object
      required: [name, endpoint, host, protocol_version, digest]
      properties:
        name: { type: string }
        description: { type: string }
        endpoint: { type: string }
        host: { type: string }
        protocol_version: { type: string }
        digest: { type: string }
        skills: { type: array, items: { $ref: "#/components/schemas/RemoteSkillInfo" } }
        auth_types: { type: array, items: { type: string }, description: "oauth2_authorization_code, bearer, none: what the card accepts" }
        scopes: { type: array, items: { type: string } }
        streaming: { type: boolean }
        dcr_available: { type: boolean, description: "the card advertises Dynamic Client Registration" }
    RemoteAgentDiscovery:
      type: object
      description: What a card says and the registry entry it suggests - nothing is created.
      required: [card, proposed]
      properties:
        card: { $ref: "#/components/schemas/RemoteCardSummary" }
        proposed: { $ref: "#/components/schemas/AgentCreate" }
        credentials: { type: array, items: { type: string }, description: "the organisation's credentials of a type the card accepts" }
        domains: { type: array, items: { type: string }, description: "hosts the project policy must allow (sandbox.network.allow_domains)" }
    AgentImageInfo:
      type: object
      description: An image an operator named for code agents. The reference itself is never returned.
      required: [name, digest_pinned]
      properties:
        name: { type: string }
        digest_pinned: { type: boolean, description: "the reference carries an `@sha256:` digest" }
    AgentMemoryBinding:
      type: object
      required: [scope, slug]
      properties:
        scope: { type: string, enum: [global, project], description: "`global`: the organisation's memory; `project`: a memory of whichever project the run is in (`shared`, `own`, or a named one)" }
        slug: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$" }
        mode: { type: string, enum: [read, write], default: read }
    RunMemorySearch:
      type: object
      required: [query]
      additionalProperties: false
      properties:
        query: { type: string, minLength: 1, maxLength: 2000 }
        k: { type: integer, minimum: 1, maximum: 20, default: 5 }
        memory: { type: [string, "null"], description: "one memory of the run, by label (`global:security-lessons`); absent, all of them" }
    RunMemoryHit:
      type: object
      required: [memory, kind, subject, content]
      properties:
        memory: { type: string, description: the label of the memory the hit came from }
        kind: { type: string }
        subject: { type: string }
        content: { type: string }
        score: { type: [number, "null"] }
    MemoryStoreUser:
      type: object
      required: [agent, version]
      properties:
        agent: { type: string }
        version: { type: integer }
    MemoryStore:
      type: object
      required: [slug, display_name, scope]
      properties:
        slug: { type: string }
        display_name: { type: string }
        description: { type: [string, "null"] }
        scope: { type: string, enum: [global, project] }
        project: { type: [string, "null"], description: "the project's slug, for a project memory" }
        reach: { type: [string, "null"], enum: [org, projects, null], description: "for a global memory: whose runs read it" }
        projects: { type: array, items: { type: string } }
        status: { type: string, enum: [active, archived], default: active }
        implicit: { type: boolean, default: false, description: "`shared` and `own`: every project has them, they are not rows" }
        created_by: { type: [string, "null"] }
        created_at: { type: [string, "null"], format: date-time }
        used_by: { type: array, items: { $ref: "#/components/schemas/MemoryStoreUser" }, description: "visible agents whose latest version binds it" }
    MemoryStoreCreate:
      type: object
      required: [slug, display_name]
      properties:
        slug: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$" }
        display_name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 2000 }
        reach: { type: string, enum: [org, projects], default: org }
        projects: { type: array, items: { type: string }, description: "required, non-empty, when `reach` is `projects`" }
    ProjectMemoryCreate:
      type: object
      required: [slug, display_name]
      properties:
        slug: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$" }
        display_name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 2000 }
    MemoryStorePatch:
      type: object
      properties:
        display_name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 2000 }
        reach: { type: string, enum: [org, projects] }
        projects: { type: array, items: { type: string } }
        status: { type: string, enum: [active, archived] }
    AgentNetwork:
      type: object
      description: >-
        What one agent version may reach (ADR 0070). It can only narrow the project's and the organisation's network:
        a host they do not allow refuses the publication (422) and the run.
      properties:
        domains: { type: [array, "null"], items: { type: string }, description: "null: the project's list; []: no internet; a list: only these hosts (`example.com` = it and its subdomains, `*.example.com` = subdomains only)" }
        per_host_per_minute: { type: [integer, "null"], minimum: 1, description: "new connections a run may open to one host per minute" }
        builtin_web_tools: { type: [boolean, "null"], description: "false switches the agent CLI's own WebFetch and WebSearch off; null or true: as the policy says" }
    RunNetwork:
      type: object
      required: [run_id, allow, deny, implied, builtin_web_tools, listed, org, project]
      properties:
        run_id: { type: string }
        allow: { type: array, items: { type: string } }
        deny: { type: array, items: { type: string } }
        implied: { type: array, items: { type: string }, description: "hosts the run needs to work at all (the project's repository host)" }
        per_host_per_minute: { type: [integer, "null"] }
        per_run_per_minute: { type: [integer, "null"] }
        org_per_host_per_minute: { type: [integer, "null"], description: "the organisation's cap, counted across all its runs" }
        builtin_web_tools: { type: boolean }
        listed: { type: boolean, description: "always true today: an empty allow list means no internet" }
        org: { type: string }
        project: { type: string }
        agent: { type: [string, "null"] }
    NetworkDecisionIn:
      type: object
      required: [layer, host, decision]
      properties:
        layer: { type: string, enum: [proxy, runner] }
        host: { type: string, maxLength: 253 }
        port: { type: integer, minimum: 0, maximum: 65535, default: 0 }
        decision: { type: string, enum: [allowed, denied, rate_limited, unreachable] }
        reason: { type: string, maxLength: 200, default: "" }
        count: { type: integer, minimum: 1, default: 1 }
        bytes_up: { type: integer, minimum: 0, default: 0 }
        bytes_down: { type: integer, minimum: 0, default: 0 }
        first_at: { type: [string, "null"], format: date-time }
        last_at: { type: [string, "null"], format: date-time }
    NetworkDecisionBatch:
      type: object
      required: [decisions]
      properties:
        decisions: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/NetworkDecisionIn" } }
    EffectiveNetwork:
      type: object
      required: [allow, deny, implied, builtin_web_tools]
      properties:
        allow: { type: array, items: { type: string } }
        deny: { type: array, items: { type: string } }
        implied: { type: array, items: { type: string } }
        per_host_per_minute: { type: [integer, "null"] }
        per_run_per_minute: { type: [integer, "null"] }
        org_per_host_per_minute: { type: [integer, "null"] }
        builtin_web_tools: { type: boolean }
    ProjectNetwork:
      type: object
      required: [policy, effective, clamps]
      properties:
        policy: { type: object, additionalProperties: true, description: "the project's `sandbox.network`, as stored" }
        ceiling: { type: [object, "null"], additionalProperties: true, description: "the organisation's `network` ceiling, null when it sets none" }
        effective: { $ref: "#/components/schemas/EffectiveNetwork" }
        clamps: { type: array, items: { type: string } }
    NetworkActivityRow:
      type: object
      required: [host, layer, decision, reason, count, runs, projects, agents, last_at]
      properties:
        host: { type: string }
        layer: { type: string, description: "proxy, runner, broker or platform" }
        decision: { type: string }
        reason: { type: string }
        count: { type: integer }
        runs: { type: integer }
        projects: { type: array, items: { type: string } }
        agents: { type: array, items: { type: string } }
        last_at: { type: string, format: date-time }
    NetworkActivity:
      type: object
      required: [rows]
      properties:
        rows: { type: array, items: { $ref: "#/components/schemas/NetworkActivityRow" } }
    AgentEvalCase:
      type: object
      description: A deterministic case (ADR 0020, level 1) — the instructions rendered on its sample input contain what they must, and nothing they must not.
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        input: { $ref: "#/components/schemas/AgentSampleInput" }
        must_contain: { type: array, items: { type: string } }
        must_not_contain: { type: array, items: { type: string } }
        live: { type: boolean, default: false, description: "a live case runs as a capped trial on the real model and asserts on the run's result (S40-02d); the level-1 gate leaves it out" }
        expect_status: { type: string, enum: [done, blocked], default: done, description: the status the run's result must have }
        max_cost_usd: { type: [number, "null"], exclusiveMinimum: 0, maximum: 0.5, description: "what this case's trial may spend; absent, 0.25 $" }
    AgentSampleInput:
      type: object
      description: A sample work item an agent is tried or evaluated on.
      properties:
        title: { type: string, maxLength: 500 }
        body: { type: string, maxLength: 20000 }
    AgentEvalResult:
      type: object
      required: [name, passed]
      properties:
        name: { type: string }
        passed: { type: boolean }
        missing: { type: array, items: { type: string } }
        forbidden: { type: array, items: { type: string } }
        error: { type: [string, "null"], description: "the instructions do not render on this input" }
    AgentTrialCreate:
      type: object
      description: Try a draft version on a sample input, in one project, under a capped budget (S32-03).
      required: [project, spec, input]
      properties:
        project: { type: string, description: "the project's slug: its model profiles, backend and tools apply" }
        spec: { $ref: "#/components/schemas/AgentSpec" }
        input: { $ref: "#/components/schemas/AgentSampleInput" }
        budget_usd: { type: [number, "null"], exclusiveMinimum: 0, description: "capped at 0.50 $, at the version's budget per run and at the project's budget per work item" }
        agent: { type: [string, "null"], description: "the agent the draft would become a version of: its published suite is run too" }
    AgentTrial:
      type: object
      required: [run_id, work_item_id, project, budget_usd, status]
      properties:
        run_id: { type: string, description: "read it at `GET /runs/{id}`" }
        work_item_id: { type: string }
        project: { type: string }
        budget_usd: { type: number }
        status: { type: string }
        evals: { type: array, items: { $ref: "#/components/schemas/AgentEvalResult" } }
    AgentTags:
      type: array
      maxItems: 10
      uniqueItems: true
      items: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,31}$" }
      description: Labels people find the agent by (S40-10); never part of a version
    AgentCreate:
      type: object
      required: [slug, display_name]
      properties:
        slug: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$", description: "`new` is reserved: the console's `/agents/new` page would shadow it (422)" }
        kind: { type: string, enum: [internal, external, remote], default: internal, description: "`remote`: an agent the platform calls over A2A (ADR 0062); it needs an `a2a` runtime" }
        display_name: { type: string }
        description: { type: [string, "null"] }
        spec: { $ref: "#/components/schemas/AgentSpec" }
        lifecycle: { type: string, enum: [draft, active], default: active, description: a draft is neither pinned nor run until it is activated }
        scope: { type: string, enum: [org, project, personal], default: org, description: "who owns the agent (ADR 0061); `platform` is never asked for, a common agent comes from the catalogue" }
        project: { type: [string, "null"], description: "the project's slug: required for, and only for, a `project` agent" }
        tags: { $ref: "#/components/schemas/AgentTags" }
        message: { type: [string, "null"], maxLength: 500, description: "why version 1 exists; absent, `Created` (S40-12)" }
        release_policy: { oneOf: [{ $ref: "#/components/schemas/AgentReleasePolicy" }, { type: "null" }], description: "what saving a revision does (ADR 0071); absent, the defaults: it goes to production" }
    AgentFork:
      type: object
      required: [slug, scope]
      properties:
        slug: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$", description: "slugs are unique per organisation: a fork takes a new one" }
        display_name: { type: [string, "null"] }
        scope: { type: string, enum: [org, project, personal] }
        project: { type: [string, "null"], description: "required for, and only for, a `project` fork" }
        version: { type: [integer, "null"], minimum: 1, description: "the source version to copy; absent, its latest" }
        message: { type: [string, "null"], maxLength: 500, description: "why version 1 exists; absent, `Forked from <slug>@<version>` (S40-12)" }
    AgentScopeChange:
      type: object
      required: [scope]
      properties:
        scope: { type: string, enum: [org, project, personal] }
        project: { type: [string, "null"], description: "required for, and only for, a move to a `project`" }
    AgentUpstream:
      type: object
      description: What a fork was copied from, and whether the source moved on since (ADR 0061).
      required: [slug, version]
      properties:
        slug: { type: string }
        version: { type: integer, description: the version the fork copied }
        scope: { type: [string, "null"], enum: [platform, org, project, personal, null], description: absent when the source is no longer visible to the caller }
        latest_version: { type: [integer, "null"] }
        behind: { type: boolean, description: the source published a version newer than the one copied }
        available: { type: boolean, description: false when the source is deleted or not visible to the caller }
    AgentPermissions:
      type: object
      description: What the caller may do with an agent, decided by the server (ADR 0061).
      properties:
        publish: { type: boolean, description: "publish a version, edit it, move it through its life" }
        manage: { type: boolean, description: "suspend, revoke, change its owner, attach clients" }
        pin: { type: boolean, description: pin it on a project the caller owns }
        release: { type: boolean, description: "send a revision to testing or production, roll back (ADR 0071)" }
        fork_scopes: { type: array, items: { type: string, enum: [org, project, personal] } }
    AgentDraftRequest:
      type: object
      required: [display_name, description]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, minLength: 10, maxLength: 4000, description: what the agent is for; data for the drafting model, never instructions }
    AgentDraft:
      type: object
      description: A proposal that is never saved; the builder is pre-filled with it and a person creates the agent.
      required: [display_name, slug, description, spec, sample, model]
      properties:
        display_name: { type: string }
        slug: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$" }
        description: { type: string }
        spec: { $ref: "#/components/schemas/AgentSpec" }
        sample: { $ref: "#/components/schemas/AgentSampleInput" }
        notes: { type: array, items: { type: string }, description: what the platform changed or dropped in the model's answer }
        model: { type: string, description: the model that drafted it }
    AgentCatalogueEntry:
      type: object
      description: An agent the platform's catalogue offers (ADR 0040), and its state in the organisation.
      required: [slug, kind, display_name, role, summary, version, installed]
      properties:
        slug: { type: string }
        kind: { type: string, enum: [internal, external, remote] }
        display_name: { type: string }
        description: { type: [string, "null"] }
        role: { type: string, description: "the package role it plays (`implement`, `review`…), or `external` for a client" }
        summary: { type: string }
        version: { type: integer, description: the catalogue's version of the entry }
        skills: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string }, description: "labels the entry carries (S40-10): installed with the agent, added on upgrade, never removed" }
        client: { type: [string, "null"], description: "an external client's id on the AI clients page" }
        reach: { type: [string, "null"], enum: [always, cloud, null], description: "`cloud`: it calls from its vendor's cloud" }
        installed: { type: boolean }
        installed_version: { type: [integer, "null"] }
        own_agent: { type: boolean, description: "an agent of the organisation has this name and does not come from the catalogue" }
        scope: { type: [string, "null"], enum: [platform, org, project, personal, null], description: "the scope of the agent of this name in the organisation, if any (ADR 0061)" }
        update_available: { type: boolean }
        offered: { type: boolean, description: "false for a client the door does not accept yet (OAuth, registered client, https)" }
        unavailable_reason: { type: [string, "null"] }
    AgentCatalogueConnect:
      type: object
      properties:
        read_only: { type: boolean, default: false, description: "a `mcp:read` token instead of `mcp:write`" }
        expires_in_days: { type: [integer, "null"], default: 30, minimum: 1, maximum: 365 }
    AgentCatalogueConnection:
      type: object
      required: [agent]
      properties:
        agent: { $ref: "#/components/schemas/Agent" }
        token: { oneOf: [{ $ref: "#/components/schemas/ApiTokenCreated" }, { type: "null" }], description: "returned once; none for a client that signs in with OAuth" }
        oauth_client_id: { type: [string, "null"] }
    AgentCatalogueInstall:
      type: object
      properties:
        upgrade: { type: boolean, default: false, description: "already installed: publish the catalogue's version as the next one" }
    AgentPatch:
      type: object
      properties:
        display_name: { type: [string, "null"] }
        description: { type: [string, "null"] }
        status: { type: [string, "null"], enum: [active, suspended, revoked, null] }
        expires_at: { type: [string, "null"], format: date-time }
        tags: { oneOf: [{ $ref: "#/components/schemas/AgentTags" }, { type: "null" }], description: "replaces the agent's tags; absent or null leaves them as they are (S40-10)" }
    AgentVersion:
      type: object
      required: [version, spec, checksum]
      properties:
        version: { type: integer }
        spec: { $ref: "#/components/schemas/AgentSpec" }
        checksum: { type: string }
        created_by: { type: [string, "null"] }
        created_at: { type: [string, "null"], format: date-time }
        message: { type: [string, "null"], description: "why the version exists, in its author's words (S40-12); null for a version published before messages or through the bare-spec endpoint" }
        restored_from: { type: [integer, "null"], description: "the version this one copies, when it is a restore" }
        pinned_by: { type: array, items: { type: string }, description: "the slugs of the projects the caller may see that pin this version" }
        effective_memories: { type: array, items: { $ref: "#/components/schemas/AgentMemoryBinding" }, description: "what a run of this version binds: `spec.memories`, or what the legacy `spec.memory` means (S40-11)" }
        channels: { type: array, items: { type: string, enum: [stable, candidate] }, description: "the channels this revision sits on now (ADR 0071)" }
    AgentVersionPublish:
      type: object
      required: [spec, message, base_version]
      properties:
        spec: { $ref: "#/components/schemas/AgentSpec" }
        message: { type: string, minLength: 1, maxLength: 500, description: what changed and why }
        base_version: { type: integer, minimum: 0, description: "the latest version the author started from (0 for an agent with none)" }
    AgentVersionRestore:
      type: object
      required: [base_version]
      properties:
        message: { type: [string, "null"], maxLength: 500, description: "absent, `Restore vN`" }
        base_version: { type: integer, minimum: 1, description: the latest version the author saw }
    Agent:
      type: object
      required: [slug, kind, display_name, status, latest_version]
      properties:
        slug: { type: string }
        kind: { type: string, enum: [internal, external, remote] }
        display_name: { type: string }
        description: { type: [string, "null"] }
        tags: { $ref: "#/components/schemas/AgentTags" }
        status: { type: string }
        owner: { type: [string, "null"] }
        expires_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        latest_version: { type: integer }
        created_at: { type: [string, "null"], format: date-time }
        versions: { type: [array, "null"], items: { $ref: "#/components/schemas/AgentVersion" } }
        lifecycle: { type: string, enum: [draft, active, deprecated, retired], default: active, description: "where the agent is in its life (S32-04); apart from the operational status" }
        retired_at: { type: [string, "null"], format: date-time }
        last_run_at: { type: [string, "null"], format: date-time }
        unused: { type: boolean, description: no run for 60 days (since its creation if it never ran) }
        scope: { type: string, enum: [platform, org, project, personal], default: org, description: "who owns it (ADR 0061)" }
        project: { type: [string, "null"], description: "the slug of its project, for a `project` agent" }
        forked_from: { oneOf: [{ $ref: "#/components/schemas/AgentUpstream" }, { type: "null" }], description: set on a fork }
        can: { $ref: "#/components/schemas/AgentPermissions" }
        cannot_reason: { type: [string, "null"], description: "the server's sentence for what the caller may not do: shown as is, never guessed from roles" }
        stable_version: { type: [integer, "null"], description: "the revision in production (ADR 0071)" }
        candidate_version: { type: [integer, "null"], description: "the revision in testing" }
        candidate_percent: { type: integer, minimum: 0, maximum: 100, default: 0, description: "the share of work items, of projects that follow production, served the candidate" }
        candidate_since: { type: [string, "null"], format: date-time }
        release_policy: { $ref: "#/components/schemas/AgentReleasePolicy" }
        pending_release: { oneOf: [{ $ref: "#/components/schemas/AgentRelease" }, { type: "null" }], description: the release waiting for approval, if any }
    AgentReleaseDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject, cancel] }
        reason: { type: [string, "null"], maxLength: 500, description: required for a rejection }
    AgentStableGates:
      type: object
      description: What a revision must satisfy before it reaches production; a rollback skips them.
      properties:
        require_candidate: { type: boolean, default: false, description: the revision must be the current candidate }
        min_candidate_runs: { type: integer, minimum: 0, maximum: 10000, default: 0, description: finished runs of the candidate since it became the candidate }
        min_success_rate: { type: [number, "null"], minimum: 0, maximum: 1 }
        min_soak_hours: { type: [integer, "null"], minimum: 0, maximum: 720 }
        step_up_minutes: { type: integer, minimum: 1, maximum: 120, default: 10, description: how recent the person's sign-in must be }
        min_live_score: { type: [number, "null"], minimum: 0, maximum: 1, description: "the latest finished live evaluation of the revision must score at least this; a rollback skips it" }
        approvals: { type: integer, minimum: 0, maximum: 3, default: 0, description: "people other than the requester who must approve a promotion before production moves; a rollback never waits (ADR 0071)" }
        separation_of_duties: { type: boolean, default: true, description: "neither the requester nor the revision's author may approve" }
    AgentCandidateGates:
      type: object
      description: What a revision must satisfy before it is sent to testing by hand (saving it to testing under `on_publish` is the owner's stated policy and is not gated).
      properties:
        min_live_score: { type: [number, "null"], minimum: 0, maximum: 1 }
    AgentEvaluationCreate:
      type: object
      required: [project]
      properties:
        project: { type: string, description: "the project's slug: the trials run there (needs the right to try an agent in it)" }
    AgentEvaluation:
      type: object
      description: A live evaluation of one revision, judged from its trial runs as they stand. `not_run` (no model to call) is never `passed`.
      required: [id, version, project, status, budget_usd, started_at]
      properties:
        id: { type: string }
        version: { type: integer }
        project: { type: string }
        status: { type: string, enum: [running, passed, failed, not_run], description: "`passed` when every case finished and the score reaches the policy's minimum (every case when none is set)" }
        score: { type: [number, "null"], description: passed cases over live cases }
        budget_usd: { type: number, description: the most the evaluation may spend in all }
        started_by: { type: [string, "null"] }
        started_at: { type: string, format: date-time }
        cases:
          type: array
          items:
            type: object
            required: [name, run_id, status]
            properties:
              name: { type: string }
              run_id: { type: string, description: "read it at `GET /runs/{id}`" }
              status: { type: string, enum: [running, passed, failed, not_run] }
              passed: { type: [boolean, "null"] }
              budget_usd: { type: number }
              cost_usd: { type: number }
              reason: { type: [string, "null"], description: why it failed or did not run }
    AgentReleasePolicy:
      type: object
      description: "What saving a revision does, and the gates of production (ADR 0071). `on_publish: stable` cannot be combined with `require_candidate` or a candidate threshold (422): a revision published straight to production is never a candidate."
      properties:
        on_publish: { type: string, enum: [stable, candidate, none], default: stable, description: "`stable`: a saved revision goes to production (the behaviour before channels); `candidate`: to testing; `none`: nowhere" }
        stable: { $ref: "#/components/schemas/AgentStableGates" }
        candidate: { $ref: "#/components/schemas/AgentCandidateGates" }
        max_eval_usd: { type: number, exclusiveMinimum: 0, maximum: 10, default: 2.0, description: the most one live evaluation may spend in all, in dollars }
    AgentReleaseCreate:
      type: object
      required: [channel]
      properties:
        channel: { type: string, enum: [candidate, stable] }
        version: { type: [integer, "null"], minimum: 1, description: "`null` with `candidate` withdraws the candidate; `null` with `stable` releases the current candidate" }
        percent: { type: [integer, "null"], minimum: 0, maximum: 100, description: "candidate only: the share of work items served the candidate; absent keeps the current share (0 for a new candidate)" }
        reason: { type: [string, "null"], maxLength: 500 }
    AgentReleaseCheck:
      type: object
      required: [name]
      properties:
        name: { type: string, description: "eval_suite, newer_than_production, is_candidate, candidate_runs, candidate_success_rate, soak, previously_in_production, human_session, fresh_authentication, live_eval, approvals (informational: how many people must approve)" }
        required: { type: boolean, default: true }
        passed: { type: [boolean, "null"], description: "null: not applicable" }
        detail: { type: [string, "null"] }
    AgentRelease:
      type: object
      required: [id, agent, channel, kind, status, requested_at]
      properties:
        id: { type: string }
        agent: { type: string }
        channel: { type: string, enum: [candidate, stable] }
        kind: { type: string, enum: [publish, promote, rollback, withdraw, baseline] }
        version: { type: [integer, "null"] }
        previous_version: { type: [integer, "null"] }
        percent: { type: [integer, "null"] }
        status: { type: string, enum: [done, pending_approval, rejected, cancelled, superseded], description: "`pending_approval`: waits for `approvals_required` people; `superseded`: production moved meanwhile" }
        approvals_required: { type: integer, description: "how many other people must approve before production moves; 0 for a release that did not wait" }
        decisions:
          type: array
          items:
            type: object
            required: [by, decision, at]
            properties:
              by: { type: string }
              decision: { type: string, enum: [approve, reject, cancel] }
              reason: { type: [string, "null"] }
              at: { type: string, format: date-time }
              auth_age_seconds: { type: [integer, "null"], description: how old the person's sign-in was when they decided }
        requested_by: { type: [string, "null"] }
        requested_at: { type: string, format: date-time }
        done_at: { type: [string, "null"], format: date-time }
        reason: { type: [string, "null"] }
        checks: { type: array, items: { $ref: "#/components/schemas/AgentReleaseCheck" }, description: the checks as they were evaluated (a snapshot) }
    AgentChannelStats:
      type: object
      required: [version]
      properties:
        version: { type: integer }
        runs: { type: integer, description: finished runs }
        succeeded: { type: integer }
        failed: { type: integer }
        success_rate: { type: [number, "null"] }
        since: { type: [string, "null"], format: date-time }
    AgentReleaseReadiness:
      type: object
      required: [version, channel, kind, ready]
      properties:
        version: { type: integer }
        channel: { type: string, enum: [candidate, stable] }
        kind: { type: string, enum: [publish, promote, rollback, withdraw, baseline] }
        ready: { type: boolean, description: every required check passes }
        checks: { type: array, items: { $ref: "#/components/schemas/AgentReleaseCheck" } }
        candidate: { oneOf: [{ $ref: "#/components/schemas/AgentChannelStats" }, { type: "null" }] }
        production: { oneOf: [{ $ref: "#/components/schemas/AgentChannelStats" }, { type: "null" }] }
    AgentExposure:
      type: object
      properties:
        stable_version: { type: [integer, "null"] }
        candidate_version: { type: [integer, "null"] }
        candidate_percent: { type: integer }
        projects:
          type: array
          items:
            type: object
            required: [project, source, version]
            properties:
              project: { type: string }
              source: { type: string, enum: [pin, pin_channel, project_channel] }
              channel: { type: [string, "null"], enum: [stable, candidate, null] }
              version: { type: integer }
    ProjectAgentChannel:
      type: object
      required: [channel]
      properties:
        channel: { type: string, enum: [stable, candidate], description: "which channel of the agents the project runs when it pins nothing" }
    AgentLifecycleChange:
      type: object
      required: [to]
      properties:
        to: { type: string, enum: [active, deprecated, retired] }
        force: { type: boolean, default: false, description: retire although runs of the agent are in flight }
        reason: { type: [string, "null"], maxLength: 500 }
    AgentLifecycleResult:
      type: object
      required: [agent]
      properties:
        agent: { $ref: "#/components/schemas/Agent" }
        revoked_credentials: { type: integer }
        unpinned_projects: { type: array, items: { type: string } }
        running_work_items: { type: array, items: { type: string } }
        forced: { type: boolean }
    AgentOwnerChange:
      type: object
      required: [email]
      properties:
        email: { type: string }
    AgentMetrics:
      type: object
      required: [agent, days, runs, succeeded, failed]
      properties:
        agent: { type: string }
        days: { type: integer }
        runs: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        success_rate: { type: [number, "null"] }
        cost_usd: { type: number }
        cost_by_kind: { type: object, additionalProperties: { type: number } }
        by_project: { type: array, items: { type: object, required: [project, runs, cost_usd], properties: { project: { type: string }, runs: { type: integer }, cost_usd: { type: number } } } }
        spent_today_usd: { type: number }
        daily_budget_usd: { type: [number, "null"], description: "production's daily budget" }
        by_version: { type: array, items: { $ref: "#/components/schemas/AgentVersionMetrics" } }
    AgentVersionMetrics:
      type: object
      required: [version]
      properties:
        version: { type: integer }
        runs: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        success_rate: { type: [number, "null"] }
        cost_usd: { type: number }
    AgentMetricsSummary:
      type: object
      description: An agent's line in the registry over a period.
      required: [agent, days, runs]
      properties:
        agent: { type: string }
        days: { type: integer }
        runs: { type: integer }
        success_rate: { type: [number, "null"] }
        cost_usd: { type: number }
    AgentResolution:
      type: object
      required: [ref, slug, status, pinned, in_catalogue]
      properties:
        ref: { type: string, description: The reference as asked (`slug` or `slug@N`). }
        slug: { type: string }
        status:
          type: string
          enum: [resolved, not_installed, unavailable]
          description: >-
            `resolved`: a run would load `version`. `not_installed`: the organisation has no such
            agent (`in_catalogue` says whether publishing the workflow installs it, ADR 0040).
            `unavailable`: it exists but a run would not start (`reason`: draft, retired, expired,
            disabled, no such version).
        version: { type: [integer, "null"] }
        pinned: { type: boolean, description: "True when the version comes from the project's pin (fixed or by channel) rather than from the reference or from the agent's channels." }
        source: { type: [string, "null"], enum: [explicit, pin, pin_channel, project_channel, canary, stable, latest, null], description: "why this revision (ADR 0071); `latest` only for an agent that has no production pointer" }
        channel: { type: [string, "null"], enum: [stable, candidate, null] }
        candidate_version: { type: [integer, "null"], description: "the revision in testing, if any: the console says `v4, 10 % of work items run v5`" }
        candidate_percent: { type: [integer, "null"] }
        display_name: { type: [string, "null"] }
        lifecycle: { type: [string, "null"] }
        in_catalogue: { type: boolean }
        reason: { type: [string, "null"] }
    ImplicitAgent:
      type: object
      description: A workflow actor that runs as an agent without naming one of the registry.
      required: [workflow, actor]
      properties:
        workflow: { type: string }
        actor: { type: string }
        role: { type: [string, "null"] }
        model: { type: [string, "null"] }
        backend: { type: [string, "null"] }
        max_turns: { type: [integer, "null"] }
        max_minutes: { type: [integer, "null"] }
    WorkflowAgent:
      type: object
      description: An `agent` actor of an active workflow, and the registry agent it names, if any.
      required: [workflow, actor]
      properties:
        workflow: { type: string }
        actor: { type: string }
        role: { type: [string, "null"] }
        model: { type: [string, "null"] }
        backend: { type: [string, "null"] }
        max_turns: { type: [integer, "null"] }
        max_minutes: { type: [integer, "null"] }
        agent: { type: [string, "null"], description: "`slug` or `slug@N` as the workflow writes it; null for a built-in agent." }
        registered: { type: boolean, description: Whether the agent it names exists in the organisation's registry. }
    GroupMember:
      type: object
      required: [email, can_decide]
      properties:
        email: { type: string }
        display_name: { type: string }
        can_decide: { type: boolean, description: "Whether their role lets them answer a step of this project (`item:decide`)." }
    GroupMembers:
      type: object
      required: [group]
      properties:
        group: { type: string }
        members: { type: array, items: { $ref: "#/components/schemas/GroupMember" } }
    StateActivity:
      type: object
      required: [state, open_items]
      properties:
        state: { type: string }
        open_items: { type: integer }
        oldest_created_at: { type: [string, "null"], format: date-time, description: When the oldest open item in this state was filed. }
    StepActivity:
      type: object
      required: [transition, runs, succeeded, failed, cost_usd]
      properties:
        transition: { type: string }
        runs: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        cost_usd: { type: number }
        median_minutes: { type: [number, "null"] }
    WorkflowActivity:
      type: object
      required: [workflow, days]
      properties:
        workflow: { type: string }
        days: { type: integer }
        states: { type: array, items: { $ref: "#/components/schemas/StateActivity" } }
        steps: { type: array, items: { $ref: "#/components/schemas/StepActivity" } }
    BuiltinModelChoice:
      type: object
      description: The model a built-in agent runs for one work item size (`size` absent when the size does not matter), or why a run would be refused.
      properties:
        size: { type: [string, "null"] }
        profile: { type: [string, "null"] }
        litellm_model: { type: [string, "null"] }
        provider_model: { type: [string, "null"] }
        turns_factor: { type: number }
        error: { type: [string, "null"] }
        warnings: { type: array, items: { type: string } }
    BuiltinMcpServer:
      type: object
      required: [name, description]
      properties:
        name: { type: string }
        description: { type: string }
        tools: { type: array, items: { type: string } }
    BuiltinAgent:
      type: object
      description: What a workflow actor that names no registry agent runs.
      required: [role, playbook, model, backend, backend_source, max_turns, max_minutes, limits_source]
      properties:
        role: { type: string }
        playbook: { type: string }
        playbook_origin: { type: [string, "null"], description: "`package` or `deployment` (`CHOREGOS_PLAYBOOKS_DIR`)." }
        instructions: { type: [string, "null"] }
        instructions_error: { type: [string, "null"] }
        model: { type: string }
        models: { type: array, items: { $ref: "#/components/schemas/BuiltinModelChoice" } }
        backend: { type: string }
        backend_source: { type: string, enum: [actor, project] }
        max_turns: { type: integer }
        max_minutes: { type: integer }
        limits_source: { type: string, enum: [actor, policy] }
        memory: { type: array, items: { type: string } }
        mcp_servers: { type: array, items: { $ref: "#/components/schemas/BuiltinMcpServer" } }
    AgentCredentialCreate:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [token, oauth_client] }
        token_id: { type: [string, "null"] }
        client_id: { type: [string, "null"] }
    AgentCredential:
      type: object
      required: [id, kind]
      properties:
        id: { type: string }
        kind: { type: string }
        token_id: { type: [string, "null"] }
        client_id: { type: [string, "null"] }
        created_by: { type: [string, "null"] }
        created_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        token_name: { type: [string, "null"], description: the name of the attached token }
        last_used_at: { type: [string, "null"], format: date-time, description: "the token's last call to the MCP door: the console shows it as connected" }
        last_client: { type: [string, "null"], description: "the client of that last call (`User-Agent`, truncated)" }
        agent: { type: [string, "null"], description: "the slug of the agent the client is attached to" }
    AgentOverrides:
      type: object
      description: What a project changes in a version — tightening only.
      properties:
        limits: { $ref: "#/components/schemas/AgentLimits" }
        budget: { $ref: "#/components/schemas/AgentBudget" }
        tools: { type: [array, "null"], items: { type: string } }
    ProjectAgentPut:
      type: object
      description: "Exactly one of `version` (a fixed revision) and `channel` (follow production or testing); the server answers 422 otherwise."
      properties:
        version: { type: [integer, "null"], minimum: 1 }
        channel: { type: [string, "null"], enum: [stable, candidate, null] }
        overrides: { $ref: "#/components/schemas/AgentOverrides" }
    ProjectAgent:
      type: object
      required: [agent, version, overrides, effective]
      properties:
        agent: { type: string }
        version: { type: integer, description: "the revision served now (the channel's, for a channel pin)" }
        channel: { type: [string, "null"], enum: [stable, candidate, null], description: "set when the pin follows a channel" }
        overrides: { $ref: "#/components/schemas/AgentOverrides" }
        effective: { $ref: "#/components/schemas/AgentSpec" }
        warning: { type: [string, "null"], description: said when the agent is deprecated }
    SkillFiles:
      type: object
      required: [files]
      properties:
        files: { type: object, additionalProperties: { type: string }, description: "path → content. UTF-8 text, except for the extensions png, jpg, jpeg, gif, webp, ico, ttf, otf, woff, woff2 (inert binaries, 512 KiB decoded at most, magic bytes checked), whose value is ALWAYS standard base64 of the bytes; SVG is text" }
    SkillSource:
      type: object
      description: Where a version imported from git comes from (ADR 0050).
      required: [repo, sha, path]
      properties:
        repo: { type: string }
        sha: { type: string, description: the full commit SHA the version is pinned to }
        path: { type: string, description: "the skill's folder in the repository; empty is the root" }
        licence: { type: [string, "null"], description: "an SPDX identifier, LicenseRef-proprietary, LicenseRef-unknown, or null when none was found" }
        catalogue: { type: [string, "null"], description: "`<id>@<catalogue_version>` when installed from the skills catalogue (ADR 0065)" }
        delivery: { type: [string, "null"], enum: [bundled, git, null], description: "for a catalogue install, whether the files came from the image or from the pinned commit" }
    SkillVersion:
      type: object
      required: [version, digest]
      properties:
        version: { type: integer }
        digest: { type: string }
        created_by: { type: [string, "null"] }
        created_at: { type: [string, "null"], format: date-time }
        files: { type: [object, "null"], additionalProperties: { type: string }, description: "path → content: UTF-8 text, or base64 for a font or image extension (png, jpg, jpeg, gif, webp, ico, ttf, otf, woff, woff2)" }
        source: { oneOf: [{ $ref: "#/components/schemas/SkillSource" }, { type: "null" }] }
        risk: { type: [string, "null"], enum: [low, medium, high, null], description: "the gate's tier; null before the gate existed" }
        review_status: { type: string, enum: [approved, pending_review], description: "a high-risk version waits for an administrator who is not its importer; until then no agent pins it and no run receives it" }
        findings: { type: array, items: { $ref: "#/components/schemas/SkillFinding" } }
        reviewed_by: { type: [string, "null"] }
        reviewed_at: { type: [string, "null"], format: date-time }
    SkillFinding:
      type: object
      description: What the gate found in a version (ADR 0050).
      required: [code, severity, detail]
      properties:
        code: { type: string, description: "script, executable, outbound_url, credential, mcp_reference, prompt_injection, hidden_unicode, obfuscated, pipe_to_shell, licence_missing, licence_not_open; from the second scanner (ADR 0095): skillspector:<rule> (e.g. skillspector:SC4), scanner_failed, scanner_incomplete, osv_mirror_missing" }
        severity: { type: string, enum: [info, warning, critical] }
        detail: { type: string }
        file: { type: [string, "null"] }
        line: { type: [integer, "null"] }
    SkillSources:
      type: object
      required: [sources]
      properties:
        sources: { type: array, items: { type: string }, maxItems: 100 }
        default: { type: boolean, description: true when the organisation has not written its own list }
    SkillGitPreviewRequest:
      type: object
      required: [repo_url, ref]
      properties:
        repo_url: { type: string, description: "https://github.com/<owner>/<repo> or https://gitlab.com/<group>/…/<project>" }
        path: { type: string, default: "", description: a folder holding one skill, or several skill folders }
        ref: { type: string, description: a branch, a tag or a commit }
        allow_egress: { type: boolean, default: false, description: "open the hosts this needs in the organisation's egress allowlist, in the same call (S39-22); needs `tools:grant`. Without it a missing host is a 409 `egress_required`" }
    SkillGitImport:
      type: object
      required: [repo_url, sha, skills]
      properties:
        repo_url: { type: string }
        path: { type: string, default: "" }
        sha: { type: string, description: a full commit SHA; a branch or a tag is refused }
        skills: { type: array, items: { type: string }, minItems: 1, maxItems: 100 }
        allow_egress: { type: boolean, default: false, description: "open the hosts this needs in the organisation's egress allowlist, in the same call (S39-22); needs `tools:grant`. Without it a missing host is a 409 `egress_required`" }
    SkillCandidate:
      type: object
      required: [path, files, bytes]
      properties:
        path: { type: string }
        name: { type: [string, "null"] }
        description: { type: [string, "null"] }
        files: { type: integer }
        bytes: { type: integer }
        licence: { type: [string, "null"] }
        problem: { type: [string, "null"], description: why it cannot be imported }
        existing_version: { type: [integer, "null"], description: the latest version of the library's skill of that name }
        risk: { type: [string, "null"], enum: [low, medium, high, null], description: "the gate's tier; null before the gate existed" }
        findings: { type: array, items: { $ref: "#/components/schemas/SkillFinding" } }
    SkillGitPreview:
      type: object
      required: [repo, ref, sha, path, allowed, skills]
      properties:
        repo: { type: string }
        ref: { type: string }
        sha: { type: string }
        path: { type: string }
        allowed: { type: boolean, description: whether the repository is in the organisation's allowlist }
        skills: { type: array, items: { $ref: "#/components/schemas/SkillCandidate" } }
    SkillUpdate:
      type: object
      required: [slug, version, source, ref, sha, up_to_date]
      properties:
        slug: { type: string }
        version: { type: integer }
        source: { $ref: "#/components/schemas/SkillSource" }
        ref: { type: string }
        sha: { type: string }
        up_to_date: { type: boolean }
        digest: { type: [string, "null"] }
        added: { type: array, items: { type: string } }
        removed: { type: array, items: { type: string } }
        modified: { type: array, items: { type: string } }
        problem: { type: [string, "null"] }
    Skill:
      type: object
      required: [slug, status, latest_version]
      properties:
        slug: { type: string }
        description: { type: [string, "null"] }
        status: { type: string }
        latest_version: { type: integer }
        used_by: { type: array, items: { type: string } }
        versions: { type: [array, "null"], items: { $ref: "#/components/schemas/SkillVersion" } }
        risk: { type: [string, "null"], enum: [low, medium, high, null], description: "the gate's tier of the latest version; null before the gate existed" }
        review_status: { type: string, enum: [approved, pending_review] }
    KnowledgeBaseCreate:
      type: object
      required: [slug, name]
      additionalProperties: false
      properties:
        slug: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$" }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 2000 }
        scope: { type: string, enum: [org, projects, groups], default: org, description: "`org`: every project; `projects`: the listed ones; `groups`: humans of the listed IdP groups (never a run)" }
        projects: { type: array, items: { type: string }, maxItems: 200 }
        groups: { type: array, items: { type: string }, maxItems: 200 }
        serving_mode: { type: string, enum: [files, index], default: files, description: "`files`: the converted corpus mounted read-only in the workspace; `index`: hybrid search" }
        restricted: { type: boolean, default: false, description: "people read it only through a grant (or as an administrator or owning-project owner); a run attached to it is served it only on behalf of a person who may read it: the person who started its work item, or of a fan-out child its parent's (S42-11, ADR 0081, ADR 0097)" }
    ProjectKnowledgeBaseCreate:
      type: object
      required: [slug, name]
      additionalProperties: false
      properties:
        slug: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$" }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 2000 }
        serving_mode: { type: string, enum: [files, index], default: files }
    KnowledgeBasePatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: [string, "null"], minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 2000 }
        scope: { type: [string, "null"], enum: [org, projects, groups, null] }
        projects: { type: [array, "null"], items: { type: string }, maxItems: 200 }
        groups: { type: [array, "null"], items: { type: string }, maxItems: 200 }
        serving_mode: { type: [string, "null"], enum: [files, index, null] }
        status: { type: [string, "null"], enum: [active, archived, null] }
        restricted: { type: [boolean, "null"], description: "`agent:manage` only, like the rest of the reach (S42-11)" }
    KnowledgeGrant:
      type: object
      required: [subject_type, subject, role]
      additionalProperties: false
      description: A role on one knowledge base given to a person, a group or a project. Never serves a run (ADR 0081).
      properties:
        subject_type: { type: string, enum: [user, group, project] }
        subject: { type: string, minLength: 1, maxLength: 320, description: "a member id or an email (`user`), an IdP group name (`group`), a project slug (`project`)" }
        display: { type: [string, "null"], description: "a name to show; set by the server on reads" }
        role: { type: string, enum: [viewer, editor, owner] }
        pending: { type: boolean, description: "read-only: an email with no member yet; it resolves when that person signs in" }
        created_by: { type: [string, "null"] }
        created_at: { type: [string, "null"], format: date-time }
    KnowledgeGrants:
      type: object
      required: [grants]
      properties:
        grants: { type: array, items: { $ref: "#/components/schemas/KnowledgeGrant" }, maxItems: 200 }
    KnowledgeGrantsPut:
      type: object
      required: [grants]
      additionalProperties: false
      properties:
        grants: { type: array, items: { $ref: "#/components/schemas/KnowledgeGrant" }, maxItems: 200 }
    KnowledgePermissions:
      type: object
      description: What the caller may do with a knowledge base, decided by the server (ADR 0081, same pattern as ADR 0061 and 0074).
      required: [edit, distill, share, archive, widen]
      properties:
        edit: { type: boolean, description: "upload, delete, convert, sources, sync, eval, reindex, rename, serving mode" }
        distill: { type: boolean, description: "distil the base into a skill (spends model budget)" }
        share: { type: boolean, description: "change the grants" }
        archive: { type: boolean }
        widen: { type: boolean, description: "change scope, projects, groups or restricted (organisation administrator, or owner of the base's project)" }
    KnowledgeDocument:
      type: object
      required: [id, filename, title, mime, size_bytes, digest, source, status]
      properties:
        id: { type: string }
        filename: { type: string }
        title: { type: string, description: "the format's own title, else the first heading, else the file name" }
        mime: { type: string }
        size_bytes: { type: integer }
        digest: { type: string, description: sha256 of the uploaded bytes }
        source: { type: string, description: "`upload`" }
        status: { type: string, enum: [pending, converting, ready, failed] }
        error: { type: [string, "null"] }
        warnings:
          type: array
          items: { type: string }
          description: "what the conversion left out of a ready document, one sentence each (a spreadsheet read up to its row cap: `Sheet \"Q3\": 1200 more rows not shown`); empty when nothing was cut"
        created_by: { type: [string, "null"] }
        created_at: { type: [string, "null"], format: date-time }
        converted_at: { type: [string, "null"], format: date-time }
        markdown: { type: [string, "null"], description: returned by the reading of one document }
        source_id: { type: [string, "null"], description: the source it was synced from; none for an upload }
        source_url: { type: [string, "null"], description: where to open the original }
    KnowledgeDistillRequest:
      type: object
      description: Optional body of `distillKnowledgeBase` (S42-10).
      properties:
        exclude: { type: array, maxItems: 20, items: { type: string, maxLength: 200 }, default: [], description: "filename globs of documents left out (`*.xlsx`, `archive/*`)" }
        max_usd: { type: [number, "null"], minimum: 0, description: "stop and publish nothing when the spend would pass this; null keeps the platform's budget" }
    KnowledgeDistillRun:
      type: object
      description: >-
        One distillation run, as kept in `distillation.history` (S42-10d): how it ended and what it cost. The last five
        runs before the current one, newest first.
      required: [status]
      properties:
        status: { type: string, enum: [running, pending_review, approved, rejected, failed, stopped], description: "how the run ended (`running` only for a run whose end was never recorded)" }
        code: { type: [string, "null"], description: "why it failed or was stopped: `too_large`, `over_budget`, `no_document`, `gateway`, `model_refused`, `nothing_cited`, `cancelled`" }
        error: { type: [string, "null"] }
        requested_by: { type: [string, "null"], description: who started it }
        stopped_by: { type: [string, "null"], description: who stopped it, when stopped }
        started_at: { type: [string, "null"], format: date-time }
        at: { type: [string, "null"], format: date-time, description: when it ended }
        phase: { type: [string, "null"], enum: [plan, map, reduce, publish, null] }
        parts_done: { type: integer }
        parts_total: { type: integer }
        spent_usd: { type: number, description: "what the run's model calls cost; parts reused from an earlier run cost nothing" }
        skill: { type: [string, "null"] }
        version: { type: [integer, "null"] }
    KnowledgeDistillEstimate:
      type: object
      required: [characters, tokens_estimate, documents, parts, calls, model, priced_by, within_budget, biggest]
      properties:
        characters: { type: integer }
        tokens_estimate: { type: integer, description: "approximate: characters / 4" }
        documents: { type: integer }
        parts: { type: integer, description: "the pieces the corpus is cut into; a base that fits one pass is one part" }
        calls: { type: integer, description: "model calls: one per part, plus the merge(s) when there are several parts" }
        model: { type: string }
        input_cost_usd: { type: [number, "null"], description: "null when the model is not priced" }
        output_cost_usd: { type: [number, "null"] }
        priced_by: { type: string, enum: [gateway, override, none] }
        budget_usd: { type: [number, "null"], description: "the platform's ceiling for one distillation" }
        within_budget: { type: boolean }
        refused_reason: { type: [string, "null"], description: "why a distillation would not start; null when it would" }
        biggest:
          type: array
          description: the documents that weigh most, biggest first
          items:
            type: object
            required: [filename, characters]
            properties:
              filename: { type: string }
              characters: { type: integer }
    KnowledgeBase:
      type: object
      required: [slug, name, scope, serving_mode, status]
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        scope: { type: string, enum: [org, projects, groups] }
        projects: { type: array, items: { type: string } }
        groups: { type: array, items: { type: string } }
        serving_mode: { type: string, enum: [files, index] }
        status: { type: string }
        document_count: { type: integer }
        documents_by_status: { type: object, additionalProperties: { type: integer } }
        created_by: { type: [string, "null"] }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
        documents: { type: [array, "null"], items: { $ref: "#/components/schemas/KnowledgeDocument" } }
        index:
          type: [object, "null"]
          description: "`index` mode: chunks, documents indexed, and the search mode (`hybrid`, `full-text` without pgvector or embedder, `in-process` on SQLite)"
          properties:
            chunks: { type: integer }
            documents: { type: integer }
            mode: { type: string }
        eval_set: { type: array, items: { $ref: "#/components/schemas/KnowledgeEvalCase" } }
        sources: { type: [array, "null"], items: { $ref: "#/components/schemas/KnowledgeSource" }, description: returned by the reading of one base }
        owner_project: { type: [string, "null"], description: "the project this base was created from (S39-14): its owners curate it, never widen it; null for an organisation's base" }
        restricted: { type: boolean, description: "people read it only through a grant; a run is served it only on behalf of a person who may read it (S42-11, ADR 0097)" }
        can: { $ref: "#/components/schemas/KnowledgePermissions" }
        cannot_reason: { type: [string, "null"], description: "the server's sentence when the caller may not edit: shown as is, never guessed from roles" }
        my_role: { type: [string, "null"], enum: [viewer, editor, owner, null], description: "the caller's role on the base through grants or ownership; null for a plain reader through the reach" }
        grants: { type: [array, "null"], items: { $ref: "#/components/schemas/KnowledgeGrant" }, description: returned by the reading of one base, to a caller who may share it }
        distillation:
          type: [object, "null"]
          properties:
            status: { type: string, enum: [running, pending_review, approved, rejected, failed, stopped] }
            code: { type: [string, "null"] }
            error: { type: [string, "null"] }
            at: { type: [string, "null"], format: date-time }
            requested_by: { type: [string, "null"] }
            started_at: { type: [string, "null"], format: date-time }
            phase: { type: [string, "null"], enum: [plan, map, reduce, publish, null] }
            parts_done: { type: integer }
            parts_total: { type: integer }
            spent_usd: { type: number }
            skill: { type: [string, "null"] }
            version: { type: [integer, "null"] }
            principles: { type: [integer, "null"] }
            dropped: { type: array, items: { type: string } }
            history: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/KnowledgeDistillRun" }, description: "the runs before this one, newest first (S42-10d)" }
            stopped_by: { type: [string, "null"], description: "who stopped the run, when `status` is `stopped`" }
            exclude: { type: array, items: { type: string }, description: "the globs the run left out, kept for a relaunch" }
            max_usd: { type: [number, "null"], description: "the cap the run was started with, kept for a relaunch" }
          description: "the last distillation: `status` (running, pending_review, failed, stopped), `skill`, `version`, `principles`, `dropped` (principles citing nothing of the base), `error`, `at`; `code` when failed or stopped (`too_large`, `over_budget`, `no_document`, `gateway`, `model_refused`, `nothing_cited`, `cancelled`); while running or after, `phase` (`plan`, `map`, `reduce`, `publish`), `parts_done`, `parts_total`, `spent_usd` and `started_at` (a run older than 30 minutes without an end is dead and no longer blocks a new one); `history` holds the runs before it, `stopped_by` who stopped it, `exclude` and `max_usd` what a relaunch reuses"
        eval_result:
          type: [object, "null"]
          description: the last run of the eval set
          properties:
            k: { type: integer }
            recall: { type: [number, "null"], description: "expected documents found in the top k / expected documents" }
            mode: { type: string }
            ran_at: { type: string }
            cases:
              type: array
              items:
                type: object
                properties:
                  question: { type: string }
                  expected: { type: array, items: { type: string } }
                  found: { type: array, items: { type: string } }
                  returned: { type: array, items: { type: string } }
    KnowledgeSourceCreate:
      type: object
      required: [kind, name]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [sharepoint, confluence, web, git] }
        name: { type: string, minLength: 1, maxLength: 200 }
        connector: { type: [string, "null"], description: "`sharepoint`, `confluence`: the organisation connector of capability `documents`" }
        config:
          type: object
          description: "`sharepoint`: `site_id` or `drive_id`, optional `folder`; `confluence`: `space_key`, optional `page_id` (that page and its descendants), `include_root` (default true), `include_attachments` (default false), `labels` (≤ 20); `web`: `url` (https), `max_depth` (≤ 5), `max_pages` (≤ 500); `git`: `url` (https), `ref`, `paths` (globs, default `*.md`)"
        interval_minutes: { type: integer, minimum: 5, maximum: 10080, default: 60 }
        refresh_mode: { type: string, enum: [interval, cron, manual], default: interval, description: "`interval`: every `interval_minutes`; `cron`: `refresh_cron` in `refresh_timezone`; `manual`: only on demand (S39-19)" }
        refresh_cron: { type: [string, "null"], maxLength: 100, description: "five fields (minute hour day month weekday); at least 5 minutes between two fires" }
        refresh_timezone: { type: string, maxLength: 64, default: UTC, description: IANA name, for example `Europe/Paris` }
        allow_egress: { type: boolean, default: false, description: "open the hosts this needs in the organisation's egress allowlist, in the same call (S39-22); needs `tools:grant`. Without it a missing host is a 409 `egress_required`" }
    KnowledgeSourcePatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: [string, "null"], minLength: 1, maxLength: 200 }
        config: { type: [object, "null"] }
        interval_minutes: { type: [integer, "null"], minimum: 5, maximum: 10080 }
        refresh_mode: { type: [string, "null"], enum: [interval, cron, manual, null] }
        refresh_cron: { type: [string, "null"], maxLength: 100 }
        refresh_timezone: { type: [string, "null"], maxLength: 64 }
        allow_egress: { type: boolean, default: false, description: "open the hosts this needs in the organisation's egress allowlist, in the same call (S39-22); needs `tools:grant`. Without it a missing host is a 409 `egress_required`" }
    KnowledgeSource:
      type: object
      required: [id, kind, name, interval_minutes, status]
      properties:
        id: { type: string }
        kind: { type: string, enum: [sharepoint, confluence, web, git] }
        name: { type: string }
        connector: { type: [string, "null"] }
        config: { type: object }
        interval_minutes: { type: integer }
        refresh_mode: { type: string, enum: [interval, cron, manual] }
        refresh_cron: { type: [string, "null"] }
        refresh_timezone: { type: string }
        next_sync_at: { type: [string, "null"], format: date-time, description: an estimate (the worker may be down); null in manual mode or when due }
        sync_requested_at: { type: [string, "null"], format: date-time }
        status: { type: string, enum: [idle, syncing, failed] }
        last_synced_at: { type: [string, "null"], format: date-time }
        last_error: { type: [string, "null"] }
        last_summary:
          type: [object, "null"]
          description: what the last sync did
          properties:
            added: { type: integer }
            updated: { type: integer }
            deleted: { type: integer }
            unchanged: { type: integer }
            skipped: { type: integer }
            skipped_reasons: { type: array, items: { type: string } }
            truncated: { type: integer, description: documents converted by this sync with part of their content left out }
            truncated_reasons: { type: array, items: { type: string }, description: "`<file>: <warning>`, at most 20" }
        document_count: { type: integer }
    KnowledgeEvalCase:
      type: object
      required: [question, expected]
      additionalProperties: false
      properties:
        question: { type: string, minLength: 1, maxLength: 2000 }
        expected: { type: array, minItems: 1, maxItems: 20, items: { type: string }, description: file names or titles }
    KnowledgeEvalSet:
      type: object
      additionalProperties: false
      properties:
        cases: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/KnowledgeEvalCase" } }
    KnowledgeSearchRequest:
      type: object
      required: [query]
      additionalProperties: false
      properties:
        query: { type: string, minLength: 1, maxLength: 2000 }
        k: { type: integer, minimum: 1, maximum: 20, default: 5 }
        knowledge_base: { type: [string, "null"], description: "internal search: one base of the run; absent, all of them" }
    KnowledgeCitation:
      type: object
      required: [knowledge_base, document_id, document, filename, heading_path, excerpt, score]
      properties:
        knowledge_base: { type: string }
        document_id: { type: string }
        document: { type: string, description: the document's title }
        filename: { type: string }
        heading_path: { type: array, items: { type: string } }
        excerpt: { type: string }
        score: { type: number, description: reciprocal rank fusion score }
    KnowledgeSearchResult:
      type: object
      required: [mode, hits]
      properties:
        mode: { type: string, enum: [hybrid, full-text, in-process] }
        hits: { type: array, items: { $ref: "#/components/schemas/KnowledgeCitation" } }
    WorkflowIssue:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        path: { type: [string, "null"] }
        line: { type: [integer, "null"] }
        column: { type: [integer, "null"] }
        deprecated_code:
          type: [string, "null"]
          deprecated: true
          description: >-
            Former spelling of a code renamed to English (`gate.sans_matiere` is now
            `gate.nothing_to_check`, `workflow.effet_implicite` is now `workflow.implicit_effect`),
            emitted for one release (ADR 0046)
    WorkflowGraph:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items:
            type: object
            required: [id, display, kind]
            properties:
              id: { type: string }
              display: { type: string }
              kind: { type: string }
              terminal: { type: boolean }
              lane: { type: string }
              tracker_status: { type: [string, "null"], description: "The tracker column the state maps to; the console groups the path into stages by it." }
        edges:
          type: array
          items:
            type: object
            required: [from, to]
            properties:
              id: { type: [string, "null"] }
              from: { type: string }
              to: { type: string }
              kind:
                type: string
                description: "`nominal` for a transition of the YAML; `reject`, `resume`, `escalate`, `default`… for the secondary edges (drawn dashed)."
              label: { type: string }
              wildcard: { type: boolean }
              actor: { type: [string, "null"] }
              actor_type: { type: [string, "null"] }
              role: { type: [string, "null"] }
              gates: { type: array, items: { type: string } }
              via: { type: [string, "null"] }
              timeout_hours: { type: [integer, "null"] }
        artifacts:
          type: array
          description: "The artifact flow (S39-13), one entry per document the workflow produces or reads."
          items: { $ref: "#/components/schemas/ArtifactFlow" }
    ArtifactFlow:
      type: object
      required: [name, produced_by, read_by, origin]
      properties:
        name: { type: string }
        type: { type: [string, "null"], description: The declared file type of the first producer's output; null for an inline value. }
        produced_by: { type: array, items: { type: string }, description: The ids of the transitions that output it. }
        read_by: { type: array, items: { type: string }, description: The ids of the transitions that list it in `inputs`. }
        origin:
          type: string
          enum: [step, feedback, field, missing]
          description: >-
            `step`: some transition outputs it. `feedback`: `human_feedback`, written by a person's
            rejection (`produced_by` lists the human transitions with `on_reject`). `field`: a
            property of `metadata.inputs`. `missing`: read, but nothing produces it.
        context: { type: boolean, description: True when the platform gives it to every agent stage. }
        in_pull_request: { type: boolean, description: True when the pull request body carries it. }
    WorkflowTemplate:
      type: object
      required: [name, version, display, yaml]
      properties:
        name: { type: string }
        version: { type: integer }
        display: { type: string }
        description: { type: string }
        yaml: { type: string }
    PolicyDef:
      type: object
      required: [name, version, yaml, is_active]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: integer }
        yaml: { type: string }
        json: { $ref: "./schemas/policy.schema.json" }
        is_active: { type: boolean }
        clamps:
          type: array
          items: { type: string }
          description: what the organisation's ceiling brings down in this policy; the policy that runs is the clamped one
    PolicyCeiling:
      type: object
      additionalProperties: false
      description: "Caps a project policy may only tighten (S27-05). A per-role table's `default` caps every role it does not name; a cap left out leaves the project free."
      properties:
        budgets:
          type: object
          additionalProperties: false
          properties:
            ticket_usd: { type: object, additionalProperties: { type: number } }
            stage_usd: { type: object, additionalProperties: { type: object, additionalProperties: { type: number } } }
            max_turns: { type: object, additionalProperties: { type: integer } }
            max_minutes: { type: object, additionalProperties: { type: integer } }
            tool_calls_per_run: { type: [integer, "null"], minimum: 1 }
            daily_project_usd: { type: [number, "null"], exclusiveMinimum: 0 }
            monthly_org_usd: { type: [number, "null"], exclusiveMinimum: 0, description: "What all the organisation's projects may spend in a calendar month (UTC). Not a field of a project policy: nothing is clamped, it enters every stage's reservation (S27-11)." }
        attempts:
          type: object
          additionalProperties: false
          properties:
            default_max: { type: [integer, "null"], minimum: 1 }
            by_role: { type: object, additionalProperties: { type: integer } }
            dod_iterations: { type: [integer, "null"], minimum: 0 }
        scope:
          type: object
          additionalProperties: false
          properties:
            auto_grant_max_files: { type: [integer, "null"], minimum: 0 }
            max_diff_files: { type: [integer, "null"], minimum: 1 }
            max_diff_lines: { type: [integer, "null"], minimum: 1 }
        findings:
          type: object
          additionalProperties: false
          properties:
            max_per_run: { type: [integer, "null"], minimum: 0 }
        network:
          $ref: "#/components/schemas/CeilingNetwork"
        web_search:
          type: [object, "null"]
          additionalProperties: false
          description: "The built-in web_search tool (ADR 0083). Absent or `mode: deny`: not offered. An unknown data-handling value fails every bound that reads it."
          properties:
            mode: { type: string, enum: [allow, deny], default: deny }
            backends: { type: [array, "null"], items: { type: string } }
            max_query_retention_days: { type: [integer, "null"], minimum: 0 }
            allow_query_reuse: { type: boolean, default: false }
            regions: { type: [array, "null"], items: { type: string } }
    CeilingNetwork:
      type: object
      additionalProperties: false
      description: "The organisation's network bound (ADR 0070): no project or agent goes beyond it."
      properties:
        allow_domains: { type: [array, "null"], items: { type: string }, description: "The widest set of hosts a project may allow; null: no cap. `[\"*\"]`: any public host." }
        deny_domains: { type: array, items: { type: string }, default: [], description: "Hosts no run may reach, whatever a project or an agent says." }
        per_host_per_minute: { type: [integer, "null"], minimum: 1 }
        per_run_per_minute: { type: [integer, "null"], minimum: 1 }
        builtin_web_tools: { type: [string, "null"], enum: [allow, deny, null] }
        user_agent_contact: { type: [string, "null"], maxLength: 200, description: "Where an operator can reach the organisation, written into the User-Agent of what the platform fetches for it." }
    PolicyCeilingState:
      type: object
      properties:
        ceiling: { oneOf: [{ $ref: "#/components/schemas/PolicyCeiling" }, { type: "null" }] }
        updated_by: { type: [string, "null"] }
        updated_at: { type: [string, "null"] }
    PolicyCeilingPut:
      type: object
      required: [ceiling]
      properties:
        ceiling: { oneOf: [{ $ref: "#/components/schemas/PolicyCeiling" }, { type: "null" }] }
    OutboundProxy:
      type: object
      additionalProperties: false
      required: [enabled, endpoint, scheme, username, password_set, applies_to]
      properties:
        enabled: { type: boolean }
        endpoint: { type: string, pattern: "^[A-Za-z0-9.-]{1,253}:[0-9]{1,5}$", description: "`host:port`, no scheme, no credentials" }
        scheme: { type: string, enum: [http, https], description: "the protocol spoken to the proxy; https targets go through CONNECT" }
        username: { type: string, maxLength: 512, description: "provider options (country, sticky session) are encoded here as the provider documents them; Choregos does not build them" }
        password_set: { type: boolean }
        applies_to:
          type: array
          uniqueItems: true
          minItems: 1
          items: { type: string, enum: [web_fetch, web_search, knowledge_web, search_engines] }
    OutboundProxyState:
      type: object
      additionalProperties: false
      required: [proxy, updated_by, updated_at]
      properties:
        proxy: { oneOf: [{ $ref: "#/components/schemas/OutboundProxy" }, { type: "null" }] }
        updated_by: { type: [string, "null"] }
        updated_at: { type: [string, "null"] }
    OutboundProxyPut:
      type: object
      additionalProperties: false
      required: [enabled, endpoint, scheme, username]
      properties:
        enabled: { type: boolean }
        endpoint: { type: string, pattern: "^[A-Za-z0-9.-]{1,253}:[0-9]{1,5}$", description: "`host:port`, no scheme, no credentials" }
        scheme: { type: string, enum: [http, https] }
        username: { type: string, maxLength: 512 }
        password: { type: string, minLength: 1, maxLength: 1024, writeOnly: true, description: "sealed, never returned; absent keeps the stored one, required on the first write" }
        applies_to:
          type: array
          uniqueItems: true
          minItems: 1
          items: { type: string, enum: [web_fetch, web_search, knowledge_web, search_engines] }
          default: [web_fetch, web_search, knowledge_web, search_engines]
    OutboundProxyTest:
      type: object
      additionalProperties: false
      required: [ok, exit_ip, country, error, elapsed_ms, target]
      properties:
        ok: { type: boolean }
        exit_ip: { type: [string, "null"] }
        country: { type: [string, "null"], description: "ISO 3166-1 alpha-2 as the echo endpoint reports it" }
        error: { type: [string, "null"], description: "names the proxy; never the password" }
        elapsed_ms: { type: integer, minimum: 0 }
        target: { type: string, description: "the echo endpoint that was fetched" }
    PluginContents:
      type: object
      additionalProperties: false
      description: What an installed plugin brought, by the identifier each item has in the organisation.
      required: [agents, skills, templates, evals, procedures, servers]
      properties:
        agents: { type: array, items: { type: string }, description: "agent slugs" }
        skills: { type: array, items: { type: string } }
        templates: { type: array, items: { type: string } }
        evals: { type: array, items: { type: string } }
        procedures: { type: array, items: { type: string }, description: "procedure ids (ADR 0067)" }
        servers: { type: array, items: { type: string } }
    InstalledPlugin:
      type: object
      additionalProperties: false
      required: [name, version, source, digest, publisher, license, description, default, contents, installed_by, installed_at, latest]
      properties:
        name: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        version: { type: string }
        source: { type: string, description: "the source's name; `offline` for the deployment's offline directory" }
        digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$", description: "sha256 of the plugin's canonical tar" }
        publisher: { type: string }
        license: { type: string }
        description: { type: string }
        default: { type: boolean, description: "installed because the deployment lists it in `plugins.defaultPlugins`" }
        contents: { $ref: "#/components/schemas/PluginContents" }
        installed_by: { type: [string, "null"], description: "null when the start-up reconcile installed it" }
        installed_at: { type: string, format: date-time }
        latest: { type: [string, "null"], description: "the newest version the source offers for this core, when newer than `version`" }
    PluginList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/InstalledPlugin" } }
    PluginTrust:
      type: object
      additionalProperties: false
      description: "How a source's signatures are verified: a keyless cosign identity and issuer, or a public key; `none` only for the offline directory."
      required: [mode]
      properties:
        mode: { type: string, enum: [keyless, key, none] }
        issuer: { type: [string, "null"] }
        identity: { type: [string, "null"] }
        key_fingerprint: { type: [string, "null"], description: "sha256 of the public key; the key itself is not returned" }
    PluginSourceEntry:
      type: object
      additionalProperties: false
      required: [name, description, versions]
      properties:
        name: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        description: { type: [string, "null"] }
        versions:
          type: array
          description: "newest first, each with the core range it was validated against"
          items:
            type: object
            additionalProperties: false
            required: [version, core, admissible]
            properties:
              version: { type: string }
              core: { type: string }
              admissible: { type: boolean, description: "this core is inside `core`" }
    PluginSource:
      type: object
      additionalProperties: false
      required: [name, index, trust, plugins, error]
      properties:
        name: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        index: { type: string, description: "`oci://…`, `https://…` or the offline directory's path" }
        trust: { $ref: "#/components/schemas/PluginTrust" }
        plugins: { type: array, items: { $ref: "#/components/schemas/PluginSourceEntry" } }
        error: { type: [string, "null"], description: "why the index could not be read; `plugins` is then empty" }
    PluginSources:
      type: object
      additionalProperties: false
      required: [sources]
      properties:
        sources: { type: array, items: { $ref: "#/components/schemas/PluginSource" } }
    PluginInstall:
      type: object
      additionalProperties: false
      required: [source, name, version]
      properties:
        source: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        name: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        version: { type: string, minLength: 1, maxLength: 128, description: "an exact version or a range (`^0.1`, `>=1.2.0,<2`)" }
    PluginInstallPending:
      type: object
      additionalProperties: false
      required: [status, approval_id, reason]
      properties:
        status: { const: pending_approval }
        approval_id: { type: string }
        reason: { type: string, description: "why a second person must approve, e.g. the plugin brings a server" }
    PluginApproval:
      type: object
      additionalProperties: false
      description: "An install or upgrade of a plugin that brings a server, waiting for (or given) a second approval."
      required: [id, action, source, name, version, digest, reason, default, requested_by, status, decided_by, created_at, decided_at]
      properties:
        id: { type: string }
        action: { type: string, enum: [install, upgrade] }
        source: { type: string }
        name: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        version: { type: string, description: "the exact version that was checked" }
        digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        reason: { type: string }
        default: { type: boolean, description: "asked by the start-up reconcile for a plugin of `plugins.defaultPlugins`" }
        requested_by: { type: [string, "null"], description: "null when the platform asked (a default plugin)" }
        status: { type: string, enum: [pending, approved] }
        decided_by: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        decided_at: { type: [string, "null"], format: date-time }
    PluginApprovalList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PluginApproval" } }
    PluginKept:
      type: object
      additionalProperties: false
      required: [agents, skills]
      properties:
        agents: { type: array, items: { type: string } }
        skills: { type: array, items: { type: string } }
    PluginUninstallResult:
      type: object
      additionalProperties: false
      required: [name, version, removed, kept]
      properties:
        name: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        version: { type: string }
        removed: { $ref: "#/components/schemas/PluginKept" }
        kept: { $ref: "#/components/schemas/PluginKept", description: "what the organisation changed, a project pins, or a kept agent still carries: now the organisation's own" }
    PluginUpgrade:
      type: object
      additionalProperties: false
      properties:
        version: { type: string, minLength: 1, maxLength: 128, description: "an exact version or a range; absent, the newest admissible" }
    PluginUpgradeResult:
      type: object
      additionalProperties: false
      required: [plugin, previous_version, offered]
      properties:
        plugin: { $ref: "#/components/schemas/InstalledPlugin" }
        previous_version: { type: string }
        offered: { type: array, items: { type: string }, description: "agent slugs the organisation changed: offered the update, not overwritten (ADR 0040)" }
    RelayOutboundProxy:
      type: object
      additionalProperties: false
      required: [proxy]
      properties:
        proxy:
          oneOf:
            - $ref: "#/components/schemas/RelayProxyCredentials"
            - { type: "null" }
    RelayProxyCredentials:
      type: object
      additionalProperties: false
      description: The one schema that carries the proxy's password in clear; only the relay route returns it.
      required: [endpoint, scheme, username, password]
      properties:
        endpoint: { type: string, pattern: "^[A-Za-z0-9.-]{1,253}:[0-9]{1,5}$" }
        scheme: { type: string, enum: [http, https] }
        username: { type: string, maxLength: 512 }
        password: { type: string, maxLength: 1024 }
    PolicyPut:
      type: object
      required: [yaml]
      properties:
        yaml: { type: string }
        activate: { type: boolean, default: true }
    GatewayModel:
      type: object
      required: [model_name, litellm_model]
      properties:
        model_name: { type: string }
        litellm_model: { type: string }
        provider: { type: string }
        input_cost_per_1k: { type: [number, "null"] }
        output_cost_per_1k: { type: [number, "null"] }
        input_audio_cost_per_1k: { type: [number, "null"] }
        output_audio_cost_per_1k: { type: [number, "null"] }
        cached_input_cost_per_1k: { type: [number, "null"] }
        max_input_tokens: { type: [integer, "null"] }
        supports_tool_calling: { type: boolean, default: true }
        supports_vision: { type: boolean, default: false }
        internal_price: { type: boolean, default: false }
        source: { type: string, enum: [gateway, manual], default: gateway }
        owned_by: { type: string, default: "" }
    PriceOverride:
      type: object
      required: [input_per_1k, output_per_1k]
      properties:
        input_per_1k: { type: number, minimum: 0 }
        output_per_1k: { type: number, minimum: 0 }
    ModelGatewayFacts:
      type: object
      properties:
        provider: { type: string }
        upstream_model: { type: string }
        input_cost_per_1k: { type: [number, "null"] }
        output_cost_per_1k: { type: [number, "null"] }
        input_audio_cost_per_1k: { type: [number, "null"] }
        output_audio_cost_per_1k: { type: [number, "null"] }
        cached_input_cost_per_1k: { type: [number, "null"] }
        max_input_tokens: { type: [integer, "null"] }
        supports_tool_calling: { type: boolean, default: true }
        supports_vision: { type: boolean, default: false }
    ModelCatalogueEntry:
      type: object
      required: [id, model_name, display_name, source, enabled, allowed_roles, usages]
      properties:
        id: { type: string }
        model_name: { type: string }
        display_name: { type: string }
        source: { type: string, enum: [gateway, manual] }
        enabled: { type: boolean }
        allowed_roles: { type: array, items: { type: string } }
        usages: { type: array, items: { type: string, enum: [agent, embed, distill, eval] } }
        price_override: { oneOf: [{ $ref: "#/components/schemas/PriceOverride" }, { type: "null" }] }
        max_usd_per_minute: { type: [number, "null"], exclusiveMinimum: 0 }
        gateway: { oneOf: [{ $ref: "#/components/schemas/ModelGatewayFacts" }, { type: "null" }] }
        last_seen_at: { type: [string, "null"], format: date-time }
        missing_since: { type: [string, "null"], format: date-time }
        notes: { type: string }
        updated_by: { type: [string, "null"] }
        updated_at: { type: [string, "null"], format: date-time }
    ModelCatalogueEntryCreate:
      type: object
      required: [model_name]
      properties:
        model_name: { type: string, minLength: 1, maxLength: 200 }
        display_name: { type: [string, "null"], maxLength: 200 }
        enabled: { type: boolean, default: true }
        allowed_roles: { type: array, items: { type: string } }
        usages: { type: array, items: { type: string, enum: [agent, embed, distill, eval] }, default: [agent] }
        price_override: { oneOf: [{ $ref: "#/components/schemas/PriceOverride" }, { type: "null" }] }
        max_usd_per_minute: { type: [number, "null"], exclusiveMinimum: 0 }
        notes: { type: string, default: "" }
    ModelCataloguePatch:
      type: object
      properties:
        display_name: { type: [string, "null"], maxLength: 200 }
        enabled: { type: [boolean, "null"] }
        allowed_roles: { type: [array, "null"], items: { type: string } }
        usages: { type: [array, "null"], items: { type: string, enum: [agent, embed, distill, eval] } }
        price_override: { oneOf: [{ $ref: "#/components/schemas/PriceOverride" }, { type: "null" }] }
        clear_price_override: { type: boolean, default: false }
        max_usd_per_minute: { type: [number, "null"], exclusiveMinimum: 0 }
        clear_max_usd_per_minute: { type: boolean, default: false }
        notes: { type: [string, "null"] }
    ModelTiers:
      type: object
      properties:
        cheap: { type: [string, "null"] }
        standard: { type: [string, "null"] }
        strong: { type: [string, "null"] }
        aux: { type: [string, "null"] }
        embed: { type: [string, "null"] }
        local: { type: [string, "null"] }
    ModelCatalogue:
      type: object
      required: [mode, gateway, tiers, entries]
      properties:
        mode: { type: string, enum: [open, curated] }
        gateway:
          type: object
          required: [type]
          properties:
            type: { type: string }
            capabilities: { type: array, items: { type: string } }
        tiers: { $ref: "#/components/schemas/ModelTiers" }
        entries: { type: array, items: { $ref: "#/components/schemas/ModelCatalogueEntry" } }
    ModelCatalogueSettings:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [open, curated] }
        tiers: { $ref: "#/components/schemas/ModelTiers" }
    ModelCuratePreview:
      type: object
      properties:
        refused:
          type: array
          items:
            type: object
            required: [kind, ref, model]
            properties:
              kind: { type: string, enum: [agent, project_profile] }
              ref: { type: string }
              model: { type: string }
    ModelSyncResult:
      type: object
      required: [added, missing, seen]
      properties:
        added: { type: integer }
        missing: { type: integer }
        seen: { type: integer }
    UsableModel:
      type: object
      required: [model_name, display_name]
      properties:
        model_name: { type: string }
        display_name: { type: string }
        provider: { type: string }
        input_cost_per_1k: { type: [number, "null"] }
        output_cost_per_1k: { type: [number, "null"] }
        priced_by: { type: string, enum: [gateway, override, none], default: none }
        tiers: { type: array, items: { type: string } }
    ProjectModels:
      type: object
      required: [profiles]
      properties:
        profiles:
          type: object
          additionalProperties:
            type: object
            required: [litellm_model]
            properties:
              litellm_model: { type: string }
              params: { type: object, additionalProperties: true }
              max_turns_factor: { type: number, default: 1 }
        allow_unvalidated: { type: boolean, default: false }
        inherited: { type: object, additionalProperties: { type: string } }
    ModelMatrix:
      type: object
      required: [entries]
      properties:
        generated_at: { type: [string, "null"], format: date-time }
        entries:
          type: array
          items:
            type: object
            required: [backend, model, validated]
            properties:
              backend: { type: string }
              model: { type: string }
              validated: { type: boolean }
              success_rate: { type: [number, "null"] }
              median_cost_usd: { type: [number, "null"] }
              median_duration_s: { type: [number, "null"] }
              with_memory: { type: [boolean, "null"] }
              report_url: { type: [string, "null"] }
              context:
                description: The context reduction the cell's runs were given (ADR 0055).
                type: [string, "null"]
                enum: [none, rtk, headroom, rtk+headroom, null]
              metered: { type: [integer, "null"], description: Cases the gateway's ledger has a measure for. }
              median_tokens_in: { type: [number, "null"], description: "Input tokens from the ledger, cache reads included." }
              median_tokens_cached: { type: [number, "null"], description: Cache-read input tokens from the ledger. }
              median_tokens_out: { type: [number, "null"] }
              median_turns: { type: [number, "null"] }
    Org:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }
        role: { oneOf: [{ $ref: "#/components/schemas/Role" }, { type: "null" }] }
        currency: { type: string, enum: [EUR, USD], default: EUR, description: "the currency the console shows spend in (S29-03); an organisation setting" }
        aliases: { type: array, items: { type: string }, default: [], description: "the slugs the organisation had before; they still resolve to it (ADR 0090). The organisation's id never changes, its slug is an address." }
    OrgCreate:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        name: { type: string, minLength: 1, maxLength: 200 }
    OrgUpdate:
      type: object
      description: What changes in an organisation; the slug is in every URL and every MCP address.
      properties:
        slug: { type: [string, "null"], pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        name: { type: [string, "null"], minLength: 1, maxLength: 200 }
        currency: { type: [string, "null"], enum: [EUR, USD, null], description: "the currency spend is shown in; org_admin" }
    WorkItemCreate:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        body: { type: string, default: "" }
        size: { type: [string, "null"], enum: [S, M, L, XL, null] }
        risk: { type: [string, "null"], enum: [low, medium, high, null] }
        start: { type: boolean, default: true }
        workflow: { type: [string, "null"], description: "The workflow the ticket starts in; otherwise the routing, otherwise the default one (ADR 0031)." }
        labels: { type: array, items: { type: string }, description: "Read by the routing rules." }
        fields: { type: object, additionalProperties: true, description: "The ticket's fields, validated by its workflow's `metadata.inputs`." }
        budget_usd: { type: [number, "null"], exclusiveMinimum: 0, description: "The most this work item may spend, in USD. Only tightens the workflow's `budget.ticket_usd` and the policy's ticket budget; wider is 422 (ADR 0047)." }
    WorkItemUpdate:
      type: object
      required: [fields]
      additionalProperties: false
      properties:
        fields: { type: object, additionalProperties: true, description: "The fields that change; `null` removes one." }
    Integrations:
      type: object
      required: [mcp_url, protocol_versions, oauth, version]
      properties:
        mcp_url: { type: string, description: "The MCP door's URL; a project's adds `/projects/{org}:{slug}` to it." }
        protocol_versions: { type: array, items: { type: string } }
        oauth:
          type: object
          required: [enabled]
          properties:
            enabled: { type: boolean, description: "False as long as the door accepts only scoped tokens." }
            authorization_server: { type: [string, "null"] }
            clients:
              type: object
              description: >-
                The clients the IdP registered for the door, by client of the Integrations page
                (`claude-code`, `claude-ai`…): the page derives the exact command from them.
              additionalProperties:
                type: object
                required: [client_id]
                properties:
                  client_id: { type: string }
                  callback_port:
                    type: [integer, "null"]
                    description: "The port of the local redirect `http://localhost:PORT/callback` registered with the IdP."
        version: { type: string }
    ProcedureSummary:
      type: object
      required: [id, title, version, audience, applies_to]
      properties:
        id: { type: string, description: "`connector.documents.sharepoint`, `source.web`, `agent.remote.a2a`, `agent.door.cursor`…" }
        title: { type: string }
        version: { type: integer, description: "+1 on any change of substance" }
        audience: { type: string, enum: [org_admin, project_owner, operator, everyone] }
        applies_to:
          type: object
          description: >-
            One of `connector`, `source`, `agent`, `door_client` (what it is for), plus `card_host`
            or `preset` when it is a preset.
          additionalProperties: { type: string }
        link: { type: [string, "null"], description: "An in-app route that IS the procedure (the MCP-door clients' page)." }
    Procedure:
      allOf:
        - $ref: "#/components/schemas/ProcedureSummary"
        - type: object
          required: [reviewed, sections, values, egress, fields, vendor_docs, origin]
          properties:
            reviewed: { type: string, format: date, description: "The day it was last compared with the vendor's own pages." }
            sections:
              type: array
              items:
                type: object
                required: [key, title, markdown]
                properties:
                  key: { type: string, enum: [before, at, permissions, in_choregos, test, fails, site] }
                  title: { type: string }
                  markdown: { type: string }
            values:
              type: object
              description: The copy boxes with this deployment's URLs, e.g. `webhook_url:jira`.
              additionalProperties: { type: string }
            egress: { type: array, items: { type: string }, description: "Hosts the setup needs to reach." }
            fields:
              type: object
              description: The form fields the procedure talks about, with what to paste in each.
              additionalProperties: { type: string }
            vendor_docs:
              type: array
              description: The only links the sections may carry.
              items:
                type: object
                required: [title, url]
                properties: { title: { type: string }, url: { type: string } }
            origin: { type: string, description: "`shipped`, `extra` or `plugin:<name>`" }
    TokenScope:
      type: string
      enum: ["*", "mcp:read", "mcp:write", "a2a"]
      description: >-
        `*`: the REST API and the CLI. `mcp:read`, `mcp:write`: the MCP door only (ADR 0030) — such
        a token is refused by the REST API, and the door refuses `*`. `a2a`: the A2A door only
        (ADR 0078), which also refuses `*`.
    ApiTokenCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        expires_in_days: { type: [integer, "null"], minimum: 1, maximum: 3650, default: 90 }
        scopes:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/TokenScope" }
          default: ["*"]
        project: { type: [string, "null"], description: "`org:slug`: bounds an MCP token to a single project." }
    ApiToken:
      type: object
      required: [id, name, created_at, scopes]
      properties:
        id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        scopes: { type: array, items: { $ref: "#/components/schemas/TokenScope" } }
        project: { type: [string, "null"], description: "`org:slug` of the linked project, if there is one." }
        last_client: { type: [string, "null"], description: "The client of the last call (`User-Agent`, truncated)." }
    ApiTokenCreated:
      allOf:
        - $ref: "#/components/schemas/ApiToken"
        - type: object
          required: [token]
          properties:
            token: { type: string, description: "The plaintext token, returned only once." }
    WorkflowFailure:
      type: object
      description: Why a ticket's interpreter died. The ticket will not move again without a restart.
      required: [message]
      properties:
        message: { type: string }
        activity: { type: [string, "null"] }
        state: { type: [string, "null"] }
        at: { type: [string, "null"], format: date-time }
    WorkItem:
      type: object
      required: [id, project_slug, tracker_key, title, state, totals]
      properties:
        fields: { type: object, additionalProperties: true, description: "The ticket's fields (ADR 0031)." }
        id: { type: string }
        project_slug: { type: string }
        tracker_key: { type: string }
        title: { type: string }
        body_snapshot: { type: [string, "null"] }
        url: { type: [string, "null"] }
        size: { oneOf: [{ $ref: "#/components/schemas/Size" }, { type: "null" }] }
        risk: { oneOf: [{ $ref: "#/components/schemas/Risk" }, { type: "null" }] }
        state: { type: string }
        state_display: { type: [string, "null"] }
        workflow_name: { type: [string, "null"] }
        workflow_version: { type: [integer, "null"] }
        temporal_wf_id: { type: [string, "null"] }
        workflow_status:
          type: [string, "null"]
          description: The workflow's Temporal status, when requested and known. FAILED, TERMINATED or TIMED_OUT = the ticket is dead.
        failure:
          oneOf: [{ $ref: "#/components/schemas/WorkflowFailure" }, { type: "null" }]
        paused: { type: boolean, default: false }
        current_run: { oneOf: [{ $ref: "#/components/schemas/RunSummary" }, { type: "null" }] }
        pending_request: { oneOf: [{ $ref: "#/components/schemas/HumanRequest" }, { type: "null" }] }
        pr_url: { type: [string, "null"] }
        totals: { $ref: "#/components/schemas/Totals" }
        budget_usd: { type: [number, "null"], description: "The budget given at launch or by the workflow (ADR 0047); the policy's applies otherwise." }
        estimate: { oneOf: [{ $ref: "#/components/schemas/CostEstimate" }, { type: "null" }] }
        created_at: { type: string, format: date-time }
        closed_at: { type: [string, "null"], format: date-time }
    Totals:
      type: object
      properties:
        tokens_in: { type: integer, default: 0 }
        tokens_out: { type: integer, default: 0 }
        tokens_cached: { type: integer, default: 0 }
        cost_usd: { type: number, default: 0 }
        cost_eur: { type: number, default: 0 }
        duration_s: { type: number, default: 0 }
        runs: { type: integer, default: 0 }
        priced_by: { type: [string, "null"], enum: [gateway, override, none, null], description: "how the cost was priced (ADR 0060)" }
        gateway_cost_usd: { type: [number, "null"], description: "the gateway's own figure when an override replaced it" }
        unmeasured: { type: boolean, default: false }
    CostEstimate:
      type: object
      properties:
        median_usd: { type: [number, "null"] }
        p80_usd: { type: [number, "null"] }
        sample_size: { type: integer, default: 0 }
        over_p80: { type: boolean, default: false }
    WorkItemPage:
      type: object
      required: [items, meta]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/WorkItem" } }
        meta: { $ref: "#/components/schemas/PageMeta" }
    HandOff:
      type: object
      description: An output of a step and its receipts, in order (S25-04).
      required: [output, events]
      properties:
        output: { type: string, description: "spec_markdown, plan_markdown, or an output a transition declares" }
        current_digest: { type: [string, "null"], description: "The digest of what the output is worth today; null when it is gone." }
        events: { type: array, items: { $ref: "#/components/schemas/HandOffEvent" } }
    HandOffEvent:
      type: object
      description: A run produced or read an output, under this digest; a receipt never changes.
      required: [kind, digest, run_id, at]
      properties:
        kind: { type: string, enum: [produced, read] }
        digest: { type: string, description: "sha256:<hex> of the value's canonical JSON" }
        run_id: { type: string }
        stage: { type: [string, "null"] }
        attempt: { type: [integer, "null"] }
        at: { type: string, format: date-time }
    TimelineEntry:
      type: object
      required: [ts, kind, title]
      properties:
        ts: { type: string, format: date-time }
        kind: { type: string, enum: [state_change, run, decision, finding, release, comment, error] }
        title: { type: string }
        detail: { type: [string, "null"] }
        actor: { type: [string, "null"] }
        actor_kind: { type: string, enum: [user, agent, system], default: system }
        ref_id: { type: [string, "null"] }
        cost_usd: { type: [number, "null"] }
    GitToken:
      type: object
      required: [token]
      properties:
        token: { type: [string, "null"] }
        expires_at: { type: [string, "null"], format: date-time }
        repository: { type: [string, "null"], description: "`owner/name`: the only repository the token opens." }
    WorkItemJourney:
      type: object
      description: >-
        A work item's path through its workflow (S22-01). `graph` and `process` describe the version
        the item is pinned to, not the project's current one; `moves` and `steps` are in time order.
      required: [work_item_id, state, graph, process, moves, steps]
      properties:
        work_item_id: { type: string }
        tracker_key: { type: [string, "null"] }
        workflow_name: { type: [string, "null"] }
        workflow_version: { type: [integer, "null"] }
        initial: { type: [string, "null"], description: The workflow's initial state. }
        state: { type: string, description: The state the item is in now. }
        closed: { type: boolean, default: false }
        graph: { $ref: "#/components/schemas/WorkflowGraph" }
        process: { type: array, items: { $ref: "#/components/schemas/ProcessStep" } }
        moves: { type: array, items: { $ref: "#/components/schemas/JourneyMove" } }
        steps: { type: array, items: { $ref: "#/components/schemas/JourneyStep" } }
    JourneyMove:
      type: object
      description: >-
        The item left `from` for `to`. `transition_id` and `kind` say which edge of the graph carried
        it — `nominal` (the transition itself), `reject`, `changes_requested`, `retry` (a failure sent
        it back), `escalate`, `default` (from any agent state), `resume`, `start`, `migrated`, or
        `other` when the graph has no such edge. A retry that keeps the item in its state is not a
        move: it shows as a second step on the same transition.
      required: [at, to, kind]
      properties:
        at: { type: string, format: date-time }
        from: { type: [string, "null"] }
        to: { type: string }
        kind: { type: string, enum: [start, nominal, reject, changes_requested, retry, escalate, default, resume, migrated, other] }
        transition_id: { type: [string, "null"] }
        reason: { type: [string, "null"] }
    JourneyStep:
      type: object
      description: >-
        One thing an actor did for the item, on one transition: an agent run, a request to a person,
        or a governed action. `status` is the run's, the request's (`waiting`, `approved`, `rejected`,
        `answered`, `completed`, `scope_change`) or the action's.
      required: [id, kind, status, attempt]
      properties:
        id: { type: string, description: "The run, request or action id: the one its own page reads." }
        kind: { type: string, enum: [agent, human, action] }
        transition_id: { type: [string, "null"] }
        actor: { type: [string, "null"] }
        role: { type: [string, "null"] }
        attempt: { type: integer, minimum: 1 }
        status: { type: string }
        started_at: { type: [string, "null"], format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        summary: { type: [string, "null"] }
        verdict: { type: [string, "null"], description: "The `verdict` output of a review, when the step wrote one." }
        cost_usd: { type: number, default: 0 }
        model: { type: [string, "null"] }
        decided_by: { type: [string, "null"] }
        due_at: { type: [string, "null"], format: date-time }
        evidence: { type: object, additionalProperties: true, description: "The evidence of an agent run (tests, lint, coverage, business facts…): what the platform measured, which `measured` lists, and what the agent declared, which it does not (ADR 0045)." }
    DecisionRequest:
      type: object
      required: [kind]
      properties:
        request_id: { type: [string, "null"] }
        kind: { type: string, enum: [approve, reject, answer, scope_change, complete] }
        answer: { type: [string, "null"] }
        reason: { type: [string, "null"] }
        granted_paths: { type: array, items: { type: string } }
        values: { type: object, additionalProperties: true, description: "`complete`: the values of the task's form, written into the ticket's fields." }
        attested: { type: boolean, default: false, description: "`complete`: the person attests the task's statement." }
    HumanRequest:
      type: object
      required: [id, kind, requested_at]
      properties:
        id: { type: string }
        work_item_id: { type: string }
        transition_id: { type: [string, "null"] }
        kind: { type: string, enum: [approval, question, scope_change, task] }
        payload: { type: object, additionalProperties: true }
        requested_at: { type: string, format: date-time }
        due_at: { type: [string, "null"], format: date-time }
        decided_by: { type: [string, "null"] }
        decided_at: { type: [string, "null"], format: date-time }
        decision: { type: [object, "null"], additionalProperties: true }
    WorkItemAction:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [pause, resume, stop, migrate, rerun_stage, mark_agent_ready] }
        workflow_def_id: { type: [string, "null"] }
        state_mapping: { type: object, additionalProperties: { type: string } }
        run_id: { type: [string, "null"] }
        reason: { type: [string, "null"] }
        top_up_usd:
          type: [number, "null"]
          exclusiveMinimum: 0
          description: >-
            `rerun_stage`: USD granted on top of the work item's budget, recorded in the audit log.
            Required when the budget is spent — otherwise 409 (ADR 0047).
    RunSummary:
      type: object
      required: [id, status, stage_role]
      properties:
        id: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled, timed_out] }
        stage_role: { type: string }
        attempt: { type: integer }
        backend: { type: [string, "null"] }
        model: { type: [string, "null"] }
        cost_usd: { type: number, default: 0 }
        started_at: { type: [string, "null"], format: date-time }
    Run:
      allOf:
        - $ref: "#/components/schemas/RunSummary"
        - type: object
          properties:
            work_item_id: { type: string }
            project_slug: { type: string }
            transition_id: { type: [string, "null"] }
            actor: { type: [string, "null"] }
            executor_kind: { type: [string, "null"] }
            executor_ref: { type: [string, "null"] }
            ended_at: { type: [string, "null"], format: date-time }
            tokens: { $ref: "#/components/schemas/Totals" }
            gateway_key_id: { type: [string, "null"] }
            result: { oneOf: [{ $ref: "./schemas/stage-result.schema.json" }, { type: "null" }] }
            transcript_url: { type: [string, "null"] }
            context_pack_url: { type: [string, "null"] }
            playbook_checksum: { type: [string, "null"] }
            allowed_paths: { type: array, items: { type: string } }
    RunEvent:
      type: object
      required: [seq, type, ts]
      properties:
        seq: { type: integer }
        type: { type: string }
        ts: { type: string, format: date-time }
        payload: { type: object, additionalProperties: true }
    RunEventIn:
      type: object
      required: [seq, type]
      properties:
        seq: { type: integer, minimum: 0 }
        type: { type: string }
        ts: { type: [string, "null"], format: date-time }
        payload: { type: object, additionalProperties: true }
    ArtifactRef:
      type: object
      required: [url]
      properties:
        url: { type: string }
        content_type: { type: string }
        size_bytes: { type: [integer, "null"] }
        inline: { type: [string, "null"] }
    RunLogs:
      type: object
      description: >
        The runner pod's log tail (last 200 lines, each redacted) and its termination. `live` is a
        snapshot the orchestrator refreshes at each poll while the pod runs; `archive` is written
        once when the run ends; `none` when nothing was captured.
      required: [source, state]
      properties:
        source: { type: string, enum: [live, archive, none] }
        state: { type: string }
        exit_code: { type: [integer, "null"] }
        reason: { type: [string, "null"], description: "The runtime's word: OOMKilled, Error, ErrImagePull, ImagePullBackOff…" }
        message: { type: string }
        lines: { type: array, items: { type: string } }
        truncated: { type: boolean }
        error: { type: [string, "null"], description: Why the logs could not be read }
        captured_at: { type: [string, "null"], format: date-time }
    DiffSummary:
      type: object
      required: [files, additions, deletions]
      properties:
        base: { type: [string, "null"] }
        head: { type: [string, "null"] }
        files:
          type: array
          items:
            type: object
            required: [path, status, additions, deletions]
            properties:
              path: { type: string }
              status: { type: string, enum: [added, modified, removed, renamed] }
              additions: { type: integer }
              deletions: { type: integer }
              patch: { type: [string, "null"] }
              in_scope: { type: boolean, default: true }
        additions: { type: integer }
        deletions: { type: integer }
    Release:
      type: object
      required: [id, project_slug, env, batch_no, status, items]
      properties:
        id: { type: string }
        project_slug: { type: string }
        env: { type: string }
        batch_no: { type: integer }
        status:
          type: string
          enum: [collecting, departing, staging, awaiting_approval, promoting, verifying, done, rolled_back, frozen]
        items:
          type: array
          items:
            type: object
            required: [work_item_key, sha]
            properties:
              work_item_key: { type: string }
              title: { type: [string, "null"] }
              sha: { type: string }
              pr_url: { type: [string, "null"] }
              risk: { oneOf: [{ $ref: "#/components/schemas/Risk" }, { type: "null" }] }
              labels: { type: array, items: { type: string } }
        started_at: { type: [string, "null"], format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        approved_by: { type: [string, "null"] }
        verdict: { type: [object, "null"], additionalProperties: true }
        notes: { type: [string, "null"] }
        promotion_url: { type: [string, "null"] }
    ReleasePage:
      type: object
      required: [items, meta]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Release" } }
        meta: { $ref: "#/components/schemas/PageMeta" }
    TrainStatus:
      type: object
      required: [env, status, batch_size, frozen]
      properties:
        env: { type: string }
        status: { type: string }
        batch_size: { type: integer }
        pending_items: { type: array, items: { type: string } }
        next_departure: { type: [string, "null"], format: date-time }
        frozen: { type: boolean }
        freeze_reason: { type: [string, "null"] }
        current_release: { oneOf: [{ $ref: "#/components/schemas/Release" }, { type: "null" }] }
        window_open: { type: boolean, default: true }
    FindingRecord:
      type: object
      required: [id, project_slug, title, type, severity, status]
      properties:
        id: { type: string }
        project_slug: { type: string }
        origin_work_item_key: { type: [string, "null"] }
        origin_run_id: { type: [string, "null"] }
        title: { type: string }
        type: { type: string }
        severity: { type: string, enum: [low, medium, high, critical] }
        evidence: { type: string }
        suggested_fix: { type: [string, "null"] }
        estimate: { type: [string, "null"] }
        status: { type: string, enum: [pending, created, duplicate, dismissed] }
        created_work_item_key: { type: [string, "null"] }
        duplicate_of: { type: [string, "null"] }
        occurrences: { type: integer, default: 1 }
        relevant: { type: [boolean, "null"] }
        created_at: { type: string, format: date-time }
    FindingPage:
      type: object
      required: [items, meta]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/FindingRecord" } }
        meta: { $ref: "#/components/schemas/PageMeta" }
    FindingAction:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [create_ticket, mark_duplicate, dismiss, agent_ready, mark_relevant, mark_false_positive] }
        duplicate_of: { type: [string, "null"] }
        reason: { type: [string, "null"] }
    FindingAck:
      type: object
      required: [accepted]
      properties:
        accepted: { type: boolean }
        finding_id: { type: [string, "null"] }
        remaining: { type: integer, default: 0 }
    ScopeChangeDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [granted, pending, denied] }
        allowed_paths: { type: array, items: { type: string } }
        reason: { type: [string, "null"] }
    Memory:
      type: object
      required: [kind, subject, content]
      properties:
        id: { type: string }
        kind: { type: string }
        subject: { type: string }
        content: { type: string }
        score: { type: [number, "null"] }
        status: { type: string, enum: [active, pending, superseded, rejected], default: active }
        valid_from: { type: [string, "null"], format: date-time }
        valid_to: { type: [string, "null"], format: date-time }
        provenance: { type: object, additionalProperties: true }
        proposed_by: { type: [string, "null"] }
    MemoryDecision:
      type: object
      required: [id, action]
      properties:
        id: { type: string }
        action: { type: string, enum: [accept, reject] }
        reason: { type: [string, "null"] }
    EgressRule:
      type: object
      required: [id, host, ports, used_by, status]
      properties:
        id: { type: string }
        host: { type: string, description: "exact, or `*.` as the leftmost label only; lowercased, IDNA-encoded" }
        ports: { type: array, items: { type: integer } }
        used_by: { type: array, items: { type: string, enum: [api, workers, runners] }, description: the pod families that make the call }
        status: { type: string, enum: [requested, allowed, refused, revoked] }
        reason: { type: string, maxLength: 500 }
        origin: { type: string, description: "`mcp-catalogue:<id>@<version>`, `org-connector:<name>`, `skill-import:<repo>`, `knowledge-source:<name>`, `manual`, `migration`" }
        requested_by: { type: [string, "null"] }
        requested_at: { type: [string, "null"], format: date-time }
        decided_by: { type: [string, "null"] }
        decided_at: { type: [string, "null"], format: date-time }
        decision_note: { type: [string, "null"] }
    EgressTarget:
      type: object
      description: A host to check — a `url` (its host and port are read) or a `host` and `port`.
      properties:
        url: { type: [string, "null"], maxLength: 2000 }
        host: { type: [string, "null"], maxLength: 255 }
        port: { type: [integer, "null"], minimum: 1, maximum: 65535 }
        used_by: { type: array, minItems: 1, items: { type: string, enum: [api, workers, runners] }, default: [api] }
    EgressOrigin:
      type: object
      required: [kind]
      description: What the server derives the hosts from.
      properties:
        kind: { type: string, enum: [org-connector, skill-import, knowledge-source, mcp-catalogue, remote-agent] }
        type: { type: [string, "null"], description: "`org-connector`: the connector type; `knowledge-source`: the source kind" }
        config: { type: object, additionalProperties: true }
        repo_url: { type: [string, "null"] }
        name: { type: [string, "null"] }
    EgressCheck:
      type: object
      properties:
        targets: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/EgressTarget" } }
        origin: { oneOf: [{ $ref: "#/components/schemas/EgressOrigin" }, { type: "null" }] }
        reason: { type: string, maxLength: 500 }
    Approver:
      type: object
      required: [display_name, email]
      properties:
        display_name: { type: string }
        email: { type: string }
    PlatformChange:
      type: object
      required: [needed]
      description: "What the platform must still do: Choregos cannot change the cluster's network policy, it only shows the change."
      properties:
        needed: { type: boolean }
        format: { type: string, enum: [cilium-fqdn, kubernetes-networkpolicy, text] }
        snippet: { type: [string, "null"] }
        issue_url: { type: [string, "null"], description: a prefilled issue on the platform's repository, when the deployment configures one }
        owner: { type: [string, "null"], description: "who applies it, for example `the platform team`" }
    EgressVerdict:
      type: object
      required: [host, port, used_by, org, ceiling, can_allow, platform_change]
      properties:
        host: { type: string }
        port: { type: integer }
        used_by: { type: string, enum: [api, workers, runners] }
        org: { type: string, enum: [allowed, requested, absent], description: this organisation's list }
        ceiling: { type: string, enum: [open, outside, unknown], description: the platform's network as the deployment declares it }
        can_allow: { type: boolean, description: whether the caller holds `tools:grant` }
        approvers: { type: array, items: { $ref: "#/components/schemas/Approver" } }
        platform_change: { $ref: "#/components/schemas/PlatformChange" }
        requested_by: { type: [string, "null"] }
        requested_at: { type: [string, "null"], format: date-time }
    EgressCheckResult:
      type: object
      required: [verdicts, ok]
      properties:
        verdicts: { type: array, items: { $ref: "#/components/schemas/EgressVerdict" } }
        ok: { type: boolean }
    EgressRequired:
      type: object
      description: "The 409 body of every governed \"add\" while a host is missing: an RFC 9457 problem with `code` and `verdicts`."
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string, enum: [egress_required] }
        verdicts: { type: array, items: { $ref: "#/components/schemas/EgressVerdict" } }
    EgressRuleCreate:
      type: object
      required: [host]
      properties:
        host: { type: string, minLength: 1, maxLength: 255 }
        ports: { type: array, minItems: 1, maxItems: 10, items: { type: integer }, default: [443] }
        used_by: { type: array, minItems: 1, items: { type: string, enum: [api, workers, runners] }, default: [api] }
        reason: { type: string, maxLength: 500 }
        origin: { type: string, maxLength: 200, default: manual }
    EgressRequestCreate:
      allOf: [{ $ref: "#/components/schemas/EgressRuleCreate" }]
    EgressDecision:
      type: object
      properties:
        note: { type: [string, "null"], maxLength: 500 }
    EgressOverview:
      type: object
      required: [mode, ceiling, rules, requests]
      properties:
        mode: { type: string, enum: [enforce, warn, "off"] }
        ceiling: { type: object, additionalProperties: { type: array, items: { type: string } }, description: "family -> host patterns the deployment declares open; an absent family is unknown" }
        rules: { type: array, items: { $ref: "#/components/schemas/EgressRule" } }
        requests: { type: array, items: { $ref: "#/components/schemas/EgressRule" } }
        can_decide: { type: boolean }
    BudgetAlert:
      type: object
      required: [id, scope, subject, period, period_key, threshold, spent_usd, budget_usd, status]
      properties:
        id: { type: string }
        scope: { type: string, enum: [project, agent] }
        subject: { type: string, description: the project's or the agent's slug }
        period: { type: string, description: day }
        period_key: { type: string, description: the day, YYYY-MM-DD }
        threshold: { type: integer, description: "the share of the budget crossed, in percent" }
        spent_usd: { type: number }
        budget_usd: { type: number }
        status: { type: string, enum: [open, acknowledged] }
        created_at: { type: [string, "null"], format: date-time }
        acknowledged_by: { type: [string, "null"] }
        acknowledged_at: { type: [string, "null"], format: date-time }
        can_acknowledge:
          type: boolean
          default: false
          description: "whether the person reading may acknowledge it: a project owner or above, on the alert's project for a project alert, on the organisation for an agent alert"
    CostReport:
      type: object
      required: [group_by, rows, total]
      properties:
        group_by: { type: string }
        currency: { type: string, default: EUR }
        rows:
          type: array
          items:
            type: object
            required: [key, cost_usd, cost_eur]
            properties:
              key: { type: string }
              cost_usd: { type: number }
              cost_eur: { type: number }
              tokens_in: { type: integer, default: 0 }
              tokens_out: { type: integer, default: 0 }
              tokens_cached: { type: integer, default: 0 }
              runs: { type: integer, default: 0 }
        total:
          type: object
          properties:
            cost_usd: { type: number }
            cost_eur: { type: number }
            budget_usd: { type: [number, "null"] }
    MemoryAbGroup:
      type: object
      properties:
        projects: { type: array, items: { type: string } }
        tickets: { type: integer, default: 0 }
        first_pass_merge_rate: { type: number, nullable: true }
        cost_per_ticket_usd: { type: number, nullable: true }
    MemoryAbReport:
      type: object
      required: [org, verdict]
      properties:
        org: { type: string }
        weeks: { type: integer, default: 4 }
        since: { type: string, format: date-time, nullable: true }
        with_memory: { $ref: "#/components/schemas/MemoryAbGroup" }
        without_memory: { $ref: "#/components/schemas/MemoryAbGroup" }
        verdict: { type: string }
        detail: { type: string, default: "" }
    CrossBackendArm:
      type: object
      properties:
        reviews: { type: integer, default: 0 }
        caught: { type: integer, default: 0 }
        catch_rate: { type: number, nullable: true }
        backends: { type: array, items: { type: string } }
    CrossBackendReport:
      type: object
      required: [since, verdict]
      properties:
        since: { type: string, format: date-time }
        cross_backend_required: { type: boolean, default: false }
        same_backend: { $ref: "#/components/schemas/CrossBackendArm" }
        other_backend: { $ref: "#/components/schemas/CrossBackendArm" }
        verdict: { type: string }
        detail: { type: string, default: "" }
    DoraMetric:
      type: object
      required: [unit]
      properties:
        value: { type: number, nullable: true }
        unit: { type: string }
        level: { type: string, enum: [elite, high, medium, low, unknown], default: unknown }
        sample: { type: integer, default: 0 }
    DoraReport:
      type: object
      required: [since, until, deployment_frequency, lead_time, change_failure_rate, time_to_restore]
      properties:
        env: { type: string, default: prod }
        since: { type: string, format: date-time }
        until: { type: string, format: date-time }
        deployments: { type: integer, default: 0 }
        deployment_frequency: { $ref: "#/components/schemas/DoraMetric" }
        lead_time: { $ref: "#/components/schemas/DoraMetric" }
        change_failure_rate: { $ref: "#/components/schemas/DoraMetric" }
        time_to_restore: { $ref: "#/components/schemas/DoraMetric" }
    TemplateSummary:
      type: object
      required: [name, version, display, is_published]
      properties:
        name: { type: string }
        version: { type: string }
        display: { type: string }
        description: { type: [string, "null"] }
        repo_url: { type: [string, "null"] }
        is_published: { type: boolean }
    TemplateDetail:
      allOf:
        - $ref: "#/components/schemas/TemplateSummary"
        - type: object
          required: [manifest]
          properties:
            manifest: { $ref: "./schemas/template.schema.json" }
    TemplateUpsert:
      type: object
      required: [manifest]
      properties:
        manifest: { $ref: "./schemas/template.schema.json" }
        repo_url: { type: [string, "null"] }
        is_published: { type: boolean, default: false }
    AgentBackendInfo:
      type: object
      required: [name, enabled, capabilities]
      properties:
        name: { type: string }
        enabled: { type: boolean }
        version: { type: [string, "null"] }
        capabilities: { type: array, items: { type: string } }
        conformance:
          type: object
          properties:
            last_run_at: { type: [string, "null"], format: date-time }
            passed: { type: [integer, "null"] }
            total: { type: [integer, "null"] }
            report_url: { type: [string, "null"] }
            failures: { type: array, items: { type: string } }
        disabled_reason: { type: [string, "null"] }
    AgentBackendUpdate:
      type: object
      required: [name, enabled]
      properties:
        name: { type: string }
        enabled: { type: boolean }
        disabled_reason: { type: [string, "null"] }
    PlatformIdentityRow:
      type: object
      required: [key, label, value, source]
      properties:
        key: { type: string, description: "Stable identifier, e.g. oidc.issuer." }
        label: { type: string }
        value: { type: string, description: "Display value; a secret shows only set or missing." }
        source:
          type: string
          enum: [settings, derived, default]
          description: "settings: set by the deployment; derived: computed from other settings; default: the built-in default."
    PlatformIdentity:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PlatformIdentityRow" } }
    ExecutorInfo:
      type: object
      required: [kind, enabled]
      properties:
        kind: { type: string, enum: [tekton, k8s_job, local_docker, aca, agent_sandbox] }
        enabled: { type: boolean }
        cluster: { type: [string, "null"] }
        namespace_pattern: { type: [string, "null"] }
        runner_image: { type: [string, "null"] }
        default_timeout_minutes: { type: integer, default: 120 }
    GatewayKeyInfo:
      type: object
      required: [key_id, created_at]
      properties:
        key_id: { type: string }
        run_id: { type: [string, "null"] }
        project_slug: { type: [string, "null"] }
        budget_usd: { type: [number, "null"] }
        spend_usd: { type: number, default: 0 }
        expires_at: { type: [string, "null"], format: date-time }
        revoked: { type: boolean, default: false }
        created_at: { type: string, format: date-time }
    AuditEntry:
      type: object
      required: [id, actor_kind, action, ts]
      properties:
        id: { type: string }
        actor_id: { type: [string, "null"] }
        actor_kind: { type: string, enum: [user, agent, system] }
        action: { type: string }
        target_type: { type: [string, "null"] }
        target_id: { type: [string, "null"] }
        payload: { type: object, additionalProperties: true }
        ts: { type: string, format: date-time }
    AuditPage:
      type: object
      required: [items, meta]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
        meta: { $ref: "#/components/schemas/PageMeta" }
    WebhookAck:
      type: object
      required: [accepted]
      properties:
        accepted: { type: boolean }
        duplicate: { type: boolean, default: false }
        events: { type: integer, default: 0 }
    RunTicket:
      type: object
      required: [key, title]
      properties:
        key: { type: string }
        title: { type: string }
        body: { type: string }
        fields: { type: object, additionalProperties: true, description: "The ticket's fields (ADR 0031)." }
        url: { type: [string, "null"] }
        spec_markdown: { type: [string, "null"] }
        plan_markdown: { type: [string, "null"] }
        comments:
          type: array
          items:
            type: object
            properties:
              author: { type: string }
              body: { type: string }
              ts: { type: string, format: date-time }
    StageInput: { $ref: "./schemas/stage-input.schema.json" }
    StageResult: { $ref: "./schemas/stage-result.schema.json" }
    Artifact: { $ref: "./schemas/artifact.schema.json" }
    RunInputFile:
      type: object
      description: A declared input of a run, as the runner mounts it in `.choregos/inputs/` (ADR 0049).
      required: [name, version, filename, type, media_type, digest, size]
      properties:
        name: { type: string }
        version: { type: integer }
        filename: { type: string, description: "The name with its type's extension: `deck.pptx`." }
        type: { type: string }
        media_type: { type: string }
        digest: { type: string, description: "sha256 of the bytes" }
        size: { type: integer }
    ContextPack: { $ref: "./schemas/context-pack.schema.json" }
    Finding: { $ref: "./schemas/finding.schema.json" }
    InboundEvent: { $ref: "./schemas/inbound-event.schema.json" }
    ChoregosEvent: { $ref: "./schemas/event.schema.json" }
    HumanDecision: { $ref: "./schemas/human-decision.schema.json" }
