[project]
name = "choregos-agent-example-langgraph"
version = "0.19.1"
description = "Example: the ticket triager as a LangGraph graph on the choregos-agent-sdk"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
# Not a member of the repository's workspace: LangGraph and LangChain are heavy and must not enter
# its lock file. This example is built and checked by its own (manual) workflow.
dependencies = [
  "choregos-agent-sdk",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_triager"]
