# Trivy's secret scanner, for the images CI scans (`.github/workflows/ci.yml`, step "Trivy scan").
#
# One exception, and only for files: the Anthropic SDK that SkillSpector pulls in (ADR 0095) documents
# `{"type": "service_account"}` in its docstrings, which the `gcp-service-account` rule reads as a key.
# The exception covers that SDK inside the scanner's own interpreter and nothing else: a real key
# anywhere else in an image, including elsewhere under /opt/skillspector, still fails the build.
allow-rules:
  - id: skillspector-anthropic-sdk
    description: Anthropic SDK docstrings in SkillSpector's interpreter (no key, a parameter's example)
    path: ^/?opt/skillspector/lib/python3\.[0-9]+/site-packages/anthropic/
