[project]
name = "choregos-quant"
version = "0.27.16"
description = "Deprecated name of tranibor-quant: an empty wheel that depends on it and ships the `choregos_quant` import alias (ADR 0176, R2)"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = ["tranibor-quant==0.27.16", "tranibor-contracts==0.27.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/choregos_quant"]
