{{- if .Values.enabled }}
{{- $root := . }}
{{- range .Values.queues }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: choregos-orchestrator-{{ .name }}
  labels: {{- include "choregos.labels" $root | nindent 4 }}
    app.kubernetes.io/component: orchestrator
    choregos/queue: {{ .name }}
spec:
  replicas: {{ .replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: choregos-orchestrator
      choregos/queue: {{ .name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: choregos-orchestrator
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        choregos/queue: {{ .name }}
    spec:
      serviceAccountName: choregos-orchestrator
      {{- include "choregos.imagePullSecrets" $ | nindent 6 }}
      {{- include "choregos.antiAffinity" (dict "global" $root.Values.global "labels" (dict "app.kubernetes.io/name" "choregos-orchestrator" "choregos/queue" .name)) | nindent 6 }}
      # A node that disappears (spot eviction, hardware failure) is only noticed after about
      # fifty seconds, and Kubernetes' default then leaves the pod **five minutes**
      # stuck to that dead node before evicting it. Measured on a cluster: 359 s of immobility with
      # the defaults, 74 s with these tolerations (`tests/cluster/test_node_loss.py`).
      #
      # A worker is replaceable and its work is picked up by Temporal: nothing justifies
      # waiting five minutes for it. Adjustable through `choregos-orchestrator.unreachableTolerationSeconds`; setting
      # `0` restores Kubernetes' default behavior.
      {{- if gt (int $root.Values.unreachableTolerationSeconds) 0 }}
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: {{ $root.Values.unreachableTolerationSeconds }}
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: {{ $root.Values.unreachableTolerationSeconds }}
      {{- end }}
      securityContext: {{- toYaml $root.Values.global.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "choregos.image" (dict "global" $root.Values.global "image" $root.Values.image) }}
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          securityContext: {{- toYaml $root.Values.global.securityContext | nindent 12 }}
          # The ENTIRE command, not only its arguments: the image's entry point
          # is `tini`, and its `CMD` already carries `python -m …`. Sending only `--queues x`
          # replaced that CMD, and tini tried to execute "--queues" — "exec --queues
          # failed: No such file or directory", a message that does not blame the chart.
          command: ["python", "-m", "choregos_orchestrator.worker"]
          args: ["--queues", {{ .name | quote }}]
          env:
            {{- include "choregos.commonEnv" $root | nindent 12 }}
            - name: CHOREGOS_RUNNER_IMAGE
              # The runner tag follows the deployment's when it is not pinned: pinned,
              # it pointed at `1.0.0` in a 0.1.0 installation — a missing image, and an
              # agent pod in ErrImagePull that nothing else explains.
              value: {{ $root.Values.global.imageRegistry }}/{{ $root.Values.runner.image }}:{{ $root.Values.runner.tag | default $root.Values.global.imageTag }}
            - name: CHOREGOS_RUNNER_NAMESPACE_PATTERN
              value: {{ $root.Values.runner.namespacePattern | quote }}
            - name: CHOREGOS_EXECUTOR_KIND
              value: {{ $root.Values.runner.executor | quote }}
            {{- with $root.Values.global.playbooks.configMap }}
            - name: CHOREGOS_PLAYBOOKS_DIR
              value: {{ $root.Values.global.playbooks.mountPath | quote }}
            {{- end }}
            {{- with $root.Values.global.workflowTemplates.configMap }}
            - name: CHOREGOS_WORKFLOW_TEMPLATES_DIR
              value: {{ $root.Values.global.workflowTemplates.mountPath | quote }}
            {{- end }}
            # The key that SIGNS the run tokens. The orchestrator issues, the API verifies:
            # without this variable it signed with an ephemeral pair, and the agent received
            # "Signature verification failed" — a message that blames the token.
            - name: CHOREGOS_RUN_TOKEN_PRIVATE_KEY
              valueFrom:
                secretKeyRef: { name: {{ $root.Values.global.apiSecretRef }}, key: run-token-private-key }
            # The GitHub App: the tracker reads `agent-ready` issues, the executor opens and merges
            # PRs. Only the API received it: the catch-up failed with "no authentication
            # configured" on a tenant that did have its App (S22-04). Optional, as
            # in the API: a tenant without GitHub has none.
            - name: CHOREGOS_GITHUB_APP_ID
              valueFrom: { secretKeyRef: { name: {{ $root.Values.global.apiSecretRef }}, key: github-app-id, optional: true } }
            - name: CHOREGOS_GITHUB_APP_PRIVATE_KEY
              valueFrom: { secretKeyRef: { name: {{ $root.Values.global.apiSecretRef }}, key: github-app-private-key, optional: true } }
            # The key that seals the connector secrets typed in the console (ADR 0058). Optional: a
            # deployment without it keeps `env:` references and answers 409 when a value is typed.
            - name: CHOREGOS_SECRETS_KEKS
              valueFrom: { secretKeyRef: { name: {{ $root.Values.global.secrets.keksSecretRef | default $root.Values.global.apiSecretRef }}, key: {{ $root.Values.global.secrets.keksKey | default "secrets-keks" }}, optional: true } }
            # The API's internal service: this is what agents call back, never
            # the public URL, which a pod cannot resolve.
            - name: CHOREGOS_INTERNAL_API_URL
              value: {{ $root.Values.global.internalApiUrl | default "http://choregos-api:8000" | quote }}
            - name: CHOREGOS_RUNNER_ENV
              value: {{ toJson $root.Values.runner.env | quote }}
            - name: CHOREGOS_RUNNER_ENV_SECRETS
              value: {{ join "," $root.Values.runner.envFromSecrets | quote }}
            - name: CHOREGOS_RUNNER_CPU_LIMIT
              value: {{ $root.Values.runner.limits.cpu | quote }}
            - name: CHOREGOS_RUNNER_MEMORY_LIMIT
              value: {{ $root.Values.runner.limits.memory | quote }}
            # Simultaneous runs in the namespace. Beyond that, the Job is created SUSPENDED: it
            # has no pod, does not pull the image and takes no room in the quota.
            # 0 = no ceiling, the previous behavior.
            - name: CHOREGOS_RUNNER_MAX_ACTIVE
              value: {{ $root.Values.runner.maxActive | default 0 | quote }}
            # The proxy through which an agent pod gets out: the one the provisioning deploys
            # in the runners namespace, with the allowlist of the project's policy.
            # Empty on a bench whose namespace has neither NetworkPolicy nor proxy.
            - name: CHOREGOS_RUNNER_EGRESS_PROXY
              value: {{ $root.Values.runner.egressProxy | default "" | quote }}
            - name: CHOREGOS_EGRESS_IMAGE
              value: {{ $root.Values.runner.egressImage | default "" | quote }}
            # The RuntimeClass of agent pods when the policy imposes none: a
            # cluster that has gVisor or Kata says so here once. Empty: the cluster's.
            - name: CHOREGOS_RUNNER_RUNTIME_CLASS
              value: {{ $root.Values.runner.runtimeClass | default "" | quote }}
            {{- with $root.Values.global.images }}
            # The images an operator names for job steps and agents written in code (ADR 0056,
            # ADR 0063): name -> reference. The API validates a version against the names, the
            # orchestrator resolves them; a workflow or an agent never writes a reference.
            {{- with .jobs }}
            - name: CHOREGOS_JOB_IMAGES
              value: {{ toJson . | quote }}
            {{- end }}
            {{- with .agents }}
            - name: CHOREGOS_AGENT_IMAGES
              value: {{ toJson . | quote }}
            {{- end }}
            - name: CHOREGOS_REQUIRE_IMAGE_DIGEST
              value: {{ .requireDigest | default false | quote }}
            {{- end }}
            {{- if eq $root.Values.runner.executor "agent_sandbox" }}
            # The warm pool the `agent_sandbox` executor claims from, and the port its warm
            # runners listen on for their one assignment (sandbox.yaml renders both).
            - name: CHOREGOS_SANDBOX_WARM_POOL
              value: "choregos-runner"
            - name: CHOREGOS_SANDBOX_ASSIGNMENT_PORT
              value: {{ (($root.Values.runner.sandbox | default dict).assignmentPort | default 8765) | quote }}
            {{- end }}
            # The kill switch for context reduction (ADR 0055): "off" refuses rtk and headroom
            # to every run, whatever a project's policy asks.
            - name: CHOREGOS_CONTEXT_REDUCTION
              value: {{ ternary "on" "off" (ne $root.Values.runner.contextReduction.enabled false) | quote }}
            - name: CHOREGOS_GATEWAY_MASTER_KEY
              valueFrom: { secretKeyRef: { name: {{ include "choregos.gatewaySecret" $root }}, key: master-key } }
          resources: {{- toYaml .resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- with $root.Values.global.playbooks.configMap }}
            - { name: playbooks, mountPath: {{ $root.Values.global.playbooks.mountPath }}, readOnly: true }
            {{- end }}
            {{- with $root.Values.global.workflowTemplates.configMap }}
            - { name: workflow-templates, mountPath: {{ $root.Values.global.workflowTemplates.mountPath }}, readOnly: true }
            {{- end }}
      volumes:
        - { name: tmp, emptyDir: {} }
        {{- with $root.Values.global.playbooks.configMap }}
        - name: playbooks
          configMap: { name: {{ . }} }
        {{- end }}
        {{- with $root.Values.global.workflowTemplates.configMap }}
        - name: workflow-templates
          configMap: { name: {{ . }} }
        {{- end }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: choregos-orchestrator
  labels: {{- include "choregos.labels" . | nindent 4 }}
  annotations: {{- toYaml .Values.global.serviceAccount.annotations | nindent 4 }}
{{- if has .Values.runner.executor (list "k8s_job" "agent_sandbox") }}
---
# Same account for `agent_sandbox`: the SandboxTemplate names it, with no token mounted.
# The `k8s_job` executor launches runners in THIS namespace under this account: without it,
# pod creation fails. No rights, no token mounted — an agent has nothing to
# ask of the Kubernetes API. (With Tekton, the provisioning creates it per project.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: choregos-runner
  labels: {{- include "choregos.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
