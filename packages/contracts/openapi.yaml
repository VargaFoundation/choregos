openapi: 3.1.0
info:
  title: Choregos API
  version: 0.17.12
  description: |
    The Choregos platform API. The console and the CLI use this API and nothing else.
    Auth: an OIDC session (cookie) or `Authorization: Bearer <api_token>`.
    The `/internal/*` routes are reserved for runners and authenticated by a run JWT (ES256).
    Errors: RFC 9457 (`application/problem+json`). Cursor pagination (`cursor`, `limit`).
  license: { name: Apache-2.0, url: https://www.apache.org/licenses/LICENSE-2.0 }
servers:
  - url: /api/v1
    description: API base
security:
  - session: []
  - bearer: []
tags:
  - { name: session }
  - { name: projects }
  - { name: connectors }
  - { name: workflows }
  - { name: models }
  - { name: work-items }
  - { name: runs }
  - { name: trains }
  - { name: findings }
  - { name: memory }
  - { name: costs }
  - { name: templates }
  - { name: admin }
  - { name: agents }
  - { name: ui }
  - { name: webhooks }
  - { name: internal }
paths:
  /me:
    get:
      tags: [session]
      operationId: getMe
      summary: The current user, their organisations and roles
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/tokens:
    get:
      tags: [session]
      operationId: listMyTokens
      summary: The caller's API tokens (never their value)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ApiToken" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [session]
      operationId: createMyToken
      summary: Issue a bearer token; its plaintext is returned only once
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ApiTokenCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ApiTokenCreated" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /me/tokens/{id}:
    delete:
      tags: [session]
      operationId: revokeMyToken
      summary: Revoke one of the caller's tokens
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /auth/login:
    get:
      tags: [session]
      operationId: authLogin
      security: []
      summary: Redirect to the OIDC IdP
      parameters:
        - { name: redirect_to, in: query, schema: { type: string } }
      responses:
        "307": { description: Redirect to the IdP }
  /auth/callback:
    get:
      tags: [session]
      operationId: authCallback
      security: []
      summary: OIDC callback (code → session)
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        "307": { description: Redirect to the application }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/logout:
    post:
      tags: [session]
      operationId: authLogout
      responses: { "204": { description: Session closed } }
  /orgs:
    get:
      tags: [projects]
      operationId: listOrgs
      summary: The caller's organisations, with their role
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Org" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [projects]
      operationId: createOrg
      summary: Create an organisation; the caller becomes its administrator
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OrgCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Org" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /orgs/{org}:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    patch:
      tags: [projects]
      operationId: updateOrg
      summary: Rename an organisation — its name by its administrator, its slug by the platform administrator
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OrgUpdate" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Org" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/projects:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [projects]
      operationId: listProjects
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectPage" } } } }
    post:
      tags: [projects]
      operationId: createProject
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /projects/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [projects]
      operationId: getProject
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [projects]
      operationId: updateProject
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectUpdate" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [projects]
      operationId: deleteProject
      responses: { "204": { description: Archived }, "409": { $ref: "#/components/responses/Conflict" } }
  /projects/{id}/provision:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [projects]
      operationId: provisionProject
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/ProvisionRequest" } } }
      responses:
        "202": { description: Provisioning started, content: { application/json: { schema: { $ref: "#/components/schemas/ProvisionStatus" } } } }
    get:
      tags: [projects]
      operationId: getProvisionStatus
      summary: Provisioning status (SSE when Accept is text/event-stream)
      responses:
        "200":
          description: OK
          content:
            application/json: { schema: { $ref: "#/components/schemas/ProvisionStatus" } }
            text/event-stream: { schema: { type: string } }
  /projects/{id}/suspend:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [projects]
      operationId: suspendProject
      responses: { "200": { description: Suspended, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } } }
  /projects/{id}/connectors:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [connectors]
      operationId: listConnectors
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Connector" } } } } }
  /projects/{id}/connectors/{kind}:
    parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/ConnectorKind" }]
    put:
      tags: [connectors]
      operationId: putConnector
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ConnectorUpsert" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Connector" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /projects/{id}/connectors/{kind}/test:
    parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/ConnectorKind" }]
    post:
      tags: [connectors]
      operationId: testConnector
      responses:
        "200": { description: Test result, content: { application/json: { schema: { $ref: "#/components/schemas/ConnectorTestResult" } } } }
  /connectors/types:
    get:
      tags: [connectors]
      operationId: listConnectorTypes
      description: The types the registry knows — the core's and the plugins' — with their capabilities, their configuration schema and their secret fields (ADR 0034).
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ConnectorType" } } } } }
  /projects/{id}/requirements:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [connectors]
      operationId: listProjectRequirements
      description: What the project's active workflows require of its connectors, and why; the connector that covers each capability, otherwise the platform's default type (ADR 0034).
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProjectRequirement" } } } } }
  /orgs/{org}/connectors:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [connectors]
      operationId: listOrgConnectors
      description: The organisation's connectors and their operations (ADR 0034); its members can read them.
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/OrgConnector" } } } } }
    post:
      tags: [connectors]
      operationId: createOrgConnector
      description: An instance starts with the operations its type declares — a read allowed, a write subject to approval. The organisation's administrator only.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OrgConnectorCreate" } } }
      responses:
        "201": { description: Declared, content: { application/json: { schema: { $ref: "#/components/schemas/OrgConnector" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/connectors/{name}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [connectors]
      operationId: getOrgConnector
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/OrgConnector" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [connectors]
      operationId: deleteOrgConnector
      responses:
        "204": { description: "Removed, with its operations" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /orgs/{org}/connectors/{name}/discover:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: name, in: path, required: true, schema: { type: string } }
    post:
      tags: [connectors]
      operationId: discoverConnectorOperations
      description: Ask the MCP server for its tools and derive the diff — a new tool starts closed (forbidden), a drifting schema closes the operation again, a removed tool disappears (ADR 0034).
      responses:
        "200": { description: The diff, content: { application/json: { schema: { $ref: "#/components/schemas/ConnectorDiscovery" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502": { description: "The server did not answer, or refused the connector's key" }
  /orgs/{org}/connectors/{name}/operations/{operation}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: name, in: path, required: true, schema: { type: string } }
      - { name: operation, in: path, required: true, schema: { type: string } }
    patch:
      tags: [connectors]
      operationId: updateConnectorOperation
      description: An operation's policy, project groups and price — the decision of the organisation's administrator (the second lock of ADR 0014).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OperationPatch" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ConnectorOperation" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/operations:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [connectors]
      operationId: listProjectOperations
      description: The operations open to the project (their groups intersect its own), with the organisation's policy, the project's and the effective one.
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProjectOperation" } } } } }
  /projects/{id}/operations/{connector}/{operation}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: connector, in: path, required: true, schema: { type: string } }
      - { name: operation, in: path, required: true, schema: { type: string } }
    put:
      tags: [connectors]
      operationId: tightenProjectOperation
      description: A project tightens an operation; it never widens it (422).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectOperationPut" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectOperation" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [connectors]
      operationId: relaxProjectOperation
      description: Remove what the project tightened; the operation falls back to the organisation's policy.
      responses:
        "204": { description: Removed }
  /projects/{id}/actions:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [actions]
      operationId: listActions
      parameters:
        - { name: status, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: The project's actions and the log of their effects, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Action" } } } } }
    post:
      tags: [actions]
      operationId: proposeAction
      description: A governed action awaiting a decision (ADR 0035). Its effects must be declared (`declarer_un_effet`); nothing runs before the approval.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ActionCreate" } } }
      responses:
        "201": { description: Proposed, content: { application/json: { schema: { $ref: "#/components/schemas/Action" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/actions:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [actions]
      operationId: listOrgActions
      description: The decision inbox — the actions of the organisation's projects that the caller can see; `status=pending_approval` for what is waiting for someone.
      parameters:
        - { name: status, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Action" } } } } }
  /projects/{id}/actions/{action_id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: action_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [actions]
      operationId: getAction
      responses:
        "200": { description: The action and its log, content: { application/json: { schema: { $ref: "#/components/schemas/Action" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/actions/{action_id}/decision:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: action_id, in: path, required: true, schema: { type: string } }
    post:
      tags: [actions]
      operationId: decideAction
      description: Approve (a recent human session — 401 `step_up_required` otherwise) or reject (with a reason). Whoever proposes does not decide; of two simultaneous approvals only one starts `action-<id>` in Temporal, and nothing runs within this request.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ActionDecision" } } }
      responses:
        "200": { description: Decided, content: { application/json: { schema: { $ref: "#/components/schemas/Action" } } } }
        "401": { description: "Authentication too old: `errors[0].error` is `step_up_required`" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /projects/{id}/workflow:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [workflows]
      operationId: getWorkflow
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowDef" } } } }
    put:
      tags: [workflows]
      operationId: putWorkflow
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowPut" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowDef" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /projects/{id}/workflows:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [workflows]
      operationId: listWorkflows
      summary: The project's workflows — one active per name, the default one marked (ADR 0031)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/WorkflowSummary" } } } } }
  /projects/{id}/workflows/{name}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [workflows]
      operationId: getNamedWorkflow
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowDef" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [workflows]
      operationId: putNamedWorkflow
      summary: Publish the next version of THIS workflow; a stale `base_version`, or `create_only` on an existing name → 409
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowPut" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowDef" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /projects/{id}/workflows/{name}/deactivate:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: name, in: path, required: true, schema: { type: string } }
    post:
      tags: [workflows]
      operationId: deactivateWorkflow
      summary: Deactivate a workflow; refused for the default one or a routing target. Pinned tickets finish on their version
      responses:
        "204": { description: Deactivated }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{id}/workflows/{name}/versions:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [workflows]
      operationId: listWorkflowVersions
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/WorkflowDef" } } } } }
  /projects/{id}/workflows/{name}/versions/{version}/restore:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: name, in: path, required: true, schema: { type: string } }
      - { name: version, in: path, required: true, schema: { type: integer } }
    post:
      tags: [workflows]
      operationId: restoreWorkflowVersion
      summary: Republish an old version as the next one — nothing is overwritten
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowDef" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/workflow-routing:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [workflows]
      operationId: getWorkflowRouting
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowRouting" } } } }
    put:
      tags: [workflows]
      operationId: putWorkflowRouting
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowRouting" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowRouting" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /workflows/validate:
    post:
      tags: [workflows]
      operationId: validateWorkflow
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowValidateRequest" } } }
      responses:
        "200": { description: Validation report, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowValidation" } } } }
  /workflows/edit:
    post:
      tags: [workflows]
      operationId: editWorkflow
      description: >-
        Apply typed operations to a workflow YAML, grafted into the text: the rest of the document,
        comments and style included, does not move. Nothing is saved; `inverse` undoes the
        operations, in the order in which to apply it (ADR 0031).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowEditRequest" } } }
      responses:
        "200": { description: "The edited text, validated, and its inverse", content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowEditResult" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /ui/admin-sections:
    get:
      tags: [ui]
      operationId: listAdminSections
      description: >-
        The administration sections the plugins declare (ADR 0032), filtered by the caller's
        permission and scope; `org` restricts the organisation sections to that one.
      parameters:
        - { name: org, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: The visible sections, content: { application/json: { schema: { type: array, items: { $ref: "./schemas/ui-manifest.schema.json" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /workflows/templates:
    get:
      tags: [workflows]
      operationId: listWorkflowTemplates
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/WorkflowTemplate" } } } } }
  /projects/{id}/policy:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [workflows]
      operationId: getPolicy
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PolicyDef" } } } }
    put:
      tags: [workflows]
      operationId: putPolicy
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PolicyPut" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PolicyDef" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /platform/models:
    get:
      tags: [models]
      operationId: listPlatformModels
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/GatewayModel" } } } } }
  /projects/{id}/models:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [models]
      operationId: getProjectModels
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectModels" } } } }
    put:
      tags: [models]
      operationId: putProjectModels
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectModels" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectModels" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /projects/{id}/models/matrix:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [models]
      operationId: getModelMatrix
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ModelMatrix" } } } }
  /projects/{id}/work-items:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [work-items]
      operationId: listWorkItems
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: state, in: query, schema: { type: string } }
        - { name: size, in: query, schema: { type: string, enum: [S, M, L, XL] } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WorkItemPage" } } } }
    post:
      tags: [work-items]
      operationId: createWorkItem
      summary: File a request in Choregos (internal tracker only)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkItemCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/WorkItem" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /work-items/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [work-items]
      operationId: getWorkItem
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WorkItem" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [work-items]
      operationId: updateWorkItem
      summary: Change a ticket's fields
      description: >-
        The given fields replace the ticket's own, `null` removes one; the whole is validated by the
        pinned workflow's `metadata.inputs`. The interpreter is told (`fields_changed`): a moved
        start date re-arms the action waiting for it (S20-05).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkItemUpdate" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WorkItem" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /work-items/{id}/timeline:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [work-items]
      operationId: getWorkItemTimeline
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TimelineEntry" } } } } }
  /work-items/{id}/hand-offs:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [work-items]
      operationId: getWorkItemHandOffs
      description: >-
        The hand-off receipts of a work item (S25-04), output by output: every run that produced it
        and every run that read it, under the SHA-256 digest of the revision it produced or read, and
        the digest of what the output is worth today — an output modified after it was produced no
        longer has the digest of its last receipt.
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/HandOff" } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /work-items/{id}/journey:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [work-items]
      operationId: getWorkItemJourney
      description: >-
        The work item's path through its workflow, in one read: the map of the version it is pinned
        to, every move from state to state with the transition that carried it, and every step an
        actor took — agent runs, human requests, governed actions. The console animates it.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WorkItemJourney" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /work-items/{id}/decisions:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [work-items]
      operationId: postDecision
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DecisionRequest" } } }
      responses:
        "202": { description: Decision passed on to the workflow, content: { application/json: { schema: { $ref: "#/components/schemas/HumanRequest" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /work-items/{id}/actions:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [work-items]
      operationId: postWorkItemAction
      description: >-
        `migrate` requires `workflow_def_id`, a definition of the project; the ticket's current
        state must exist in it, or be mapped by `state_mapping` — otherwise 422, and nothing is
        passed on.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkItemAction" } } }
      responses:
        "202": { description: Action passed on }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
