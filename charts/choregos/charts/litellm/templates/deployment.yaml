{{- $name := printf "%s-litellm" .Release.Name }}
{{- $guard := .Files.Get "files/choregos_guardrail.py" }}
{{- $spans := .Files.Get "files/choregos_llm_spans.py" }}
{{- $otlp := (.Values.global.tracing | default dict).otlpEndpoint | default "" }}
{{- $decisions := .Values.global.decisions | default dict }}
{{- $models := .Values.models }}
{{- if $decisions.embedded }}
{{- /* ADR 0121: Laya speaks TypeSafe Jev's wire exactly, and LiteLLM 1.105.5 has no `laya` provider in
       code (only price entries): `typesafe/` with Laya's Service as `api_base` posts to
       `<api_base>/v1/systemone` with `model: multilingual` and Laya's bearer. */}}
{{- $models = append $models (dict
      "alias" "platform/decide"
      "model" "typesafe/multilingual"
      "mode" "evaluation"
      "apiBase" (printf "http://%s-laya:8000" .Release.Name)
      "apiKeyEnv" "LAYA_API_KEY"
      "inputCostPerToken" ($decisions.inputCostPerToken | default 0)
      "outputCostPerToken" 0) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels: {{- include "choregos.labels" . | nindent 4 }}
data:
  config.yaml: |
    model_list:
    {{- range $models }}
      - model_name: {{ .alias }}
        litellm_params:
          model: {{ .model }}
          {{- /* A model may name its own endpoint and key (a self-hosted one); the others share the upstream's. */}}
          {{- with (.apiBase | default $.Values.upstream.apiBase) }}
          api_base: {{ . }}
          {{- end }}
          {{- if .apiKeyEnv }}
          api_key: os.environ/{{ .apiKeyEnv }}
          {{- else if $.Values.upstream.apiKeySecret }}
          api_key: os.environ/UPSTREAM_API_KEY
          {{- end }}
        {{- if or (hasKey . "inputCostPerToken") (hasKey . "outputCostPerToken") .modelInfo }}
        {{- /* ADR 0004: a local model is accounted with a configured internal price. The catalogue
               sync reads it back from `/model/info` (`model_info.input_cost_per_token`). */}}
        model_info:
          {{- with .mode }}
          mode: {{ . }}
          {{- end }}
          {{- if hasKey . "inputCostPerToken" }}
          input_cost_per_token: {{ printf "%.12f" (float64 .inputCostPerToken) }}
          {{- end }}
          {{- if hasKey . "outputCostPerToken" }}
          output_cost_per_token: {{ printf "%.12f" (float64 .outputCostPerToken) }}
          {{- end }}
          {{- /* The rest of the price sheet, as the operator wrote it: cache read and write prices,
                 `tiered_pricing` (LiteLLM >= 1.105), a context window. Without them the cost of a cached
                 or long request is wrong, and a wrong counter is worse than none. */}}
          {{- with .modelInfo }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        {{- else }}
        {{- with .mode }}
        model_info: { mode: {{ . }} }
        {{- end }}
        {{- end }}
    {{- end }}
    litellm_settings:
      # Drops from a call the parameters the target provider does not know, instead of
      # failing — model generations do not agree on `temperature`.
      drop_params: true
      # ADR 0018 §2: each call made with a run's key is a span of the run's trace. Inert until
      # `global.tracing.otlpEndpoint` gives LiteLLM an OTLP endpoint.
      {{- if .Values.spans.enabled }}
      callbacks: ["choregos_llm_spans.handler"]
      {{- end }}
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
      store_model_in_db: false
    {{- if .Values.guardrail.enabled }}
    # ADR 0084: secrets masked before the provider call and in its answer. On for every request,
    # it acts only for a key whose metadata the platform marked (`sandbox.llm_security_analyzer`).
    # Fails closed.
    guardrails:
      - guardrail_name: choregos-secrets
        litellm_params:
          guardrail: choregos_guardrail.ChoregosGuardrail
          mode: [pre_call, post_call]
          default_on: true
    {{- end }}
  choregos_guardrail.py: |
{{ $guard | indent 4 }}
  choregos_llm_spans.py: |
{{ $spans | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "choregos.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: choregos-litellm
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: choregos-litellm
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: gateway
      annotations:
        checksum/config: {{ print (toJson $models) (toJson .Values.upstream) (toJson .Values.guardrail) (toJson .Values.spans) $guard $spans $otlp | sha256sum }}
    spec:
      {{- include "choregos.imagePullSecrets" $ | nindent 6 }}
      # The Kyverno `non-root` rule has been strict since 2026-09-25: the pod context is
      # required. The image runs as uid 1000 (verified: `python -c "import litellm"` under
      # `--user 1000`). v1.105.3 (S40-16g) then v1.105.5 (S40-16i) were run under this context on
      # the dev cluster, in throwaway namespaces: Prisma migrations applied, ready, the guard loaded.
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: litellm
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom: { secretKeyRef: { name: {{ include "choregos.gatewaySecret" . }}, key: master-key } }
            {{- with .Values.upstream.apiKeySecret }}
            - name: UPSTREAM_API_KEY
              valueFrom: { secretKeyRef: { name: {{ . }}, key: api-key } }
            {{- end }}
            {{- if $decisions.embedded }}
            # The bearer Laya asks for (ADR 0121); `platform/decide` sends it as its `api_key`.
            - name: LAYA_API_KEY
              valueFrom: { secretKeyRef: { name: {{ include "choregos.decisionsKeySecret" . }}, key: api-key } }
            {{- end }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ ($.Values.database.passwordSecret).name | default (include "choregos.databasePasswordSecret" .) }}
                  key: {{ ($.Values.database.passwordSecret).key | default "password" }}
            # DEDICATED database: virtual keys and their consumption have no business in
            # Choregos' schema. `sslmode=prefer` encrypts when the server can, without requiring a
            # certificate the bench's PostgreSQL does not have; `require` for a server that refuses
            # clear connections (Spilo).
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.database.user | default .Values.global.database.user }}:$(DATABASE_PASSWORD)@{{ .Values.database.host | default (include "choregos.databaseHost" .) }}:{{ .Values.global.database.port }}/{{ .Values.database.name }}?sslmode={{ .Values.database.sslmode }}"
            {{- if .Values.localModelCostMap }}
            # The image's price sheet, not `main` on GitHub: a pod with no Internet loses seconds at each
            # start retrying, and a sheet re-read live would change prices without a review.
            - name: LITELLM_LOCAL_MODEL_COST_MAP
              value: "True"
            {{- end }}
            {{- range .Values.extraSecretEnv }}
            - name: {{ .name }}
              valueFrom: { secretKeyRef: { name: {{ .secretName }}, key: {{ .key }} } }
            {{- end }}
            # S64-08b: the callback posts the ACP CLIs' context breakdowns to the API's internal routes,
            # each signed for its run with the master key above (never sent).
            - name: CHOREGOS_CONTEXT_API_URL
              value: {{ printf "%s/api/v1/internal" ((.Values.global | default dict).internalApiUrl | default "http://choregos-api:8000") | quote }}
            {{- with $otlp }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
          ports:
            - { name: http, containerPort: 4000 }
          readinessProbe:
            httpGet: { path: /health/readiness, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/litellm }
      volumes:
        - name: config
          configMap: { name: {{ $name }} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "choregos.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: choregos-litellm
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - { name: http, port: 4000, targetPort: http }
