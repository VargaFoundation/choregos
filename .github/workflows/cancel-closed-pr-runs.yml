name: cancel the runs of a closed pull request

# A pull request merged or closed while its checks still wait for a runner keeps them waiting:
# GitHub does not cancel them. On a day of many merges they filled the queue ahead of main's own
# run (2026-11-21: 13 of 29 queued runs belonged to merged pull requests, and main had gone a day
# without a verdict). This cancels every queued or running run of the closed pull request's head
# commit. It runs no code from the pull request and checks nothing out.

on:
  pull_request_target:
    types: [closed]

permissions:
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: cancel what still waits or runs for the closed head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SELF: ${{ github.run_id }}
        run: |
          for status in queued in_progress waiting pending; do
            gh api "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&status=$status&per_page=100" \
              --jq '.workflow_runs[].id'
          done | sort -u | while read -r id; do
            [ "$id" = "$SELF" ] && continue
            echo "cancelling run $id"
            gh api -X POST "repos/$REPO/actions/runs/$id/cancel" >/dev/null || true
          done
