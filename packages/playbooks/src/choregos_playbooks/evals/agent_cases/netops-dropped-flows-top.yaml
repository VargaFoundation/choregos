  - { tool: cilium__get_flows, kind: network_policy, operation: get_flows, arguments: { namespace: shop, verdict: DROPPED, last: 2000 } }
  - { tool: cilium__get_flows, kind: network_policy, operation: get_flows, arguments: { namespace: payments, verdict: DROPPED, last: 2000 } }
  - { tool: cilium__get_flows, kind: network_policy, operation: get_flows, arguments: { namespace: auth, verdict: DROPPED, last: 2000 } }
  - { tool: cilium__get_flows, kind: network_policy, operation: get_flows, arguments: { namespace: catalog, verdict: DROPPED, last: 2000 } }
  - { tool: cilium__get_flows, kind: network_policy, operation: get_flows, arguments: { namespace: search, verdict: DROPPED, last: 2000 } }
  - { tool: cilium__get_flows, kind: network_policy, operation: get_flows, arguments: { namespace: orders, verdict: DROPPED, last: 2000 } }
