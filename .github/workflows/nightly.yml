# La nuit : e2e complet, conformité de tous les backends, évals, replay Temporal, scans.
name: nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: helm/kind-action@v1
        with:
          config: dev/kind.yaml
          cluster_name: choregos
      - name: CNI qui applique les NetworkPolicy
        # `dev/kind.yaml` désactive le CNI par défaut : kindnet accepte les politiques et
        # laisse passer le trafic, ce qui rendrait vert un bac à sable qui ne retient rien.
        run: |
          kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.2/manifests/calico.yaml
          kubectl -n kube-system rollout status ds/calico-node --timeout=300s
      - run: uv sync --frozen
      - name: scénarios de jalon sur kind
        run: uv run pytest tests/e2e -m e2e -q
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: e2e-report, path: tests/e2e/report, if-no-files-found: ignore }

  cluster:
    name: Ce qui n'est vrai que sur un vrai cluster
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: helm/kind-action@v1
        with:
          config: dev/kind.yaml
          cluster_name: choregos
      - name: Calico, CloudNativePG, Argo Rollouts
        run: |
          kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.2/manifests/calico.yaml
          kubectl -n kube-system rollout status ds/calico-node --timeout=300s
          kubectl apply --server-side -f https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.25/releases/cnpg-1.25.1.yaml
          kubectl -n cnpg-system rollout status deploy/cnpg-controller-manager --timeout=300s
          kubectl create namespace argo-rollouts --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -n argo-rollouts -f https://github.com/argoproj/argo-rollouts/releases/download/v1.7.2/install.yaml
          kubectl -n argo-rollouts rollout status deploy/argo-rollouts --timeout=300s
      - run: uv sync --frozen
      - name: image de l'API (la pile de plateforme en a besoin)
        run: |
          docker build -f docker/api.Dockerfile --target api -t choregos-api:dev .
          kind load docker-image choregos-api:dev --name choregos
      - name: egress, restauration, manifests, plateforme, canary, perte de nœud
        env:
          CHOREGOS_CLUSTER_CONTEXT: kind-choregos
        run: uv run pytest tests/cluster -m cluster -q
      - name: état du cluster en cas d'échec
        if: failure()
        run: |
          kubectl get pods -A
          kubectl get events -A --sort-by=.lastTimestamp | tail -40

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: tous les backends ACP
        run: uv run pytest tests/conformance -m conformance -q
      - name: rapport de conformité
        run: uv run python -m tests.conformance.report --output conformance.json
        continue-on-error: true
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: conformance, path: conformance.json, if-no-files-found: ignore }

  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: évals des playbooks (seuil bloquant)
        run: uv run python -m choregos_playbooks.evals.runner --all --json evals.json
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: evals, path: evals.json, if-no-files-found: ignore }

  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: replay des historiques Temporal archivés
        run: uv run pytest tests/replay -q

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run pip list --format=json > deps.json
      # Un CRITICAL bloque — c'est ce que SECURITY.md promettait, et `exit-code: 0` le
      # rendait faux ; et ce job n'était pas dans les `needs` de l'alerte.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  alerte:
    needs: [e2e, cluster, conformance, evals, replay, dependencies]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            // Un échec nocturne ouvre une issue : il ne se perd pas dans les logs.
            const title = `nightly en échec — ${new Date().toISOString().slice(0, 10)}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "nightly",
            });
            const body = `La CI nocturne a échoué : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["nightly", "needs-triage"],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            }
