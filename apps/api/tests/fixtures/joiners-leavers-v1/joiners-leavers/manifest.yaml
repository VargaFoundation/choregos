apiVersion: choregos/v1
kind: Template
metadata:
  name: joiners-leavers
  version: 1.0.0
  display: Joiners and leavers (HR)
  description: >-
    Two workflows with no repository and no CI. Onboarding: the access plan prepared by an agent and
    approved by HR, the account and its group ten days before the start date, the sensitive group on
    a re-authenticated approval, the laptop ordered from the supplier's agent then enrolled in the
    fleet and shipped seven days before, the badge handed over in person — a task, with its proof —,
    a check the day after. Offboarding: on the last day the account is disabled, its sessions revoked
    and the badge cut; the laptop is collected, received and wiped. Every write to the directory, the
    fleet, the carrier or the badge readers is a governed action.
requires:
  # Le projet : ses tickets vivent dans Choregos.
  connectors:
    tracker: internal
  # L'organisation : les connecteurs que les workflows appellent, par leur NOM, et leur capacité.
  org_connectors:
    annuaire: identity
    parc: mdm
    transporteur: shipping
    lecteurs: access_control
    fournisseur: mcp
defaults:
  workflows: [./workflows/onboarding.yaml, ./workflows/offboarding.yaml]
  default_workflow: onboarding
  routing:
    - when: { labels_any: [offboarding, depart] }
      workflow: offboarding
  policy: preset:solo
  # Installés dans l'organisation quand un projet naît du gabarit — jamais réécrits s'ils y sont.
  skills: [./skills/procedure-onboarding, ./skills/profils-d-acces]
  agents: [./agents/coordinateur-onboarding.yaml, ./agents/coordinateur-offboarding.yaml]
  # Installée dans le PROJET par le greffon de l'ontologie, quand il est actif : le registre de ce
  # qu'une arrivée ouvre et de ce qu'un départ ferme. Sans lui, le projet naît sans (l'audit le dit).
  extensions:
    ontology: ./ontology
inputs: []
steps: []
