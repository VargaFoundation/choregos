# Pile de développement sans Kubernetes : Postgres, Temporal, LiteLLM, Keycloak, MinIO et
# la mémoire Ecphoria.
#
# Les ports hôte sont surchargeables — une machine de développement a souvent déjà un
# Postgres sur 5432 ou un Keycloak sur 8080, et le défaut faisait échouer `up` sur
# « port is already allocated » sans dire lequel changer :
#
#   CHOREGOS_PORT_POSTGRES=15432 docker compose -f dev/compose.yaml up -d
#
# Variables : CHOREGOS_PORT_{POSTGRES,TEMPORAL,TEMPORAL_UI,LITELLM,KEYCLOAK,MINIO,MINIO_CONSOLE,ECPHORIA}.

# Tout ce dont la plateforme a besoin, sans Kubernetes : `docker compose -f dev/compose.yaml up -d`.
name: choregos

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: choregos
      POSTGRES_PASSWORD: choregos
      POSTGRES_DB: choregos
    ports: ["${CHOREGOS_PORT_POSTGRES:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U choregos"]
      interval: 5s
      retries: 10
    volumes: ["pgdata:/var/lib/postgresql/data"]

  temporal:
    image: temporalio/auto-setup:1.26.2
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: choregos
      POSTGRES_PWD: choregos
      POSTGRES_SEEDS: postgres
      # `development-sql.yaml` n'existe pas dans `auto-setup:1.26.2` — son répertoire de
      # configuration dynamique ne contient que `docker.yaml`. Temporal démarrait, ne
      # trouvait pas le fichier, et sortait : « Unable to create dynamic config client ».
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
    ports: ["${CHOREGOS_PORT_TEMPORAL:-7233}:7233"]

  temporal-ui:
    image: temporalio/ui:2.32.0
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports: ["${CHOREGOS_PORT_TEMPORAL_UI:-8088}:8080"]

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: sk-choregos-dev
      DATABASE_URL: postgresql://choregos:choregos@postgres:5432/choregos
    volumes: ["./litellm.yaml:/app/config.yaml:ro"]
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["${CHOREGOS_PORT_LITELLM:-4000}:4000"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes: ["./keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro"]
    ports: ["${CHOREGOS_PORT_KEYCLOAK:-8080}:8080"]

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: choregos
      MINIO_ROOT_PASSWORD: choregos123
    ports: ["${CHOREGOS_PORT_MINIO:-9000}:9000", "${CHOREGOS_PORT_MINIO_CONSOLE:-9001}:9001"]
    volumes: ["miniodata:/data"]

  ecphoria:
    # `:memory` n'existe pas — le tag de l'édition mémoire est suffixé, pas nommé :
    # `0.2.5-memory`, `0.2-memory`, `latest-memory`. Épinglé plutôt que `latest-memory`,
    # pour que la pile de développement soit la même d'une machine à l'autre.
    image: ghcr.io/vargafoundation/ecphoria:0.2.5-memory
    environment:
      ECPHORIA_EMBEDDING__PROVIDER: openai_compatible
      # `OPENAI_BASE_URL`, pas `BASE_URL` : le champ s'appelle `openai_base_url`. Avec le
      # mauvais nom, la variable était ignorée sans un mot et les embeddings partaient chez
      # `api.openai.com` — hors de la passerelle où le coût est mesuré, et sans clé.
      ECPHORIA_EMBEDDING__OPENAI_BASE_URL: http://litellm:4000/v1
      ECPHORIA_EMBEDDING__MODEL: platform/embed
      # La mémoire n'écoute que sur le réseau de la pile de développement, et refuse de
      # démarrer sans authentification sur une interface non-loopback — c'est voulu. Ici on
      # assume, comme le message d'erreur le propose ; en cluster, le chart pose de vraies
      # clés (`gateway.authEnabled`).
      ECPHORIA_GATEWAY__ALLOW_INSECURE: "true"
      # Sans volume, DuckDB ne peut pas ouvrir ses fichiers et la mémoire retombe en RAM à
      # chaque démarrage — silencieusement, sur un `WARN` que personne ne lit.
      ECPHORIA_MEMORY__EPISODIC__DB_PATH: /data/episodic.duckdb
      ECPHORIA_MEMORY__STATE__DB_PATH: /data/state.db
      ECPHORIA_MEMORY__COGNITION__DB_PATH: /data/cognition.duckdb
    volumes: ["ecphoriadata:/data"]
    ports: ["${CHOREGOS_PORT_ECPHORIA:-8432}:8432"]
    # Pas de profil : le README annonce Ecphoria dans la pile, et une mémoire absente
    # fait échouer le premier run de la plateforme sur une erreur de connexion.

volumes:
  pgdata:
  miniodata:
  ecphoriadata:
