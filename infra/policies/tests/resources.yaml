# Pods judged by `kyverno test infra/policies/tests` (CI job `charts`, `make policies-test`).
apiVersion: v1
kind: Pod
metadata:
  name: tagged
  namespace: proj-demo-runners
  labels:
    choregos/project: demo
spec:
  containers:
  - name: main
    image: ghcr.io/example/api:0.19.1
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: RuntimeDefault
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
---
