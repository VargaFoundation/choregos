[project]
name = "choregos-core"
version = "0.4.1"
description = "Cœur Choregos : DSL de workflow, politiques, résolution de modèles, gates"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = ["choregos-contracts", "pydantic>=2.9", "PyYAML>=6.0", "jsonschema>=4.23", "structlog>=24.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/choregos_core"]
