apiVersion: choregos/v1
kind: Template
metadata:
  name: github-software-delivery
  version: 1.1.0
  display: GitHub · software delivery (fix, study, feature)
  description: >-
    Three workflows for a software team on GitHub, run by agents from the catalogue. A bug or a small
    fix goes from the issue to production with no human (dev-simple). A study ends with one
    architecture decision record in MADR 4 format, approved by the architects and merged, never
    deployed (study). A feature documents itself, and waits for three people: a product owner on the specification, a
    maintainer on the pull request, a release captain on production (dev-complex). Checks run in
    GitHub Actions; the release train deploys.
requires:
  # The PR's checks are read through the repository: GitHub Actions is enough, no `ci` connector.
  # On a demonstration tenant, `cd` can be the `demo` type; for real, Argo CD.
  connectors:
    tracker: github-issues
    scm: github
    cd: argocd
defaults:
  workflows: [./workflows/dev-simple.yaml, ./workflows/study.yaml, ./workflows/dev-complex.yaml]
  default_workflow: dev-simple
  # The first matching rule wins: a study first, a feature next.
  routing:
    - when: { labels_any: [study, adr, spike] }
      workflow: study
    - when: { labels_any: [feature, epic, complex] }
      workflow: dev-complex
    - when: { labels_any: [bug, fix, chore] }
      workflow: dev-simple
  policy: ./policy.yaml
  # The agents the workflows name install themselves (ADR 0040); the list says what the
  # template brings to the organisation.
  skills: [catalogue:madr-4]
  agents:
    - catalogue:triager
    - catalogue:spec-writer
    - catalogue:planner
    - catalogue:developer
    - catalogue:tester
    - catalogue:reviewer
    - catalogue:security-reviewer
    - catalogue:review-responder
    - catalogue:ci-fixer
    - catalogue:docs-writer
    - catalogue:release-notes-writer
    - catalogue:prod-verifier
    - catalogue:researcher
    - catalogue:architect
inputs:
  - { name: repo, type: github-repo, required: true, description: "owner/name of the application repository" }
  - { name: default_branch, type: string, default: main }
  - { name: language, type: enum, values: [python, node, go, java, dotnet, other], default: python }
steps:
  - github.install_app
  - github.ensure_labels:
      labels:
        bug: d73a4a
        fix: d73a4a
        chore: c5def5
        study: 1d76db
        adr: 1d76db
        spike: 1d76db
        feature: 0e8a16
        epic: 0e8a16
        complex: 5319e7
  - github.ensure_webhooks:
      events: [issues, issue_comment, pull_request, pull_request_review, check_suite]
