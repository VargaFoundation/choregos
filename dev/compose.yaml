# Development stack without Kubernetes: Postgres, Temporal, LiteLLM, Keycloak, S3 storage and
# the Ecphoria memory.
#
# Host ports can be overridden — a development machine often already has a
# Postgres on 5432 or a Keycloak on 8080, and the default made `up` fail on
# "port is already allocated" without saying which one to change:
#
#   CHOREGOS_PORT_POSTGRES=15432 docker compose -f dev/compose.yaml up -d
#
# Variables: CHOREGOS_PORT_{POSTGRES,TEMPORAL,TEMPORAL_UI,LITELLM,KEYCLOAK,S3,S3_CONSOLE,ECPHORIA}
# (CHOREGOS_PORT_MINIO and CHOREGOS_PORT_MINIO_CONSOLE are still read, for machines already set up).

# Everything the platform needs, without Kubernetes: `docker compose -f dev/compose.yaml up -d`.
# Not `choregos`: that is the local install at the root (`compose.yaml`); the same project name
# would make each file see the other's containers as orphans and share its volumes.
name: choregos-deps

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: choregos
      POSTGRES_PASSWORD: choregos
      POSTGRES_DB: choregos
    ports: ["${CHOREGOS_PORT_POSTGRES:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U choregos"]
      interval: 5s
      retries: 10
    volumes: ["pgdata:/var/lib/postgresql/data"]

  temporal:
    image: temporalio/auto-setup:1.26.2
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: choregos
      POSTGRES_PWD: choregos
      POSTGRES_SEEDS: postgres
      # `development-sql.yaml` does not exist in `auto-setup:1.26.2` — its dynamic
      # configuration directory only holds `docker.yaml`. Temporal started, did not
      # find the file, and exited: "Unable to create dynamic config client".
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
    ports: ["${CHOREGOS_PORT_TEMPORAL:-7233}:7233"]

  temporal-ui:
    image: temporalio/ui:2.32.0
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports: ["${CHOREGOS_PORT_TEMPORAL_UI:-8088}:8080"]

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: sk-choregos-dev
      DATABASE_URL: postgresql://choregos:choregos@postgres:5432/choregos
    volumes: ["./litellm.yaml:/app/config.yaml:ro"]
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["${CHOREGOS_PORT_LITELLM:-4000}:4000"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes: ["./keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro"]
    ports: ["${CHOREGOS_PORT_KEYCLOAK:-8080}:8080"]

  # RustFS (Apache-2.0): the MinIO server image is no longer published, on neither Docker Hub nor
  # quay.io — a fresh machine could no longer start this stack (#152). RustFS also issues
  # STS credentials bounded by a session policy, which a reader without an S3 key needs (foundation trial,
  # item 7). Same credentials and same ports as the former service.
  s3:
    image: rustfs/rustfs:1.0.1
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: choregos
      RUSTFS_SECRET_KEY: choregos123
    ports:
      - "${CHOREGOS_PORT_S3:-${CHOREGOS_PORT_MINIO:-9000}}:9000"
      - "${CHOREGOS_PORT_S3_CONSOLE:-${CHOREGOS_PORT_MINIO_CONSOLE:-9001}}:9001"
    volumes: ["s3data:/data"]

  ecphoria:
    # `:memory` does not exist — the memory edition's tag is suffixed, not named:
    # `0.2.5-memory`, `0.2-memory`, `latest-memory`. Pinned rather than `latest-memory`,
    # so the development stack is the same from one machine to the next.
    image: ghcr.io/vargafoundation/ecphoria:0.2.5-memory
    environment:
      ECPHORIA_EMBEDDING__PROVIDER: openai_compatible
      # `OPENAI_BASE_URL`, not `BASE_URL`: the field is called `openai_base_url`. With the
      # wrong name the variable was ignored without a word and the embeddings went to
      # `api.openai.com` — outside the gateway where cost is measured, and without a key.
      ECPHORIA_EMBEDDING__OPENAI_BASE_URL: http://litellm:4000/v1
      ECPHORIA_EMBEDDING__MODEL: platform/embed
      # The memory only listens on the development stack's network, and refuses to
      # start without authentication on a non-loopback interface — that is intended. Here we
      # accept it, as the error message suggests; in a cluster, the chart sets real
      # keys (`gateway.authEnabled`).
      ECPHORIA_GATEWAY__ALLOW_INSECURE: "true"
      # Without a volume, DuckDB cannot open its files and the memory falls back to RAM at
      # every start — silently, on a `WARN` nobody reads.
      ECPHORIA_MEMORY__EPISODIC__DB_PATH: /data/episodic.duckdb
      ECPHORIA_MEMORY__STATE__DB_PATH: /data/state.db
      ECPHORIA_MEMORY__COGNITION__DB_PATH: /data/cognition.duckdb
    volumes: ["ecphoriadata:/data"]
    ports: ["${CHOREGOS_PORT_ECPHORIA:-8432}:8432"]
    # No profile: the README announces Ecphoria in the stack, and a missing memory
    # makes the platform's first run fail on a connection error.

volumes:
  pgdata:
  s3data:
  ecphoriadata:
