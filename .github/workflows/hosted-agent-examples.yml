# Nightly and manual, never blocking: builds each hosted agent example image (Agent Framework,
# LangGraph, OpenAI Agents SDK, Claude Agent SDK, Copilot SDK) and runs the eight conformance checks
# of a hosted agent against it (ADR 0080). The frameworks are heavy and stay out of the repository's
# lock file, so they are not part of the blocking CI; the reference example is (`make test`).
name: hosted-agent-examples

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: ${{ matrix.example }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        example: [reference, agent-framework, langgraph, openai-agents, claude-agent-sdk, copilot-sdk]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: build the example image
        run: docker build -t "${{ matrix.example }}-triager" "examples/hosted/${{ matrix.example }}"
      - name: conformance of the image
        run: make conformance-hosted IMAGE="${{ matrix.example }}-triager"
