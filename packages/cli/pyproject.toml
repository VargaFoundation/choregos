[project]
name = "choregos-cli"
version = "0.5.0"
description = "CLI choregos"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = ["choregos-core", "typer>=0.15", "httpx>=0.27", "rich>=13.9", "PyYAML>=6.0"]

[project.scripts]
choregos = "choregos_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/choregos_cli"]
