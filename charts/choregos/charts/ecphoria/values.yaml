image:
  repository: ghcr.io/vargafoundation/ecphoria
  tag: "0.2.5-memory"
persistence:
  enabled: true
  size: 5Gi
  storageClass: ""
# Embedding model, requested from Choregos' gateway (measured cost, no direct egress).
embedding:
  # `none` when the deployment has no gateway: memory keeps the facts, but
  # semantic search falls back to lexical. Better to say so than to let
  # embedding calls fail silently on every write.
  provider: openai_compatible
  model: platform/embed
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: "1", memory: 2Gi }
