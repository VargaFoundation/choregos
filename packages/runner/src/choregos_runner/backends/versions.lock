# Versions des agents ACP installées dans l'image `choregos-runner`.
# Renovate propose les montées ; chaque bump passe par la suite de conformité (S2-11).
#
# Une ligne annotée `# renovate: datasource=… depName=…` est suivie automatiquement.
# Les autres sont épinglées à la main tant que leur source amont n'est pas confirmée :
# mieux vaut un suivi manquant qu'un dépôt inventé sur lequel Renovate ouvrirait des PR
# fausses.
#
# L'image installe trois de ces agents — `claude-agent-acp`, `gemini-cli`, `opencode` — et
# appelle chacun à la construction. Les autres lignes décrivent des backends supportés dont
# l'image ne porte pas le binaire.
# OpenHands a été retiré le 2026-09-21 (docs/adr/0011-retrait-d-openhands.md).
claude-agent-acp=0.16.2
codex-acp=0.4.2
# renovate: datasource=github-releases depName=google-gemini/gemini-cli
gemini-cli=0.60.0
# renovate: datasource=github-releases depName=block/goose
goose=1.9.0
# renovate: datasource=github-releases depName=sst/opencode
# 0.8.3 n'a jamais existé sur npm : la ligne 0.8 de `opencode-ai` s'arrête à 0.8.0. Le premier
# build de l'image dans une CI l'a dit (`npm error notarget`) ; personne ne l'avait entendu
# parce que l'installation était suivie d'un `|| echo`. 0.8.0 porte CVE-2026-22813, corrigée
# en 1.1.10 — d'où la 1.x et non le plus proche voisin de l'épingle d'origine.
opencode=1.18.31
copilot-cli=0.3.0
# rtk (ADR 0055): not an agent, a shell-output filter the image carries for every backend.
# Each digest is checked at build time, and a wrong one fails the build. When Renovate bumps
# the version alone, the old digests fail it too, so a bump never ships an unverified binary.
# amd64 installs the static musl release binary. arm64 builds the release's source, because
# upstream's aarch64 binary needs glibc 2.39 and bookworm has 2.36. `cargo --locked` then checks
# every crate against the lock file of that source.
# renovate: datasource=github-releases depName=rtk-ai/rtk
rtk=0.50.0
rtk-sha256-x86_64-unknown-linux-musl=bc2b8902b0d9c796c82ef45f16ae2307e17757afeca5ee156235a3dc7bda5f89
rtk-sha256-source=428702395b6593268df073e7724a548fdc98be4a3cdf61656a6678e304a690a8
