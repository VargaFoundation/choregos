{{- if and .Values.enabled .Values.global.rbac.jobRunner }}
{{- /*
The right, for the orchestrator, to launch its agents in ITS namespace — and nothing else.

Off by default, and this is not decorative caution: on a shared platform,
this Role is laid down by the platform team (at Diametral, `tenant-base`), because a
tenant that writes its own RBAC has no ceiling a reviewer can see. On a
local bench, nobody lays it down — hence this option, which makes the chart self-sufficient where it is
allowed to be.

`get` on `secrets` applies to ALL the secrets of the namespace: Kubernetes cannot
restrict a `create` by name, and the executor re-reads the token secret it has just written.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: choregos-orchestrator-jobs
  labels: {{- include "choregos.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    # `patch` serves ONE thing: lifting the `suspend` of a queued Job. Without
    # it, the concurrency ceiling creates Jobs nobody can wake up any more —
    # the API answers 403, the activity fails, and the ticket's workflow dies. Seen on the bench
    # of 2026-09-24: three tickets lost, one of which expired without running for a second.
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    # `update` serves to REPLACE a run's token: that of a replayed run (otherwise the agent
    # runs with a stale token) and that of a run waiting in the queue (its token ages
    # during the wait). Without this verb, the API answers 403 and the ticket dies — twice the
    # same scenario as `patch` on Jobs, on the bench of 2026-09-24.
    #
    # The rule drawn from it: every verb the executor USES must appear here, and the
    # chart test now checks it rather than relying on review.
    # `patch` attaches the secret to its Job (`ownerReferences`): the garbage collector
    # takes it away with the finished Job, instead of leaving one token per run in the namespace.
    verbs: ["get", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  {{- if eq (include "choregos.executorKind" .) "agent_sandbox" }}
  # The `agent_sandbox` executor (ADR 0016): one SandboxClaim per run, created, read and
  # deleted; `patch` marks a claim once its run is assigned. `patch` on sandboxes suspends and
  # resumes one around a human question. The pool and the template are read, never written:
  # the chart owns them.
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxwarmpools", "sandboxtemplates"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch", "patch"]
  # The runs waiting for a slot (`queue`) are their Secrets, labelled `choregos/queued=true`:
  # listing them is how arrival order is read. `get` on secrets above already reads any of them.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: choregos-orchestrator-jobs
  labels: {{- include "choregos.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: choregos-orchestrator-jobs
subjects:
  - kind: ServiceAccount
    name: choregos-orchestrator
{{- end }}
