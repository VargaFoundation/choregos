# helm unittest : ce que le chart doit garantir, quoi qu'il arrive.
#
# Les chemins pointent le **nom** du sous-chart (`charts/choregos-api/...`), pas son
# répertoire (`charts/api/...`) : le plugin indexe les templates par nom de chart. Avec le
# répertoire, il répond « template not exists or not selected in test suite » — un message
# qui ressemble à un fichier manquant alors que le fichier est là.
#
# La suite vit dans le chart parent et non dans le sous-chart : les templates de `api`
# appellent `choregos.labels`, un helper du parent, et ne rendent pas seuls.
suite: API Choregos
templates:
  - charts/choregos-api/templates/deployment.yaml
  - charts/choregos-api/templates/migrations-job.yaml
tests:
  - it: pose un contexte de sécurité non-root
    template: charts/choregos-api/templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

  - it: expose des sondes de vie et de disponibilité
    template: charts/choregos-api/templates/deployment.yaml
    asserts:
      - isNotNull:
          path: spec.template.spec.containers[0].readinessProbe
      - isNotNull:
          path: spec.template.spec.containers[0].livenessProbe

  - it: ne met jamais un secret en clair dans l'environnement
    template: charts/choregos-api/templates/deployment.yaml
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="CHOREGOS_SESSION_SECRET")].value
          pattern: ".+"

  - it: exécute les migrations avant la mise à jour des pods
    template: charts/choregos-api/templates/migrations-job.yaml
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
