      responses: { "202": { description: Accepté, content: { application/json: { schema: { $ref: "#/components/schemas/WebhookAck" } } } } }
  /webhooks/alertmanager:
    post:
      tags: [webhooks]
      security: []
      operationId: alertmanagerWebhook
      parameters: [{ name: X-Choregos-Secret, in: header, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses: { "202": { description: Accepté, content: { application/json: { schema: { $ref: "#/components/schemas/WebhookAck" } } } } }
  /internal/runs/{id}/input:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [internal]
      security: [{ runToken: [] }]
      operationId: getRunInput
      responses:
        "200": { description: StageInput du run, content: { application/json: { schema: { $ref: "#/components/schemas/StageInput" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Résultat déjà posté (le runner doit sortir en 0), content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /internal/runs/{id}/events:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [internal]
      security: [{ runToken: [] }]
      operationId: postRunEvents
      summary: Journal ACP en lot (idempotent par `seq`)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [events], properties: { events: { type: array, items: { $ref: "#/components/schemas/RunEventIn" } } } } } }
      responses: { "202": { description: Accepté } }
  /internal/runs/{id}/result:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [internal]
      security: [{ runToken: [] }]
      operationId: postRunResult
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StageResult" } } } }
      responses:
        "200": { description: Enregistré (idempotent) }
        "422": { $ref: "#/components/responses/ValidationError" }
  /internal/runs/{id}/findings:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [internal]
      security: [{ runToken: [] }]
      operationId: postRunFinding
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Finding" } } } }
      responses:
        "201": { description: Finding enregistré, content: { application/json: { schema: { $ref: "#/components/schemas/FindingAck" } } } }
        "429": { description: Plafond de findings atteint, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /projects/{id}/tools:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [projects]
      operationId: getProjectTools
      summary: Le catalogue d'outils du déploiement, et ce que ce projet peut appeler.
      responses:
        "200":
          description: Catalogue annoté
          content:
            application/json:
              schema:
                type: object
                required: [tools, allows_all]
                properties:
                  allows_all: { type: boolean }
                  tools:
                    type: array
                    items:
                      type: object
                      required: [name, description, provider, allowed]
                      properties:
                        name: { type: string }
                        description: { type: string }
                        provider: { type: string }
                        categories: { type: array, items: { type: string } }
                        price_eur: { type: number }
                        needs_credential: { type: boolean }
                        source: { type: string, enum: [http, mcp] }
                        groups: { type: array, items: { type: string } }
                        allowed: { type: boolean }
  /internal/runs/{id}/tools:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [internal]
      security: [{ runToken: [] }]
      operationId: getRunTools
      summary: Les outils du catalogue que CE run peut appeler, au format MCP.
      responses:
        "200":
          description: Liste d'outils
          content:
            application/json:
              schema:
                type: object
                properties:
                  tools:
                    type: array
                    items:
                      type: object
                      required: [name, description]
                      properties:
                        name: { type: string }
                        description: { type: string }
                        inputSchema: { type: object, additionalProperties: true }
  /internal/runs/{id}/tools/{name}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - { name: name, in: path, required: true, schema: { type: string } }
    post:
      tags: [internal]
      security: [{ runToken: [] }]
      operationId: callRunTool
      summary: Appelle un outil du catalogue pour ce run. La clé du fournisseur reste côté plateforme.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: true } } }
      responses:
        "200":
          description: Réponse du fournisseur, telle quelle
          content:
            application/json:
              schema:
                type: object
                required: [status_code, result]
                properties:
                  status_code: { type: integer }
                  result: {}
                  remaining: { type: integer, nullable: true }
        "404": { description: Outil inconnu ou non autorisé au projet, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "429": { description: Plafond d'appels d'outils atteint, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /internal/runs/{id}/scope-change:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [internal]
      security: [{ runToken: [] }]
      operationId: postScopeChange
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [paths, justification], properties: { paths: { type: array, items: { type: string } }, justification: { type: string } } } } }
      responses:
        "200": { description: Décision, content: { application/json: { schema: { $ref: "#/components/schemas/ScopeChangeDecision" } } } }
  /internal/runs/{id}/question:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [internal]
      security: [{ runToken: [] }]
      operationId: postRunQuestion
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [text], properties: { text: { type: string }, options: { type: array, items: { type: string } } } } } }
      responses: { "202": { description: Question transmise ; le run doit se terminer en needs_human } }
  /internal/runs/{id}/context:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [internal]
      security: [{ runToken: [] }]
      operationId: getRunContext
      responses:
        "200": { description: Context pack, content: { application/json: { schema: { $ref: "#/components/schemas/ContextPack" } } } }
  /internal/runs/{id}/ticket:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [internal]
      security: [{ runToken: [] }]
      operationId: getRunTicket
      responses:
        "200": { description: Ticket et documents liés, content: { application/json: { schema: { $ref: "#/components/schemas/RunTicket" } } } }
  /internal/runs/{id}/ci-logs:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [internal]
      security: [{ runToken: [] }]
      operationId: getRunCiLogs
      parameters: [{ name: tail, in: query, schema: { type: integer, default: 500, maximum: 5000 } }]
      responses:
        "200": { description: Logs, content: { application/json: { schema: { type: object, properties: { logs: { type: string }, ref: { type: string } } } } } }
  /healthz:
    get: { tags: [session], security: [], operationId: healthz, responses: { "200": { description: OK } } }
  /edition:
    get:
      tags: [session]
      security: []
      operationId: edition
      summary: Quelle édition tourne, et ce qu'elle s'autorise (ADR 0024)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [edition, features, version]
                properties:
                  edition: { type: string, enum: [community, enterprise] }
                  features: { type: array, items: { type: string } }
                  version: { type: string }
  /readyz:
    get: { tags: [session], security: [], operationId: readyz, responses: { "200": { description: OK }, "503": { description: Non prêt } } }
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: choregos_session }
    bearer: { type: http, scheme: bearer, bearerFormat: choregos-api-token }
    runToken: { type: http, scheme: bearer, bearerFormat: JWT, description: JWT de run signé ES256, aud=internal }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string } }
    Org: { name: org, in: path, required: true, schema: { type: string } }
    Env: { name: env, in: path, required: true, schema: { type: string } }
    ConnectorKind:
      name: kind
      in: path
      required: true
      schema: { type: string, enum: [tracker, scm, ci, cd, runtime, memory, notify, gateway] }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
  responses:
    Unauthorized:
      description: Non authentifié
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Forbidden:
      description: Interdit (RBAC)
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    NotFound:
      description: Introuvable
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Conflict:
      description: Conflit d'état
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    ValidationError:
      description: Entité non traitable
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
  schemas:
    Problem:
      type: object
      description: RFC 9457
      required: [type, title, status]
      properties:
        type: { type: string, default: about:blank }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              loc: { type: array, items: { type: string } }
              msg: { type: string }
              line: { type: integer }
              column: { type: integer }
        retry_after: { type: integer }
    PageMeta:
      type: object
      required: [has_more]
      properties:
        next_cursor: { type: [string, "null"] }
        has_more: { type: boolean }
    Role:
      type: string
      enum: [org_admin, project_owner, developer, release_captain, viewer]
    Size: { type: string, enum: [S, M, L, XL] }
    Risk: { type: string, enum: [low, medium, high] }
    Me:
      type: object
      required: [id, email, display_name, memberships]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        display_name: { type: string }
        oidc_sub: { type: string }
        last_login_at: { type: [string, "null"], format: date-time }
        memberships: { type: array, items: { $ref: "#/components/schemas/Membership" } }
    Membership:
      type: object
      required: [org, role]
      properties:
        user_id: { type: string }
        email: { type: string }
        org: { type: string }
        project_slug: { type: [string, "null"] }
        role: { $ref: "#/components/schemas/Role" }
    MembershipUpsert:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        project_slug: { type: [string, "null"] }
    Project:
      type: object
      required: [id, slug, org, name, status, config]
      properties:
        id: { type: string }
        slug: { type: string }
        org: { type: string }
        name: { type: string }
        template_ref: { type: [string, "null"] }
        status: { type: string, enum: [draft, provisioning, active, suspended, archived] }
        config: { $ref: "./schemas/project.schema.json" }
        workflow_name: { type: [string, "null"] }
        policy_name: { type: [string, "null"] }
        stats: { $ref: "#/components/schemas/ProjectStats" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProjectStats:
      type: object
      properties:
        active_work_items: { type: integer }
        cost_month_eur: { type: number }
        budget_month_eur: { type: [number, "null"] }
        trains_pending: { type: integer }
        first_pass_merge_rate: { type: [number, "null"] }
        cycle_time_p50_hours: { type: [number, "null"] }
    ProjectPage:
      type: object
      required: [items, meta]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Project" } }
        meta: { $ref: "#/components/schemas/PageMeta" }
    ProjectCreate:
      type: object
      required: [slug, name, config]
      properties:
        slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        name: { type: string }
        template_ref: { type: [string, "null"] }
        config: { $ref: "./schemas/project.schema.json" }
        inputs: { type: object, additionalProperties: true }
    ProjectUpdate:
      type: object
      properties:
        name: { type: string }
        config: { $ref: "./schemas/project.schema.json" }
    ProvisionRequest:
      type: object
      properties:
        inputs: { type: object, additionalProperties: true }
        dry_run: { type: boolean, default: false }
        resume: { type: boolean, default: true }
    ProvisionStatus:
      type: object
      required: [project_id, status, steps]
      properties:
        project_id: { type: string }
        workflow_id: { type: [string, "null"] }
        status: { type: string, enum: [pending, running, succeeded, failed] }
        current_step: { type: [string, "null"] }
        steps:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name: { type: string }
              status: { type: string, enum: [pending, running, succeeded, failed, skipped] }
              message: { type: [string, "null"] }
              remediation: { type: [string, "null"] }
              started_at: { type: [string, "null"], format: date-time }
              ended_at: { type: [string, "null"], format: date-time }
    Connector:
      type: object
      required: [kind, type, status]
      properties:
        id: { type: string }
        kind: { type: string, enum: [tracker, scm, ci, cd, runtime, memory, notify, gateway] }
        type: { type: string }
        config: { type: object, additionalProperties: true }
        secret_ref: { type: [string, "null"] }
        status: { type: string, enum: [unknown, ok, degraded, error] }
        last_check_at: { type: [string, "null"], format: date-time }
        last_error: { type: [string, "null"] }
    ConnectorUpsert:
      type: object
      required: [type, config]
      properties:
        type: { type: string }
        config: { type: object, additionalProperties: true }
        secret_ref: { type: [string, "null"] }
    ConnectorTestResult:
      type: object
      required: [ok, checks]
      properties:
        ok: { type: boolean }
        checks:
          type: array
          items:
            type: object
            required: [name, ok]
            properties:
              name: { type: string }
              ok: { type: boolean }
              detail: { type: [string, "null"] }
    ConnectorType:
      type: object
      required: [kind, type, display, config_schema]
      properties:
        kind: { type: string }
        type: { type: string }
        display: { type: string }
        available: { type: boolean, default: true }
        config_schema: { type: object, additionalProperties: true }
    WorkflowDef:
      type: object
      required: [name, version, source, yaml, checksum, is_active]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: integer }
        source: { type: string, enum: [repo, platform, template] }
        yaml: { type: string }
        json: { $ref: "./schemas/workflow.schema.json" }
        checksum: { type: string }
        is_active: { type: boolean }
    WorkflowPut:
      type: object
      required: [yaml]
      properties:
        yaml: { type: string }
        source: { type: string, enum: [repo, platform, template], default: platform }
        activate: { type: boolean, default: true }
    WorkflowValidateRequest:
      type: object
      properties:
        yaml: { type: string }
        json: { type: object, additionalProperties: true }
    WorkflowValidation:
      type: object
      required: [valid, errors, warnings]
      properties:
        valid: { type: boolean }
        errors: { type: array, items: { $ref: "#/components/schemas/WorkflowIssue" } }
        warnings: { type: array, items: { $ref: "#/components/schemas/WorkflowIssue" } }
        graph: { $ref: "#/components/schemas/WorkflowGraph" }
    WorkflowIssue:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        path: { type: [string, "null"] }
        line: { type: [integer, "null"] }
        column: { type: [integer, "null"] }
    WorkflowGraph:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items:
            type: object
            required: [id, display, kind]
            properties:
              id: { type: string }
              display: { type: string }
              kind: { type: string }
              terminal: { type: boolean }
              lane: { type: string }
        edges:
          type: array
          items:
            type: object
            required: [from, to]
            properties:
              id: { type: [string, "null"] }
              from: { type: string }
              to: { type: string }
              kind:
                type: string
                description: "`nominal` pour une transition du YAML ; `reject`, `resume`, `escalate`, `default`… pour les arêtes secondaires (rendues en pointillés)."
              label: { type: string }
              wildcard: { type: boolean }
              actor: { type: [string, "null"] }
              actor_type: { type: [string, "null"] }
              gates: { type: array, items: { type: string } }
              via: { type: [string, "null"] }
    WorkflowTemplate:
      type: object
      required: [name, version, display, yaml]
      properties:
        name: { type: string }
        version: { type: integer }
        display: { type: string }
        description: { type: string }
        yaml: { type: string }
    PolicyDef:
      type: object
      required: [name, version, yaml, is_active]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: integer }
        yaml: { type: string }
        json: { $ref: "./schemas/policy.schema.json" }
        is_active: { type: boolean }
    PolicyPut:
      type: object
      required: [yaml]
      properties:
        yaml: { type: string }
        activate: { type: boolean, default: true }
