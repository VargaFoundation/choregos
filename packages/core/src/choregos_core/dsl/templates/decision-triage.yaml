# Classify, route, escalate below a threshold (ADR 0121): a decision model reads the request and says
# what should happen to it, with a probability. Above the threshold the platform routes it; below it,
# or when the model says nothing usable, a person decides. Declining is never automatic.
# Needs a decision model in the catalogue (usage `decide`) and a gateway that serves `/v1/systemone`.
apiVersion: choregos/v1
kind: Workflow
metadata:
  name: decision-triage
  version: 1
  description: Decision model classifies → confident answers are routed → the rest goes to a person. Needs no repository.
actors:
  classifier:
    type: decision
    role: triage_request
    model: platform/decide
    state: [title, description, labels, type]
    questions:
      route:
        type: choice
        instructions: >-
          What should happen to this request: deliver it as asked, ask the requester to clarify it,
          or have a person look at it before anything is done?
        options: [deliver, clarify, review]
  platform: { type: system }
  owner: { type: human, group: product-owners, sla_hours: 24 }
  assistant: { type: agent, role: deliver, model: "profile:by_size" }
states:
  inbox: { display: To triage, kind: wait, tracker: { status: Todo, label: "choregos:inbox" } }
  classified: { display: Classified, tracker: { status: Triaged } }
  awaiting_triage: { display: A person decides, kind: wait, tracker: { status: Needs review } }
  needs_clarification: { display: Waiting for the requester, kind: wait, tracker: { status: Blocked } }
  ready: { display: Ready, tracker: { status: Ready } }
  awaiting_acceptance: { display: Deliverable to accept, kind: wait, tracker: { status: In review } }
  done: { display: Done, terminal: true, tracker: { status: Done } }
  declined: { display: Declined, terminal: true, outcome: declined, tracker: { status: Cancelled } }
  needs_human: { display: Needs a human, kind: wait, tracker: { status: Blocked } }
  abandoned: { display: Abandoned, terminal: true, outcome: cancelled, tracker: { status: Cancelled } }
transitions:
  - id: t-classify
    from: inbox
    to: classified
    by: classifier
    on_fail: { to: inbox, max_attempts: 2, escalate_to: needs_human }
  - id: t-route-deliver
    from: classified
    to: ready
    by: platform
    when: { route: deliver, route_confidence: { gte: 0.85 } }
  - id: t-route-clarify
    from: classified
    to: needs_clarification
    by: platform
    when: { route: clarify, route_confidence: { gte: 0.85 } }
  - id: t-route-person
    from: classified
    to: awaiting_triage
    by: platform
  - id: t-triage
    from: awaiting_triage
    to: ready
    by: owner
    on_reject: declined
    timeout_hours: 72
  - id: t-clarified
    from: needs_clarification
    to: inbox
    by: owner
    timeout_hours: 168
  - id: t-deliver
    from: ready
    to: awaiting_acceptance
    by: assistant
    outputs: [deliverable_markdown]
    gates: [outputs_present]
    on_fail: { to: ready, max_attempts: 2, escalate_to: needs_human }
  - id: t-accept
    from: awaiting_acceptance
    to: done
    by: owner
    on_reject: ready
    timeout_hours: 72
  - id: t-abandon
    from: needs_human
    to: abandoned
    by: owner
    timeout_hours: 168
defaults:
  from_any_agent_state:
    on_question: needs_human
    on_budget_exceeded: needs_human
    on_timeout: needs_human
  needs_human:
    on_answer: resume
    on_abandon: abandoned
