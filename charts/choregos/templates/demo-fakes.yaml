{{- if .Values.demoFakes.enabled }}
{{- /*
The HR scenario fakes served by ONE process (S20-07). The API (two replicas) and
the orchestrator are distinct processes: an in-memory fake would show them as many
fleets, directories and badge readers as there are processes. A single replica is the whole
point. For a demonstration: `garde.yaml` refuses it in staging and prod.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: choregos-demo-fakes
  labels:
    app.kubernetes.io/name: choregos-demo-fakes
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: choregos
    app.kubernetes.io/component: demo-fakes
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/name: choregos-demo-fakes
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: choregos-demo-fakes
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: choregos
        app.kubernetes.io/component: demo-fakes
    spec:
      {{- include "choregos.imagePullSecrets" $ | nindent 6 }}
      automountServiceAccountToken: false
      securityContext: {{- toYaml .Values.global.podSecurityContext | nindent 8 }}
      containers:
        - name: demo-fakes
          # The API image carries the fakes and `uvicorn`: nothing more to build.
          image: {{ include "choregos.image" (dict "global" .Values.global "image" (index .Values "choregos-api" "image")) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext: {{- toYaml .Values.global.securityContext | nindent 12 }}
          command: ["python", "-m", "choregos_adapters.fakes.serveur"]
          ports:
            - name: http
              containerPort: {{ .Values.demoFakes.port }}
          env:
            - name: CHOREGOS_DEMO_PORT
              value: {{ .Values.demoFakes.port | quote }}
            {{- with .Values.demoFakes.tokenSecret }}
            # The MCP servers' token, and the fake Graph's application secret: by
            # reference, like any secret; without it, the network policy is the only gate.
            - name: CONNECTOR_DEMO_JETON
              valueFrom: { secretKeyRef: { name: {{ .name }}, key: {{ .key }} } }
            {{- end }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          resources: {{- toYaml .Values.demoFakes.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: choregos-demo-fakes
  labels:
    app.kubernetes.io/name: choregos-demo-fakes
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: choregos
    app.kubernetes.io/component: demo-fakes
spec:
  selector:
    app.kubernetes.io/name: choregos-demo-fakes
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.demoFakes.port }}
      targetPort: http
{{- end }}
