# The plan asks for Dependabot or Renovate from the day the repository is created
# (`docs/plan/07-delivery-parallelisation-conventions.md` §Bootstrap).
#
# Everything is grouped. The experience next door, on `VargaFoundation/ecphoria`, is clear: without
# groups, nineteen open PRs in a month, several impossible to merge on their own —
# three RustCrypto bumps that were a single change, five actions that were only
# one runtime migration. An upgrade that touches four packages at once is **one**
# decision, not four.
version: 2
updates:
  # Third-party CI actions: supply-chain hygiene.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # Python: the uv workspace at the root (packages/*, apps/api, apps/orchestrator, tools).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      # Temporal, its SDK and the activities built on it move together.
      temporal:
        patterns: ["temporalio*"]
      # The HTTP and validation stack: httpx, pydantic and fastapi share types.
      web-stack:
        patterns: ["fastapi*", "starlette*", "uvicorn*", "httpx*", "pydantic*"]
      # The rest, minor and patch only. Majors stay on their own, so they get read.
      python-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Front Next.js (pnpm).
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    groups:
      next:
        patterns: ["next", "react", "react-dom", "@types/react*", "eslint-config-next"]
      web-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Base images of the five Dockerfiles. A single PR: four share `python:3.12-slim`, the
  # console starts from `node:24`, and moving them out of step with each other makes no sense. An upgrade to
  # a Node version that is not LTS gets closed: the rule is in `docker/README.md`.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
