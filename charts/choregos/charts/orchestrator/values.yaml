enabled: true
image:
  repository: choregos-orchestrator
  tag: ""
  digest: ""
queues:
  - name: orchestrator
    replicas: 2
    resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
  - name: executor
    replicas: 2
    resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
  - name: tracker
    replicas: 2
    resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
  - name: memory
    replicas: 1
    resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
runner:
  image: choregos-runner
  tag: "1.0.0"
  namespacePattern: "proj-{slug}-runners"
  executor: tekton

# Secondes pendant lesquelles un worker reste accroché à un nœud devenu injoignable avant d'être
# évincé. Le défaut de Kubernetes est 300 : mesuré sur cluster, cela fait 359 s d'immobilité après
# la perte d'un nœud, contre 74 s ici. Un worker est remplaçable et Temporal reprend son travail.
# `0` rend le comportement par défaut de Kubernetes.
unreachableTolerationSeconds: 20
