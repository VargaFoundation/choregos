apiVersion: choregos.dev/v1alpha1
kind: ObjectType
metadata: {name: group, displayName: Group, description: "A directory group; a sensitive group opens on a re-authenticated approval.", owner: it}
spec:
  datasource: groups
  primaryKey: name
  titleProperty: name
  properties:
    name: {type: string, required: true}
    sensitive: {type: boolean, required: true}
    description: {type: string}
