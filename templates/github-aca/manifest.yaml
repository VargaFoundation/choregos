apiVersion: choregos/v1
kind: Template
metadata:
  name: github-aca
  version: 1.0.0
  display: GitHub · Azure Container Apps · Argo CD
  description: >-
    Agent runs execute as Azure Container Apps *jobs*: no cluster to keep for the runners,
    per-second billing, one job per run for isolation. Work items stay in GitHub Issues and
    Projects v2, and the application is deployed through Argo CD. The template for a company on
    Azure that does not want a Kubernetes pool dedicated to agents.
requires:
  connectors:
    tracker: github-issues
    scm: github
    ci: tekton
    cd: argocd
    runtime: aca
  azure_capabilities:
    - "Microsoft.App/managedEnvironments"
    - "Microsoft.ManagedIdentity/userAssignedIdentities"
    - "Microsoft.ContainerRegistry/registries?"
    - "Microsoft.OperationalInsights/workspaces?"
defaults:
  workflow: template:default-simple@1
  policy: preset:solo
  models: platform-defaults
  # `claude-code` : OpenHands a été retiré, faute d'agent ACP en ligne de commande
  # (docs/adr/0011-retrait-d-openhands.md).
  agent: claude-code
inputs:
  - { name: repo, type: github-repo, required: true, description: "owner/name of the application repository" }
  - { name: default_branch, type: string, default: main }
  - { name: language, type: enum, values: [python, node, go, java, dotnet, other], default: python }
  - { name: envs, type: list, default: [dev, staging, prod] }
  - { name: subscription_id, type: string, required: true, description: "Azure subscription of the runs" }
  - { name: resource_group, type: string, required: true, description: "resource group of the jobs" }
  - { name: environment_id, type: string, required: true, description: "ARM id of the ACA Managed Environment" }
  - { name: identity_id, type: string, description: "managed identity that pulls the runner image" }
  - { name: registry_server, type: string, description: "registry of the runner image (e.g. acme.azurecr.io)" }
  - { name: log_analytics_workspace_id, type: string, description: "Log Analytics workspace for the run logs" }
  - { name: gitops_repo, type: string, description: "GitOps repository of the environments" }
  - { name: project_number, type: int, description: "number of the Projects v2 board" }
  - { name: slack_channel, type: string, default: "#choregos" }
steps:
  - github.install_app
  - github.ensure_labels
  - github.ensure_project_board: { fields: [Status, "Cost (€)", Size, Risk, Run] }
  - github.ensure_issue_template
  - aca.check_environment
  - aca.check_identity
  - gitops.write_project_manifests: { path: "projects/{{slug}}/" }
  - gitops.open_pr_or_commit
  - argocd.wait_synced: { apps: ["choregos-project-{{slug}}"] }
  - github.ensure_webhooks:
      events: [issues, issue_comment, projects_v2_item, pull_request, pull_request_review, check_suite]
  - repo.scaffold_pr:
      files:
        - AGENTS.md
        - .choregos/workflow.yaml
        - .choregos/policy.yaml
        - .github/PULL_REQUEST_TEMPLATE.md
        - CODEOWNERS
  - memory.create_tenant
  - memory.initial_import: { sources: [readme, docs, adr, "closed_issues:365d", "merged_prs:365d"] }
  - gateway.create_team_and_budget
  - notify.test_message
scaffold: ./scaffold
