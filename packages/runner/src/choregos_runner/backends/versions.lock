# Versions des agents ACP installées dans l'image `choregos-runner`.
# Renovate propose les montées ; chaque bump passe par la suite de conformité (S2-11).
#
# Une ligne annotée `# renovate: datasource=… depName=…` est suivie automatiquement.
# Les autres sont épinglées à la main tant que leur source amont n'est pas confirmée :
# mieux vaut un suivi manquant qu'un dépôt inventé sur lequel Renovate ouvrirait des PR
# fausses.
# Les quatre agents ci-dessous sont ceux que `docker/runner.Dockerfile` installe vraiment ;
# les autres lignes décrivent des backends supportés dont l'image ne porte pas le binaire.
# Trivy a refusé l'image sur cinq CRITICAL venus de ces épingles, dont une exécution de code
# à distance dans `@google/gemini-cli` (GHSA-wpqr-6v78-jr5g), corrigée en 0.39.1. Toutes sont
# montées à la version publiée du jour ; la conformité ACP (S2-11) les juge en nocturne.
# OpenHands reste en 0.59 : la 1.x a retiré `openhands acp` (agent ACP sur stdio) au profit
# d'un `agent-server` HTTP — le backend `openhands.py` serait à réécrire, ce n'est pas une
# montée d'épingle. Les dépendances transitives que Trivy refuse sont montées séparément dans
# le Dockerfile. Voir docs/plan/BLOCKERS.md.
# renovate: datasource=github-releases depName=All-Hands-AI/OpenHands
openhands=0.59.0
claude-agent-acp=0.16.2
codex-acp=0.4.2
# renovate: datasource=github-releases depName=google-gemini/gemini-cli
gemini-cli=0.60.0
# renovate: datasource=github-releases depName=block/goose
goose=1.9.0
# renovate: datasource=github-releases depName=sst/opencode
# 0.8.3 n'a jamais existé sur npm : la ligne 0.8 de `opencode-ai` s'arrête à 0.8.0. Le premier
# build de l'image dans une CI l'a dit (`npm error notarget`) ; personne ne l'avait entendu
# parce que l'installation était suivie d'un `|| echo`. 0.8.0 porte CVE-2026-22813, corrigée
# en 1.1.10 — d'où la 1.x et non le plus proche voisin de l'épingle d'origine.
opencode=1.18.31
copilot-cli=0.3.0
