openapi: 3.1.0
info:
  title: Choregos API
  version: 0.15.0
  description: |
    API de la plateforme Choregos. Le front et le CLI ne consomment que cette API.
    Auth : session OIDC (cookie) ou `Authorization: Bearer <api_token>`.
    Les routes `/internal/*` sont réservées aux runners et authentifiées par un JWT de run (ES256).
    Erreurs : RFC 9457 (`application/problem+json`). Pagination par curseur (`cursor`, `limit`).
  license: { name: Apache-2.0, url: https://www.apache.org/licenses/LICENSE-2.0 }
servers:
  - url: /api/v1
    description: Base de l'API
security:
  - session: []
  - bearer: []
tags:
  - { name: session }
  - { name: projects }
  - { name: connectors }
  - { name: workflows }
  - { name: models }
  - { name: work-items }
  - { name: runs }
  - { name: trains }
  - { name: findings }
  - { name: memory }
  - { name: costs }
  - { name: templates }
  - { name: admin }
  - { name: agents }
  - { name: ui }
  - { name: webhooks }
  - { name: internal }
paths:
  /me:
    get:
      tags: [session]
      operationId: getMe
      summary: Utilisateur courant, organisations et rôles
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/tokens:
    get:
      tags: [session]
      operationId: listMyTokens
      summary: Les jetons d'API de l'appelant (jamais leur valeur)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ApiToken" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [session]
      operationId: createMyToken
      summary: Émet un jeton porteur ; le clair n'est rendu qu'une fois
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ApiTokenCreate" } } }
      responses:
        "201": { description: Créé, content: { application/json: { schema: { $ref: "#/components/schemas/ApiTokenCreated" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /me/tokens/{id}:
    delete:
      tags: [session]
      operationId: revokeMyToken
      summary: Révoque un jeton de l'appelant
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Révoqué }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /auth/login:
    get:
      tags: [session]
      operationId: authLogin
      security: []
      summary: Redirige vers l'IdP OIDC
      parameters:
        - { name: redirect_to, in: query, schema: { type: string } }
      responses:
        "307": { description: Redirection vers l'IdP }
  /auth/callback:
    get:
      tags: [session]
      operationId: authCallback
      security: []
      summary: Callback OIDC (code → session)
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        "307": { description: Redirection vers l'application }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/logout:
    post:
      tags: [session]
      operationId: authLogout
      responses: { "204": { description: Session fermée } }
  /orgs:
    get:
      tags: [projects]
      operationId: listOrgs
      summary: Les organisations de l'appelant, avec son rôle
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Org" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [projects]
      operationId: createOrg
      summary: Crée une organisation ; l'appelant en devient administrateur
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OrgCreate" } } }
      responses:
        "201": { description: Créée, content: { application/json: { schema: { $ref: "#/components/schemas/Org" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /orgs/{org}/projects:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [projects]
      operationId: listProjects
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectPage" } } } }
    post:
      tags: [projects]
      operationId: createProject
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectCreate" } } }
      responses:
        "201": { description: Créé, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /projects/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [projects]
      operationId: getProject
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [projects]
      operationId: updateProject
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectUpdate" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [projects]
      operationId: deleteProject
      responses: { "204": { description: Archivé }, "409": { $ref: "#/components/responses/Conflict" } }
  /projects/{id}/provision:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [projects]
      operationId: provisionProject
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/ProvisionRequest" } } }
      responses:
        "202": { description: Provisioning démarré, content: { application/json: { schema: { $ref: "#/components/schemas/ProvisionStatus" } } } }
    get:
      tags: [projects]
      operationId: getProvisionStatus
      summary: État du provisioning (SSE si Accept text/event-stream)
      responses:
        "200":
          description: OK
          content:
            application/json: { schema: { $ref: "#/components/schemas/ProvisionStatus" } }
            text/event-stream: { schema: { type: string } }
  /projects/{id}/suspend:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [projects]
      operationId: suspendProject
      responses: { "200": { description: Suspendu, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } } }
  /projects/{id}/connectors:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [connectors]
      operationId: listConnectors
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Connector" } } } } }
  /projects/{id}/connectors/{kind}:
    parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/ConnectorKind" }]
    put:
      tags: [connectors]
      operationId: putConnector
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ConnectorUpsert" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Connector" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /projects/{id}/connectors/{kind}/test:
    parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/ConnectorKind" }]
    post:
      tags: [connectors]
      operationId: testConnector
      responses:
        "200": { description: Résultat du test, content: { application/json: { schema: { $ref: "#/components/schemas/ConnectorTestResult" } } } }
  /connectors/types:
    get:
      tags: [connectors]
      operationId: listConnectorTypes
      description: Les types que le registre connaît — ceux du cœur et ceux des greffons — avec leurs capacités, le schéma de leur configuration et leurs champs secrets (ADR 0034).
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ConnectorType" } } } } }
  /projects/{id}/requirements:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [connectors]
      operationId: listProjectRequirements
      description: Ce que les workflows actifs du projet exigent de ses connecteurs, et pourquoi ; le connecteur qui couvre chaque capacité, sinon le type par défaut de la plateforme (ADR 0034).
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProjectRequirement" } } } } }
  /orgs/{org}/connectors:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [connectors]
      operationId: listOrgConnectors
      description: Les connecteurs de l'organisation et leurs opérations (ADR 0034) ; ses membres les lisent.
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/OrgConnector" } } } } }
    post:
      tags: [connectors]
      operationId: createOrgConnector
      description: Une instance naît avec les opérations que son type déclare — une lecture permise, une écriture soumise à validation. L'administrateur de l'organisation seul.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OrgConnectorCreate" } } }
      responses:
        "201": { description: Déclaré, content: { application/json: { schema: { $ref: "#/components/schemas/OrgConnector" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/connectors/{name}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [connectors]
      operationId: getOrgConnector
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/OrgConnector" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [connectors]
      operationId: deleteOrgConnector
      responses:
        "204": { description: Retiré, avec ses opérations }
        "403": { $ref: "#/components/responses/Forbidden" }
  /orgs/{org}/connectors/{name}/discover:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: name, in: path, required: true, schema: { type: string } }
    post:
      tags: [connectors]
      operationId: discoverConnectorOperations
      description: Demande au serveur MCP ses outils et en tire le diff — un outil nouveau naît fermé (forbidden), un schéma qui dérive referme l'opération, un outil retiré disparaît (ADR 0034).
      responses:
        "200": { description: Le diff, content: { application/json: { schema: { $ref: "#/components/schemas/ConnectorDiscovery" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502": { description: Le serveur n'a pas répondu, ou a refusé la clé du connecteur }
  /orgs/{org}/connectors/{name}/operations/{operation}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: name, in: path, required: true, schema: { type: string } }
      - { name: operation, in: path, required: true, schema: { type: string } }
    patch:
      tags: [connectors]
      operationId: updateConnectorOperation
      description: La politique, les groupes de projets, le prix d'une opération — la décision de l'administrateur de l'organisation (le second verrou de l'ADR 0014).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OperationPatch" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ConnectorOperation" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/operations:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [connectors]
      operationId: listProjectOperations
      description: Les opérations ouvertes au projet (leurs groupes croisent les siens), avec la politique de l'organisation, la sienne et l'effective.
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProjectOperation" } } } } }
  /projects/{id}/operations/{connector}/{operation}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: connector, in: path, required: true, schema: { type: string } }
      - { name: operation, in: path, required: true, schema: { type: string } }
    put:
      tags: [connectors]
      operationId: tightenProjectOperation
      description: Un projet resserre une opération ; il ne l'élargit jamais (422).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectOperationPut" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectOperation" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [connectors]
      operationId: relaxProjectOperation
      description: Retire ce que le projet resserrait ; l'opération revient à la politique de l'organisation.
      responses:
        "204": { description: Retiré }
  /projects/{id}/actions:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [actions]
      operationId: listActions
      parameters:
        - { name: status, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: Les actions du projet et le journal de leurs effets, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Action" } } } } }
    post:
      tags: [actions]
      operationId: proposeAction
      description: Une action gouvernée en attente de décision (ADR 0035). Ses effets doivent être déclarés (`declarer_un_effet`) ; rien ne s'exécute avant l'approbation.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ActionCreate" } } }
      responses:
        "201": { description: Proposée, content: { application/json: { schema: { $ref: "#/components/schemas/Action" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/actions:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [actions]
      operationId: listOrgActions
      description: La boîte des décisions — les actions des projets de l'organisation que l'appelant voit ; `status=pending_approval` pour ce qui attend quelqu'un.
      parameters:
        - { name: status, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Action" } } } } }
  /projects/{id}/actions/{action_id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: action_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [actions]
      operationId: getAction
      responses:
        "200": { description: L'action et son journal, content: { application/json: { schema: { $ref: "#/components/schemas/Action" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/actions/{action_id}/decision:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: action_id, in: path, required: true, schema: { type: string } }
    post:
      tags: [actions]
      operationId: decideAction
      description: Approuver (session humaine récente — 401 `step_up_required` sinon) ou rejeter (avec une raison). Qui propose ne décide pas ; de deux approbations simultanées une seule démarre `action-<id>` dans Temporal, et rien ne s'exécute dans cette requête.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ActionDecision" } } }
      responses:
        "200": { description: Décidée, content: { application/json: { schema: { $ref: "#/components/schemas/Action" } } } }
        "401": { description: "Authentification trop ancienne : `errors[0].error` vaut `step_up_required`" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /projects/{id}/workflow:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [workflows]
      operationId: getWorkflow
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowDef" } } } }
    put:
      tags: [workflows]
      operationId: putWorkflow
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowPut" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowDef" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /projects/{id}/workflows:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [workflows]
      operationId: listWorkflows
      summary: Les workflows du projet — un actif par nom, le défaut marqué (ADR 0031)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/WorkflowSummary" } } } } }
  /projects/{id}/workflows/{name}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [workflows]
      operationId: getNamedWorkflow
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowDef" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [workflows]
      operationId: putNamedWorkflow
      summary: Publie la version suivante de CE workflow ; `base_version` périmée → 409
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowPut" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowDef" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /projects/{id}/workflows/{name}/deactivate:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: name, in: path, required: true, schema: { type: string } }
    post:
      tags: [workflows]
      operationId: deactivateWorkflow
      summary: Désactive un workflow ; refusé pour le défaut ou une cible de routage. Les tickets épinglés finissent sur leur version
      responses:
        "204": { description: Désactivé }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{id}/workflows/{name}/versions:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [workflows]
      operationId: listWorkflowVersions
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/WorkflowDef" } } } } }
  /projects/{id}/workflows/{name}/versions/{version}/restore:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: name, in: path, required: true, schema: { type: string } }
      - { name: version, in: path, required: true, schema: { type: integer } }
    post:
      tags: [workflows]
      operationId: restoreWorkflowVersion
      summary: Republie une ancienne version comme la suivante — rien n'est écrasé
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowDef" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/workflow-routing:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [workflows]
      operationId: getWorkflowRouting
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowRouting" } } } }
    put:
      tags: [workflows]
      operationId: putWorkflowRouting
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowRouting" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowRouting" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /workflows/validate:
    post:
      tags: [workflows]
      operationId: validateWorkflow
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowValidateRequest" } } }
      responses:
        "200": { description: Rapport de validation, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowValidation" } } } }
  /workflows/edit:
    post:
      tags: [workflows]
      operationId: editWorkflow
      description: >-
        Applique des opérations typées à un YAML de workflow, greffées dans le texte : le reste du
        document, commentaires et style compris, ne bouge pas. Rien n'est enregistré ; `inverse`
        défait les opérations, dans l'ordre où le jouer (ADR 0031).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowEditRequest" } } }
      responses:
        "200": { description: Le texte édité, validé, et son inverse, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowEditResult" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /ui/admin-sections:
    get:
      tags: [ui]
      operationId: listAdminSections
      description: >-
        Les sections d'administration que les greffons déclarent (ADR 0032), filtrées par la
        permission et la portée de l'appelant ; `org` restreint celles d'organisation à celle-là.
      parameters:
        - { name: org, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: Les sections visibles, content: { application/json: { schema: { type: array, items: { $ref: "./schemas/ui-manifest.schema.json" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /workflows/templates:
    get:
      tags: [workflows]
      operationId: listWorkflowTemplates
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/WorkflowTemplate" } } } } }
  /projects/{id}/policy:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [workflows]
      operationId: getPolicy
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PolicyDef" } } } }
    put:
      tags: [workflows]
      operationId: putPolicy
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PolicyPut" } } }
      responses:
