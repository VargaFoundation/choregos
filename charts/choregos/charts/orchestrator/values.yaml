enabled: true
image:
  # Vide : `global.imageRegistry`. Un autre registre — les images `-ee` de l'édition entreprise,
  # servies par un projet privé — se pose ici, composant par composant.
  registry: ""
  repository: choregos-orchestrator
  tag: ""
  digest: ""
queues:
  - name: orchestrator
    replicas: 2
    resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
  - name: executor
    replicas: 2
    resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
  - name: tracker
    replicas: 2
    resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
  - name: memory
    replicas: 1
    resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
runner:
  image: choregos-runner
  # Vide, comme `image.tag` juste au-dessus : le tag suit `global.imageTag`. Il valait `1.0.0`
  # en dur — une version qui n'existe dans aucune installation — et ne tenait que parce que
  # l'umbrella le réécrivait à `""`. Le jour où cette réécriture a disparu (2026-09-27, une coupe
  # un peu large), les pods d'agent ont repointé sur une image absente. Un défaut qui n'est correct
  # que grâce à un correctif ailleurs n'est pas un défaut, c'est un piège.
  tag: ""
  namespacePattern: "proj-{slug}-runners"
  executor: tekton
  runtimeClass: ""
  egressProxy: "http://choregos-egress.{namespace}.svc:3128"
  egressImage: ""
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Secondes pendant lesquelles un worker reste accroché à un nœud devenu injoignable avant d'être
# évincé. Le défaut de Kubernetes est 300 : mesuré sur cluster, cela fait 359 s d'immobilité après
# la perte d'un nœud, contre 74 s ici. Un worker est remplaçable et Temporal reprend son travail.
# `0` rend le comportement par défaut de Kubernetes.
unreachableTolerationSeconds: 20
