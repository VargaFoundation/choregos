{{- if and .Values.enabled .Values.global.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.global.apiSecretRef }}
  labels: {{- include "choregos.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.global.externalSecrets.refreshInterval }}
  secretStoreRef: { name: {{ .Values.global.externalSecrets.storeRef }}, kind: ClusterSecretStore }
  target: { name: {{ .Values.global.apiSecretRef }}, creationPolicy: Owner }
  data:
    {{- $keys := list "session-secret" "run-token-private-key" "run-token-public-key" "github-webhook-secret" "generic-webhook-secret" "github-app-id" "github-app-private-key" "github-app-client-id" "github-app-client-secret" }}
    {{- if .Values.global.secrets.keksInExternalSecret }}{{ $keys = append $keys (.Values.global.secrets.keksKey | default "secrets-keks") }}{{ end }}
    {{- range $key := $keys }}
    - secretKey: {{ $key }}
      remoteRef: { key: choregos/api, property: {{ $key }} }
    {{- end }}
{{- end }}
