      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200": { description: Already there, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeDocument" } } } }
        "202": { description: Accepted for conversion, content: { application/json: { schema: { $ref: "#/components/schemas/KnowledgeDocument" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { description: Larger than the deployment's cap, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /orgs/{org}/knowledge/{slug}/documents/{document_id}:
    parameters:
      - { $ref: "#/components/parameters/Org" }
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: document_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [knowledge]
      operationId: getKnowledgeDocument
