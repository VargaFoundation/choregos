# Ecphoria — the platform's memory, wave 2 (after the operators, before the workloads).
#
# The chart lives in `VargaFoundation/ecphoria` (`deploy/helm/ecphoria`): a StatefulSet with three
# Raft replicas, a headless service for peer discovery, a PDB. It was rendered and
# accepted by a real API server — see `docs/plan/STATUS.md`, S7-06.
#
# Without Ecphoria, the platform works: `memory.pgvector` implements the same interface and the
# context pack degrades to an empty pack (docs/plan/04). That is why this Application can be
# removed without breaking anything else.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecphoria
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '2'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/VargaFoundation/ecphoria.git
    # A tag, not `main`: every other application here points at a version (`0.23.0`, `3.3.4`,
    # ...), and the ClusterPolicy `choregos-image-tags` refuses moving image references.
    # Following `main` did exactly what is forbidden elsewhere: a deployment that changes
    # without anyone deciding it. The chart takes its image from its `appVersion`, so this tag
    # pins both.
    targetRevision: v0.2.5
    path: deploy/helm/ecphoria
    helm:
      values: |
        replicaCount: 3
        config:
          memory:
            cognition:
              # The bench at the Choregos profile (20,000 facts, 200,000 events, 50 reads/s)
              # measures 540 ms p95 at the default of 2048, and 24 ms at 512 — with no measurable
              # recall cost at this corpus size (kb_eval: R@5 86.1% against 84.7%).
              # The upstream default is sized for a corpus ten times larger: measure again
              # with `kb_eval` if ours exceeds ~50,000 memories.
              # See docs/benchmarks-choregos.md in VargaFoundation/ecphoria.
              retrievalScanCap: 512
            governance:
              tenants:
                # `warn` first: Choregos's writes already carry
                # `provenance.source` and a typed `kind`, but a single counter-example is enough to
                # block a run. We watch `ecphoria_fact_validation_failures_total` for a
                # week, then switch to `strict` and `requireProvenance: true`.
                choregos:
                  factValidation: warn
          gateway:
            authEnabled: true
            # The keys come from the vault through External Secrets. The chart accepts hashed
            # entries (`sha256:<hex>@tenant:role`): nothing decipherable goes through Argo.
            apiKeys: []
          embedding:
            # The platform's gateway also serves the embeddings: a single place where the
            # cost is measured and the rate is limited (docs/plan/04 §4.2).
            provider: openai_compatible
            openaiBaseUrl: http://litellm.choregos-gateway:4000/v1
            model: platform/embed
            dimension: 1536
  destination:
    server: https://kubernetes.default.svc
    namespace: choregos-memory
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
