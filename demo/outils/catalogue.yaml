# Tool catalogue of the demonstration.
#
# A catalogue is a SHORT, CHOSEN list, written by whoever deploys and reviewed like code.
# This file is not a directory: it is the list of third-party APIs that the agents of THIS
# deployment may call — through the platform, never by themselves.
#
# This one holds a single tool, on purpose: the French government's Address API, public and
# keyless. It lets us show the whole chain (the agent names a tool, the platform calls it,
# the call is capped and counted) without asking anyone for an account.
#
# A paid tool would look like this, the key staying in the API's environment:
#
#   - name: recherche_profils
#     provider: un-annuaire
#     http:
#       url: https://api.exemple/v1/search
#       query: { q: "{{ metier }}" }
#       headers: { Authorization: "Bearer {{ credential }}" }
#     credential_env: ANNUAIRE_API_KEY   # the NAME of the variable, never the key
#     price_eur: 0.02
outils:
  - name: verifier_adresse
    description: >-
      Normalises a French postal address and returns its official form, its postcode and its
      municipality. Use it to check an address given in a file rather than copying it as is.
    provider: api-adresse-data-gouv
    categories: [administratif]
    input_schema:
      type: object
      required: [adresse]
      properties:
        adresse:
          type: string
          description: The address to check, as it appears in the file.
    http:
      method: GET
      url: https://api-adresse.data.gouv.fr/search/
      query:
        q: "{{ adresse }}"
        limit: "1"
    # No key: the API is public. The price is zero, but the call is counted all the same —
    # a free quota runs out too, and an agent that loops shows.
    price_eur: 0.0
