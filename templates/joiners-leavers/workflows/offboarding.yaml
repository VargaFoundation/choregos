# A leaver: on day 0 the account is disabled, its sessions revoked and the badge cut — in a single
# governed gesture; then the laptop is collected, received (a task, its proof) and wiped; then the
# check. A person's file of evidence is the history of their ticket: every action, every decision,
# every attestation.
apiVersion: choregos/v1
kind: Workflow
metadata:
  name: offboarding
  version: 1
  description: A leaver — on the last day the account, sessions and badge are cut; the laptop is collected, received and wiped.
  inputs:
    type: object
    required: [full_name, upn, last_day, badge_uid, serial, address]
    properties:
      full_name: { type: string, title: Full name }
      upn: { type: string, title: Sign-in name (UPN) }
      last_day: { type: string, format: date, title: Last day }
      badge_uid: { type: string, title: Badge UID }
      serial: { type: string, title: Laptop serial number }
      address: { type: string, title: Laptop pick-up address }
      laptop_condition: { type: string, title: Condition of the returned laptop }
initial: announced
actors:
  coordinator: { type: agent, role: coordination, agent: offboarding-coordinator, max_turns: 30, max_minutes: 15 }
  hr: { type: human, group: hr, sla_hours: 24 }
  it: { type: human, group: it, sla_hours: 48 }
  platform: { type: system }
states:
  announced: { display: Leave announced, kind: wait }
  planned: { display: Leaver plan proposed, kind: wait }
  approved: { display: Plan approved, kind: wait }
  access_cut: { display: Access cut, kind: wait }
  pickup_scheduled: { display: Laptop pick-up scheduled, kind: wait }
  laptop_received: { display: Laptop received, kind: wait }
  laptop_wiped: { display: Laptop wiped, kind: wait }
  needs_review: { display: To review, kind: wait }
  closed: { display: Leaver closed, terminal: true }
transitions:
  - id: t-plan
    from: announced
    to: planned
    by: coordinator
    outputs: [leaver_plan]
    gates: [outputs_present]
    on_fail: { to: announced, max_attempts: 2, escalate_to: needs_review }

  - id: t-approve
    from: planned
    to: approved
    by: hr
    on_reject: needs_review

  # Day 0: everything that opens a door closes, together.
  - id: t-cut-access
    from: approved
    to: access_cut
    by: platform
    action:
      kind: offboarding.cut_access
      title: "Cut the access of {{ fields.full_name }}"
      justification: "last day {{ fields.last_day }}"
      params: { upn: "{{ fields.upn }}", uid: "{{ fields.badge_uid }}" }
      effects:
        - effect: connector.call
          with: { connector: directory, operation: disable_user, arguments: { upn: "{{ params.upn }}" } }
        - effect: connector.call
          with: { connector: directory, operation: revoke_sessions, arguments: { upn: "{{ params.upn }}" } }
        - effect: connector.call
          with: { connector: badge-readers, operation: deactivate_badge, arguments: { uid: "{{ params.uid }}" } }
      not_before: fields.last_day
    on_fail: { to: approved, max_attempts: 3, escalate_to: needs_review }

  - id: t-schedule-pickup
    from: access_cut
    to: pickup_scheduled
    by: platform
    action:
      kind: offboarding.pickup
      title: "Collect laptop {{ fields.serial }}"
      params: { reference: "{{ work_item.key }}-return", address: "{{ fields.address }}" }
      effects:
        - effect: connector.call
          with:
            connector: carrier
            operation: create_return
            arguments: { reference: "{{ params.reference }}", address: "{{ params.address }}" }
    on_fail: { to: access_cut, max_attempts: 2, escalate_to: needs_review }

  - id: t-receive-laptop
    from: pickup_scheduled
    to: laptop_received
    by: it
    task:
      title: Receive the laptop
      instructions: Check that the serial number received is the one of the collected laptop, and record its condition.
      form:
        type: object
        required: [laptop_condition]
        properties:
          laptop_condition: { type: string, title: Condition of the returned laptop, enum: [intact, damaged, missing] }
      attest: I received this laptop and checked its serial number
    on_reject: needs_review

  - id: t-wipe-laptop
    from: laptop_received
    to: laptop_wiped
    by: platform
    action:
      kind: offboarding.wipe
      title: "Wipe laptop {{ fields.serial }}"
      params: { serial: "{{ fields.serial }}" }
      effects:
        - effect: connector.call
          with: { connector: devices, operation: wipe_device, arguments: { serial: "{{ params.serial }}" } }
    on_fail: { to: laptop_received, max_attempts: 2, escalate_to: needs_review }

  - id: t-check
    from: laptop_wiped
    to: closed
    by: platform
    action:
      kind: offboarding.check
      title: "Check the offboarding of {{ fields.full_name }}"
      params: { upn: "{{ fields.upn }}", uid: "{{ fields.badge_uid }}", serial: "{{ fields.serial }}" }
      effects:
        - effect: connector.call
          with: { connector: directory, operation: get_user, arguments: { upn: "{{ params.upn }}" } }
        - effect: connector.call
          with: { connector: badge-readers, operation: badge_status, arguments: { uid: "{{ params.uid }}" } }
        - effect: connector.call
          with: { connector: devices, operation: device_status, arguments: { serial: "{{ params.serial }}" } }
        - effect: check
          with:
            condition: >-
              {{ (effects[0].user is none or not effects[0].user.accountEnabled)
                 and not effects[1].active and effects[2].state == 'wiped' }}
            reason: the account disabled, the badge cut, the laptop wiped
    on_fail: { to: laptop_wiped, max_attempts: 2, escalate_to: needs_review }
