[project]
name = "choregos-agent-sdk"
version = "0.20.5"
description = "Write a Choregos agent in Python: an ACP agent without the protocol"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
keywords = ["agents", "acp", "mcp", "choregos"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  # The official ACP SDK: the JSON-RPC connection, the schema models. Pinned exactly.
  "agent-client-protocol==0.12.1",
  # The MCP client the tools go through.
  "mcp>=1.20",
  # The OpenAI-compatible client of `ctx.llm` (the gateway speaks that API).
  "openai==3.37.0",
  "choregos-contracts==0.20.5",
]

[project.urls]
Homepage = "https://github.com/VargaFoundation/choregos"
Documentation = "https://github.com/VargaFoundation/choregos/blob/main/docs/code-agents.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/choregos_agent_sdk"]
