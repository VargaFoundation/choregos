# A task workflow of the fixture assistant (S63-19): one agent writes one document, then the work item closes.
apiVersion: choregos/v1
kind: Workflow
metadata:
  name: threshold-alert
  version: 1
  description: An alert when a watched value crosses its threshold.
initial: open
actors:
  analyst: { type: agent, role: analysis, agent: investment-analyst, max_turns: 10, max_minutes: 5 }
states:
  open: { display: Open, kind: wait }
  done: { display: Done, terminal: true }
transitions:
  - id: t-alert
    from: open
    to: done
    by: analyst
    outputs: [alert]
    gates: [outputs_present]
