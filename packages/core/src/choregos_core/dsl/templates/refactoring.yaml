# A refactoring (S59-02): behaviour must not change. A planner writes the steps and the test that proves
# each; the developer refactors inside them; QA derives the edge cases and runs mutation testing on the
# changed code, so the tests prove the behaviour is kept; a reviewer and a maintainer approve.
apiVersion: choregos/v1
kind: Workflow
metadata:
  name: refactoring
  version: 1
  catalogue:
    title: Refactoring without behaviour change
    summary: "Technical debt paid without changing behaviour: a plan of small steps, the refactoring, QA with mutation testing on the changed code, an agent review, a pull request approved by a maintainer, the release train to production and a production check."
    tags: [software, development, refactoring, production]
  description: "Refactoring: plan, implementation, QA with mutation testing, agent review, pull request approved by a maintainer, release train, production check."
initial: inbox
actors:
  planner: { type: agent, role: plan, agent: planner, model: "profile:standard" }
  developer: { type: agent, role: implement, agent: developer, model: "profile:standard" }
  tester: { type: agent, role: verify, agent: qa, model: "profile:standard" }
  reviewer: { type: agent, role: review, agent: reviewer, model: "profile:standard", fresh_context: true }
  responder: { type: agent, role: address_review, agent: review-responder, model: "profile:standard" }
  ci_fixer: { type: agent, role: fix_ci, agent: ci-fixer, model: "profile:standard" }
  prod_verifier: { type: agent, role: verify_prod, agent: prod-verifier, model: "profile:standard" }
  platform: { type: system }
  maintainers: { type: human, group: maintainers, sla_hours: 24 }
states:
  inbox: { display: To plan, kind: wait, tracker: { status: Todo } }
  planned: { display: Planned, tracker: { status: Ready } }
  implemented: { display: Refactored, tracker: { status: In progress } }
  tested: { display: Tested, tracker: { status: In progress } }
  reviewed: { display: Reviewed by an agent, tracker: { status: In review } }
  addressing_review: { display: Addressing the review, tracker: { status: In progress } }
  awaiting_pr_approval: { display: Pull request to approve, kind: wait, tracker: { status: In review } }
  pr_approved: { display: Pull request approved, tracker: { status: In review } }
  fixing_ci: { display: Fixing the CI, tracker: { status: In progress } }
  integrated: { display: Merged, tracker: { status: Merged } }
  live: { display: In production, production: true, tracker: { status: Deployed } }
  verified: { display: Verified in production, terminal: true, tracker: { status: Done } }
  needs_human: { display: Needs a human, kind: wait, tracker: { status: Blocked } }
  abandoned: { display: Abandoned, terminal: true, tracker: { status: Cancelled } }
transitions:
  - id: t-plan
    from: inbox
    to: planned
    by: planner
    inputs: [human_feedback]
    outputs: [plan_markdown]
    on_fail: { to: inbox, max_attempts: 2, escalate_to: needs_human }
  - id: t-implement
    from: planned
    to: implemented
    by: developer
    inputs: [plan_markdown, test_report, human_feedback]
    gates: [scope_respected, no_secrets, { name: diff_size_max, params: { files: 40, lines: 2000 } }]
    on_fail: { to: planned, max_attempts: 3, escalate_to: needs_human }
  - id: t-test
    from: implemented
    to: tested
    by: tester
    outputs: [test_plan, mutation_report, test_report]
    gates: [evidence_present]
    on_fail: { to: planned, max_attempts: 2, escalate_to: needs_human }
  - id: t-review
    from: tested
    to: reviewed
    by: reviewer
    outputs: [review_markdown, verdict]
    gates: [{ name: outputs_in, params: { values: { verdict: [approve] } } }]
    on_changes_requested: { to: addressing_review, max_attempts: 2, escalate_to: needs_human }
  - id: t-address-review
    from: addressing_review
    to: implemented
    by: responder
    inputs: [review_markdown, human_feedback]
    outputs: [review_markdown]
    gates: [scope_respected, no_secrets]
    on_fail: { to: addressing_review, max_attempts: 1, escalate_to: needs_human }
  - id: t-open-pr
    from: reviewed
    to: awaiting_pr_approval
    by: platform
    does: open_pr
    on_fail: { to: reviewed, max_attempts: 2, escalate_to: needs_human }
  - id: t-approve-pr
    from: awaiting_pr_approval
    to: pr_approved
    by: maintainers
    on_reject: addressing_review
  - id: t-merge
    from: pr_approved
    to: integrated
    by: platform
    does: merge_pr
    gates: [ci_green]
    timeout_hours: 24
    on_fail: { to: fixing_ci, max_attempts: 2, escalate_to: needs_human }
  - id: t-fix-ci
    from: fixing_ci
    to: awaiting_pr_approval
    by: ci_fixer
    gates: [scope_respected, no_secrets]
    on_fail: { to: fixing_ci, max_attempts: 1, escalate_to: needs_human }
  - id: t-release
    from: integrated
    to: live
    via: release_train
    train: { env: prod }
    timeout_hours: 72
  - id: t-verify-prod
    from: live
    to: verified
    by: prod_verifier
    outputs: [verdict]
    gates: [{ name: outputs_in, params: { values: { verdict: [approve] } } }, { name: evidence_facts, params: { keys: [smoke_ok], must_be_true: [smoke_ok] } }]
    on_fail: { to: live, max_attempts: 1, escalate_to: needs_human }
  - id: t-abandon
    from: needs_human
    to: abandoned
    by: maintainers
    timeout_hours: 168
defaults:
  from_any_agent_state:
    on_question: needs_human
    on_budget_exceeded: needs_human
    on_timeout: needs_human
  needs_human:
    on_answer: resume
    on_abandon: abandoned
