# At night: full e2e, conformance of every backend, evals, Temporal replay, scans.
name: nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: helm/kind-action@v1
        with:
          config: dev/kind.yaml
          cluster_name: choregos
      - name: CNI that enforces the NetworkPolicy
        # `dev/kind.yaml` disables the default CNI: kindnet accepts the policies and
        # lets the traffic through, which would turn a sandbox that holds nothing green.
        run: |
          kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.2/manifests/calico.yaml
          kubectl -n kube-system rollout status ds/calico-node --timeout=300s
      - run: uv sync --frozen
      - name: milestone scenarios on kind
        run: uv run pytest tests/e2e -m e2e -q
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: e2e-report, path: tests/e2e/report, if-no-files-found: ignore }

  cluster:
    name: What only holds on a real cluster
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: helm/kind-action@v1
        with:
          config: dev/kind.yaml
          cluster_name: choregos
      - name: Calico, CloudNativePG, Argo Rollouts
        run: |
          kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.2/manifests/calico.yaml
          kubectl -n kube-system rollout status ds/calico-node --timeout=300s
          kubectl apply --server-side -f https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.25/releases/cnpg-1.25.1.yaml
          kubectl -n cnpg-system rollout status deploy/cnpg-controller-manager --timeout=300s
          kubectl create namespace argo-rollouts --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -n argo-rollouts -f https://github.com/argoproj/argo-rollouts/releases/download/v1.7.2/install.yaml
          kubectl -n argo-rollouts rollout status deploy/argo-rollouts --timeout=300s
      - run: uv sync --frozen
      - name: API image (the platform stack needs it)
        run: |
          docker build -f docker/api.Dockerfile --target api -t choregos-api:dev .
          kind load docker-image choregos-api:dev --name choregos
      - name: egress, restore, manifests, platform, canary, node loss
        env:
          CHOREGOS_CLUSTER_CONTEXT: kind-choregos
        run: uv run pytest tests/cluster -m cluster -q
      - name: cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl get events -A --sort-by=.lastTimestamp | tail -40

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: all ACP backends
        run: uv run pytest tests/conformance -m conformance -q
      - name: conformance report
        run: uv run python -m tests.conformance.report --output conformance.json
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: conformance, path: conformance.json, if-no-files-found: ignore }

  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: playbook evals (blocking threshold)
        run: uv run python -m choregos_playbooks.evals.runner --all --json evals.json
      - name: evals of the catalogue's agents (S33-06)
        run: uv run python -m choregos_core.catalogue_d_agents.evals --all
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: evals, path: evals.json, if-no-files-found: ignore }

  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: replay of the archived Temporal histories
        run: uv run pytest tests/replay -q

  live:
    # The adapters against the REAL services (LiteLLM, GitLab, Jira, Ecphoria, ACA, Rovo). A
    # service named in CHOREGOS_LIVE_REQUIRED FAILS the job when one of its secrets is missing
    # (tests/live/conftest.py): a vanished secret must not leave the night green. The other
    # services, and the optional companions of a required one (the realtime model), are
    # skipped when their secret is missing — and say so — rather than an empty green dot.
    # Forks have no secrets: the job only runs on the repository itself.
    if: github.repository == 'VargaFoundation/choregos'
    runs-on: ubuntu-latest
    env:
      # The services the night must cover, from the repository variable of the same name (for
      # example `litellm,gitlab,jira`). The owner adds a service once its secrets are set, never
      # before: a service listed without its secrets turns every night red. Unset, every service
      # skips and says so, as before.
      CHOREGOS_LIVE_REQUIRED: ${{ vars.CHOREGOS_LIVE_REQUIRED }}
      CHOREGOS_LIVE_LITELLM_URL: ${{ secrets.CHOREGOS_LIVE_LITELLM_URL }}
      CHOREGOS_LIVE_LITELLM_KEY: ${{ secrets.CHOREGOS_LIVE_LITELLM_KEY }}
      CHOREGOS_LIVE_GITLAB_TOKEN: ${{ secrets.CHOREGOS_LIVE_GITLAB_TOKEN }}
      CHOREGOS_LIVE_GITLAB_PROJECT: ${{ secrets.CHOREGOS_LIVE_GITLAB_PROJECT }}
      CHOREGOS_LIVE_JIRA_URL: ${{ secrets.CHOREGOS_LIVE_JIRA_URL }}
      CHOREGOS_LIVE_JIRA_EMAIL: ${{ secrets.CHOREGOS_LIVE_JIRA_EMAIL }}
      CHOREGOS_LIVE_JIRA_TOKEN: ${{ secrets.CHOREGOS_LIVE_JIRA_TOKEN }}
      CHOREGOS_LIVE_JIRA_PROJECT: ${{ secrets.CHOREGOS_LIVE_JIRA_PROJECT }}
      # Not required: these tests skip, saying so, until the secrets exist.
      CHOREGOS_LIVE_AZURE_TOKEN: ${{ secrets.CHOREGOS_LIVE_AZURE_TOKEN }}
      CHOREGOS_LIVE_AZURE_SUBSCRIPTION: ${{ secrets.CHOREGOS_LIVE_AZURE_SUBSCRIPTION }}
      CHOREGOS_LIVE_AZURE_RG: ${{ secrets.CHOREGOS_LIVE_AZURE_RG }}
      CHOREGOS_LIVE_AZURE_ENV_ID: ${{ secrets.CHOREGOS_LIVE_AZURE_ENV_ID }}
      CHOREGOS_LIVE_ECPHORIA_URL: ${{ secrets.CHOREGOS_LIVE_ECPHORIA_URL }}
      CHOREGOS_LIVE_ECPHORIA_TOKEN: ${{ secrets.CHOREGOS_LIVE_ECPHORIA_TOKEN }}
      CHOREGOS_LIVE_ECPHORIA_TENANT: ${{ secrets.CHOREGOS_LIVE_ECPHORIA_TENANT }}
      CHOREGOS_LIVE_ROVO_ACCESS_TOKEN: ${{ secrets.CHOREGOS_LIVE_ROVO_ACCESS_TOKEN }}
      CHOREGOS_LIVE_REALTIME_MODEL: ${{ secrets.CHOREGOS_LIVE_REALTIME_MODEL }}
      # An organisation's MCP gateway (ADR 0105). Not in CHOREGOS_LIVE_REQUIRED: an unset URL skips,
      # but a URL that is set and unreachable (or without its server or token) fails.
      CHOREGOS_LIVE_MCP_GATEWAY_URL: ${{ secrets.CHOREGOS_LIVE_MCP_GATEWAY_URL }}
      CHOREGOS_LIVE_MCP_GATEWAY_SERVER: ${{ secrets.CHOREGOS_LIVE_MCP_GATEWAY_SERVER }}
      CHOREGOS_LIVE_MCP_GATEWAY_TOKEN: ${{ secrets.CHOREGOS_LIVE_MCP_GATEWAY_TOKEN }}
      CHOREGOS_LIVE_MCP_GATEWAY_ROUTING: ${{ secrets.CHOREGOS_LIVE_MCP_GATEWAY_ROUTING }}
      CHOREGOS_LIVE_MCP_GATEWAY_SERVER_HEADER: ${{ secrets.CHOREGOS_LIVE_MCP_GATEWAY_SERVER_HEADER }}
      CHOREGOS_LIVE_MCP_GATEWAY_AUTH_HEADER: ${{ secrets.CHOREGOS_LIVE_MCP_GATEWAY_AUTH_HEADER }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: adapters against the real services (a required service fails without its secrets)
        run: uv run pytest tests/live -q -m live -rs

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run pip list --format=json > deps.json
      # A CRITICAL blocks — that is what SECURITY.md promised, and `exit-code: 0` made
      # it false; and this job was not in the alert's `needs`.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  alerte:
    needs: [e2e, cluster, conformance, evals, replay, dependencies, live]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            // A nightly failure opens an issue: it does not get lost in the logs.
            const title = `nightly failed — ${new Date().toISOString().slice(0, 10)}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "nightly",
            });
            const body = `The nightly CI failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["nightly", "needs-triage"],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            }
