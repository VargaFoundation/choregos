role: refine
description: >-
  Le playbook de cadrage doit demander une spécification vérifiable, un périmètre minimal
  et l'arrêt en cas de doute produit.
must_contain:
  - "Given / When / Then"
  - "allowed_paths"
  - "Hors périmètre"
  - "rollback"
  - "ask_human"
must_not_contain:
  - "écris du code"
rubric:
  - critere: "demande des critères d'acceptation testables"
    poids: 2
  - critere: "exige un périmètre minimal et justifié"
    poids: 2
  - critere: "prévoit le cas où une décision produit manque"
    poids: 1
min_score: 0.8
