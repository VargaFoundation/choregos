openapi: 3.1.0
info:
  title: Choregos API
  version: 0.4.1
  description: |
    API de la plateforme Choregos. Le front et le CLI ne consomment que cette API.
    Auth : session OIDC (cookie) ou `Authorization: Bearer <api_token>`.
    Les routes `/internal/*` sont réservées aux runners et authentifiées par un JWT de run (ES256).
    Erreurs : RFC 9457 (`application/problem+json`). Pagination par curseur (`cursor`, `limit`).
  license: { name: Apache-2.0, url: https://www.apache.org/licenses/LICENSE-2.0 }
servers:
  - url: /api/v1
    description: Base de l'API
security:
  - session: []
  - bearer: []
tags:
  - { name: session }
  - { name: projects }
  - { name: connectors }
  - { name: workflows }
  - { name: models }
  - { name: work-items }
  - { name: runs }
  - { name: trains }
  - { name: findings }
  - { name: memory }
  - { name: costs }
  - { name: templates }
  - { name: admin }
  - { name: webhooks }
  - { name: internal }
paths:
  /me:
    get:
      tags: [session]
      operationId: getMe
      summary: Utilisateur courant, organisations et rôles
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/tokens:
    get:
      tags: [session]
      operationId: listMyTokens
      summary: Les jetons d'API de l'appelant (jamais leur valeur)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ApiToken" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [session]
      operationId: createMyToken
      summary: Émet un jeton porteur ; le clair n'est rendu qu'une fois
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ApiTokenCreate" } } }
      responses:
        "201": { description: Créé, content: { application/json: { schema: { $ref: "#/components/schemas/ApiTokenCreated" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/tokens/{id}:
    delete:
      tags: [session]
      operationId: revokeMyToken
      summary: Révoque un jeton de l'appelant
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Révoqué }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /auth/login:
    get:
      tags: [session]
      operationId: authLogin
      security: []
      summary: Redirige vers l'IdP OIDC
      parameters:
        - { name: redirect_to, in: query, schema: { type: string } }
      responses:
        "307": { description: Redirection vers l'IdP }
  /auth/callback:
    get:
      tags: [session]
      operationId: authCallback
      security: []
      summary: Callback OIDC (code → session)
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        "307": { description: Redirection vers l'application }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/logout:
    post:
      tags: [session]
      operationId: authLogout
      responses: { "204": { description: Session fermée } }
  /orgs:
    get:
      tags: [projects]
      operationId: listOrgs
      summary: Les organisations de l'appelant, avec son rôle
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Org" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [projects]
      operationId: createOrg
      summary: Crée une organisation ; l'appelant en devient administrateur
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OrgCreate" } } }
      responses:
        "201": { description: Créée, content: { application/json: { schema: { $ref: "#/components/schemas/Org" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /orgs/{org}/projects:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [projects]
      operationId: listProjects
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectPage" } } } }
    post:
      tags: [projects]
      operationId: createProject
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectCreate" } } }
      responses:
        "201": { description: Créé, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /projects/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [projects]
      operationId: getProject
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [projects]
      operationId: updateProject
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectUpdate" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [projects]
      operationId: deleteProject
      responses: { "204": { description: Archivé }, "409": { $ref: "#/components/responses/Conflict" } }
  /projects/{id}/provision:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [projects]
      operationId: provisionProject
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/ProvisionRequest" } } }
      responses:
        "202": { description: Provisioning démarré, content: { application/json: { schema: { $ref: "#/components/schemas/ProvisionStatus" } } } }
    get:
      tags: [projects]
      operationId: getProvisionStatus
      summary: État du provisioning (SSE si Accept text/event-stream)
      responses:
        "200":
          description: OK
          content:
            application/json: { schema: { $ref: "#/components/schemas/ProvisionStatus" } }
            text/event-stream: { schema: { type: string } }
  /projects/{id}/suspend:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [projects]
      operationId: suspendProject
      responses: { "200": { description: Suspendu, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } } }
  /projects/{id}/connectors:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [connectors]
      operationId: listConnectors
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Connector" } } } } }
  /projects/{id}/connectors/{kind}:
    parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/ConnectorKind" }]
    put:
      tags: [connectors]
      operationId: putConnector
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ConnectorUpsert" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Connector" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /projects/{id}/connectors/{kind}/test:
    parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/ConnectorKind" }]
    post:
      tags: [connectors]
      operationId: testConnector
      responses:
        "200": { description: Résultat du test, content: { application/json: { schema: { $ref: "#/components/schemas/ConnectorTestResult" } } } }
  /connectors/types:
    get:
      tags: [connectors]
      operationId: listConnectorTypes
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ConnectorType" } } } } }
  /projects/{id}/workflow:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [workflows]
      operationId: getWorkflow
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowDef" } } } }
    put:
      tags: [workflows]
      operationId: putWorkflow
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowPut" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowDef" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /workflows/validate:
    post:
      tags: [workflows]
      operationId: validateWorkflow
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowValidateRequest" } } }
      responses:
        "200": { description: Rapport de validation, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowValidation" } } } }
  /workflows/templates:
    get:
      tags: [workflows]
      operationId: listWorkflowTemplates
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/WorkflowTemplate" } } } } }
  /projects/{id}/policy:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [workflows]
      operationId: getPolicy
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PolicyDef" } } } }
    put:
      tags: [workflows]
      operationId: putPolicy
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PolicyPut" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PolicyDef" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /platform/models:
    get:
      tags: [models]
      operationId: listPlatformModels
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/GatewayModel" } } } } }
  /projects/{id}/models:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [models]
      operationId: getProjectModels
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectModels" } } } }
    put:
      tags: [models]
      operationId: putProjectModels
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectModels" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectModels" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /projects/{id}/models/matrix:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [models]
      operationId: getModelMatrix
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ModelMatrix" } } } }
  /projects/{id}/work-items:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [work-items]
      operationId: listWorkItems
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: state, in: query, schema: { type: string } }
        - { name: size, in: query, schema: { type: string, enum: [S, M, L, XL] } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WorkItemPage" } } } }
    post:
      tags: [work-items]
      operationId: createWorkItem
      summary: Pose une demande dans Choregos (tracker interne seulement)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkItemCreate" } } }
      responses:
        "201": { description: Créée, content: { application/json: { schema: { $ref: "#/components/schemas/WorkItem" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /work-items/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [work-items]
      operationId: getWorkItem
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WorkItem" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /work-items/{id}/timeline:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [work-items]
      operationId: getWorkItemTimeline
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TimelineEntry" } } } } }
  /work-items/{id}/decisions:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [work-items]
      operationId: postDecision
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DecisionRequest" } } }
      responses:
        "202": { description: Décision transmise au workflow, content: { application/json: { schema: { $ref: "#/components/schemas/HumanRequest" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /work-items/{id}/actions:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [work-items]
      operationId: postWorkItemAction
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkItemAction" } } }
      responses:
        "202": { description: Action transmise }
        "409": { $ref: "#/components/responses/Conflict" }
  /work-items/{id}/runs:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [runs]
      operationId: listRuns
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Run" } } } } }
  /runs/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [runs]
      operationId: getRun
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /runs/{id}/events:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [runs]
      operationId: getRunEvents
      summary: Journal ACP du run (SSE si Accept text/event-stream)
      parameters:
        - { name: after_seq, in: query, schema: { type: integer } }
        - { name: Last-Event-ID, in: header, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json: { schema: { type: array, items: { $ref: "#/components/schemas/RunEvent" } } }
            text/event-stream: { schema: { type: string } }
  /runs/{id}/access:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [runs]
      operationId: getRunAccess
      summary: Ce à quoi l'agent a touché — fichiers, commandes, réseau, outils — et les refus.
      responses:
        "200":
          description: Fiche d'accès du run
          content:
            application/json:
              schema:
                type: object
                required: [evenements, refus, acces]
                properties:
                  evenements: { type: integer, description: Événements du journal parcourus }
                  refus: { type: integer, description: Nombre total de demandes refusées }
                  cout_outils_eur: { type: number }
                  acces:
                    type: array
                    items:
                      type: object
                      required: [nature, cible, demandes, refus]
                      properties:
                        nature: { type: string, enum: [read, write, execute, network, tool, autre] }
                        cible: { type: string }
                        demandes: { type: integer }
                        refus: { type: integer }
                        motifs: { type: array, items: { type: string } }
  /runs/{id}/transcript:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [runs]
      operationId: getRunTranscript
      responses:
        "200": { description: URL signée ou contenu JSONL, content: { application/json: { schema: { $ref: "#/components/schemas/ArtifactRef" } } } }
  /runs/{id}/diff:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [runs]
      operationId: getRunDiff
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DiffSummary" } } } }
  /projects/{id}/releases:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [trains]
      operationId: listReleases
      parameters:
        - { name: env, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ReleasePage" } } } }
  /releases/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [trains]
      operationId: getRelease
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Release" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/trains/{env}:
    parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/Env" }]
    get:
      tags: [trains]
      operationId: getTrainStatus
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TrainStatus" } } } }
  /projects/{id}/trains/{env}/depart:
    parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/Env" }]
    post:
      tags: [trains]
      operationId: departTrain
      responses: { "202": { description: Départ demandé }, "409": { $ref: "#/components/responses/Conflict" } }
  /projects/{id}/trains/{env}/freeze:
    parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/Env" }]
    post:
      tags: [trains]
      operationId: freezeTrain
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 3 } } } } }
      responses: { "202": { description: Gel demandé } }
  /projects/{id}/trains/{env}/unfreeze:
    parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/Env" }]
    post:
      tags: [trains]
      operationId: unfreezeTrain
      responses: { "202": { description: Dégel demandé } }
  /releases/{id}/approve:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [trains]
      operationId: approveRelease
      requestBody:
        content: { application/json: { schema: { type: object, properties: { note: { type: string } } } } }
      responses: { "202": { description: Approbation transmise }, "403": { $ref: "#/components/responses/Forbidden" } }
  /releases/{id}/abort:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [trains]
      operationId: abortRelease
      requestBody:
        content: { application/json: { schema: { type: object, properties: { reason: { type: string } } } } }
      responses: { "202": { description: Abandon transmis } }
  /projects/{id}/findings:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [findings]
      operationId: listFindings
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, created, duplicate, dismissed] } }
        - { name: severity, in: query, schema: { type: string, enum: [low, medium, high, critical] } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/FindingPage" } } } }
  /findings/{id}/actions:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [findings]
      operationId: postFindingAction
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FindingAction" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/FindingRecord" } } } }
  /projects/{id}/memory/search:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [memory]
      operationId: searchMemory
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: k, in: query, schema: { type: integer, default: 10, maximum: 100 } }
        - { name: kinds, in: query, schema: { type: array, items: { type: string } }, style: form, explode: false }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Memory" } } } } }
  /projects/{id}/memory/pending:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [memory]
      operationId: listPendingMemory
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Memory" } } } } }
    post:
      tags: [memory]
      operationId: decidePendingMemory
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MemoryDecision" } } }
      responses: { "200": { description: OK } }
  /projects/{id}/memory/reimport:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [memory]
      operationId: reimportMemory
      requestBody:
        content: { application/json: { schema: { type: object, properties: { sources: { type: array, items: { type: string } } } } } }
      responses: { "202": { description: Import planifié } }
  /orgs/{org}/memory/ab-report:
    parameters: [{ $ref: "#/components/parameters/Org" }]
    get:
      tags: [memory]
      operationId: getMemoryAbReport
      summary: Projets avec et sans mémoire, comparés sur le premier passage et le coût
      parameters:
        - { name: weeks, in: query, schema: { type: integer, minimum: 1, maximum: 52, default: 4 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MemoryAbReport" } } } }
  /projects/{id}/costs:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [costs]
      operationId: getProjectCosts
      parameters:
        - { name: group_by, in: query, schema: { type: string, enum: [day, stage, model, backend, size, kind], default: day } }
        - { name: since, in: query, schema: { type: string, format: date } }
        - { name: until, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CostReport" } } } }
  /projects/{id}/costs.csv:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [costs]
      operationId: exportProjectCostsCsv
      summary: Le rapport de coûts en CSV (séparateur `;`, BOM UTF-8)
      parameters:
        - { name: group_by, in: query, schema: { type: string, enum: [day, stage, model, backend, size, kind], default: day } }
        - { name: since, in: query, schema: { type: string, format: date } }
        - { name: until, in: query, schema: { type: string, format: date } }
