{{- /*
The identity of the daemon's pods in THIS cluster: none that opens anything. The account is bound
to no Role (this chart renders no Role, no ClusterRole and no binding), and its token is mounted in
no pod: the daemon asks nothing of the cluster it runs in. Its identity at the platform is the key
pair it made itself (ADR 0147 §2), which lives on its volume and never in a Kubernetes object.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "choregos-outpost.fullname" . }}
  labels: {{- include "choregos-outpost.labels" . | nindent 4 }}
automountServiceAccountToken: false
