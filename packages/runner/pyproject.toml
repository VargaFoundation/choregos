[project]
name = "choregos-runner"
version = "0.24.8"
description = "Runner Choregos : client ACP headless, guardrails, boucle DoD"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "choregos-core",
    "choregos-adapters",
    "httpx>=0.27",
    "typer>=0.15",
    "structlog>=24.4",
    "PyYAML>=6.0",
    # `config.py` imports it. Not declared, it still arrived in the development environment
    # (another package of the workspace pulls it in): the gap only existed
    # in the runner image, where `uv sync --package choregos-runner` installs ONLY what
    # this package declares. The agent then died on `ModuleNotFoundError`.
    "pydantic-settings>=2.6",
    # The platform's tools server (`report_finding`, `ask_human`, the catalogue).
    # It lived in a SIDECAR, which only exists with Tekton: with the `k8s_job`
    # executor, the agent pod has only one container, nobody listened on the announced
    # port, and the agent ended up with NO tool at all, while believing it had some, the
    # `StageInput` promising it a dead address. Seen on the bench of 2026-09-24.
    "choregos-tools-mcp",
    # The deterministic backtest engine: a job stage runs `choregos-quant` offline in this image.
    # Standard library only, so it adds no third-party dependency (docs: S38-06).
    "choregos-quant",
    # A hosted step's loopback listeners (ADR 0080): the model and MCP proxies the container reaches.
    # `choregos-tools-mcp` pulls them in already; declared, they do not depend on it.
    "starlette>=0.40",
    "uvicorn>=0.32",
    # A hosted session's pod relays the caller's frames to the container's `/invocations_ws` (S41-21).
    "websockets>=13",
]

[project.scripts]
choregos-runner = "choregos_runner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/choregos_runner"]
