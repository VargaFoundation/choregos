[project]
name = "choregos-ontology"
version = "0.12.0"
description = "Essai du socle (TRV-001) : ontologie en YAML, validation, compilation en IR, outils MCP générés"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = ["pydantic>=2.9", "PyYAML>=6.0", "cel-python>=0.5"]

[project.scripts]
choregos-ontology = "choregos_ontology.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/choregos_ontology"]
