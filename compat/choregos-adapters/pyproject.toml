[project]
name = "choregos-adapters"
version = "0.28.0"
description = "Deprecated name of tranibor-adapters: an empty wheel that depends on it and ships the `choregos_adapters` import alias (ADR 0176, R2)"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = ["tranibor-adapters==0.28.0", "tranibor-contracts==0.28.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/choregos_adapters"]
