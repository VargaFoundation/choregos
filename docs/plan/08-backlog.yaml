# Backlog Choregos — v3 (2026-09-18)
# Fields: id, title, stream, sprint, priority (1 = first), size (S ≈ ½ d, M ≈ 1–2 d, L ≈ 3–5 agent days), depends_on, acceptance (verifiable criteria), notes.
# One story = one PR. Stories of the same sprint and the same stream are sequential; streams run in parallel.

version: 1
streams:
  S0: "Contrats & socle"
  S1: "Orchestrateur Temporal"
  S2: "Runner, agents ACP, Tekton"
  S3: "Connecteurs GitHub"
  S4: "Gateway & costs"
  S5: "Front"
  S6: "API"
  S7: "Plateforme Kubernetes & GitOps"
  S8: "Templates & provisioning"
  S9: "Release train & CD"
  S10: "Findings & memory (Choregos)"
  S11: "Ecphoria (repo VargaFoundation/ecphoria)"
  S12: "Evals & conformance"
  S13: "Multi-backend & second ecosystem"
  S14: "Governed change on a data platform (ADR 0028)"
  S15: "MCP door for external clients and the Integrations page (ADR 0029, 0030)"
  S16: "Several workflows per project, readable and editable (ADR 0031)"
  S17: "Administration by manifests and enterprise edition on the dev (ADR 0032)"
  S18: "Agent registry and skill library (ADR 0033)"
  S19: "Connectors by capability and MCP servers (ADR 0034)"
  S20: "Governed actions in the core and the HR joiners/leavers scenario (ADR 0035)"
  S21: "Usability: readable console, English everywhere, agent catalogue, enforced governance, development project (product review of 2026-10-07)"
  S24: "The look of an operations console: softened contrast, Geist, chosen theme, sidebar (ADR 0043)"
  S25: "What the agent does, and how we know it: plan, activity, provenance, receipts between steps (ADR 0045)"
  S26: "P0 fixes: train status, problem+json, train metrics, members read check, train environments (plan 2026-10-12)"
  S27: "Budgets that hold: reservation, ledger-backed spend, org ceiling, enforced guardrails (plan 2026-10-12)"
  S28: "One-command local install: docker compose up, real key, tested in CI (plan 2026-10-12)"
  S29: "Spend screen by agent, workflow, work item, project (plan 2026-10-12)"
  S30: "Console: Temporal-like look without the Varga design system, scope-switching sidebar, agents and members pages (plan 2026-10-12)"
  S31: "Typed, stored, traced artifacts between agents (plan 2026-10-12)"
  S32: "Agent builder, lifecycle, skills import behind a supply-chain gate (plan 2026-10-12)"
  S33: "Knowledge bases and specialist agents, netops included (plan 2026-10-12)"
  S34: "English everywhere: code, identifiers, docs, commits (plan 2026-10-12)"
  S35: "The agent_sandbox executor: warm pool, suspend across a human gate, proved on the dev cluster (ADR 0016, plan 2026-10-12)"
  S36: "Agent logs: transcript stored, pod logs and termination reason archived, a logs tab (plan 2026-10-12)"
  S37: "Fewer tokens per run: rtk and headroom, measured, switchable at every level (ADR 0055)"
  S38: "Investment research: deterministic steps, market data, gates on measured numbers, a campaign template (plan 2026-10-14)"
  S45: "English everywhere, finished (plan 2026-10-27, ADR 0098)"
  S46: "Consuming an external MCP gateway (plan 2026-10-27, ADR 0105)"
  S47: "Hardening and gaps from the 2026-10-27 audit (ADRs 0099-0104)"
  S49: "Workflows for every trade: a default without a repository, a catalogue, a map that edits everything (ADRs 0110-0112)"
  S50: "An agent acts under an identity: assigned, own, on behalf of a person; child agents (ADR 0107)"
  S55: "A console that makes a complex product simple: colour that orients, readable pages (ADR 0120)"
  S56: "A workflow starts from a trigger: tracker, HTTP, schedule or a person, one audit (ADR 0113)"
  S57: "An agent calls its run's tools from a script: the runner relays, the API governs each call (ADR 0122)"

