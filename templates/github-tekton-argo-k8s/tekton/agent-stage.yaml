# Task d'exécution d'une étape agent (docs/plan/02 §2.3).
# Le workspace est éphémère, le conteneur non-root, le token de run vient d'un Secret
# créé pour ce run et supprimé après.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: choregos-agent-stage
  labels:
    app.kubernetes.io/part-of: choregos
spec:
  description: Runs a Choregos agent stage and publishes its StageResult.
  params:
    - { name: run-id, type: string }
    - { name: api-url, type: string }
    - { name: runner-image, type: string, default: "ghcr.io/vargafoundation/choregos-runner:1.0.0" }
    - { name: tools-image, type: string, default: "ghcr.io/vargafoundation/choregos-tools:1.0.0" }
  workspaces:
    - name: source
      description: The run's ephemeral workspace (PVC volumeClaimTemplate)
  results:
    - { name: result-url, description: URL of the published StageResult }
    - { name: status, description: final status of the run }
  stepTemplate:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      seccompProfile: { type: RuntimeDefault }
      capabilities: { drop: [ALL] }
    env:
      - { name: CHOREGOS_RUN_ID, value: $(params.run-id) }
      - { name: CHOREGOS_API_URL, value: $(params.api-url) }
      - name: CHOREGOS_RUN_TOKEN
        valueFrom:
          secretKeyRef: { name: run-$(params.run-id), key: token }
      - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.monitoring:4318" }
      - { name: HOME, value: $(workspaces.source.path) }
  steps:
    - name: run
      image: $(params.runner-image)
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        choregos-runner run \
          --write-result-url "$(results.result-url.path)" \
          --write-status "$(results.status.path)"
      resources:
        requests: { cpu: "1", memory: 2Gi }
        limits: { cpu: "2", memory: 6Gi }
      timeout: 2h
  sidecars:
    - name: choregos-tools
      image: $(params.tools-image)
      env:
        - name: CHOREGOS_RUN_TOKEN
          valueFrom:
            secretKeyRef: { name: run-$(params.run-id), key: token }
        - { name: CHOREGOS_API_URL, value: $(params.api-url) }
        - { name: CHOREGOS_RUN_ID, value: $(params.run-id) }
        - { name: CHOREGOS_TOOLS_PORT, value: "7777" }
      # `exec` et non `httpGet` : le serveur n'écoute que sur 127.0.0.1 (voulu — un sidecar
      # d'outils ne doit être joignable que par l'agent de SON pod), or kubelet envoie une sonde
      # httpGet à l'IP du pod. Elle ne pouvait donc jamais réussir, depuis le premier jour.
      readinessProbe:
        exec:
          command: ["python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:7777/healthz', timeout=2)"]
        initialDelaySeconds: 2
