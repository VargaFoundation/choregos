{{- /*
Les secrets que le chart génère quand il embarque la dépendance concernée, faute d'un
secret fourni. Chaque valeur est tirée au hasard à la première installation puis RELUE
(`lookup`) : sans ce relevé, un `helm upgrade` réécrirait la clé maître de la passerelle,
les clés virtuelles déjà émises deviendraient invalides, et rien ne le dirait.
*/}}
{{- if not .Values.global.gateway.secretRef }}
{{- $name := printf "%s-gateway" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $key := "" }}
{{- if $existing }}{{ $key = index $existing.data "master-key" | b64dec }}{{ else }}{{ $key = printf "sk-%s" (randAlphaNum 40) }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "choregos.labels" . | nindent 4 }}
type: Opaque
stringData:
  master-key: {{ $key | quote }}
{{- end }}
{{- if and .Values.global.memory.embedded (not .Values.global.memory.tokenSecret) }}
{{- $name := printf "%s-memory" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $token := "" }}
{{- if $existing }}{{ $token = index $existing.data "token" | b64dec }}{{ else }}{{ $token = randAlphaNum 48 }}{{ end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "choregos.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ $token | quote }}
  # Ecphoria lit ses clés sous la forme `<clé>@<tenant>:<rôle>` ; sans tenant ici.
  api-keys: {{ printf "%s@:admin" $token | quote }}
{{- end }}
{{- if .Values.global.devSecrets }}
{{- /*
Banc local : les secrets applicatifs, faute d'un coffre. Deux valeurs sont tirées au hasard
et relues à chaque mise à jour ; les autres sont VOLONTAIREMENT vides — l'API génère sa paire
ES256 au démarrage quand elle ne la reçoit pas, et une App GitHub absente laisse simplement
les connecteurs GitHub inutilisables. Jamais `true` en production : un secret que le chart
peut écrire est un secret que tout lecteur du cluster peut relire.
*/}}
{{- $name := .Values.global.apiSecretRef }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $session := "" }}{{- $hook := "" }}{{- $generic := "" }}{{- $signature := "" }}
{{- if $existing }}
{{- $session = index $existing.data "session-secret" | b64dec }}
{{- $hook = index $existing.data "github-webhook-secret" | b64dec }}
{{- $generic = index $existing.data "generic-webhook-secret" | default "" | b64dec }}
{{- $signature = index $existing.data "run-token-private-key" | b64dec }}
{{- end }}
{{- if not $existing }}
{{- $session = randAlphaNum 48 }}{{ $hook = randAlphaNum 32 }}
{{- /* La clé qui signe les jetons de run. Elle doit être PARTAGÉE par l'API et
       l'orchestrateur : deux processus qui en génèrent chacun une se renvoient
       « Signature verification failed ». La publique se déduit de celle-ci. */}}
{{- $signature = genPrivateKey "ecdsa" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "choregos.labels" . | nindent 4 }}
type: Opaque
stringData:
  session-secret: {{ $session | quote }}
  github-webhook-secret: {{ $hook | quote }}
  {{- /* Secret des webhooks non signés (ArgoCD, Alertmanager, Jira, GitLab). Généré ici
         sur un banc ; en production il vient du coffre. Il manquait : ces quatre webhooks
         tournaient avec la valeur par défaut du code, publiée dans le dépôt. */}}
  generic-webhook-secret: {{ $generic | default (randAlphaNum 32) | quote }}
  run-token-private-key: {{ $signature | quote }}
  # Vide : l'API la déduit de la privée.
  run-token-public-key: ""
  github-app-id: ""
  github-app-private-key: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.oidc.secretRef }}
  labels: {{- include "choregos.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Vide : sur un banc local la connexion passe par `dev_login`, pas par un fournisseur OIDC.
  client-secret: ""
{{- end }}
