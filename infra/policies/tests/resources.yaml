apiVersion: v1
kind: Pod
metadata:
  name: choregos-buildkitd-7d9f
  namespace: choregos-platform
spec:
  containers:
  - name: buildkitd
    image: ghcr.io/example/buildkit:1
    securityContext:
      seccompProfile:
        type: Unconfined
      appArmorProfile:
        type: Unconfined
      allowPrivilegeEscalation: true
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
        add:
        - SETUID
        - SETGID
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
---
# The platform's own namespace is often named `choregos` exactly, which the `choregos-*` glob
# does not match (#911): these pods are judged there too.
apiVersion: v1
kind: Pod
metadata:
  name: platform-no-context
  namespace: choregos
spec:
  containers:
  - name: main
    image: ghcr.io/example/api:0.19.1
---
apiVersion: v1
