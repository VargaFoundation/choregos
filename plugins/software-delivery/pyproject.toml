[project]
name = "tranibor-software-delivery"
version = "0.28.1"
description = "The code of the software-delivery plugin: the gates that read a diff, a pipeline or a pull request, and the facts they read (ADR 0181)"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
# The gates register through the core's seam; the context provider runs in the worker, whose modules
# it imports when it is called (`facts.py`), so a process that only validates workflows needs the core.
dependencies = ["tranibor-core", "tranibor-contracts"]

# The plugin's code half (ADR 0181 point 4): the API and the worker load it at start-up.
[project.entry-points."choregos.plugins"]
software-delivery = "tranibor_software_delivery.extension:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tranibor_software_delivery"]
