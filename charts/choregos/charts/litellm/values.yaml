image:
  # `litellm-database`: the variant that can hold virtual keys (hence a database).
  repository: ghcr.io/berriai/litellm-database
  tag: "v1.105.5"
# The aliases Choregos asks for (`profile:*` → `platform/*`), and what they become in
# amont. Deux formes possibles :
#   - upstream = another gateway (Diametral): api_base + virtual key;
#   - upstream = a provider: model `openai/gpt-…` or `anthropic/claude-…` + its key.
# `upstream.apiKeySecret` names the secret (key `api-key`) injected as $UPSTREAM_API_KEY.
upstream:
  apiKeySecret: ""
  apiBase: ""
models:
  - alias: platform/standard
    model: openai/gpt-5.5
  - alias: platform/strong
    model: openai/gpt-5.5
  - alias: platform/cheap
    model: openai/gpt-5.4-mini
  - alias: platform/aux
    model: openai/gpt-5.4-mini
  - alias: platform/embed
    model: openai/text-embedding-3-small
    mode: embedding
database:
  # Dedicated database on the same server (created at initdb by the postgresql subchart).
  name: litellm
resources:
  requests: { cpu: 200m, memory: 512Mi }
  limits: { cpu: "1", memory: 2Gi }
