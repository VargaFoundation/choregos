apiVersion: choregos.dev/v1alpha1
kind: ObjectType
metadata: {name: collaborateur, displayName: Employee, description: "A person who is joining, is here, or has left.", owner: rh}
spec:
  datasource: collaborateurs
  primaryKey: matricule
  titleProperty: nom
  properties:
    matricule: {type: string, required: true}
    nom: {type: string, required: true}
    email: {type: string}
    poste: {type: string}
    manager: {type: string}
    statut: {type: string, enum: [a_venir, present, parti], required: true}
    date_arrivee: {type: date}
    date_depart: {type: date}
