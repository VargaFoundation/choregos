# Rendu seulement quand `global.database.embedded` vaut true (condition du chart parent).
# PostgreSQL 16 with pgvector (ADR 0051): the knowledge index ranks with embeddings when it can,
# and serves full-text only on an image without the extension.
image:
  repository: pgvector/pgvector
  tag: "0.8.1-pg16"
persistence:
  enabled: true
  size: 5Gi
  storageClass: ""
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: "1", memory: 1Gi }
