enabled: true
replicaCount: 2
image:
  # Empty: `global.imageRegistry`. Another registry — the `-ee` images of the enterprise edition,
  # served by a private project — is set here, component by component.
  registry: ""
  repository: choregos-api
  tag: ""
  digest: ""
# Verbatim pod volumes and container mounts for the API, so that a deployment can hand files to a
# plugin (a theme, a licence, a CA bundle) without forking the chart. A volume named like one the
# chart owns (tmp, catalogue, workflow-templates, playbooks) fails at render.
extraVolumes: []
extraVolumeMounts: []
# The name of a ConfigMap whose keys are Markdown files: `<id>.site.md` adds an "On this platform"
# section to a setup procedure, `<new-id>.md` adds a procedure (ADR 0067). Empty: the procedures
# that ship with the platform, unchanged. Mounted read-only at /etc/choregos/procedures.
proceduresExtra: ""
service:
  port: 8000
resources:
  requests: { cpu: 200m, memory: 512Mi }
  limits: { cpu: "1", memory: 1Gi }
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
migrations:
  enabled: true
ingress:
  enabled: true
  # Ingress annotations (`kind: ingress`). For a controller that refuses two Ingresses on the same
  # host — NGINX Inc.: "All hosts are taken by other resources" — the API and the console on a single
  # host are declared as minions of a master Ingress: `nginx.org/mergeable-ingress-type: minion`.
  annotations: {}
  hostnames: ["api.choregos.local"]
  gateway: choregos-gateway
  gatewayNamespace: gateway
podDisruptionBudget:
  enabled: true
  minAvailable: 1
