# What the registry does not say (ADR 0065): the catalogue version, the vendor map that decides
# `official`, the hosted remotes the registry does not list, and the licences GitHub cannot
# detect. Everything here is reviewed by hand, like the seed.

# CalVer of the shipped file; bump it when a refresh is merged.
catalogue_version: 2026.10.0

# Hosted remotes the registry does not list or lists differently. Every URL was answered with an
# MCP-shaped reply (a 200 or a 401 asking for credentials) on 2026-10-15.
remotes:
  github: { url: "https://api.githubcopilot.com/mcp/", protocol: streamable-http }
  semgrep: { url: "https://mcp.semgrep.ai/mcp", protocol: streamable-http }
  deepwiki: { url: "https://mcp.deepwiki.com/mcp", protocol: streamable-http }
  aws-knowledge: { url: "https://knowledge-mcp.global.api.aws", protocol: streamable-http }
  vercel: { url: "https://mcp.vercel.com", protocol: streamable-http }
  cloudflare-observability: { url: "https://observability.mcp.cloudflare.com/mcp", protocol: streamable-http }
  cloudflare-radar: { url: "https://radar.mcp.cloudflare.com/mcp", protocol: streamable-http }
  cloudflare-bindings: { url: "https://bindings.mcp.cloudflare.com/mcp", protocol: streamable-http }
  socket: { url: "https://mcp.socket.dev/", protocol: streamable-http }
  asana: { url: "https://mcp.asana.com/v2/mcp", protocol: streamable-http }
  clickup: { url: "https://mcp.clickup.com/mcp", protocol: streamable-http }
  todoist: { url: "https://ai.todoist.net/mcp", protocol: streamable-http }
  box: { url: "https://mcp.box.com", protocol: streamable-http }
  intercom: { url: "https://mcp.intercom.com/mcp", protocol: streamable-http }
  hubspot: { url: "https://mcp.hubspot.com/", protocol: streamable-http }
  sanity: { url: "https://mcp.sanity.io", protocol: streamable-http }
  jina: { url: "https://mcp.jina.ai/v1", protocol: streamable-http }

# Licences GitHub reports as NOASSERTION (a repository mixing licences) or none, checked by hand
# against the server's own folder. A stdio server we would host needs an OSI licence.
licences:
  fetch: MIT
  filesystem: MIT
  git: MIT
  memory: MIT
  sequential-thinking: MIT
  time: MIT
  aws-documentation: Apache-2.0
  aws-cdk: Apache-2.0
  aws-terraform: Apache-2.0
  aws-cost-analysis: Apache-2.0
  azure: MIT
  markitdown: MIT

# The vendor map: an entry is `official` when its registry namespace, its repository owner or its
# remote host belongs to the vendor named here. Never set by hand on an entry.
vendors:
  github: { domains: [github.com, githubcopilot.com], orgs: [github] }
