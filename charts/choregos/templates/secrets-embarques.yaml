{{- /*
The secrets the chart generates when it embeds the dependency concerned, for lack of a
provided secret. Each value is drawn at random on the first installation then RE-READ
(`lookup`): without that lookup, a `helm upgrade` would rewrite the gateway's master key,
the virtual keys already issued would become invalid, and nothing would say so.
*/}}
{{- if not .Values.global.gateway.secretRef }}
{{- $name := printf "%s-gateway" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $key := "" }}
{{- if $existing }}{{ $key = index $existing.data "master-key" | b64dec }}{{ else }}{{ $key = printf "sk-%s" (randAlphaNum 40) }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "choregos.labels" . | nindent 4 }}
type: Opaque
stringData:
  master-key: {{ $key | quote }}
{{- end }}
{{- if and .Values.global.memory.embedded (not .Values.global.memory.tokenSecret) }}
{{- $name := printf "%s-memory" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $token := "" }}
{{- if $existing }}{{ $token = index $existing.data "token" | b64dec }}{{ else }}{{ $token = randAlphaNum 48 }}{{ end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "choregos.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ $token | quote }}
  # Ecphoria reads its keys in the form `<key>@<tenant>:<role>`; no tenant here.
  api-keys: {{ printf "%s@:admin" $token | quote }}
{{- end }}
{{- if .Values.global.devSecrets }}
{{- /*
Local bench: the application secrets, for lack of a vault. Two values are drawn at random
and re-read on each update; the others are VOLUNTARILY empty — the API generates its ES256
pair at startup when it does not receive one, and an absent GitHub App simply leaves
the GitHub connectors unusable. Never `true` in production: a secret the chart
can write is a secret any reader of the cluster can read back.
*/}}
{{- $name := .Values.global.apiSecretRef }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $session := "" }}{{- $hook := "" }}{{- $generic := "" }}{{- $signature := "" }}
{{- if $existing }}
{{- $session = index $existing.data "session-secret" | b64dec }}
{{- $hook = index $existing.data "github-webhook-secret" | b64dec }}
{{- $generic = index $existing.data "generic-webhook-secret" | default "" | b64dec }}
{{- $signature = index $existing.data "run-token-private-key" | b64dec }}
{{- end }}
{{- if not $existing }}
{{- $session = randAlphaNum 48 }}{{ $hook = randAlphaNum 32 }}
{{- /* The key that signs the run tokens. It must be SHARED by the API and
       the orchestrator: two processes that each generate one answer each other
       "Signature verification failed". The public one is derived from this one. */}}
{{- $signature = genPrivateKey "ecdsa" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "choregos.labels" . | nindent 4 }}
type: Opaque
stringData:
  session-secret: {{ $session | quote }}
  github-webhook-secret: {{ $hook | quote }}
  {{- /* Secret of the unsigned webhooks (ArgoCD, Alertmanager, Jira, GitLab). Generated here
         on a bench; in production it comes from the vault. It was missing: these four webhooks
         ran with the code's default value, published in the repository. */}}
  generic-webhook-secret: {{ $generic | default (randAlphaNum 32) | quote }}
  run-token-private-key: {{ $signature | quote }}
  # Empty: the API derives it from the private one.
  run-token-public-key: ""
  github-app-id: ""
  github-app-private-key: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.oidc.secretRef }}
  labels: {{- include "choregos.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Empty: on a local bench the login goes through `dev_login`, not through an OIDC provider.
  client-secret: ""
{{- end }}
