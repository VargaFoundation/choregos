# Valeurs par défaut de la plateforme. Chaque environnement surcharge ce qui le concerne
# dans `choregos-infra/platform/overlays/<env>/values.yaml`.

global:
  domain: choregos.local
  # Surcharges quand les hôtes ne suivent pas `app.<domain>` / `api.<domain>` en HTTPS
  # (ex. un ingress HTTP interne derrière un VPN). Vides : dérivés de `domain`.
  publicUrl: ""
  apiUrl: ""
  imageRegistry: ghcr.io/vargafoundation
  imageTag: "1.0.0"
  imagePullPolicy: IfNotPresent
  # Les images sont référencées par digest en staging et en prod (politique Kyverno).
  imageDigest: ""
  environment: dev
  fakes: false
  # Canary de la plateforme (S7-08). Désactivé par défaut : il exige Argo Rollouts dans le
  # cluster, et un chart qui suppose un opérateur absent est un chart qui ne s'installe pas.
  # Les environnements qui l'activent le font dans `values/staging.yaml` et `values/prod.yaml`.
  canary:
    enabled: false
    steps:
      - { weight: 10, pause: 5m }
      - { weight: 50, pause: 10m }
      - { weight: 100 }
    # `AnalysisTemplate` qui décide d'abandonner : sans lui, le canary ne fait qu'attendre.
    analysis: ""
  # Playbooks apportés par le DÉPLOIEMENT (un ConfigMap, une clé par rôle : `<rôle>.md`),
  # montés dans les workers et lus avant ceux du paquet. C'est ce qui permet d'employer le
  # moteur hors logiciel — un rôle `sourcing`, `instruction_dossier` — ou d'adapter un rôle
  # existant à une maison, sans toucher à la plateforme.
  playbooks:
    configMap: ""
    mountPath: /etc/choregos/playbooks
  # Catalogue d'outils : des API tierces que la PLATEFORME appelle pour un agent, clé
  # côté serveur. Un ConfigMap (le catalogue, lisible en PR) et un Secret (les clés des
  # fournisseurs, injecté dans l'API). Vide = aucun outil, et c'est le défaut.
  # Un projet déclare ensuite ce qu'il a le droit d'appeler (`tools` de sa configuration).
  toolCatalog:
    configMap: ""
    mountPath: /etc/choregos/outils
    fileName: catalogue.yaml
    #: Secret dont TOUTES les clés deviennent des variables d'environnement de l'API :
    #: c'est là que vivent les clés des fournisseurs, jamais dans le catalogue.
    credentialsSecret: ""
  logLevel: INFO
  serviceAccount:
    annotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile: { type: RuntimeDefault }
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: { drop: ["ALL"] }
  database:
    # `true` : le chart déploie un PostgreSQL à une instance (banc, démo). `false` : il
    # consomme celui décrit ci-dessous. Même logique pour les trois dépendances suivantes.
    embedded: false
    host: choregos-pg-rw.choregos-data.svc
    port: 5432
    name: choregos
    user: choregos
    secretRef: choregos-db
    # À la place de `secretRef` (clé `url`) : le secret d'un opérateur qui ne porte que le
    # mot de passe (Zalando : `<user>.<cluster>.credentials.postgresql.acid.zalan.do`).
    passwordSecret: ""
  temporal:
    embedded: false
    address: temporal-frontend.choregos-temporal.svc:7233
    namespace: default
  gateway:
    embedded: false
    url: http://litellm.choregos-gateway.svc:4000
    # Secret (clé `master-key`) de la passerelle. Vide avec `embedded: true` : le chart en
    # génère un, stable d'une mise à jour à l'autre.
    secretRef: choregos-gateway-secrets
  memory:
    embedded: false
    url: http://ecphoria.choregos-memory.svc:8432
    # Secret (clé `token`) d'une mémoire qui exige une clé d'API. Vide : aucun en-tête.
    tokenSecret: ""
  objectStore:
    url: s3://choregos
  oidc:
    issuer: https://keycloak.choregos.local/realms/choregos
    clientId: choregos
    secretRef: choregos-oidc
  # `false` pour un locataire qui n'a droit à aucune ressource cluster-scoped (AppProject
  # `clusterResourceWhitelist: []`) : le ClusterRole de lecture des PipelineRun n'est pas rendu.
  rbac:
    clusterScoped: true
    # Role + RoleBinding (namespace) autorisant l'orchestrateur à lancer ses Jobs d'agent.
    # Sur une plateforme mutualisée, c'est la plateforme qui le pose : laisser `false`.
    jobRunner: false
  # Le secret qui porte les valeurs de l'API : secret de session, clé de signature des
  # jetons de run, App GitHub. L'orchestrateur y lit la MÊME clé de signature — c'est lui
  # qui émet les jetons, l'API ne fait que les vérifier.
  apiSecretRef: choregos-api-secrets
  # Banc local seulement : le chart écrit lui-même les secrets applicatifs (voir
  # templates/secrets-embarques.yaml). Jamais vrai en production.
  devSecrets: false
  externalSecrets:
    enabled: true
    storeRef: choregos-cluster-store
    refreshInterval: 1h

choregos-api:
  enabled: true
  # Ex. : [{ip: "172.16.3.2", hostnames: ["sso.shared.diametral.com"]}]
  hostAliases: []
  replicaCount: 2
  image:
    repository: choregos-api
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  migrations:
    enabled: true
    # `post-install,post-upgrade` quand la base est embarquée (elle n'existe pas avant).
    hook: pre-install,pre-upgrade
    # Attente de la base avant de migrer (init container).
    waitForDatabaseSeconds: 300
  ingress:
    enabled: true
    # `httproute` (Gateway API) ou `ingress` (networking.k8s.io) quand le cluster n'a pas
    # de Gateway API — `className` ne sert qu'à `ingress`.
    kind: httproute
    className: ""
    hostnames: ["api.choregos.local", "hooks.choregos.local"]
    gateway: choregos-gateway

choregos-web:
  enabled: true
  replicaCount: 2
  image:
    repository: choregos-web
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  ingress:
    enabled: true
    kind: httproute
    className: ""
    hostnames: ["app.choregos.local"]
    gateway: choregos-gateway

choregos-orchestrator:
  enabled: true
  image:
    repository: choregos-orchestrator
  # Après la perte d'un nœud, un worker attend ce délai avant d'être évincé (défaut Kubernetes :
  # 300 s, soit ~6 minutes d'immobilité — voir `tests/cluster/test_node_loss.py`).
  unreachableTolerationSeconds: 20
  # Un déploiement par task queue : les appels externes lents n'étouffent pas la boucle de décision.
  queues:
    - name: orchestrator
      replicas: 2
      resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
    - name: executor
      replicas: 2
      resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
    - name: tracker
      replicas: 2
      resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
    - name: memory
      replicas: 1
      resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
  runner:
    image: choregos-runner
    # Vide : le tag suit `global.imageTag`.
    tag: ""
    namespacePattern: "proj-{slug}-runners"
    # Runs simultanés par namespace. Au-delà, le Job attend SANS pod (`spec.suspend`),
    # dans l'ordre d'arrivée : une pointe de tickets ne se transforme plus en pointe de
    # pods qui tirent tous la même image. 0 = sans plafond.
    maxActive: 0
    executor: tekton
    # Ce que chaque pod d'agent reçoit en plus. `env` porte des valeurs en clair (jamais un
    # secret) ; `envFromSecrets` liste des Secrets du namespace, montés par référence —
    # c'est par là que passent un jeton de backend ou des identifiants git.
    env: {}
    envFromSecrets: []
    # Plafond de chaque pod runner (exécuteur `k8s_job`). À garder sous le LimitRange du
    # namespace : au-delà, le pod est refusé et le Job attend sans message.
    limits:
      cpu: "2"
      memory: 6Gi

choregos-tools:
  enabled: true
  image:
    repository: choregos-tools
  # L'image du sidecar est publiée ici ; la Task Tekton la référence dans chaque projet.
  publishTask: true

monitoring:
  serviceMonitor: true
  dashboards: true
  alerts: true

networkPolicies:
  enabled: true
