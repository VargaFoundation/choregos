{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: choregos-web
  labels: {{- include "choregos.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: choregos-web
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: choregos-web
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: web
    spec:
      {{- include "choregos.antiAffinity" (dict "global" .Values.global "labels" (dict "app.kubernetes.io/name" "choregos-web" "app.kubernetes.io/instance" .Release.Name)) | nindent 6 }}
      securityContext: {{- toYaml .Values.global.podSecurityContext | nindent 8 }}
      {{- include "choregos.imagePullSecrets" $ | nindent 6 }}
      containers:
        - name: web
          image: {{ include "choregos.image" (dict "global" .Values.global "image" .Values.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext: {{- toYaml .Values.global.securityContext | nindent 12 }}
          ports: [{ name: http, containerPort: {{ .Values.service.port }} }]
          env:
            - name: CHOREGOS_API_URL
              value: https://api.{{ .Values.global.domain }}
            - name: NEXT_PUBLIC_API_MODE
              value: {{ ternary "mock" "live" .Values.global.fakes | quote }}
            - name: NEXT_PUBLIC_DEFAULT_ORG
              value: {{ .Values.global.defaultOrg | default "varga" | quote }}
            - name: NODE_ENV
              value: production
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: cache, mountPath: /app/.next/cache }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: cache, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: choregos-web
  labels: {{- include "choregos.labels" . | nindent 4 }}
spec:
  ports: [{ name: http, port: {{ .Values.service.port }}, targetPort: http }]
  selector:
    app.kubernetes.io/name: choregos-web
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- if .Values.ingress.enabled }}
---
{{- if eq (.Values.ingress.kind | default "httproute") "ingress" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: choregos-web
  labels: {{- include "choregos.labels" . | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hostnames }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: choregos-web, port: { number: {{ $.Values.service.port }} } }
    {{- end }}
{{- else }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: choregos-web
  labels: {{- include "choregos.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.ingress.gateway }}
      namespace: {{ .Values.ingress.gatewayNamespace | default "gateway" }}
  hostnames:
    {{- range .Values.ingress.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - backendRefs:
        - name: choregos-web
          port: {{ .Values.service.port }}
{{- end }}
{{- end }}
{{- end }}
