[project]
name = "choregos-runner"
version = "0.4.0"
description = "Runner Choregos : client ACP headless, guardrails, boucle DoD"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "choregos-core",
    "choregos-adapters",
    "httpx>=0.27",
    "typer>=0.15",
    "structlog>=24.4",
    "PyYAML>=6.0",
    # `config.py` l'importe. Non déclarée, elle arrivait quand même dans l'environnement de
    # développement (un autre paquet de l'espace de travail la tire) : le manque n'existait
    # que dans l'image du runner, où `uv sync --package choregos-runner` n'installe QUE ce
    # que ce paquet déclare. L'agent mourait alors sur `ModuleNotFoundError`.
    "pydantic-settings>=2.6",
    # Le serveur d'outils de la plateforme (`report_finding`, `ask_human`, le catalogue).
    # Il vivait dans un SIDECAR, ce qui n'existe qu'avec Tekton : avec l'exécuteur
    # `k8s_job`, le pod d'agent n'a qu'un conteneur, personne n'écoutait sur le port
    # annoncé, et l'agent se retrouvait SANS AUCUN outil — tout en croyant en avoir, le
    # `StageInput` lui promettant une adresse morte. Vu sur le banc du 2026-09-24.
    "choregos-tools-mcp",
]

[project.scripts]
choregos-runner = "choregos_runner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/choregos_runner"]

[tool.hatch.build.targets.wheel.force-include]
"src/choregos_runner/backends/versions.lock" = "choregos_runner/backends/versions.lock"
