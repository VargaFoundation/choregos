[project]
name = "choregos-playbooks"
version = "0.27.17"
description = "Deprecated name of tranibor-playbooks: an empty wheel that depends on it and ships the `choregos_playbooks` import alias (ADR 0176, R2)"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = ["tranibor-playbooks==0.27.17", "tranibor-contracts==0.27.17"]

[build-system]
requires = ["hatchling"]
