# Production: HA, images by digest (Kyverno requires it), gVisor sandbox for the runners.
global:
  domain: choregos.dev
  environment: prod
  runner:
    # ADR 0072: the default, written here so the choice is visible. Needs the operator on the cluster.
    executor: agent_sandbox
  fakes: false
  logLevel: INFO
  imagePullPolicy: IfNotPresent
choregos-api:
  # The run's API on the public hostnames (ADR 0144): `enforce` answers 404 there, before any token is
  # read (S80-03b). Runs call the in-cluster Service (`global.internalApiUrl`'s default) and are not
  # concerned. Runs that call back from outside the cluster need a run door first; until then set
  # `warn`, which refuses nothing and logs `internal_api.would_refuse` (docs/deployment.md, "The run's
  # API and the run door").
  internalApiGuard: enforce
  replicaCount: 3
  autoscaling: { enabled: true, minReplicas: 3, maxReplicas: 12, targetCPUUtilizationPercentage: 70 }
  podDisruptionBudget: { enabled: true, minAvailable: 2 }
choregos-web:
  replicaCount: 3
choregos-orchestrator:
  runner:
    warmPool: { size: 2 }
  queues:
    - name: orchestrator
      replicas: 3
      resources: { requests: { cpu: 500m, memory: 1Gi }, limits: { cpu: "2", memory: 2Gi } }
    - name: executor
      replicas: 3
      resources: { requests: { cpu: 500m, memory: 1Gi }, limits: { cpu: "2", memory: 2Gi } }
    - name: tracker
      replicas: 2
      resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
    - name: memory
      replicas: 2
      resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
