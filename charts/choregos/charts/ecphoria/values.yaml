image:
  # The frozen namespace, as `compose.yaml` (S80-07d): the memory edition is published there and
  # not yet under graalsystems/ecphoria, where `0.2.5-memory` does not exist and no pod could start.
  # `tests/charts/test_ecphoria_image.py` keeps the chart on the image the local install runs.
  repository: ghcr.io/vargafoundation/ecphoria
  tag: "0.2.5-memory"
persistence:
  enabled: true
  size: 5Gi
  storageClass: ""
# Embedding model, requested from Choregos' gateway (measured cost, no direct egress).
embedding:
  # `none` when the deployment has no gateway: memory keeps the facts, but
  # semantic search falls back to lexical. Better to say so than to let
  # embedding calls fail silently on every write.
  provider: openai_compatible
  model: platform/embed
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: "1", memory: 2Gi }
