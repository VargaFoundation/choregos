[project]
name = "choregos-agent-example-pydantic-ai"
version = "0.19.1"
description = "Example: the ticket triager on Pydantic AI and the choregos-agent-sdk"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
# Not a member of the repository's workspace: the framework stays out of its lock file.
dependencies = [
  "choregos-agent-sdk",
  "pydantic-ai-slim[openai]==2.52.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pydantic_ai_triager"]
