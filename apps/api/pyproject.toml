[project]
name = "choregos-api"
version = "0.1.0"
description = "API Choregos (FastAPI)"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = ["choregos-core", "choregos-adapters", "fastapi>=0.115", "uvicorn[standard]>=0.32", "sqlalchemy[asyncio]>=2.0", "alembic>=1.14", "asyncpg>=0.30", "aiosqlite>=0.20", "pydantic-settings>=2.6", "authlib>=1.3", "itsdangerous>=2.2", "sse-starlette>=2.1", "structlog>=24.4", "PyJWT[crypto]>=2.9", "python-multipart>=0.0.12", "temporalio>=1.8"]

[project.scripts]
choregos-api = "choregos_api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/choregos_api"]
