# Workflow of the SOFTWARE demo: the shortest path that proves something.
#
# Three working states, two agents, no human — a bench must run without anyone waiting
# for it. The platform's default workflow (`default-simple`) has a human review the
# scoping and goes through a PR; here we stop at the pushed branch, because the demo runs
# on a local git and a review would add nothing to the proof.
apiVersion: choregos/v1
kind: Workflow
metadata:
  name: demo-code
  version: 1
  description: Work item → implementation → verification → branch pushed.
actors:
  dev: { type: agent, role: implement, model: "profile:standard", max_turns: 40, max_minutes: 20 }
  checker: { type: agent, role: verify, model: "profile:standard", max_turns: 20, max_minutes: 10 }
  arbitre: { type: human, group: demo, sla_hours: 24 }
  journal: { type: system }
states:
  inbox: { display: To do, kind: wait }
  in_progress: { display: In progress }
  verifying: { display: Verifying }
  done: { display: Done, terminal: true }
  needs_human: { display: Needs a human, kind: wait }
  abandoned: { display: Abandoned, terminal: true }
transitions:
  - id: t-implement
    from: inbox
    to: in_progress
    by: dev
    # No `outputs:`: a branch and commits are ARTIFACTS, which the runner fills in itself.
    # Declaring them here made `outputs_present` fail on every first attempt — the agent
    # has no reason to copy them into its outputs.
    # The guarantees that READ THE DIFF (`scope_respected`, `diff_size_max`, `no_secrets`)
    # are absent here, and deliberately: on this bench the SCM connector is a `fake`, it
    # cannot compare two branches, and since that change a guarantee that cannot be
    # evaluated REFUSES instead of passing vacuously. Declaring them here would fail every
    # step for a good reason, and the demonstration would show nothing any more. On a real
    # repository (GitHub) they come back, which is the whole point.
    # `evidence_present`: the tests ran and they pass. It is the guarantee that makes sense
    # here, and it does not depend on the SCM connector.
    gates: [evidence_present]
    on_fail: { to: inbox, max_attempts: 2, escalate_to: needs_human }
  - id: t-verify
    from: in_progress
    to: verifying
    by: checker
    gates: [evidence_present]
    on_fail: { to: in_progress, max_attempts: 2, escalate_to: needs_human }
  # Carried by the SYSTEM: there is nothing left to think about. Launching a third agent
  # to move a card costs a whole run, and it fails for the sole reason that it was given
  # nothing to produce. The guarantees stay, though: it is the previous step's
  # verification that is re-read here.
  - id: t-done
    from: verifying
    to: done
    by: journal
    gates: [evidence_present]
    on_fail: { to: in_progress, max_attempts: 1, escalate_to: needs_human }
  # Carried by a HUMAN, and that is structural: a transition out of `needs_human` that an
  # agent carries is replayed at once, fails the same way, and the platform relaunches an
  # agent indefinitely. Escalating to a human only makes sense if the way out really waits
  # for someone. On this bench nobody answers: the ticket stays visible under "human
  # intervention", which is exactly what we want to show.
  - id: t-abandon
    from: needs_human
    to: abandoned
    by: arbitre
    timeout_hours: 24
defaults:
  from_any_agent_state:
    on_question: needs_human
    on_budget_exceeded: needs_human
    on_timeout: needs_human
  needs_human:
    on_answer: resume
    on_abandon: abandoned
