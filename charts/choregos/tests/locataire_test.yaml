# Tenant mode: an AppProject that refuses any cluster-scoped object (Diametral:
# `clusterResourceWhitelist: []`) refuses the **whole** sync at the first ClusterRole rendered.
# These tests guard the boundary on both sides: nothing cluster-scoped when it is cut off,
# and the default unchanged for the others.
suite: mode locataire
templates:
  - charts/choregos-api/templates/service.yaml
  - charts/choregos-api/templates/httproute.yaml
  - charts/choregos-api/templates/deployment.yaml
  - charts/choregos-web/templates/deployment.yaml
  - charts/choregos-orchestrator/templates/deployments.yaml
# Offline rendering: the default executor (agent_sandbox, ADR 0072) refuses to render without its
# operator among the cluster's API versions, which a unit test does not have.
set:
  choregos-orchestrator.runner.skipOperatorCheck: true
tests:
  - it: by default (agent_sandbox), the API has no Tekton ClusterRole
    template: charts/choregos-api/templates/service.yaml
    asserts:
      - containsDocument:
          kind: ClusterRole
          apiVersion: rbac.authorization.k8s.io/v1
        not: true

  - it: with Tekton, the API reads PipelineRuns through a ClusterRole
    template: charts/choregos-api/templates/service.yaml
    set:
      global.runner.executor: tekton
    asserts:
      - containsDocument:
          kind: ClusterRole
          apiVersion: rbac.authorization.k8s.io/v1
          any: true
      - containsDocument:
          kind: ClusterRoleBinding
          apiVersion: rbac.authorization.k8s.io/v1
          any: true

  - it: without cluster-scoped rights, neither ClusterRole nor ClusterRoleBinding
    template: charts/choregos-api/templates/service.yaml
    set:
      global.runner.executor: tekton
      global.rbac.clusterScoped: false
    asserts:
      - hasDocuments:
          count: 2
      - containsDocument:
          kind: ClusterRole
          apiVersion: rbac.authorization.k8s.io/v1
        not: true
      - containsDocument:
          kind: ClusterRoleBinding
          apiVersion: rbac.authorization.k8s.io/v1
        not: true

  - it: without Gateway API, the API exits through an Ingress that keeps its three prefixes
    template: charts/choregos-api/templates/httproute.yaml
    set:
      choregos-api.ingress.kind: ingress
      choregos-api.ingress.className: traefik
      choregos-api.ingress.hostnames: ["choregos-api.internal.dev.diametral.com"]
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: spec.ingressClassName
          value: traefik
      - equal:
          path: spec.rules[0].host
          value: choregos-api.internal.dev.diametral.com
      - lengthEqual:
          path: spec.rules[0].http.paths
          count: 5
      # The MCP gateway (ADR 0030) exits through the API: without this path, an MCP client lands on the console.
      - equal:
          path: spec.rules[0].http.paths[1].path
          value: /mcp
      # Its OAuth metadata (RFC 9728) too: claude.ai reads it before connecting.
      - equal:
          path: spec.rules[0].http.paths[4].path
          value: /.well-known/oauth-protected-resource

  - it: without Gateway API, the front end exits through an Ingress
    template: charts/choregos-web/templates/deployment.yaml
    set:
      choregos-web.ingress.kind: ingress
    asserts:
      - containsDocument:
          kind: Ingress
          apiVersion: networking.k8s.io/v1
          any: true
      - containsDocument:
          kind: HTTPRoute
          apiVersion: gateway.networking.k8s.io/v1
        not: true

  - it: with the k8s_job executor, the runners' account exists and mounts no token
    template: charts/choregos-orchestrator/templates/deployments.yaml
    set:
      global.runner.executor: k8s_job
    asserts:
      - containsDocument:
          kind: ServiceAccount
          apiVersion: v1
          name: choregos-runner
          any: true
      - equal:
          path: automountServiceAccountToken
          value: false
        documentSelector:
          path: metadata.name
          value: choregos-runner

  - it: with Tekton, no runner account in the platform namespace
    template: charts/choregos-orchestrator/templates/deployments.yaml
    set:
      global.runner.executor: tekton
    asserts:
      - containsDocument:
          kind: ServiceAccount
          apiVersion: v1
          name: choregos-runner
        not: true

  - it: public URLs can be overridden for an internal HTTP ingress
    template: charts/choregos-api/templates/deployment.yaml
    set:
      global.publicUrl: http://choregos.internal.dev.diametral.com
      global.apiUrl: http://choregos-api.internal.dev.diametral.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHOREGOS_PUBLIC_URL
            value: http://choregos.internal.dev.diametral.com
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHOREGOS_API_URL
            value: http://choregos-api.internal.dev.diametral.com

  - it: the database URL is composed from the Zalando operator's secret
    template: charts/choregos-api/templates/deployment.yaml
    set:
      global.database.passwordSecret: choregos.choregos-pg.credentials.postgresql.acid.zalan.do
      global.database.host: choregos-pg
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHOREGOS_DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: choregos.choregos-pg.credentials.postgresql.acid.zalan.do
                key: password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHOREGOS_DATABASE_URL
            value: postgresql+asyncpg://choregos:$(CHOREGOS_DATABASE_PASSWORD)@choregos-pg:5432/choregos

  - it: embedded dependencies wire themselves up
    template: charts/choregos-api/templates/deployment.yaml
    set:
      global.database.embedded: true
      global.temporal.embedded: true
      global.gateway.embedded: true
      global.memory.embedded: true
      global.database.passwordSecret: ""
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHOREGOS_TEMPORAL_ADDRESS
            value: RELEASE-NAME-temporal:7233
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHOREGOS_GATEWAY_URL
            value: http://RELEASE-NAME-litellm:4000
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHOREGOS_DATABASE_URL
            # the application role without SUPERUSER, created at initdb of the embedded PostgreSQL
            value: postgresql+asyncpg://choregos_app:$(CHOREGOS_DATABASE_PASSWORD)@RELEASE-NAME-postgresql:5432/choregos

  - it: without an embedded dependency, the addresses stay the ones provided
    template: charts/choregos-api/templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHOREGOS_TEMPORAL_ADDRESS
            value: temporal-frontend.choregos-temporal.svc:7233

  - it: the worker receives a complete command, not only arguments
    template: charts/choregos-orchestrator/templates/deployments.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["python", "-m", "choregos_orchestrator.worker"]
      - equal:
          path: spec.template.spec.containers[0].args
          value: ["--queues", "orchestrator"]

  - it: the agents' image follows the deployment's version
    template: charts/choregos-orchestrator/templates/deployments.yaml
    documentIndex: 0
    set:
      global.imageTag: "9.9.9"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHOREGOS_RUNNER_IMAGE
            value: ghcr.io/vargafoundation/choregos-runner:9.9.9

  - it: the agents call back the internal service, never the public URL
    template: charts/choregos-orchestrator/templates/deployments.yaml
    documentIndex: 0
    set:
      global.publicUrl: https://choregos.example.com
      global.apiUrl: https://choregos.example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHOREGOS_INTERNAL_API_URL
            value: http://choregos-api:8000

  - it: the orchestrator receives the key that signs the run tokens
    template: charts/choregos-orchestrator/templates/deployments.yaml
    documentIndex: 0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHOREGOS_RUN_TOKEN_PRIVATE_KEY
            valueFrom:
              secretKeyRef:
                name: choregos-api-secrets
                key: run-token-private-key
