[project]
name = "choregos-cli"
version = "0.27.15"
description = "Deprecated name of tranibor-cli: an empty wheel that depends on it and ships the `choregos_cli` import alias (ADR 0176, R2)"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = ["tranibor-cli==0.27.15", "tranibor-contracts==0.27.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/choregos_cli"]
