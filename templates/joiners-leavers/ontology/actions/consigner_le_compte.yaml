apiVersion: choregos.dev/v1alpha1
kind: ActionType
metadata:
  name: consigner_le_compte
  displayName: Record the account
  description: "Records the account the onboarding workflow created in the directory, and its groups."
spec:
  target: {objectType: collaborateur, cardinality: one}
  parameters:
    upn: {type: string, required: true}
    groupes: {type: "array<string>"}
  preconditions:
    - {name: pas_parti, expr: "target.statut != 'parti'", message: "Nothing is opened in the registry for a person who has left."}
  permissions:
    propose: [agent:coordinateur-onboarding, role:contributor]
    approve: policy:rh
  risk: low
  reversibility: reversible
  effects:
    - type: object.create
      with:
        objectType: account
        id: "${params.upn}"
        properties:
          upn: "${params.upn}"
          matricule: "${target.matricule}"
          actif: true
          groupes: "${has(params.groupes) ? params.groupes : null}"
          ouvert_le: "${now}"
  idempotencyKey: "${params.upn}"
