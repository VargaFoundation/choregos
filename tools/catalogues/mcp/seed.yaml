# The reviewed list behind the MCP catalogue (ADR 0065). Adding a server is a line here, in a pull
# request; `make catalogues` resolves it against the recorded registry and GitHub answers and
# applies `exclusions.yaml`. A line that cannot be resolved is dropped with its reason.
#
# Fields: id, title, publisher, description (English, 300 characters at most), categories,
# auth (none | bearer | oauth | header:<Name>), registry (official MCP Registry name, optional),
# repo (owner/name of the server's own repository, optional), transport (stdio forces the
# package even when a remote exists), package (the registry-style package of a stdio server when the
# registry does not carry it), stars (false when the repository is a monorepo whose stars say
# nothing about the MCP server), reference (a modelcontextprotocol reference server).
# A hosted remote the registry does not list goes in `overrides.yaml`.

