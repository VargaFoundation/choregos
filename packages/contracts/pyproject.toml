[project]
name = "choregos-contracts"
version = "0.3.0"
description = "Contrats Choregos : schémas JSON, OpenAPI, types générés"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = ["pydantic>=2.9", "PyYAML>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/choregos_contracts"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "choregos_contracts/schemas"
"openapi.yaml" = "choregos_contracts/openapi.yaml"
