{{- if and .Values.enabled .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: choregos-api
  labels: {{- include "choregos.labels" . | nindent 4 }}
spec:
  {{- if (.Values.global.canary | default dict).enabled }}
  # Rollouts implements scaling for the HPA: targeting the Deployment here would make it inert.
  scaleTargetRef: { apiVersion: argoproj.io/v1alpha1, kind: Rollout, name: choregos-api }
  {{- else }}
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: choregos-api }
  {{- end }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }} }
{{- end }}
{{- if and .Values.enabled .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: choregos-api
  labels: {{- include "choregos.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: choregos-api
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
