# gitleaks : les règles par défaut, plus ce que ce dépôt contient VOLONTAIREMENT.
#
# Deux faux secrets vivent ici pour être détectés par la plateforme, pas par le scanner :
# le motif AWS que le test de la garantie `no_secrets` doit attraper, et une clé d'exemple
# dans un schéma de contrat. Les mettre en liste blanche par CHEMIN (et non par empreinte
# de commit) : une empreinte saute au premier commit qui retouche le fichier.
title = "choregos"

[extend]
useDefault = true

[allowlist]
description = "faux secrets de test et d'exemple, documentés"
paths = [
  '''packages/core/tests/test_gates\.py''',
  '''packages/contracts/schemas/examples/.*\.json''',
]
# Les historiques Temporal archivés portent l'URL de l'API interne des agents
# (`choregos-api:8000/api/v1/internal`), que la règle « generic-api-key » prend pour une
# clé. Les vrais secrets de ces historiques (clé de passerelle, jeton de run) sont
# caviardés à l'archivage — `tools/replay_record.py` — et c'est la RÈGLE ci-dessous qui le
# garde : un `sk-ant-` ou un JWT dans un historique reste un fuite.
regexTarget = "match"
regexes = [
  '''choregos-api:8000/api/v1/internal''',
  # ADR 0091 (S40-26d) describes the relay's token in prose: "the run-token key, `aud=choregos-relay`".
  # The `generic-api-key` rule reads `key, ` followed by a quoted word as a key. The CI scans every
  # branch (`fetch-depth: 0`), so one such sentence on one branch turned the `secrets` job red on
  # main and on every open pull request (2026-10-27).
  '''run-token key, `aud=choregos-relay`''',
]
