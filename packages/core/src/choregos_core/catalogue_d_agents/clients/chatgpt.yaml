catalogue:
  version: 1
  role: external
  client: chatgpt
  # `always` : il appelle depuis le poste de la personne ; `cloud` : depuis le cloud de son éditeur —
  # il ne se propose que si la porte MCP accepte l'OAuth, qu'un client est enregistré, et que l'adresse est en https.
  reach: cloud
  summary: ChatGPT acting through the MCP door, with its person's rights intersected with this agent's.
agent:
  slug: chatgpt
  kind: external
  display_name: ChatGPT
  description: ChatGPT, connected to Choregos through the MCP door. It acts with its person's rights, never more, and never decides.
  # Une version vide : les droits de sa personne, jamais plus (ADR 0033). `connect` avec
  # `read_only` publie à la place la lecture seule (`list_*`, `describe_*`, `search_*`, `get_*`, `summarize_*`).
  spec: {}
