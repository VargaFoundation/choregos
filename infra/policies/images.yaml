# The platform's and the runners' images are signed by the foundation and referenced by
# digest. An unsigned image does not start — it is a mechanism, not a guideline.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: choregos-verify-images
  annotations:
    policies.kyverno.io/description: >-
      Verifies the cosign signature of the Choregos images and requires the reference by digest.
spec:
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-signature
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["choregos", "choregos-*", "proj-*"]
      verifyImages:
        - imageReferences: ["ghcr.io/vargafoundation/choregos-*"]
          attestors:
            - entries:
                - keyless:
                    subject: "https://github.com/VargaFoundation/choregos/.github/workflows/*"
                    issuer: "https://token.actions.githubusercontent.com"
                    # Kyverno 1.12 refuses a keyless attestor that names no transparency log.
                    rekor: { url: "https://rekor.sigstore.dev" }
          mutateDigest: true
          required: true
        # Ecphoria belongs to the foundation but not to this repository: its images are signed by
        # the workflows of `VargaFoundation/ecphoria`. With the pattern above alone, the glob
        # `ghcr.io/vargafoundation/*` caught `ghcr.io/vargafoundation/ecphoria` and demanded a
        # signature issued by a repository that never produced it — the platform's memory would
        # not have started, and the message would have talked about a missing signature.
        - imageReferences: ["ghcr.io/vargafoundation/ecphoria*"]
          attestors:
            - entries:
                - keyless:
                    subject: "https://github.com/VargaFoundation/ecphoria/.github/workflows/*"
                    issuer: "https://token.actions.githubusercontent.com"
                    # Kyverno 1.12 refuses a keyless attestor that names no transparency log.
                    rekor: { url: "https://rekor.sigstore.dev" }
          mutateDigest: true
          required: true
